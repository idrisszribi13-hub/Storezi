<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZI FOOT - Live Matches & Stream</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --live-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 2px solid var(--border-color);
        }

        .site-title {
            font-size: 48px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .match-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .live-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--live-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .match-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg-color);
            padding: 8px;
            margin-bottom: 10px;
            object-fit: contain;
        }

        .team-name {
            font-size: 16px;
            font-weight: 600;
        }

        .score {
            font-size: 42px;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid var(--border-color);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--live-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 10;
        }

        /* Video Player */
        .video-container {
            margin: 20px 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .video-placeholder {
            width: 100%;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            color: #666;
            font-size: 18px;
        }

        video {
            width: 100%;
            height: 400px;
            object-fit: contain;
        }

        .stream-sources {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .stream-btn {
            padding: 8px 16px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .stream-btn:hover {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: white;
        }

        .stream-btn.active {
            background: var(--accent-color);
            color: white;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 8px;
        }

        .tab-btn:hover {
            color: var(--text-color);
            background: var(--bg-color);
        }

        .tab-btn.active {
            color: var(--accent-color);
            background: var(--bg-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="site-title">⚽ ZI FOOT</h1>
            <p style="color: var(--text-secondary); margin-top: 10px;">Live Matches, Stats & Stream</p>
        </div>

        <div class="matches-grid" id="matchesContainer">
            <div style="text-align: center; padding: 50px; color: var(--text-secondary);">
                Loading matches...
            </div>
        </div>
    </div>

    <!-- Match Details Modal -->
    <div class="modal" id="matchModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ===================== CONFIGURATION =====================
        const SUPABASE_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1uSIqgNONAV53GjOoBoZUw_niAGJXO6';
        
        // ===================== DEMO STREAM SOURCES =====================
        // هذه روابط تجريبية - استبدلها بمصادرك الخاصة
        const DEMO_STREAMS = {
            // يمكنك إضافة روابط m3u8 هنا
            'HD Stream 1': 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
            'HD Stream 2': 'https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8',
            'SD Stream': 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8'
        };

        let currentFixtureId = null;
        let currentTab = 'stream';

        // ===================== API CALL =====================
        async function callAPI(endpoint, params = {}) {
            const queryString = Object.keys(params)
                .map(key => `${key}=${encodeURIComponent(params[key])}`)
                .join('&');
            
            const url = `${API_BASE_URL}/${endpoint}${queryString ? '?' + queryString : ''}`;
            
            const response = await fetch(url, {
                headers: {
                    'x-apisports-key': API_KEY,
                    'Content-Type': 'application/json'
                }
            });
            
            return await response.json();
        }

        // ===================== FETCH MATCHES =====================
        async function fetchLiveMatches() {
            const container = document.getElementById('matchesContainer');
            
            try {
                const data = await callAPI('fixtures', { live: 'all' });
                
                const matches = data.response;
                
                if (!matches || matches.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--text-secondary);">No live matches at the moment</div>';
                    return;
                }
                
                let html = '';
                matches.forEach(item => {
                    const fixture = item.fixture;
                    const teams = item.teams;
                    const goals = item.goals;
                    const league = item.league;
                    const minute = fixture.status.elapsed ? `${fixture.status.elapsed}'` : 'LIVE';
                    
                    html += `
                        <div class="match-card" onclick="showMatchDetails(${fixture.id})">
                            <div class="live-indicator">🔴 ${minute}</div>
                            <div style="text-align: center; margin-bottom: 15px;">
                                <span style="color: var(--text-secondary); font-size: 14px;">${league.name} - ${league.round || ''}</span>
                            </div>
                            <div class="match-body">
                                <div class="team">
                                    <img class="team-logo" src="${teams.home.logo}" alt="${teams.home.name}">
                                    <div class="team-name">${teams.home.name}</div>
                                </div>
                                <div class="score">${goals.home ?? 0} : ${goals.away ?? 0}</div>
                                <div class="team">
                                    <img class="team-logo" src="${teams.away.logo}" alt="${teams.away.name}">
                                    <div class="team-name">${teams.away.name}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div style="text-align: center; padding: 50px; color: #ef4444;">Connection failed: ${error.message}</div>`;
            }
        }

        // ===================== SHOW MATCH DETAILS =====================
        async function showMatchDetails(fixtureId) {
            currentFixtureId = fixtureId;
            const modal = document.getElementById('matchModal');
            const modalBody = document.getElementById('modalBody');
            
            modal.style.display = 'flex';
            modalBody.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--text-secondary);">Loading...</div>';
            
            try {
                // Fetch match details
                const data = await callAPI('fixtures', { id: fixtureId });
                
                if (!data.response || data.response.length === 0) {
                    modalBody.innerHTML = '<div style="text-align: center; padding: 50px; color: #ef4444;">No details available</div>';
                    return;
                }
                
                const match = data.response[0];
                const teams = match.teams;
                const goals = match.goals;
                const events = match.events || [];
                
                // Build stream player
                const streamHTML = buildStreamPlayer();
                
                // Build stats
                const statsHTML = buildStats(match);
                
                // Build events
                const eventsHTML = buildEvents(events, teams);
                
                modalBody.innerHTML = `
                    <div style="text-align: center; margin-bottom: 20px;">
                        <h2 style="color: var(--accent-color);">${match.league.name}</h2>
                        <p style="color: var(--text-secondary);">${match.league.round || ''}</p>
                    </div>
                    
                    <div class="match-body" style="margin-bottom: 20px;">
                        <div class="team">
                            <img class="team-logo" src="${teams.home.logo}" alt="${teams.home.name}">
                            <div class="team-name">${teams.home.name}</div>
                        </div>
                        <div class="score">${goals.home ?? 0} : ${goals.away ?? 0}</div>
                        <div class="team">
                            <img class="team-logo" src="${teams.away.logo}" alt="${teams.away.name}">
                            <div class="team-name">${teams.away.name}</div>
                        </div>
                    </div>
                    
                    <div class="tabs">
                        <button class="tab-btn active" onclick="switchTab('stream')">📺 Stream</button>
                        <button class="tab-btn" onclick="switchTab('stats')">📊 Stats</button>
                        <button class="tab-btn" onclick="switchTab('events')">⚽ Events</button>
                    </div>
                    
                    <div class="tab-content active" id="tab-stream">
                        ${streamHTML}
                    </div>
                    <div class="tab-content" id="tab-stats">
                        ${statsHTML}
                    </div>
                    <div class="tab-content" id="tab-events">
                        ${eventsHTML}
                    </div>
                `;
            } catch (error) {
                modalBody.innerHTML = `<div style="text-align: center; padding: 50px; color: #ef4444;">Failed to load: ${error.message}</div>`;
            }
        }

        // ===================== BUILD STREAM PLAYER =====================
        function buildStreamPlayer() {
            const streamButtons = Object.keys(DEMO_STREAMS).map((name, index) => {
                return `<button class="stream-btn ${index === 0 ? 'active' : ''}" onclick="switchStream('${name}')">${name}</button>`;
            }).join('');
            
            return `
                <div class="video-container">
                    <video id="videoPlayer" controls autoplay>
                        <source src="${DEMO_STREAMS['HD Stream 1']}" type="application/x-mpegURL">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="stream-sources">
                    ${streamButtons}
                </div>
                <p style="color: var(--text-secondary); font-size: 12px; text-align: center; margin-top: 10px;">
                    ⚠️ Demo streams only - Add your own m3u8 sources
                </p>
            `;
        }

        // ===================== SWITCH STREAM =====================
        function switchStream(streamName) {
            const video = document.getElementById('videoPlayer');
            if (video && DEMO_STREAMS[streamName]) {
                video.src = DEMO_STREAMS[streamName];
                video.play();
                
                // Update active button
                document.querySelectorAll('.stream-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.classList.add('active');
            }
        }

        // ===================== SWITCH TAB =====================
        function switchTab(tabName) {
            currentTab = tabName;
            
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            const selectedTab = document.getElementById(`tab-${tabName}`);
            if (selectedTab) {
                selectedTab.classList.add('active');
            }
            
            // Update buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // ===================== BUILD STATS =====================
        function buildStats(match) {
            const statistics = match.statistics || [];
            let html = '<h3 style="color: var(--accent-color); margin-bottom: 20px;">📊 Match Statistics</h3>';
            
            if (statistics.length < 2) {
                return html + '<p style="color: var(--text-secondary);">No statistics available</p>';
            }
            
            const homeStats = statistics[0].statistics || [];
            const awayStats = statistics[1].statistics || [];
            
            const statsToShow = [
                'Ball Possession', 'Total Shots', 'Shots on Goal', 
                'Corner Kicks', 'Yellow Cards', 'Red Cards', 'Fouls'
            ];
            
            statsToShow.forEach(statName => {
                const homeStat = homeStats.find(s => s.type === statName);
                const awayStat = awayStats.find(s => s.type === statName);
                
                if (homeStat || awayStat) {
                    html += `
                        <div style="background: var(--bg-color); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border-color);">
                            <div style="text-align: center; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">${statName}</div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 20px; font-weight: 700; color: var(--accent-color);">${homeStat?.value || 0}</span>
                                <span style="color: var(--text-secondary);">vs</span>
                                <span style="font-size: 20px; font-weight: 700; color: var(--accent-color);">${awayStat?.value || 0}</span>
                            </div>
                        </div>
                    `;
                }
            });
            
            return html;
        }

        // ===================== BUILD EVENTS =====================
        function buildEvents(events, teams) {
            let html = '<h3 style="color: var(--accent-color); margin-bottom: 20px;">⚽ Match Events</h3>';
            
            if (!events || events.length === 0) {
                return html + '<p style="color: var(--text-secondary);">No events yet</p>';
            }
            
            const goalEvents = events.filter(e => e.type === 'Goal');
            const cardEvents = events.filter(e => e.type === 'Card');
            
            if (goalEvents.length > 0) {
                html += '<h4 style="color: var(--text-color); margin-bottom: 10px;">Goals</h4>';
                goalEvents.forEach(event => {
                    const teamName = event.team.id === teams.home.id ? teams.home.name : teams.away.name;
                    html += `
                        <div style="background: var(--bg-color); padding: 10px; border-radius: 8px; margin-bottom: 5px; border: 1px solid var(--border-color);">
                            <span style="font-weight: 700;">${event.time.elapsed}'</span> - 
                            ${event.player.name} (${teamName}) - ${event.detail}
                        </div>
                    `;
                });
            }
            
            if (cardEvents.length > 0) {
                html += '<h4 style="color: var(--text-color); margin: 20px 0 10px;">Cards</h4>';
                cardEvents.forEach(event => {
                    const teamName = event.team.id === teams.home.id ? teams.home.name : teams.away.name;
                    const cardIcon = event.detail === 'Yellow Card' ? '🟨' : '🟥';
                    html += `
                        <div style="background: var(--bg-color); padding: 10px; border-radius: 8px; margin-bottom: 5px; border: 1px solid var(--border-color);">
                            <span style="font-weight: 700;">${event.time.elapsed}'</span> - 
                            ${cardIcon} ${event.player.name} (${teamName})
                        </div>
                    `;
                });
            }
            
            return html;
        }

        // ===================== CLOSE MODAL =====================
        function closeModal() {
            document.getElementById('matchModal').style.display = 'none';
            
            // Stop video
            const video = document.getElementById('videoPlayer');
            if (video) {
                video.pause();
                video.src = '';
            }
        }

        // Close modal on outside click
        document.getElementById('matchModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ===================== START =====================
        fetchLiveMatches();
        setInterval(fetchLiveMatches, 60000);
    </script>
</body>
</html>
