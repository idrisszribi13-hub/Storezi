<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 تجربة Widgets - متقدمة</title>
    <script type="module" src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #f0f6fc;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .sub-title {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 30px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 15px;
        }
        .section {
            background: #161b22;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #30363d;
        }
        .section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .badge {
            font-size: 12px;
            background: #58a6ff;
            color: #0d1117;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            margin-left: 10px;
        }
        @media (max-width: 700px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        api-sports-widget {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 تجربة Widgets - متقدمة</h1>
        <div class="sub-title">
            API-Sports Widgets · مفتاح: <code>e227ff90ed4eacc3eacb07eca05ce78b</code>
        </div>

        <!-- ===== التهيئة ===== -->
        <api-sports-widget
            data-type="config"
            data-key="e227ff90ed4eacc3eacb07eca05ce78b"
            data-sport="football"
            data-lang="en"
            data-theme="dark"
            data-show-logos="true"
            data-favorite="true"
            data-target-game="modal"
            data-game-tab="statistics"
            data-target-standings="modal"
            data-target-team="modal"
        ></api-sports-widget>

        <!-- ===== 1. المباريات المباشرة (الدوري الإنجليزي فقط) ===== -->
        <div class="section">
            <h2>🔴 الدوري الإنجليزي - المباريات المباشرة <span class="badge">Live</span></h2>
            <api-sports-widget
                data-type="games"
                data-league="39"
                data-tab="live"
                data-refresh="30"
                data-show-toolbar="true"
                data-games-style="2"
            ></api-sports-widget>
        </div>

        <!-- ===== 2. قائمة الدوريات ===== -->
        <div class="section">
            <h2>🌍 جميع الدوريات <span class="badge" style="background:#d29922;">Leagues</span></h2>
            <api-sports-widget
                data-type="leagues"
                data-target-league="modal"
            ></api-sports-widget>
            <p style="color:#8b949e;font-size:13px;margin-top:10px;">👆 اضغط على أي دوري لفتح مبارياته</p>
        </div>

        <!-- ===== 3. مقارنة فريقين (H2H) ===== -->
        <div class="grid-2">
            <div class="section">
                <h2>⚔️ مانشستر سيتي vs مانشستر يونايتد <span class="badge" style="background:#1f6feb;">H2H</span></h2>
                <api-sports-widget
                    data-type="h2h"
                    data-h2h="33-34"
                    data-target-game="modal"
                ></api-sports-widget>
            </div>
            <div class="section">
                <h2>⚔️ ريال مدريد vs برشلونة <span class="badge" style="background:#1f6feb;">H2H</span></h2>
                <api-sports-widget
                    data-type="h2h"
                    data-h2h="8633-8634"
                    data-target-game="modal"
                ></api-sports-widget>
            </div>
        </div>

        <!-- ===== 4. ملف فريق (ريال مدريد) ===== -->
        <div class="section">
            <h2>🏟️ ملف ريال مدريد <span class="badge" style="background:#da3633;">Team</span></h2>
            <api-sports-widget
                data-type="team"
                data-team-id="8633"
                data-team-statistics="true"
                data-team-squad="true"
                data-team-tab="squads"
            ></api-sports-widget>
        </div>

    </div>
</body>
</html>
