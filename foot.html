<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetHub — مراهنات رياضية مباشرة</title>

<!-- تحميل Embeder الرسمي من STATSCORE -->
<script type="module"
  src="https://wgt-s3-cdn.statscore.com/bundle/EmbederESM.js"></script>

<style>
:root{
  --bg:#0a0a12; --bg2:#12121e; --card:#17172a;
  --primary:#6D00FF; --accent:#00FFA5;
  --text:#fff; --muted:#8b8ba7; --border:#26263a;
  --win:#3AC92A; --danger:#ff3b5c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Space Grotesk','Segoe UI',Tahoma,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
}
a{color:var(--accent);text-decoration:none}

/* ===== Topbar ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;background:var(--bg2);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;
}
.logo{font-weight:700;font-size:22px;color:var(--accent);letter-spacing:.5px}
.logo span{color:var(--text)}
.nav{display:flex;gap:22px;color:var(--muted);font-size:14px}
.nav a:hover{color:var(--accent)}
.balance{
  background:linear-gradient(135deg,var(--primary),#3b0090);
  padding:8px 16px;border-radius:10px;font-size:14px;font-weight:600;
}
.balance b{color:var(--accent);margin-inline-start:6px}

/* ===== Layout ===== */
.layout{
  display:grid;grid-template-columns:1fr 340px;
  gap:20px;max-width:1400px;margin:22px auto;padding:0 18px;
}
@media(max-width:960px){.layout{grid-template-columns:1fr}}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;margin-bottom:18px;overflow:hidden;
}
.card-head{
  padding:12px 18px;background:var(--bg2);
  border-bottom:1px solid var(--border);
  font-weight:600;font-size:15px;color:var(--accent);
  display:flex;justify-content:space-between;align-items:center;
}
.card-body{padding:16px 18px}

/* ===== Event info ===== */
.event-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.event-grid div{background:var(--bg2);padding:10px 14px;border-radius:8px;font-size:13px}
.event-grid b{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;font-weight:500}
.status-pill{
  display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
  background:rgba(0,255,165,.15);color:var(--accent);
}

/* ===== STATSCORE widget ===== */
#statscore-widget{min-height:180px;display:flex;align-items:center;justify-content:center;color:var(--muted)}

/* ===== Odds ===== */
.event-block{margin-bottom:22px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.event-title{
  padding:10px 14px;background:var(--bg2);font-weight:600;font-size:14px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.badge{background:var(--primary);color:#fff;padding:2px 8px;border-radius:6px;font-size:11px}
.muted{color:var(--muted);font-size:12px;font-weight:400}
.market{padding:10px 14px;border-top:1px solid var(--border)}
.market-name{font-size:12px;color:var(--muted);margin-bottom:8px}
.outcomes{display:flex;flex-wrap:wrap;gap:8px}
.odd{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  min-width:120px;background:var(--bg2);border:1px solid var(--border);
  color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;
  font-family:inherit;font-size:13px;transition:.15s;
}
.odd:hover{border-color:var(--accent);background:#1e1e35}
.odd.selected{background:var(--primary);border-color:var(--accent);color:#fff}
.odd-value{font-weight:700;color:var(--accent)}
.odd.selected .odd-value{color:#fff}

/* ===== Bet slip ===== */
.betslip{position:sticky;top:78px}
.slip-item{
  display:flex;justify-content:space-between;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.slip-item .pick{font-weight:600}
.slip-item .meta{color:var(--muted);font-size:11px;margin-top:2px}
.slip-item .rm{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}
.slip-total{padding-top:14px;display:flex;flex-direction:column;gap:10px}
.slip-total label{font-size:12px;color:var(--muted)}
.slip-total input{
  background:var(--bg2);border:1px solid var(--border);color:var(--text);
  padding:10px;border-radius:8px;font-family:inherit;font-size:14px;width:100%;
}
.row{display:flex;justify-content:space-between;font-size:13px}
.row b{color:var(--accent)}
#placeBet{
  width:100%;padding:12px;background:var(--primary);color:#fff;border:none;
  border-radius:10px;font-family:inherit;font-weight:700;font-size:15px;
  cursor:pointer;transition:.15s;
}
#placeBet:hover:not(:disabled){background:#5500cc}
#placeBet:disabled{opacity:.4;cursor:not-allowed}
.error{color:var(--danger);font-size:12px}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">⚡ Bet<span>Hub</span></div>
  <nav class="nav">
    <a href="#">المباريات</a>
    <a href="#">المباشر</a>
    <a href="#">الأسعار</a>
    <a href="#">حسابي</a>
  </nav>
  <div class="balance">الرصيد <b id="balance">1000.00</b> $</div>
</header>

<div class="layout">

  <main>
    <!-- معلومات الحدث -->
    <section class="card">
      <div class="card-head">
        <span>معلومات المباراة</span>
        <span class="muted">Event ID: 6558888</span>
      </div>
      <div class="card-body">
        <div id="eventInfo" class="event-grid">
          <div><b>الحالة</b>جاري التحميل…</div>
        </div>
      </div>
    </section>

    <!-- Widget STATSCORE -->
    <section class="card">
      <div class="card-head">
        <span>البث والإحصائيات (STATSCORE)</span>
        <span class="muted">WidgetGroup: 6703c22c…</span>
      </div>
      <div class="card-body">
        <div id="statscore-widget">جاري تحميل الودجت…</div>
      </div>
    </section>

    <!-- الأسعار -->
    <section class="card">
      <div class="card-head">
        <span>الأسعار (Prematch Odds)</span>
        <span id="oddsSource" class="muted">—</span>
      </div>
      <div class="card-body">
        <div id="odds"><div class="empty">جاري التحميل…</div></div>
      </div>
    </section>
  </main>

  <aside>
    <div class="card betslip">
      <div class="card-head">
        <span>سلة المراهنات</span>
        <span id="slipCount" class="muted">0</span>
      </div>
      <div class="card-body">
        <div id="slipItems"><div class="empty">لم تختر أي سعر بعد</div></div>
        <div class="slip-total">
          <label>المبلغ ($)</label>
          <input type="number" id="stake" value="10" min="1" step="1">
          <div class="row"><span>الاحتمالات الكلية</span><b id="totalOdds">—</b></div>
          <div class="row"><span>الربح المحتمل</span><b id="potentialWin">—</b></div>
          <button id="placeBet" disabled>ضع الرهان</button>
          <div id="betMsg"></div>
        </div>
      </div>
    </div>
  </aside>

</div>

<script>
/* =========================================================
   1) ثوابت
   ========================================================= */
const GROUP_ID   = '6703c22cf6a90cb01057c0bf';
const EVENT_ID   = '6558888';
const INFO_URL   = `https://widgets.statscore.com/api/widgets/en/events/${EVENT_ID}/info?groupId=${GROUP_ID}`;

// استبدل هذه القيم ببيانات حسابك
const BRAND_ID   = '2338776503287943168';
const LANG       = 'fr';
const ODDS_ID    = '3578496299474';
const ODDS_URL   = `https://api-a-c7818b61-600.sptpub.com/api/v4/prematch/brand/${BRAND_ID}/${LANG}/${ODDS_ID}`;

/* =========================================================
   2) أدوات مساعدة
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function waitForStatscore(timeout = 12000) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    (function poll() {
      if (window.STATSCOREWidgets && window.STATSCOREWidgets.WidgetGroup) {
        resolve(window.STATSCOREWidgets);
      } else if (Date.now() - start > timeout) {
        reject(new Error('STATSCORE لم يُحمّل خلال الوقت المحدد'));
      } else {
        setTimeout(poll, 100);
      }
    })();
  });
}

/* =========================================================
   3) معلومات الحدث
   ========================================================= */
async function loadEventInfo() {
  const box = $('#eventInfo');
  try {
    const res = await fetch(INFO_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    const start = new Date(d.startTimestamp * 1000);
    const now   = new Date(d.currentTimestamp * 1000);
    box.innerHTML = `
      <div><b>رقم الحدث</b>${d.eventId}</div>
      <div><b>الحالة</b><span class="status-pill">${d.statusType}</span></div>
      <div><b>مستوى الإحصائيات</b>${d.statsLvl}</div>
      <div><b>وقت البداية</b>${start.toLocaleString('ar')}</div>
      <div><b>الوقت الحالي</b>${now.toLocaleString('ar')}</div>
      <div><b>FT فقط</b>${d.isFtOnly ? 'نعم' : 'لا'}</div>
      <div><b>أساسي</b>${d.isBasic ? 'نعم' : 'لا'}</div>
    `;
  } catch (e) {
    box.innerHTML = `<div class="error">تعذر جلب معلومات الحدث: ${e.message}</div>`;
  }
}

/* =========================================================
   4) تحميل Widget STATSCORE
   ========================================================= */
async function loadStatscoreWidget() {
  const el = $('#statscore-widget');
  try {
    const SW = await waitForStatscore();
    el.innerHTML = ''; // أزل رسالة "جاري التحميل"
    new SW.WidgetGroup(
      el,
      GROUP_ID,
      { eventId: EVENT_ID, language: 'en' },
      {
        autoMount: true,
        loader: { enabled: true, size: 60, color1: '#00ffa5', color2: '#6d00ff' }
      }
    );
    console.log('✅ تم تحميل STATSCORE WidgetGroup');
  } catch (e) {
    el.innerHTML = `<div class="error">فشل تحميل الودجت: ${e.message}</div>`;
  }
}

/* =========================================================
   5) الأسعار
   ========================================================= */
const MARKET_NAMES = {
  1:   'نتيجة المباراة (1X2)',
  16:  'الهانديكاب',
  18:  'إجمالي الأهداف',
  19:  'إجمالي الأهداف',
  20:  'إجمالي الأهداف',
  29:  'نتيجة المباراة',
  33:  'الفائز بالجولة',
  45:  'طريقة الفوز',
  53:  'الفائز بالنقاط',
  68:  'إجمالي الجولات',
  186: 'الفائز (Moneyline)',
  235: 'الأرباع',
  236: 'الأرباع',
  256: 'الهانديكاب',
  258: 'إجمالي النقاط',
  287: 'الفائز بالأشواط'
};

const OUTCOME_LABELS = {
  '1':  'الأول',
  '2':  'تعادل',
  '3':  'الثاني',
  '4':  'لاعب 1',
  '5':  'لاعب 2',
  '12': 'أقل',
  '13': 'أكثر',
  '74': 'الأول',
  '76': 'الثاني',
  '78': 'فريق 1 (1X2)',
  '80': 'فريق 2 (1X2)'
};

function outcomeLabel(id) {
  if (OUTCOME_LABELS[id]) return OUTCOME_LABELS[id];
  if (id.includes(':')) return id.split(':').slice(-2).join(':');
  return 'خيار ' + id;
}

function renderOdds(data) {
  const events = data.events || {};
  let html = '';
  let count = 0;

  for (const [evId, ev] of Object.entries(events)) {
    if (!ev || !ev.markets) continue;
    const desc = ev.desc;
    const title = desc?.competitors?.length
      ? desc.competitors.map(c => c.name).join('  vs  ')
      : `حدث ${evId}`;

    html += `<div class="event-block">`;
    html += `<div class="event-title">`;
    html += `<span>${title}`;
    if (desc?.virtual) html += ` <span class="badge">افتراضي</span>`;
    html += `</span>`;
    if (desc?.scheduled) {
      html += `<span class="muted">${new Date(desc.scheduled * 1000).toLocaleString('ar')}</span>`;
    }
    html += `</div>`;

    for (const [mktId, mkt] of Object.entries(ev.markets)) {
      const mname = MARKET_NAMES[mktId] || `سوق ${mktId}`;
      html += `<div class="market"><div class="market-name">${mname}</div><div class="outcomes">`;

      for (const [spec, outcomes] of Object.entries(mkt)) {
        if (!outcomes || typeof outcomes !== 'object') continue;
        for (const [outId, o] of Object.entries(outcomes)) {
          if (!o?.k) continue;
          const label = outcomeLabel(outId) + (spec ? ` · ${spec}` : '');
          const safe = s => String(s).replace(/"/g, '&quot;');
          html += `<button class="odd"
            data-ev="${safe(evId)}"
            data-mkt="${safe(mktId)}"
            data-spec="${safe(spec)}"
            data-out="${safe(outId)}"
            data-odds="${safe(o.k)}"
            data-title="${safe(title)}"
            data-market="${safe(mname)}"
            data-pick="${safe(label)}">
            <span class="odd-label">${label}</span>
            <span class="odd-value">${o.k}</span>
          </button>`;
          count++;
        }
      }
      html += `</div></div>`;
    }
    html += `</div>`;
  }

  return { html, count };
}

async function loadOdds() {
  const box = $('#odds');
  const src = $('#oddsSource');
  try {
    const res = await fetch(ODDS_URL, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const { html, count } = renderOdds(data);
    box.innerHTML = html || '<div class="empty">لا توجد أسعار متاحة</div>';
    src.textContent = `مباشر · ${count} سعر`;
  } catch (e) {
    console.warn('فشل جلب الأسعار الحية:', e);
    const { html } = renderOdds(FALLBACK_ODDS);
    box.innerHTML = html;
    src.innerHTML = `<span class="error">بيانات تجريبية (${e.message})</span>`;
  }
  bindOdds();
}

/* بيانات احتياطية لو فشل CORS */
const FALLBACK_ODDS = {
  events: {
    '2710667149692772359': {
      desc: {
        scheduled: Math.floor(Date.now() / 1000) + 3600,
        type: 'match',
        virtual: true,
        competitors: [
          { name: 'Ferguson, Tony ⁽ᵉ⁾' },
          { name: 'St-Pierre, Georges ⁽ᵉ⁾' }
        ]
      },
      markets: {
        '186': { '': { '5': { k: '1.57' }, '4': { k: '2.36' } } },
        '18':  { 'total=2.5': { '12': { k: '1.39' }, '13': { k: '2.98' } } }
      }
    }
  }
};

/* =========================================================
   6) سلة المراهنات
   ========================================================= */
const slip = new Map();

function selKey(s) { return `${s.ev}|${s.mkt}|${s.spec}|${s.out}`; }

function bindOdds() {
  $$('.odd').forEach(btn => {
    btn.addEventListener('click', () => {
      const sel = {
        ev:     btn.dataset.ev,
        mkt:    btn.dataset.mkt,
        spec:   btn.dataset.spec,
        out:    btn.dataset.out,
        odds:   btn.dataset.odds,
        title:  btn.dataset.title,
        market: btn.dataset.market,
        pick:   btn.dataset.pick
      };
      const k = selKey(sel);
      if (slip.has(k)) slip.delete(k); else slip.set(k, sel);
      renderSlip();
      paintOdds();
    });
  });
}

function paintOdds() {
  $$('.odd').forEach(btn => {
    const k = `${btn.dataset.ev}|${btn.dataset.mkt}|${btn.dataset.spec}|${btn.dataset.out}`;
    btn.classList.toggle('selected', slip.has(k));
  });
}

function renderSlip() {
  const box = $('#slipItems');
  $('#slipCount').textContent = slip.size;

  if (!slip.size) {
    box.innerHTML = '<div class="empty">لم تختر أي سعر بعد</div>';
    updateTotals();
    return;
  }

  let html = '';
  for (const [k, s] of slip) {
    html += `
      <div class="slip-item">
        <div>
          <div class="pick">${s.pick} @ ${s.odds}</div>
          <div class="meta">${s.market} — ${s.title}</div>
        </div>
        <button class="rm" data-k="${k}" title="حذف">✕</button>
      </div>`;
  }
  box.innerHTML = html;

  $$('.rm', box).forEach(b => b.addEventListener('click', () => {
    slip.delete(b.dataset.k);
    renderSlip();
    paintOdds();
  }));

  updateTotals();
}

function totalOdds() {
  let t = 1;
  for (const s of slip.values()) t *= parseFloat(s.odds);
  return t;
}

function updateTotals() {
  const stake = parseFloat($('#stake').value) || 0;
  const tot   = totalOdds();
  $('#totalOdds').textContent   = slip.size ? tot.toFixed(2) : '—';
  $('#potentialWin').textContent = slip.size ? (stake * tot).toFixed(2) + ' $' : '—';
  $('#placeBet').disabled = slip.size === 0 || stake <= 0;
}

/* =========================================================
   7) وضع الرهان (محاكاة)
   ========================================================= */
$('#stake').addEventListener('input', updateTotals);

$('#placeBet').addEventListener('click', () => {
  const stake = parseFloat($('#stake').value);
  const bal   = parseFloat($('#balance').textContent.replace(/,/g, ''));
  const msg   = $('#betMsg');

  if (stake > bal) {
    msg.innerHTML = '<div class="error">الرصيد غير كافٍ</div>';
    return;
  }

  const tot = totalOdds();
  const win = (stake * tot).toFixed(2);
  $('#balance').textContent = (bal - stake).toFixed(2);

  msg.innerHTML = `<div style="color:var(--accent);font-size:12px">
    ✅ تم وضع الرهان (${slip.size} اختيار) · ربح محتمل ${win} $
  </div>`;

  slip.clear();
  renderSlip();
  paintOdds();

  setTimeout(() => { msg.innerHTML = ''; }, 4000);
});

/* =========================================================
   8) التشغيل
   ========================================================= */
(async function main() {
  await loadEventInfo();
  loadStatscoreWidget();  // لا ننتظرها — قد تتأخر
  await loadOdds();
  updateTotals();
})();
</script>
</body>
</html>
