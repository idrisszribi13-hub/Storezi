<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zi Store - Sports Hub</title>
    <script type="importmap">
        {
            "imports": {
                "./js/": "./js/"
            }
        }
    </script>
    <script type="module" src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="zs-app">
        <!-- HEADER -->
        <header class="zs-header" id="mainHeader">
            <div class="zs-header-brand">
                <div class="zs-brand-icon">Z</div>
                <span>Zi Store</span>
            </div>
            <nav class="zs-nav-buttons" id="mainNav">
                <button class="zs-nav-btn active" data-tab="home">🏠 Home</button>
                <button class="zs-nav-btn" data-tab="movies">🎬 Movies</button>
                <button class="zs-nav-btn" data-tab="series">📺 Series</button>
                <button class="zs-nav-btn" data-tab="reels">🎞️ Reels</button>
            </nav>
            <div class="zs-header-actions">
                <div class="zs-header-search">
                    <input type="text" id="globalSearchInput" placeholder="ابحث عن فيلم أو مسلسل...">
                    <button id="globalSearchBtn">🔍</button>
                </div>
            </div>
        </header>

        <main class="zs-main">
            <!-- PLAYER SECTION -->
            <section class="zs-player-section" id="zsPlayerSection">
                <div class="zs-player-wrapper" id="zsPlayerWrapper">
                    <div class="zs-video-container" id="zsVideoContainer">
                        <video id="zsVideo" playsinline></video>
                        <div class="zs-live-badge" id="zsLiveBadge"><span>🔴</span> LIVE</div>
                        <div class="zs-loading" id="zsLoading"><div class="zs-spinner"></div></div>
                        <div class="zs-error-overlay" id="zsErrorOverlay">
                            <div style="text-align:center;line-height:1.8;">⚠️ Unable to play stream.<br><span style="font-size:12px;color:#bbb;">If you're on mobile, try opening this site in <b>Firefox browser</b>.</span></div>
                            <button id="zsErrorRetry" class="zs-btn">Retry</button>
                        </div>
                        <div class="zs-start-overlay" id="zsStartOverlay">
                            <button class="zs-start-play-btn" id="zsStartPlayBtn">▶</button>
                            <div style="color:var(--text-secondary); font-size:13px;">Select a match, movie or series</div>
                        </div>
                        <!-- Camel Overlay -->
                        <div id="camelOverlay">
                            <!-- محتوى Camel Overlay (سيتم إدارته من player.js) -->
                        </div>
                    </div>
                    <div class="zs-controls" id="zsControls">
                        <!-- عناصر التحكم بالفيديو -->
                    </div>
                </div>
            </section>

            <!-- BANNER -->
            <div class="zs-banner-container" id="bannerContainer">...</div>

            <!-- TABS -->
            <div class="zs-tab-content active" id="tab-home">
                <div class="categories-grid" id="homeView">...</div>
                <div class="stream-section">
                    <div class="section-title">🔴 Today's Matches <span id="streamCount"></span></div>
                    <div id="streamContainer"></div>
                </div>
                <api-sports-widget data-type="games" data-tab="all" data-refresh="30" ...></api-sports-widget>
            </div>

            <div class="zs-tab-content" id="tab-movies">...</div>
            <div class="zs-tab-content" id="tab-series">...</div>
            <div class="zs-tab-content" id="tab-reels">...</div>

            <!-- MATCH DETAIL -->
            <div class="match-detail-aiscore" id="matchDetailAiScore">...</div>
        </main>

        <api-sports-widget data-type="config" ...></api-sports-widget>
        <footer class="zs-footer">© 2026 <span>Zi Store</span>. All rights reserved.</footer>
    </div>

    <!-- ===== تشغيل الوحدات ===== -->
    <script type="module" src="js/main.js"></script>
</body>
                            </html>
