        const fallbackData = {"data":[{"id":12841,"title":"A strong message to competitors... Arsenal starts the season with a clean 3-0","slug":"btl-albrymyrlyg-yftth-hml-aldfaaa-aan-lkbh-bthlathy-mdoy","content":"<h3>Arsenal begins its title defense campaign with a 3-0 win against Coventry</h3><p>Arsenal began its campaign in the English Premier League with a strong victory, after defeating its guest Coventry, newly promoted to the Premier League, with three unanswered goals, in the match that brought them together at the Emirates Stadium in the first round competitions.</p><p>The hosts entered the match with early attacking pressure, which resulted in the lead goal after only five minutes, when Kai Havertz took advantage of a cross. Perfect effort by Riccardo Calafiore, who put the ball into the Coventry net with a low shot.</p><p>Arsenal continued their advantage and control over the course of the match, before Bukayo Saka succeeded in doubling the lead in the 23rd minute, after adding the second goal and giving his team a comfortable advantage, so the first half ended with the Gunners leading by two goals to nothing.</p><p>The situation did not change at the beginning of the second half, as Arsenal continued its pressure in search of securing victory, and was able to add The third goal in the 49th minute.</p><p>The goal came after Ben White sent a cross ball into the penalty area, which reached Martin Odegaard, who shot it towards the goal, before the ball deceived the Coventry goalkeeper and entered the net.</p><p>Arsenal maintained its lead during the remaining minutes, winning the match by three clean goals and achieving an ideal start in the campaign to defend the English Premier League title.</p><p>With this victory, Arsenal earned its first three points in the new season, while Newly promoted Coventry to the Premier League suffered a heavy loss in their first appearance away from home.</p>","status":"published","published_at":"33 minutes ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-21T20:59:15.000000Z","updated_at":"2026-08-21T21:20:12.000000Z","image":"https://kooralive.fans/storage/30618/01M0K25D0582G6DT09N6GXDRCH.webp","comments_count":0,"likes_count":0,"is_liked":false},{"id":12840,"title":"Al-Ittihad wins the summit with Ilyinichina's goal and defeats Al-Qadisiyah in an exciting confrontation","slug":"alathad-yhsm-alkm-bhdf-aylynykhyna-oyskt-alkadsy-fy-moagh-mthyr","content":"<p>Al-Ittihad achieved a difficult victory over Al-Qadisiyah with a free goal, in the match that brought them together on Friday evening in the second round of the Roshan Saudi Professional League, in a confrontation that witnessed great excitement and a number of disallowed goals.</p><p>Frenchman Georges Ilinykhina scored the only goal of the match for Al-Ittihad in the 45th minute + 1, after he succeeded in scoring Al-Qadisiyah's net and giving \"Al-Ameed\" the lead before the end of the first half.</p><p>The match witnessed the cancellation of several goals due to offside, the most prominent of which was Al-Ittihad. And Al-Qadisiyah, where a goal for Al-Ittihad was canceled out in the 17th minute by Youssef Al-Nusairi, before another goal for Al-Qadisiyah was canceled by Matteo Retegui in the 21st minute.</p><p>The disallowed goals continued during the match, after a third goal for Al-Qadisiyah scored by Julian Quinones was canceled in the 24th minute, before the matter was repeated with the same player in the 50th minute, then in the 86th minute, so that Al-Qadisiyah's struggle to reach the net continued.</p><p>It was also exposed. Al-Qadisiyah suffered a strong blow in the 47th minute, after Dio Loupi was sent off with the second yellow card, so the team completed the match with ten players.</p><p>Despite the numerical deficiency, Al-Qadisiyah tried to return to the match, but Al-Ittihad's defense succeeded in maintaining its lead, so that \"Al-Ameed\" settled the confrontation with a clean goal and came out with three valuable points.</p><p>With this victory, Al-Ittihad continues its strong journey in the Rushen League, while Al-Qadisiyah suffered a difficult loss after a match that witnessed many goals. Cancellations and offside cases.</p>","status":"published","published_at":"1 hour ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-21T20:19:14.000000Z","updated_at":"2026-08-21T21:20:15.000000Z","image":"https://kooralive.fans/storage/30615/01M0K034R4H5FQW9Z7F8FTB5KA.webp","comments_count":0,"likes_count":1,"is_liked":false},{"id":12839,"title":"A negative draw shocks Zamalek at the start of its Egyptian League campaign","slug":"taaadl-slby-ysdm-alzmalk-fy-afttah-mshoarh-baldory-almsry","content":"<p>The match between Zamalek and Al-Ittihad of Alexandria ended in a scoreless draw, in the match that brought the two teams together on Friday evening at Cairo International Stadium, in the first round of the Egyptian Premier League.</p><p>Each team scored one point at the start of its journey in the league championship for the new season 2026-2027, after both sides failed to score for all the minutes of the match.</p><p>With this result, Zamalek and Al-Ittihad of Alexandria were satisfied with obtaining a point in the opening round, in Waiting to achieve the first victory during the next matches of the competition.</p><p>Zamalek is preparing to face the National Bank in the second round of the Egyptian Premier League, which is scheduled to be held on Wednesday, August 26th.</p><p>On the other hand, Al-Ittihad of Alexandria will meet Ceramica Cleopatra on Friday, August 28th, in the second round of the tournament.</p><p>Zamalek won the Egyptian Premier League title last season 2025-2026, achieving the championship. For the fifteenth time in its history, the team seeks to defend its title during the new season.</p>","status":"published","published_at":"2 hours ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-21T19:06:33.000000Z","updated_at":"2026-08-21T21:20:00.000000Z","image":"https://kooralive.fans/storage/30613/01M0JVZHWGB9ZDGW5E3RR7312J.webp","comments_count":0,"likes_count":0,"is_liked":false},{"id":12838,"title":"Al-Nasr sweeps Riyadh by four and continues its perfect start in the Roshen League","slug":"alnsr-yktsh-alryad-brbaaay-oyoasl-antlakth-almthaly-fy-dory-roshn","content":"<p>Al-Nasr achieved a major victory over Al-Riyadh with four free goals, in the match that brought them together on Friday evening, in the second round of the Roshan Saudi Professional League.</p><p>Al-Alamy raised its score to 6 points, topping the Roshan League standings by goal difference, equal in points with Al-Hilal, while Riyadh remained without a score in last place.</p><p>Al-Nasr succeeded in opening the scoring in the 18th minute, after Abdul-Ilah Al-Omari rose to cross an inside pass. The penalty area, and he headed it into the home team's net, giving his team the lead.</p><p>Before the end of the first half, Gabriel Angelo increased Al-Nasr's lead with a second goal in the 45+1 minute, after taking advantage of a ground cross from the right side, so Al-Alamy went out to the break with a two-goal lead without a response.</p><p>Al-Nasr continued their superiority after returning from the locker room, and Joao Felix added the third goal in the 58th minute, after firing a powerful shot. From the edge of the penalty area, the Riyadh goalkeeper was unable to stop it.</p><p>The 63rd minute witnessed the participation of the Portuguese Cristiano Ronaldo, after coach Ange Postecoglou brought him on instead of Abdullah Al-Hamdan, so that the Al-Nasr captain appeared again with the team after his absence from the Al-Diriyah and Al-Fateh matches.</p><p>Ronaldo concluded the Al-Nasr quadruple in the 83rd minute, after he succeeded in scoring against Riyadh, confirming his team's superiority and obtaining three points. A new boost that strengthened its strong start in the Roshan League.</p><p>With this victory, Al-Nasr continued to obtain full marks in the first two rounds of the competition, for Al-Alamy to confirm early on its ability to compete strongly for the top of the league.</p>","status":"published","published_at":"3 hours ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-21T18:04:50.000000Z","updated_at":"2026-08-21T21:20:17.000000Z","image":"https://kooralive.fans/storage/30612/01M0JRD4E7EEK52TJX5XMP8QC9.webp","comments_count":0,"likes_count":1,"is_liked":false},{"id":12837,"title":"Thomas Partey in the Saudi League.. Al-Shabab officially announces the deal","slug":"tomas-barty-fy-aldory-alsaaody-alshbab-yaaln-alsfk-rsmya","content":"<p>The Saudi Al-Shabab Club announced its official contract with Ghanaian star Thomas Partey, to support the team's midfield during the current season, in a free transfer deal following the expiration of his contract with his previous club.</p><p>Party signed a contract with Al-Shabab for one season, in exchange for an annual salary of up to 4.5 million dollars, thus beginning a new experience in the Saudi League, after many years of brilliance in European stadiums.</p><p>The contract with the Ghanaian midfielder comes as part of the Al-Shabab administration's moves to reorganize the organization. The team's cards, especially after the less-than-ideal start achieved by \"Al-Lioth\" in the Saudi Roshan League and Custodian of the Two Holy Mosques Cup competitions.</p><p>The club's management is counting on Partey's experience to give the midfield more strength and balance, in light of his having a record of participation at the highest level, in addition to his technical and physical abilities that make him an important addition to the team.</p><p>It is expected that Partey will be included in the youth list instead of the Swiss Vincent Siero, as part of the amendments it is making. The club's management is on the team's roster during the current period.</p><p>The Ghanaian player has extensive experience in the English Premier League, having played many years in European competitions with prominent clubs, which enhances the hopes placed on him to make the expected addition to the youth team.</p><p>Al-Leioth hopes that the Thomas Partey deal will contribute to restoring the team's balance and improving its results during the coming period, with the management looking forward to achieving a stronger start in the upcoming local competitions.</p>","status":"published","published_at":"9 hours ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-21T11:54:33.000000Z","updated_at":"2026-08-21T21:20:09.000000Z","image":"https://kooralive.fans/storage/30608/01M0J2Z1HM097RCKVFKRX4D4C6.webp","comments_count":0,"likes_count":0,"is_liked":false},{"id":12836,"title":"Al-Ahly and Smouha match postponed.. Club Association announces the new date","slug":"tagyl-mbara-alahly-osmoh-rabt-alandy-taaln-almoaad-algdyd","content":"<p>The Egyptian Professional Clubs Association decided to amend the date of Al-Ahly's match against Smouha, within the Egyptian Premier League, to be the first change to occur in the competition's schedule during the new season.</p><p>The association announced in an official statement amending the date of the match between Al-Ahly and Smouha in the third round of the first stage of the league, after it was scheduled to be held on Tuesday, September 1.</p><p>According to the new decision, the match was decided to be held on Thursday, September 3, at the stadium. Cairo International Airport, at exactly eight o'clock in the evening, due to the inability of the stadium to host any matches on September 1 and 2.</p><p>Ahly is preparing to play its first match in the Egyptian League for the new season 2026-2027, when it meets Al-Sharqia Enppi next Sunday at Cairo Stadium, as part of the first round competitions.</p><p>Ahly is seeking a strong start in its league journey, before facing Smouha in the third round according to the new date it set. League of Clubs.</p>","status":"published","published_at":"9 hours ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-21T11:37:17.000000Z","updated_at":"2026-08-21T21:20:16.000000Z","image":"https://kooralive.fans/storage/30607/01M0J24EWSS0T12SP5BZEGK1RV.webp","comments_count":1,"likes_count":1,"is_liked":false},{"id":12835,"title":"A historic market for Tottenham.. Savinho has arrived and Marmoush is approaching","slug":"sok-tarykhy-ltotnham-safynyo-osl-omrmosh-yktrb","content":"<h3>Tottenham is close to concluding the deal for Savinho in a historic deal with Manchester City</h3><p>Tottenham Hotspur is close to concluding the deal to sign the Brazilian winger Savinho, a Manchester City player, in a huge deal whose total value approaches 100 million euros, and may become the most expensive in the history of the English club's sales once completed.</p><p>According to recent data, Tottenham and Manchester City have reached a preliminary agreement regarding the transfer of Savinho, with expectations that the deal will be closed within This week, awaiting the finalization of some final details between the two parties.</p><p>The initial agreement stipulates that Manchester City will receive 93.3 million euros as a fixed amount in exchange for the departure of the Brazilian player, in addition to 5.7 million euros in incentives and bonuses linked to his performance, bringing the total potential value of the deal to about 100 million euros.</p><p>If the transfer is completed at the agreed upon value, Savinho will become the most expensive player sold by Manchester City in its history, surpassing the record set by the Argentine Julian. Alvarez, who moved to Atletico Madrid for 75 million euros.</p><h3>Marmoush enters negotiations between Tottenham and Manchester City</h3><p>Tottenham's moves with Manchester City are not limited to the Savinho deal, as the London club has also expressed interest in contracting with Egyptian striker Omar Marmoush, who is also close to having a new experience in the English Premier League.</p><p>According to the details of the negotiations, the coming period may witness the completion of a double deal between Tottenham and Manchester City, as It is expected that the total potential value of the transfer of Savinho and Marmoush, including fixed amounts and incentives, will reach approximately 151 million euros.</p><p>The two deals remain pending final details between all parties, amid expectations that the agreement will be closed within the next few days, if the negotiations go as planned.</p>","status":"published","published_at":"11 hours ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-21T06:15:21.000000Z","updated_at":"2026-08-21T21:27:09.000000Z","image":"https://kooralive.fans/storage/30601/01M0HFSFTR8QJ94GPTG7KVMQHY.webp","comments_count":0,"likes_count":1,"is_liked":false},{"id":12834,"title":"Barcelona opens negotiations with Lautaro after difficulty signing Alvarez","slug":"brshlon-yfth-mfaodat-laotaro-baad-saaob-altaaakd-maa-alfaryz","content":"<h3>Barcelona is moving strongly to include Lautaro Martinez and places him as an offensive priority</h3><p>Barcelona has strongly entered the race to sign Argentine Lautaro Martinez, the Italian Inter striker, after the player became the most prominent target for the Catalan club in order to strengthen its offensive line during the current transfer period.</p><p>According to journalist Jose Alvarez, Barcelona has intensified its movements during the recent period in order to resolve the Lautaro deal, as the club is conducting extensive contacts with the player. And its surroundings, in conjunction with the opening of channels of communication with Inter's management to discuss the possibility of reaching an agreement regarding his transfer.</p><p>The past few days have witnessed several meetings between Barcelona officials and representatives of the Argentine striker, at a time when direct communications began with the Italian club to explore the possibility of completing the deal and transferring the player to Camp Nou.</p><p>Although there are several other names on Barcelona's list of offensive interests, Lautaro currently tops the club's accounts, which is planning to submit an offer worth less than 100 million euros in order to convince Inter to give up the transfer. His striker.</p><p>Barcelona's interest in Lautaro comes in light of the Julian Alvarez deal being concluded, after Atletico Madrid stuck to its position of refusing to sell its Argentine striker to the Catalan club, which prompted Barcelona to intensify its moves in search of suitable alternatives.</p><p>Barcelona sees Lautaro as a prominent option to strengthen the front line, in light of the club's desire to settle a deal for a new striker before the transfer market closes, with continued movements on more than one front to reach an agreement. Final.</p>","status":"published","published_at":"17 hours ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-21T03:48:39.000000Z","updated_at":"2026-08-21T21:19:33.000000Z","image":"https://kooralive.fans/storage/30600/01M0H7GQPMDDE35QG5G4MJ3QTC.webp","comments_count":0,"likes_count":1,"is_liked":false},{"id":12833,"title":"Al-Hilal continues to shine...a clean hat-trick decides the match between Al-Fayhaa","slug":"alhlal-yoasl-altalk-thlathy-nthyf-thsm-moagh-alfyhaaa","content":"<p>Al-Hilal achieved a well-deserved victory over Al-Fayhaa with three free goals, in the match that brought them together on Thursday evening, in the second round of the Roshen Saudi Professional League.</p><p>Al-Hilal imposed its advantage from the beginning of the match, and succeeded in translating its advantage into a first goal in the 31st minute, through Sergei Savic, who gave \"Al-Zaeem\" the advantage before the end of the first half.</p><p>With the beginning of the second half, Al-Hilal continued its offensive pressure, and was able to Sultan Mandash scored the second goal in the 47th minute, strengthening his team's lead and putting Al-Fayhaa in a more difficult position.</p><p>Al-Fayhaa tried to return to the atmosphere of the match and reduce the difference, but Al-Hilal's defense maintained its cohesion, while Al-Zaeem players continued to control the course of the match and threaten the opponent's goal.</p><p>Cristino Summerville received a red card in the 81st minute, after the referee awarded a penalty kick against him, and Al-Fayhaa completed the final minutes. With ten players, before Nasser Al-Dosari added the third goal for Al-Hilal in the 88th minute, confirming his team's victory by three clean goals.</p><p>With this victory, Al-Hilal continues its strong start in the Roshen League, after achieving its second victory in a row, confirming its readiness to compete strongly since the beginning of the season.</p><p>On the other hand, Al-Fayhaa suffered its loss in the second round, after finding itself unable to match the offensive power of Al-Hilal, which decided the confrontation with three goals. Clean.</p>","status":"published","published_at":"1 day ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-20T20:49:06.000000Z","updated_at":"2026-08-21T21:19:08.000000Z","image":"https://kooralive.fans/storage/30596/01M0GFFBV6WTKWS6EENVZNGCQF.webp","comments_count":1,"likes_count":1,"is_liked":false},{"id":12832,"title":"The draw for the Round of 16 ignites the King's Cup... Learn about the seniors' path to the title","slug":"kraa-dor-al16-tshaal-kas-almlk-alsaaody-taarf-aal-tryk-alkbar-nho-allkb","content":"<p>The draw for the round of 16 of the Custodian of the Two Holy Mosques Cup resulted in strong and balanced confrontations, most notably Al Hilal's clash with Al Hazm, and Al Ittihad's confrontation with Al Jabalain, in addition to the match between Al Nasr and Al Khulud.</p><p>Al Hilal will host its counterpart Al Hazm on October 19 and 20, 2026, at Al Hilal Club Stadium, in a confrontation during which \"Al Zaeem\" seeks to continue his journey in the tournament and take a new step closer to competing for the title. The title.</p><p>In another confrontation, Al-Orouba will meet Al-Akhdood at Al-Orouba Club Stadium, while Al-Ula will host Al-Ahly, in the same round matches, in search of securing a qualification ticket to the quarter-finals.</p><p>Riyadh will also receive its counterpart Al-Fayhaa, while Al-Ittihad will be a guest at Al-Jabalayn, in a confrontation during which Al-Ameed hopes to continue its journey in the King's Cup and avoid any surprise against the home team.</p><p>Al-Nasr will meet Al-Khuloud at Al-Nasr Club Stadium, While Al-Taawoun hosts its counterpart, Al-Wahda, in two matches during which each team seeks to qualify for the quarter-finals.</p><p>The Round of 16 matches will conclude with a match between Al-Qadisiyah and NEOM at Al-Qadisiyah Stadium, in an anticipated confrontation between the two teams aspiring to continue their journey in the tournament.</p><p>The complete Round of 16 matches were as follows:</p><ul><li><p>Al-Hilal x Al-Hazm - October 19 and 20 - Al Hilal Club Stadium.</p></li><li><p>Al Orouba x Al Akhdood - October 19 and 20 - Al Orouba Club Stadium.</p></li><li><p>Al Ula x Al Ahly - October 19 and 20 - Al Ula Club Stadium.</p></li><li><p>Riyadh x Al Fayhaa - October 19 and 20 - Riyadh Club Stadium.</p></li><li><p>Al Jabalin x Al Ittihad - October 19 and 20 - Stadium Al-Jabalin Club.</p></li><li><p>Al-Nasr x Al-Khuloud - October 19 and 20 - Al-Nasr Club Stadium.</p></li><li><p>Al-Taawoun x Al-Wahda - October 19 and 20 - Al-Taawoun Club Stadium.</p></li><li><p>Al-Qadisiyah x NEOM - October 19 and 20 - Al-Qadisiyah Club Stadium.</p></li></ul><p>The confrontations in this round carry a strong competitive nature, in light of the presence of a number of clubs.</p>","status":"published","published_at":"1 day ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-20T13:59:49.000000Z","updated_at":"2026-08-21T21:19:19.000000Z","image":"https://kooralive.fans/storage/30595/01M0FR1R4ZW2W96GGS8266ZVKR.webp","comments_count":0,"likes_count":1,"is_liked":false},{"id":12831,"title":"Al Hilal is preparing a huge offer to convince Martinelli to leave Arsenal","slug":"alhlal-yghz-aarda-dkhma-laknaaa-martynyly-bmghadr-arsnal","content":"<p>Brazilian Gabriel Martinelli, an Arsenal winger, has entered the circle of interests of Al Hilal Saudi Club, which continues its movements during the current summer transfer period in search of strengthening its ranks with one of the most prominent attacking names.</p><p>According to what was reported by \"The Sun\" newspaper, quoting journalist Fabrizio Romano, Martinelli is on a shortlist that includes three players that Al Hilal is considering signing one of them, along with Chelsea winger Pedro Neto, and a third player who has not been revealed. His name.</p><p>Al-Hilal's interest in Martinelli comes at a time when the player's future with Arsenal is still not finally decided, which has prompted the Saudi club to closely monitor his position, in preparation for a move to obtain his services.</p><p>The newspaper explained that the Brazilian winger prefers to continue his career in European stadiums during the next stage, especially since he had previously rejected an offer to move to the Turkish league, in light of his desire to continue in European competitions.</p><p>Despite his adherence to Martinelli has the option of staying in Europe. Al Hilal is preparing to make a strong financial offer to convince the player to change his position and go through a new experience in the Saudi League, taking advantage of his financial capabilities and his desire to strengthen his ranks with distinguished attacking elements.</p><p>The football community is awaiting what Al Hilal's moves will result in the coming period, in light of its continued interest in Martinelli, while the Brazilian player has not made a final decision regarding his future with Arsenal yet.</p>","status":"published","published_at":"1 day ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-20T12:10:08.000000Z","updated_at":"2026-08-21T21:22:40.000000Z","image":"https://kooralive.fans/storage/30591/01M0FHFS3B5FKMX3NVZFD9WPN7.webp","comments_count":1,"likes_count":1,"is_liked":false},{"id":12829,"title":"A Spanish offer to include Ilinykhina... and Al-Ittihad sets the price of departure","slug":"aard-asbany-ldm-aylynykhyna-oalathad-yhdd-saar-alrhyl","content":"<p>The Spanish club Seville moved to sign the Frenchman George Ilinykhina, the Al-Ittihad striker, after the player entered the Andalusian club's accounts strongly during the current summer transfer period.</p><p>Seville presented a verbal offer to the Al-Ittihad administration amounting to about 10 million euros, in addition to another 3 million in incentives and additions, with the proposal that the Saudi club receive a percentage of the player's resale value in the future.</p><p>On the other hand, the Al-Ittihad adheres to its financial demands, specifying about 20 million euros to approve the departure of the young striker, with the condition of obtaining the value of the deal in advance, which represents a big difference between Sevilla's offer and the required amount.</p><p>Ilinykhina is 20 years old, and seems open to the idea of returning to European stadiums, especially in light of the interest of more than one club in obtaining his services during the current summer Mercato.</p><p>The federation had previously rejected several attempts to borrow the French striker, including offers from Bologna, Italy, and Trabzonspor, Turkey, in light of the club's adherence to its position regarding the player's future and not abandoning him under the current conditions.</p><p>Sevilla is now required to raise its financial offer if it wants to settle the deal, and reach the value set by the federation to approve Ilinykhina's departure.</p><p>Negotiations remain open between the two clubs during the coming period, as Sevilla seeks to reduce the cost of the deal and reach an appropriate financial formula, while the federation adheres to its conditions before giving the green light for the departure of its striker. French.</p>","status":"published","published_at":"1 day ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-20T03:03:39.000000Z","updated_at":"2026-08-21T20:27:46.000000Z","image":"https://kooralive.fans/storage/30590/01M0FE77SE49A0RPNTFZYJ5QEY.webp","comments_count":0,"likes_count":0,"is_liked":false},{"id":12830,"title":"Flick asks for a new striker...and praises Hamza's brilliance with Barcelona","slug":"flyk-ytlb-mhagma-gdyda-oyshyd-btalk-hmz-maa-brshlon","content":"<h3>Flick after the victory over Al-Ahly: We continue to search for a striker...and we are satisfied with Hamza's performance.</h3><p>German Hans Flick, Barcelona's coach, spoke about his team's victory over Al-Ahly of Egypt with a score of 2-1 in the Juan Gamper Cup, stressing that the club's management is still working to strengthen the team's ranks by contracting with an outright striker before the transfer market closes.</p><p>Flick said that Barcelona continues to search for the right player for this position, praising in At the same time, the work that sporting director Deco is doing in order to resolve the file.</p><p>The German coach touched on the Rodri deal, expressing his happiness with the Spanish midfielder joining Barcelona, and stressing that his abilities will give the team a great addition, especially after the remarkable level he presented during the World Cup.</p><p>Flick explained that Rodri proved during the World Cup that he is one of the best players in his position, pointing out his ability to give the team balance, organize the play, and control the tempo of the matches, whether by accelerating the pace or His calmness, in addition to his leadership personality on the field.</p><p>The Barcelona coach also praised the Egyptian striker Hamza Abdel Karim, who continued his brilliance during the preparation period and raised his score to four goals, stressing that the player possesses distinguished offensive capabilities.</p><p>Flick said about Hamza that what draws his attention is his ability to deal with cross balls, in addition to his possession of the ball well, which are things that the coach believes are important for the striker who wants to rely on him in the future.</p><p>He spoke. Flick also talked about the difficulty of preparing for the new season, in light of the return of a number of players who participated with their country's teams in the World Cup last week, explaining that the technical staff is required to carefully manage the minutes of their participation to avoid exhausting them.</p><p>At the end of his speech, Flick turned his attention to Barcelona's start in the Spanish League against Elche, stressing that his team possesses the necessary quality and capabilities, but it needs to deal with the next stage well, especially with the start of the season directly.</p><p>The German coach stressed the importance of achieving victory in the match. The opening statement, stressing his respect for Elche and his ability to play good football, before expressing his satisfaction with his team's performance against Al-Ahly, while emphasizing that there is a lot of room for improvement during the coming period.</p>","status":"published","published_at":"1 day ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-20T10:42:47.000000Z","updated_at":"2026-08-21T20:27:47.000000Z","image":"https://kooralive.fans/storage/30589/01M0FE1WX389H8B68RPXVMRB11.webp","comments_count":0,"likes_count":2,"is_liked":false},{"id":12828,"title":"Barcelona opens its season with the Juan Gamper title against Al-Ahly of Egypt","slug":"brshlon-yftth-mosmh-blkb-khoan-gambr-dd-alahly-almsry","content":"<h3>Barcelona wins the Juan Gamper Cup after an exciting victory over Al-Ahly</h3><p>FC Barcelona won the 2026 Juan Gamper Cup, after deciding the confrontation against Al-Ahly of Egypt with a score of 2-1, in the match that brought together the two teams at the Spotify Camp Nou stadium, amid a distinctive crowd atmosphere.</p><p>Barcelona started the match with a clear advantage, and succeeded in translating its pressure into the lead goal in the 29th minute, after taking advantage of Hamza Abdel Karim made a wonderful pass from Baldy, putting the ball into Al-Ahly's net and giving the Catalan team the advantage.</p><p>Before the whistle blew at the end of the first half, Barcelona won a penalty kick in the 45th minute, after Shadi Riyad awarded it, and Rafinha successfully executed the kick, adding the second goal to his team and strengthening Barcelona's lead.</p><p>With the beginning of the second half, Al-Ahly returned to the atmosphere of the match with strength, and was able to reduce the difference at the minute mark. 51 by Ahmed Sayed Zizo, after receiving a special pass from the new Algerian newcomer, Moncef Bikarar, to return the match to an exciting score.</p><p>Al-Ahly tried to exploit the goal to continue the pressure and search for the equalizer, while Barcelona worked to maintain its lead and decide the match in its favor until the last minutes.</p><p>In stoppage time, specifically at the 90th+1 minute, Barcelona won a new penalty kick after Ahmed Eid caused it to be awarded, but Anthony Gordon missed an opportunity. Adding the third goal, the confrontation ended with Barcelona winning 2-1 and being crowned with the 2026 Juan Gamper Cup.</p><p>With this victory, Barcelona concludes its preparations for the new season by winning the Juan Gamper Cup, while Al-Ahly made a strong appearance against the Catalan giant despite losing by one goal.</p>","status":"published","published_at":"2 days ago","newsable_id":null,"newsable_type":null,"created_at":"2026-08-19T20:12:52.000000Z","updated_at":"2026-08-21T18:59:04.000000Z","image":"https://kooralive.fans/storage/30566/01M0DTQCK13P7XMTNM82W2QN0R         // دالة لاقتطاع النص
        function truncateText(text, maxLength = 150) {
            if (text.length <= maxLength) return text;

        }
