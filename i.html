<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer News - Live Updates</title>
    <style>
        :root {
            --bg-primary: #0c1220;
            --bg-secondary: #111a2e;
            --bg-card: #151f35;
            --bg-card-hover: #1a2740;
            --bg-modal: #0f1729;
            --border: #1e2d4a;
            --border-light: #2a3d5f;
            --text-primary: #f0f4fa;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-green-bg: rgba(16, 185, 129, 0.15);
            --accent-blue: #3b82f6;
            --accent-blue-bg: rgba(59, 130, 246, 0.15);
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.6);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-full: 50%;
            --transition: all 0.3s ease;
            --font: 'Segoe UI', 'Roboto', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3d527a; }

        /* Header */
        .site-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(12,18,32,0.92); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px;
        }
        .site-header .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.25rem; color: var(--text-primary); text-decoration: none; }
        .site-header .logo-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--accent-green), #059669); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #fff; }
        .live-badge { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 600; color: var(--accent-green); background: var(--accent-green-bg); padding: 6px 14px; border-radius: 20px; }
        .live-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 8px rgba(16,185,129,0.7); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

        .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .section-title { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .section-title .icon { width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; background: var(--accent-orange-bg); color: var(--accent-orange); }
        .section-count { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; background: var(--bg-card); padding: 4px 12px; border-radius: 16px; border: 1px solid var(--border); }

        /* ================== بداية تعديل قسم Important ================== */
        .important-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
        }
        .important-card {
            /* تحويله لنفس ستايل الصفوف لكن بألوان مميزة (أزرق) */
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            border-radius: var(--radius);
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, var(--bg-card) 60%);
            border: 1px solid var(--accent-blue);
            border-left: 4px solid var(--accent-blue);
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.15);
        }
        .important-card::before {
            display: none; /* إلغاء الخط العلوي القديم */
        }
        .important-card:hover {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.2) 0%, var(--bg-card-hover) 60%);
            border-color: #60a5fa;
            transform: translateX(4px);
            box-shadow: var(--shadow);
        }
        /* ================== نهاية تعديل قسم Important ================== */

        .transfers-list { display: flex; flex-direction: column; gap: 12px; }
        .transfer-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: var(--transition); }
        .transfer-row:hover { background: var(--bg-card-hover); border-color: var(--border-light); transform: translateX(4px); box-shadow: var(--shadow); }
        .transfer-row .player-photo { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-light); background: var(--bg-secondary); flex-shrink: 0; }
        .transfer-row .main-info { flex: 1; min-width: 0; }
        .transfer-row .player-name { font-weight: 700; font-size: 1.02rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .transfer-row .player-name .pos-tag { font-size: 0.68rem; font-weight: 700; color: var(--text-muted); background: var(--bg-secondary); border: 1px solid var(--border); padding: 2px 8px; border-radius: 10px; }
        .transfer-row .teams-line { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-secondary); }
        .transfer-row .teams-line .team-badge-inline { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; background: var(--bg-primary); vertical-align: middle; }
        .transfer-row .teams-line .arrow { color: var(--text-muted); font-size: 0.9rem; }
        .transfer-row .right-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
        .transfer-row .value-display { font-weight: 700; font-size: 0.85rem; color: var(--accent-orange); }
        .transfer-row .date-display { font-size: 0.72rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

        .transfer-type-badge { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
        .badge-transfer { background: var(--accent-green-bg); color: var(--accent-green); }
        .badge-loan { background: var(--accent-blue-bg); color: var(--accent-blue); }

        .loading-sentinel { display: flex; align-items: center; justify-content: center; padding: 30px 0; gap: 12px; color: var(--text-muted); font-size: 0.9rem; }
        .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent-green); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .no-more { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 0.9rem; }

        /* Modal */
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; visibility: hidden; transition: var(--transition); }
        .modal-overlay.active { opacity:1; visibility:visible; }
        .modal-container { background: var(--bg-modal); border: 1px solid var(--border); border-radius: 16px; max-width: 620px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg); transform: translateY(20px) scale(0.95); transition: var(--transition); position: relative; }
        .modal-overlay.active .modal-container { transform: translateY(0) scale(1); }
        .modal-close { position: absolute; top:14px; right:14px; z-index:10; width:36px; height:36px; border-radius: 50%; background: rgba(0,0,0,0.5); border:1px solid var(--border); color: var(--text-primary); font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .modal-close:hover { background: rgba(255,255,255,0.1); }

        /* ================== تعديل الـ Cover ليكون مثل التطبيق ================== */
        .modal-cover {
            position: relative;
            height: 280px; /* رفع الارتفاع ليصبح أطول مثل التطبيق */
            border-radius: 16px 16px 0 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3a5f, #0c1220);
        }
        .modal-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center; /* جعل الصورة تتركز في الأعلى لإظهار الجسم كاملاً */
            opacity: 0.9;
        }
        .modal-cover .cover-overlay {
            position:absolute;
            bottom:0; left:0; right:0;
            height: 60%;
            background: linear-gradient(to top, var(--bg-modal) 20%, transparent 100%);
        }
        /* =============================================================== */

        .modal-body { padding: 0 24px 24px; position: relative; }
        .modal-player-avatar { width:110px; height:110px; border-radius:50%; border:4px solid var(--bg-modal); object-fit:cover; background: var(--bg-secondary); margin-top:-55px; position:relative; z-index:5; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
        .modal-player-name { font-size:1.5rem; font-weight:800; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px; }
        .modal-player-name .country-flag { width:24px; height:18px; border-radius:3px; object-fit:cover; border:1px solid var(--border); }
        .modal-player-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:0.85rem; color: var(--text-secondary); }
        .modal-player-meta .pos-badge { font-weight:700; font-size:0.75rem; padding:3px 10px; border-radius:14px; background: var(--accent-blue-bg); color: var(--accent-blue); }
        .modal-player-meta .foot-badge { font-weight:600; font-size:0.75rem; padding:3px 10px; border-radius:14px; background: var(--bg-secondary); border:1px solid var(--border); color: var(--text-secondary); }
        .modal-player-meta .team-badge-link { display:flex; align-items:center; gap:6px; font-size:0.8rem; color: var(--text-secondary); background: var(--bg-secondary); border:1px solid var(--border); padding:3px 10px; border-radius:14px; }
        .modal-player-meta .team-badge-link img { width:18px; height:18px; border-radius:50%; object-fit:cover; }
        .modal-stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-top:20px; padding:16px; background: var(--bg-secondary); border:1px solid var(--border); border-radius: var(--radius-sm); }
        .stat-item { text-align:center; }
        .stat-item .stat-value { font-weight:800; font-size:1.1rem; }
        .stat-item .stat-label { font-size:0.7rem; color: var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
        .modal-history-title { font-size:0.95rem; font-weight:700; margin-top:20px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
        .modal-history-title .icon { color: var(--accent-orange); }
        .transfer-history-list { display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; padding-right:4px; }
        .history-item { display:flex; align-items:center; gap:10px; padding:10px 14px; background: var(--bg-card); border:1px solid var(--border); border-radius: var(--radius-sm); transition: var(--transition); font-size:0.82rem; }
        .history-item:hover { border-color: var(--border-light); }
        .history-item .h-badge { width:24px; height:24px; border-radius:50%; object-fit:cover; background: var(--bg-secondary); flex-shrink:0; }
        .history-item .h-info { flex:1; min-width:0; }
        .history-item .h-team { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .history-item .h-dates { font-size:0.7rem; color: var(--text-muted); }
        .history-item .h-trans { font-size:0.65rem; font-weight:700; padding:2px 8px; border-radius:10px; text-transform:uppercase; letter-spacing:0.3px; flex-shrink:0; }
        .history-item .h-value { font-size:0.75rem; font-weight:700; color: var(--accent-orange); flex-shrink:0; min-width:55px; text-align:right; }
        .history-item.active-transfer { border-color: var(--accent-green); background: rgba(16,185,129,0.06); }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 16px 12px 60px; }
            .site-header { padding: 0 16px; height: 56px; }
            .site-header .logo { font-size:1.05rem; }
            .site-header .logo-icon { width:30px; height:30px; font-size:0.9rem; }
            .section-title { font-size:1.15rem; }
            .transfer-row, .important-card { padding:12px 14px; gap:12px; }
            .transfer-row .player-photo, .important-card .player-photo { width:44px; height:44px; }
            .transfer-row .player-name, .important-card .player-name { font-size:0.92rem; }
            .transfer-row .teams-line, .important-card .teams-line { font-size:0.78rem; }
            .modal-container { max-height:90vh; border-radius:12px; }
            .modal-cover { height: 180px; border-radius:12px 12px 0 0; }
            .modal-player-avatar { width:80px; height:80px; margin-top:-40px; border-width:3px; }
            .modal-body { padding:0 16px 16px; }
            .modal-player-name { font-size:1.2rem; }
            .modal-stats { grid-template-columns: repeat(3,1fr); padding:12px; gap:8px; }
        }
        @media (max-width: 480px) {
            .transfer-row, .important-card { flex-wrap:wrap; align-items:flex-start; }
            .transfer-row .right-side, .important-card .right-side { flex-direction:row; align-items:center; gap:8px; width:100%; justify-content:space-between; margin-top:4px; }
            .modal-stats { grid-template-columns: repeat(2,1fr); }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="#" class="logo">
            <span class="logo-icon">⚽</span>
            <span>Transfer News</span>
        </a>
        <div class="live-badge">
            <span class="dot"></span>
            <span>Live Updates</span>
        </div>
    </header>

    <main class="container">
        <div class="section-header">
            <h2 class="section-title"><span class="icon">⭐</span> Key Transfers</h2>
            <span class="section-count" id="importantCount">Loading...</span>
        </div>
        <div class="important-grid" id="importantGrid"></div>

        <div class="section-header">
            <h2 class="section-title"><span class="icon">🔄</span> All Transfers</h2>
            <span class="section-count" id="totalCount">Loading...</span>
        </div>
        <div class="transfers-list" id="transfersList"></div>

        <div id="loadingSentinel" class="loading-sentinel">
            <div class="spinner"></div>
            <span>Loading more transfers...</span>
        </div>
    </main>

    <!-- Player Modal -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal-container" id="modalContainer">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // ===== إعدادات =====
        const SUPABASE_FUNCTION_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co/functions/v1/proxy'; 

        const API_BASE = 'https://api-en.ysscores.com/api/info';
        const IMG_PLAYER = 'https://imgs.ysscores.com/player/150/';
        const IMG_PLAYER_COVER = 'https://imgs.ysscores.com/player/cover/';
        const IMG_TEAM_SM = 'https://imgs.ysscores.com/teams/128/';
        const IMG_TEAM_MD = 'https://imgs.ysscores.com/teams/150/';
        const IMG_COUNTRY = 'https://imgs.ysscores.com/country/';

        // ===== الحالة =====
        let currentPage = 0;
        let lastPage = 1;
        let totalTransfers = 0;
        let isLoading = false;
        let allLoaded = false;
        let importantLoaded = false;

        // ===== عناصر DOM =====
        const importantGrid = document.getElementById('importantGrid');
        const transfersList = document.getElementById('transfersList');
        const loadingSentinel = document.getElementById('loadingSentinel');
        const importantCount = document.getElementById('importantCount');
        const totalCount = document.getElementById('totalCount');
        const playerModal = document.getElementById('playerModal');
        const modalContent = document.getElementById('modalContent');
        const modalClose = document.getElementById('modalClose');

        // ===== دوال مساعدة =====
        function getTransferType(type) {
            const types = { 0:{label:'Transfer',badgeClass:'badge-transfer'}, 1:{label:'Loan',badgeClass:'badge-loan'}, 2:{label:'Free',badgeClass:'badge-transfer'}, 3:{label:'End of Loan',badgeClass:'badge-loan'}, 4:{label:'Loan',badgeClass:'badge-loan'} };
            return types[type] || {label:'Transfer',badgeClass:'badge-transfer'};
        }
        function formatValue(value) {
            if (value === null || value === undefined || value === '' || value === '0' || value === 0) return 'Free';
            const str = String(value);
            if (str.includes('M') || str.includes('K') || str.includes('B')) return '€' + str;
            const num = parseFloat(str);
            if (isNaN(num)) return 'Free';
            if (num >= 1000000) return '€' + (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return '€' + (num / 1000).toFixed(0) + 'K';
            return '€' + num;
        }
        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        function formatDateShort(dateStr) {
            if (!dateStr) return '—';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
        function calculateAge(birthDate) {
            if (!birthDate) return '—';
            const birth = new Date(birthDate);
            if (isNaN(birth.getTime())) return '—';
            const today = new Date();
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }
        function getImageUrl(imgName, type) {
            if (!imgName) return '';
            if (imgName.startsWith('http')) return imgName;
            switch(type) {
                case 'player': return IMG_PLAYER + imgName;
                case 'cover': return IMG_PLAYER_COVER + imgName;
                case 'team-sm': return IMG_TEAM_SM + imgName;
                case 'team-md': return IMG_TEAM_MD + imgName;
                case 'country': return IMG_COUNTRY + imgName;
                default: return imgName;
            }
        }
        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '…' : text;
        }

        // ===== دالة الجلب عبر Supabase =====
        async function fetchFromAPI(url) {
            const fetchUrl = SUPABASE_FUNCTION_URL.includes('?') 
                ? SUPABASE_FUNCTION_URL + encodeURIComponent(url)
                : SUPABASE_FUNCTION_URL + '?url=' + encodeURIComponent(url);
            const response = await fetch(fetchUrl);
            if (!response.ok) throw new Error(`Supabase function error: ${response.status}`);
            return response.json();
        }

        // ===== دوال الجلب الأصلية =====
        async function fetchTransfersPage(page) {
            const apiUrl = `${API_BASE}/transfer_info_page/0?page=${page}`;
            const data = await fetchFromAPI(apiUrl);
            if (!data.status || data.status_code !== 200) throw new Error(data.message || 'API error');
            return data.data;
        }
        async function fetchPlayerInfo(playerId) {
            const apiUrl = `${API_BASE}/player_info/${playerId}/L/60`;
            const data = await fetchFromAPI(apiUrl);
            if (!data.status || data.status_code !== 200) throw new Error(data.message || 'API error');
            return data.data;
        }

        // ===== عرض البيانات =====
        // تعديل دالة عرض الـ Important لتشبه الـ List تماماً
        function renderImportantTransfers(transfers) {
            if (!transfers || transfers.length === 0) {
                importantGrid.innerHTML = '<div class="error-message" style="grid-column:1/-1;">No important transfers found.</div>';
                return;
            }
            importantCount.textContent = transfers.length + ' transfers';
            importantGrid.innerHTML = transfers.map(t => {
                const typeInfo = getTransferType(t.type);
                return `
                <div class="transfer-row important-card" onclick="openPlayerModal(${t.player_name?.row_id})">
                    <img class="player-photo" src="${getImageUrl(t.player_name?.image, 'player')}" alt="${t.player_name?.title || 'Player'}" onerror="this.style.display='none'">
                    <div class="main-info">
                        <div class="player-name">${t.player_name?.title || 'Unknown'} <span class="pos-tag">${t.player_name?.position || '—'}</span></div>
                        <div class="teams-line">
                            <img class="team-badge-inline" src="${getImageUrl(t.team_out?.image, 'team-sm')}" alt="" onerror="this.style.display='none'"><span>${truncateText(t.team_out?.title || 'Unknown', 20)}</span>
                            <span class="arrow">➜</span>
                            <img class="team-badge-inline" src="${getImageUrl(t.team_in?.image, 'team-sm')}" alt="" onerror="this.style.display='none'"><span>${truncateText(t.team_in?.title || 'Unknown', 20)}</span>
                        </div>
                    </div>
                    <div class="right-side">
                        <span class="transfer-type-badge ${typeInfo.badgeClass}" style="font-size:0.65rem;">${typeInfo.label}</span>
                        <span class="value-display">${formatValue(t.value)}</span>
                        <span class="date-display">${formatDateShort(t.date_from)}${t.date_to ? ' → ' + formatDateShort(t.date_to) : ''}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function renderTransferRow(t) {
            const typeInfo = getTransferType(t.type);
            return `
            <div class="transfer-row" onclick="openPlayerModal(${t.player_name?.row_id})">
                <img class="player-photo" src="${getImageUrl(t.player_name?.image, 'player')}" alt="${t.player_name?.title || 'Player'}" onerror="this.style.display='none'">
                <div class="main-info">
                    <div class="player-name">${t.player_name?.title || 'Unknown'} <span class="pos-tag">${t.player_name?.position || '—'}</span></div>
                    <div class="teams-line">
                        <img class="team-badge-inline" src="${getImageUrl(t.team_out?.image, 'team-sm')}" alt="" onerror="this.style.display='none'"><span>${truncateText(t.team_out?.title || 'Unknown', 20)}</span>
                        <span class="arrow">➜</span>
                        <img class="team-badge-inline" src="${getImageUrl(t.team_in?.image, 'team-sm')}" alt="" onerror="this.style.display='none'"><span>${truncateText(t.team_in?.title || 'Unknown', 20)}</span>
                    </div>
                </div>
                <div class="right-side">
                    <span class="transfer-type-badge ${typeInfo.badgeClass}" style="font-size:0.65rem;">${typeInfo.label}</span>
                    <span class="value-display">${formatValue(t.value)}</span>
                    <span class="date-display">${formatDateShort(t.date_from)}${t.date_to ? ' → ' + formatDateShort(t.date_to) : ''}</span>
                </div>
            </div>`;
        }

        function appendTransfers(transfers) {
            if (!transfers || transfers.length === 0) return;
            transfersList.insertAdjacentHTML('beforeend', transfers.map(renderTransferRow).join(''));
        }

        // ===== التحميل =====
        async function loadInitialData() {
            try {
                const data = await fetchTransfersPage(1);
                currentPage = 1;
                lastPage = data.pagination?.last_page || 1;
                totalTransfers = data.pagination?.total || 0;
                totalCount.textContent = totalTransfers.toLocaleString() + ' transfers';

                if (!importantLoaded && data.important && data.important.length > 0) {
                    renderImportantTransfers(data.important);
                    importantLoaded = true;
                }
                if (data.all && data.all.length > 0) appendTransfers(data.all);

                if (currentPage >= lastPage) {
                    allLoaded = true;
                    loadingSentinel.innerHTML = '<div class="no-more">🏁 You\'ve reached the end of all transfers.</div>';
                } else {
                    loadingSentinel.innerHTML = '<div class="spinner"></div><span>Scroll to load more...</span>';
                }
            } catch (error) {
                console.error('Error loading transfers:', error);
                transfersList.innerHTML = `<div class="error-message">Failed to load transfers. Check your Supabase function or network.<br><small>${error.message}</small></div>`;
                importantGrid.innerHTML = `<div class="error-message" style="grid-column:1/-1;">Unable to load key transfers.</div>`;
                loadingSentinel.style.display = 'none';
            }
        }

        async function loadMoreTransfers() {
            if (isLoading || allLoaded) return;
            isLoading = true;
            loadingSentinel.innerHTML = '<div class="spinner"></div><span>Loading more transfers...</span>';
            try {
                const nextPage = currentPage + 1;
                if (nextPage > lastPage) {
                    allLoaded = true;
                    loadingSentinel.innerHTML = '<div class="no-more">🏁 You\'ve reached the end of all transfers.</div>';
                    return;
                }
                const data = await fetchTransfersPage(nextPage);
                currentPage = nextPage;
                lastPage = data.pagination?.last_page || lastPage;
                if (data.all && data.all.length > 0) appendTransfers(data.all);
                if (currentPage >= lastPage) {
                    allLoaded = true;
                    loadingSentinel.innerHTML = '<div class="no-more">🏁 You\'ve reached the end of all transfers.</div>';
                } else {
                    loadingSentinel.innerHTML = '<div class="spinner"></div><span>Scroll to load more...</span>';
                }
            } catch (error) {
                console.error('Error loading more transfers:', error);
                loadingSentinel.innerHTML = `<div class="error-message" style="padding:12px;">Failed to load more. <a href="#" onclick="retryLoadMore();return false;" style="color:var(--accent-blue);">Retry</a></div>`;
            } finally {
                isLoading = false;
            }
        }

        function retryLoadMore() {
            loadingSentinel.innerHTML = '<div class="spinner"></div><span>Loading more transfers...</span>';
            loadMoreTransfers();
        }

        // Intersection Observer
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading && !allLoaded) loadMoreTransfers();
        }, { rootMargin: '200px', threshold: 0.1 });
        observer.observe(loadingSentinel);

        // ===== نافذة اللاعب =====
        async function openPlayerModal(playerId) {
            if (!playerId) return;
            playerModal.classList.add('active');
            document.body.style.overflow = 'hidden';
            modalContent.innerHTML = `<div style="padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto 16px;border-top-color:var(--accent-blue);"></div><p style="color:var(--text-muted);font-size:0.9rem;">Loading player profile...</p></div>`;
            try {
                const player = await fetchPlayerInfo(playerId);
                renderPlayerModal(player);
            } catch (error) {
                console.error('Error loading player:', error);
                modalContent.innerHTML = `<div style="padding:40px;text-align:center;" class="error-message">Failed to load player profile.<br><small>${error.message}</small></div>`;
            }
        }

        function renderPlayerModal(player) {
            const coverImg = getImageUrl(player.image_cover, 'cover');
            const avatarImg = getImageUrl(player.image, 'player');
            const countryImg = getImageUrl(player.country?.image, 'country');
            const teamImg = getImageUrl(player.team_name?.image, 'team-sm');
            const age = calculateAge(player.birth_day);
            const transfers = player.transfers || [];

            modalContent.innerHTML = `
                <div class="modal-cover">
                    ${coverImg ? `<img src="${coverImg}" alt="Cover" onerror="this.style.display='none';">` : ''}
                    <div class="cover-overlay"></div>
                </div>
                <div class="modal-body">
                    <img class="modal-player-avatar" src="${avatarImg}" alt="${player.title || 'Player'}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <span style="display:none;width:110px;height:110px;border-radius:50%;background:var(--bg-secondary);align-items:center;justify-content:center;font-size:2rem;margin-top:-55px;border:4px solid var(--bg-modal);box-shadow:0 4px 16px rgba(0,0,0,0.4);position:relative;z-index:5;">👤</span>

                    <div class="modal-player-name">
                        ${player.title || 'Unknown'}
                        ${countryImg ? `<img class="country-flag" src="${countryImg}" alt="${player.country?.title || ''}" onerror="this.style.display='none';">` : ''}
                    </div>
                    <div class="modal-player-meta">
                        <span class="pos-badge">${player.position || '—'}</span>
                        <span class="foot-badge">${player.foot === 'R' ? 'Right Foot' : player.foot === 'L' ? 'Left Foot' : player.foot || '—'}</span>
                        ${teamImg ? `<span class="team-badge-link"><img src="${teamImg}" alt="${player.team_name?.title || ''}" onerror="this.style.display='none';"> ${player.team_name?.title || '—'}</span>` : ''}
                    </div>

                    <div class="modal-stats">
                        <div class="stat-item"><div class="stat-value">${age}</div><div class="stat-label">Age</div></div>
                        <div class="stat-item"><div class="stat-value">${player.height || '—'}</div><div class="stat-label">Height (cm)</div></div>
                        <div class="stat-item"><div class="stat-value">${player.weight || '—'}</div><div class="stat-label">Weight (kg)</div></div>
                        <div class="stat-item"><div class="stat-value">${player.position || '—'}</div><div class="stat-label">Position</div></div>
                        <div class="stat-item"><div class="stat-value">${player.country?.title || '—'}</div><div class="stat-label">Nationality</div></div>
                        <div class="stat-item"><div class="stat-value">${formatDateShort(player.birth_day)}</div><div class="stat-label">Birth Date</div></div>
                    </div>

                    <div class="modal-history-title"><span class="icon">📋</span> Transfer History</div>
                    <div class="transfer-history-list">
                        ${transfers.length > 0 ? transfers.map(tr => {
                            const transLabel = tr.trans === 'Loan' ? 'Loan' : tr.trans || 'Transfer';
                            const badgeClass = tr.trans === 'Loan' ? 'badge-loan' : 'badge-transfer';
                            const isActive = tr.active === 1;
                            const teamImgHist = getImageUrl(tr.team_in?.image, 'team-sm');
                            return `
                            <div class="history-item ${isActive ? 'active-transfer' : ''}">
                                ${teamImgHist ? `<img class="h-badge" src="${teamImgHist}" alt="" onerror="this.style.display='none';">` : '<span style="width:24px;height:24px;flex-shrink:0;">🏟️</span>'}
                                <div class="h-info">
                                    <div class="h-team">${tr.team_in?.title || 'Unknown'} ${isActive ? '<span style="color:var(--accent-green);font-size:0.65rem;">● Active</span>' : ''}</div>
                                    <div class="h-dates">${formatDate(tr.date_from)} → ${tr.date_to ? formatDate(tr.date_to) : 'Present'}</div>
                                </div>
                                <span class="h-trans ${badgeClass}">${transLabel}</span>
                                <span class="h-value">${formatValue(tr.value)}</span>
                            </div>`;
                        }).join('') : '<div style="text-align:center;color:var(--text-muted);padding:20px;">No transfer history available.</div>'}
                    </div>
                </div>
            `;
        }

        function closePlayerModal() {
            playerModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ===== الأحداث =====
        modalClose.addEventListener('click', closePlayerModal);
        playerModal.addEventListener('click', (e) => { if (e.target === playerModal) closePlayerModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && playerModal.classList.contains('active')) closePlayerModal(); });

        // بدء التحميل
        loadInitialData();
    </script>
</body>
</html>
