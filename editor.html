<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameGuardian Field-Name Script Builder with RC4</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --panel-bg: #030712;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --text: #f3f4f6;
            --border: #1f2937;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
        }
        .control-panel {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }
        .output-panel-container {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        h1, h2, h3 { color: var(--accent); margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        input, select {
            width: 100%;
            padding: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .cheat-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #374151;
            margin-bottom: 15px;
            position: relative;
        }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: #374151; margin-top: 5px; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-danger { background: var(--danger); width: auto; padding: 4px 8px; font-size: 11px; position: absolute; top: 10px; left: 10px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .checkbox-group input { width: auto; }
        .terminal {
            background: var(--panel-bg);
            color: #38bdf8;
            font-family: monospace;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-grow: 1;
            height: 450px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
        }
        .terminal-header {
            color: #ef4444;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- Control Panel -->
    <div class="control-panel">
        <h1>🛠️ Field-Name Script Builder (RC4 Protected)</h1>
        
        <div class="form-group">
            <label>Script Title:</label>
            <input type="text" id="scriptTitle" value="Professional Hack Menu" oninput="updateLivePreview()">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="includeSpeedhack" checked onchange="updateLivePreview()">
            <label for="includeSpeedhack" style="margin-bottom:0;">Include Speed Hack (with slider)</label>
        </div>

        <hr style="border-color: var(--border); margin: 20px 0;">

        <h2>📋 Cheat List (Field-Name Method)</h2>
        <div id="cheatsContainer"></div>

        <button class="btn btn-secondary" onclick="addCheat()">➕ Add New Cheat</button>

        <hr style="border-color: var(--border); margin: 20px 0;">

        <!-- RC4 Protection -->
        <h2>🔒 RC4 Script Protection</h2>
        <div class="checkbox-group">
            <input type="checkbox" id="enableRC4" onchange="updateLivePreview()">
            <label for="enableRC4" style="margin-bottom:0;">Encrypt output with RC4</label>
        </div>
        <div class="form-group">
            <label>Encryption Key (any text):</label>
            <input type="text" id="rc4Key" value="MySecretKey123" onchange="updateLivePreview()">
            <button class="btn btn-secondary" onclick="generateRandomKey()">🎲 Generate Random Key</button>
        </div>

        <br>
        <button class="btn" onclick="generateAndDownload()">🚀 Build & Download Script</button>
    </div>

    <!-- Output Panel -->
    <div class="output-panel-container">
        <div class="terminal-header">[OUTPUT PANEL - LIVE PREVIEW & LOGS]</div>
        <div id="terminalOutput" class="terminal">
            RC4 Engine | Generator Ready...
            Waiting for configuration...
        </div>
        <button class="btn btn-secondary" style="margin-top: 10px;" onclick="updateLivePreview()">🔄 Refresh Live Preview</button>
    </div>
</div>

<script>
    window.onload = function() {
        addCheat();
    };

    function addCheat() {
        const container = document.getElementById('cheatsContainer');
        const index = container.children.length + 1;
        
        const div = document.createElement('div');
        div.className = 'cheat-box';
        div.innerHTML = `
            <button class="btn btn-danger" onclick="this.parentElement.remove(); updateLivePreview();">Delete</button>
            <h3>Cheat #${index}</h3>
            <div class="form-group" style="margin-bottom:8px;">
                <label>Cheat Name:</label>
                <input type="text" class="c-name" value="Unlimited Health" oninput="updateLivePreview()">
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label>Class Name:</label>
                <input type="text" class="c-class" value="PlayerController" oninput="updateLivePreview()">
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label>Field Name:</label>
                <input type="text" class="c-field" value="health" oninput="updateLivePreview()">
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label>Data Type:</label>
                <select class="c-datatype" onchange="updateLivePreview()">
                    <option value="1">1 = Byte / Bool</option>
                    <option value="2">2 = Word</option>
                    <option value="4" selected>4 = Dword</option>
                    <option value="16">16 = Float</option>
                    <option value="32">32 = Double</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label>Default Value:</label>
                <input type="text" class="c-val" value="999" oninput="updateLivePreview()">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" class="c-freeze" checked onchange="updateLivePreview()">
                <label style="margin-bottom:0;">Freeze Value</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" class="c-refine" checked onchange="updateLivePreview()">
                <label style="margin-bottom:0;">Refine by current value</label>
            </div>
        `;
        container.appendChild(div);
        updateLivePreview();
    }

    // ---------- Build the plain Lua script ----------
    function buildPlainLua() {
        const title = document.getElementById('scriptTitle').value;
        const includeSpeed = document.getElementById('includeSpeedhack').checked;
        const cheatBoxes = document.querySelectorAll('.cheat-box');

        let lua = `-- ==========================================
-- ${title}
-- ==========================================

local v = gg.getTargetInfo()
if not v or not v.packageName then
    gg.alert("Error: Open the game first and select the process in GameGuardian!")
    os.exit()
end

local is64 = v.x64
local gameName = v.label or "Unknown Game"
local packageName = v.packageName

-- =============================================
-- Field Name Search (TrainMiner style)
-- =============================================
function searchByFieldName(className, fieldName, valueType)
    local x, f, t = className, fieldName, valueType
    local fco1, fco2, fco3, fcx1
    if is64 then fco1=24 fco2=8 fco3=16 fcx1=32
    else fco1=12 fco2=4 fco3=8 fcx1=4 end

    gg.clearResults()
    gg.setRanges(gg.REGION_C_DATA | gg.REGION_C_ALLOC | gg.REGION_ANONYMOUS | gg.REGION_OTHER)
    local len = #f
    gg.searchNumber(":" .. f, 1)
    if gg.getResultsCount() == 0 then return false end

    local fbfc = gg.getResults(1)
    gg.refineNumber(fbfc[1].value, 1)
    fbfc = gg.getResults(gg.getResultsCount())

    local nfbx = {}
    for i, v in ipairs(fbfc) do
        nfbx[i] = {address = v.address + len, flags = 1}
    end
    gg.loadResults(nfbx)
    gg.refineNumber(0, 1)
    if gg.getResultsCount() == 0 then return false end

    fbfc = gg.getResults(gg.getResultsCount())
    nfbx = {}
    for i, v in ipairs(fbfc) do
        nfbx[i] = {address = v.address - (len + 1), flags = 1}
    end
    gg.loadResults(nfbx)
    gg.refineNumber(0, 1)
    if gg.getResultsCount() == 0 then return false end

    fbfc = gg.getResults(gg.getResultsCount())
    nfbx = {}
    for i, v in ipairs(fbfc) do
        nfbx[i] = {address = v.address + 1, flags = 1}
    end
    gg.loadResults(nfbx)
    gg.searchPointer(0)
    if gg.getResultsCount() == 0 then return false end

    local fpfc = gg.getResults(gg.getResultsCount())
    gg.clearResults()
    local fofc = {}
    for i, v in ipairs(fpfc) do
        fofc[i] = {address = v.address + fco1, flags = 4}
    end
    gg.loadResults(fofc)
    gg.refineNumber("4~5000", 4)
    if gg.getResultsCount() == 0 then return false end

    fofc = gg.getResults(gg.getResultsCount())
    gg.clearResults()
    local fcfc = {}
    for i, v in ipairs(fofc) do
        fcfc[i] = {address = v.address - fco2, flags = fcx1}
    end
    fcfc = gg.getValues(fcfc)
    local hcfc = {}
    for i, v in ipairs(fcfc) do
        hcfc[i] = {flags = fcx1}
        if is64 then
            local HCFC = string.format("%X", tostring(v.value))
            if #HCFC >= 12 then HCFC = string.sub(HCFC, 3, -1) end
            hcfc[i].address = tonumber("0x" .. HCFC) + fco3
        else
            hcfc[i].address = v.value + fco3
        end
    end
    hcfc = gg.getValues(hcfc)

    local foundOffset, matchedI = nil, nil
    for i, v in ipairs(hcfc) do
        local cnfc = {}
        for c = 1, 50 do
            cnfc[c] = {address = v.value + c - 1, flags = 1}
        end
        cnfc = gg.getValues(cnfc)
        local csfc = {}
        for c = 1, 50 do
            if cnfc[c].value > 32 and cnfc[c].value < 127 then
                csfc[c] = string.char(cnfc[c].value)
            else
                csfc = table.concat(csfc)
                if csfc == x then
                    foundOffset = tonumber(fofc[i].value)
                    matchedI = i
                    break
                else
                    break
                end
            end
        end
        if foundOffset then break end
    end

    if foundOffset and matchedI then
        gg.clearResults()
        gg.setRanges(gg.REGION_ANONYMOUS)
        gg.searchNumber(fcfc[matchedI].value, fcx1)
        if gg.getResultsCount() == 0 then return false end
        local base = gg.getResults(gg.getResultsCount())
        local addrs = {}
        for _, addr in ipairs(base) do
            addrs[#addrs + 1] = {address = addr.address + foundOffset, flags = t}
        end
        gg.loadResults(addrs)
        return true
    else
        return false
    end
end

-- =============================================
-- Modify Field
-- =============================================
function modifyField(fieldConfig)
    gg.setVisible(false)
    local found = searchByFieldName(fieldConfig.className, fieldConfig.fieldName, fieldConfig.type)
    if not found then
        gg.alert("Field not found: " .. fieldConfig.fieldName)
        gg.setVisible(true)
        return
    end

    if fieldConfig.refine then
        local refine = gg.prompt(
            {"Enter CURRENT value (leave empty to skip refine):"},
            {""},
            {"number"}
        )
        if refine == nil then
            gg.clearResults()
            gg.setVisible(true)
            return
        end
        local curVal = refine[1]
        if curVal ~= "" then
            local num = tonumber(curVal)
            if num then
                gg.refineNumber(tostring(num), fieldConfig.type)
                if gg.getResultsCount() == 0 then
                    gg.alert("No results match value " .. curVal)
                    gg.clearResults()
                    gg.setVisible(true)
                    return
                end
            end
        end
    end

    local results = gg.getResults(gg.getResultsCount())
    if #results == 0 then
        gg.alert("No addresses found")
        gg.clearResults()
        gg.setVisible(true)
        return
    end

    local newPrompt = gg.prompt(
        {"New value:", "Freeze? (0 = No, 1 = Yes)"},
        {tostring(fieldConfig.default), fieldConfig.freezeDefault and "1" or "0"},
        {"number", "checkbox"}
    )
    if newPrompt == nil then
        gg.clearResults()
        gg.setVisible(true)
        return
    end

    local newVal = tonumber(newPrompt[1])
    local freeze = tonumber(newPrompt[2]) == 1

    for _, item in ipairs(results) do
        item.value = newVal
        item.freeze = freeze
        item.name = fieldConfig.name
    end
    gg.addListItems(results)
    gg.setValues(results)
    gg.toast("Modified " .. fieldConfig.name .. " (" .. #results .. " addresses)")
    gg.setVisible(true)
end

-- =============================================
-- Field Definitions
-- =============================================
local fields = {
`;

        cheatBoxes.forEach((box) => {
            const name = box.querySelector('.c-name').value || "Cheat";
            const className = box.querySelector('.c-class').value || "ClassName";
            const fieldName = box.querySelector('.c-field').value || "fieldName";
            const dataType = box.querySelector('.c-datatype').value || "4";
            const defaultValue = box.querySelector('.c-val').value || "0";
            const freeze = box.querySelector('.c-freeze').checked;
            const refine = box.querySelector('.c-refine').checked;

            const defaultNum = isNaN(Number(defaultValue)) ? `"${defaultValue}"` : defaultValue;

            lua += `    {name = "${name}", className = "${className}", fieldName = "${fieldName}", type = ${dataType}, default = ${defaultNum}, freezeDefault = ${freeze}, refine = ${refine}},\n`;
        });

        lua += `}\n\n`;

        if (includeSpeed) {
            lua += `
-- =============================================
-- Speed Hack Menu
-- =============================================
function speedhackSliderMenu()
    gg.setVisible(false) local tryx2 = 1 local REG = 1 local t1, t2, t3, SPEED = {}, {}, {}, {} local O1, O2 = 20, 28 local TRY = 1
    ::XREGION:: 
    if REG == 1 then gg.setRanges(gg.REGION_ANONYMOUS) elseif REG == 2 then gg.setRanges(gg.REGION_C_ALLOC) elseif REG == 3 then gg.setRanges(gg.REGION_C_DATA) elseif REG == 4 then gg.setRanges(gg.REGION_OTHER) end
    gg.clearResults() gg.searchNumber("3F7FFFFEh", 4)
    if gg.getResultsCount() == 0 and REG < 4 then REG = REG + 1 goto XREGION return end 
    if gg.getResultsCount() == 0 and REG == 4 then gg.alert("Speed value not found") gg.setVisible(true) return end 
    local res = gg.getResults(gg.getResultsCount()) gg.clearResults() 
    ::TRYAGAIN_SPEED::
    for i, val in ipairs(res) do t1[i] = {} t2[i] = {} t1[i].address = val.address + O1 t1[i].flags = 32 t2[i].address = val.address + O2 t2[i].flags = 32 end
    local x = 0 t1 = gg.getValues(t1) gg.sleep(150) t2 = gg.getValues(t2)
    for i, val in ipairs(t1) do
        if #(tostring(val.value)) < 7 and val.value > 100 and t2[i].value < val.value + 250 and t2[i].value > val.value then
            x = x + 1 t3[x] = {} t3[x].address = val.address t3[x].flags = 16
        end
    end 
    if x == 0 and TRY == 1 then O1 = 16 O2 = 24 TRY = TRY + 1 goto TRYAGAIN_SPEED return end 
    if x == 0 and TRY == 2 then O1 = 24 O2 = 32 TRY = TRY + 1 goto TRYAGAIN_SPEED return end   
    if x == 0 and TRY == 3 and REG < 4 then REG = REG + 1 goto XREGION return end 
    if x == 0 and TRY == 3 and REG == 4 and tryx2 == 1 then tryx2 = 2 goto XREGION return end 
    if x == 0 and TRY == 3 and REG == 4 and tryx2 == 2 then gg.alert("Time pointer not found") gg.setVisible(true) return end 
    x = 0
    for z = 1, 35 do 
        for i, val in ipairs(t3) do val.address = val.address + 4 val.flags = 16 end 
        t3 = gg.getValues(t3)
        for i, val in ipairs(t3) do if val.value == 1 then x = x + 1 SPEED[x] = {} SPEED[x].address = val.address SPEED[x].flags = 16 end end
    end 
    if x == 0 and REG < 4 then REG = REG + 1 goto XREGION return end 
    if x == 0 and REG == 4 then gg.alert("Speed value not found") gg.setVisible(true) return end      
    gg.loadResults(SPEED) gg.setVisible(true)  
    while true do
        local currentResCount = gg.getResultsCount()
        if currentResCount == 0 then gg.alert("Speed addresses lost") break end
        local speedInput = gg.prompt({"Set game speed (default 1.0):"}, {"1.0"}, {"number"})
        if not speedInput then break end
        local targetSpeed = tonumber(speedInput[1])
        if targetSpeed then
            local speedValues = gg.getResults(currentResCount)
            for i, val in ipairs(speedValues) do val.value = targetSpeed val.flags = 16 end
            gg.setValues(speedValues) gg.toast("Speed set to: " .. targetSpeed)
        end
        local action = gg.choice({"Change speed", "Back to menu"}, nil, "Current speed: " .. targetSpeed)
        if action == 2 or action == nil then break end
    end
end
`;
        }

        lua += `
-- =============================================
-- Main Menu
-- =============================================
function main()
    while true do
        local arch = is64 and "64-bit" or "32-bit"
        local title = "=== " .. gameName .. " | " .. arch .. " ===\\n" ..
                      "Select a cheat:"

        local choices = {}
        for _, f in ipairs(fields) do
            table.insert(choices, f.name)
        end
`;

        if (includeSpeed) {
            lua += `        table.insert(choices, "⚡ Speed Hack")\n`;
        }

        lua += `        table.insert(choices, "❌ Exit")\n\n`;
        lua += `        local choice = gg.choice(choices, nil, title)\n`;
        lua += `        if choice == nil then os.exit() end\n\n`;

        let fieldCount = cheatBoxes.length;
        for (let i = 1; i <= fieldCount; i++) {
            lua += `        if choice == ${i} then\n`;
            lua += `            modifyField(fields[${i}])\n`;
            lua += `        \n`;
        }

        if (includeSpeed) {
            lua += `        elseif choice == ${fieldCount + 1} then\n`;
            lua += `            speedhackSliderMenu()\n`;
            lua += `        \n`;
            lua += `        elseif choice == ${fieldCount + 2} then\n`;
        } else {
            lua += `        elseif choice == ${fieldCount + 1} then\n`;
        }

        lua += `            gg.clearList()\n`;
        lua += `            gg.setVisible(true)\n`;
        lua += `            os.exit()\n`;
        lua += `        end\n`;
        lua += `    end\n`;
        lua += `end\n\n`;
        lua += `main()\n`;

        return lua;
    }

    // ---------- RC4 Implementation (JavaScript) ----------
    function rc4Encrypt(plainText, key) {
        // Convert key string to bytes
        let keyBytes = [];
        for (let i = 0; i < key.length; i++) {
            keyBytes.push(key.charCodeAt(i) & 0xFF);
        }
        let s = [];
        for (let i = 0; i < 256; i++) s[i] = i;
        let j = 0;
        for (let i = 0; i < 256; i++) {
            j = (j + s[i] + keyBytes[i % keyBytes.length]) % 256;
            [s[i], s[j]] = [s[j], s[i]];
        }
        let i = 0;
        j = 0;
        let cipher = [];
        for (let k = 0; k < plainText.length; k++) {
            i = (i + 1) % 256;
            j = (j + s[i]) % 256;
            [s[i], s[j]] = [s[j], s[i]];
            let t = (s[i] + s[j]) % 256;
            let byte = plainText.charCodeAt(k) & 0xFF;
            cipher.push(byte ^ s[t]);
        }
        // Convert to hex string
        return cipher.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function buildRC4Loader(hexPayload, keyString) {
        // Hide key by splitting into numbers and XORing with constant
        let keyBytes = [];
        for (let i = 0; i < keyString.length; i++) {
            keyBytes.push(keyString.charCodeAt(i) & 0xFF);
        }
        // XOR each byte with 0xAA, then store as decimal numbers
        let hiddenKey = keyBytes.map(b => (b ^ 0xAA).toString(10)).join(',');
        
        return `-- RC4 Protected Script Loader
local hiddenKey = {${hiddenKey}}
local key = ""
for i = 1, #hiddenKey do
    key = key .. string.char(hiddenKey[i] ~ 0xAA)
end

local payload = "${hexPayload}"
local function rc4(key, data)
    local s = {}
    for i = 0, 255 do s[i] = i end
    local j = 0
    for i = 0, 255 do
        j = (j + s[i] + key:byte(i % #key + 1)) % 256
        s[i], s[j] = s[j], s[i]
    end
    local i, j = 0, 0
    local out = {}
    for k = 1, #data, 2 do
        i = (i + 1) % 256
        j = (j + s[i]) % 256
        s[i], s[j] = s[j], s[i]
        local t = (s[i] + s[j]) % 256
        local byte = tonumber(data:sub(k, k+1), 16)
        out[#out+1] = string.char(byte ~ s[t])
    end
    return table.concat(out)
end
local code = rc4(key, payload)
local f = loadstring or load
f(code)()
`;
    }

    function buildFinalLua() {
        const plain = buildPlainLua();
        const enableRC4 = document.getElementById('enableRC4').checked;
        if (!enableRC4) {
            return plain;
        }
        const key = document.getElementById('rc4Key').value || "DefaultKey";
        const hexPayload = rc4Encrypt(plain, key);
        return buildRC4Loader(hexPayload, key);
    }

    function generateRandomKey() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+';
        let key = '';
        for (let i = 0; i < 16; i++) {
            key += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('rc4Key').value = key;
        updateLivePreview();
    }

    function updateLivePreview() {
        const terminal = document.getElementById('terminalOutput');
        const code = buildFinalLua();
        terminal.innerText = code;
    }

    function generateAndDownload() {
        const terminal = document.getElementById('terminalOutput');
        terminal.innerText = "[*] Initializing RC4 engine...\n[*] Parsing cheat definitions...\n[*] Encrypting payload with RC4...\n[*] Building loader stub...\n";
        
        setTimeout(() => {
            terminal.innerText += "[*] Verifying integrity...\n";
        }, 400);

        setTimeout(() => {
            terminal.innerText += "[*] Finalizing script...\n";
            const code = buildFinalLua();
            
            setTimeout(() => {
                terminal.innerText += "[+] Success! Encrypted script generated.\n[+] Download started automatically.";
                
                const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
