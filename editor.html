<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ سكريبتات GameGuardian - طريقة الحقل</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --panel-bg: #030712;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --text: #f3f4f6;
            --border: #1f2937;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
        }
        .control-panel {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }
        .output-panel-container {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        h1, h2, h3 { color: var(--accent); margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        input, select {
            width: 100%;
            padding: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .cheat-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #374151;
            margin-bottom: 15px;
            position: relative;
        }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: #374151; margin-top: 5px; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-danger { background: var(--danger); width: auto; padding: 4px 8px; font-size: 11px; position: absolute; top: 10px; left: 10px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .checkbox-group input { width: auto; }
        
        .terminal {
            background: var(--panel-bg);
            color: #38bdf8;
            font-family: monospace;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-grow: 1;
            height: 450px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
        }
        .terminal-header {
            color: #ef4444;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="control-panel">
        <h1>🛠️ منشئ سكريبتات بطريقة الحقل (Field)</h1>
        
        <div class="form-group">
            <label>عنوان السكريبت العام:</label>
            <input type="text" id="scriptTitle" value="قائمة الهاكات - طريقة الحقل" oninput="updateLivePreview()">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="includeSpeedhack" checked onchange="updateLivePreview()">
            <label for="includeSpeedhack" style="margin-bottom:0;">تضمين خاصية السرعة (Speedhack + Slider)</label>
        </div>

        <hr style="border-color: var(--border); margin: 20px 0;">

        <h2>📋 قائمة الخصائص (Field Cheats)</h2>
        <div id="cheatsContainer">
            <!-- يتم إضافة الخصائص هنا -->
        </div>

        <button class="btn btn-secondary" onclick="addCheat()">➕ إضافة خاصية جديدة</button>
        <br><br>
        <button class="btn" onclick="generateAndDownload()">🚀 بدء الإنشاء والتحميل (Build Script)</button>
    </div>

    <div class="output-panel-container">
        <div class="terminal-header">[OUTPUT PANEL - LIVE PREVIEW & LOGS]</div>
        <div id="terminalOutput" class="terminal">
            Dumper: FieldName Engine | Generator: Ready...
            Waiting for configuration...
        </div>
        <button class="btn btn-secondary" style="margin-top: 10px;" onclick="updateLivePreview()">🔄 تحديث المعاينة الحية</button>
    </div>
</div>

<script>
    window.onload = function() {
        addCheat(); // إضافة خاصية افتراضية
    };

    function addCheat() {
        const container = document.getElementById('cheatsContainer');
        const index = container.children.length + 1;
        
        const div = document.createElement('div');
        div.className = 'cheat-box';
        div.innerHTML = `
            <button class="btn btn-danger" onclick="this.parentElement.remove(); updateLivePreview();">حذف</button>
            <h3>خاصية #${index}</h3>
            <div class="form-group" style="margin-bottom:8px;">
                <label>اسم الخاصية (يظهر في القائمة):</label>
                <input type="text" class="c-name" value="طاقة غير محدودة" oninput="updateLivePreview()">
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label>اسم الكلاس (Class Name):</label>
                <input type="text" class="c-class" value="PlayerController" oninput="updateLivePreview()">
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label>اسم الحقل (Field Name):</label>
                <input type="text" class="c-field" value="health" oninput="updateLivePreview()">
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label>نوع البيانات:</label>
                <select class="c-datatype" onchange="updateLivePreview()">
                    <option value="1">1 = Byte / Bool</option>
                    <option value="2">2 = Word</option>
                    <option value="4" selected>4 = Dword</option>
                    <option value="16">16 = Float</option>
                    <option value="32">32 = Double</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label>القيمة الافتراضية:</label>
                <input type="text" class="c-val" value="999" oninput="updateLivePreview()">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" class="c-freeze" checked onchange="updateLivePreview()">
                <label style="margin-bottom:0;">تجميد القيمة (Freeze)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" class="c-refine" checked onchange="updateLivePreview()">
                <label style="margin-bottom:0;">تنقية القيمة الحالية (Refine by current value)</label>
            </div>
        `;
        container.appendChild(div);
        updateLivePreview();
    }

    function buildLuaCode() {
        const title = document.getElementById('scriptTitle').value;
        const includeSpeed = document.getElementById('includeSpeedhack').checked;
        const cheatBoxes = document.querySelectorAll('.cheat-box');

        // بداية الكود
        let lua = `-- ==========================================
-- ${title}
-- Auto-Generated by FieldName Script Builder
-- ==========================================

local v = gg.getTargetInfo()
if not v or not v.packageName then
    gg.alert("❌ خطأ: يرجى تحديد اللعبة في GameGuardian أولاً!")
    os.exit()
end

local is64 = v.x64
local gameName = v.label or "Unknown Game"
local packageName = v.packageName

-- =============================================
-- دالة البحث بالحقل (Field Name) - مطابقة لسكربت TrainMiner
-- =============================================
function searchByFieldName(className, fieldName, valueType)
    local x, f, t = className, fieldName, valueType
    local fco1, fco2, fco3, fcx1
    if is64 then fco1=24 fco2=8 fco3=16 fcx1=32
    else fco1=12 fco2=4 fco3=8 fcx1=4 end

    gg.clearResults()
    gg.setRanges(gg.REGION_C_DATA | gg.REGION_C_ALLOC | gg.REGION_ANONYMOUS | gg.REGION_OTHER)
    local len = #f
    gg.searchNumber(":" .. f, 1)
    if gg.getResultsCount() == 0 then return false end

    local fbfc = gg.getResults(1)
    gg.refineNumber(fbfc[1].value, 1)
    fbfc = gg.getResults(gg.getResultsCount())

    local nfbx = {}
    for i, v in ipairs(fbfc) do
        nfbx[i] = {address = v.address + len, flags = 1}
    end
    gg.loadResults(nfbx)
    gg.refineNumber(0, 1)
    if gg.getResultsCount() == 0 then return false end

    fbfc = gg.getResults(gg.getResultsCount())
    nfbx = {}
    for i, v in ipairs(fbfc) do
        nfbx[i] = {address = v.address - (len + 1), flags = 1}
    end
    gg.loadResults(nfbx)
    gg.refineNumber(0, 1)
    if gg.getResultsCount() == 0 then return false end

    fbfc = gg.getResults(gg.getResultsCount())
    nfbx = {}
    for i, v in ipairs(fbfc) do
        nfbx[i] = {address = v.address + 1, flags = 1}
    end
    gg.loadResults(nfbx)
    gg.searchPointer(0)
    if gg.getResultsCount() == 0 then return false end

    local fpfc = gg.getResults(gg.getResultsCount())
    gg.clearResults()
    local fofc = {}
    for i, v in ipairs(fpfc) do
        fofc[i] = {address = v.address + fco1, flags = 4}
    end
    gg.loadResults(fofc)
    gg.refineNumber("4~5000", 4)
    if gg.getResultsCount() == 0 then return false end

    fofc = gg.getResults(gg.getResultsCount())
    gg.clearResults()
    local fcfc = {}
    for i, v in ipairs(fofc) do
        fcfc[i] = {address = v.address - fco2, flags = fcx1}
    end
    fcfc = gg.getValues(fcfc)
    local hcfc = {}
    for i, v in ipairs(fcfc) do
        hcfc[i] = {flags = fcx1}
        if is64 then
            local HCFC = string.format("%X", tostring(v.value))
            if #HCFC >= 12 then HCFC = string.sub(HCFC, 3, -1) end
            hcfc[i].address = tonumber("0x" .. HCFC) + fco3
        else
            hcfc[i].address = v.value + fco3
        end
    end
    hcfc = gg.getValues(hcfc)

    local foundOffset, matchedI = nil, nil
    for i, v in ipairs(hcfc) do
        local cnfc = {}
        for c = 1, 50 do
            cnfc[c] = {address = v.value + c - 1, flags = 1}
        end
        cnfc = gg.getValues(cnfc)
        local csfc = {}
        for c = 1, 50 do
            if cnfc[c].value > 32 and cnfc[c].value < 127 then
                csfc[c] = string.char(cnfc[c].value)
            else
                csfc = table.concat(csfc)
                if csfc == x then
                    foundOffset = tonumber(fofc[i].value)
                    matchedI = i
                    break
                else
                    break
                end
            end
        end
        if foundOffset then break end
    end

    if foundOffset and matchedI then
        gg.clearResults()
        gg.setRanges(gg.REGION_ANONYMOUS)
        gg.searchNumber(fcfc[matchedI].value, fcx1)
        if gg.getResultsCount() == 0 then return false end
        local base = gg.getResults(gg.getResultsCount())
        local addrs = {}
        for _, addr in ipairs(base) do
            addrs[#addrs + 1] = {address = addr.address + foundOffset, flags = t}
        end
        gg.loadResults(addrs)
        return true
    else
        return false
    end
end

-- =============================================
-- دالة تعديل الحقل (مع تنقية وتجميد)
-- =============================================
function modifyField(fieldConfig)
    gg.setVisible(false)
    local found = searchByFieldName(fieldConfig.className, fieldConfig.fieldName, fieldConfig.type)
    if not found then
        gg.alert("لم يتم العثور على الحقل: " .. fieldConfig.fieldName)
        gg.setVisible(true)
        return
    end

    -- تنقية اختيارية حسب القيمة الحالية
    if fieldConfig.refine then
        local refine = gg.prompt(
            {"أدخل القيمة الحالية (اتركه فارغًا لتخطي التنقية):"},
            {""},
            {"number"}
        )
        if refine == nil then
            gg.clearResults()
            gg.setVisible(true)
            return
        end
        local curVal = refine[1]
        if curVal ~= "" then
            local num = tonumber(curVal)
            if num then
                gg.refineNumber(tostring(num), fieldConfig.type)
                if gg.getResultsCount() == 0 then
                    gg.alert("لا توجد نتائج تطابق القيمة " .. curVal)
                    gg.clearResults()
                    gg.setVisible(true)
                    return
                end
            end
        end
    end

    local results = gg.getResults(gg.getResultsCount())
    if #results == 0 then
        gg.alert("لا توجد عناوين")
        gg.clearResults()
        gg.setVisible(true)
        return
    end

    -- طلب القيمة الجديدة والتجميد
    local newPrompt = gg.prompt(
        {"القيمة الجديدة:", "تجميد؟ (0 = لا، 1 = نعم)"},
        {tostring(fieldConfig.default), fieldConfig.freezeDefault and "1" or "0"},
        {"number", "checkbox"}
    )
    if newPrompt == nil then
        gg.clearResults()
        gg.setVisible(true)
        return
    end

    local newVal = tonumber(newPrompt[1])
    local freeze = tonumber(newPrompt[2]) == 1

    for _, item in ipairs(results) do
        item.value = newVal
        item.freeze = freeze
        item.name = fieldConfig.name
    end
    gg.addListItems(results)
    gg.setValues(results)
    gg.toast("تم تعديل " .. fieldConfig.name .. " (" .. #results .. " عنوان)")
    gg.setVisible(true)
end

-- =============================================
-- تعريف الخصائص (من إدخال المستخدم)
-- =============================================
local fields = {
`;

        // توليد جدول الخصائص
        cheatBoxes.forEach((box) => {
            const name = box.querySelector('.c-name').value || "خاصية";
            const className = box.querySelector('.c-class').value || "ClassName";
            const fieldName = box.querySelector('.c-field').value || "fieldName";
            const dataType = box.querySelector('.c-datatype').value || "4";
            const defaultValue = box.querySelector('.c-val').value || "0";
            const freeze = box.querySelector('.c-freeze').checked;
            const refine = box.querySelector('.c-refine').checked;

            // تحويل القيمة الافتراضية إلى رقم إذا أمكن
            const defaultNum = isNaN(Number(defaultValue)) ? `"${defaultValue}"` : defaultValue;

            lua += `    {name = "${name}", className = "${className}", fieldName = "${fieldName}", type = ${dataType}, default = ${defaultNum}, freezeDefault = ${freeze}, refine = ${refine}},\n`;
        });

        lua += `}\n\n`;

        // إضافة دالة السرعة إذا كانت مفعلة
        if (includeSpeed) {
            lua += `
-- =============================================
-- قائمة التحكم بالسرعة (Speedhack)
-- =============================================
function speedhackSliderMenu()
    gg.setVisible(false) local tryx2 = 1 local REG = 1 local t1, t2, t3, SPEED = {}, {}, {}, {} local O1, O2 = 20, 28 local TRY = 1
    ::XREGION:: 
    if REG == 1 then gg.setRanges(gg.REGION_ANONYMOUS) elseif REG == 2 then gg.setRanges(gg.REGION_C_ALLOC) elseif REG == 3 then gg.setRanges(gg.REGION_C_DATA) elseif REG == 4 then gg.setRanges(gg.REGION_OTHER) end
    gg.clearResults() gg.searchNumber("3F7FFFFEh", 4)
    if gg.getResultsCount() == 0 and REG < 4 then REG = REG + 1 goto XREGION return end 
    if gg.getResultsCount() == 0 and REG == 4 then gg.alert("❌ لم يتم العثور على سرعة اللعبة") gg.setVisible(true) return end 
    local res = gg.getResults(gg.getResultsCount()) gg.clearResults() 
    ::TRYAGAIN_SPEED::
    for i, val in ipairs(res) do t1[i] = {} t2[i] = {} t1[i].address = val.address + O1 t1[i].flags = 32 t2[i].address = val.address + O2 t2[i].flags = 32 end
    local x = 0 t1 = gg.getValues(t1) gg.sleep(150) t2 = gg.getValues(t2)
    for i, val in ipairs(t1) do
        if #(tostring(val.value)) < 7 and val.value > 100 and t2[i].value < val.value + 250 and t2[i].value > val.value then
            x = x + 1 t3[x] = {} t3[x].address = val.address t3[x].flags = 16
        end
    end 
    if x == 0 and TRY == 1 then O1 = 16 O2 = 24 TRY = TRY + 1 goto TRYAGAIN_SPEED return end 
    if x == 0 and TRY == 2 then O1 = 24 O2 = 32 TRY = TRY + 1 goto TRYAGAIN_SPEED return end   
    if x == 0 and TRY == 3 and REG < 4 then REG = REG + 1 goto XREGION return end 
    if x == 0 and TRY == 3 and REG == 4 and tryx2 == 1 then tryx2 = 2 goto XREGION return end 
    if x == 0 and TRY == 3 and REG == 4 and tryx2 == 2 then gg.alert("❌ لم يتم العثور على مؤشر الوقت") gg.setVisible(true) return end 
    x = 0
    for z = 1, 35 do 
        for i, val in ipairs(t3) do val.address = val.address + 4 val.flags = 16 end 
        t3 = gg.getValues(t3)
        for i, val in ipairs(t3) do if val.value == 1 then x = x + 1 SPEED[x] = {} SPEED[x].address = val.address SPEED[x].flags = 16 end end
    end 
    if x == 0 and REG < 4 then REG = REG + 1 goto XREGION return end 
    if x == 0 and REG == 4 then gg.alert("❌ لم يتم العثور على قيمة السرعة") gg.setVisible(true) return end      
    gg.loadResults(SPEED) gg.setVisible(true)  
    while true do
        local currentResCount = gg.getResultsCount()
        if currentResCount == 0 then gg.alert("❌ فقدان عناوين السرعة") break end
        local speedInput = gg.prompt({"⚡ تحكم في سرعة اللعبة (القيمة الافتراضية 1.0):"}, {"1.0"}, {"number"})
        if not speedInput then break end
        local targetSpeed = tonumber(speedInput[1])
        if targetSpeed then
            local speedValues = gg.getResults(currentResCount)
            for i, val in ipairs(speedValues) do val.value = targetSpeed val.flags = 16 end
            gg.setValues(speedValues) gg.toast("🚀 تمت السرعة على: " .. targetSpeed)
        end
        local action = gg.choice({"🔄 تعديل السرعة", "🔙 العودة للقائمة"}, nil, "⚙️ السرعة الحالية: " .. targetSpeed)
        if action == 2 or action == nil then break end
    end
end
`;
        }

        // الدالة الرئيسية
        lua += `
-- =============================================
-- القائمة الرئيسية
-- =============================================
function main()
    while true do
        local arch = is64 and "64-bit" or "32-bit"
        local title = "=== " .. gameName .. " | " .. arch .. " ===\\n" ..
                      "اختر الخاصية المطلوبة:"

        local choices = {}
        for _, f in ipairs(fields) do
            table.insert(choices, f.name)
        end
`;

        if (includeSpeed) {
            lua += `        table.insert(choices, "⚡ تسريع اللعبة (Speed Hack)")\n`;
        }

        lua += `        table.insert(choices, "❌ خروج")\n\n`;
        lua += `        local choice = gg.choice(choices, nil, title)\n`;
        lua += `        if choice == nil then os.exit() end\n\n`;

        // ربط الاختيارات
        let fieldCount = cheatBoxes.length;
        let currentIndex = 1;
        for (let i = 1; i <= fieldCount; i++) {
            lua += `        if choice == ${i} then\n`;
            lua += `            modifyField(fields[${i}])\n`;
            lua += `        \n`;
        }

        if (includeSpeed) {
            lua += `        elseif choice == ${fieldCount + 1} then\n`;
            lua += `            speedhackSliderMenu()\n`;
            lua += `        \n`;
            lua += `        elseif choice == ${fieldCount + 2} then\n`;
        } else {
            lua += `        elseif choice == ${fieldCount + 1} then\n`;
        }

        lua += `            gg.clearList()\n`;
        lua += `            gg.setVisible(true)\n`;
        lua += `            os.exit()\n`;
        lua += `        end\n`;
        lua += `    end\n`;
        lua += `end\n\n`;
        lua += `main()\n`;

        return lua;
    }

    function updateLivePreview() {
        const terminal = document.getElementById('terminalOutput');
        const code = buildLuaCode();
        terminal.innerText = code;
    }

    function generateAndDownload() {
        const terminal = document.getElementById('terminalOutput');
        terminal.innerText = "[*] Initializing field-name engine...\n[*] Parsing cheat definitions...\n[*] Injecting searchByFieldName signature...\n[*] Compiling Lua bytecode structure...\n";
        
        setTimeout(() => {
            terminal.innerText += "[*] Verifying memory boundaries and offsets...\n";
        }, 400);

        setTimeout(() => {
            terminal.innerText += "[*] Building interactive menu loop...\n";
            const code = buildLuaCode();
            
            setTimeout(() => {
                terminal.innerText += "[+] Task Completed Successfully!\n[+] Lua script generated and download started automatically.";
                
                const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'FieldName_GameGuardian_Script.lua';
                link.click();
            }, 600);
        }, 800);
    }
</script>

</body>
</html>
