<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameGuardian Script Builder - AES-256 Protected</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --panel-bg: #030712;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --text: #f3f4f6;
            --border: #1f2937;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
        }
        .control-panel {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }
        .output-panel-container {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        h1, h2, h3 { color: var(--accent); margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        input, select {
            width: 100%;
            padding: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .cheat-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #374151;
            margin-bottom: 15px;
            position: relative;
        }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: #374151; margin-top: 5px; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-danger { background: var(--danger); width: auto; padding: 4px 8px; font-size: 11px; position: absolute; top: 10px; left: 10px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .checkbox-group input { width: auto; }
        .terminal {
            background: var(--panel-bg);
            color: #38bdf8;
            font-family: monospace;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-grow: 1;
            height: 450px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
        }
        .terminal-header {
            color: #ef4444;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="control-panel">

        let lua = `-- ==========================================

-- Field Name Search (TrainMiner style)

function searchByFieldName(className, fieldName, valueType)
    local x, f, t = className, fieldName, valueType
    local fco1, fco2, fco3, fcx1
    if is64 then fco1=24 fco2=8 fco3=16 fcx1=32
    else fco1=12 fco2=4 fco3=8 fcx1=4 end

    gg.clearResults()
    gg.setRanges(gg.REGION_C_DATA | gg.REGION_C_ALLOC | gg.REGION_ANONYMOUS | gg.REGION_OTHER)
    local len = #f
    gg.searchNumber(":" .. f, 1)
    if gg.getResultsCount() == 0 then return false end

    local fbfc = gg.getResults(1)
    gg.refineNumber(fbfc[1].value, 1)
    fbfc = gg.getResults(gg.getResultsCount())

    local nfbx = {}
    for i, v in ipairs(fbfc) do
        nfbx[i] = {address = v.address + len, flags = 1}
    end
    gg.loadResults(nfbx)
    gg.refineNumber(0, 1)
    if gg.getResultsCount() == 0 then return false end

    fbfc = gg.getResults(gg.getResultsCount())
    nfbx = {}
    for i, v in ipairs(fbfc) do
        nfbx[i] = {address = v.address - (len + 1), flags = 1}
    end
    gg.loadResults(nfbx)
    gg.refineNumber(0, 1)
    if gg.getResultsCount() == 0 then return false end

    fbfc = gg.getResults(gg.getResultsCount())
    nfbx = {}
    for i, v in ipairs(fbfc) do
        nfbx[i] = {address = v.address + 1, flags = 1}
    end
    gg.loadResults(nfbx)
    gg.searchPointer(0)
    if gg.getResultsCount() == 0 then return false end

    local fpfc = gg.getResults(gg.getResultsCount())
    gg.clearResults()
    local fofc = {}
    for i, v in ipairs(fpfc) do
        fofc[i] = {address = v.address + fco1, flags = 4}
    end
    gg.loadResults(fofc)
    gg.refineNumber("4~5000", 4)
    if gg.getResultsCount() == 0 then return false end

    fofc = gg.getResults(gg.getResultsCount())
    gg.clearResults()
    local fcfc = {}
    for i, v in ipairs(fofc) do
        fcfc[i] = {address = v.address - fco2, flags = fcx1}
    end
    fcfc = gg.getValues(fcfc)
    local hcfc = {}
    for i, v in ipairs(fcfc) do
        hcfc[i] = {flags = fcx1}
        if is64 then
            local HCFC = string.format("%X", tostring(v.value))
            if #HCFC >= 12 then HCFC = string.sub(HCFC, 3, -1) end
            hcfc[i].address = tonumber("0x" .. HCFC) + fco3
        else
            hcfc[i].address = v.value + fco3
        end
    end
    hcfc = gg.getValues(hcfc)

    local foundOffset, matchedI = nil, nil
    for i, v in ipairs(hcfc) do
        local cnfc = {}
        for c = 1, 50 do
            cnfc[c] = {address = v.value + c - 1, flags = 1}
        end
        cnfc = gg.getValues(cnfc)
        local csfc = {}
        for c = 1, 50 do
            if cnfc[c].value > 32 and cnfc[c].value < 127 then
                csfc[c] = string.char(cnfc[c].value)
            else
                csfc = table.concat(csfc)
                if csfc == x then
                    foundOffset = tonumber(fofc[i].value)
                    matchedI = i
                    break
                else
                    break
                end
            end
        end
        if foundOffset then break end
    end

    if foundOffset and matchedI then
        gg.clearResults()
        gg.setRanges(gg.REGION_ANONYMOUS)
        gg.searchNumber(fcfc[matchedI].value, fcx1)
        if gg.getResultsCount() == 0 then return false end
        local base = gg.getResults(gg.getResultsCount())
        local addrs = {}
        for _, addr in ipairs(base) do
            addrs[#addrs + 1] = {address = addr.address + foundOffset, flags = t}
        end
        gg.loadResults(addrs)
        return true
    else
        return false
    end
end

-- =============================================
-- Modify Field
-- =============================================
function modifyField(fieldConfig)
    gg.setVisible(false)
    local found = searchByFieldName(fieldConfig.className, fieldConfig.fieldName, fieldConfig.type)
    if not found then
        gg.alert("Field not found: " .. fieldConfig.fieldName)
        gg.setVisible(true)
        return
    end

    if fieldConfig.refine then
        local refine = gg.prompt(
            {"Enter CURRENT value (leave empty to skip refine):"},
            {""},
            {"number"}
        )
        if refine == nil then
            gg.clearResults()
            gg.setVisible(true)
            return
        end
        local curVal = refine[1]
        if curVal ~= "" then
            local num = tonumber(curVal)
            if num then
                gg.refineNumber(tostring(num), fieldConfig.type)
                if gg.getResultsCount() == 0 then
                    gg.alert("No results match value " .. curVal)
                    gg.clearResults()
                    gg.setVisible(true)
                    return
                end
            end
        end
    end

    local results = gg.getResults(gg.getResultsCount())
    if #results == 0 then
        gg.alert("No addresses found")
        gg.clearResults()
        gg.setVisible(true)
        return
    end

    local newPrompt = gg.prompt(
        {"New value:", "Freeze? (0 = No, 1 = Yes)"},
        {tostring(fieldConfig.default), fieldConfig.freezeDefault and "1" or "0"},
        {"number", "checkbox"}
    )
    if newPrompt == nil then
        gg.clearResults()
        gg.setVisible(true)
        return
    end

    local newVal = tonumber(newPrompt[1])
    local freeze = tonumber(newPrompt[2]) == 1

    for _, item in ipairs(results) do
        item.value = newVal
        item.freeze = freeze
        item.name = fieldConfig.name
    end
    gg.addListItems(results)
    gg.setValues(results)
    gg.toast("Modified " .. fieldConfig.name .. " (" .. #results .. " addresses)")
    gg.setVisible(true)
end

    // ---------- AES Encryption in Browser ----------
    function aesEncryptChunk(plainText, keyHex) {
        const key = CryptoJS.enc.Hex.parse(keyHex);
        const iv = CryptoJS.lib.WordArray.random(16);
        const encrypted = CryptoJS.AES.encrypt(plainText, key, {
            iv: iv,
            mode: CryptoJS.mode.CBC,
            padding: CryptoJS.pad.Pkcs7
        });
        return iv.toString(CryptoJS.enc.Hex) + encrypted.ciphertext.toString(CryptoJS.enc.Hex);
    }

    function deriveKeyJS(baseKey, chunkIndex) {
        let keyBytes = [];
        let baseBytes = [];
        for (let i = 0; i < baseKey.length; i++) {
            baseBytes.push(baseKey.charCodeAt(i) & 0xFF);
        }
        for (let i = 0; i < 32; i++) {
            let b = baseBytes[i % baseBytes.length] ^ ((chunkIndex * 7 + i * 13) & 0xFF);
            keyBytes.push(b);
        }
        return keyBytes.map(b => b.toString(16).padStart(2, '0')).join('');
    }

            let keyHex = deriveKeyJS(baseKey, i + 1);
            let encHex = aesEncryptChunk(part, keyHex);
            chunks.push(encHex);
        }
        return chunks;
    }

    elseif bit32 then
