<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZI Store - لوحة إدارة السكريبتات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-3xl border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">لوحة تحكم وإدارة السكريبتات - ZI Store</h1>
        
        <div class="mb-4">
            <label class="block mb-2 text-sm font-medium text-gray-300">اسم السكريبت (مثال: animal, pubg, ff)</label>
            <input type="text" id="scriptName" class="w-full p-3 bg-gray-900 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 text-white" placeholder="أدخل اسم السكريبت بالإنجليزية">
        </div>

        <div class="mb-6">
            <label class="block mb-2 text-sm font-medium text-gray-300">كود الـ Lua الخاص بالسكريبت</label>
            <textarea id="scriptCode" rows="12" class="w-full p-3 bg-gray-900 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 font-mono text-sm text-green-400" placeholder="ضع كود الـ Lua هنا..."></textarea>
        </div>

        <button onclick="saveScript()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg transition duration-200 shadow-lg">حفظ أو تحديث السكريبت في القاعدة</button>
        
        <div id="statusMsg" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://kvsyzgavfxnwqmtsginv.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_1uSIqgNONAV53GjOoBoZUw_niAGJXO6";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function saveScript() {
            const name = document.getElementById('scriptName').value.trim().toLowerCase();
            const code = document.getElementById('scriptCode').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!name || !code) {
                statusMsg.textContent = "الرجاء إدخال اسم السكريبت والكود معاً!";
                statusMsg.className = "mt-4 text-center text-sm text-red-400";
                return;
            }

            statusMsg.textContent = "جاري الحفظ والتحديث في السيرفر...";
            statusMsg.className = "mt-4 text-center text-sm text-yellow-400";

            const { error } = await supabaseClient
                .from('scripts')
                .upsert({ 
                    script_name: name, 
                    script_code: code, 
                    updated_at: new Date() 
                }, { onConflict: 'script_name' });

            if (error) {
                statusMsg.textContent = "فشل الحفظ: " + error.message;
                statusMsg.className = "mt-4 text-center text-sm text-red-400";
            } else {
                statusMsg.textContent = "تم حفظ وتحديث السكريبت بنجاح تام وسيعمل لدى المستخدمين فوراً!";
                statusMsg.className = "mt-4 text-center text-sm text-green-400";
            }
        }
    </script>
</body>
</html>
