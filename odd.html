<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zi Store - مباريات وأسعار</title>
    <!-- Widget API-Sports -->
    <script type="module" src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>
    <style>
        /* ===== ROOT ===== */
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-glass: rgba(22, 27, 34, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.3);
            --live: #f85149;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            --header-bg: rgba(13, 17, 23, 0.95);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s ease;
        }
        [data-theme="light"] {
            --bg: #f6f8fa;
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.95);
            --border: rgba(0, 0, 0, 0.08);
            --text: #161b22;
            --text-secondary: #57606a;
            --accent: #0969da;
            --live: #cf222e;
            --header-bg: rgba(255, 255, 255, 0.95);
        }
        [data-theme="legendary"] {
            --bg: #120f0a;
            --surface: #2a241d;
            --surface-glass: rgba(42, 36, 29, 0.95);
            --border: rgba(255, 215, 0, 0.2);
            --text: #f5e6d3;
            --text-secondary: #b8a491;
            --accent: #ff6b00;
            --live: #ff2e2e;
            --header-bg: rgba(18, 15, 10, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: var(--font);
            min-height: 100vh;
            color: var(--text);
            transition: background 0.4s;
        }
        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 22px;
        }
        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #ff6b00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: #0a0a0f;
            box-shadow: 0 0 15px var(--accent-glow);
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .theme-switch {
            display: flex;
            background: var(--surface-glass);
            padding: 3px;
            border-radius: 30px;
            border: 1px solid var(--border);
            gap: 3px;
        }
        .theme-btn {
            padding: 5px 12px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: 0.3s;
        }
        .theme-btn:hover {
            color: var(--text);
            background: rgba(255,255,255,0.1);
        }
        .theme-btn.active {
            background: var(--accent);
            color: #0a0a0f;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* ===== WIDGET ===== */
        api-sports-widget {
            display: block;
            width: 100%;
            margin-bottom: 30px;
        }

        /* ===== ODDS SECTION ===== */
        .odds-section {
            margin-top: 30px;
            border-top: 2px solid var(--border);
            padding-top: 20px;
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title span {
            background: var(--accent);
            color: #0a0a0f;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 14px;
        }
        .odds-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .odds-tabs button {
            background: var(--surface-glass);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 18px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .odds-tabs button.active {
            background: var(--accent);
            color: #0a0a0f;
            border-color: var(--accent);
        }
        .odds-tabs button:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .odds-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-odds-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .match-odds-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .match-odds-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .match-odds-header .league {
            background: var(--surface-glass);
            padding: 0 10px;
            border-radius: 12px;
        }
        .match-odds-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
            padding: 4px 0 8px 0;
        }
        .match-odds-teams .team {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 40%;
        }
        .match-odds-teams .team img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: contain;
            background: rgba(255,255,255,0.05);
        }
        .match-odds-teams .vs {
            color: var(--text-secondary);
            font-weight: 300;
        }
        .match-odds-teams .score {
            font-size: 20px;
            font-weight: 700;
            color: var(--live);
        }
        .odds-row {
            display: flex;
            justify-content: space-around;
            background: var(--surface-glass);
            border-radius: var(--radius-sm);
            padding: 6px 0;
            margin-top: 6px;
        }
        .odd-item {
            text-align: center;
            flex: 1;
            padding: 4px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .odd-item:hover {
            background: rgba(255,255,255,0.05);
        }
        .odd-item .label {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
        }
        .odd-item .value {
            font-size: 16px;
            font-weight: 700;
            color: #facc15;
        }
        .odd-item .value.highlight {
            color: #34d399;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .loading .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: #7f1d1d;
            padding: 15px;
            border-radius: 8px;
            color: #fca5a5;
            text-align: center;
            font-size: 14px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: stretch; }
            .theme-switch { align-self: flex-start; }
            .match-odds-teams { font-size: 14px; flex-wrap: wrap; justify-content: center; gap: 6px; }
            .match-odds-teams .team { max-width: 100%; }
            .odds-row { flex-wrap: wrap; }
            .odd-item { min-width: 60px; }
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">Z</div>
                <span>Zi Store</span>
            </div>
            <div class="theme-switch" id="themeSwitch">
                <button class="theme-btn active" data-theme="dark">🌙 Dark</button>
                <button class="theme-btn" data-theme="light">☀️ Light</button>
                <button class="theme-btn" data-theme="legendary">👑 Legendary</button>
            </div>
        </header>

        <!-- ===== WIDGET API-SPORTS ===== -->
        <api-sports-widget
            data-type="games"
            data-tab="all"
            data-refresh="30"
            data-show-toolbar="true"
            data-games-style="2"
            data-target-game="modal"
            data-target-team="modal"
            data-target-player="modal"
            data-target-standings="modal"
        ></api-sports-widget>

        <!-- ===== ODDS SECTION (من Altenar) ===== -->
        <section class="odds-section" id="oddsSection">
            <div class="section-title">
                📊 الأسعار (1-X-2)
                <span>مباشر وقادم</span>
            </div>

            <div class="odds-tabs" id="oddsTabs">
                <button class="active" data-type="live">🔴 مباشر</button>
                <button data-type="upcoming">📅 قادم</button>
            </div>

            <div id="oddsContainer">
                <div class="loading"><div class="spinner"></div><div>جاري تحميل الأسعار...</div></div>
            </div>
        </section>

        <!-- ===== CONFIG WIDGET (لتفعيل الـ API) ===== -->
        <api-sports-widget
            data-type="config"
            data-key="e227ff90ed4eacc3eacb07eca05ce78b"
            data-sport="football"
            data-lang="ar"
            data-theme="dark"
            data-show-logos="true"
            data-favorite="true"
            data-game-tab="statistics"
            data-target-game="modal"
            data-target-team="modal"
            data-target-player="modal"
            data-target-standings="modal"
            data-target-league="modal"
        ></api-sports-widget>

    </div>

    <script>
        (function() {
            "use strict";

            // ==================== CONFIG ALTENAR PROXY ====================
            const PROXY_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co/functions/v1/altenar-proxy';

            // ==================== THEME ====================
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('zs-theme', theme);
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });
            }
            setTheme(localStorage.getItem('zs-theme') || 'legendary');
            document.getElementById('themeSwitch').addEventListener('click', (e) => {
                const btn = e.target.closest('.theme-btn');
                if (btn) setTheme(btn.dataset.theme);
            });

            // ==================== DOM REFS ====================
            const oddsContainer = document.getElementById('oddsContainer');
            const oddsTabs = document.getElementById('oddsTabs');

            // ==================== HELPERS ====================
            async function fetchFromProxy(endpoint, extraParams = '') {
                let url = `${PROXY_URL}?endpoint=${endpoint}`;
                if (extraParams) url += `&extraParams=${extraParams}`;
                const response = await fetch(url);
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(`HTTP ${response.status}: ${errorData.error || errorData.details || response.statusText}`);
                }
                return await response.json();
            }

            function extractOdds(markets) {
                let odds1 = '-', oddsX = '-', odds2 = '-';
                if (!markets) return { odds1, oddsX, odds2 };
                const market = markets.find(m => m.Id === 1 || m.MarketId === 1);
                if (market && market.Items) {
                    const items = market.Items;
                    const o1 = items.find(i => i.SelectionTypeId === 1);
                    const oX = items.find(i => i.SelectionTypeId === 2);
                    const o2 = items.find(i => i.SelectionTypeId === 3);
                    odds1 = o1 ? o1.Price || o1.odds : odds1;
                    oddsX = oX ? oX.Price || oX.odds : oddsX;
                    odds2 = o2 ? o2.Price || o2.odds : odds2;
                }
                return { odds1, oddsX, odds2 };
            }

            function getCrestUrl(competitor) {
                if (!competitor) return null;
                if (competitor.Logo) return `https://img.sportradar.com/ls/crest/32/${competitor.Logo}.png`;
                if (competitor.Id) return `https://img.sportradar.com/ls/crest/32/${competitor.Id}.png`;
                return null;
            }

            function getCompetitorsWithCrests(match) {
                const comps = match.Competitors || [];
                const home = comps[0] || { Name: 'Home', Id: null };
                const away = comps[1] || { Name: 'Away', Id: null };
                return { home: { ...home, crest: getCrestUrl(home) }, away: { ...away, crest: getCrestUrl(away) } };
            }

            function extractTime24(eventDate) {
                if (!eventDate) return '--:--';
                try {
                    const d = new Date(eventDate);
                    if (isNaN(d.getTime())) return '--:--';
                    const h = String(d.getHours()).padStart(2, '0');
                    const m = String(d.getMinutes()).padStart(2, '0');
                    return `${h}h${m}`;
                } catch (e) { return '--:--'; }
            }

            // ==================== LOAD ODDS ====================
            async function loadOdds(type) {
                oddsContainer.innerHTML = '<div class="loading"><div class="spinner"></div><div>جاري التحميل...</div></div>';
                try {
                    let events = [];
                    if (type === 'live') {
                        const data = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=20');
                        events = data?.Result?.Items?.[0]?.Events || [];
                    } else if (type === 'upcoming') {
                        const data = await fetchFromProxy('GetUpcoming', 'sportId=1&showAllEvents=false&count=20');
                        events = data?.Result?.Items?.[0]?.Events || [];
                    }

                    if (!events || events.length === 0) {
                        oddsContainer.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-secondary);">لا توجد مباريات ${type === 'live' ? 'مباشرة' : 'قادمة'} مع أسعار</div>`;
                        return;
                    }

                    // استخراج الأسعار وعرضها
                    let html = '<div class="odds-list">';
                    events.forEach(match => {
                        const isLive = match.LiveCurrentTime && match.LiveCurrentTime !== '0';
                        let timeDisplay;
                        if (type === 'live' && isLive) {
                            timeDisplay = match.LiveCurrentTime || '--';
                        } else {
                            timeDisplay = extractTime24(match.EventDate);
                        }

                        const score = match.LiveScore || '0:0';
                        const scores = score.split(':');
                        const league = match.ChampName || match.CategoryName || 'Championnat';
                        const { home, away } = getCompetitorsWithCrests(match);
                        const { odds1, oddsX, odds2 } = extractOdds(match.Items);

                        const homeCrestHtml = home.crest ?
                            `<img src="${home.crest}" alt="${home.Name}" loading="lazy" onerror="this.style.display='none'">` :
                            home.Name.substring(0, 2).toUpperCase();
                        const awayCrestHtml = away.crest ?
                            `<img src="${away.crest}" alt="${away.Name}" loading="lazy" onerror="this.style.display='none'">` :
                            away.Name.substring(0, 2).toUpperCase();

                        html += `
                            <div class="match-odds-card">
                                <div class="match-odds-header">
                                    <span class="league">${league}</span>
                                    <span style="font-weight:600;">${timeDisplay}</span>
                                </div>
                                <div class="match-odds-teams">
                                    <div class="team">
                                        ${homeCrestHtml}
                                        <span>${home.Name}</span>
                                    </div>
                                    <div class="score">${scores[0] || '0'} - ${scores[1] || '0'}</div>
                                    <div class="team">
                                        <span>${away.Name}</span>
                                        ${awayCrestHtml}
                                    </div>
                                </div>
                                <div class="odds-row">
                                    <div class="odd-item" data-selection="1" data-price="${odds1}" data-match="${home.Name} vs ${away.Name}">
                                        <div class="label">1</div>
                                        <div class="value">${odds1}</div>
                                    </div>
                                    <div class="odd-item" data-selection="X" data-price="${oddsX}" data-match="${home.Name} vs ${away.Name}">
                                        <div class="label">X</div>
                                        <div class="value highlight">${oddsX}</div>
                                    </div>
                                    <div class="odd-item" data-selection="2" data-price="${odds2}" data-match="${home.Name} vs ${away.Name}">
                                        <div class="label">2</div>
                                        <div class="value">${odds2}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    oddsContainer.innerHTML = html;

                    // تفاعل النقر على السعر
                    document.querySelectorAll('.odd-item').forEach(item => {
                        item.addEventListener('click', function() {
                            const match = this.dataset.match;
                            const selection = this.dataset.selection;
                            const price = parseFloat(this.dataset.price);
                            if (price && price > 0 && price !== '-') {
                                alert(`تم إضافة الرهان: ${match} - ${selection} @ ${price}`);
                            } else {
                                alert('السعر غير متاح');
                            }
                        });
                    });

                } catch (error) {
                    console.error('Odds error:', error);
                    oddsContainer.innerHTML = `<div class="error-msg">⚠️ فشل تحميل الأسعار: ${error.message}</div>`;
                }
            }

            // ==================== TABS SWITCH ====================
            oddsTabs.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                oddsTabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const type = btn.dataset.type;
                loadOdds(type);
            });

            // ==================== INIT ====================
            // تحميل الأسعار المباشرة أولاً
            loadOdds('live');

            // تحديث كل 30 ثانية للتبويب النشط
            setInterval(() => {
                const activeTab = document.querySelector('#oddsTabs .active');
                if (activeTab) {
                    const type = activeTab.dataset.type;
                    loadOdds(type);
                }
            }, 30000);

        })();
    </script>

</body>
</html>
