<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Goal 216 - Betting</title>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0e13; color: #f0f3f7; padding: 12px; min-height: 100vh; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #222; margin-bottom: 15px; }
        .header h1 { font-size: 22px; font-weight: 700; color: #00e676; cursor: pointer; }
        .badge { background: #1f2937; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #9ca3af; }

        /* ===== DAYS TABS ===== */
        .days-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
        .days-tabs button { background: transparent; border: none; color: #9ca3af; padding: 6px 14px; font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 16px; transition: 0.2s; white-space: nowrap; }
        .days-tabs button.active { background: #00e676; color: #0b0e13; }
        .days-tabs button:hover { background: #1f2937; color: #f0f3f7; }

        /* ===== TABS ===== */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #1f2937; padding-bottom: 8px; flex-wrap: wrap; }
        .nav-tabs button { background: transparent; border: none; color: #9ca3af; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 20px; transition: 0.2s; white-space: nowrap; }
        .nav-tabs button.active { background: #00e676; color: #0b0e13; }
        .nav-tabs button:hover { background: #1f2937; color: #f0f3f7; }

        /* ===== MATCH CARDS ===== */
        .match-card { background: #14181f; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; border-left: 4px solid #dc2626; cursor: pointer; transition: 0.2s; }
        .match-card.coming { border-left-color: #fbbf24; }
        .match-card.top-event { border-left-color: #8b5cf6; }
        .match-card:hover { background: #1a202a; }

        .match-header { display: flex; justify-content: space-between; font-size: 12px; color: #9ca3af; margin-bottom: 8px; flex-wrap: wrap; gap: 4px; }
        .match-time { font-weight: 600; color: #fbbf24; }
        .match-league { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; background: #1f2937; padding: 0 8px; border-radius: 10px; }

        .score-line { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 600; padding: 4px 0 8px 0; }
        .team-block { display: flex; align-items: center; gap: 10px; max-width: 42%; }
        .team-block.away { flex-direction: row-reverse; text-align: right; }
        .team-crest { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #1f2937; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #f0f3f7; overflow: hidden; }
        .team-crest img { width: 100%; height: 100%; object-fit: contain; }
        .team-info { display: flex; flex-direction: column; min-width: 0; }
        .team-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .team-score { font-size: 22px; font-weight: 700; line-height: 1.2; }
        .team-block.away .team-info { align-items: flex-end; }
        .vs-dash { color: #4b5563; font-weight: 300; font-size: 18px; padding: 0 6px; }

        .odds-row { display: flex; justify-content: space-around; background: #1e2530; border-radius: 8px; padding: 8px 0; margin-top: 6px; }
        .odd-item { text-align: center; flex: 1; cursor: pointer; padding: 4px 0; border-radius: 4px; transition: 0.2s; }
        .odd-item:hover { background: #2a3340; }
        .odd-item .label { font-size: 10px; color: #6b7280; font-weight: 600; text-transform: uppercase; }
        .odd-item .value { font-size: 15px; font-weight: 700; color: #facc15; }
        .odd-item .value.highlight { color: #34d399; }

        .live-label { display: inline-block; background: #dc2626; color: white; font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-right: 6px; animation: blink 1.2s infinite; }
        .top-label { display: inline-block; background: #8b5cf6; color: white; font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-right: 6px; }
        .coming-label { display: inline-block; background: #fbbf24; color: #0b0e13; font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-right: 6px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* ===== DETAILS VIEW ===== */
        .back-btn { background: #1f2937; border: none; color: #f0f3f7; padding: 6px 14px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-bottom: 16px; display: inline-block; }
        .back-btn:hover { background: #374151; }
        .match-detail-title { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
        .match-detail-sub { color: #9ca3af; font-size: 14px; margin-bottom: 16px; }

        /* ===== MARKET TABS ===== */
        .market-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; flex-wrap: wrap; }
        .market-tabs button { background: transparent; border: none; color: #9ca3af; padding: 6px 12px; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 14px; transition: 0.2s; white-space: nowrap; }
        .market-tabs button.active { background: #00e676; color: #0b0e13; }
        .market-tabs button:hover { background: #1f2937; color: #f0f3f7; }

        .market-group { background: #14181f; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .market-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #fbbf24; }
        .market-items { display: flex; flex-wrap: wrap; gap: 8px; }
        .market-item { background: #1e2530; padding: 8px 12px; border-radius: 8px; flex: 1 0 calc(33% - 8px); text-align: center; min-width: 70px; cursor: pointer; transition: 0.2s; }
        .market-item:hover { background: #2a3340; }
        .market-item .name { font-size: 11px; color: #9ca3af; }
        .market-item .price { font-size: 15px; font-weight: 700; color: #facc15; }
        .market-item.added { border: 2px solid #00e676; }

        /* ===== BET SLIP ===== */
        .bet-slip-toggle { position: fixed; bottom: 70px; right: 16px; background: #00e676; color: #0b0e13; border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(0,230,118,0.4); z-index: 100; transition: 0.3s; }
        .bet-slip-toggle:hover { transform: scale(1.05); }
        .bet-slip-toggle .badge { position: absolute; top: -6px; right: -6px; background: #dc2626; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; display: flex; align-items: center; justify-content: center; }

        .bet-slip { position: fixed; bottom: 0; left: 0; right: 0; background: #14181f; border-top: 2px solid #00e676; padding: 16px; max-height: 65vh; overflow-y: auto; transform: translateY(100%); transition: 0.3s; z-index: 99; border-radius: 16px 16px 0 0; }
        .bet-slip.open { transform: translateY(0); }
        .bet-slip .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 12px; }
        .bet-slip .header h3 { color: #00e676; }
        .bet-slip .close-btn { background: none; border: none; color: #9ca3af; font-size: 20px; cursor: pointer; }
        .bet-slip-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #1f2937; }
        .bet-slip-item .remove { color: #dc2626; cursor: pointer; font-size: 18px; padding: 0 8px; }
        .bet-slip-total { display: flex; justify-content: space-between; padding: 12px 0; font-weight: 600; border-top: 1px solid #222; margin-top: 8px; }
        .bet-slip-actions { display: flex; gap: 8px; margin-top: 8px; }
        .place-bet-btn, .book-bet-btn { background: #00e676; color: #0b0e13; border: none; padding: 12px; border-radius: 8px; flex: 1; font-weight: 700; font-size: 16px; cursor: pointer; }
        .book-bet-btn { background: #fbbf24; }
        .bet-slip .stake-input { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .bet-slip .stake-input input { background: #1e2530; border: 1px solid #333; color: #f0f3f7; padding: 8px; border-radius: 6px; width: 80px; font-size: 14px; }
        .bet-slip .stake-input label { color: #9ca3af; font-size: 12px; }

        /* ===== MY BETS ===== */
        .my-bets-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .my-bets-tabs button { background: transparent; border: none; color: #9ca3af; padding: 6px 14px; font-size: 12px; cursor: pointer; border-radius: 16px; transition: 0.2s; }
        .my-bets-tabs button.active { background: #1f2937; color: #f0f3f7; }
        .bet-history-item { background: #14181f; border-radius: 8px; padding: 12px; margin-bottom: 8px; border-left: 3px solid #dc2626; }
        .bet-history-item.won { border-left-color: #00e676; }
        .bet-history-item.lost { border-left-color: #dc2626; }
        .bet-history-item.pending { border-left-color: #fbbf24; }
        .bet-history-item .status { font-weight: 700; font-size: 12px; }
        .bet-history-item .status.won { color: #00e676; }
        .bet-history-item .status.lost { color: #dc2626; }
        .bet-history-item .status.pending { color: #fbbf24; }

        .loading { text-align: center; padding: 40px; color: #6b7280; }
        .error-msg { background: #7f1d1d; padding: 15px; border-radius: 8px; color: #fca5a5; text-align: center; font-size: 14px; word-break: break-word; }
        .error-msg .error-detail { font-size: 12px; color: #f87171; margin-top: 8px; display: block; }

        .footer-menu { display: flex; justify-content: space-around; background: #0f131a; padding: 12px 0; border-top: 1px solid #222; margin-top: 20px; position: sticky; bottom: 0; }
        .footer-menu span { color: #6b7280; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .footer-menu span:hover { color: #f0f3f7; }
        .footer-menu .active { color: #00e676; }

        @media (max-width: 480px) {
            .team-name { font-size: 12px; }
            .team-score { font-size: 18px; }
            .team-crest { width: 26px; height: 26px; }
            .nav-tabs button { font-size: 12px; padding: 6px 10px; }
            .match-card { padding: 12px; }
            .market-item { flex: 1 0 calc(50% - 8px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="home-link">⚽ goal216</h1>
        <span class="badge" id="headerBadge">LIVE</span>
    </div>

    <!-- Day Selector -->
    <div class="days-tabs" id="daysTabs">
        <button class="active" data-day="today">Aujourd'hui</button>
        <button data-day="1">Lun 7/9</button>
        <button data-day="2">Mar 8/9</button>
        <button data-day="3">Mer 9/9</button>
        <button data-day="4">Jeu 10/9</button>
        <button data-day="5">Ven 11/9</button>
        <button data-day="6">Sam 12/9</button>
        <button data-day="7">Dim 13/9</button>
    </div>

    <div class="nav-tabs" id="navTabs">
        <button class="active" data-view="live">🔴 EN DIRECT</button>
        <button data-view="top">⭐ TOP EVENTS</button>
        <button data-view="coming">📅 À VENIR</button>
        <button data-view="mybets">📋 MY BETS</button>
    </div>

    <div id="app">
        <div class="loading">⏳ Chargement...</div>
    </div>

    <!-- Bet Slip Toggle -->
    <button class="bet-slip-toggle" id="betSlipToggle">
        🧾
        <span class="badge" id="betCount">0</span>
    </button>

    <!-- Bet Slip Panel -->
    <div class="bet-slip" id="betSlip">
        <div class="header">
            <h3>📋 FICHE DE PARI</h3>
            <button class="close-btn" id="closeBetSlip">✕</button>
        </div>
        <div id="betSlipItems">
            <p style="color:#6b7280; text-align:center; padding:20px 0;">Aucun pari sélectionné</p>
        </div>
        <div class="stake-input">
            <label>Mise (TND):</label>
            <input type="number" id="stakeInput" value="1" min="0.1" step="0.1" />
        </div>
        <div class="bet-slip-total">
            <span>Gain potentiel</span>
            <span id="betTotal">0.00 TND</span>
        </div>
        <div class="bet-slip-actions">
            <button class="place-bet-btn" id="placeBetBtn">PLACER</button>
            <button class="book-bet-btn" id="bookBetBtn">RÉSERVER</button>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-menu">
        <span class="active" data-footer="menu">📋 Menu</span>
        <span data-footer="sport">🏟️ Sport</span>
        <span data-footer="live">🔴 Live</span>
        <span data-footer="casino">🎰 Casino</span>
        <span data-footer="livecasino">📺 Casino en Direct</span>
    </div>

    <script>
        // ============================================================
        // 1. CONFIGURATION
        // ============================================================
        const PROXY_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co/functions/v1/altenar-proxy';

        // ============================================================
        // 2. STATE
        // ============================================================
        let currentView = 'live';
        let currentDay = 'today';
        let currentMatchId = null;
        let currentMarketTab = 'Main';
        let eventsCache = {};
        let isUpdating = false;
        let betHistory = [];
        let betIdCounter = 0;

        // ============================================================
        // 3. BET SLIP STATE (avec gestion des doublons)
        // ============================================================
        let betSlip = [];
        const betSlipEl = document.getElementById('betSlip');
        const betSlipItemsEl = document.getElementById('betSlipItems');
        const betTotalEl = document.getElementById('betTotal');
        const betCountEl = document.getElementById('betCount');
        const stakeInput = document.getElementById('stakeInput');
        const headerBadge = document.getElementById('headerBadge');

        function getBetKey(matchId, selection) {
            return `${matchId}_${selection}`;
        }

        function isBetInSlip(matchId, selection) {
            return betSlip.some(item => item.matchId === matchId && item.selection === selection);
        }

        function addToBetSlip(matchId, matchName, selection, price) {
            // Vérifier si déjà présent
            if (isBetInSlip(matchId, selection)) {
                alert('Ce choix est déjà dans la fiche de pari.');
                return false;
            }
            betSlip.push({ matchId, matchName, selection, price });
            updateBetSlipUI();
            betSlipEl.classList.add('open');
            return true;
        }

        function removeFromBetSlip(index) {
            betSlip.splice(index, 1);
            updateBetSlipUI();
        }

        function clearBetSlip() {
            betSlip = [];
            updateBetSlipUI();
            betSlipEl.classList.remove('open');
        }

        function updateBetSlipUI() {
            if (betSlip.length === 0) {
                betSlipItemsEl.innerHTML = '<p style="color:#6b7280; text-align:center; padding:20px 0;">Aucun pari sélectionné</p>';
                betTotalEl.textContent = '0.00 TND';
                betCountEl.textContent = '0';
                return;
            }
            let html = '';
            let totalOdds = 1;
            betSlip.forEach((item, index) => {
                totalOdds *= item.price;
                html += `
                    <div class="bet-slip-item">
                        <div>
                            <strong>${item.matchName}</strong><br>
                            <span style="color:#9ca3af; font-size:12px;">${item.selection} @ ${item.price}</span>
                        </div>
                        <span class="remove" data-index="${index}">✕</span>
                    </div>
                `;
            });
            betSlipItemsEl.innerHTML = html;
            const stake = parseFloat(stakeInput.value) || 1;
            const totalWin = totalOdds * stake;
            betTotalEl.textContent = totalWin.toFixed(2) + ' TND';
            betCountEl.textContent = betSlip.length;

            document.querySelectorAll('.bet-slip-item .remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    removeFromBetSlip(idx);
                });
            });
        }

        stakeInput.addEventListener('input', updateBetSlipUI);

        document.getElementById('betSlipToggle').addEventListener('click', () => {
            betSlipEl.classList.toggle('open');
        });
        document.getElementById('closeBetSlip').addEventListener('click', () => {
            betSlipEl.classList.remove('open');
        });

        // ============================================================
        // 4. PLACE BET
        // ============================================================
        function placeBet(type = 'placed') {
            if (betSlip.length === 0) {
                alert('Ajoutez des paris d\'abord.');
                return;
            }
            const stake = parseFloat(stakeInput.value) || 1;
            const totalOdds = betSlip.reduce((acc, item) => acc * item.price, 1);
            const totalWin = totalOdds * stake;

            const bet = {
                id: ++betIdCounter,
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString(),
                selections: betSlip.map(item => ({ ...item })),
                stake: stake,
                totalOdds: totalOdds,
                totalWin: totalWin,
                status: type === 'booked' ? 'pending' : (Math.random() > 0.6 ? 'won' : 'lost'),
                type: type === 'booked' ? 'Réservé' : 'Placé'
            };

            betHistory.unshift(bet);
            clearBetSlip();
            if (currentView === 'mybets') renderMyBets();
            alert(`✅ Pari ${type === 'booked' ? 'réservé' : 'placé'} ! ID: ${bet.id}`);
        }

        document.getElementById('placeBetBtn').addEventListener('click', () => placeBet('placed'));
        document.getElementById('bookBetBtn').addEventListener('click', () => placeBet('booked'));

        // ============================================================
        // 5. HELPERS
        // ============================================================
        async function fetchFromProxy(endpoint, extraParams = '') {
            let url = `${PROXY_URL}?endpoint=${endpoint}`;
            if (extraParams) url += `&extraParams=${extraParams}`;
            const response = await fetch(url);
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(`HTTP ${response.status}: ${errorData.error || errorData.details || response.statusText}`);
            }
            return await response.json();
        }

        function extractOdds(markets) {
            let odds1 = '-', oddsX = '-', odds2 = '-';
            if (!markets) return { odds1, oddsX, odds2 };
            const market = markets.find(m => m.Id === 1 || m.MarketId === 1);
            if (market && market.Items) {
                const items = market.Items;
                const o1 = items.find(i => i.SelectionTypeId === 1);
                const oX = items.find(i => i.SelectionTypeId === 2);
                const o2 = items.find(i => i.SelectionTypeId === 3);
                odds1 = o1 ? o1.Price || o1.odds : odds1;
                oddsX = oX ? oX.Price || oX.odds : oddsX;
                odds2 = o2 ? o2.Price || o2.odds : odds2;
            }
            return { odds1, oddsX, odds2 };
        }

        function getCrestUrl(competitor) {
            if (!competitor) return null;
            if (competitor.Logo) return `https://img.sportradar.com/ls/crest/32/${competitor.Logo}.png`;
            if (competitor.Id) return `https://img.sportradar.com/ls/crest/32/${competitor.Id}.png`;
            return null;
        }

        function getCompetitorsWithCrests(match) {
            const comps = match.Competitors || [];
            const home = comps[0] || { Name: 'Home', Id: null };
            const away = comps[1] || { Name: 'Away', Id: null };
            return { home: { ...home, crest: getCrestUrl(home) }, away: { ...away, crest: getCrestUrl(away) } };
        }

        function getDateRange(day) {
            const now = new Date();
            let start = new Date(now);
            if (day === 'today') {
                start.setHours(0,0,0,0);
            } else {
                const days = parseInt(day);
                start.setDate(now.getDate() + days);
                start.setHours(0,0,0,0);
            }
            const end = new Date(start);
            end.setDate(start.getDate() + 1);
            return {
                start: start.toISOString(),
                end: end.toISOString()
            };
        }

        // ============================================================
        // 6. RENDER FUNCTIONS
        // ============================================================
        const app = document.getElementById('app');

        function renderMatchList(events, type = 'live', preserveScroll = false) {
            if (!events || events.length === 0) {
                app.innerHTML = `<div class="error-msg">⚠️ Aucun événement trouvé pour cette catégorie.</div>`;
                return;
            }

            let html = '';
            events.forEach(match => {
                const isLive = match.LiveCurrentTime && match.LiveCurrentTime !== '0';
                const time = match.LiveCurrentTime || match.EventDate?.split('T')[1]?.slice(0,5) || '--';
                const score = match.LiveScore || '0:0';
                const scores = score.split(':');
                const league = match.ChampName || match.CategoryName || 'Championnat';
                const matchId = match.Id;

                const { home, away } = getCompetitorsWithCrests(match);
                const { odds1, oddsX, odds2 } = extractOdds(match.Items);

                let label = '', cardClass = '';
                if (type === 'live' && isLive) {
                    label = '<span class="live-label">EN DIRECT</span>';
                    cardClass = '';
                } else if (type === 'top') {
                    label = '<span class="top-label">⭐ TOP</span>';
                    cardClass = 'top-event';
                } else {
                    label = '<span class="coming-label">À VENIR</span>';
                    cardClass = 'coming';
                }

                const homeCrestHtml = home.crest
                    ? `<img src="${home.crest}" alt="${home.Name}" loading="lazy" onerror="this.style.display='none'">`
                    : home.Name.substring(0, 2).toUpperCase();
                const awayCrestHtml = away.crest
                    ? `<img src="${away.crest}" alt="${away.Name}" loading="lazy" onerror="this.style.display='none'">`
                    : away.Name.substring(0, 2).toUpperCase();

                const matchName = `${home.Name} vs ${away.Name}`;

                html += `
                    <div class="match-card ${cardClass}" data-matchid="${matchId}">
                        <div class="match-header">
                            ${label}
                            <span class="match-time">${time}</span>
                            <span class="match-league">${league}</span>
                        </div>
                        <div class="score-line">
                            <div class="team-block home">
                                <div class="team-crest">${homeCrestHtml}</div>
                                <div class="team-info">
                                    <span class="team-name">${home.Name}</span>
                                    <span class="team-score">${scores[0] || '0'}</span>
                                </div>
                            </div>
                            <span class="vs-dash">⚡</span>
                            <div class="team-block away">
                                <div class="team-crest">${awayCrestHtml}</div>
                                <div class="team-info">
                                    <span class="team-name">${away.Name}</span>
                                    <span class="team-score">${scores[1] || '0'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="odds-row">
                            <div class="odd-item" data-matchid="${matchId}" data-match="${matchName}" data-selection="1" data-price="${odds1}">
                                <div class="label">1</div>
                                <div class="value">${odds1}</div>
                            </div>
                            <div class="odd-item" data-matchid="${matchId}" data-match="${matchName}" data-selection="X" data-price="${oddsX}">
                                <div class="label">X</div>
                                <div class="value highlight">${oddsX}</div>
                            </div>
                            <div class="odd-item" data-matchid="${matchId}" data-match="${matchName}" data-selection="2" data-price="${odds2}">
                                <div class="label">2</div>
                                <div class="value">${odds2}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            const scrollY = preserveScroll ? window.scrollY : 0;
            app.innerHTML = html;
            if (preserveScroll) window.scrollTo(0, scrollY);

            // Événements sur les cartes
            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.odd-item')) return;
                    const matchId = this.dataset.matchid;
                    if (matchId) showEventDetails(matchId);
                });
            });

            // Événements sur les cotes (ajout au slip avec vérification)
            document.querySelectorAll('.odd-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const matchId = this.dataset.matchid;
                    const match = this.dataset.match;
                    const selection = this.dataset.selection;
                    const price = parseFloat(this.dataset.price);
                    if (price && price > 0 && price !== '-') {
                        addToBetSlip(matchId, match, selection, price);
                    } else {
                        alert('Cote non disponible');
                    }
                });
            });
        }

        // ============================================================
        // 7. DETAILS VIEW (avec tous les marchés)
        // ============================================================
        async function showEventDetails(matchId) {
            try {
                currentMatchId = matchId;
                app.innerHTML = '<div class="loading">⏳ Chargement des détails...</div>';
                const data = await fetchFromProxy('GetEventDetails', `eventId=${matchId}&sportId=1`);
                const result = data?.Result;
                if (!result) {
                    app.innerHTML = `<div class="error-msg">⚠️ Détails introuvables pour ce match.</div>`;
                    return;
                }

                const homeTeam = result.Competitors?.[0]?.Name || 'Home';
                const awayTeam = result.Competitors?.[1]?.Name || 'Away';
                const league = result.ChampName || result.CategoryName || 'Ligue';
                const date = result.EventDate || '';
                const matchName = `${homeTeam} vs ${awayTeam}`;

                // Collecter tous les groupes de marchés
                const allGroups = result.MarketGroups || [];
                const groupNames = allGroups.map(g => g.Name || 'Main');

                let html = `
                    <button class="back-btn" id="backToList">← Retour</button>
                    <div class="match-detail-title">${homeTeam} vs ${awayTeam}</div>
                    <div class="match-detail-sub">${league} | ${date}</div>
                    <div class="market-tabs" id="marketTabs">
                        ${groupNames.map(name => `<button class="${name === 'Main' ? 'active' : ''}" data-group="${name}">${name}</button>`).join('')}
                    </div>
                    <div id="marketContent"></div>
                `;

                app.innerHTML = html;

                document.getElementById('backToList').addEventListener('click', () => {
                    currentMatchId = null;
                    loadView(currentView, true);
                });

                // عرض أول مجموعة
                renderMarketGroup(allGroups, 'Main');

                // تبديل المجموعات
                document.querySelectorAll('#marketTabs button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#marketTabs button').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const groupName = this.dataset.group;
                        renderMarketGroup(allGroups, groupName);
                    });
                });

            } catch (error) {
                app.innerHTML = `<div class="error-msg">⛔ Erreur: ${error.message}</div>`;
                console.error(error);
            }
        }

        function renderMarketGroup(allGroups, groupName) {
            const container = document.getElementById('marketContent');
            if (!container) return;

            const group = allGroups.find(g => (g.Name || 'Main') === groupName);
            if (!group || !group.Items || group.Items.length === 0) {
                container.innerHTML = '<p style="color:#6b7280;">Aucun marché disponible pour ce groupe.</p>';
                return;
            }

            let html = '';
            group.Items.forEach(market => {
                if (!market.Items || market.Items.length === 0) return;
                const marketName = market.ShortName || market.Name || 'Marché';
                html += `<div class="market-group"><div class="market-title">${marketName}</div><div class="market-items">`;
                market.Items.forEach(item => {
                    const name = item.Name || item.ShortName || '—';
                    const price = item.Price || '-';
                    const isAdded = isBetInSlip(currentMatchId, name);
                    html += `
                        <div class="market-item ${isAdded ? 'added' : ''}" data-selection="${name}" data-price="${price}" data-match="${document.querySelector('.match-detail-title')?.textContent || 'Match'}">
                            <div class="name">${name}</div>
                            <div class="price">${price}</div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });

            container.innerHTML = html;

            // Événements pour ajouter au slip
            container.querySelectorAll('.market-item').forEach(item => {
                item.addEventListener('click', function() {
                    const match = this.dataset.match;
                    const selection = this.dataset.selection;
                    const price = parseFloat(this.dataset.price);
                    if (price && price > 0 && price !== '-') {
                        const added = addToBetSlip(currentMatchId, match, selection, price);
                        if (added) {
                            this.classList.add('added');
                        }
                    } else {
                        alert('Cote non disponible');
                    }
                });
            });
        }

        // ============================================================
        // 8. MY BETS
        // ============================================================
        function renderMyBets() {
            if (betHistory.length === 0) {
                app.innerHTML = `
                    <div style="text-align:center; padding:40px 0;">
                        <p style="color:#6b7280;">Aucun pari enregistré</p>
                        <p style="color:#4b5563; font-size:12px;">Placez un pari pour le voir apparaître ici</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="my-bets-tabs">
                    <button class="active" data-filter="all">Tous</button>
                    <button data-filter="won">Gagnés</button>
                    <button data-filter="lost">Perdus</button>
                    <button data-filter="pending">En attente</button>
                </div>
            `;

            const filter = document.querySelector('.my-bets-tabs .active')?.dataset.filter || 'all';
            const filtered = betHistory.filter(b => filter === 'all' || b.status === filter);

            filtered.forEach(bet => {
                const statusClass = bet.status;
                const statusLabel = bet.status === 'won' ? '✅ Gagné' : bet.status === 'lost' ? '❌ Perdu' : '⏳ En attente';
                html += `
                    <div class="bet-history-item ${statusClass}">
                        <div style="display:flex; justify-content:space-between;">
                            <span>ID: ${bet.id}</span>
                            <span class="status ${statusClass}">${statusLabel}</span>
                        </div>
                        <div style="font-size:12px; color:#9ca3af; margin:4px 0;">${bet.date} • ${bet.time}</div>
                        <div style="font-size:13px; margin:4px 0;">
                            ${bet.selections.map(s => `${s.selection} @ ${s.price}`).join(' + ')}
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size:13px; margin-top:4px;">
                            <span>Mise: ${bet.stake} TND</span>
                            <span>Gain: ${bet.totalWin.toFixed(2)} TND</span>
                        </div>
                        <div style="font-size:11px; color:#6b7280; margin-top:2px;">${bet.type}</div>
                    </div>
                `;
            });

            app.innerHTML = html;

            document.querySelectorAll('.my-bets-tabs button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.my-bets-tabs button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderMyBets();
                });
            });
        }

        // ============================================================
        // 9. LOAD VIEWS
        // ============================================================
        async function loadView(view, preserveScroll = false) {
            if (isUpdating) return;
            isUpdating = true;

            try {
                currentView = view;

                if (view === 'mybets') {
                    renderMyBets();
                    isUpdating = false;
                    return;
                }

                if (currentMatchId) {
                    isUpdating = false;
                    return;
                }

                let events = [];
                let cacheKey = `${view}_${currentDay}`;

                if (eventsCache[cacheKey]) {
                    events = eventsCache[cacheKey];
                    renderMatchList(events, view, preserveScroll);
                    isUpdating = false;
                    return;
                }

                app.innerHTML = '<div class="loading">⏳ Chargement...</div>';

                if (view === 'live') {
                    const data = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=15');
                    events = data?.Result?.Items?.[0]?.Events || [];
                } else if (view === 'top') {
                    const data = await fetchFromProxy('GetTopEvents', '');
                    events = data?.Result?.Events || [];
                } else if (view === 'coming') {
                    const range = getDateRange(currentDay);
                    const data = await fetchFromProxy('GetMenuBySport',
                        `sportId=1&period=periodall&startDate=${encodeURIComponent(range.start)}&endDate=${encodeURIComponent(range.end)}`
                    );
                    if (data?.Result) {
                        const items = data.Result['0']?.Items || [];
                        const allEvents = [];
                        items.forEach(category => {
                            if (category.Items) {
                                category.Items.forEach(champ => {
                                    if (champ.Events) {
                                        allEvents.push(...champ.Events);
                                    }
                                });
                            }
                        });
                        events = allEvents;
                    }
                }

                eventsCache[cacheKey] = events;
                renderMatchList(events, view, preserveScroll);

            } catch (error) {
                if (!preserveScroll) {
                    app.innerHTML = `
                        <div class="error-msg">
                            ⛔ Erreur de chargement: ${error.message}
                            <span class="error-detail">Vérifiez que le Proxy est déployé et que le lien est correct.</span>
                        </div>
                    `;
                }
                console.error(error);
            }

            isUpdating = false;
        }

        // ============================================================
        // 10. SILENT REFRESH
        // ============================================================
        async function silentRefresh() {
            if (isUpdating) return;
            if (currentMatchId) return;
            if (currentView === 'mybets') return;

            try {
                const view = currentView;
                const cacheKey = `${view}_${currentDay}`;
                let events = [];

                if (view === 'live') {
                    const data = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=15');
                    events = data?.Result?.Items?.[0]?.Events || [];
                } else if (view === 'top') {
                    const data = await fetchFromProxy('GetTopEvents', '');
                    events = data?.Result?.Events || [];
                } else if (view === 'coming') {
                    const range = getDateRange(currentDay);
                    const data = await fetchFromProxy('GetMenuBySport',
                        `sportId=1&period=periodall&startDate=${encodeURIComponent(range.start)}&endDate=${encodeURIComponent(range.end)}`
                    );
                    if (data?.Result) {
                        const items = data.Result['0']?.Items || [];
                        const allEvents = [];
                        items.forEach(category => {
                            if (category.Items) {
                                category.Items.forEach(champ => {
                                    if (champ.Events) {
                                        allEvents.push(...champ.Events);
                                    }
                                });
                            }
                        });
                        events = allEvents;
                    }
                }

                eventsCache[cacheKey] = events;
                if (currentView === view && !currentMatchId) {
                    renderMatchList(events, view, true);
                }

            } catch (error) {
                console.error('Silent refresh error:', error);
            }
        }

        // ============================================================
        // 11. NAVIGATION
        // ============================================================

        // Onglets principaux
        document.querySelectorAll('.nav-tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMatchId = null;
                const view = this.dataset.view;
                if (view === 'mybets') {
                    headerBadge.textContent = 'MY BETS';
                } else {
                    headerBadge.textContent = 'LIVE';
                }
                loadView(view);
            });
        });

        // Sélecteur de jours
        document.querySelectorAll('.days-tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.days-tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentDay = this.dataset.day;
                currentMatchId = null;
                const cacheKey = `${currentView}_${currentDay}`;
                delete eventsCache[cacheKey];
                loadView(currentView);
            });
        });

        // Footer
        document.querySelectorAll('.footer-menu span').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.footer-menu span').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Retour à l'accueil
        document.getElementById('home-link').addEventListener('click', function(e) {
            e.preventDefault();
            currentMatchId = null;
            const activeTab = document.querySelector('.nav-tabs .active');
            loadView(activeTab ? activeTab.dataset.view : 'live');
        });

        // ============================================================
        // 12. INIT
        // ============================================================
        loadView('live');

        setInterval(silentRefresh, 30000);

        window.loadView = loadView;
        window.showEventDetails = showEventDetails;
        window.silentRefresh = silentRefresh;
        window.addToBetSlip = addToBetSlip;
    </script>
</body>
    </html>
