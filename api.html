<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Goal 216 - Live Scores</title>
    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0e13; color: #f0f3f7; padding: 12px; min-height: 100vh; padding-bottom: 80px; }
        
        /* ===== HEADER ===== */
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #222; margin-bottom: 15px; }
        .header h1 { font-size: 24px; font-weight: 700; color: #00e676; cursor: pointer; }
        .badge { background: #1f2937; padding: 4px 12px; border-radius: 20px; font-size: 11px; color: #9ca3af; }

        /* ===== DAYS TABS ===== */
        .days-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; flex-wrap: nowrap; }
        .days-tabs button { background: transparent; border: none; color: #9ca3af; padding: 6px 14px; font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 16px; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
        .days-tabs button.active { background: #00e676; color: #0b0e13; }
        .days-tabs button:hover { background: #1f2937; color: #f0f3f7; }

        /* ===== MAIN TABS ===== */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #1f2937; padding-bottom: 8px; flex-wrap: wrap; }
        .nav-tabs button { background: transparent; border: none; color: #9ca3af; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 20px; transition: 0.2s; white-space: nowrap; }
        .nav-tabs button.active { background: #00e676; color: #0b0e13; }
        .nav-tabs button:hover { background: #1f2937; color: #f0f3f7; }

        /* ===== MATCH CARD ===== */
        .match-card { background: #14181f; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; border-left: 4px solid #dc2626; cursor: pointer; transition: 0.2s; }
        .match-card.coming { border-left-color: #fbbf24; }
        .match-card.top-event { border-left-color: #8b5cf6; }
        .match-card:hover { background: #1a202a; }

        .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #9ca3af; margin-bottom: 8px; flex-wrap: wrap; gap: 4px; }
        .match-time { font-weight: 600; color: #fbbf24; background: rgba(251,191,36,0.1); padding: 2px 10px; border-radius: 12px; }
        .match-league { background: #1f2937; padding: 2px 10px; border-radius: 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }

        .score-line { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 10px 0; }
        .team-block { display: flex; align-items: center; gap: 10px; max-width: 42%; }
        .team-block.away { flex-direction: row-reverse; text-align: right; }
        .team-crest { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #1f2937; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #f0f3f7; overflow: hidden; }
        .team-crest img { width: 100%; height: 100%; object-fit: contain; }
        .team-info { display: flex; flex-direction: column; min-width: 0; }
        .team-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .team-score { font-size: 22px; font-weight: 700; line-height: 1.2; }
        .team-block.away .team-info { align-items: flex-end; }
        .vs-dash { color: #4b5563; font-weight: 300; font-size: 18px; padding: 0 6px; }

        .odds-row { display: flex; justify-content: space-around; background: #1e2530; border-radius: 8px; padding: 6px 0; margin-top: 6px; }
        .odd-item { text-align: center; flex: 1; cursor: pointer; padding: 4px 0; border-radius: 4px; transition: 0.2s; }
        .odd-item:hover { background: #2a3340; }
        .odd-item .label { font-size: 10px; color: #6b7280; font-weight: 600; text-transform: uppercase; }
        .odd-item .value { font-size: 15px; font-weight: 700; color: #facc15; }
        .odd-item .value.highlight { color: #34d399; }

        .live-label { display: inline-block; background: #dc2626; color: white; font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-right: 6px; animation: blink 1.2s infinite; }
        .top-label { display: inline-block; background: #8b5cf6; color: white; font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-right: 6px; }
        .coming-label { display: inline-block; background: #fbbf24; color: #0b0e13; font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-right: 6px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* ===== DETAILS VIEW ===== */
        .back-btn { background: #1f2937; border: none; color: #f0f3f7; padding: 6px 14px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-bottom: 16px; display: inline-block; }
        .back-btn:hover { background: #374151; }
        .match-detail-title { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
        .match-detail-sub { color: #9ca3af; font-size: 14px; margin-bottom: 16px; }

        .market-group { background: #14181f; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .market-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #fbbf24; }
        .market-items { display: flex; flex-wrap: wrap; gap: 8px; }
        .market-item { background: #1e2530; padding: 8px 12px; border-radius: 8px; flex: 1 0 calc(33% - 8px); text-align: center; min-width: 70px; cursor: pointer; transition: 0.2s; }
        .market-item:hover { background: #2a3340; }
        .market-item .name { font-size: 11px; color: #9ca3af; }
        .market-item .price { font-size: 15px; font-weight: 700; color: #facc15; }

        /* ===== TIMELINE ===== */
        .timeline-container { background: #14181f; border-radius: 12px; padding: 16px; margin-top: 12px; max-height: 300px; overflow-y: auto; }
        .timeline-event { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid #1f2937; font-size: 13px; }
        .timeline-event .time { color: #fbbf24; font-weight: 600; min-width: 40px; }
        .timeline-event .icon { width: 24px; text-align: center; }
        .timeline-event .desc { flex: 1; }
        .event-goal { color: #34d399; }
        .event-yellow { color: #facc15; }
        .event-red { color: #dc2626; }
        .event-sub { color: #60a5fa; }

        /* ===== BET SLIP ===== */
        .bet-slip-toggle { position: fixed; bottom: 70px; right: 16px; background: #00e676; color: #0b0e13; border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(0,230,118,0.4); z-index: 100; transition: 0.3s; }
        .bet-slip-toggle .badge { position: absolute; top: -6px; right: -6px; background: #dc2626; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; display: flex; align-items: center; justify-content: center; }

        .bet-slip { position: fixed; bottom: 0; left: 0; right: 0; background: #14181f; border-top: 2px solid #00e676; padding: 16px; max-height: 60vh; overflow-y: auto; transform: translateY(100%); transition: 0.3s; z-index: 99; border-radius: 16px 16px 0 0; }
        .bet-slip.open { transform: translateY(0); }
        .bet-slip .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 12px; }
        .bet-slip .header h3 { color: #00e676; }
        .bet-slip .close-btn { background: none; border: none; color: #9ca3af; font-size: 20px; cursor: pointer; }
        .bet-slip-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #1f2937; }
        .bet-slip-item .remove { color: #dc2626; cursor: pointer; font-size: 18px; }
        .bet-slip-total { display: flex; justify-content: space-between; padding: 12px 0; font-weight: 600; border-top: 1px solid #222; margin-top: 8px; }
        .place-bet-btn { background: #00e676; color: #0b0e13; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 8px; }

        .loading { text-align: center; padding: 40px; color: #6b7280; }
        .error-msg { background: #7f1d1d; padding: 15px; border-radius: 8px; color: #fca5a5; text-align: center; font-size: 14px; }
        .footer-menu { display: flex; justify-content: space-around; background: #0f131a; padding: 12px 0; border-top: 1px solid #222; margin-top: 20px; position: sticky; bottom: 0; }
        .footer-menu span { color: #6b7280; font-size: 14px; font-weight: 500; }
        .footer-menu .active { color: #00e676; }

        /* ===== LEAGUE GROUP ===== */
        .league-group { margin-bottom: 16px; }
        .league-group-title { font-size: 16px; font-weight: 700; color: #fbbf24; padding: 8px 0 12px 0; border-bottom: 1px solid #1f2937; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .league-group-title .country-flag { font-size: 18px; }

        @media (max-width: 480px) {
            .team-name { font-size: 12px; }
            .team-score { font-size: 18px; }
            .team-crest { width: 26px; height: 26px; }
            .nav-tabs button { font-size: 12px; padding: 6px 10px; }
            .match-card { padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="home-link">⚽ goal216</h1>
        <span class="badge" id="liveBadge">LIVE</span>
    </div>

    <div class="days-tabs" id="daysTabs">
        <button class="active" data-day="0">Aujourd'hui</button>
        <button data-day="1">Lun 7/9</button>
        <button data-day="2">Mar 8/9</button>
        <button data-day="3">Mer 9/9</button>
        <button data-day="4">Jeu 10/9</button>
        <button data-day="5">Ven 11/9</button>
        <button data-day="6">Sam 12/9</button>
        <button data-day="7">Dim 13/9</button>
    </div>

    <div class="nav-tabs" id="navTabs">
        <button class="active" data-view="live">🔴 EN DIRECT</button>
        <button data-view="top">⭐ TOP EVENTS</button>
        <button data-view="upcoming">📅 À VENIR</button>
    </div>

    <div id="app">
        <div class="loading">⏳ Chargement...</div>
    </div>

    <!-- Bet Slip -->
    <button class="bet-slip-toggle" id="betSlipToggle">
        🧾 <span class="badge" id="betCount">0</span>
    </button>
    <div class="bet-slip" id="betSlip">
        <div class="header">
            <h3>📋 FICHE DE PARI</h3>
            <button class="close-btn" id="closeBetSlip">✕</button>
        </div>
        <div id="betSlipItems"><p style="color:#6b7280;text-align:center;padding:20px 0;">Aucun pari sélectionné</p></div>
        <div class="bet-slip-total"><span>Total</span><span id="betTotal">0.00</span></div>
        <button class="place-bet-btn" id="placeBetBtn">PLACER UN PARI</button>
    </div>

    <div class="footer-menu">
        <span class="active">📋 Menu</span>
        <span>🏟️ Sport</span>
        <span>🔴 Live</span>
        <span>🎰 Casino</span>
        <span>📺 Casino en Direct</span>
    </div>

    <script>
        // ============================================================
        // 1. CONFIGURATION
        // ============================================================
        const PROXY_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co/functions/v1/altenar-proxy';

        // ============================================================
        // 2. STATE
        // ============================================================
        let currentView = 'live';
        let currentDay = 0;
        let currentMatchId = null;
        let eventsCache = {};
        let isUpdating = false;
        let betSlip = [];

        // DOM refs
        const app = document.getElementById('app');
        const betSlipEl = document.getElementById('betSlip');
        const betSlipItemsEl = document.getElementById('betSlipItems');
        const betTotalEl = document.getElementById('betTotal');
        const betCountEl = document.getElementById('betCount');

        // ============================================================
        // 3. HELPERS
        // ============================================================
        async function fetchFromProxy(endpoint, extraParams = '') {
            let url = `${PROXY_URL}?endpoint=${endpoint}`;
            if (extraParams) url += `&extraParams=${extraParams}`;
            const response = await fetch(url);
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(`HTTP ${response.status}: ${errorData.error || errorData.details || response.statusText}`);
            }
            return await response.json();
        }

        function extractOdds(markets) {
            let odds1 = '-', oddsX = '-', odds2 = '-';
            if (!markets) return { odds1, oddsX, odds2 };
            const market = markets.find(m => m.Id === 1 || m.MarketId === 1);
            if (market && market.Items) {
                const items = market.Items;
                const o1 = items.find(i => i.SelectionTypeId === 1);
                const oX = items.find(i => i.SelectionTypeId === 2);
                const o2 = items.find(i => i.SelectionTypeId === 3);
                odds1 = o1 ? o1.Price || o1.odds : odds1;
                oddsX = oX ? oX.Price || oX.odds : oddsX;
                odds2 = o2 ? o2.Price || o2.odds : odds2;
            }
            return { odds1, oddsX, odds2 };
        }

        function getCrestUrl(competitor) {
            if (!competitor) return null;
            if (competitor.Logo) return `https://img.sportradar.com/ls/crest/32/${competitor.Logo}.png`;
            if (competitor.Id) return `https://img.sportradar.com/ls/crest/32/${competitor.Id}.png`;
            return null;
        }

        function getCompetitorsWithCrests(match) {
            const comps = match.Competitors || [];
            const home = comps[0] || { Name: 'Home', Id: null };
            const away = comps[1] || { Name: 'Away', Id: null };
            return {
                home: { ...home, crest: getCrestUrl(home) },
                away: { ...away, crest: getCrestUrl(away) }
            };
        }

        function getDateRange(dayOffset) {
            const now = new Date();
            const start = new Date(now);
            start.setDate(now.getDate() + dayOffset);
            start.setHours(0, 0, 0, 0);
            const end = new Date(start);
            end.setDate(start.getDate() + 1);
            end.setHours(23, 59, 59, 999);
            return { start: start.toISOString(), end: end.toISOString() };
        }

        function extractTime24(eventDate) {
            if (!eventDate) return '--:--';
            try {
                const d = new Date(eventDate);
                if (isNaN(d.getTime())) return '--:--';
                return String(d.getHours()).padStart(2, '0') + 'h' + String(d.getMinutes()).padStart(2, '0');
            } catch (e) { return '--:--'; }
        }

        // ============================================================
        // 4. BET SLIP
        // ============================================================
        function updateBetSlipUI() {
            if (betSlip.length === 0) {
                betSlipItemsEl.innerHTML = '<p style="color:#6b7280;text-align:center;padding:20px 0;">Aucun pari sélectionné</p>';
                betTotalEl.textContent = '0.00';
                betCountEl.textContent = '0';
                return;
            }
            let html = '', total = 0;
            betSlip.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="bet-slip-item">
                        <div><strong>${item.match}</strong><br><span style="color:#9ca3af;font-size:12px;">${item.selection} @ ${item.price}</span></div>
                        <span class="remove" data-index="${index}">✕</span>
                    </div>
                `;
            });
            betSlipItemsEl.innerHTML = html;
            betTotalEl.textContent = total.toFixed(2);
            betCountEl.textContent = betSlip.length;

            document.querySelectorAll('.bet-slip-item .remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    betSlip.splice(parseInt(this.dataset.index), 1);
                    updateBetSlipUI();
                });
            });
        }

        function addToBetSlip(matchName, selection, price) {
            betSlip.push({ match: matchName, selection, price });
            updateBetSlipUI();
            betSlipEl.classList.add('open');
        }

        document.getElementById('betSlipToggle').addEventListener('click', () => betSlipEl.classList.toggle('open'));
        document.getElementById('closeBetSlip').addEventListener('click', () => betSlipEl.classList.remove('open'));
        document.getElementById('placeBetBtn').addEventListener('click', () => {
            if (betSlip.length === 0) return alert('Ajoutez des paris d\'abord.');
            alert('✅ Pari placé ! (simulation)');
            betSlip = [];
            updateBetSlipUI();
            betSlipEl.classList.remove('open');
        });

        // ============================================================
        // 5. RENDER - Match List avec regroupement par ligue
        // ============================================================
        function renderMatchList(events, type = 'live', preserveScroll = false) {
            if (!events || events.length === 0) {
                app.innerHTML = `<div class="error-msg">⚠️ Aucun événement trouvé.</div>`;
                return;
            }

            // Grouper par ligue (ChampName)
            const groups = {};
            events.forEach(match => {
                const league = match.ChampName || match.CategoryName || 'Autre';
                if (!groups[league]) groups[league] = [];
                groups[league].push(match);
            });

            let html = '';
            const sortedLeagues = Object.keys(groups).sort();

            sortedLeagues.forEach(league => {
                const matches = groups[league];
                html += `<div class="league-group"><div class="league-group-title">🏆 ${league}</div>`;

                matches.forEach(match => {
                    const isLive = match.LiveCurrentTime && match.LiveCurrentTime !== '0';
                    let timeDisplay;
                    if (type === 'live' && isLive) {
                        timeDisplay = match.LiveCurrentTime || '--';
                    } else {
                        timeDisplay = extractTime24(match.EventDate);
                    }

                    const score = match.LiveScore || '0:0';
                    const scores = score.split(':');
                    const matchId = match.Id;
                    const { home, away } = getCompetitorsWithCrests(match);
                    const { odds1, oddsX, odds2 } = extractOdds(match.Items);

                    let label = '', cardClass = '';
                    if (type === 'live' && isLive) {
                        label = '<span class="live-label">EN DIRECT</span>';
                        cardClass = '';
                    } else if (type === 'top') {
                        label = '<span class="top-label">⭐ TOP</span>';
                        cardClass = 'top-event';
                    } else {
                        label = '<span class="coming-label">À VENIR</span>';
                        cardClass = 'coming';
                    }

                    const homeCrest = home.crest
                        ? `<img src="${home.crest}" alt="${home.Name}" loading="lazy" onerror="this.style.display='none'">`
                        : home.Name.substring(0, 2).toUpperCase();
                    const awayCrest = away.crest
                        ? `<img src="${away.crest}" alt="${away.Name}" loading="lazy" onerror="this.style.display='none'">`
                        : away.Name.substring(0, 2).toUpperCase();

                    html += `
                        <div class="match-card ${cardClass}" data-matchid="${matchId}">
                            <div class="match-header">
                                ${label}
                                <span class="match-time">${timeDisplay}</span>
                            </div>
                            <div class="score-line">
                                <div class="team-block home">
                                    <div class="team-crest">${homeCrest}</div>
                                    <div class="team-info">
                                        <span class="team-name">${home.Name}</span>
                                        <span class="team-score">${scores[0] || '0'}</span>
                                    </div>
                                </div>
                                <span class="vs-dash">⚡</span>
                                <div class="team-block away">
                                    <div class="team-crest">${awayCrest}</div>
                                    <div class="team-info">
                                        <span class="team-name">${away.Name}</span>
                                        <span class="team-score">${scores[1] || '0'}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="odds-row">
                                <div class="odd-item" data-selection="1" data-price="${odds1}" data-match="${home.Name} vs ${away.Name}">
                                    <div class="label">1</div>
                                    <div class="value">${odds1}</div>
                                </div>
                                <div class="odd-item" data-selection="X" data-price="${oddsX}" data-match="${home.Name} vs ${away.Name}">
                                    <div class="label">X</div>
                                    <div class="value highlight">${oddsX}</div>
                                </div>
                                <div class="odd-item" data-selection="2" data-price="${odds2}" data-match="${home.Name} vs ${away.Name}">
                                    <div class="label">2</div>
                                    <div class="value">${odds2}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
            });

            const scrollY = preserveScroll ? window.scrollY : 0;
            app.innerHTML = html;
            if (preserveScroll) window.scrollTo(0, scrollY);

            // Click events
            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.odd-item')) return;
                    const mid = this.dataset.matchid;
                    if (mid) showEventDetails(mid);
                });
            });

            document.querySelectorAll('.odd-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const match = this.dataset.match;
                    const selection = this.dataset.selection;
                    const price = parseFloat(this.dataset.price);
                    if (price && price > 0 && price !== '-') {
                        addToBetSlip(match, selection, price);
                    } else {
                        alert('Cote non disponible');
                    }
                });
            });
        }

        // ============================================================
        // 6. DETAILS VIEW avec Timeline
        // ============================================================
        async function showEventDetails(matchId) {
            try {
                currentMatchId = matchId;
                app.innerHTML = '<div class="loading">⏳ Chargement des détails...</div>';

                // Récupérer les détails du match
                const data = await fetchFromProxy('GetEventDetails', `eventId=${matchId}&sportId=1`);
                const result = data?.Result;
                if (!result) {
                    app.innerHTML = `<div class="error-msg">⚠️ Détails introuvables.</div>`;
                    return;
                }

                const homeTeam = result.Competitors?.[0]?.Name || 'Home';
                const awayTeam = result.Competitors?.[1]?.Name || 'Away';
                const league = result.ChampName || result.CategoryName || 'Ligue';
                const date = result.EventDate || '';
                const isLive = result.IsLiveEvent;

                let html = `
                    <button class="back-btn" id="backToList">← Retour</button>
                    <div class="match-detail-title">${homeTeam} vs ${awayTeam}</div>
                    <div class="match-detail-sub">${league} | ${date}</div>
                `;

                // Si match live, charger timeline
                if (isLive) {
                    try {
                        const timelineData = await fetchFromProxy('match_timeline', matchId);
                        const events = timelineData?.doc?.[0]?.data?.events || [];
                        const matchInfo = timelineData?.doc?.[0]?.data?.match || {};
                        const status = matchInfo?.status?.name || 'En direct';
                        const played = matchInfo?.timeinfo?.played || 0;
                        const timeDisplay = played ? Math.floor(played / 60) + '\'' : '';

                        html += `
                            <div style="display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
                                <span style="background:#1f2937; padding:4px 12px; border-radius:12px;">${status}</span>
                                <span style="background:#1f2937; padding:4px 12px; border-radius:12px;">⏱️ ${timeDisplay}</span>
                            </div>
                            <div class="timeline-container">
                                <div style="font-weight:600; margin-bottom:8px; color:#fbbf24;">📋 Événements</div>
                        `;

                        const recent = events.slice(-20).reverse();
                        recent.forEach(ev => {
                            const evTime = ev.time ? ev.time + '\'' : '--';
                            let icon = '•', cls = '';
                            if (ev.type === 'goal') { icon = '⚽'; cls = 'event-goal'; }
                            else if (ev.type === 'card' && ev.card === 'yellow') { icon = '🟨'; cls = 'event-yellow'; }
                            else if (ev.type === 'card' && ev.card === 'red') { icon = '🟥'; cls = 'event-red'; }
                            else if (ev.type === 'substitution') { icon = '🔄'; cls = 'event-sub'; }
                            else if (ev.type === 'shotontarget') { icon = '🎯'; }
                            else if (ev.type === 'corner') { icon = '🚩'; }
                            const teamName = ev.team === 'home' ? homeTeam : (ev.team === 'away' ? awayTeam : '');
                            const playerName = ev.player?.name || '';
                            const desc = ev.name || ev.type || '';
                            html += `
                                <div class="timeline-event">
                                    <span class="time">${evTime}</span>
                                    <span class="icon ${cls}">${icon}</span>
                                    <span class="desc">${teamName ? `<span style="font-weight:500;">${teamName}</span> ` : ''}${desc} ${playerName ? `(${playerName})` : ''}</span>
                                </div>
                            `;
                        });

                        html += `</div>`;
                    } catch (e) {
                        console.warn('Timeline non disponible:', e);
                    }
                }

                // Marchés
                const marketGroups = result.MarketGroups || [];
                marketGroups.forEach(group => {
                    if (!group.Items || group.Items.length === 0) return;
                    html += `<div class="market-group"><div class="market-title">${group.Name || 'Marché'}</div><div class="market-items">`;
                    group.Items.forEach(market => {
                        if (!market.Items || market.Items.length === 0) return;
                        market.Items.slice(0, 10).forEach(item => {
                            const name = item.Name || item.ShortName || '—';
                            const price = item.Price || '-';
                            html += `
                                <div class="market-item" data-selection="${name}" data-price="${price}" data-match="${homeTeam} vs ${awayTeam}">
                                    <div class="name">${name}</div>
                                    <div class="price">${price}</div>
                                </div>
                            `;
                        });
                    });
                    html += `</div></div>`;
                });

                app.innerHTML = html;

                document.getElementById('backToList').addEventListener('click', () => {
                    currentMatchId = null;
                    loadView(currentView, true);
                });

                document.querySelectorAll('.market-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const match = this.dataset.match;
                        const selection = this.dataset.selection;
                        const price = parseFloat(this.dataset.price);
                        if (price && price > 0 && price !== '-') {
                            addToBetSlip(match, selection, price);
                        } else {
                            alert('Cote non disponible');
                        }
                    });
                });

            } catch (error) {
                app.innerHTML = `<div class="error-msg">⛔ Erreur: ${error.message}</div>`;
                console.error(error);
            }
        }

        // ============================================================
        // 7. LOAD VIEWS
        // ============================================================
        async function loadView(view, preserveScroll = false) {
            if (isUpdating) return;
            isUpdating = true;

            try {
                currentView = view;
                if (currentMatchId) { isUpdating = false; return; }

                let events = [];
                const cacheKey = `${view}_${currentDay}`;

                if (eventsCache[cacheKey]) {
                    events = eventsCache[cacheKey];
                    renderMatchList(events, view, preserveScroll);
                    isUpdating = false;
                    return;
                }

                app.innerHTML = '<div class="loading">⏳ Chargement...</div>';

                if (view === 'live') {
                    const data = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=15');
                    events = data?.Result?.Items?.[0]?.Events || [];
                } else if (view === 'top') {
                    const data = await fetchFromProxy('GetTopEvents', '');
                    events = data?.Result?.Events || [];
                } else if (view === 'upcoming') {
                    if (currentDay === 0) {
                        const data = await fetchFromProxy('GetUpcoming', 'sportId=1&showAllEvents=false&count=15');
                        events = data?.Result?.Items?.[0]?.Events || [];
                    } else {
                        const range = getDateRange(currentDay);
                        const data = await fetchFromProxy('GetEvents',
                            `sportids=1&categoryids=0&champids=0&period=perioddate&outrightsDisplay=none&marketTypeIds=1,16,11&couponType=0&marketGroupId=0&group=AllEvents&withLive=false&startDate=${encodeURIComponent(range.start)}&endDate=${encodeURIComponent(range.end)}`
                        );
                        events = data?.Result?.Items?.[0]?.Events || [];
                    }
                }

                eventsCache[cacheKey] = events;
                renderMatchList(events, view, preserveScroll);

            } catch (error) {
                if (!preserveScroll) {
                    app.innerHTML = `<div class="error-msg">⛔ Erreur: ${error.message}</div>`;
                }
                console.error(error);
            }

            isUpdating = false;
        }

        // ============================================================
        // 8. SILENT REFRESH
        // ============================================================
        async function silentRefresh() {
            if (isUpdating || currentMatchId) return;

            try {
                const view = currentView;
                const cacheKey = `${view}_${currentDay}`;
                let events = [];

                if (view === 'live') {
                    const data = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=15');
                    events = data?.Result?.Items?.[0]?.Events || [];
                } else if (view === 'top') {
                    const data = await fetchFromProxy('GetTopEvents', '');
                    events = data?.Result?.Events || [];
                } else if (view === 'upcoming') {
                    if (currentDay === 0) {
                        const data = await fetchFromProxy('GetUpcoming', 'sportId=1&showAllEvents=false&count=15');
                        events = data?.Result?.Items?.[0]?.Events || [];
                    } else {
                        const range = getDateRange(currentDay);
                        const data = await fetchFromProxy('GetEvents',
                            `sportids=1&categoryids=0&champids=0&period=perioddate&outrightsDisplay=none&marketTypeIds=1,16,11&couponType=0&marketGroupId=0&group=AllEvents&withLive=false&startDate=${encodeURIComponent(range.start)}&endDate=${encodeURIComponent(range.end)}`
                        );
                        events = data?.Result?.Items?.[0]?.Events || [];
                    }
                }

                eventsCache[cacheKey] = events;
                if (currentView === view && !currentMatchId) {
                    renderMatchList(events, view, true);
                }

            } catch (error) {
                console.error('Silent refresh error:', error);
            }
        }

        // ============================================================
        // 9. NAVIGATION
        // ============================================================

        document.querySelectorAll('.nav-tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMatchId = null;
                loadView(this.dataset.view);
            });
        });

        document.querySelectorAll('.days-tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.days-tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentDay = parseInt(this.dataset.day);
                currentMatchId = null;
                delete eventsCache[`${currentView}_${currentDay}`];
                loadView(currentView);
            });
        });

        document.getElementById('home-link').addEventListener('click', function(e) {
            e.preventDefault();
            currentMatchId = null;
            const activeTab = document.querySelector('.nav-tabs .active');
            loadView(activeTab ? activeTab.dataset.view : 'live');
        });

        // ============================================================
        // 10. INIT
        // ============================================================
        loadView('live');
        setInterval(silentRefresh, 30000);

        window.loadView = loadView;
        window.showEventDetails = showEventDetails;
    </script>
</body>
</html>
