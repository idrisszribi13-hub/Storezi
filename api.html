<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Goal 216</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e14;--bg-2:#11161f;--bg-3:#171e2a;--bg-4:#1e2733;--bg-5:#252f3e;--border:#232c3a;--text:#eef2f7;--text-dim:#8b95a5;--text-mute:#5a6577;--accent:#00e676;--accent-2:#00c853;--gold:#ffc107;--gold-2:#ffb300;--live:#ff2d55;--violet:#a855f7;--blue:#3b82f6}
html,body{background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior-y:none}
body{padding:0 12px 120px;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(0,230,118,.08),transparent 70%),radial-gradient(ellipse 60% 40% at 100% 30%,rgba(168,85,247,.05),transparent 70%),var(--bg)}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 14px;position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--bg) 60%,rgba(10,14,20,.95) 100%);backdrop-filter:blur(10px)}
.header h1{font-size:22px;font-weight:800;letter-spacing:-.5px;cursor:pointer;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),#6ee7b7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header h1::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse-dot 1.6s infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.header-right{display:flex;align-items:center;gap:8px}
.balance-badge{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,rgba(255,193,7,.15),rgba(255,193,7,.05));border:1px solid rgba(255,193,7,.35);padding:6px 11px;border-radius:20px;font-size:12px;font-weight:800;color:var(--gold);cursor:pointer}
.balance-badge::before{content:'💰';font-size:13px}
.badge{display:flex;align-items:center;gap:6px;background:rgba(255,45,85,.12);border:1px solid rgba(255,45,85,.3);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.8px;color:#ff5c7a}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.top-menu{display:flex;gap:6px;margin-bottom:12px}
.top-menu button{flex:1;background:var(--bg-2);border:1px solid var(--border);color:var(--text-dim);padding:10px 12px;font-size:12px;font-weight:700;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.top-menu button:hover{background:var(--bg-3);color:var(--text)}
.top-menu button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06120b;border-color:transparent}
.calendar-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calendar-icon-btn{flex-shrink:0;background:var(--bg-2);border:1px solid var(--border);color:var(--accent);width:40px;height:40px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.days-tabs{display:flex;gap:6px;flex:1;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days-tabs::-webkit-scrollbar{display:none}
.days-tabs button{background:var(--bg-2);border:1px solid var(--border);color:var(--text-dim);padding:9px 15px;font-size:12px;font-weight:600;cursor:pointer;border-radius:10px;white-space:nowrap;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;transition:.2s}
.days-tabs button .day-num{font-size:14px;font-weight:800;line-height:1}
.days-tabs button .day-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.6px;opacity:.7}
.days-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06120b;border-color:transparent;box-shadow:0 4px 16px rgba(0,230,118,.35)}
.nav-tabs{display:flex;gap:6px;margin-bottom:18px;padding:5px;background:var(--bg-2);border:1px solid var(--border);border-radius:14px}
.nav-tabs button{flex:1;background:transparent;border:none;color:var(--text-dim);padding:10px 14px;font-size:12.5px;font-weight:700;cursor:pointer;border-radius:10px;white-space:nowrap;transition:.2s}
.nav-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06120b}

/* MATCH CARD */
.match-card{position:relative;background:linear-gradient(180deg,var(--bg-2),var(--bg-3));border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:.25s;overflow:hidden}
.match-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--live);box-shadow:0 0 12px var(--live)}
.match-card.coming::before{background:var(--gold);box-shadow:0 0 12px rgba(255,193,7,.5)}
.match-card.top-event::before{background:var(--violet);box-shadow:0 0 12px rgba(168,85,247,.5)}
.match-card:hover{transform:translateY(-2px);border-color:#2f3a4d}
.match-header{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:12px;gap:8px}
.match-time{font-weight:800;color:var(--gold);font-size:12px;font-variant-numeric:tabular-nums}
.match-time.ht{color:var(--accent);background:rgba(0,230,118,.12);padding:2px 8px;border-radius:6px;font-size:10px;letter-spacing:.5px}
.match-league{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%;background:rgba(255,255,255,.04);padding:3px 9px;border-radius:20px;color:var(--text-dim);font-weight:600;border:1px solid rgba(255,255,255,.05)}
.match-league img{height:14px;width:14px;object-fit:contain;border-radius:50%}

/* FIX SCORE LINE - Grid layout robuste */
.score-line{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:center;padding:8px 0 12px}
.team-block{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}
.team-block.away{flex-direction:row-reverse}
.team-crest{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--bg-4),var(--bg-2));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--text-dim);overflow:hidden;border:1px solid var(--border)}
.team-crest img{width:80%;height:80%;object-fit:contain}
.team-info{display:flex;flex-direction:column;min-width:0;flex:1;overflow:hidden}
.team-block.away .team-info{align-items:flex-end;text-align:right}
.team-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.team-score{font-size:24px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff,#a5b4cb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;min-height:26px}
.team-block.away .team-score{background:linear-gradient(135deg,var(--gold),var(--gold-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.vs-dash{text-align:center;color:#3b4656;font-size:14px}

.odds-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.odd-item{position:relative;text-align:center;padding:10px 6px;background:linear-gradient(180deg,var(--bg-4),var(--bg-3));border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.2s}
.odd-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.odd-item:active{transform:scale(.97)}
.odd-item.selected{border-color:var(--accent);background:linear-gradient(180deg,rgba(0,230,118,.15),rgba(0,230,118,.05))}
.odd-item .label{font-size:10px;color:var(--text-mute);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.odd-item .value{font-size:15px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;transition:.2s}
.odd-item .value.highlight{color:#fff}
.odd-item .value.up{color:var(--accent)}
.odd-item .value.down{color:var(--live)}
.odd-item .arrow{font-size:9px;margin-left:3px}

.live-label,.top-label,.coming-label{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;letter-spacing:.7px;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.live-label{background:rgba(255,45,85,.15);color:#ff5c7a;border:1px solid rgba(255,45,85,.35)}
.live-label::before{content:'';width:5px;height:5px;background:var(--live);border-radius:50%;box-shadow:0 0 6px var(--live);animation:blink 1.2s infinite}
.top-label{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.35)}
.coming-label{background:rgba(255,193,7,.12);color:var(--gold);border:1px solid rgba(255,193,7,.3)}

/* DETAIL */
.back-btn{background:var(--bg-3);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.detail-hero{background:linear-gradient(180deg,var(--bg-2),var(--bg-3));border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.detail-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--violet),var(--gold))}
.detail-league{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-size:11px;color:var(--text-dim);font-weight:600;margin-bottom:12px}
.detail-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}
.detail-team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.detail-team-crest{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--bg-4),var(--bg-2));display:flex;align-items:center;justify-content:center;border:2px solid var(--border);overflow:hidden;font-size:14px;font-weight:800;color:var(--text-dim)}
.detail-team-crest img{width:80%;height:80%;object-fit:contain}
.detail-team-name{font-size:12px;font-weight:700;line-height:1.2;max-width:110px}
.detail-score-box{display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(135deg,var(--bg-4),var(--bg-3));border:1px solid var(--border);padding:10px 16px;border-radius:14px;min-width:100px}
.detail-score{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.detail-score-time{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.5px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.detail-score-time::before{content:'';width:5px;height:5px;background:var(--live);border-radius:50%;box-shadow:0 0 6px var(--live);animation:blink 1.2s infinite}
.detail-score-time.ht{color:var(--gold)}
.detail-score-time.ht::before{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.detail-status{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.status-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.04);border:1px solid var(--border);padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;color:var(--text-dim)}
.status-chip.live-chip{color:#ff5c7a;border-color:rgba(255,45,85,.3);background:rgba(255,45,85,.08)}
.status-chip.ht-chip{color:var(--gold);border-color:rgba(255,193,7,.35);background:rgba(255,193,7,.1)}

/* STICKY 1X2 BAR (dans le détail) */
.sticky-1x2{position:sticky;top:56px;z-index:20;background:linear-gradient(180deg,var(--bg-3),var(--bg-2));border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.sticky-1x2 .odd-item{padding:8px 4px;border-radius:8px}
.sticky-1x2 .odd-item .label{font-size:9px}
.sticky-1x2 .odd-item .value{font-size:14px}

/* MARKET TABS */
.market-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.market-tabs::-webkit-scrollbar{display:none}
.market-tabs button{background:var(--bg-3);border:1px solid var(--border);color:var(--text-dim);padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;border-radius:10px;white-space:nowrap;flex-shrink:0;transition:.2s}
.market-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06120b;border-color:transparent}

/* ACCORDION SECTIONS (comme le vrai site) */
.market-section{background:linear-gradient(180deg,var(--bg-2),var(--bg-3));border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:.2s}
.market-section-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;background:linear-gradient(180deg,rgba(255,193,7,.06),transparent);border-bottom:1px solid transparent;transition:.2s}
.market-section.open .market-section-header{border-bottom-color:var(--border)}
.market-section-header:active{background:rgba(255,255,255,.03)}
.market-section-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.6px}
.market-section-title::before{content:'★';color:var(--gold);font-size:12px}
.market-section-arrow{color:var(--text-dim);font-size:11px;transition:transform .3s}
.market-section.open .market-section-arrow{transform:rotate(180deg)}
.market-section-body{display:none;padding:14px}
.market-section.open .market-section-body{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.market-items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.market-item{background:linear-gradient(180deg,var(--bg-4),var(--bg-3));border:1px solid var(--border);padding:10px 8px;border-radius:10px;text-align:center;cursor:pointer;transition:.2s;position:relative;min-height:52px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.market-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.market-item.selected{border-color:var(--accent);background:linear-gradient(180deg,rgba(0,230,118,.15),rgba(0,230,118,.05))}
.market-item.selected::after{content:'✓';position:absolute;top:-6px;right:-6px;background:var(--accent);color:#06120b;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.market-item.locked{opacity:.4;cursor:not-allowed;pointer-events:none}
.market-item.locked::before{content:'🔒';position:absolute;top:50%;right:6px;transform:translateY(-50%);font-size:10px;opacity:.6}
.market-item .name{font-size:10px;color:var(--text-dim);font-weight:700;margin-bottom:4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.market-item .price{font-size:14px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.market-item .price.changed-up{color:var(--accent);animation:flashUp .8s}
.market-item .price.changed-down{color:var(--live);animation:flashDown .8s}
@keyframes flashUp{0%{background:rgba(0,230,118,.3);border-radius:4px}100%{background:transparent}}
@keyframes flashDown{0%{background:rgba(255,45,85,.3);border-radius:4px}100%{background:transparent}}

/* TIMELINE */
.timeline-wrap{background:linear-gradient(180deg,var(--bg-2),var(--bg-3));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;max-height:300px;overflow-y:auto}
.timeline-header{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--gold);margin-bottom:10px;letter-spacing:.8px;text-transform:uppercase}
.period-separator{display:flex;align-items:center;gap:10px;margin:10px 0 6px;padding:7px 11px;background:linear-gradient(90deg,rgba(0,230,118,.08),transparent);border-left:3px solid var(--accent);border-radius:6px;font-size:11px;font-weight:800;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.period-separator.ht{background:linear-gradient(90deg,rgba(255,193,7,.12),transparent);border-left-color:var(--gold);color:var(--gold)}
.timeline-event{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;animation:fadeIn .3s}
.timeline-event:last-child{border-bottom:none}
.timeline-event .time{color:var(--gold);font-weight:800;min-width:34px;font-variant-numeric:tabular-nums}
.timeline-event .icon{width:22px;text-align:center;font-size:14px}
.timeline-event .desc{flex:1;font-size:12px}
.timeline-event .team-name{font-weight:700;color:var(--text-dim)}
.event-goal{color:var(--accent);font-weight:800}
.event-card-yellow{color:var(--gold)}
.event-card-red{color:var(--live)}
.event-sub{color:var(--blue)}
.event-corner{color:var(--violet)}

/* BET SLIP TOGGLE */
.bet-slip-toggle{position:fixed;bottom:88px;right:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06120b;border:none;border-radius:50%;width:58px;height:58px;font-size:24px;cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,230,118,.45);animation:pulse-shadow 2s infinite}
@keyframes pulse-shadow{0%{box-shadow:0 8px 24px rgba(0,230,118,.45),0 0 0 0 rgba(0,230,118,.5)}70%{box-shadow:0 8px 24px rgba(0,230,118,.45),0 0 0 14px rgba(0,230,118,0)}100%{box-shadow:0 8px 24px rgba(0,230,118,.45),0 0 0 0 rgba(0,230,118,0)}}
.bet-slip-toggle .badge{position:absolute;top:-4px;right:-4px;background:linear-gradient(135deg,#ff2d55,#ff5c7a);color:white;border-radius:50%;min-width:22px;height:22px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.bet-slip-toggle .badge::before{display:none}

.bet-slip{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--bg-2),var(--bg));border-top:2px solid var(--accent);padding:22px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);z-index:99;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.6)}
.bet-slip::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:4px;background:var(--bg-4);border-radius:2px}
.bet-slip.open{transform:translateY(0)}
.slip-header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.slip-header h3{font-size:14px;letter-spacing:1px;color:var(--accent);font-weight:800}
.slip-tabs{display:flex;gap:4px;background:var(--bg-3);padding:4px;border-radius:10px;margin-bottom:14px}
.slip-tabs button{flex:1;background:transparent;border:none;color:var(--text-dim);padding:8px;font-size:12px;font-weight:700;border-radius:7px;cursor:pointer}
.slip-tabs button.active{background:var(--bg-5);color:var(--text)}
.slip-item{background:var(--bg-3);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.slip-item-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.slip-item-live{display:inline-flex;align-items:center;gap:4px;background:rgba(255,45,85,.15);color:#ff5c7a;border:1px solid rgba(255,45,85,.3);padding:2px 7px;border-radius:5px;font-size:9px;font-weight:800;letter-spacing:.5px;margin-bottom:5px}
.slip-item-match{font-size:12px;font-weight:700;line-height:1.3}
.slip-item-selection{font-size:11px;color:var(--text-dim);margin-top:3px}
.slip-item-selection strong{color:var(--accent)}
.slip-item-remove{background:var(--live);color:white;border:none;width:24px;height:24px;border-radius:7px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stake-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.stake-input-wrap{flex:1;position:relative}
.stake-input-wrap .currency{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:var(--text-mute)}
.stake-input{width:100%;background:var(--bg-4);border:1px solid var(--border);border-radius:9px;padding:10px 10px 10px 40px;color:var(--text);font-size:14px;font-weight:700;outline:none}
.stake-input:focus{border-color:var(--accent)}
.stake-quick{display:flex;gap:4px}
.stake-quick button{background:var(--bg-4);border:1px solid var(--border);color:var(--text-dim);padding:8px 8px;font-size:11px;font-weight:700;border-radius:7px;cursor:pointer}

<script>
// ============================================================
// CONFIG
// ============================================================
const PROXY_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co/functions/v1/altenar-proxy';
const API_SPORTS_KEY = 'e227ff90ed4eacc3eacb07eca05ce78b';

// ============================================================
// STATE
// ============================================================
let currentView = 'live';
let currentDay = 0;
let currentMatchId = null;
let eventsCache = {};
let isUpdating = false;
let listRefreshInterval = null;
let currentMarketTab = 'main';
let balance = 1000.00;
let betSlip = [];
let slipMode = 'simple';
let myBets = [];
let currentBetsFilter = 'open';
let liveEventsCache = {};

// LIVE DETAIL TIMERS
let liveDetailApiTimer = null;   // Fetch API toutes les 3s
let liveDetailClockTimer = null; // Tick horloge toutes les 1s
let localLiveSeconds = 0;        // Secondes écoulées depuis le dernier sync
let localBaseMinutes = 0;        // Minutes au moment du sync
let localIsHalftime = false;
let currentLiveEventRef = null;  // Référence au liveEvent courant

const logoCache = {};
const leagueLogoCache = {};

const app = document.getElementById('app');
const betSlipEl = document.getElementById('betSlip');
const myBetsEl = document.getElementById('myBetsPanel');
const betSlipItemsEl = document.getElementById('betSlipItems');
const myBetsListEl = document.getElementById('myBetsList');
const betCountEl = document.getElementById('betCount');
const toastEl = document.getElementById('toast');

// ============================================================
// PERSISTENCE
// ============================================================
function saveState() {
  try {
    localStorage.setItem('goal216_balance', String(balance));
    localStorage.setItem('goal216_myBets', JSON.stringify(myBets));
  } catch(e) {}
}
function loadState() {
  try {
    const b = localStorage.getItem('goal216_balance');
    if (b) balance = parseFloat(b) || 1000;
    const mb = localStorage.getItem('goal216_myBets');
    if (mb) myBets = JSON.parse(mb) || [];
  } catch(e) {}
}

// ============================================================
// HELPERS
// ============================================================
async function fetchFromProxy(endpoint, extraParams = '') {
  let url = `${PROXY_URL}?endpoint=${endpoint}`;
  if (extraParams) url += `&extraParams=${extraParams}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return await response.json();
}

async function fetchTeamLogo(teamName) {
  if (!teamName) return null;
  const key = teamName.trim().toLowerCase();
  if (logoCache[key] !== undefined) return logoCache[key];
  try {
    const response = await fetch(`https://v3.football.api-sports.io/teams?search=${encodeURIComponent(teamName)}`, { headers: { 'x-apisports-key': API_SPORTS_KEY } });
    if (response.ok) {
      const data = await response.json();
      if (data.response?.length > 0) { logoCache[key] = data.response[0].team.logo; return logoCache[key]; }
    }
    logoCache[key] = null; return null;
  } catch (e) { logoCache[key] = null; return null; }
}

async function fetchLeagueLogo(leagueName) {
  if (!leagueName) return null;
  const key = leagueName.trim().toLowerCase();
  if (leagueLogoCache[key] !== undefined) return leagueLogoCache[key];
  try {
    const response = await fetch(`https://v3.football.api-sports.io/leagues?search=${encodeURIComponent(leagueName)}`, { headers: { 'x-apisports-key': API_SPORTS_KEY } });
    if (response.ok) {
      const data = await response.json();
      if (data.response?.length > 0) { leagueLogoCache[key] = data.response[0].league.logo; return leagueLogoCache[key]; }
    }
    leagueLogoCache[key] = null; return null;
  } catch (e) { leagueLogoCache[key] = null; return null; }
}

function extractOdds(markets) {
  let odds1 = '-', oddsX = '-', odds2 = '-';
  if (!markets) return { odds1, oddsX, odds2 };
  const market = markets.find(m => m.Id === 1 || m.MarketId === 1);
  if (market?.Items) {
    const items = market.Items;
    odds1 = items.find(i => i.SelectionTypeId === 1)?.Price || odds1;
    oddsX = items.find(i => i.SelectionTypeId === 2)?.Price || oddsX;
    odds2 = items.find(i => i.SelectionTypeId === 3)?.Price || odds2;
  }
  return { odds1, oddsX, odds2 };
}

function getDateRange(dayOffset) {
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() + dayOffset);
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(start.getDate() + 1);
  end.setHours(23,59,59,999);
  return { start: start.toISOString(), end: end.toISOString() };
}

function extractTime24(eventDate) {
  if (!eventDate) return '--:--';
  try {
    const d = new Date(eventDate);
    if (isNaN(d.getTime())) return '--:--';
    return `${String(d.getHours()).padStart(2,'0')}h${String(d.getMinutes()).padStart(2,'0')}`;
  } catch (e) { return '--:--'; }
}

// === FIX SCORE: parsing ultra-robuste ===
function extractScore(match) {
  if (!match) return { home: 0, away: 0, halftime: false, liveTime: '', isLive: false };

  let liveTime = match.LiveCurrentTime || match.CurrentTime || '';
  const statusStr = (match.MatchStatus || match.Status || '').toString().toLowerCase();
  const isHalftime = 
    liveTime === 'Halftime' || liveTime === 'HT' || liveTime === 'Break' ||
    statusStr.includes('half') || statusStr.includes('mi-temps') || statusStr.includes('halftime');

  let home = 0, away = 0;
  let found = false;

  // 1) Essayer LiveScore, Score, Scores
  const candidates = [match.LiveScore, match.Score, match.Scores, match.CurrentScore, match.LiveMatchScore];
  for (const c of candidates) {
    if (c === undefined || c === null || c === '') continue;
    if (typeof c === 'object') {
      const h = c.Home ?? c.home ?? c.HomeScore ?? c.homeScore;
      const a = c.Away ?? c.away ?? c.AwayScore ?? c.awayScore;
      if (h !== undefined || a !== undefined) {
        home = parseInt(h) || 0;
        away = parseInt(a) || 0;
        found = true;
        break;
      }
    } else if (typeof c === 'string') {
      const trimmed = c.trim();
      // Format "1:0" ou "1-0" ou "1 : 0"
      const m = trimmed.match(/^(\d+)\s*[:\-–]\s*(\d+)/);
      if (m) {
        home = parseInt(m[1]) || 0;
        away = parseInt(m[2]) || 0;
        found = true;
        break;
      }
      // Format "1" (juste home)
      const single = trimmed.match(/^(\d+)$/);
      if (single) {
        home = parseInt(single[1]) || 0;
        away = 0;
        found = true;
        break;
      }
    }
  }

  // 2) Fallback HomeScore / AwayScore
  if (!found) {
    if (match.HomeScore !== undefined) { home = parseInt(match.HomeScore) || 0; found = true; }
    if (match.AwayScore !== undefined) { away = parseInt(match.AwayScore) || 0; found = true; }
  }

  // 3) Fallback depuis Competitors (parfois le score est là)
  if (!found && match.Competitors?.length >= 2) {
    const c0 = match.Competitors[0];
    const c1 = match.Competitors[1];
    if (c0.Score !== undefined) { home = parseInt(c0.Score) || 0; found = true; }
    if (c1.Score !== undefined) { away = parseInt(c1.Score) || 0; found = true; }
  }

  const isLive = !!(liveTime && liveTime !== '0' && liveTime !== '');

  return { home, away, halftime: isHalftime, liveTime: isHalftime ? 'MI-TEMPS' : liveTime, isLive };
}

function showToast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.className = 'toast' + (isError ? ' error' : '');
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
}

// ============================================================
// CALENDAR
// ============================================================
function renderDaysTabs() {
  const daysNames = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const today = new Date();
  const tabsEl = document.getElementById('daysTabs');
  let html = '';
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    let lbl;
    if (i === 0) lbl = "Auj.";
    else if (i === 1) lbl = "Demain";
    else lbl = daysNames[d.getDay()];
    html += `<button class="${i === 0 ? 'active' : ''}" data-day="${i}">
      <span class="day-num">${String(d.getDate()).padStart(2,'0')}</span>
      <span class="day-lbl">${lbl}</span>
    </button>`;
  }
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', function() {
      tabsEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentDay = parseInt(this.dataset.day);
      stopAllDetailTimers();
      currentMatchId = null;
      startListRefresh();
      delete eventsCache[`${currentView}_${currentDay}`];
      loadView(currentView);
    });
  });
}

// ============================================================
// MY BETS
// ============================================================
function renderMyBets() {
  const openBets = myBets.filter(b => b.status === 'open');
  const settledBets = myBets.filter(b => b.status !== 'open');
  document.getElementById('cntOpen').textContent = openBets.length;
  document.getElementById('cntSettled').textContent = settledBets.length;
  document.getElementById('cntAll').textContent = myBets.length;
  document.getElementById('myBetsCount').textContent = openBets.length;

  let list = currentBetsFilter === 'open' ? openBets : currentBetsFilter === 'settled' ? settledBets : myBets;
  list = [...list].sort((a,b) => b.placedAt - a.placedAt);

  if (list.length === 0) {
    const msgs = {
      open: { icon: '🟡', title: 'Aucun pari en cours', sub: 'Placez un pari pour le voir ici' },
      settled: { icon: '✅', title: 'Aucun pari réglé', sub: 'Vos paris réglés apparaîtront ici' },
      all: { icon: '📊', title: 'Aucun historique', sub: 'Vos paris apparaîtront ici' }
    };
    const m = msgs[currentBetsFilter];
    myBetsListEl.innerHTML = `<div class="empty-state"><div class="icon">${m.icon}</div><div class="title">${m.title}</div><div class="sub">${m.sub}</div></div>`;
    return;
  }

  let html = '';
  list.forEach(bet => {
    const statusClass = bet.status;
    const statusLabel = { open: '🟡 En cours', won: '✅ Gagné', lost: '❌ Perdu' }[bet.status] || bet.status;
    const typeLabel = bet.mode === 'combine' ? `${bet.selections.length}-Combiné` : (bet.selections.length === 1 ? 'Simple' : `${bet.selections.length} Simples`);
    const dateStr = new Date(bet.placedAt).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

    html += `<div class="bet-history-card ${statusClass}">
      <div class="bhc-header">
        <span class="bhc-type">${typeLabel}</span>
        <span class="bhc-status ${statusClass}">${statusLabel}</span>
      </div>
      <div class="bhc-body">
        ${bet.selections.map(s => `
          <div class="bhc-selection">
            <div class="bhc-selection-left">
              <div class="bhc-selection-name">${s.selection}</div>
              <div class="bhc-selection-match">${s.match}</div>
              <div class="bhc-selection-info">${s.isLive ? '🔴 LIVE' : '📅 À venir'}</div>
            </div>
            <div><div class="bhc-selection-odds">${s.price.toFixed(2)}</div></div>
          </div>
        `).join('')}
      </div>
      <div class="bhc-footer">
        <div><span class="label">Mise:</span><span class="value"> ${bet.totalStake.toFixed(2)} TND</span></div>
        <div><span class="label">${bet.status === 'open' ? 'Gain pot.' : 'Gain:'}</span><span class="value ${bet.status === 'won' ? 'win' : ''}"> ${(bet.status === 'won' ? bet.actualWin : bet.potentialWin).toFixed(2)} TND</span></div>
      </div>
      <div class="bhc-id">ID: ${bet.id}</div>
      <div class="bhc-date">${dateStr}</div>
    </div>`;
  });
  myBetsListEl.innerHTML = html;
}

function simulateSettlement(betId) {
  setTimeout(() => {
    const bet = myBets.find(b => b.id === betId);
    if (!bet || bet.status !== 'open') return;
    const won = Math.random() < 0.6;
    bet.status = won ? 'won' : 'lost';
    bet.settledAt = Date.now();
    if (won) {
      bet.actualWin = bet.potentialWin;
      balance += bet.potentialWin;
      updateBalanceUI();
      showToast(`🎉 Pari gagné ! +${bet.potentialWin.toFixed(2)} TND`);
    } else {
      bet.actualWin = 0;
      showToast(`❌ Pari perdu`, true);
    }
    saveState();
    renderMyBets();
  }, 15000 + Math.random() * 10000);
}

document.getElementById('myBetsBtn').addEventListener('click', () => { myBetsEl.classList.add('open'); renderMyBets(); });
document.getElementById('openSlipBtn').addEventListener('click', () => betSlipEl.classList.add('open'));
document.getElementById('closeMyBets').addEventListener('click', () => myBetsEl.classList.remove('open'));
document.querySelectorAll('.mybets-tabs button').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.mybets-tabs button').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentBetsFilter = this.dataset.betfilter;
    renderMyBets();
  });
});

function updateBalanceUI() {
  document.getElementById('balanceDisplay').textContent = balance.toFixed(2);
  saveState();
}

function updateBetSlipUI() {
  document.getElementById('slipCount').textContent = betSlip.length;
  if (betSlip.length === 0) {
    betSlipItemsEl.innerHTML = '<p style="color:#5a6577;text-align:center;padding:30px 0;font-size:13px;">🛒 Aucun pari sélectionné</p>';
    betCountEl.textContent = '0';
    document.getElementById('slipSummary').style.display = 'none';
    document.getElementById('clearAllBtn').style.display = 'none';
    document.getElementById('placeBetBtn').disabled = true;
    return;
  }
  document.getElementById('clearAllBtn').style.display = 'block';
  document.getElementById('placeBetBtn').disabled = false;

  let html = '';
  betSlip.forEach((item, index) => {
    html += `
      <div class="slip-item">
        <div class="slip-item-header">
          <div style="flex:1;min-width:0;">
            ${item.isLive ? '<div class="slip-item-live">LIVE</div>' : ''}
            <div class="slip-item-match">${item.match}</div>
            <div class="slip-item-selection"><strong>${item.selection}</strong> @ <strong style="color:var(--gold)">${item.price.toFixed(2)}</strong></div>
          </div>
          <button class="slip-item-remove" data-index="${index}">✕</button>
        </div>
        <div class="stake-row">
          <div class="stake-input-wrap">
            <span class="currency">TND</span>
            <input type="number" class="stake-input" data-stake-index="${index}" value="${item.stake || ''}" placeholder="0.00" min="0" step="10">
          </div>
          <div class="stake-quick">
            <button data-quick="10" data-idx="${index}">10</button>
            <button data-quick="50" data-idx="${index}">50</button>
            <button data-quick="100" data-idx="${index}">100</button>
          </div>
        </div>
      </div>
    `;
  });
  betSlipItemsEl.innerHTML = html;
  betCountEl.textContent = betSlip.length;

  document.querySelectorAll('.slip-item-remove').forEach(btn => {
    btn.addEventListener('click', function() {
      betSlip.splice(parseInt(this.dataset.index), 1);
      updateBetSlipUI();
    });
  });
  document.querySelectorAll('.stake-input').forEach(input => {
    input.addEventListener('input', function() {
      betSlip[parseInt(this.dataset.stakeIndex)].stake = parseFloat(this.value) || 0;
      updateSummary();
    });
  });
  document.querySelectorAll('[data-quick]').forEach(btn => {
    btn.addEventListener('click', function() {
      const idx = parseInt(this.dataset.idx);
      betSlip[idx].stake = (betSlip[idx].stake || 0) + parseFloat(this.dataset.quick);
      updateBetSlipUI();
    });
  });
  updateSummary();
}

function updateSummary() {
  const summary = document.getElementById('slipSummary');
  if (betSlip.length === 0) { summary.style.display = 'none'; return; }
  summary.style.display = 'block';
  let totalStake = 0, potentialWin = 0;
  if (slipMode === 'simple') {
    betSlip.forEach(item => {
      totalStake += item.stake || 0;
      potentialWin += (item.stake || 0) * item.price;
    });
  } else {
    totalStake = betSlip[0]?.stake || 0;
    potentialWin = totalStake * betSlip.reduce((p, i) => p * i.price, 1);
  }
  document.getElementById('totalStake').textContent = totalStake.toFixed(2) + ' TND';
  document.getElementById('potentialWin').textContent = potentialWin.toFixed(2) + ' TND';
}

function addToBetSlip(matchName, selection, price, isLive = false) {
  if (betSlip.find(b => b.match === matchName && b.selection === selection)) {
    showToast('⚠️ Déjà dans la fiche');
    return;
  }
  betSlip.push({ match: matchName, selection, price: parseFloat(price), stake: 0, isLive });
  updateBetSlipUI();
  betSlipEl.classList.add('open');
  showToast('✅ Ajouté');
}

document.getElementById('betSlipToggle').addEventListener('click', () => betSlipEl.classList.toggle('open'));
document.getElementById('closeBetSlip').addEventListener('click', () => betSlipEl.classList.remove('open'));
document.getElementById('clearAllBtn').addEventListener('click', () => { betSlip = []; updateBetSlipUI(); });
document.querySelectorAll('.slip-tabs button').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.slip-tabs button').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    slipMode = this.dataset.slipmode;
    updateSummary();
  });
});

document.getElementById('placeBetBtn').addEventListener('click', () => {
  if (betSlip.length === 0) return showToast('Ajoutez des paris', true);
  let totalStake = 0, potentialWin = 0;
  if (slipMode === 'simple') {
    betSlip.forEach(i => { totalStake += i.stake || 0; potentialWin += (i.stake || 0) * i.price; });
  } else {
    totalStake = betSlip[0]?.stake || 0;
    potentialWin = totalStake * betSlip.reduce((p, i) => p * i.price, 1);
  }
  if (totalStake <= 0) return showToast('Saisissez une mise', true);
  if (totalStake > balance) return showToast('Solde insuffisant !', true);
  balance -= totalStake;
  updateBalanceUI();
  const betId = 'B' + Date.now() + Math.floor(Math.random()*1000);
  myBets.unshift({
    id: betId, mode: slipMode,
    selections: betSlip.map(b => ({ match: b.match, selection: b.selection, price: b.price, isLive: b.isLive })),
    totalStake, potentialWin, actualWin: 0, status: 'open', placedAt: Date.now()
  });
  saveState();
  showToast(`🎉 Pari placé ! Gain pot: ${potentialWin.toFixed(2)} TND`);
  simulateSettlement(betId);
  betSlip = [];
  updateBetSlipUI();
  betSlipEl.classList.remove('open');
  renderMyBets();
});

document.getElementById('balanceBtn').addEventListener('click', () => document.getElementById('topupModal').classList.add('show'));
document.getElementById('cancelTopup').addEventListener('click', () => document.getElementById('topupModal').classList.remove('show'));
let selectedTopupAmount = 100;
document.querySelectorAll('#topupAmounts button').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#topupAmounts button').forEach(b => b.classList.remove('selected'));
    this.classList.add('selected');
    selectedTopupAmount = parseInt(this.dataset.amount);
  });
});
document.getElementById('confirmTopup').addEventListener('click', () => {
  balance += selectedTopupAmount;
  updateBalanceUI();
  document.getElementById('topupModal').classList.remove('show');
  showToast(`💰 +${selectedTopupAmount} TND`);
});

async function renderMatchList(events, type = 'live', preserveScroll = false) {
  if (!events || events.length === 0) {
    app.innerHTML = `<div class="error-msg">⚠️ Aucun événement trouvé.</div>`;
    return;
  }
  liveEventsCache = {};
  events.forEach(e => liveEventsCache[e.Id] = e);

  const matchesWithLogos = await Promise.all(events.map(async (match) => {
    const comps = match.Competitors || [];
    const homeName = comps[0]?.Name || 'Home';
    const awayName = comps[1]?.Name || 'Away';
    const leagueName = match.ChampName || match.CategoryName || '';
    const [homeLogo, awayLogo, leagueLogo] = await Promise.all([
      fetchTeamLogo(homeName), fetchTeamLogo(awayName), leagueName ? fetchLeagueLogo(leagueName) : Promise.resolve(null)
    ]);
    return { ...match, homeLogo, awayLogo, leagueLogo };
  }));

  let html = '';
  matchesWithLogos.forEach(match => {
    const scoreData = extractScore(match);
    const isLive = scoreData.isLive || (match.LiveCurrentTime && match.LiveCurrentTime !== '0' && match.LiveCurrentTime !== '');
    const timeDisplay = scoreData.halftime ? 'MI-TEMPS' : ((type === 'live' && isLive) ? (scoreData.liveTime || '--') : extractTime24(match.EventDate));
    const league = match.ChampName || match.CategoryName || 'Championnat';
    const matchId = match.Id;
    const homeName = match.Competitors?.[0]?.Name || 'Home';
    const awayName = match.Competitors?.[1]?.Name || 'Away';
    const { odds1, oddsX, odds2 } = extractOdds(match.Items);

    let label = '', cardClass = '';
    if (type === 'live' && isLive) { label = '<span class="live-label">En direct</span>'; }
    else if (type === 'top') { label = '<span class="top-label">⭐ Top</span>'; cardClass = 'top-event'; }
    else { label = '<span class="coming-label">À venir</span>'; cardClass = 'coming'; }

    const homeCrest = match.homeLogo ? `<img src="${match.homeLogo}" loading="lazy">` : homeName.substring(0,2).toUpperCase();
    const awayCrest = match.awayLogo ? `<img src="${match.awayLogo}" loading="lazy">` : awayName.substring(0,2).toUpperCase();
    const leagueLogo = match.leagueLogo ? `<img src="${match.leagueLogo}" loading="lazy">` : '';
    const timeClass = scoreData.halftime ? 'match-time ht' : 'match-time';

    html += `
      <div class="match-card ${cardClass}" data-matchid="${matchId}">
        <div class="match-header">
          ${label}
          <span class="${timeClass}">${timeDisplay}</span>
          <span class="match-league">${leagueLogo} ${league}</span>
        </div>
        <div class="score-line">
          <div class="team-block home">
            <div class="team-crest">${homeCrest}</div>
            <div class="team-info">
              <span class="team-name">${homeName}</span>
              <span class="team-score">${scoreData.home}</span>
            </div>
          </div>
          <span class="vs-dash">⚡</span>
          <div class="team-block away">
            <div class="team-crest">${awayCrest}</div>
            <div class="team-info">
              <span class="team-name">${awayName}</span>
              <span class="team-score">${scoreData.away}</span>
            </div>
          </div>
        </div>
        <div class="odds-row">
          <div class="odd-item" data-selection="1" data-price="${odds1}" data-match="${homeName} vs ${awayName}" data-islive="${isLive}"><div class="label">1</div><div class="value">${odds1}</div></div>
          <div class="odd-item" data-selection="X" data-price="${oddsX}" data-match="${homeName} vs ${awayName}" data-islive="${isLive}"><div class="label">X</div><div class="value highlight">${oddsX}</div></div>
          <div class="odd-item" data-selection="2" data-price="${odds2}" data-match="${homeName} vs ${awayName}" data-islive="${isLive}"><div class="label">2</div><div class="value">${odds2}</div></div>
        </div>
      </div>
    `;
  });

  const scrollY = preserveScroll ? window.scrollY : 0;
  app.innerHTML = html;
  if (preserveScroll) window.scrollTo(0, scrollY);

  document.querySelectorAll('.match-card').forEach(card => {
    card.addEventListener('click', function(e) {
      if (e.target.closest('.odd-item')) return;
      if (this.dataset.matchid) showEventDetails(this.dataset.matchid);
    });
  });
  document.querySelectorAll('.odd-item').forEach(item => {
    item.addEventListener('click', function(e) {
      e.stopPropagation();
      const price = parseFloat(this.dataset.price);
      if (price && price > 0) {
        addToBetSlip(this.dataset.match, this.dataset.selection, price, this.dataset.islive === 'true');
        this.classList.add('selected');
        setTimeout(() => this.classList.remove('selected'), 800);
      } else showToast('Cote non disponible', true);
    });
  });
}

// ============================================================
function stopAllDetailTimers() {
  if (liveDetailApiTimer) { clearInterval(liveDetailApiTimer); liveDetailApiTimer = null; }
  if (liveDetailClockTimer) { clearInterval(liveDetailClockTimer); liveDetailClockTimer = null; }
  localLiveSeconds = 0;
  localBaseMinutes = 0;
  localIsHalftime = false;
  currentLiveEventRef = null;
}

async function showEventDetails(matchId) {
  try {
    if (listRefreshInterval) { clearInterval(listRefreshInterval); listRefreshInterval = null; }
    stopAllDetailTimers();
    currentMatchId = matchId;
    currentMarketTab = 'main';
    app.innerHTML = '<div class="loading">Chargement des détails...</div>';
    await loadMatchDetails(matchId, false);
    startLiveDetailTimers(matchId);
  } catch (error) {
    app.innerHTML = `<div class="error-msg">⛔ Erreur: ${error.message}</div>`;
  }
}

function startLiveDetailTimers(matchId) {
  // Sync API toutes les 3s
  liveDetailApiTimer = setInterval(() => fetchLiveSilentUpdate(matchId), 3000);
  // Tick horloge toutes les 1s
  liveDetailClockTimer = setInterval(() => {
    if (localIsHalftime) return;
    if (localBaseMinutes > 0 && currentLiveEventRef && currentLiveEventRef.LiveCurrentTime) {
      localLiveSeconds++;
      // Recalculer chaque seconde
      const totalSec = localBaseMinutes * 60 + localLiveSeconds;
      const mins = Math.floor(totalSec / 60);
      if (mins > 0 && mins <= 90) {
        const el = document.getElementById('liveTimeDisplay');
        if (el) el.textContent = mins + "'";
      }
    }
  }, 1000);
}

function buildScoreHtml(result, liveEvent) {
  const matchData = liveEvent || result;
  const scoreData = extractScore(matchData);
  const homeTeam = result.Competitors?.[0]?.Name || 'Home';
  const awayTeam = result.Competitors?.[1]?.Name || 'Away';
  const league = result.ChampName || result.CategoryName || 'Ligue';
  const isLive = result.IsLiveEvent || (liveEvent && liveEvent.LiveCurrentTime);

  if (!isLive) {
    return `
      <div class="detail-hero">
        <div class="detail-league">🏆 ${league}</div>
        <div class="detail-teams">
          <div class="detail-team">
            <div class="detail-team-crest" id="detail-home-crest"></div>
            <div class="detail-team-name">${homeTeam}</div>
          </div>
          <div class="detail-score-box"><div style="font-size:14px;font-weight:800;color:var(--text-dim);">VS</div></div>
          <div class="detail-team">
            <div class="detail-team-crest" id="detail-away-crest"></div>
            <div class="detail-team-name">${awayTeam}</div>
          </div>
        </div>
        <div class="detail-status"><span class="status-chip">📅 À venir</span></div>
      </div>
    `;
  }

  return `
    <div class="detail-hero">
      <div class="detail-league">🏆 ${league}</div>
      <div class="detail-teams">
        <div class="detail-team">
          <div class="detail-team-crest" id="detail-home-crest"></div>
          <div class="detail-team-name">${homeTeam}</div>
        </div>
        <div class="detail-score-box">
          <div class="detail-score"><span id="liveScoreHome">${scoreData.home}</span> - <span id="liveScoreAway">${scoreData.away}</span></div>
          <div class="detail-score-time ${scoreData.halftime ? 'ht' : ''}" id="liveTimeBox">
            <span id="liveTimeDisplay">${scoreData.halftime ? 'MI-TEMPS' : (scoreData.liveTime ? scoreData.liveTime + "'" : 'EN COURS')}</span>
          </div>
        </div>
        <div class="detail-team">
          <div class="detail-team-crest" id="detail-away-crest"></div>

        </div>
      </div>
      <div class="detail-status" id="liveStatusRow">
        ${scoreData.halftime ? '<span class="status-chip ht-chip">⏸ MI-TEMPS</span>' : '<span class="status-chip live-chip">🔴 EN DIRECT</span>'}
      </div>
    </div>
  `;

function buildStickyOddsHtml(odds1, oddsX, odds2) {
  return `
    <div class="sticky-1x2" id="sticky1x2">
      <div class="odd-item" data-selection="1" data-price="${odds1}" data-islive="true"><div class="label">1</div><div class="value" id="sticky1">${odds1}</div></div>
      <div class="odd-item" data-selection="X" data-price="${oddsX}" data-islive="true"><div class="label">X</div><div class="value highlight" id="stickyX">${oddsX}</div></div>
      <div class="odd-item" data-selection="2" data-price="${odds2}" data-islive="true"><div class="label">2</div><div class="value" id="sticky2">${odds2}</div></div>
    </div>
  `;
}

async function loadMatchDetails(matchId, silent = false) {
  try {
    const detailData = await fetchFromProxy('GetEventDetails', `eventId=${matchId}&sportId=1`);
    const result = detailData?.Result;
    if (!result) {
      if (!silent) app.innerHTML = `<div class="error-msg">⚠️ Détails introuvables.</div>`;
      return;
    }

    let liveEvent = liveEventsCache[matchId];
    if (!liveEvent && result.IsLiveEvent) {
      try {
        const liveData = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=50');
        const liveEvents = liveData?.Result?.Items?.[0]?.Events || [];
        liveEvent = liveEvents.find(e => String(e.Id) === String(matchId));
        if (liveEvent) liveEventsCache[matchId] = liveEvent;
      } catch(e) {}
    }
    currentLiveEventRef = liveEvent;

    if (silent) {
      // === UPDATE CIBLÉ ===
      const scoreData = extractScore(liveEvent || result);
      const homeEl = document.getElementById('liveScoreHome');
      const awayEl = document.getElementById('liveScoreAway');
      const timeEl = document.getElementById('liveTimeDisplay');
      const timeBox = document.getElementById('liveTimeBox');
      if (homeEl) homeEl.textContent = scoreData.home;
      if (awayEl) awayEl.textContent = scoreData.away;
      if (timeEl) timeEl.textContent = scoreData.halftime ? 'MI-TEMPS' : (scoreData.liveTime ? scoreData.liveTime + "'" : 'EN COURS');
      if (timeBox) timeBox.classList.toggle('ht', scoreData.halftime);
      // Sync local clock
      const minutes = parseInt(scoreData.liveTime) || 0;
      localBaseMinutes = minutes;
      localLiveSeconds = 0;
      localIsHalftime = scoreData.halftime;
      await refreshTimeline(result, matchId);
      return;
    }

    // === RENDU COMPLET ===
    const homeTeam = result.Competitors?.[0]?.Name || 'Home';
    const awayTeam = result.Competitors?.[1]?.Name || 'Away';
    const isLive = result.IsLiveEvent;
    const scoreData = extractScore(liveEvent || result);
    localBaseMinutes = parseInt(scoreData.liveTime) || 0;
    localLiveSeconds = 0;
    localIsHalftime = scoreData.halftime;

    const marketGroups = result.MarketGroups || [];
    const grouped = groupMarketsByType(marketGroups);
    const tabNames = Object.keys(grouped);
    const tabMap = { 'main':'MAIN','popular':'POPULAR','1sthalf':'1ÈRE MT','2ndhalf':'2ÈME MT','combo':'COMBO','corners':'CORNERS','bookings':'CARTONS','teams':'ÉQUIPES','correctscore':'SCORE EXACT' };

    let html = `<button class="back-btn" id="backToList">← Retour</button>`;
    html += `<div id="detailHeroContainer">${buildScoreHtml(result, liveEvent)}</div>`;
    html += `<div id="timelineContainer"></div>`;

    if (tabNames.length > 0) {
      // Sticky 1X2
      const odds = extractOdds(liveEvent?.Items || result.Items);
      html += buildStickyOddsHtml(odds.odds1, odds.oddsX, odds.odds2);

      // Market tabs
      html += `<div class="market-tabs" id="marketTabs">`;
      tabNames.forEach((key) => {
        html += `<button class="${key === currentMarketTab ? 'active' : ''}" data-tab="${key}">${tabMap[key] || key.toUpperCase()}</button>`;
      });
      html += `</div>`;

      // Accordion market sections (toutes dans un container, on filtre par onglet)
      tabNames.forEach((key) => {
        const groups = grouped[key];
        html += `<div class="tab-content" data-tab-content="${key}" style="${key === currentMarketTab ? '' : 'display:none;'}">`;
        groups.forEach(group => {
          if (!group.Items || group.Items.length === 0) return;
          html += `<div class="market-section open" data-market="${group.Name}">`;
          html += `<div class="market-section-header"><div class="market-section-title">${group.Name || 'Marché'}</div><div class="market-section-arrow">▼</div></div>`;
          html += `<div class="market-section-body"><div class="market-items-grid">`;
          group.Items.forEach(market => {
            if (!market.Items || market.Items.length === 0) return;
            market.Items.slice(0, 20).forEach(item => {
              const name = item.Name || item.ShortName || '—';
              const price = item.Price;
              const isLocked = !price || price <= 0;
              html += `<div class="market-item ${isLocked ? 'locked' : ''}" data-selection="${name}" data-price="${price || '-'}" data-match="${homeTeam} vs ${awayTeam}" data-islive="${isLive}">
                <div class="name">${name}</div>
                <div class="price">${isLocked ? '🔒' : price}</div>
              </div>`;
            });
          });
          html += `</div></div></div>`;
        });
        html += `</div>`;
      });
    }

    app.innerHTML = html;

    await refreshCrests(result);
    await refreshTimeline(result, matchId);

    // Market tabs switch
    document.querySelectorAll('#marketTabs button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#marketTabs button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentMarketTab = this.dataset.tab;
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.querySelector(`[data-tab-content="${currentMarketTab}"]`).style.display = '';
      });
    });

    // Accordion toggle
    document.querySelectorAll('.market-section-header').forEach(h => {
      h.addEventListener('click', function() {
        this.parentElement.classList.toggle('open');
      });
    });

    document.getElementById('backToList').addEventListener('click', () => {
      stopAllDetailTimers();
      currentMatchId = null;
      currentMarketTab = 'main';
      startListRefresh();
      loadView(currentView, true);
    });

    // Bet click
    document.querySelectorAll('.market-item:not(.locked), .sticky-1x2 .odd-item').forEach(item => {
      item.addEventListener('click', function() {
        const price = parseFloat(this.dataset.price);
        if (price && price > 0) {
          addToBetSlip(this.dataset.match, this.dataset.selection, price, this.dataset.islive === 'true');
          this.classList.add('selected');
          setTimeout(() => this.classList.remove('selected'), 800);
        } else showToast('Cote non disponible', true);
      });
    });

  } catch (error) {
    if (!silent) app.innerHTML = `<div class="error-msg">⛔ Erreur: ${error.message}</div>`;
  }
}

// === FETCH SILENCIEUX 3s ===
async function fetchLiveSilentUpdate(matchId) {
  try {
    // 1) GetLivenow pour score + time
    const liveData = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=50');
    const liveEvents = liveData?.Result?.Items?.[0]?.Events || [];
    const liveEvent = liveEvents.find(e => String(e.Id) === String(matchId));
    if (liveEvent) {
      liveEventsCache[matchId] = liveEvent;
      currentLiveEventRef = liveEvent;
      const scoreData = extractScore(liveEvent);
      const homeEl = document.getElementById('liveScoreHome');
      const awayEl = document.getElementById('liveScoreAway');
      const timeEl = document.getElementById('liveTimeDisplay');
      const timeBox = document.getElementById('liveTimeBox');
      if (homeEl) homeEl.textContent = scoreData.home;
      if (awayEl) awayEl.textContent = scoreData.away;
      if (timeEl) timeEl.textContent = scoreData.halftime ? 'MI-TEMPS' : (scoreData.liveTime ? scoreData.liveTime + "'" : 'EN COURS');
      if (timeBox) timeBox.classList.toggle('ht', scoreData.halftime);
      localBaseMinutes = parseInt(scoreData.liveTime) || 0;
      localLiveSeconds = 0;
      localIsHalftime = scoreData.halftime;
      // Update status row
      const statusRow = document.getElementById('liveStatusRow');
      if (statusRow) {
        statusRow.innerHTML = scoreData.halftime 
          ? '<span class="status-chip ht-chip">⏸ MI-TEMPS</span>' 
          : '<span class="status-chip live-chip">🔴 EN DIRECT</span>';
      }
    }

    // 2) GetEventDetails pour les cotes
    const detailData = await fetchFromProxy('GetEventDetails', `eventId=${matchId}&sportId=1`);
    const result = detailData?.Result;
    if (result) {
      // Update sticky 1X2
      const odds = extractOdds(result.Items);
      const s1 = document.getElementById('sticky1');
      const sX = document.getElementById('stickyX');
      const s2 = document.getElementById('sticky2');
      if (s1) s1.textContent = odds.odds1;
      if (sX) sX.textContent = odds.oddsX;
      if (s2) s2.textContent = odds.odds2;

      // Update market items prices
      const allItems = result.MarketGroups?.flatMap(g => g.Items?.flatMap(m => m.Items || []) || []) || [];
      document.querySelectorAll('.market-item[data-selection]').forEach(el => {
        const sel = el.dataset.selection;
        const priceEl = el.querySelector('.price');
        if (!priceEl || el.classList.contains('locked')) return;
        const found = allItems.find(i => (i.Name || i.ShortName) === sel);
        if (found && found.Price && found.Price !== priceEl.textContent) {
          const old = parseFloat(priceEl.textContent) || 0;
          const nw = parseFloat(found.Price) || 0;
          priceEl.textContent = found.Price;
          priceEl.classList.remove('changed-up','changed-down');
          void priceEl.offsetWidth;
          if (nw > old) priceEl.classList.add('changed-up');
          else if (nw < old) priceEl.classList.add('changed-down');
        }
      });
    }

    // 3) Refresh timeline
    await refreshTimeline(result || {}, matchId);

  } catch (e) { console.warn('Silent update:', e); }
}

async function refreshCrests(result) {
  const homeName = result.Competitors?.[0]?.Name;
  const awayName = result.Competitors?.[1]?.Name;
  const [homeLogo, awayLogo] = await Promise.all([fetchTeamLogo(homeName), fetchTeamLogo(awayName)]);
  const homeEl = document.getElementById('detail-home-crest');
  const awayEl = document.getElementById('detail-away-crest');
  if (homeEl) homeEl.innerHTML = homeLogo ? `<img src="${homeLogo}">` : (homeName || 'H').substring(0,2).toUpperCase();
  if (awayEl) awayEl.innerHTML = awayLogo ? `<img src="${awayLogo}">` : (awayName || 'A').substring(0,2).toUpperCase();
}

async function refreshTimeline(result, matchId) {
  const container = document.getElementById('timelineContainer');
  if (!container) return;
  try {
    const timelineData = await fetchFromProxy('match_timeline', matchId);
    const allEvents = timelineData?.doc?.[0]?.data?.events || [];
    const matchInfo = timelineData?.doc?.[0]?.data?.match || {};
    const status = matchInfo?.status?.name || '';
    const isHT = status.toLowerCase().includes('half') || status.toLowerCase().includes('mi-temps');

    const homeTeam = result.Competitors?.[0]?.Name || 'Home';
    const awayTeam = result.Competitors?.[1]?.Name || 'Away';

    // Filtre événements valides
    const validEvents = allEvents.filter(ev => {
      if (!ev.time || ev.time < 1) return false;
      const t = (ev.type || '').toLowerCase();
      const nm = (ev.name || '').toLowerCase();
      if (t === 'pitchcoordinates' || t === 'matchstatus' || t === 'period') return false;
      if (nm.includes('pitch coordinate') || nm.includes('matchsituation') || nm.includes('coordinates')) return false;
      return true;
    });

    const firstHalf = validEvents.filter(e => e.time <= 45);
    const secondHalf = validEvents.filter(e => e.time > 45);

    const renderEvents = (list) => {
      if (list.length === 0) return '<div style="color:#5a6577;font-size:12px;padding:8px 4px;">Aucun événement</div>';
      let h = '';
      list.slice().reverse().forEach(ev => {
        let icon = '•', cls = '';
        const t = (ev.type || '').toLowerCase();
        if (t === 'goal') { icon = '⚽'; cls = 'event-goal'; }
        else if (t === 'card' && ev.card === 'yellow') { icon = '🟨'; cls = 'event-card-yellow'; }
        else if (t === 'card' && ev.card === 'red') { icon = '🟥'; cls = 'event-card-red'; }
        else if (t === 'substitution') { icon = '🔄'; cls = 'event-sub'; }
        else if (t === 'shotontarget') { icon = '🎯'; }
        else if (t === 'corner') { icon = '🚩'; cls = 'event-corner'; }
        else if (t === 'offside') { icon = '🚫'; }
        else if (t === 'var') { icon = '📺'; }
        const teamName = ev.team === 'home' ? homeTeam : (ev.team === 'away' ? awayTeam : '');
        const playerName = ev.player?.name || '';
        const desc = ev.name || ev.type || '';
        h += `<div class="timeline-event">
          <span class="time">${ev.time}'</span>
          <span class="icon ${cls}">${icon}</span>
          <span class="desc">${teamName ? `<span class="team-name">${teamName}</span> ` : ''}${desc} ${playerName ? `(${playerName})` : ''}</span>
        </div>`;
      });
      return h;
    };

    // FIX ORDRE : 2ème MT en HAUT si on est dedans
    const inSecondHalf = secondHalf.length > 0;
    let html = `<div class="timeline-wrap"><div class="timeline-header">📋 Événements du match</div>`;

    if (inSecondHalf) {
      html += `<div class="period-separator">2ème mi-temps</div>${renderEvents(secondHalf)}`;
      html += `<div class="period-separator ht">⏸ MI-TEMPS</div>`;
      html += `<div class="period-separator">1ère mi-temps</div>${renderEvents(firstHalf)}`;
    } else {
      html += `<div class="period-separator">1ère mi-temps</div>${renderEvents(firstHalf)}`;
      if (isHT) html += `<div class="period-separator ht">⏸ MI-TEMPS</div>`;
    }
    html += `</div>`;
    container.innerHTML = html;
  } catch (e) { console.warn('Timeline:', e); }
}

// ============================================================
// LOAD VIEWS
// ============================================================
async function loadView(view, preserveScroll = false) {
  if (isUpdating) return;
  isUpdating = true;
  try {
    if (currentMatchId) { isUpdating = false; return; }
    currentView = view;
    let events = [];
    const cacheKey = `${view}_${currentDay}`;

    if (eventsCache[cacheKey]) {
      await renderMatchList(eventsCache[cacheKey], view, preserveScroll);
      isUpdating = false;
      return;
    }
    app.innerHTML = '<div class="loading">Chargement...</div>';

    if (view === 'live') {
      const data = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=15');
      events = data?.Result?.Items?.[0]?.Events || [];
    } else if (view === 'top') {
      const data = await fetchFromProxy('GetTopEvents', '');
      events = data?.Result?.Events || [];
    } else if (view === 'upcoming') {
      if (currentDay === 0) {
        const data = await fetchFromProxy('GetUpcoming', 'sportId=1&showAllEvents=false&count=15');
        events = data?.Result?.Items?.[0]?.Events || [];
      } else {
        const range = getDateRange(currentDay);
        const data = await fetchFromProxy('GetEvents',
          `sportids=1&categoryids=0&champids=0&period=perioddate&outrightsDisplay=none&marketTypeIds=1,16,11&couponType=0&marketGroupId=0&group=AllEvents&withLive=false&startDate=${encodeURIComponent(range.start)}&endDate=${encodeURIComponent(range.end)}`
        );
        events = data?.Result?.Items?.[0]?.Events || [];
      }
    }
    eventsCache[cacheKey] = events;
    await renderMatchList(events, view, preserveScroll);
  } catch (error) {
    if (!preserveScroll) app.innerHTML = `<div class="error-msg">⛔ Erreur: ${error.message}</div>`;
  }
  isUpdating = false;
}

async function silentListRefresh() {
  if (currentMatchId || isUpdating) return;
  try {
    const view = currentView;
    const cacheKey = `${view}_${currentDay}`;
    let events = [];
    if (view === 'live') {
      const data = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=15');
      events = data?.Result?.Items?.[0]?.Events || [];
    } else if (view === 'top') {
      const data = await fetchFromProxy('GetTopEvents', '');
      events = data?.Result?.Events || [];
    } else if (view === 'upcoming') {
      if (currentDay === 0) {
        const data = await fetchFromProxy('GetUpcoming', 'sportId=1&showAllEvents=false&count=15');
        events = data?.Result?.Items?.[0]?.Events || [];
      } else {
        const range = getDateRange(currentDay);
        const data = await fetchFromProxy('GetEvents',
          `sportids=1&categoryids=0&champids=0&period=perioddate&outrightsDisplay=none&marketTypeIds=1,16,11&couponType=0&marketGroupId=0&group=AllEvents&withLive=false&startDate=${encodeURIComponent(range.start)}&endDate=${encodeURIComponent(range.end)}`
        );
        events = data?.Result?.Items?.[0]?.Events || [];
      }
    }
    if (events.length > 0) {
      eventsCache[cacheKey] = events;
      await renderMatchList(events, view, true);
    }
  } catch (e) { console.error('Refresh:', e); }
}

function startListRefresh() {
  if (listRefreshInterval) clearInterval(listRefreshInterval);
  listRefreshInterval = setInterval(silentListRefresh, 10000);
}
