    <script>
        // ============================================================
        // 1. CONFIGURATION
        // ============================================================
        const PROXY_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co/functions/v1/altenar-proxy';
        const API_SPORTS_KEY = 'e227ff90ed4eacc3eacb07eca05ce78b'; // clé api-sports

        // ============================================================
        // 2. STATE
        // ============================================================
        let currentView = 'live';
        let currentDay = 0;
        let currentMatchId = null;
        let eventsCache = {};
        let isUpdating = false;

        let listRefreshInterval = null;
        let detailRefreshInterval = null;

        let previousOdds = {};

        let betSlip = [];
        const betSlipEl = document.getElementById('betSlip');
        const betSlipItemsEl = document.getElementById('betSlipItems');
        const betTotalEl = document.getElementById('betTotal');
        const betCountEl = document.getElementById('betCount');

        // Cache pour les logos (teamId -> logoUrl) et (teamName -> logoUrl)
        const logoCache = {};
        const leagueLogoCache = {};

        // ============================================================
        // 3. HELPERS
        // ============================================================
        async function fetchFromProxy(endpoint, extraParams = '') {
            let url = `${PROXY_URL}?endpoint=${endpoint}`;
            if (extraParams) url += `&extraParams=${extraParams}`;
            const response = await fetch(url);
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(`HTTP ${response.status}: ${errorData.error || errorData.details || response.statusText}`);
            }
            return await response.json();
        }

        // Récupérer le logo d'une équipe depuis API Sports (avec cache)
        async function fetchTeamLogo(teamName) {
            if (!teamName) return null;
            const key = teamName.trim().toLowerCase();
            if (logoCache[key]) return logoCache[key];

            try {
                // Essayer d'abord une recherche exacte
                let url = `https://v3.football.api-sports.io/teams?search=${encodeURIComponent(teamName)}`;
                let response = await fetch(url, {
                    headers: {
                        'x-apisports-key': API_SPORTS_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) return null;
                let data = await response.json();
                if (data.response && data.response.length > 0) {
                    const logo = data.response[0].team.logo;
                    logoCache[key] = logo;
                    return logo;
                }

                // Si pas de résultat, essayer avec une recherche plus souple (enlever les accents, etc.)
                const simplified = teamName.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9 ]/g, '').trim();
                if (simplified !== teamName) {
                    url = `https://v3.football.api-sports.io/teams?search=${encodeURIComponent(simplified)}`;
                    response = await fetch(url, {
                        headers: {
                            'x-apisports-key': API_SPORTS_KEY,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (response.ok) {
                        data = await response.json();
                        if (data.response && data.response.length > 0) {
                            const logo = data.response[0].team.logo;
                            logoCache[key] = logo;
                            return logo;
                        }
                    }
                }

                // Fallback: tenter de trouver par nom partiel (premier mot)
                const firstWord = teamName.split(' ')[0];
                if (firstWord && firstWord.length > 2 && firstWord !== teamName) {
                    url = `https://v3.football.api-sports.io/teams?search=${encodeURIComponent(firstWord)}`;
                    response = await fetch(url, {
                        headers: {
                            'x-apisports-key': API_SPORTS_KEY,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (response.ok) {
                        data = await response.json();
                        if (data.response && data.response.length > 0) {
                            // Chercher celui qui correspond le mieux
                            for (let item of data.response) {
                                if (item.team.name.toLowerCase().includes(firstWord.toLowerCase())) {
                                    const logo = item.team.logo;
                                    logoCache[key] = logo;
                                    return logo;
                                }
                            }
                            // sinon prendre le premier
                            const logo = data.response[0].team.logo;
                            logoCache[key] = logo;
                            return logo;
                        }
                    }
                }

                return null;
            } catch (e) {
                console.warn('Erreur lors de la récupération du logo pour', teamName, e);
                return null;
            }
        }

        // Récupérer le logo d'une ligue depuis API Sports
        async function fetchLeagueLogo(leagueName) {
            if (!leagueName) return null;
            const key = leagueName.trim().toLowerCase();
            if (leagueLogoCache[key]) return leagueLogoCache[key];

            try {
                const url = `https://v3.football.api-sports.io/leagues?search=${encodeURIComponent(leagueName)}`;
                const response = await fetch(url, {
                    headers: {
                        'x-apisports-key': API_SPORTS_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) return null;
                const data = await response.json();
                if (data.response && data.response.length > 0) {
                    const logo = data.response[0].league.logo;
                    leagueLogoCache[key] = logo;
                    return logo;
                }
                return null;
            } catch (e) {
                console.warn('Erreur lors de la récupération du logo de la ligue', leagueName, e);
                return null;
            }
        }

        function extractOdds(markets) {
            let odds1 = '-', oddsX = '-', odds2 = '-';
            if (!markets) return { odds1, oddsX, odds2 };
            const market = markets.find(m => m.Id === 1 || m.MarketId === 1);
            if (market && market.Items) {
                const items = market.Items;
                const o1 = items.find(i => i.SelectionTypeId === 1);
                const oX = items.find(i => i.SelectionTypeId === 2);
                const o2 = items.find(i => i.SelectionTypeId === 3);
                odds1 = o1 ? o1.Price || o1.odds : odds1;
                oddsX = oX ? oX.Price || oX.odds : oddsX;
                odds2 = o2 ? o2.Price || o2.odds : odds2;
            }
            return { odds1, oddsX, odds2 };
        }

        function getCrestUrl(competitor) {
            if (!competitor) return null;
            if (competitor.Logo) return `https://img.sportradar.com/ls/crest/32/${competitor.Logo}.png`;
            if (competitor.Id) return `https://img.sportradar.com/ls/crest/32/${competitor.Id}.png`;
            return null;
        }

        function getCompetitorsWithCrests(match) {
            const comps = match.Competitors || [];
            const home = comps[0] || { Name: 'Home', Id: null };
            const away = comps[1] || { Name: 'Away', Id: null };
            return { home: { ...home, crest: getCrestUrl(home) }, away: { ...away, crest: getCrestUrl(away) } };
        }

        function getDateRange(dayOffset) {
            const now = new Date();
            const start = new Date(now);
            start.setDate(now.getDate() + dayOffset);
            start.setHours(0, 0, 0, 0);
            const end = new Date(start);
            end.setDate(start.getDate() + 1);
            end.setHours(23, 59, 59, 999);
            return { start: start.toISOString(), end: end.toISOString() };
        }

        function extractTime24(eventDate) {
            if (!eventDate) return '--:--';
            try {
                const d = new Date(eventDate);
                if (isNaN(d.getTime())) return '--:--';
                const h = String(d.getHours()).padStart(2, '0');
                const m = String(d.getMinutes()).padStart(2, '0');
                return `${h}h${m}`;
            } catch (e) { return '--:--'; }
        }

        function groupMarketsByType(marketGroups) {
            const groups = {};
            const typeMap = {
                'Main': 'main',
                'Popular': 'popular',
                '1st Half': '1sthalf',
                '2nd Half': '2ndhalf',
                'Combo': 'combo',
                'Corners': 'corners',
                'Bookings': 'bookings',
                'Teams': 'teams',
                'Correct Score': 'correctscore'
            };
            marketGroups.forEach(group => {
                const key = typeMap[group.Name] || group.Name.toLowerCase().replace(/ /g, '');
                if (!groups[key]) groups[key] = [];
                groups[key].push(group);
            });
            return groups;
        }

        // ============================================================
        // 4. BET SLIP (inchangé)
        // ============================================================
        function updateBetSlipUI() {
            if (betSlip.length === 0) {
                betSlipItemsEl.innerHTML = '<p style="color:#6b7280; text-align:center; padding:20px 0;">Aucun pari sélectionné</p>';
                betTotalEl.textContent = '0.00';
                betCountEl.textContent = '0';
                return;
            }
            let html = '';
            let total = 0;
            betSlip.forEach((item, index) => {
                total += item.price;
                html += `
                        <div class="bet-slip-item">
                            <div>
                                <strong>${item.match}</strong><br>
                                <span style="color:#9ca3af; font-size:12px;">${item.selection} @ ${item.price}</span>
                            </div>
                            <span class="remove" data-index="${index}">✕</span>
                        </div>
                    `;
            });
            betSlipItemsEl.innerHTML = html;
            betTotalEl.textContent = total.toFixed(2);
            betCountEl.textContent = betSlip.length;

            document.querySelectorAll('.bet-slip-item .remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    betSlip.splice(idx, 1);
                    updateBetSlipUI();
                });
            });
        }

        function addToBetSlip(matchName, selection, price) {
            betSlip.push({ match: matchName, selection, price });
            updateBetSlipUI();
            betSlipEl.classList.add('open');
        }

        document.getElementById('betSlipToggle').addEventListener('click', () => {
            betSlipEl.classList.toggle('open');
        });
        document.getElementById('closeBetSlip').addEventListener('click', () => {
            betSlipEl.classList.remove('open');
        });
        document.getElementById('placeBetBtn').addEventListener('click', () => {
            if (betSlip.length === 0) return alert('Ajoutez des paris d\'abord.');
            alert('✅ Pari placé ! (simulation)');
            betSlip = [];
            updateBetSlipUI();
            betSlipEl.classList.remove('open');
        });

        // ============================================================
        // 5. RENDER FUNCTIONS (avec logos depuis API Sports)
        // ============================================================
        const app = document.getElementById('app');

        async function renderMatchList(events, type = 'live', preserveScroll = false) {
            if (!events || events.length === 0) {
                app.innerHTML = `<div class="error-msg">⚠️ Aucun événement trouvé pour cette catégorie.</div>`;
                return;
            }

            // Récupérer les logos en parallèle
            const matchesWithLogos = await Promise.all(events.map(async (match) => {
                const comps = match.Competitors || [];
                const homeName = comps[0]?.Name || 'Home';
                const awayName = comps[1]?.Name || 'Away';
                const leagueName = match.ChampName || match.CategoryName || '';

                // Récupérer les logos
                const homeLogo = await fetchTeamLogo(homeName);
                const awayLogo = await fetchTeamLogo(awayName);
                const leagueLogo = leagueName ? await fetchLeagueLogo(leagueName) : null;

                return { ...match, homeLogo, awayLogo, leagueLogo };
            }));

            let html = '';
            matchesWithLogos.forEach(match => {
                const isLive = match.LiveCurrentTime && match.LiveCurrentTime !== '0';
                let timeDisplay;
                if (type === 'live' && isLive) {
                    timeDisplay = match.LiveCurrentTime || '--';
                } else {
                    timeDisplay = extractTime24(match.EventDate);
                }

                const score = match.LiveScore || '0:0';
                const scores = score.split(':');
                const league = match.ChampName || match.CategoryName || 'Championnat';
                const matchId = match.Id;

                const homeName = match.Competitors?.[0]?.Name || 'Home';
                const awayName = match.Competitors?.[1]?.Name || 'Away';
                const { odds1, oddsX, odds2 } = extractOdds(match.Items);

                let label = '', cardClass = '';
                if (type === 'live' && isLive) {
                    label = '<span class="live-label">EN DIRECT</span>';
                    cardClass = '';
                } else if (type === 'top') {
                    label = '<span class="top-label">⭐ TOP</span>';
                    cardClass = 'top-event';
                } else {
                    label = '<span class="coming-label">À VENIR</span>';
                    cardClass = 'coming';
                }

                // Construire les balises des logos
                const homeCrestHtml = match.homeLogo ?
                    `<img src="${match.homeLogo}" alt="${homeName}" loading="lazy" onerror="this.style.display='none'">` :
                    homeName.substring(0, 2).toUpperCase();
                const awayCrestHtml = match.awayLogo ?
                    `<img src="${match.awayLogo}" alt="${awayName}" loading="lazy" onerror="this.style.display='none'">` :
                    awayName.substring(0, 2).toUpperCase();

                const leagueLogoHtml = match.leagueLogo ?
                    `<img src="${match.leagueLogo}" alt="${league}" loading="lazy" onerror="this.style.display='none'">` :
                    '';

                html += `
                        <div class="match-card ${cardClass}" data-matchid="${matchId}">
                            <div class="match-header">
                                ${label}
                                <span class="match-time">${timeDisplay}</span>
                                <span class="match-league">${leagueLogoHtml} ${league}</span>
                            </div>
                            <div class="score-line">
                                <div class="team-block home">
                                    <div class="team-crest">${homeCrestHtml}</div>
                                    <div class="team-info">
                                        <span class="team-name">${homeName}</span>
                                        <span class="team-score">${scores[0] || '0'}</span>
                                    </div>
                                </div>
                                <span class="vs-dash">⚡</span>
                                <div class="team-block away">
                                    <div class="team-crest">${awayCrestHtml}</div>
                                    <div class="team-info">
                                        <span class="team-name">${awayName}</span>
                                        <span class="team-score">${scores[1] || '0'}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="odds-row">
                                <div class="odd-item" data-selection="1" data-price="${odds1}" data-match="${homeName} vs ${awayName}">
                                    <div class="label">1</div>
                                    <div class="value" id="odd-1-${matchId}">${odds1}</div>
                                </div>
                                <div class="odd-item" data-selection="X" data-price="${oddsX}" data-match="${homeName} vs ${awayName}">
                                    <div class="label">X</div>
                                    <div class="value highlight" id="odd-X-${matchId}">${oddsX}</div>
                                </div>
                                <div class="odd-item" data-selection="2" data-price="${odds2}" data-match="${homeName} vs ${awayName}">
                                    <div class="label">2</div>
                                    <div class="value" id="odd-2-${matchId}">${odds2}</div>
                                </div>
                            </div>
                        </div>
                    `;
            });

            const scrollY = preserveScroll ? window.scrollY : 0;
            app.innerHTML = html;
            if (preserveScroll) { window.scrollTo(0, scrollY); }

            // Attacher les événements
            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.odd-item')) return;
                    const matchId = this.dataset.matchid;
                    if (matchId) showEventDetails(matchId);
                });
            });

            document.querySelectorAll('.odd-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const match = this.dataset.match;
                    const selection = this.dataset.selection;
                    const price = parseFloat(this.dataset.price);
                    if (price && price > 0 && price !== '-') {
                        addToBetSlip(match, selection, price);
                    } else {
                        alert('Cote non disponible');
                    }
                });
            });
        }

        // ============================================================
        // 6. DETAILS VIEW (inchangé)
        // ============================================================
        async function showEventDetails(matchId) {
            try {
                if (listRefreshInterval) {
                    clearInterval(listRefreshInterval);
                    listRefreshInterval = null;
                }
                if (detailRefreshInterval) {
                    clearInterval(detailRefreshInterval);
                    detailRefreshInterval = null;
                }

                currentMatchId = matchId;
                app.innerHTML = '<div class="loading">⏳ Chargement des détails...</div>';

                await loadMatchDetails(matchId);

                detailRefreshInterval = setInterval(() => {
                    loadMatchDetails(matchId, true);
                }, 5000);

            } catch (error) {
                app.innerHTML = `<div class="error-msg">⛔ Erreur: ${error.message}</div>`;
                console.error(error);
            }
        }

        async function loadMatchDetails(matchId, silent = false) {
            try {
                const detailData = await fetchFromProxy('GetEventDetails', `eventId=${matchId}&sportId=1`);
                const result = detailData?.Result;
                if (!result) {
                    if (!silent) app.innerHTML = `<div class="error-msg">⚠️ Détails introuvables.</div>`;
                    return;
                }

                const homeTeam = result.Competitors?.[0]?.Name || 'Home';
                const awayTeam = result.Competitors?.[1]?.Name || 'Away';
                const league = result.ChampName || result.CategoryName || 'Ligue';
                const date = result.EventDate || '';
                const isLive = result.IsLiveEvent;
                const liveScore = result.LiveScore || '0:0';
                const scores = liveScore.split(':');
                const liveTime = result.LiveCurrentTime || '';

                let timelineHtml = '';
                let matchStatus = '';
                if (isLive) {
                    try {
                        const timelineData = await fetchFromProxy('match_timeline', matchId);
                        const events = timelineData?.doc?.[0]?.data?.events || [];
                        const matchInfo = timelineData?.doc?.[0]?.data?.match || {};
                        matchStatus = matchInfo?.status?.name || 'En direct';
                        const time = matchInfo?.timeinfo?.played ? Math.floor(matchInfo.timeinfo.played / 60) + '\'' : '';

                        const recentEvents = events.slice(-15).reverse();
                        let evHtml = '';
                        recentEvents.forEach(ev => {
                            const evTime = ev.time ? `${ev.time}'` : '--';
                            let icon = '•';
                            let cls = '';
                            if (ev.type === 'goal') { icon = '⚽'; cls = 'event-goal'; }
                            else if (ev.type === 'card' && ev.card === 'yellow') { icon = '🟨'; cls = 'event-card-yellow'; }
                            else if (ev.type === 'card' && ev.card === 'red') { icon = '🟥'; cls = 'event-card-red'; }
                            else if (ev.type === 'substitution') { icon = '🔄'; cls = 'event-sub'; }
                            else if (ev.type === 'shotontarget') { icon = '🎯'; }
                            else if (ev.type === 'corner') { icon = '🚩'; cls = 'event-corner'; }
                            else if (ev.type === 'offside') { icon = '🚫'; }
                            const teamName = ev.team === 'home' ? homeTeam : (ev.team === 'away' ? awayTeam : '');
                            const playerName = ev.player?.name || '';
                            const desc = ev.name || ev.type || '';
                            evHtml += `
                                    <div class="timeline-event">
                                        <span class="time">${evTime}</span>
                                        <span class="icon ${cls}">${icon}</span>
                                        <span class="desc">${teamName ? `<span class="team-name">${teamName}</span> ` : ''}${desc} ${playerName ? `(${playerName})` : ''}</span>
                                    </div>
                                `;
                        });

                        timelineHtml = `
                                <div style="display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
                                    <span style="background:#1f2937; padding:4px 12px; border-radius:12px;">${matchStatus}</span>
                                    <span style="background:#1f2937; padding:4px 12px; border-radius:12px;">⏱️ ${time}</span>
                                    <span style="background:#1f2937; padding:4px 12px; border-radius:12px;">🏆 ${league}</span>
                                </div>
                                <div class="timeline-container">
                                    <div style="font-weight:600; margin-bottom:8px; color:#fbbf24;">📋 Événements</div>
                                    ${evHtml || '<div style="color:#6b7280;">Aucun événement récent</div>'}
                                </div>
                            `;
                    } catch (e) {
                        console.warn('Timeline non disponible:', e);
                    }
                }

                const scoreHtml = `
                        <div class="live-score-update">
                            <span class="score-badge">🏠 <span class="home-score">${scores[0] || '0'}</span> - <span class="away-score">${scores[1] || '0'}</span> 🏃</span>
                            ${liveTime ? `<span class="score-badge">⏱️ ${liveTime}</span>` : ''}
                            ${matchStatus ? `<span class="score-badge">${matchStatus}</span>` : ''}
                        </div>
                    `;

                const marketGroups = result.MarketGroups || [];
                const grouped = groupMarketsByType(marketGroups);
                const tabNames = Object.keys(grouped);
                const tabMap = {
                    'main': 'Main',
                    'popular': 'Popular',
                    '1sthalf': '1st Half',
                    '2ndhalf': '2nd Half',
                    'combo': 'Combo',
                    'corners': 'Corners',
                    'bookings': 'Bookings',
                    'teams': 'Teams',
                    'correctscore': 'Correct Score'
                };

                let html = `
                        <button class="back-btn" id="backToList">← Retour</button>
                        <div class="match-detail-title">${homeTeam} vs ${awayTeam}</div>
                        <div class="match-detail-sub">${league} | ${date}</div>
                        ${scoreHtml}
                        ${timelineHtml}
                    `;

                if (tabNames.length > 0) {
                    html += `<div class="market-tabs" id="marketTabs">`;
                    tabNames.forEach((key, index) => {
                        const label = tabMap[key] || key.charAt(0).toUpperCase() + key.slice(1);
                        html += `<button class="${index === 0 ? 'active' : ''}" data-tab="${key}">${label}</button>`;
                    });
                    html += `</div>`;

                    tabNames.forEach((key, index) => {
                        const groups = grouped[key];
                        html += `<div class="market-group ${index === 0 ? 'active' : ''}" data-group="${key}">`;
                        groups.forEach(group => {
                            if (!group.Items || group.Items.length === 0) return;
                            html += `<div class="market-title">${group.Name || 'Marché'}</div><div class="market-items">`;
                            group.Items.forEach(market => {
                                if (!market.Items || market.Items.length === 0) return;
                                const items = market.Items.slice(0, 12);
                                items.forEach(item => {
                                    const name = item.Name || item.ShortName || '—';
                                    const price = item.Price || '-';
                                    const selection = name;
                                    html += `
                                            <div class="market-item" data-selection="${selection}" data-price="${price}" data-match="${homeTeam} vs ${awayTeam}">
                                                <div class="name">${name}</div>
                                                <div class="price">${price}</div>
                                            </div>
                                        `;
                                });
                            });
                            html += `</div>`;
                        });
                        html += `</div>`;
                    });
                }

                app.innerHTML = html;

                document.querySelectorAll('#marketTabs button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#marketTabs button').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const tab = this.dataset.tab;
                        document.querySelectorAll('.market-group').forEach(g => g.classList.remove('active'));
                        document.querySelector(`.market-group[data-group="${tab}"]`)?.classList.add('active');
                    });
                });

                document.getElementById('backToList').addEventListener('click', () => {
                    if (detailRefreshInterval) {
                        clearInterval(detailRefreshInterval);
                        detailRefreshInterval = null;
                    }
                    currentMatchId = null;
                    startListRefresh();
                    loadView(currentView, true);
                });

                document.querySelectorAll('.market-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const match = this.dataset.match;
                        const selection = this.dataset.selection;
                        const price = parseFloat(this.dataset.price);
                        if (price && price > 0 && price !== '-') {
                            addToBetSlip(match, selection, price);
                        } else {
                            alert('Cote non disponible');
                        }
                    });
                });

            } catch (error) {
                if (!silent) {
                    app.innerHTML = `<div class="error-msg">⛔ Erreur: ${error.message}</div>`;
                }
                console.error(error);
            }
        }

        // ============================================================
        // 7. LOAD VIEWS
        // ============================================================
        async function loadView(view, preserveScroll = false) {
            if (isUpdating) return;
            isUpdating = true;

            try {
                if (currentMatchId) {
                    isUpdating = false;
                    return;
                }

                currentView = view;
                let events = [];
                let cacheKey = `${view}_${currentDay}`;

                if (eventsCache[cacheKey]) {
                    events = eventsCache[cacheKey];
                    await renderMatchList(events, view, preserveScroll);
                    isUpdating = false;
                    return;
                }

                app.innerHTML = '<div class="loading">⏳ Chargement...</div>';

                if (view === 'live') {
                    const data = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=15');
                    events = data?.Result?.Items?.[0]?.Events || [];
                } else if (view === 'top') {
                    const data = await fetchFromProxy('GetTopEvents', '');
                    events = data?.Result?.Events || [];
                } else if (view === 'upcoming') {
                    if (currentDay === 0) {
                        const data = await fetchFromProxy('GetUpcoming', 'sportId=1&showAllEvents=false&count=15');
                        events = data?.Result?.Items?.[0]?.Events || [];
                    } else {
                        const range = getDateRange(currentDay);
                        const data = await fetchFromProxy('GetEvents',
                            `sportids=1&categoryids=0&champids=0&period=perioddate&outrightsDisplay=none&marketTypeIds=1,16,11&couponType=0&marketGroupId=0&group=AllEvents&withLive=false&startDate=${encodeURIComponent(range.start)}&endDate=${encodeURIComponent(range.end)}`
                        );
                        events = data?.Result?.Items?.[0]?.Events || [];
                    }
                }

                eventsCache[cacheKey] = events;
                await renderMatchList(events, view, preserveScroll);

            } catch (error) {
                if (!preserveScroll) {
                    app.innerHTML = `
                            <div class="error-msg">
                                ⛔ Erreur de chargement: ${error.message}
                                <span class="error-detail">Vérifiez que le Proxy est déployé et que le lien est correct.</span>
                            </div>
                        `;
                }
                console.error(error);
            }

            isUpdating = false;
        }

        // ============================================================
        // 8. SILENT REFRESH
        // ============================================================
        async function silentListRefresh() {
            if (currentMatchId) return;
            if (isUpdating) return;

            try {
                const view = currentView;
                const cacheKey = `${view}_${currentDay}`;
                let events = [];

                if (view === 'live') {
                    const data = await fetchFromProxy('GetLivenow', 'sportId=1&showAllEvents=false&count=15');
                    events = data?.Result?.Items?.[0]?.Events || [];
                } else if (view === 'top') {
                    const data = await fetchFromProxy('GetTopEvents', '');
                    events = data?.Result?.Events || [];
                } else if (view === 'upcoming') {
                    if (currentDay === 0) {
                        const data = await fetchFromProxy('GetUpcoming', 'sportId=1&showAllEvents=false&count=15');
                        events = data?.Result?.Items?.[0]?.Events || [];
                    } else {
                        const range = getDateRange(currentDay);
                        const data = await fetchFromProxy('GetEvents',
                            `sportids=1&categoryids=0&champids=0&period=perioddate&outrightsDisplay=none&marketTypeIds=1,16,11&couponType=0&marketGroupId=0&group=AllEvents&withLive=false&startDate=${encodeURIComponent(range.start)}&endDate=${encodeURIComponent(range.end)}`
                        );
                        events = data?.Result?.Items?.[0]?.Events || [];
                    }
                }

                if (events.length > 0) {
                    eventsCache[cacheKey] = events;
                    await renderMatchList(events, view, true);
                }

            } catch (error) {
                console.error('Silent refresh error:', error);
            }
        }

        function startListRefresh() {
            if (listRefreshInterval) {
                clearInterval(listRefreshInterval);
                listRefreshInterval = null;
            }
            listRefreshInterval = setInterval(silentListRefresh, 10000);
        }

        // ============================================================
        // 9. NAVIGATION & INIT
        // ============================================================

        document.querySelectorAll('.nav-tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                if (currentMatchId) {
                    if (detailRefreshInterval) {
                        clearInterval(detailRefreshInterval);
                        detailRefreshInterval = null;
                    }
                    currentMatchId = null;
                    startListRefresh();
                }
                loadView(this.dataset.view);
            });
        });

        document.querySelectorAll('.days-tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.days-tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentDay = parseInt(this.dataset.day);
                if (currentMatchId) {
                    if (detailRefreshInterval) {
                        clearInterval(detailRefreshInterval);
                        detailRefreshInterval = null;
                    }
                    currentMatchId = null;
                    startListRefresh();
                }
                const cacheKey = `${currentView}_${currentDay}`;
                delete eventsCache[cacheKey];
                loadView(currentView);
            });
        });

        document.getElementById('home-link').addEventListener('click', function(e) {
            e.preventDefault();
            if (currentMatchId) {
                if (detailRefreshInterval) {
                    clearInterval(detailRefreshInterval);
                    detailRefreshInterval = null;
                }
                currentMatchId = null;
                startListRefresh();
            }
            const activeTab = document.querySelector('.nav-tabs .active');
            loadView(activeTab ? activeTab.dataset.view : 'live');
        });

        startListRefresh();
        loadView('live');

        window.loadView = loadView;
        window.showEventDetails = showEventDetails;
        window.silentListRefresh = silentListRefresh;
    </script>
