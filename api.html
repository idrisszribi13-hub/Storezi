<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goal 216 - Live Widgets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e13;
            color: #f0f3f7;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 12px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #00e676;
        }
        .badge {
            background: #1f2937;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #9ca3af;
        }
        .widget-container {
            background: #14181f;
            border-radius: 12px;
            padding: 16px;
            min-height: 200px;
            margin-bottom: 16px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .error-msg {
            background: #7f1d1d;
            padding: 15px;
            border-radius: 8px;
            color: #fca5a5;
            text-align: center;
            font-size: 14px;
        }
        .footer-menu {
            display: flex;
            justify-content: space-around;
            background: #0f131a;
            padding: 12px 0;
            border-top: 1px solid #222;
            margin-top: 20px;
            position: sticky;
            bottom: 0;
        }
        .footer-menu span {
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
        }
        .footer-menu .active {
            color: #00e676;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ goal216</h1>
        <span class="badge">LIVE</span>
    </div>

    <!-- حاوية الـ Widgets -->
    <div id="widget-container" class="widget-container">
        <div class="loading">⏳ Chargement des widgets...</div>
    </div>

    <div class="footer-menu">
        <span class="active">📋 Menu</span>
        <span>🏟️ Sport</span>
        <span>🔴 Live</span>
        <span>🎰 Casino</span>
        <span>📺 Casino en Direct</span>
    </div>

    <!-- ========================================================= -->
    <!-- تحميل Widget Loader من الموقع الأصلي -->
    <!-- ========================================================= -->
    <script src="https://widgets.biahostod.com/46de729d1ad0ad36c0c780838303c0c4/widgetloader" n="SIR"></script>

    <!-- ========================================================= -->
    <!-- كود تهيئة الـ Widgets باستخدام نفس معاملات الموقع الأصلي -->
    <!-- ========================================================= -->
    <script>
        // انتظار تحميل الـ Widgets
        window.SIR = window.SIR || function() {};
        window.SIR.q = window.SIR.q || [];

        // تعريف الـ Widgets مع نفس الإعدادات التي وجدتها في الموقع الأصلي
        window.SIR.q.push(['addWidget', '#widget-container', {
            // معرّف المباراة (Arsenal vs Chelsea – يمكنك تغييره)
            matchId: 72221232,
            // اللغة والمنطقة (نفسها من طلباتك)
            language: 'fr',
            countryCode: 'TN',
            // تفعيل الميزات المتقدمة
            widgetSharing: true,
            // استخدام ترخيص الموقع الأصلي
            // هذا يعمل فقط على نطاق goal216.com
            licensingUrl: 'https://widgets.biahostod.com/ee11c256d1a9bbc530b4a3380dae8698/licensing'
        }]);

        // عند تحميل الصفحة، نطلب من الـ Widgets التحديث
        document.addEventListener('DOMContentLoaded', function() {
            // إذا كان الـ Widgets جاهزاً، نطلب التحقق
            if (window.SIR && window.SIR.check) {
                window.SIR.check();
            }
        });

        // مراقبة الأخطاء
        console.log('🚀 Widgets initialisés avec le licensing de goal216.com');
        console.log('⚠️ ATTENTION: Ce code ne fonctionne que sur le domaine goal216.com');
    </script>

</body>
</html>
