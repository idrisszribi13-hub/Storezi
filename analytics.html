<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZI Store - Analytics Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-indigo-400">لوحة إحصائيات ZI Store</h1>
                <p class="text-slate-400 text-sm mt-1">متابعة عمليات تشغيل السكريبتات والألعاب لحظياً</p>
            </div>
            <button onclick="fetchAnalytics()" class="mt-4 md:mt-0 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold transition duration-200 flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                <span>تحديث البيانات</span>
            </button>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
                <p class="text-slate-400 text-sm font-medium">إجمالي التشغيلات</p>
                <h3 id="totalLaunches" class="text-3xl font-bold text-white mt-2">0</h3>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
                <p class="text-slate-400 text-sm font-medium">المستخدمين الفريدين</p>
                <h3 id="uniqueUsers" class="text-3xl font-bold text-emerald-400 mt-2">0</h3>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
                <p class="text-slate-400 text-sm font-medium">السكريبتات المطلوبة</p>
                <h3 id="uniqueScripts" class="text-3xl font-bold text-amber-400 mt-2">0</h3>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-slate-900 rounded-2xl border border-slate-800 shadow-xl overflow-hidden">
            <div class="p-6 border-b border-slate-800">
                <h2 class="text-lg font-bold text-white">سجل التشغيلات الأخير</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-950/50 text-slate-400 text-sm border-b border-slate-800">
                            <th class="p-4 font-semibold">#</th>
                            <th class="p-4 font-semibold">البريد الإلكتروني</th>
                            <th class="p-4 font-semibold">معرف الجهاز (Device ID)</th>
                            <th class="p-4 font-semibold">اسم السكريبت / اللعبة</th>
                            <th class="p-4 font-semibold">وقت التشغيل</th>
                        </tr>
                    </thead>
                    <tbody id="analyticsTableBody" class="divide-y divide-slate-800 text-sm">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-slate-500">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = "https://kvsyzgavfxnwqmtsginv.supabase.co";
        const supabaseAnonKey = "sb_publishable_1uSIqgNONAV53GjOoBoZUw_niAGJXO6";

        async function fetchAnalytics() {
            const tableBody = document.getElementById("analyticsTableBody");
            tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-indigo-400">جاري التحديث...</td></tr>`;

            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/analytics?select=*&order=created_at.desc`, {
                    headers: {
                        "apikey": supabaseAnonKey,
                        "Authorization": `Bearer ${supabaseAnonKey}`
                    }
                });

                if (!response.ok) throw new Error("فشل الاتصال بقاعدة البيانات");

                const data = await response.json();
                renderData(data);
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400">خطأ في جلب البيانات: ${error.message}</td></tr>`;
            }
        }

        function renderData(data) {
            const tableBody = document.getElementById("analyticsTableBody");
            tableBody.innerHTML = "";

            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">لا توجد سجلات حتى الآن</td></tr>`;
                document.getElementById("totalLaunches").innerText = "0";
                document.getElementById("uniqueUsers").innerText = "0";
                document.getElementById("uniqueScripts").innerText = "0";
                return;
            }

            // حساب الإحصائيات
            document.getElementById("totalLaunches").innerText = data.length;
            
            const uniqueUsersSet = new Set(data.map(item => item.email));
            document.getElementById("uniqueUsers").innerText = uniqueUsersSet.size;

            const uniqueScriptsSet = new Set(data.map(item => item.script_name));
            document.getElementById("uniqueScripts").innerText = uniqueScriptsSet.size;

            // تعبئة الجدول
            data.forEach((row, index) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/50 transition duration-150";
                
                const formattedDate = new Date(row.created_at).toLocaleString('ar-EG');

                tr.innerHTML = `
                    <td class="p-4 text-slate-500">${index + 1}</td>
                    <td class="p-4 font-medium text-indigo-300">${row.email || 'غير معروف'}</td>
                    <td class="p-4 text-slate-400 font-mono text-xs">${row.device_id || '-'}</td>
                    <td class="p-4 text-emerald-400 font-semibold">${row.script_name || '-'}</td>
                    <td class="p-4 text-slate-400 text-xs">${formattedDate}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // جلب البيانات عند فتح الصفحة مباشرة
        fetchAnalytics();
    </script>
</body>
</html>
