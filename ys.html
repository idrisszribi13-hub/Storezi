<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSScores - مباريات اليوم</title>
    <style>
        /* ===== ROOT ===== */
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --border: #30363d;
            --text: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --live: #f85149;
            --green: #3fb950;
            --yellow: #d29922;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            color: var(--accent);
        }
        .header .date-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }
        .header .date-picker input[type="date"] {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            padding: 4px 0;
            outline: none;
        }
        .header .date-picker input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        .header .date-picker button {
            background: var(--accent);
            border: none;
            color: #0d1117;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .header .date-picker button:hover {
            opacity: 0.8;
        }

        /* ===== قائمة المباريات ===== */
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .match-card {
            background: var(--surface);
            border-radius: 14px;
            padding: 16px 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .match-card:hover {
            border-color: var(--accent);
            transform: scale(1.01);
            background: var(--surface-hover);
        }
        .match-card .teams {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
        }
        .match-card .teams .team {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .match-card .teams .team img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: contain;
            background: rgba(255,255,255,0.05);
        }
        .match-card .teams .vs {
            color: var(--text-secondary);
            font-size: 13px;
        }
        .match-card .match-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .match-card .match-meta .score {
            font-weight: 700;
            font-size: 20px;
            min-width: 50px;
            text-align: center;
            color: var(--text);
        }
        .match-card .match-meta .status {
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--text-secondary);
            color: #0d1117;
        }
        .match-card .match-meta .status.live {
            background: var(--live);
        }
        .match-card .match-meta .status.finished {
            background: var(--text-secondary);
        }
        .match-card .match-meta .time {
            color: var(--text-secondary);
            font-size: 13px;
        }
        .match-card .match-meta .league-badge {
            background: rgba(88, 166, 255, 0.15);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent);
        }

        /* ===== تفاصيل المباراة ===== */
        .match-detail {
            display: none;
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-top: 30px;
            animation: fadeIn 0.3s ease;
        }
        .match-detail.visible {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
            gap: 8px;
        }
        .detail-header .back-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .detail-header .back-btn:hover {
            color: var(--text);
            border-color: var(--accent);
        }
        .detail-header .league-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }

        .detail-teams {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .detail-teams .team {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .detail-teams .team img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: contain;
        }
        .detail-teams .team .name {
            font-weight: 700;
            font-size: 22px;
        }
        .detail-teams .score-box {
            text-align: center;
        }
        .detail-teams .score-box .score {
            font-size: 34px;
            font-weight: 900;
        }
        .detail-teams .score-box .status {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .detail-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 30px;
            background: var(--bg);
            padding: 16px 20px;
            border-radius: 12px;
            margin: 16px 0;
            font-size: 14px;
        }
        .detail-info .label {
            color: var(--text-secondary);
        }
        .detail-info .value {
            font-weight: 600;
        }

        /* ===== التبويبات ===== */
        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin: 18px 0 14px 0;
        }
        .tabs button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tabs button:hover {
            color: var(--text);
            background: var(--surface-hover);
        }
        .tabs button.active {
            color: var(--accent);
            background: rgba(88, 166, 255, 0.12);
        }

        .tab-content {
            display: none;
            padding: 10px 0;
        }
        .tab-content.active {
            display: block;
        }

        /* ===== الترتيب ===== */
        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .standings-table th {
            text-align: right;
            padding: 8px 6px;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 2px solid var(--border);
        }
        .standings-table td {
            padding: 6px 6px;
            border-bottom: 1px solid var(--border);
        }
        .standings-table .team-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .standings-table .team-cell img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: contain;
        }
        .standings-table .points {
            font-weight: 700;
            color: var(--accent);
        }

        /* ===== آخر المباريات ===== */
        .last-matches {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .last-match-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .last-match-item .win {
            color: var(--green);
        }
        .last-match-item .lose {
            color: var(--live);
        }
        .last-match-item .equal {
            color: var(--yellow);
        }

        /* ===== المواجهات المباشرة ===== */
        .h2h-box {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .h2h-box .h2h-item {
            text-align: center;
        }
        .h2h-box .h2h-item .num {
            font-size: 28px;
            font-weight: 700;
        }
        .h2h-box .h2h-item .num.home {
            color: var(--accent);
        }
        .h2h-box .h2h-item .num.draw {
            color: var(--yellow);
        }
        .h2h-box .h2h-item .num.away {
            color: var(--live);
        }
        .h2h-box .h2h-item .label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== تحميل ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .loading .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-matches {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
        }

        /* ===== استجابة ===== */
        @media (max-width: 600px) {
            .match-card {
                flex-direction: column;
                align-items: stretch;
            }
            .match-card .teams {
                justify-content: center;
            }
            .match-card .match-meta {
                justify-content: center;
            }
            .detail-teams {
                gap: 15px;
            }
            .detail-teams .team .name {
                font-size: 17px;
            }
            .detail-info {
                grid-template-columns: 1fr;
            }
            .standings-table {
                font-size: 12px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header .date-picker {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>⚽ مباريات اليوم</h1>
            <div class="date-picker">
                <input type="date" id="dateInput">
                <button id="loadDateBtn">عرض</button>
            </div>
        </div>

        <!-- ===== قائمة المباريات ===== -->
        <div id="matchesList">
            <div class="loading"><div class="spinner"></div><div>جاري التحميل...</div></div>
        </div>

        <!-- ===== تفاصيل المباراة ===== -->
        <div class="match-detail" id="matchDetail">
            <div class="detail-header">
                <button class="back-btn" id="backBtn">← رجوع</button>
                <span class="league-title" id="detailLeague">الدوري</span>
            </div>
            <div id="detailContent">
                <div class="loading"><div class="spinner"></div><div>جاري التحميل...</div></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ==================== الإعدادات ====================
            const WORKER_URL = 'https://dry-truth-a84e.idriss-zribi13.workers.dev/';
            const BASE_URL = 'https://api-en.ysscores.com/api/matches/';

            // معرفات البطولات المرغوبة (الدوري الإسباني، السعودي، الإنجليزي، إلخ)
            const COMPETITION_IDS = ['938652', '941825', '938649']; // LaLiga, Saudi Pro League, Premier League

            // ==================== دوال مساعدة ====================
            function fetchAPI(endpoint) {
                const full = WORKER_URL + '?url=' + encodeURIComponent(BASE_URL + endpoint);
                return fetch(full).then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                });
            }

            function getImageUrl(path) {
                if (!path) return '';
                if (path.startsWith('http')) return path;
                return 'https://api-en.ysscores.com/images/teams/' + path;
            }

            function getStatusText(status) {
                if (status === 0) return 'لم تبدأ';
                if (status === 1) return 'حية';
                if (status === 2) return 'انتهت';
                return 'غير معروف';
            }

            function getStatusClass(status) {
                if (status === 1) return 'live';
                if (status === 2) return 'finished';
                return '';
            }

            function getResult(home, away) {
                if (home === away) return 'equal';
                return home > away ? 'win' : 'lose';
            }

            function formatDate(dateStr) {
                const d = new Date(dateStr + 'T00:00:00');
                return d.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }

            // ==================== تحميل المباريات ====================
            async function loadMatches(date) {
                const container = document.getElementById('matchesList');
                container.innerHTML = '<div class="loading"><div class="spinner"></div><div>جاري التحميل...</div></div>';

                try {
                    const dateStr = date || new Date().toISOString().split('T')[0];
                    // بناء query: matches_date_get/{date}/[compIds]/[]/[]/L/60
                    const compIdsStr = COMPETITION_IDS.map(id => `"${id}"`).join(',');
                    const endpoint = `matches_date_get/${dateStr}/[${compIdsStr}]/[]/[]/L/60`;
                    const data = await fetchAPI(endpoint);

                    if (!data.status || data.data.length === 0) {
                        container.innerHTML = `<div class="no-matches">📭 لا توجد مباريات في هذا اليوم</div>`;
                        return;
                    }

                    renderMatches(data.data, container);

                } catch (error) {
                    console.error('خطأ:', error);
                    container.innerHTML = `<div class="no-matches" style="color:var(--live);">⚠️ فشل التحميل: ${error.message}</div>`;
                }
            }

            function renderMatches(matches, container) {
                // ترتيب المباريات حسب الوقت
                matches.sort((a, b) => (a.match_timestamp || 0) - (b.match_timestamp || 0));

                let html = '';
                matches.forEach(m => {
                    const home = m.home_team || {};
                    const away = m.away_team || {};
                    const homeLogo = getImageUrl(home.image);
                    const awayLogo = getImageUrl(away.image);
                    const statusText = getStatusText(m.status);
                    const statusClass = getStatusClass(m.status);
                    const score = (m.status === 0) ? 'vs' : `${m.home_scores || 0} - ${m.away_scores || 0}`;
                    const time = m.match_time || '';
                    const leagueName = m.championship?.title || '';

                    html += `
                        <div class="match-card" data-match-id="${m.match_id}">
                            <div class="teams">
                                <div class="team">
                                    <img src="${homeLogo}" onerror="this.style.display='none'">
                                    <span>${home.title || 'Home'}</span>
                                </div>
                                <span class="vs">vs</span>
                                <div class="team">
                                    <span>${away.title || 'Away'}</span>
                                    <img src="${awayLogo}" onerror="this.style.display='none'">
                                </div>
                            </div>
                            <div class="match-meta">
                                ${leagueName ? `<span class="league-badge">${leagueName}</span>` : ''}
                                <span class="time">${time}</span>
                                <span class="score">${score}</span>
                                <span class="status ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                document.querySelectorAll('.match-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const matchId = this.dataset.matchId;
                        if (matchId) loadMatchDetail(matchId);
                    });
                });
            }

            // ==================== تفاصيل المباراة ====================
            async function loadMatchDetail(matchId) {
                const detailContainer = document.getElementById('matchDetail');
                const content = document.getElementById('detailContent');
                detailContainer.classList.add('visible');
                content.innerHTML = '<div class="loading"><div class="spinner"></div><div>جاري التحميل...</div></div>';

                try {
                    const infoData = await fetchAPI(`match_info/${matchId}/L/60`);
                    if (!infoData.status) throw new Error('فشل جلب معلومات المباراة');

                    const championshipId = infoData.data.championship_id;
                    const standingData = await fetchAPI(`league_standing_stage/${championshipId}`);
                    if (!standingData.status) throw new Error('فشل جلب الترتيب');

                    renderMatchDetail(infoData.data, standingData.data, content);

                } catch (error) {
                    content.innerHTML = `<div style="color:var(--live);text-align:center;padding:20px;">⚠️ ${error.message}</div>`;
                }
            }

            function renderMatchDetail(match, standing, container) {
                const home = match.home_team || {};
                const away = match.away_team || {};
                const homeLogo = getImageUrl(home.image);
                const awayLogo = getImageUrl(away.image);
                const champ = match.championship || {};

                const competition = champ.title || 'غير معروف';
                const round = match.round || '';
                const stadium = match.Stadium || 'غير معروف';
                const channel = (match.channel_commm && match.channel_commm.length > 0) ? match.channel_commm[0]
                    .channel_name : 'غير معروف';
                const commentator = (match.channel_commm && match.channel_commm.length > 0) ? match.channel_commm[0]
                    .commentator_name : 'غير معروف';
                const referee = match.referees ? match.referees.title : 'غير معروف';
                const matchTime = match.match_time || '';
                const matchDate = match.match_date || '';
                const statusText = getStatusText(match.status);

                const homeScore = match.home_scores ?? '-';
                const awayScore = match.away_scores ?? '-';

                // بناء الهيكل
                let html = `
                    <div class="detail-teams">
                        <div class="team">
                            <img src="${homeLogo}" onerror="this.style.display='none'">
                            <span class="name">${home.title || 'Home'}</span>
                        </div>
                        <div class="score-box">
                            <div class="score">${homeScore} - ${awayScore}</div>
                            <div class="status">${statusText} ${matchTime ? '• ' + matchTime : ''}</div>
                        </div>
                        <div class="team">
                            <span class="name">${away.title || 'Away'}</span>
                            <img src="${awayLogo}" onerror="this.style.display='none'">
                        </div>
                    </div>

                    <div class="detail-info">
                        <div><span class="label">🏆 البطولة:</span> <span class="value">${competition}</span></div>
                        <div><span class="label">📅 الجولة:</span> <span class="value">${round}</span></div>
                        <div><span class="label">🏟️ الملعب:</span> <span class="value">${stadium}</span></div>
                        <div><span class="label">📺 القناة:</span> <span class="value">${channel}</span></div>
                        <div><span class="label">🎙️ المعلق:</span> <span class="value">${commentator}</span></div>
                        <div><span class="label">👨‍⚖️ الحكم:</span> <span class="value">${referee}</span></div>
                        <div><span class="label">🕐 الوقت:</span> <span class="value">${matchTime}</span></div>
                        <div><span class="label">📆 التاريخ:</span> <span class="value">${matchDate}</span></div>
                    </div>
                `;

                // التبويبات
                html += `
                    <div class="tabs" id="detailTabs">
                        <button class="active" data-tab="standings">📊 الترتيب</button>
                        <button data-tab="last5">📋 آخر 5 مباريات</button>
                        <button data-tab="h2h">⚔️ المواجهات المباشرة</button>
                    </div>
                    <div class="tab-content active" id="tab-standings">
                        ${renderStandings(standing)}
                    </div>
                    <div class="tab-content" id="tab-last5">
                        ${renderLastMatches(match)}
                    </div>
                    <div class="tab-content" id="tab-h2h">
                        ${renderH2H(match)}
                    </div>
                `;

                container.innerHTML = html;

                // تفعيل التبويبات
                document.querySelectorAll('#detailTabs button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#detailTabs button').forEach(b => b.classList.remove(
                        'active'));
                        this.classList.add('active');
                        const tab = this.dataset.tab;
                        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove(
                        'active'));
                        const target = document.getElementById('tab-' + tab);
                        if (target) target.classList.add('active');
                    });
                });

                document.getElementById('detailLeague').textContent = competition;
            }

            // ===== الترتيب =====
            function renderStandings(standingData) {
                if (!standingData || !standingData.league || !standingData.league.stage0) {
                    return '<div class="no-matches">لا توجد بيانات ترتيب</div>';
                }
                const teams = standingData.league.stage0;
                if (teams.length === 0) return '<div class="no-matches">لا توجد فرق</div>';

                let html = `
                    <table class="standings-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الفريق</th>
                                <th>لعب</th>
                                <th>فوز</th>
                                <th>تعادل</th>
                                <th>خسارة</th>
                                <th>الأهداف</th>
                                <th>±</th>
                                <th>نقاط</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                teams.forEach((team, idx) => {
                    const t = team.team_name || {};
                    const logo = getImageUrl(t.image);
                    html += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td><div class="team-cell"><img src="${logo}" onerror="this.style.display='none'">${t.title || 'غير معروف'}</div></td>
                            <td>${team.play || 0}</td>
                            <td>${team.wins || 0}</td>
                            <td>${team.draw || 0}</td>
                            <td>${team.lose || 0}</td>
                            <td>${team.for || 0} - ${team.against || 0}</td>
                            <td>${team.diff || 0}</td>
                            <td class="points">${team.points || 0}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                return html;
            }

            // ===== آخر 5 مباريات =====
            function renderLastMatches(match) {
                if (!match.played_result) return '<div class="no-matches">لا توجد بيانات</div>';

                const all = { ...match.played_result.home, ...match.played_result.away };
                const keys = Object.keys(all).slice(0, 5);
                if (keys.length === 0) return '<div class="no-matches">لا توجد مباريات سابقة</div>';

                let html = '<div class="last-matches">';
                keys.forEach(key => {
                    const m = all[key];
                    if (!m) return;
                    const homeName = m.home?.title || 'Home';
                    const awayName = m.away?.title || 'Away';
                    const score = `${m.home_scores || 0} - ${m.away_scores || 0}`;
                    const result = m.win_type || 'equal';
                    const cls = result === 'win' ? 'win' : (result === 'lose' ? 'lose' : 'equal');
                    const txt = result === 'win' ? 'فوز' : (result === 'lose' ? 'خسارة' : 'تعادل');
                    html += `
                        <div class="last-match-item">
                            <span>${homeName} vs ${awayName}</span>
                            <span>${score}</span>
                            <span class="${cls}">${txt}</span>
                        </div>
                    `;
                });
                html += '</div>';
                return html;
            }

            // ===== المواجهات المباشرة =====
            function renderH2H(match) {
                if (!match.teamWins) return '<div class="no-matches">لا توجد بيانات</div>';

                const homeId = match.home_team?.row_id;
                const awayId = match.away_team?.row_id;
                if (!homeId || !awayId) return '<div class="no-matches">لا توجد بيانات كافية</div>';

                const homeWins = match.teamWins[homeId] || 0;
                const awayWins = match.teamWins[awayId] || 0;
                const draws = match.teamWins['equal'] || 0;

                return `
                    <div class="h2h-box">
                        <div class="h2h-item">
                            <div class="num home">${homeWins}</div>
                            <div class="label">فوز ${match.home_team?.title || 'Home'}</div>
                        </div>
                        <div class="h2h-item">
                            <div class="num draw">${draws}</div>
                            <div class="label">تعادل</div>
                        </div>
                        <div class="h2h-item">
                            <div class="num away">${awayWins}</div>
                            <div class="label">فوز ${match.away_team?.title || 'Away'}</div>
                        </div>
                    </div>
                `;
            }

            // ===== التحكم بالتاريخ =====
            document.getElementById('loadDateBtn').addEventListener('click', function() {
                const date = document.getElementById('dateInput').value;
                if (date) loadMatches(date);
            });

            document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

            document.getElementById('backBtn').addEventListener('click', function() {
                document.getElementById('matchDetail').classList.remove('visible');
                // إعادة تحميل اليوم الحالي
                const date = document.getElementById('dateInput').value || new Date().toISOString().split('T')[0];
                loadMatches(date);
            });

            // ===== بدء التشغيل =====
            const today = new Date().toISOString().split('T')[0];
            loadMatches(today);

        })();
    </script>

</body>
