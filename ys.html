<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YSScores - Live Sports</title>
    <style>
        /* ============================================================
               ROOT VARIABLES (Flutter-style dark theme)
               ============================================================ */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111927;
            --bg-card: #162033;
            --bg-elevated: #1c2a42;
            --border-color: #1e2d45;
            --text-primary: #f0f6fc;
            --text-secondary: #8b9bb5;
            --text-muted: #5a6a84;
            --accent-blue: #4c8bf5;
            --accent-blue-hover: #6aa3ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        /* ============================================================
               RESET & BASE
               ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        /* ============================================================
               APP CONTAINER
               ============================================================ */
        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 16px 40px;
            min-height: 100vh;
        }

        /* ============================================================
               HEADER (Flutter-style AppBar)
               ============================================================ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 0 14px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .app-header .brand .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), #6c5ce7);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 900;
            color: #fff;
        }

        .app-header .brand span {
            background: linear-gradient(135deg, var(--accent-blue), #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header .date-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-card);
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
        }

        .app-header .date-nav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .app-header .date-nav button:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .app-header .date-nav .date-display {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            min-width: 100px;
            text-align: center;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .app-header .date-nav .date-display:hover {
            background: rgba(76, 139, 245, 0.15);
            color: var(--accent-blue);
        }

        .app-header .date-nav .today-btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .app-header .date-nav .today-btn:hover {
            background: var(--accent-blue-hover);
            transform: scale(1.02);
        }

        /* ============================================================
               TAB BAR (Flutter-style BottomNavigationBar)
               ============================================================ */
        .tab-bar {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
        }

        .tab-bar button {
            flex: 1 0 auto;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 80px;
        }

        .tab-bar button:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .tab-bar button.active {
            background: var(--accent-blue);
            color: #fff;
            box-shadow: 0 4px 20px rgba(76, 139, 245, 0.3);
        }

        .tab-bar button .tab-icon {
            font-size: 16px;
        }

        /* ============================================================
               TAB CONTENT
               ============================================================ */
        .tab-content {
            display: none;
            animation: fadeSlideUp 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
               LOADING / ERROR
               ============================================================ */
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .loading-state .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-state {
            text-align: center;
            padding: 24px 16px;
            color: var(--accent-red);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--accent-red);
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ============================================================
               MATCHES LIST (Flutter-style ListView)
               ============================================================ */
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .league-group {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
        }

        .league-group:hover {
            border-color: var(--accent-blue);
        }

        .league-group .league-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .league-group .league-header:hover {
            background: rgba(76, 139, 245, 0.05);
        }

        .league-group .league-header img {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            object-fit: contain;
        }

        .league-group .league-header .name {
            font-weight: 700;
            font-size: 14px;
            flex: 1;
            color: var(--text-primary);
        }

        .league-group .league-header .count {
            color: var(--text-secondary);
            font-size: 11px;
            background: var(--border-color);
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .match-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            gap: 8px;
            flex-wrap: wrap;
        }

        .match-item:last-child {
            border-bottom: none;
        }

        .match-item:hover {
            background: rgba(76, 139, 245, 0.06);
            transform: translateX(4px);
        }

        .match-item .teams {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .match-item .teams img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
        }

        .match-item .teams .team-name {
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
        }

        .match-item .teams .vs {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 400;
        }

        .match-item .match-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        .match-item .match-info .score {
            font-weight: 700;
            font-size: 15px;
            min-width: 40px;
            text-align: center;
            color: var(--text-primary);
        }

        .match-item .match-info .status {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .match-item .match-info .status.live {
            background: var(--accent-red);
            color: #fff;
            animation: pulse-live 1.5s infinite;
        }

        @keyframes pulse-live {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .match-item .match-info .status.finished {
            background: var(--border-color);
            color: var(--text-secondary);
        }

        .match-item .match-info .status.upcoming {
            background: var(--accent-blue);
            color: #fff;
        }

        .match-item .match-info .time {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
        }

        /* ============================================================
               DETAIL VIEW (Match Overlay)
               ============================================================ */
        .detail-view {
            display: none;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 18px 20px 24px;
            border: 1px solid var(--border-color);
            margin-top: 12px;
            animation: slideUp 0.35s ease;
            box-shadow: var(--shadow);
        }

        .detail-view.visible {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail-view .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 5px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: var(--transition);
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-view .back-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-blue);
            background: rgba(76, 139, 245, 0.08);
        }

        /* --- Detail Header --- */
        .detail-header .league {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .detail-header .teams {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 8px 0 10px;
        }

        .detail-header .teams .team {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-header .teams .team img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: contain;
        }

        .detail-header .teams .team .name {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
        }

        .detail-header .teams .score-box {
            text-align: center;
        }

        .detail-header .teams .score-box .score {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .detail-header .teams .score-box .status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* --- Detail Meta --- */
        .detail-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 16px;
            background: var(--bg-secondary);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin: 8px 0 12px;
            font-size: 12px;
            border: 1px solid var(--border-color);
        }

        .detail-meta .label {
            color: var(--text-secondary);
        }

        .detail-meta .value {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* --- Detail Tabs --- */
        .detail-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .detail-tabs button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .detail-tabs button:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .detail-tabs button.active {
            background: var(--accent-blue);
            color: #fff;
            box-shadow: 0 2px 12px rgba(76, 139, 245, 0.25);
        }

        .detail-tab-content {
            display: none;
            animation: fadeSlideUp 0.25s ease;
        }

        .detail-tab-content.active {
            display: block;
        }

        /* ============================================================
               PLAYER DETAIL (Modal)
               ============================================================ */
        .player-detail-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .player-detail-overlay.visible {
            display: flex;
        }

        .player-detail-box {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            border: 1px solid var(--border-color);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.35s ease;
            box-shadow: var(--shadow);
        }

        .player-detail-box .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }

        .player-detail-box .close-btn:hover {
            color: var(--text-primary);
        }

        .player-detail-box .player-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .player-detail-box .player-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: contain;
            background: var(--bg-secondary);
        }

        .player-detail-box .player-header .info .name {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .player-detail-box .player-header .info .team {
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .player-detail-box .player-header .info .team:hover {
            color: var(--accent-blue);
        }

        .player-detail-box .player-header .info .pos {
            font-size: 13px;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .player-detail-box .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin: 12px 0;
        }

        .player-detail-box .player-stats .stat-item {
            text-align: center;
        }

        .player-detail-box .player-stats .stat-item .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .player-detail-box .player-stats .stat-item .label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .player-detail-box .player-transfers {
            margin-top: 12px;
        }

        .player-detail-box .player-transfers .title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .player-detail-box .transfer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .player-detail-box .transfer-row .type {
            font-weight: 600;
            color: var(--accent-blue);
            min-width: 80px;
        }

        .player-detail-box .transfer-row .teams {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .player-detail-box .transfer-row .teams img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: contain;
        }

        .player-detail-box .transfer-row .value {
            font-weight: 700;
            color: var(--accent-green);
            min-width: 60px;
            text-align: right;
        }

        .player-detail-box .transfer-row .date {
            color: var(--text-secondary);
            font-size: 10px;
            min-width: 80px;
            text-align: right;
        }

        /* ============================================================
               TEAM DETAIL (Modal)
               ============================================================ */
        .team-detail-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

        .team-detail-box .team-header .info .name {

        }

        .team-detail-box .team-header .info .country {

        }

        .team-detail-box .team-header .info .stadium {

        }

        .team-detail-box .team-tab-content.active {

        .team-detail-box .team-standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .team-detail-box .team-standings-table th {
            text-align: right;
            padding: 4px 4px;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        .team-detail-box .team-standings-table td {
            padding: 3px 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .team-detail-box .team-standings-table .team-cell {
            display: flex;
            align-items: center;

        }

        .team-detail-box .team-standings-table .team-cell img {
            width: 18px;

            object-fit: contain;
        }

        .team-detail-box .team-standings-table .points {
            font-weight: 700;

        }

        .team-detail-box .team-matches-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .team-detail-box .team-match-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .team-detail-box .team-match-item:hover {
            border-color: var(--accent-blue);
        }

        .team-detail-box .team-match-item .teams {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .team-detail-box .team-match-item .teams img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: contain;
        }

        .team-detail-box .team-match-item .score {
            font-weight: 700;
            min-width: 40px;
            text-align: center;
        }

        .team-detail-box .team-match-item .status {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .team-detail-box .team-match-item .status.live {
            background: var(--accent-red);
            color: #fff;
        }

        .team-detail-box .team-match-item .status.finished {
            background: var(--border-color);
            color: var(--text-secondary);
        }

        .team-detail-box .team-match-item .status.upcoming {
            background: var(--accent-blue);
            color: #fff;
        }

        .team-detail-box .team-match-item .date {
            color: var(--text-secondary);
            font-size: 10px;
        }

        .team-detail-box .team-news-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .team-detail-box .team-news-item {
            padding: 6px 10px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .team-detail-box .team-news-item:hover {
            border-color: var(--accent-blue);
        }

        .team-detail-box .team-news-item .title {
            font-weight: 600;
            color: var(--text-primary);
        }

        .team-detail-box .team-news-item .time {
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* ============================================================
               STANDINGS TABLE
               ============================================================ */
        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .standings-table th {
            text-align: right;
            padding: 6px 4px;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .standings-table td {
            padding: 4px 4px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .standings-table .team-cell {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .standings-table .team-cell img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: contain;
        }

        .standings-table .points {
            font-weight: 700;
            color: var(--accent-blue);
        }

        /* ============================================================
               LINEUPS (Formation style with player images)
               ============================================================ */
        .lineup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .lineup-team {
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            border: 1px solid var(--border-color);
        }

        .lineup-team .title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            flex-wrap: wrap;
        }

        .lineup-team .title img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: contain;
        }

        .lineup-team .title .formation-badge {
            font-size: 11px;
            color: var(--accent-blue);
            background: rgba(76, 139, 245, 0.15);
            padding: 1px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .lineup-team .formation-pitch {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 6px 4px;
            border: 1px solid var(--border-color);
            min-height: 120px;
        }

        .position-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
            padding: 2px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .position-row .pos-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            min-width: 28px;
            background: var(--bg-primary);
            padding: 1px 6px;
            border-radius: 4px;
            text-align: center;
        }

        .position-row .players-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            flex: 1;
        }

        .player-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            background: var(--bg-card);
            padding: 2px 8px 2px 4px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .player-badge:hover {
            border-color: var(--accent-blue);
            transform: scale(1.02);
        }

        .player-badge img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: contain;
        }

        .player-badge .player-number {
            font-weight: 700;
            color: var(--accent-blue);
            font-size: 10px;
            min-width: 14px;
        }

        .player-badge .player-name {
            color: var(--text-primary);
            font-size: 11px;
        }

        .lineup-team .coach-info {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
            padding: 4px 8px;
            background: var(--bg-primary);
            border-radius: 4px;
        }

        .lineup-team .injuries {
            font-size: 11px;
            color: var(--accent-yellow);
            margin-top: 4px;
            padding: 4px 8px;
            background: rgba(210, 153, 34, 0.08);
            border-radius: 4px;
            border-right: 3px solid var(--accent-yellow);
        }

        /* ============================================================
               EVENTS
               ============================================================ */
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 400px;
            overflow-y: auto;
        }

        .event-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px;
            background: var(--bg-secondary);
            border-radius: 6px;
            font-size: 12px;
            border-right: 3px solid transparent;
            transition: var(--transition);
        }

        .event-item:hover {
            background: var(--bg-card);
        }

        .event-item .time {
            font-weight: 700;
            color: var(--accent-blue);
            min-width: 32px;
        }

        .event-item .icon {
            font-size: 15px;
        }

        .event-item .desc {
            flex: 1;
        }

        .event-item .team {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 11px;
        }

        .event-item.team-home {
            border-right-color: var(--accent-blue);
        }

        .event-item.team-away {
            border-right-color: var(--accent-red);
        }

        /* ============================================================
               STATISTICS
               ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 4px 12px;
            align-items: center;
        }

        .stats-grid .stat-item {
            display: contents;
        }

        .stats-grid .stat-label {
            color: var(--text-secondary);
            font-size: 11px;
            text-align: center;
            grid-column: 1 / -1;
            padding-top: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stats-grid .stat-value-home {
            text-align: left;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
        }

        .stats-grid .stat-value-away {
            text-align: right;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
        }

        .stats-grid .stat-bar {
            width: 50px;
            height: 4px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .stats-grid .stat-bar .fill-home {
            height: 100%;
            background: var(--accent-blue);
            border-radius: 4px;
        }

        .stats-grid .stat-bar .fill-away {
            height: 100%;
            background: var(--accent-red);
            border-radius: 4px;
            position: absolute;
            right: 0;
            top: 0;
        }

        /* ============================================================
               LAST 5 MATCHES (Win/Loss/ Draw pills)
               ============================================================ */
        .last5-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .last5-team {
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            border: 1px solid var(--border-color);
        }

        .last5-team .team-title {
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .last5-team .team-title img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: contain;
        }

        .last5-results {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .last5-result {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            background: var(--bg-card);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .last5-result .win {
            color: var(--accent-green);
            font-weight: 700;
        }

        .last5-result .lose {
            color: var(--accent-red);
            font-weight: 700;
        }

        .last5-result .equal {
            color: var(--accent-yellow);
            font-weight: 700;
        }

        .last5-result .score-text {
            color: var(--text-secondary);
            font-size: 10px;
        }

        /* ============================================================
               H2H
               ============================================================ */
        .h2h-box {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 16px;
            flex-wrap: wrap;
            text-align: center;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .h2h-box .stat {
            font-size: 24px;
            font-weight: 800;
        }

        .h2h-box .stat.win-home {
            color: var(--accent-blue);
        }

        .h2h-box .stat.draw {
            color: var(--accent-yellow);
        }

        .h2h-box .stat.win-away {
            color: var(--accent-red);
        }

        .h2h-box .label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }

        .h2h-box .team-icon {
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .h2h-box .team-icon img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: contain;
        }

        /* ============================================================
               VIDEOS
               ============================================================ */
        .videos-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-item {
            background: var(--bg-secondary);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
        }

        .video-item:hover {
            border-color: var(--accent-blue);
        }

        .video-item a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            word-break: break-all;
        }

        .video-item a:hover {
            text-decoration: underline;
        }

        /* ============================================================
               NEWS (Flutter-style Cards)
               ============================================================ */
        .news-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .news-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
        }

        .news-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .news-card.featured {
            border-color: var(--accent-blue);
        }

        .news-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: var(--bg-secondary);
        }

        .news-card .news-body {
            padding: 10px 14px 14px;
        }

        .news-card .news-body .title {
            font-weight: 700;
            font-size: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 2px;
        }

        .news-card .news-body .desc {
            font-size: 12px;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-card .news-body .time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ============================================================
               NEWS DETAIL (Modal)
               ============================================================ */
        .news-detail-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .news-detail-overlay.visible {
            display: flex;
        }

        .news-detail-box {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            border: 1px solid var(--border-color);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.35s ease;
            box-shadow: var(--shadow);
        }

        .news-detail-box .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }

        .news-detail-box .close-btn:hover {
            color: var(--text-primary);
        }

        .news-detail-box .detail-title {
            font-size: 22px;
            font-weight: 800;
            margin: 8px 0 12px;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .news-detail-box .detail-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            margin: 8px 0 16px;
            background: var(--bg-secondary);
        }

        .news-detail-box .detail-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .news-detail-box .detail-content {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .news-detail-box .detail-content p {
            margin-bottom: 12px;
        }

        /* ============================================================
               RELATED NEWS (inside detail modal)
               ============================================================ */
        .related-news-list {
            margin-top: 16px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .related-news-list .related-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .related-news-item {
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .related-news-item:hover {
            color: var(--accent-blue);
        }

        .related-news-item .r-title {
            font-weight: 600;
            font-size: 13px;
        }

        .related-news-item .r-time {
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* ============================================================
               TRANSFERS (Flutter-style ListTile)
               ============================================================ */
        .transfer-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .transfer-item {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            transition: var(--transition);
            cursor: pointer;
        }

        .transfer-item:hover {
            border-color: var(--accent-blue);
            background: var(--bg-elevated);
        }

        .transfer-item .player {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 120px;
        }

        .transfer-item .player img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
        }

        .transfer-item .player .name {
            font-weight: 700;
            font-size: 13px;
            color: var(--text-primary);
        }

        .transfer-item .player .pos {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .transfer-item .teams {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-primary);
        }

        .transfer-item .teams img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: contain;
        }

        .transfer-item .value {
            font-weight: 700;
            color: var(--accent-blue);
            font-size: 13px;
        }

        .transfer-item .date {
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* ============================================================
               LEAGUES GRID (Standings tab)
               ============================================================ */
        .leagues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
        }

        .league-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .league-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .league-card img {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: contain;
        }

        .league-card .name {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
        }

        /* ============================================================
               DATE PICKER OVERLAY (Flutter-style Modal)
               ============================================================ */
        .date-picker-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .date-picker-overlay.visible {
            display: flex;
        }

        .date-picker-box {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            border: 1px solid var(--border-color);
            max-width: 360px;
            width: 92%;
            box-shadow: var(--shadow);
        }

        .date-picker-box .close-btn {
            float: left;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
        }

        .date-picker-box .close-btn:hover {
            color: var(--text-primary);
        }

        .date-picker-box .picker-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .date-picker-box input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 15px;
            margin-top: 4px;
            direction: ltr;
        }

        .date-picker-box input[type="date"]:focus {
            border-color: var(--accent-blue);
            outline: none;
        }

        .date-picker-box .confirm-btn {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            background: var(--accent-blue);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .date-picker-box .confirm-btn:hover {
            background: var(--accent-blue-hover);
        }

        /* ============================================================
               RESPONSIVE BREAKPOINTS
               ============================================================ */
        @media (max-width: 768px) {
            .app {
                padding: 8px 10px 30px;
            }

            .app-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .app-header .date-nav {
                justify-content: center;
            }

            .tab-bar button {
                font-size: 11px;
                padding: 6px 10px;
                min-width: 60px;
            }

            .tab-bar button .tab-icon {
                font-size: 14px;
            }

            .match-item {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
                padding: 8px 10px;
            }

            .match-item .teams {
                justify-content: center;
            }

            .match-item .match-info {
                justify-content: center;
            }

            .detail-header .teams {
                gap: 12px;
            }

            .detail-header .teams .team .name {
                font-size: 14px;
            }

            .detail-header .teams .team img {
                width: 28px;
                height: 28px;
            }

            .detail-header .teams .score-box .score {
                font-size: 20px;
            }

            .detail-meta {
                grid-template-columns: 1fr;
                font-size: 11px;
            }

            .lineup-grid {
                grid-template-columns: 1fr;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

            .leagues-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }

            .stats-grid {
                grid-template-columns: 1fr auto 1fr;
                gap: 3px 8px;
            }

            .stats-grid .stat-bar {
                width: 35px;
            }

            .h2h-box {
                gap: 20px;
                padding: 12px;
            }

            .h2h-box .stat {
                font-size: 20px;
            }

            .transfer-item {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                padding: 10px;
            }

            .transfer-item .player {
                min-width: 0;
            }

            .transfer-item .teams {
                justify-content: center;
            }

            .news-detail-box {
                padding: 16px;
            }

            .news-detail-box .detail-title {
