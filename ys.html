<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Score – API Sports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --secondary: #6c757d;
            --success: #198754;
            --danger: #dc3545;
            --light-bg: #f0f2f5;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            --text-color: #1a1a2e;
            --border-color: #e8eaed;
            --live-dot: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .live-badge-header {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #dc3545;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 12px 4px 8px;
            border-radius: 24px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .match-card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            background: var(--card-bg);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }
        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            gap: 8px;
        }
        .team-col {
            flex: 1;
            text-align: center;
            min-width: 0;
        }
        .team-col img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            background: var(--light-bg);
            border-radius: 6px;
            padding: 2px;
        }
        .team-col .team-title {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
            color: var(--text-color);
        }
        .center-col {
            width: 90px;
            flex-shrink: 0;
            text-align: center;
        }
        .score-big {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: -0.3px;
        }
        .live-badge {
            background: #dc3545;
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            border-radius: 10px;
            padding: 1px 8px;
            display: inline-block;
            margin-top: 1px;
            text-transform: uppercase;
        }
        .time-text {
            font-size: 11px;
            color: var(--text-color);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: var(--light-bg);
            padding: 1px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 2px;
        }
        .timeline-container {
            width: 100%;
            height: 3px;
            background: var(--border-color);
            border-radius: 2px;
            position: relative;
            margin: 4px 0 3px;
        }
        .timeline-fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .ht-marker {
            position: absolute;
            top: -2px;
            width: 2px;
            height: 7px;
            background: #dc3545;
            left: 50%;
            border-radius: 2px;
        }
        .match-footer {
            padding: 4px 14px 8px;
            text-align: center;
            font-size: 9px;
            color: var(--secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .match-footer .champ-title {
            font-weight: 600;
            color: var(--text-color);
        }
        .loading, .no-matches {
            text-align: center;
            padding: 30px;
            color: var(--secondary);
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(0,0,0,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ====== Modal CSS ====== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content-box {
            background: var(--card-bg);
            width: 95%;
            max-width: 600px;
            border-radius: 16px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 10px; right: 15px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px; height: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .detail-section-title {
            font-size: 16px;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }
        .event-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .event-row .time { min-width: 40px; font-weight: 700; color: var(--primary); }
        .event-row .icon { width: 20px; text-align: center; }
        .event-row .desc { flex: 1; }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .stat-item .label { color: var(--secondary); }
        .player-item {
            padding: 4px 0;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-item .num { width: 20px; font-weight: bold; text-align: center; }
        .player-item .name { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="section-header">
            <div class="live-badge-header">
                <span class="live-dot"></span> LIVE
            </div>
            <h3>Live Matches</h3>
        </div>
        <div id="liveMatchesContainer" class="row g-2"></div>
    </div>

    <!-- Modal for Match Details -->
    <div class="modal-overlay" id="matchDetailModal">
        <div class="modal-content-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h4 id="modalTitle" style="margin-bottom:10px;">Match Details</h4>
            <div id="matchDetailContent"></div>
        </div>
    </div>

    <script>
        const API_KEY = 'e227ff90ed4eacc3eacb07eca05ce78b';
        const API_BASE = 'https://v3.football.api-sports.io';
        const IMG_BASE_TEAM = 'https://media.api-sports.io/teams/';
        let liveMatches = [];
        let updateInterval = null;
        const timers = {};

        async function fetchFromAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.errors && Object.keys(data.errors).length > 0) throw new Error(JSON.stringify(data.errors));
                return data.response;
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        function formatLiveTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        function getStatusInfo(statusShort) {
            switch (statusShort) {
                case '1H': return { label: '1st Half', live: true };
                case '2H': return { label: '2nd Half', live: true };
                case 'HT': return { label: 'HT', live: false };
                case 'FT': return { label: 'FT', live: false };
                case 'ET': return { label: 'ET', live: true };
                case 'BT': return { label: 'BT', live: false };
                case 'PEN': return { label: 'PEN', live: true };
                case 'NS': return { label: 'Upcoming', live: false };
                default: return { label: 'LIVE', live: true };
            }
        }

        function renderMatchCard(fixture) {
            const home = fixture.teams.home;
            const away = fixture.teams.away;
            const goalsHome = fixture.goals.home ?? '-';
            const goalsAway = fixture.goals.away ?? '-';
            const status = getStatusInfo(fixture.fixture.status.short);
            const elapsed = fixture.fixture.status.elapsed || 0;
            const league = fixture.league;
            const date = new Date(fixture.fixture.date);
            const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            let progress = 0;
            if (status.live) {
                if (status.label === '1st Half' || status.label === '2nd Half') progress = Math.min((elapsed / 90) * 100, 100);
                else if (status.label === 'ET') progress = Math.min(100, ((elapsed - 90) / 30) * 100);
                else progress = 100;
            } else if (status.label === 'FT') progress = 100;
            else if (status.label === 'HT') progress = 50;

            // استخدام دالة لتوليد الوقت الحالي (تبدأ من الدقيقة الحالية)
            const initialSeconds = elapsed * 60;

            return `
                <div class="col-12 mb-2">
                    <div class="match-card" data-fixture-id="${fixture.fixture.id}" data-status="${fixture.fixture.status.short}" data-elapsed="${elapsed}">
                        <div class="match-row">
                            <div class="team-col">
                                <img src="${home.logo ? IMG_BASE_TEAM + home.id + '.png' : 'data:image/svg+xml...'}" onerror="this.src='data:image/svg+xml...'" />
                                <div class="team-title">${home.name}</div>
                            </div>
                            <div class="center-col">
                                <div class="score-big">${goalsHome} - ${goalsAway}</div>
                                ${status.live ? `<div class="live-badge">${status.label}</div>` : ''}
                                <div class="time-text" data-time-id="${fixture.fixture.id}" data-seconds="${initialSeconds}">${formatLiveTime(initialSeconds)}</div>
                                <div class="timeline-container">
                                    <div class="timeline-fill" style="width:${progress}%"></div>
                                    ${status.label === 'HT' ? '<div class="ht-marker"></div>' : ''}
                                </div>
                            </div>
                            <div class="team-col">
                                <img src="${away.logo ? IMG_BASE_TEAM + away.id + '.png' : 'data:image/svg+xml...'}" onerror="this.src='data:image/svg+xml...'" />
                                <div class="team-title">${away.name}</div>
                            </div>
                        </div>
                        <div class="match-footer">
                            <span class="champ-title">${league.name}</span> | <span>${dateStr} ${timeStr}</span>
                        </div>
                    </div>
                </div>`;
        }

        // دالة تشغيل العداد الحقيقي
        function startTimerForMatch(fixtureId, statusShort) {
            if (timers[fixtureId]) clearInterval(timers[fixtureId]);

            const timeElement = document.querySelector(`[data-time-id="${fixtureId}"]`);
            if (!timeElement) return;

            // إذا كانت المباراة متوقفة (HT, FT, NS)، لا داعي لتشغيل عداد
            if (!['1H', '2H', 'ET', 'PEN'].includes(statusShort)) {
                return;
            }

            let seconds = parseInt(timeElement.dataset.seconds) || 0;

            timers[fixtureId] = setInterval(() => {
                seconds++;
                timeElement.textContent = formatLiveTime(seconds);
            }, 1000);
        }

        async function fetchLiveMatches() {
            const container = document.getElementById('liveMatchesContainer');
            container.innerHTML = '<div class="col-12"><div class="loading"><div class="spinner"></div> Loading live matches...</div></div>';

            const response = await fetchFromAPI('/fixtures?live=all');
            if (!response) {
                container.innerHTML = '<div class="col-12"><div class="no-matches">⚠️ Failed to load data.</div></div>';
                return;
            }

            liveMatches = response;

            if (liveMatches.length === 0) {
                container.innerHTML = '<div class="col-12"><div class="no-matches">No live matches right now.</div></div>';
                return;
            }

            container.innerHTML = liveMatches.map(match => renderMatchCard(match)).join('');

            // تشغيل العدادات للمباريات المباشرة
            liveMatches.forEach(match => {
                startTimerForMatch(match.fixture.id, match.fixture.status.short);
            });

            // إضافة تفاعلات النقر
            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', function() {
                    const fixtureId = this.dataset.fixtureId;
                    openMatchDetails(fixtureId);
                });
            });
        }

        // ====== دالة فتح التفاصيل ======
        async function openMatchDetails(fixtureId) {
            const modal = document.getElementById('matchDetailModal');
            const content = document.getElementById('matchDetailContent');
            const title = document.getElementById('modalTitle');

            modal.classList.add('active');
            content.innerHTML = '<div class="loading"><div class="spinner"></div> Loading details...</div>';

            // جلب كل البيانات بالتوازي لسرعة العرض
            const [fixtures, events, stats, lineups] = await Promise.all([
                fetchFromAPI(`/fixtures?id=${fixtureId}`),
                fetchFromAPI(`/fixtures/events?fixture=${fixtureId}`),
                fetchFromAPI(`/fixtures/statistics?fixture=${fixtureId}`),
                fetchFromAPI(`/fixtures/lineups?fixture=${fixtureId}`)
            ]);

            const match = fixtures && fixtures[0];
            if (!match) {
                content.innerHTML = '<div class="no-matches">Match data not found.</div>';
                return;
            }

            title.textContent = `${match.teams.home.name} vs ${match.teams.away.name}`;
            
            let html = '';

            // 1. الأحداث (Events)
            html += '<div class="detail-section-title">⚽ Events</div>';
            if (events && events.length > 0) {
                // ترتيب الأحداث حسب الوقت
                const sortedEvents = events.sort((a, b) => a.time.elapsed - b.time.elapsed);
                html += sortedEvents.map(e => {
                    let icon = '⚽';
                    if (e.type === 'Card') icon = e.detail.includes('Yellow') ? '🟨' : '🟥';
                    else if (e.type === 'subst') icon = '🔄';
                    else if (e.type === 'Var') icon = '📺';
                    else if (e.type === 'Penalty') icon = '⚽ (PEN)';

                    const player = e.player?.name || 'Unknown';
                    const assist = e.assist?.name ? ` (Assist: ${e.assist.name})` : '';
                    const teamName = e.team?.name || '';
                    
                    return `<div class="event-row">
                        <div class="time">${e.time.elapsed}'</div>
                        <div class="icon">${icon}</div>
                        <div class="desc">${player} ${assist} <small style="color:var(--secondary)">(${teamName})</small></div>
                    </div>`;
                }).join('');
            } else {
                html += '<div class="no-matches" style="padding:10px;">No events yet.</div>';
            }

            // 2. الإحصائيات (Statistics)
            html += '<div class="detail-section-title">📊 Statistics</div>';
            if (stats && stats.length > 0) {
                const homeStats = stats.find(s => s.team.id === match.teams.home.id);
                const awayStats = stats.find(s => s.team.id === match.teams.away.id);
                
                if (homeStats && awayStats) {
                    const allKeys = {};
                    homeStats.statistics.forEach(s => { allKeys[s.type] = { home: s.value, away: null }; });
                    awayStats.statistics.forEach(s => {
                        if (allKeys[s.type]) allKeys[s.type].away = s.value;
                    });

                    const targetStats = ['Ball Possession', 'Total Shots', 'Shots on Goal', 'Fouls', 'Corner Kicks', 'Offsides'];
                    
                    html += targetStats.map(key => {
                        const data = allKeys[key];
                        if (!data) return '';
                        return `<div class="stat-item">
                            <span class="label">${key}</span>
                            <span><strong>${data.home}</strong> - <strong>${data.away}</strong></span>
                        </div>`;
                    }).join('');
                } else {
                    html += '<div class="no-matches" style="padding:10px;">No stats yet.</div>';
                }
            } else {
                html += '<div class="no-matches" style="padding:10px;">No stats yet.</div>';
            }

            // 3. التشكيلة (Lineups)
            html += '<div class="detail-section-title">👥 Lineups</div>';
            if (lineups && lineups.length > 0) {
                lineups.forEach(teamLineup => {
                    html += `<p style="font-weight:bold; margin-bottom:5px;">${teamLineup.team.name} (${teamLineup.formation})</p>`;
                    const starting = teamLineup.startXI || [];
                    if (starting.length > 0) {
                        html += `<div style="margin-bottom:8px;">${starting.map(p => `
                            <div class="player-item">
                                <span class="num">${p.player.number || ''}</span>
                                <span class="name">${p.player.name}</span>
                            </div>`).join('')}</div>`;
                    }
                    
                    const subs = teamLineup.substitutes || [];
                    if (subs.length > 0) {
                        html += `<small style="color:var(--secondary)">Substitutes:</small><div style="margin-bottom:10px;">${subs.map(p => `
                            <div class="player-item">
                                <span class="num">${p.player.number || ''}</span>
                                <span class="name">${p.player.name}</span>
                            </div>`).join('')}</div>`;
                    }
                });
            } else {
                html += '<div class="no-matches" style="padding:10px;">No lineups yet.</div>';
            }

            content.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('matchDetailModal').classList.remove('active');
        }

        function startLiveUpdates() {
            if (updateInterval) clearInterval(updateInterval);
            fetchLiveMatches();
            updateInterval = setInterval(fetchLiveMatches, 30000);
        }

        startLiveUpdates();
    </script>
</body>
</html>
