<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Score – API Sports</title>
    <!-- Bootstrap CSS (اختياري) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ====== أساسيات التصميم (مستخرجة من الكود السابق) ====== */
        :root {
            --primary: #0d6efd;
            --secondary: #6c757d;
            --success: #198754;
            --danger: #dc3545;
            --light-bg: #f0f2f5;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            --text-color: #1a1a2e;
            --border-color: #e8eaed;
            --live-dot: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .live-badge-header {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #dc3545;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 12px 4px 8px;
            border-radius: 24px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .match-card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            background: var(--card-bg);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }
        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            gap: 8px;
        }
        .team-col {
            flex: 1;
            text-align: center;
            min-width: 0;
        }
        .team-col img {
            width: 34px;
            height: 34px;
            object-fit: contain;
            background: var(--light-bg);
            border-radius: 6px;
            padding: 2px;
        }
        .team-col .team-title {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
            color: var(--text-color);
        }
        .center-col {
            width: 90px;
            flex-shrink: 0;
            text-align: center;
        }
        .score-big {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: -0.3px;
        }
        .live-badge {
            background: #dc3545;
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            border-radius: 10px;
            padding: 1px 8px;
            display: inline-block;
            margin-top: 1px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }
        .time-text {
            font-size: 11px;
            color: var(--text-color);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: var(--light-bg);
            padding: 1px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 2px;
        }
        .time-text .stoppage-badge {
            background: #dc3545;
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 0px 5px;
            border-radius: 8px;
            margin-left: 2px;
        }
        .timeline-container {
            width: 100%;
            height: 3px;
            background: var(--border-color);
            border-radius: 2px;
            position: relative;
            margin: 4px 0 3px;
        }
        .timeline-fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .ht-marker {
            position: absolute;
            top: -2px;
            width: 2px;
            height: 7px;
            background: #dc3545;
            left: 50%;
            border-radius: 2px;
        }
        .goal-marker {
            position: absolute;
            top: -3px;
            width: 8px;
            height: 8px;
            background: #f1c40f;
            border-radius: 50%;
            transform: translateX(-50%);
            border: 1px solid #fff;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.25);
            z-index: 2;
        }
        .match-footer {
            padding: 4px 14px 8px;
            text-align: center;
            font-size: 9px;
            color: var(--secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .match-footer img {
            width: 12px;
            height: 12px;
            object-fit: contain;
        }
        .match-footer .champ-title {
            font-weight: 600;
            color: var(--text-color);
        }
        .match-footer .separator {
            margin: 0 4px;
            color: var(--secondary);
        }
        .loading, .no-matches {
            text-align: center;
            padding: 30px;
            color: var(--secondary);
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(0,0,0,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="section-header">
            <div class="live-badge-header">
                <span class="live-dot"></span> LIVE
            </div>
            <h3>Live Matches</h3>
        </div>
        <div id="liveMatchesContainer" class="row g-2">
            <div class="col-12">
                <div class="loading"><div class="spinner"></div> Loading live matches...</div>
            </div>
        </div>
    </div>

    <script>
        // ====== إعدادات API ======
        const API_KEY = 'e227ff90ed4eacc3eacb07eca05ce78b'; // مفتاح API-Sports (يمكن وضعه من المستخدم)
        const API_BASE = 'https://v3.football.api-sports.io';
        const IMG_BASE_TEAM = 'https://media.api-sports.io/teams/'; // روابط الشعارات

        // ====== حالة التطبيق ======
        let liveMatches = [];
        let updateInterval = null;

        // ====== دالة مساعدة لجلب البيانات ======
        async function fetchFromAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.errors && Object.keys(data.errors).length > 0) {
                    throw new Error(JSON.stringify(data.errors));
                }
                return data.response;
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        // ====== دالة لتحويل الوقت إلى صيغة نصية ======
        function formatLiveTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        // ====== دالة لتحويل الحالة ======
        function getStatusInfo(statusShort) {
            switch (statusShort) {
                case '1H': return { label: '1st Half', live: true };
                case '2H': return { label: '2nd Half', live: true };
                case 'HT': return { label: 'Half Time', live: false };
                case 'FT': return { label: 'Full Time', live: false };
                case 'ET': return { label: 'Extra Time', live: true };
                case 'BT': return { label: 'Break Time', live: false };
                case 'PEN': return { label: 'Penalties', live: true };
                case 'NS': return { label: 'Upcoming', live: false };
                default: return { label: 'LIVE', live: true };
            }
        }

        // ====== دالة لبناء بطاقة مباراة ======
        function renderMatchCard(fixture) {
            const home = fixture.teams.home;
            const away = fixture.teams.away;
            const goalsHome = fixture.goals.home ?? '-';
            const goalsAway = fixture.goals.away ?? '-';
            const status = getStatusInfo(fixture.fixture.status.short);
            const elapsed = fixture.fixture.status.elapsed || 0;
            const league = fixture.league;
            const date = new Date(fixture.fixture.date);
            const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            // شريط التقدم
            let progress = 0;
            if (status.live) {
                if (fixture.fixture.status.short === '1H' || fixture.fixture.status.short === '2H') {
                    progress = Math.min((elapsed / 90) * 100, 100);
                } else if (fixture.fixture.status.short === 'ET') {
                    progress = Math.min(100, ((elapsed - 90) / 30) * 100);
                } else if (fixture.fixture.status.short === 'PEN') {
                    progress = 100;
                }
            } else if (status.label === 'Full Time') {
                progress = 100;
            } else if (status.label === 'Half Time') {
                progress = 50;
            }

            // نستخدم البطاقات المشابهة للتصميم المطلوب
            return `
                <div class="col-12 mb-2">
                    <div class="match-card" data-fixture-id="${fixture.fixture.id}">
                        <div class="match-row">
                            <div class="team-col">
                                <img src="${home.logo ? IMG_BASE_TEAM + home.id + '.png' : 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2734%27 height=%2734%27 viewBox=%270 0 34 34%27%3E%3Crect width=%2734%27 height=%2734%27 fill=%27%23ddd%27/%3E%3Ctext x=%275%27 y=%2720%27 font-family=%27sans-serif%27 font-size=%2712%27 fill=%27%23999%27%3E?%3C/text%3E%3C/svg%3E'}" 
                                    onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2734%27 height=%2734%27 viewBox=%270 0 34 34%27%3E%3Crect width=%2734%27 height=%2734%27 fill=%27%23ddd%27/%3E%3Ctext x=%275%27 y=%2720%27 font-family=%27sans-serif%27 font-size=%2712%27 fill=%27%23999%27%3E?%3C/text%3E%3C/svg%3E'" 
                                    alt="${home.name}" />
                                <div class="team-title">${home.name}</div>
                            </div>
                            <div class="center-col">
                                <div class="score-big">${goalsHome} - ${goalsAway}</div>
                                ${status.live ? `<div class="live-badge">${status.label}</div>` : ''}
                                ${status.live ? `<div class="time-text">${formatLiveTime(elapsed * 60)}</div>` : '<div class="time-text">' + status.label + '</div>'}
                                <div class="timeline-container">
                                    <div class="timeline-fill" style="width:${progress}%"></div>
                                    ${status.label === 'Half Time' ? '<div class="ht-marker"></div>' : ''}
                                </div>
                            </div>
                            <div class="team-col">
                                <img src="${away.logo ? IMG_BASE_TEAM + away.id + '.png' : 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2734%27 height=%2734%27 viewBox=%270 0 34 34%27%3E%3Crect width=%2734%27 height=%2734%27 fill=%27%23ddd%27/%3E%3Ctext x=%275%27 y=%2720%27 font-family=%27sans-serif%27 font-size=%2712%27 fill=%27%23999%27%3E?%3C/text%3E%3C/svg%3E'}" 
                                    onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2734%27 height=%2734%27 viewBox=%270 0 34 34%27%3E%3Crect width=%2734%27 height=%2734%27 fill=%27%23ddd%27/%3E%3Ctext x=%275%27 y=%2720%27 font-family=%27sans-serif%27 font-size=%2712%27 fill=%27%23999%27%3E?%3C/text%3E%3C/svg%3E'" 
                                    alt="${away.name}" />
                                <div class="team-title">${away.name}</div>
                            </div>
                        </div>
                        <div class="match-footer">
                            <span class="champ-title">${league.name}</span>
                            <span class="separator">|</span>
                            <span>${dateStr} ${timeStr}</span>
                        </div>
                    </div>
                </div>`;
        }

        // ====== دالة لجلب المباريات المباشرة ======
        async function fetchLiveMatches() {
            const container = document.getElementById('liveMatchesContainer');
            container.innerHTML = '<div class="col-12"><div class="loading"><div class="spinner"></div> Loading live matches...</div></div>';

            const response = await fetchFromAPI('/fixtures?live=all');
            if (!response) {
                container.innerHTML = '<div class="col-12"><div class="no-matches">⚠️ Failed to load data. Check API key or connection.</div></div>';
                return;
            }

            liveMatches = response; // المباريات المباشرة

            if (liveMatches.length === 0) {
                container.innerHTML = '<div class="col-12"><div class="no-matches">No live matches right now.</div></div>';
                return;
            }

            // بناء البطاقات
            container.innerHTML = liveMatches.map(match => renderMatchCard(match)).join('');

            // إضافة تفاعلات النقر (اختياري لفتح تفاصيل)
            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', function() {
                    const fixtureId = this.dataset.fixtureId;
                    alert('Match details feature not implemented (fixture ID: ' + fixtureId + ')');
                });
            });
        }

        // ====== دالة التحديث المستمر ======
        function startLiveUpdates() {
            if (updateInterval) clearInterval(updateInterval);
            // تحديث أولي ثم كل 30 ثانية
            fetchLiveMatches();
            updateInterval = setInterval(fetchLiveMatches, 30000);
        }

        // ====== تهيئة التطبيق ======
        startLiveUpdates();
    </script>
</body>
</html>
