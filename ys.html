<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Score – Flashscore Style</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --secondary: #6c757d;
            --success: #198754;
            --danger: #dc3545;
            --light-bg: #f0f2f5;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            --text-color: #1a1a2e;
            --border-color: #e8eaed;
            --live-dot: #ef4444;
            --home-color: #e91e63; 
            --away-color: #1e88e5; 
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light-bg); color: var(--text-color); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .live-badge-header { display: flex; align-items: center; gap: 6px; background: #dc3545; color: #fff; font-size: 14px; font-weight: 700; padding: 4px 12px 4px 8px; border-radius: 24px; }
        .live-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: blink 1.2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .match-card { border: none; border-radius: var(--border-radius); box-shadow: var(--shadow); background: var(--card-bg); transition: transform 0.15s; cursor: pointer; overflow: hidden; margin-bottom: 15px; }
        .match-card:hover { transform: translateY(-2px); }
        .match-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; gap: 8px; }
        .team-col { flex: 1; text-align: center; min-width: 0; }
        .team-col img { width: 40px; height: 40px; object-fit: contain; background: var(--light-bg); border-radius: 6px; padding: 2px; }
        .team-col .team-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; color: var(--text-color); }
        .center-col { width: 90px; flex-shrink: 0; text-align: center; }
        .score-big { font-size: 20px; font-weight: 800; color: var(--text-color); }
        .score-pen { font-size: 14px; font-weight: 700; color: #ff9800; margin-top: 2px; }
        
        /* ألوان الحالات الجديدة */
        .status-live { background: #dc3545; color: #fff; }
        .status-ht { background: #ffc107; color: #000; }
        .status-ft { background: #28a745; color: #fff; }
        .status-pen { background: #ff9800; color: #fff; }
        .status-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 12px; display: inline-block; margin-top: 2px; }

        .time-text { font-size: 11px; color: var(--text-color); font-weight: 700; background: var(--light-bg); padding: 2px 8px; border-radius: 12px; display: inline-block; margin-top: 4px; }
        .time-text .stoppage-badge { background: #dc3545; color: #fff; font-size: 8px; font-weight: 700; padding: 0px 5px; border-radius: 8px; margin-left: 2px; }

        .timeline-container { width: 100%; height: 4px; background: #ddd; border-radius: 2px; position: relative; margin: 5px 0; }
        .timeline-fill { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); border-radius: 2px; }

        .match-footer { padding: 6px 14px; text-align: center; font-size: 10px; color: var(--secondary); border-top: 1px solid var(--border-color); }

        /* Modal & Pitch View */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 9999; display: none; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content-box { background: var(--card-bg); width: 95%; max-width: 700px; border-radius: 16px; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; }
        .modal-close { position: absolute; top: 10px; right: 15px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
        
        /* الهيدر داخل المودال */
        .match-header-modal { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .match-header-modal .team { display: flex; flex-direction: column; align-items: center; width: 30%; }
        .match-header-modal img { width: 50px; height: 50px; }
        .match-header-modal .mid { text-align: center; width: 40%; }
        .match-header-modal .score { font-size: 28px; font-weight: 800; }
        .match-header-modal .pen-score { font-size: 14px; font-weight: 700; color: #ff9800; }

        .detail-section-title { font-size: 16px; font-weight: 700; margin-top: 20px; margin-bottom: 10px; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; }
        
        /* أحداث المباراة الملوّنة */
        .event-goal { color: #28a745; font-weight: bold; }
        .event-red { color: #dc3545; font-weight: bold; }
        .event-yellow { color: #ffc107; font-weight: bold; }
        .event-sub { color: #17a2b8; font-weight: bold; }
        .timeline-divider { background: #f0f2f5; text-align: center; padding: 8px; margin: 10px 0; font-weight: bold; border-radius: 4px; }
        .timeline-divider.ft { background: #d4edda; color: #155724; }
        .timeline-divider.ht { background: #fff3cd; color: #856404; }
        .timeline-divider.pen { background: #ffe5b4; color: #e65100; }

        /* تصميم ملعب كرة القدم */
        .football-pitch { width: 100%; height: 250px; background: #2e7d32; position: relative; border: 2px solid white; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .pitch-line { position: absolute; border: 2px solid rgba(255,255,255,0.5); }
        .halfway { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
        .center-circle { top: 50%; left: 50%; width: 60px; height: 60px; border-radius: 50%; transform: translate(-50%, -50%); }
        .player-on-pitch { position: absolute; transform: translate(-50%, -50%); text-align: center; color: white; font-size: 9px; }
        .player-on-pitch img { width: 30px; height: 30px; background: white; border-radius: 50%; padding: 2px; border: 2px solid #fff; }
        
        .coach-section, .subs-section, .injuries-section { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="section-header">
            <div class="live-badge-header"><span class="live-dot"></span> LIVE</div>
            <h3>Live Matches</h3>
        </div>
        <div id="liveMatchesContainer" class="row g-2"></div>
    </div>

    <div class="modal-overlay" id="matchDetailModal">
        <div class="modal-content-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="matchDetailContent"></div>
        </div>
    </div>

    <script>
        const API_KEY = 'e227ff90ed4eacc3eacb07eca05ce78b';
        const API_BASE = 'https://v3.football.api-sports.io';
        let timers = {};

        async function fetchFromAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'GET', headers: { 'x-apisports-key': API_KEY }
                });
                const data = await response.json();
                return data.response;
            } catch (error) { console.error(error); return null; }
        }

        function getStatusInfo(statusShort) {
            switch (statusShort) {
                case '1H': case '2H': case 'ET': return { label: 'LIVE', color: 'live' };
                case 'HT': return { label: 'HT', color: 'ht' };
                case 'FT': return { label: 'FT', color: 'ft' };
                case 'PEN': return { label: 'PEN', color: 'pen' };
                case 'NS': return { label: 'Upcoming', color: 'live' }; // temporary
                default: return { label: statusShort || 'LIVE', color: 'live' };
            }
        }

        function renderMatchCard(fixture) {
            const home = fixture.teams.home;
            const away = fixture.teams.away;
            const statusInfo = getStatusInfo(fixture.fixture.status.short);
            const isLive = ['1H', '2H', 'ET'].includes(fixture.fixture.status.short);
            
            let timeDisplay = fixture.fixture.status.elapsed ? `${fixture.fixture.status.elapsed}'` : '';
            if (fixture.fixture.status.short === 'FT') timeDisplay = 'FT';
            if (fixture.fixture.status.short === 'HT') timeDisplay = 'HT';
            if (fixture.fixture.status.short === 'PEN') timeDisplay = 'PEN';

            let penaltyHtml = '';
            if (fixture.score && fixture.score.penalty && (fixture.score.penalty.home !== null)) {
                penaltyHtml = `<div class="score-pen">(PEN ${fixture.score.penalty.home} - ${fixture.score.penalty.away})</div>`;
            }

            let progress = isLive ? Math.min((fixture.fixture.status.elapsed / 90) * 100, 100) : (fixture.fixture.status.short === 'HT' ? 50 : 100);

            return `
                <div class="match-card" data-fixture-id="${fixture.fixture.id}">
                    <div class="match-row">
                        <div class="team-col">
                            <img src="${home.logo || 'data:image/svg+xml,...'}" onerror="this.src='data:image/svg+xml,...'" />
                            <div class="team-title">${home.name}</div>
                        </div>
                        <div class="center-col">
                            <div class="score-big">${fixture.goals.home ?? '-'} - ${fixture.goals.away ?? '-'}</div>
                            ${penaltyHtml}
                            <div class="status-badge status-${statusInfo.color}">${statusInfo.label}</div>
                            <div class="time-text">${timeDisplay}</div>
                            <div class="timeline-container"><div class="timeline-fill" style="width:${progress}%"></div></div>
                        </div>
                        <div class="team-col">
                            <img src="${away.logo || 'data:image/svg+xml,...'}" onerror="this.src='data:image/svg+xml,...'" />
                            <div class="team-title">${away.name}</div>
                        </div>
                    </div>
                    <div class="match-footer">${fixture.league.name} • ${fixture.fixture.date.substring(11,16)}</div>
                </div>`;
        }

        async function fetchLiveMatches() {
            const container = document.getElementById('liveMatchesContainer');
            container.innerHTML = '<div class="col-12">Loading...</div>';
            const response = await fetchFromAPI('/fixtures?live=all');
            if (!response || response.length === 0) { container.innerHTML = '<div class="col-12">No live matches right now.</div>'; return; }

            container.innerHTML = response.map(match => renderMatchCard(match)).join('');

            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', () => openMatchDetails(card.dataset.fixtureId));
            });
        }

        async function openMatchDetails(fixtureId) {
            const modal = document.getElementById('matchDetailModal');
            const content = document.getElementById('matchDetailContent');
            modal.classList.add('active');
            content.innerHTML = 'Loading...';

            const [fixtures, events, stats, lineups] = await Promise.all([
                fetchFromAPI(`/fixtures?id=${fixtureId}`),
                fetchFromAPI(`/fixtures/events?fixture=${fixtureId}`),
                fetchFromAPI(`/fixtures/statistics?fixture=${fixtureId}`),
                fetchFromAPI(`/fixtures/lineups?fixture=${fixtureId}`)
            ]);

            if (!fixtures || !fixtures[0]) return;
            const match = fixtures[0];
            const statusInfo = getStatusInfo(match.fixture.status.short);

            // هيدر المباراة
            let penaltyHtml = '';
            if (match.score && match.score.penalty && match.score.penalty.home !== null) {
                penaltyHtml = `<div class="pen-score">Penalties: ${match.score.penalty.home} - ${match.score.penalty.away}</div>`;
            }

            let headerHtml = `
                <div class="match-header-modal">
                    <div class="team">
                        <img src="${match.teams.home.logo}" />
                        <b>${match.teams.home.name}</b>
                    </div>
                    <div class="mid">
                        <div class="score">${match.goals.home ?? 0} - ${match.goals.away ?? 0}</div>
                        <div class="status-badge status-${statusInfo.color}">${statusInfo.label}</div>
                        ${penaltyHtml}
                    </div>
                    <div class="team">
                        <img src="${match.teams.away.logo}" />
                        <b>${match.teams.away.name}</b>
                    </div>
                </div>
                <div class="detail-section-title">⚽ Events & Timeline</div>`;

            // الأحداث الملوّنة
            let eventsHtml = '';
            if (events && events.length > 0) {
                const sortedEvents = events.sort((a, b) => a.time.elapsed - b.time.elapsed);
                let lastPeriod = '1H';
                let goalsHome = 0, goalsAway = 0;
                
                sortedEvents.forEach(e => {
                    const minute = e.time.elapsed;
                    let currentPeriod = minute > 90 ? 'ET' : (minute > 45 ? '2H' : '1H');

                    if (currentPeriod !== lastPeriod) {
                        if (lastPeriod === '1H' && currentPeriod === '2H') {
                            eventsHtml += `<div class="timeline-divider ht">HALF TIME ( ${goalsHome} - ${goalsAway} )</div>`;
                        } else if (lastPeriod === '2H' && currentPeriod === 'ET') {
                            eventsHtml += `<div class="timeline-divider ft">FULL TIME ( ${goalsHome} - ${goalsAway} )</div>`;
                            eventsHtml += `<div class="timeline-divider pen">EXTRA TIME</div>`;
                        }
                        lastPeriod = currentPeriod;
                    }

                    // تحديد الأيقونة و اللون
                    let icon = '';
                    let colorClass = 'event-neutral';
                    if (e.type === 'Goal') { 
                        icon = '⚽'; colorClass = 'event-goal'; 
                        if (e.team.id === match.teams.home.id) goalsHome++; else goalsAway++;
                    }
                    else if (e.type === 'Card') {
                        if (e.detail === 'Yellow Card') { icon = '🟨'; colorClass = 'event-yellow'; }
                        else if (e.detail === 'Red Card') { icon = '🟥'; colorClass = 'event-red'; }
                    }
                    else if (e.type === 'subst') { icon = '🔁'; colorClass = 'event-sub'; }
                    else if (e.type === 'Var') { icon = '🖥️'; }
                    else if (e.type === 'Pen') { icon = '⚽'; colorClass = 'event-goal'; }

                    eventsHtml += `
                        <div class="d-flex justify-content-between border-bottom py-2">
                            <span class="fw-bold">${minute}'</span>
                            <span class="${colorClass}">${icon} ${e.player?.name || ''}</span>
                            <small class="text-muted">${e.detail ? e.detail : ''}</small>
                        </div>`;
                });

                if (match.fixture.status.short === 'FT' && lastPeriod === '2H') {
                    eventsHtml += `<div class="timeline-divider ft">FULL TIME ( ${goalsHome} - ${goalsAway} )</div>`;
                } else if (match.fixture.status.short === 'PEN' && lastPeriod === 'ET') {
                    eventsHtml += `<div class="timeline-divider pen">PENALTIES</div>`;
                }
            } else {
                eventsHtml = '<div class="text-center text-muted">No events yet.</div>';
            }

            // الإحصائيات
            let statsHtml = '<div class="detail-section-title">📊 Statistics</div>';
            if (stats && stats.length > 0) {
                const homeStats = stats.find(s => s.team.id === match.teams.home.id);
                const awayStats = stats.find(s => s.team.id === match.teams.away.id);
                
                if (homeStats && awayStats) {
                    const map = {};
                    homeStats.statistics.forEach(s => map[s.type] = { home: s.value, away: awayStats.statistics.find(a => a.type === s.type)?.value || 0 });

                    let groups = {
                        'Possession & Shots': ['Ball Possession', 'Total Shots', 'Shots on Goal', 'Shots off Goal', 'Blocked Shots'],
                        'Attacks': ['Corner Kicks', 'Free Kicks', 'Fouls', 'Offsides', 'Yellow Cards']
                    };

                    for (const [group, keys] of Object.entries(groups)) {
                        statsHtml += `<div class="fw-bold mt-3 mb-2">${group}</div>`;
                        keys.forEach(k => {
                            let h = map[k]?.home || 0;
                            let a = map[k]?.away || 0;
                            let hPct = 50, aPct = 50;
                            if (k.includes('%')) { hPct = parseFloat(h); aPct = 100 - hPct; }
                            else { let total = parseFloat(h) + parseFloat(a); if (total > 0) { hPct = (h / total) * 100; aPct = 100 - hPct; } }

                            statsHtml += `
                            <div class="d-flex align-items-center py-2">
                                <div class="flex-fill text-end fw-bold">${h}</div>
                                <div class="flex-grow-1 px-3">
                                    <div class="d-flex justify-content-center mb-1"><small>${k}</small></div>
                                    <div class="progress" style="height: 5px;">
                                        <div class="progress-bar bg-danger" style="width:${hPct}%"></div>
                                        <div class="progress-bar bg-primary" style="width:${aPct}%"></div>
                                    </div>
                                </div>
                                <div class="flex-fill fw-bold">${a}</div>
                            </div>`;
                        });
                    }
                } else { statsHtml += '<div class="text-center text-muted">No stats yet.</div>'; }
            } else { statsHtml += '<div class="text-center text-muted">No stats yet.</div>'; }

            // التشكيلة (Pitch View)
            let lineupHtml = '<div class="detail-section-title">👥 Lineups</div>';
            if (lineups && lineups.length > 0) {
                lineups.forEach(teamLineup => {
                    // خريطة ملعب بسيطة (4-3-3 تقريباً)
                    let playersHtml = '';
                    let gridX = [10, 50, 90, 20, 50, 80, 10, 50, 90, 50];
                    let gridY = [50, 50, 50, 20, 20, 20, 10, 10, 10, 10]; // مبسطة

                    (teamLineup.startXI || []).forEach((p, index) => {
                        let x = gridX[index] || 50;
                        let y = gridY[index] || 30;
                        playersHtml += `
                            <div class="player-on-pitch" style="left:${x}%; top:${y}%">
                                <img src="${p.player.photo || ''}" onerror="this.style.display='none'"/>
                                <div>${p.player.name.split(' ').pop()}</div>
                            </div>`;
                    });

                    lineupHtml += `
                        <div class="fw-bold mt-3">${teamLineup.team.name} (${teamLineup.formation})</div>
                        <div class="football-pitch">
                            <div class="pitch-line halfway"></div>
                            <div class="pitch-line center-circle"></div>
                            <div class="pitch-line" style="left:0; top:0; width:30px; height:30px; border-right:none; border-bottom:none;"></div>
                            ${playersHtml}
                        </div>
                        <div class="coach-section"><b>Coach:</b> ${teamLineup.coach?.name || 'Unknown'}</div>
                        <div class="subs-section"><b>Substitutes:</b> ${(teamLineup.substitutes || []).map(p => p.player.name).join(', ')}</div>
                    `;
                });
            } else { lineupHtml += '<div class="text-center text-muted">No lineups yet.</div>'; }

            content.innerHTML = headerHtml + eventsHtml + statsHtml + lineupHtml;
        }

        function closeModal() { document.getElementById('matchDetailModal').classList.remove('active'); }

        fetchLiveMatches();
        setInterval(fetchLiveMatches, 30000);
    </script>
</body>
</html>
