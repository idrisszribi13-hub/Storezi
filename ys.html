                YS<span>Scores</span>
            </div>
            <div class="date-nav">
                <button id="prevDay" aria-label="Previous day">‹</button>
                <span class="date-display" id="dateDisplay"></span>
                <button id="nextDay" aria-label="Next day">›</button>
                <button class="today-btn" id="todayBtn">Today</button>
            </div>
        </header>

        <!-- ============================================================
        TAB BAR
        ============================================================ -->
        <nav class="tab-bar" id="tabBar">
            <button class="active" data-tab="matches">
                <span class="tab-icon">⚽</span> Matches
            </button>
            <button data-tab="news">
                <span class="tab-icon">📰</span> News
            </button>
            <button data-tab="transfers">
                <span class="tab-icon">🔄</span> Transfers
            </button>
            <button data-tab="standings">
                <span class="tab-icon">🏆</span> Standings
            </button>
        </nav>

        <!-- ============================================================
        TAB: MATCHES
        ============================================================ -->
        <div class="tab-content active" id="tab-matches">
            <div id="matchesContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>Loading matches...</div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        TAB: NEWS
        ============================================================ -->
        <div class="tab-content" id="tab-news">
            <div id="newsContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>Loading news...</div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        TAB: TRANSFERS
        ============================================================ -->
        <div class="tab-content" id="tab-transfers">
            <div id="transfersContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>Loading transfers...</div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        TAB: STANDINGS
        ============================================================ -->
        <div class="tab-content" id="tab-standings">
            <div id="standingsContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>Loading leagues...</div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        DETAIL VIEW (Match Overlay)
        ============================================================ -->
        <div class="detail-view" id="detailView">
            <button class="back-btn" id="detailBackBtn">← Back</button>
            <div id="detailContent">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>Loading details...</div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        NEWS DETAIL (Modal)
        ============================================================ -->
        <div class="news-detail-overlay" id="newsDetailOverlay">
            <div class="news-detail-box">
                <button class="close-btn" id="newsDetailClose">✕</button>
                <div id="newsDetailContent">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <div>Loading...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        DATE PICKER (Modal)
        ============================================================ -->
        <div class="date-picker-overlay" id="datePickerOverlay">
            <div class="date-picker-box">
                <button class="close-btn" id="datePickerClose">✕</button>
                <div class="picker-title">📅 Select Date</div>
                <input type="date" id="datePickerInput" />
                <button class="confirm-btn" id="datePickerConfirm">Confirm</button>
            </div>
        </div>

    </div>

    <script>
        (function() {
            "use strict";

            // ============================================================
            // CONFIG
            // ============================================================
            const WORKER_URL = 'https://dry-truth-a84e.idriss-zribi13.workers.dev/';
            const BASE_API = 'https://api-en.ysscores.com/api/';
            const NEWS_API = 'https://news-en.ysscores.com/api/';
            const IMG_BASE = 'https://imgs.ysscores.com/';
            const IMG_TEAMS = IMG_BASE + 'teams/64/';
            const IMG_CHAMPIONSHIP = IMG_BASE + 'championship/cups/';
            const IMG_PLAYERS = IMG_BASE + 'players/';
            const IMG_NEWS = IMG_BASE + 'news/';

            const LEAGUE_IDS = [
                '938652', '941825', '937599', '938769',
                '936357', '937873', '937348', '938426'
            ];

            // ============================================================
            // STATE
            // ============================================================
            let currentDate = new Date();
            let currentTab = 'matches';
            let newsCurrentPage = 1;
            let newsTotalPages = 1;

            // ============================================================
            // DOM REFS
            // ============================================================
            const dateDisplay = document.getElementById('dateDisplay');
            const matchesContainer = document.getElementById('matchesContainer');
            const newsContainer = document.getElementById('newsContainer');
            const transfersContainer = document.getElementById('transfersContainer');
            const standingsContainer = document.getElementById('standingsContainer');
            const detailView = document.getElementById('detailView');
            const detailContent = document.getElementById('detailContent');
            const datePickerOverlay = document.getElementById('datePickerOverlay');
            const datePickerInput = document.getElementById('datePickerInput');
            const newsDetailOverlay = document.getElementById('newsDetailOverlay');
            const newsDetailContent = document.getElementById('newsDetailContent');

            // ============================================================
            // UTILITY FUNCTIONS
            // ============================================================
            function formatDate(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }

            function formatDateDisplay(d) {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                return d.toLocaleDateString('en-US', options);
            }

            function getImageUrl(path, type) {
                if (!path) return '';
                if (path.startsWith('http')) return path;
                if (type === 'team') return IMG_TEAMS + path;
                if (type === 'championship') return IMG_CHAMPIONSHIP + path;
                if (type === 'player') return IMG_PLAYERS + path;
                if (type === 'news') return IMG_NEWS + path;
                return path;
            }

            function getDefaultPlayerImage() {
                return 'https://ui-avatars.com/api/?name=Player&background=4c8bf5&color=fff&size=60';
            }

            function fetchAPI(endpoint) {
                const url = WORKER_URL + '?url=' + encodeURIComponent(BASE_API + endpoint);
                return fetch(url).then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                });
            }

            function fetchNewsAPI(endpoint) {
                const url = WORKER_URL + '?url=' + encodeURIComponent(NEWS_API + endpoint);
                return fetch(url).then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                });
            }

            function getStatusText(status) {
                if (status === 0) return 'Upcoming';
                if (status === 1) return 'Live';
                if (status === 2 || status === 4) return 'Finished';
                return 'Unknown';
            }

            function getStatusClass(status) {
                if (status === 1) return 'live';
                if (status === 2 || status === 4) return 'finished';
                return 'upcoming';
            }

            // ============================================================
            // LOAD MATCHES
            // ============================================================
            async function loadMatches(date) {
                const dateStr = formatDate(date);
                const ids = LEAGUE_IDS.map(id => `"${id}"`).join(',');
                const endpoint = `matches/matches_date_get/${dateStr}/[${ids}]/[]/[]/L/60`;

                try {
                    const data = await fetchAPI(endpoint);
                    if (!data.status || data.data.length === 0) {
                        matchesContainer.innerHTML =
                            `<div class="empty-state">No matches available for this date</div>`;
                        return;
                    }
                    renderMatches(data.data);
                } catch (error) {
                    matchesContainer.innerHTML = `<div class="error-state">⚠️ ${error.message}</div>`;
                }
            }

            function renderMatches(matches) {
                const groups = {};
                matches.forEach(m => {
                    const comp = m.championship || {};
                    const compId = comp.url_id || comp.id || 'unknown';
                    if (!groups[compId]) {
                        groups[compId] = {
                            id: compId,
                            title: comp.title || 'Unknown League',
                            image: comp.image || '',
                            matches: []
                        };
                    }
                    groups[compId].matches.push(m);
                });

                let html = '<div class="matches-list">';
                Object.values(groups).forEach(group => {
                    html += `<div class="league-group">
                        <div class="league-header">
                            <img src="${getImageUrl(group.image, 'championship')}" onerror="this.style.display='none'">
                            <span class="name">${group.title}</span>
                            <span class="count">${group.matches.length}</span>
                        </div>`;
                    group.matches.forEach(m => {
                        const home = m.home_team || {};
                        const away = m.away_team || {};
                        const homeLogo = getImageUrl(home.image, 'team');
                        const awayLogo = getImageUrl(away.image, 'team');
                        const statusText = getStatusText(m.status);
                        const statusClass = getStatusClass(m.status);
                        const score = (m.status === 0) ? 'VS' :
                            `${m.home_scores ?? 0} - ${m.away_scores ?? 0}`;
                        const time = m.match_time ? m.match_time.slice(0, 5) : '';
                        html += `
                            <div class="match-item" data-match-id="${m.match_id}">
                                <div class="teams">
                                    <img src="${homeLogo}" onerror="this.style.display='none'">
                                    <span class="team-name">${home.title || 'Home'}</span>
                                    <span class="vs">vs</span>
                                    <img src="${awayLogo}" onerror="this.style.display='none'">
                                    <span class="team-name">${away.title || 'Away'}</span>
                                </div>
                                <div class="match-info">
                                    <span class="score">${score}</span>
                                    <span class="status ${statusClass}">${statusText}</span>
                                    <span class="time">${time}</span>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                });
                html += '</div>';
                matchesContainer.innerHTML = html;

                document.querySelectorAll('.match-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.matchId;
                        if (id) showMatchDetail(id);
                    });
                });
            }

            // ============================================================
            // MATCH DETAIL
            // ============================================================
            async function showMatchDetail(matchId) {
                detailView.classList.add('visible');
                detailContent.innerHTML =
                    `<div class="loading-state"><div class="spinner"></div><div>Loading details...</div></div>`;

                try {
                    const infoData = await fetchAPI(`matches/match_info/${matchId}/L/60`);
                    if (!infoData.status) throw new Error('Failed to load match info');
                    const match = infoData.data;

                    let standingData = null;
                    try {
                        const sData = await fetchAPI(
                        `matches/league_standing_stage/${match.championship_id}`);
                        if (sData.status) standingData = sData.data;
                    } catch (e) {}

                    let lineupData = null;
                    try {
                        const lData = await fetchAPI(`matches/matches_lineup/${matchId}`);
                        if (lData.status) lineupData = lData.data;
                    } catch (e) {}

                    let eventsData = null;
                    try {
                        const eData = await fetchAPI(`matches/matches_event/${matchId}`);
                        if (eData.status) eventsData = eData.data;
                    } catch (e) {}

                    let statsData = null;
                    try {
                        const stData = await fetchAPI(`matches/statics_match/${matchId}`);
                        if (stData.status) statsData = stData.data;
                    } catch (e) {}

                    renderMatchDetail(match, standingData, lineupData, eventsData, statsData);

                } catch (error) {
                    detailContent.innerHTML = `<div class="error-state">⚠️ ${error.message}</div>`;
                }
            }

            function renderMatchDetail(match, standingData, lineupData, eventsData, statsData) {
                const home = match.home_team_info || match.home_team || {};
                const away = match.away_team_info || match.away_team || {};
                const homeLogo = getImageUrl(home.image, 'team');
                const awayLogo = getImageUrl(away.image, 'team');
                const champ = match.championship || {};
                const statusText = getStatusText(match.status);
                const score = (match.status === 0) ? 'VS' :
                    `${match.home_scores ?? 0} - ${match.away_scores ?? 0}`;
                const round = match.round || '';
                const stadium = match.Stadium || 'N/A';
                const channel = (match.channel_commm && match.channel_commm.length > 0) ? match.channel_commm[0]
                    .channel_name : 'N/A';
                const commentator = (match.channel_commm && match.channel_commm.length > 0) ? match.channel_commm[0]
                    .commentator_name : 'N/A';
                const referee = match.referees ? match.referees.title : 'N/A';
                const matchTime = match.match_time || '';
                const matchDate = match.match_date || '';
                const homeCoach = match.home_coach ? match.home_coach.title : '';
                const awayCoach = match.away_coach ? match.away_coach.title : '';
                const homeFormation = match.home_formation || '';
                const awayFormation = match.away_formation || '';

                let html = `
                    <div class="detail-header">
                        <div class="league">${champ.title || 'League'} ${round ? '• ' + round : ''}</div>
                        <div class="teams">
                            <div class="team">
                                <img src="${homeLogo}" onerror="this.style.display='none'">
                                <span class="name">${home.title || 'Home'}</span>
                            </div>
                            <div class="score-box">
                                <div class="score">${score}</div>
                                <div class="status">${statusText}</div>
                            </div>
                            <div class="team">
                                <span class="name">${away.title || 'Away'}</span>
                                <img src="${awayLogo}" onerror="this.style.display='none'">
                            </div>
                        </div>
                    </div>
                    <div class="detail-meta">
                        <div><span class="label">🏟️ Stadium:</span> <span class="value">${stadium}</span></div>
                        <div><span class="label">📺 Channel:</span> <span class="value">${channel}</span></div>
                        <div><span class="label">🎙️ Commentator:</span> <span class="value">${commentator}</span></div>
                        <div><span class="label">👨‍⚖️ Referee:</span> <span class="value">${referee}</span></div>
                        <div><span class="label">🕐 Time:</span> <span class="value">${matchTime}</span></div>
                        <div><span class="label">📆 Date:</span> <span class="value">${matchDate}</span></div>
                        ${homeCoach ? `<div><span class="label">🧑‍🏫 Coach ${home.title}:</span> <span class="value">${homeCoach}</span></div>` : ''}
                        ${awayCoach ? `<div><span class="label">🧑‍🏫 Coach ${away.title}:</span> <span class="value">${awayCoach}</span></div>` : ''}
                        ${homeFormation ? `<div><span class="label">📐 Formation ${home.title}:</span> <span class="value">${homeFormation}</span></div>` : ''}
                        ${awayFormation ? `<div><span class="label">📐 Formation ${away.title}:</span> <span class="value">${awayFormation}</span></div>` : ''}
                    </div>
                `;

                // Tabs
                html += `
                    <div class="detail-tabs" id="detailTabs">
                        <button class="active" data-dtab="overview">📋 Overview</button>
                        <button data-dtab="standings">📊 Standings</button>
                        <button data-dtab="lineups">👥 Lineups</button>
                        <button data-dtab="events">⚡ Events</button>
                        <button data-dtab="stats">📈 Stats</button>
                        <button data-dtab="last5">📋 Last 5</button>
                        <button data-dtab="h2h">⚔️ H2H</button>
                        <button data-dtab="videos">🎥 Videos</button>
                    </div>
                `;

                // Overview
                html += `<div class="detail-tab-content active" id="dtab-overview">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px 0;font-size:12px;">
                        <div><span class="label">🏆 League:</span> ${champ.title || 'N/A'}</div>
                        <div><span class="label">📋 Round:</span> ${round || 'N/A'}</div>
                        <div><span class="label">🏟️ Stadium:</span> ${stadium}</div>
                        <div><span class="label">📺 Channel:</span> ${channel}</div>
                        <div><span class="label">🎙️ Commentator:</span> ${commentator}</div>
                        <div><span class="label">👨‍⚖️ Referee:</span> ${referee}</div>
                        <div><span class="label">🕐 Time:</span> ${matchTime}</div>
                        <div><span class="label">📆 Date:</span> ${matchDate}</div>
                    </div>
                </div>`;

                // Standings
                html += `<div class="detail-tab-content" id="dtab-standings">${renderStandings(standingData, champ)}</div>`;

                // Lineups (مع صور اللاعبين)
                html += `<div class="detail-tab-content" id="dtab-lineups">${renderLineups(lineupData, home, away)}</div>`;

                // Events
                html += `<div class="detail-tab-content" id="dtab-events">${renderEvents(eventsData, home, away)}</div>`;

                // Stats
                html += `<div class="detail-tab-content" id="dtab-stats">${renderStats(statsData, home, away)}</div>`;

                // Last 5
                html += `<div class="detail-tab-content" id="dtab-last5">${renderLast5(match, home, away)}</div>`;

                // H2H
                html += `<div class="detail-tab-content" id="dtab-h2h">${renderH2H(match, home, away)}</div>`;

                // Videos
                html += `<div class="detail-tab-content" id="dtab-videos">${renderVideos(match)}</div>`;

                detailContent.innerHTML = html;

                document.querySelectorAll('#detailTabs button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#detailTabs button').forEach(b => b.classList.remove(
                        'active'));
                        this.classList.add('active');
                        const tab = this.dataset.dtab;
                        document.querySelectorAll('.detail-tab-content').forEach(el => el.classList.remove(
                            'active'));
                        const target = document.getElementById('dtab-' + tab);
                        if (target) target.classList.add('active');
                    });
                });
            }

            // ============================================================
            // STANDINGS
            // ============================================================
            function renderStandings(data, champ) {
                if (!data || !data.league || !data.league.stage0) {
                    return '<div class="empty-state">No standings data available</div>';
                }
                const teams = data.league.stage0;
                if (teams.length === 0) return '<div class="empty-state">No teams found</div>';

                let html = `<table class="standings-table">
                    <thead><tr>
                        <th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GD</th><th>Pts</th>
                    </tr></thead><tbody>`;
                teams.slice(0, 14).forEach((t, idx) => {
                    const team = t.team_name || {};
                    const logo = getImageUrl(team.image, 'team');
                    html += `<tr>
                        <td>${idx+1}</td>
                        <td><div class="team-cell"><img src="${logo}" onerror="this.style.display='none'"> ${team.title || '?'}</div></td>
                        <td>${t.play || 0}</td>
                        <td>${t.wins || 0}</td>
                        <td>${t.draw || 0}</td>
                        <td>${t.lose || 0}</td>
                        <td>${t.for || 0}</td>
                        <td>${t.diff || 0}</td>
                        <td class="points">${t.points || 0}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                return html;
            }

            // ============================================================
            // LINEUPS (Formation-style with player images)
            // ============================================================
            function renderLineups(data, home, away) {
                if (!data || !data.lineup) {
                    return '<div class="empty-state">No lineups available</div>';
                }

                const homeId = home.row_id || home.id;
                const awayId = away.row_id || away.id;
                const homeLineup = data.lineup[homeId] || data.lineup[String(homeId)];
                const awayLineup = data.lineup[awayId] || data.lineup[String(awayId)];

                function getStartingPlayers(lineupData) {
                    if (!lineupData || !lineupData.lineup) return [];
                    return lineupData.lineup.filter(p => p.type === 'lineup' || p.type === 'start');
                }

                const homePlayers = getStartingPlayers(homeLineup);
                const awayPlayers = getStartingPlayers(awayLineup);

                function sortByPosition(players) {
                    const order = { 'G': 0, 'D': 1, 'M': 2, 'F': 3 };
                    return players.sort((a, b) => (order[a.position] || 99) - (order[b.position] || 99));
                }

                const homeSorted = sortByPosition(homePlayers);
                const awaySorted = sortByPosition(awayPlayers);

                let html = '<div class="lineup-grid">';

                // Home
                html += `<div class="lineup-team">
                    <div class="title">
                        <img src="${getImageUrl(home.image, 'team')}" onerror="this.style.display='none'">
                        ${home.title || 'Home'}
                        ${data.home_formation ? '• ' + data.home_formation : ''}
                    </div>
                    <div class="formation-pitch">`;

                const homeRows = [
                    { label: 'GK', players: homeSorted.filter(p => p.position === 'G') },
                    { label: 'DEF', players: homeSorted.filter(p => p.position === 'D') },
                    { label: 'MID', players: homeSorted.filter(p => p.position === 'M') },
                    { label: 'FWD', players: homeSorted.filter(p => p.position === 'F') }
                ];

                homeRows.forEach(row => {
                    if (row.players.length === 0) return;
                    html += `<div class="position-row">
                        <span class="pos-label">${row.label}</span>
                        <div class="players-row">`;
                    row.players.forEach(p => {
                        const player = p.player || {};
                        const playerImg = getImageUrl(player.image, 'player') || getDefaultPlayerImage();
                        html += `<div class="player-badge">
                            <img src="${playerImg}" onerror="this.style.display='none'">
                            <span class="player-number">${player.player_number || ''}</span>
                            <span class="player-name">${player.short_title || player.title || ''}</span>
                        </div>`;
                    });
                    html += `</div></div>`;
                });

                if (data.home_coach) {
                    html += `<div class="coach-info">🧑‍🏫 Coach: ${data.home_coach.title || ''}</div>`;
                }

                if (data.lineup_injureds && data.lineup_injureds[homeId]) {
                    const injuries = data.lineup_injureds[homeId] || [];
                    if (injuries.length > 0) {
                        html += `<div class="injuries">⚠️ Injured: `;
                        injuries.forEach((item, idx) => {
                            const p = item.player || {};
                            html += `${p.title || ''} (${item.type_name || 'Injured'})`;
                            if (idx < injuries.length - 1) html += ', ';
                        });
                        html += `</div>`;
                    }
                }

                html += `</div></div>`;

                // Away
                html += `<div class="lineup-team">
                    <div class="title">
                        <img src="${getImageUrl(away.image, 'team')}" onerror="this.style.display='none'">
                        ${away.title || 'Away'}
                        ${data.away_formation ? '• ' + data.away_formation : ''}
                    </div>
                    <div class="formation-pitch">`;

                const awayRows = [
                    { label: 'GK', players: awaySorted.filter(p => p.position === 'G') },
                    { label: 'DEF', players: awaySorted.filter(p => p.position === 'D') },
                    { label: 'MID', players: awaySorted.filter(p => p.position === 'M') },
                    { label: 'FWD', players: awaySorted.filter(p => p.position === 'F') }
                ];

                awayRows.forEach(row => {
                    if (row.players.length === 0) return;
                    html += `<div class="position-row">
                        <span class="pos-label">${row.label}</span>
                        <div class="players-row">`;
                    row.players.forEach(p => {
                        const player = p.player || {};
                        const playerImg = getImageUrl(player.image, 'player') || getDefaultPlayerImage();
                        html += `<div class="player-badge">
                            <img src="${playerImg}" onerror="this.style.display='none'">
                            <span class="player-number">${player.player_number || ''}</span>
                            <span class="player-name">${player.short_title || player.title || ''}</span>
                        </div>`;
                    });
                    html += `</div></div>`;
                });

                if (data.away_coach) {
                    html += `<div class="coach-info">🧑‍🏫 Coach: ${data.away_coach.title || ''}</div>`;
                }

                if (data.lineup_injureds && data.lineup_injureds[awayId]) {
                    const injuries = data.lineup_injureds[awayId] || [];
                    if (injuries.length > 0) {
                        html += `<div class="injuries">⚠️ Injured: `;
                        injuries.forEach((item, idx) => {
                            const p = item.player || {};
                            html += `${p.title || ''} (${item.type_name || 'Injured'})`;
                            if (idx < injuries.length - 1) html += ', ';
                        });
                        html += `</div>`;
                    }
                }

                html += `</div></div>`;
                html += '</div>';
                return html;
            }

            // ============================================================
            // EVENTS
            // ============================================================
            function renderEvents(data, home, away) {
                if (!data || !data.events || data.events.length === 0) {
                    return '<div class="empty-state">No events available</div>';
                }
                const events = data.events;
                const homeId = home.row_id || home.id;
                const awayId = away.row_id || away.id;

                let html = '<div class="events-list">';
                events.forEach(e => {
                    const time = e.time_minute || 0;
                    const playerName = e.player_name ? (e.player_name.short_title || e.player_name.title || '') :
                        '';
                    const assistName = e.assist_player_name ? (e.assist_player_name.short_title || e
                        .assist_player_name.title || '') : '';
                    const teamId = e.team_id;
                    const isHome = teamId === homeId;
                    const isAway = teamId === awayId;
                    const teamClass = isHome ? 'team-home' : (isAway ? 'team-away' : '');
                    let icon = '⚽',
                        desc = '';
                    const type = e.type,
                        status = e.status_name || '';
                    if (type === 1) { icon = '⚽';
                        desc = `${playerName} ${status ? '• ' + status : ''}`; if (assistName) desc +=
                            ` (assist: ${assistName})`; } else if (type === 2) { icon = '🟨';
                        desc = `${playerName} • Yellow card`; } else if (type === 3) { icon = '🟥';
                        desc = `${playerName} • Red card`; } else if (type === 8) {
                        if (status && status.includes('substitution')) { icon = '🔄';
                            desc = `${playerName} • Substitution`; if (assistName) desc += ` (in: ${assistName})`; } else if (
                            status && status.includes('Injury')) { icon = '🩹';
                            desc = `${playerName} • Injury`; } else { icon = '🔄';
                            desc = `${playerName} • Change`; }
                    } else if (type === 100) {
                        if (status === 1) { icon = '🟢';
                            desc = 'Kick-off'; } else if (status === 2) { icon = '⏱️';
                            desc = 'Half-time'; } else if (status === 3) { icon = '⏱️';
                            desc = 'Second half start'; } else if (status === 4) { icon = '🔴';
                            desc = 'Full-time'; } else { icon = '⏱️';
                            desc = status || 'Event'; }
                    } else { icon = '📌';
                        desc = playerName || status || 'Event'; }
                    html += `<div class="event-item ${teamClass}">
                        <span class="time">${time}'</span>
                        <span class="icon">${icon}</span>
                        <span class="desc">${desc}</span>
                        <span class="team">${isHome ? home.title || '' : (isAway ? away.title || '' : '')}</span>
                    </div>`;
                });
                html += '</div>';
                return html;
            }

            // ============================================================
            // STATISTICS
            // ============================================================
            function renderStats(data, home, away) {
                if (!data || !data.statics) return '<div class="empty-state">No statistics available</div>';
                const homeId = home.row_id || home.id;
                const awayId = away.row_id || away.id;
                const homeStats = data.statics[homeId] || data.statics[String(homeId)] || {};
                const awayStats = data.statics[awayId] || data.statics[String(awayId)] || {};
                const keys = [
                    { key: 'ball_possession', label: 'Possession', unit: '%' },
                    { key: 'total_shots', label: 'Total Shots' },
                    { key: 'shots_on_goal', label: 'Shots on Goal' },
                    { key: 'shots_off_goal', label: 'Shots off Goal' },
                    { key: 'blocked_shots', label: 'Blocked Shots' },
                    { key: 'shots_insidebox', label: 'Shots Inside Box' },
                    { key: 'shots_outsidebox', label: 'Shots Outside Box' },
                    { key: 'fouls', label: 'Fouls' },
                    { key: 'corner_kicks', label: 'Corners' },
                    { key: 'offsides', label: 'Offsides' },
                    { key: 'goalkeeper_saves', label: 'Saves' },
                    { key: 'total_passes', label: 'Passes' },
                    { key: 'passes_percentage', label: 'Pass Accuracy', unit: '%' }
                ];
                let html = '<div class="stats-grid">';
                keys.forEach(k => {
                    const homeVal = homeStats[k.key] !== undefined ? homeStats[k.key] : '-';
                    const awayVal = awayStats[k.key] !== undefined ? awayStats[k.key] : '-';
                    if (homeVal === '-' && awayVal === '-') return;
                    const total = (parseFloat(homeVal) + parseFloat(awayVal)) || 1;
                    const homePct = Math.round((parseFloat(homeVal) / total) * 100) || 50;
                    const awayPct = 100 - homePct;
                    const unit = k.unit || '';
                    html += `
                        <div class="stat-item">
                            <div class="stat-value-home">${homeVal}${unit}</div>
                            <div style="display:flex;flex-direction:column;align-items:center;">
                                <div class="stat-bar">
                                    <div class="fill-home" style="width:${homePct}%;"></div>
                                    <div class="fill-away" style="width:${awayPct}%;"></div>
                                </div>
                            </div>
                            <div class="stat-value-away">${awayVal}${unit}</div>
                            <div class="stat-label">${k.label}</div>
                        </div>
                    `;
                });
                html += '</div>';
                return html;
            }

            // ============================================================
            // LAST 5
            // ============================================================
            function renderLast5(match, home, away) {
                if (!match.played_result) return '<div class="empty-state">No recent matches</div>';
                const homeResults = match.played_result.home || {};
                const awayResults = match.played_result.away || {};
                const homeKeys = Object.keys(homeResults);
                const awayKeys = Object.keys(awayResults);

                let html = '<div class="last5-container">';

                html += `<div class="last5-team">
                    <div class="team-title"><img src="${getImageUrl(home.image, 'team')}" onerror="this.style.display='none'"> ${home.title || 'Home'}</div>
                    <div class="last5-results">`;
                if (homeKeys.length === 0) html +=
                    '<span style="font-size:11px;color:var(--text-secondary);">No matches</span>';
                homeKeys.slice(0, 5).forEach(key => {
                    const m = homeResults[key];
                    if (!m) return;
                    const result = m.win_type || 'equal';
                    const cls = result === 'win' ? 'win' : (result === 'lose' ? 'lose' : 'equal');
                    const label = result === 'win' ? 'W' : (result === 'lose' ? 'L' : 'D');
                    const scoreText = `${m.home_scores || 0} - ${m.away_scores || 0}`;
                    html += `<div class="last5-result"><span class="${cls}">${label}</span> <span class="score-text">${scoreText}</span></div>`;
                });
                html += `</div></div>`;

                html += `<div class="last5-team">
                    <div class="team-title"><img src="${getImageUrl(away.image, 'team')}" onerror="this.style.display='none'"> ${away.title || 'Away'}</div>
                    <div class="last5-results">`;
                if (awayKeys.length === 0) html +=
                    '<span style="font-size:11px;color:var(--text-secondary);">No matches</span>';
                awayKeys.slice(0, 5).forEach(key => {
                    const m = awayResults[key];
                    if (!m) return;
                    const result = m.win_type || 'equal';
                    const cls = result === 'win' ? 'win' : (result === 'lose' ? 'lose' : 'equal');
                    const label = result === 'win' ? 'W' : (result === 'lose' ? 'L' : 'D');
                    const scoreText = `${m.home_scores || 0} - ${m.away_scores || 0}`;
                    html += `<div class="last5-result"><span class="${cls}">${label}</span> <span class="score-text">${scoreText}</span></div>`;
                });
                html += `</div></div>`;

                html += '</div>';
                return html;
            }

            // ============================================================
            // H2H
            // ============================================================
            function renderH2H(match, home, away) {
                if (!match.teamWins) return '<div class="empty-state">No H2H data available</div>';
                const homeId = home.row_id || home.id;
                const awayId = away.row_id || away.id;
                if (!homeId || !awayId) return '<div class="empty-state">No H2H data</div>';

                const homeWins = match.teamWins[homeId] || 0;
                const awayWins = match.teamWins[awayId] || 0;
                const draws = match.teamWins['equal'] || 0;
                const homeName = home.title || 'Home';
                const awayName = away.title || 'Away';
                const homeLogo = getImageUrl(home.image, 'team');
                const awayLogo = getImageUrl(away.image, 'team');

                return `
                    <div class="h2h-box">
                        <div>
                            <div class="team-icon"><img src="${homeLogo}" onerror="this.style.display='none'"> ${homeName}</div>
                            <div class="stat win-home">${homeWins}</div>
                            <div class="label">Wins</div>
                        </div>
                        <div>
                            <div class="stat draw">${draws}</div>
                            <div class="label">Draws</div>
                        </div>
                        <div>
                            <div class="team-icon"><img src="${awayLogo}" onerror="this.style.display='none'"> ${awayName}</div>
                            <div class="stat win-away">${awayWins}</div>
                            <div class="label">Wins</div>
                        </div>
                    </div>
                `;
            }

            // ============================================================
            // VIDEOS
            // ============================================================
            function renderVideos(match) {
                if (!match.video_links || match.video_links.length === 0) {
                    return '<div class="empty-state">No videos available</div>';
                }
                let html = '<div class="videos-list">';
                match.video_links.forEach(v => {
                    const link = v.video_link || '';
                    const type = v.type || '';
                    let label = 'Video';
                    if (type === 11) label = '🎥 Full Match';
                    else if (type === 14) label = '📽️ Highlights';
                    else if (type === 12) label = '🎬 Goals';
                    html += `<div class="video-item"><span>${label}:</span> <a href="${link}" target="_blank">${link}</a></div>`;
                });
                html += '</div>';
                return html;
            }

            // ============================================================
            // LOAD NEWS (Improved with pagination + images)
            // ============================================================
            async function loadNews(page = 1) {
                newsContainer.innerHTML =
                    `<div class="loading-state"><div class="spinner"></div><div>Loading news...</div></div>`;

                try {
                    // First, get featured news from all_news_page
                    let featuredData = null;
                    try {
                        const featuredResp = await fetchNewsAPI('News/all_news_page/%5B%5D');
                        if (featuredResp.status) {
                            featuredData = featuredResp.data;
                        }
                    } catch (e) {
                        console.log('Featured news not available, using latest_news only');
                    }

                    // Get paginated news from latest_news
                    const endpoint = `News/latest_news/%5B%5D?page=${page}`;
                    const data = await fetchNewsAPI(endpoint);

                    if (!data.status) throw new Error('Failed to load news');

                    newsCurrentPage = data.data.current_page || page;
                    newsTotalPages = data.data.last_page || 1;

                    // Combine featured + latest news
                    let allNews = [];

                    // Add featured news first (main + important)
                    if (featuredData) {
                        if (featuredData.main) {
                            allNews.push({ ...featuredData.main, is_featured: true, type: 'main' });
                        }
                        if (featuredData.important && featuredData.important.length > 0) {
                            featuredData.important.forEach(item => {
                                allNews.push({ ...item, is_featured: true, type: 'important' });
                            });
                        }
                    }

                    // Add latest news (excluding duplicates by id)
                    const existingIds = new Set(allNews.map(item => item.id));
                    if (data.data.data && data.data.data.length > 0) {
                        data.data.data.forEach(item => {
                            if (!existingIds.has(item.id)) {
                                allNews.push({ ...item, is_featured: false });
                            }
                        });
                    }

                    renderNews(allNews, data.data);

                } catch (error) {
                    newsContainer.innerHTML = `<div class="error-state">⚠️ ${error.message}</div>`;
                }
            }

            function renderNews(newsItems, paginationData) {
                if (!newsItems || newsItems.length === 0) {
                    newsContainer.innerHTML = '<div class="empty-state">No news available</div>';
                    return;
                }

                let html = '<div class="news-grid">';

                // Show featured news first with a badge
                const displayItems = newsItems.slice(0, 12);
                displayItems.forEach(item => {
                    // Fix: Use the correct image URL format
                    let imgUrl = '';
                    if (item.image) {
                        // Try to use the full URL with the correct path
                        imgUrl = `https://news-en.ysscores.com/news/820/${item.image}`;
                    }
                    const time = item.created_at?.date ? new Date(item.created_at.date).toLocaleString('en-US') :
                        '';
                    const isFeatured = item.is_featured || false;

                    html += `
                        <div class="news-card ${isFeatured ? 'featured' : ''}" data-news-id="${item.id}">
                            ${imgUrl ? `<img src="${imgUrl}" onerror="this.style.display='none'" alt="${item.title}">` : `<div style="height:140px;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;">📰 No Image</div>`}
                            <div class="news-body">
                                ${isFeatured ? `<span style="font-size:10px;color:var(--accent-blue);font-weight:700;text-transform:uppercase;">★ Featured</span>` : ''}
                                <div class="title">${item.title || ''}</div>
                                <div class="desc">${item.news_desc || ''}</div>
                                <div class="time">${time}</div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';

                // Add pagination controls
                if (paginationData && paginationData.last_page > 1) {
                    html += `
                        <div style="display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap;">
                            <button onclick="window.loadNewsPage(${paginationData.current_page - 1})"
                                    style="background:none;border:1px solid var(--border-color);color:var(--text-secondary);padding:6px 16px;border-radius:30px;cursor:pointer;font-weight:600;transition:var(--transition);"
                                    ${paginationData.current_page <= 1 ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''}>
                                ← Previous
                            </button>
                            <span style="color:var(--text-secondary);font-size:13px;display:flex;align-items:center;">
                                Page ${paginationData.current_page} of ${paginationData.last_page}
                            </span>
                            <button onclick="window.loadNewsPage(${paginationData.current_page + 1})"
                                    style="background:none;border:1px solid var(--border-color);color:var(--text-secondary);padding:6px 16px;border-radius:30px;cursor:pointer;font-weight:600;transition:var(--transition);"
                                    ${paginationData.current_page >= paginationData.last_page ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''}>
                                Next →
                            </button>
                        </div>
                    `;
                }

                newsContainer.innerHTML = html;

                // Add click event to news cards
                document.querySelectorAll('.news-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const newsId = this.dataset.newsId;
                        if (newsId) showNewsDetail(newsId);
                    });
                });
            }

            // ============================================================
            // NEWS DETAIL
            // ============================================================
            async function showNewsDetail(newsId) {
                newsDetailOverlay.classList.add('visible');
                newsDetailContent.innerHTML =
                    `<div class="loading-state"><div class="spinner"></div><div>Loading news details...</div></div>`;

                try {
                    const data = await fetchNewsAPI(`News/news_detail/${newsId}`);
                    if (!data.status) throw new Error('Failed to load news detail');
                    renderNewsDetail(data.data);
                } catch (error) {
                    newsDetailContent.innerHTML = `<div class="error-state">⚠️ ${error.message}</div>`;
                }
            }

            function renderNewsDetail(newsItem) {
                const imgUrl = newsItem.image ? `https://news-en.ysscores.com/news/820/${newsItem.image}` : '';
                const time = newsItem.created_at?.date ? new Date(newsItem.created_at.date).toLocaleString('en-US') : '';

                let html = `
                    <div class="detail-title">${newsItem.title || ''}</div>
                    ${imgUrl ? `<img src="${imgUrl}" onerror="this.style.display='none'" class="detail-image" alt="${newsItem.title}">` : ''}
                    <div class="detail-meta">
                        <span>📅 ${time}</span>
                        ${newsItem.replies_count !== undefined ? `<span>💬 ${newsItem.replies_count} comments</span>` : ''}
                    </div>
                    <div class="detail-content">
                        ${newsItem.full_news || newsItem.news_desc || ''}
                    </div>
                `;

                newsDetailContent.innerHTML = html;
            }

            // ============================================================
            // NEWS DETAIL CONTROLS
            // ============================================================
            document.getElementById('newsDetailClose').addEventListener('click', function() {
                newsDetailOverlay.classList.remove('visible');
            });

            newsDetailOverlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    newsDetailOverlay.classList.remove('visible');
                }
            });

            // ============================================================
            // LOAD TRANSFERS
            // ============================================================
            async function loadTransfers() {
                try {
                    const data = await fetchAPI('info/transfer_info_page/0?page=1');
                    if (!data.status) throw new Error('Failed to load transfers');
                    renderTransfers(data.data);
                } catch (error) {
                    transfersContainer.innerHTML = `<div class="error-state">⚠️ ${error.message}</div>`;
                }
            }

            function renderTransfers(transferData) {
                const important = transferData.important || [];
                const all = transferData.all || [];
                const list = [...important, ...all].slice(0, 15);
                if (list.length === 0) {
                    transfersContainer.innerHTML = '<div class="empty-state">No transfers available</div>';
                    return;
                }

                let html = '<div class="transfer-list">';
                list.forEach(item => {
                    const player = item.player_name || {};
                    const teamOut = item.team_out || {};
                    const teamIn = item.team_in || {};
                    const playerImg = getImageUrl(player.image, 'player') || getDefaultPlayerImage();
                    const outImg = getImageUrl(teamOut.image, 'team');
                    const inImg = getImageUrl(teamIn.image, 'team');
                    const value = item.value ? (parseInt(item.value) / 1000000).toFixed(1) + 'M' : 'Free';
                    const date = item.date_from || '';
                    html += `
                        <div class="transfer-item">
                            <div class="player">
                                <img src="${playerImg}" onerror="this.style.display='none'">
                                <div>
                                    <div class="name">${player.title || 'Player'}</div>
                                    <div class="pos">${player.position || ''}</div>
                                </div>
                            </div>
                            <div class="teams">
                                <img src="${outImg}" onerror="this.style.display='none'"> ${teamOut.title || '?'}
                                <span style="color:var(--text-secondary);">→</span>
                                <img src="${inImg}" onerror="this.style.display='none'"> ${teamIn.title || '?'}
                            </div>
                            <div class="value">${value}</div>
                            <div class="date">${date}</div>
                        </div>
                    `;
                });
                html += '</div>';
                transfersContainer.innerHTML = html;
            }

            // ============================================================
            // LOAD STANDINGS (Leagues)
            // ============================================================
            async function loadStandings() {
                try {
                    const data = await fetchAPI('info/championship_ranking/L/60');
                    if (!data.status) throw new Error('Failed to load leagues');
                    renderLeagues(data.data);
                } catch (error) {
                    standingsContainer.innerHTML = `<div class="error-state">⚠️ ${error.message}</div>`;
                }
            }

            function renderLeagues(leagues) {
                if (!leagues || leagues.length === 0) {
                    standingsContainer.innerHTML = '<div class="empty-state">No leagues available</div>';
                    return;
                }
                let html = '<div class="leagues-grid">';
                leagues.slice(0, 30).forEach(league => {
                    const img = getImageUrl(league.image, 'championship');
                    html += `
                        <div class="league-card" data-league-id="${league.url_id}">
                            <img src="${img}" onerror="this.style.display='none'">
                            <span class="name">${league.title || 'League'}</span>
                        </div>
                    `;
                });
                html += '</div>';
                standingsContainer.innerHTML = html;

                document.querySelectorAll('.league-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const leagueId = this.dataset.leagueId;
                        if (leagueId) showLeagueStandings(leagueId);
                    });
                });
            }

            async function showLeagueStandings(leagueId) {
                try {
                    const data = await fetchAPI(`matches/league_standing_stage/${leagueId}`);
                    if (!data.status) throw new Error('Failed to load standings');
                    const standingData = data.data;
                    const leagueName = standingData.league?.stage0?.[0]?.team_name?.full_title || 'League';
                    let html = `
                        <div style="margin-bottom:8px;">
                            <button class="back-btn" onclick="window.loadStandingsFromGlobal()">← Back</button>
                            <span style="font-weight:700; font-size:15px; margin-right:8px;">${leagueName}</span>
                        </div>
                    `;
                    html += renderStandings(standingData, { title: leagueName });
                    standingsContainer.innerHTML = html;
                } catch (error) {
                    standingsContainer.innerHTML = `<div class="error-state">⚠️ ${error.message}</div>`;
                }
            }

            // ============================================================
            // DATE NAVIGATION
            // ============================================================
            function updateDate() {
                dateDisplay.textContent = formatDateDisplay(currentDate);
                loadMatches(currentDate);
            }

            document.getElementById('prevDay').addEventListener('click', () => {
                currentDate.setDate(currentDate.getDate() - 1);
                updateDate();
            });
            document.getElementById('nextDay').addEventListener('click', () => {
                currentDate.setDate(currentDate.getDate() + 1);
                updateDate();
            });
            document.getElementById('todayBtn').addEventListener('click', () => {
                currentDate = new Date();
                updateDate();
            });

            dateDisplay.addEventListener('click', () => {
                const d = currentDate;
                datePickerInput.value =
                    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                datePickerOverlay.classList.add('visible');
            });

            document.getElementById('datePickerClose').addEventListener('click', () => {
                datePickerOverlay.classList.remove('visible');
            });

            document.getElementById('datePickerConfirm').addEventListener('click', () => {
                const val = datePickerInput.value;
                if (val) {
                    const parts = val.split('-');
                    currentDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                    datePickerOverlay.classList.remove('visible');
                    updateDate();
                }
            });

            // ============================================================
            // TAB SWITCHING
            // ============================================================
            document.querySelectorAll('#tabBar button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#tabBar button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const tab = this.dataset.tab;
                    currentTab = tab;
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    const target = document.getElementById('tab-' + tab);
                    if (target) target.classList.add('active');

                    if (tab === 'news') loadNews(1);
                    else if (tab === 'transfers') loadTransfers();
                    else if (tab === 'standings') loadStandings();
                    else if (tab === 'matches') loadMatches(currentDate);
                });
            });

            // ============================================================
            // BACK BUTTON
            // ============================================================
            document.getElementById('detailBackBtn').addEventListener('click', function() {
                detailView.classList.remove('visible');
                loadMatches(currentDate);
            });

            // ============================================================
            // GLOBAL FUNCTIONS
            // ============================================================
            window.loadStandingsFromGlobal = function() {
                loadStandings();
            };

            window.loadNewsPage = function(page) {
                if (page >= 1 && page <= newsTotalPages) {
                    loadNews(page);
                }
            };

            // ============================================================
            // INIT
            // ============================================================
            function init() {
                updateDate();
                loadNews(1);
                loadTransfers();
                loadStandings();
            }

            init();

        })();
    </script>

</body>
    </html>
