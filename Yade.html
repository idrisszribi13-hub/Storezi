<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Center - YSScores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <style>
        /* ===== GLOBAL ===== */
        :root {
            --primary: #0d6efd;
            --secondary: #6c757d;
            --success: #198754;
            --info: #0dcaf0;
            --warning: #ffc107;
            --danger: #dc3545;
            --light-bg: #f4f6f9;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --text-color: #222;
            --header-bg: #1a1a2e;
            --header-text: #fff;
            --highlight-bg: rgba(13, 110, 253, 0.15);
        }
        [data-theme="dark"] {
            --light-bg: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e0e0e0;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --header-bg: #0f0f1f;
            --highlight-bg: rgba(13, 110, 253, 0.25);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 1200px; padding: 20px 15px; }
        .champ-select { margin-bottom: 20px; }
        .dropdown-toggle {
            background: var(--card-bg);
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            padding: 10px 20px;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            color: var(--text-color);
        }
        .dropdown-menu {
            max-height: 400px;
            overflow-y: auto;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: none;
            background: var(--card-bg);
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            padding: 8px 15px;
            font-size: 0.95rem;
            color: var(--text-color);
        }
        .dropdown-item:hover { background: var(--light-bg); }
        .dropdown-item img { margin-right: 10px; }
        .search-box {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--card-bg);
            color: var(--text-color);
        }
        .nav-tabs {
            border-bottom: 2px solid #e9ecef;
            gap: 5px;
        }
        .nav-tabs .nav-link {
            border: none;
            color: #555;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
        }
        .nav-tabs .nav-link.active {
            background-color: var(--card-bg);
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }
        .tab-content {
            background: var(--card-bg);
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            transition: transform 0.2s;
            background: var(--card-bg);
            color: var(--text-color);
        }
        .card:hover { transform: translateY(-3px); }
        .match-card, .news-card { cursor: pointer; }
        .team-img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            cursor: pointer;
        }
        .player-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
            cursor: pointer;
        }
        .champ-img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            cursor: pointer;
        }
        .referee-img {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 50%;
            cursor: pointer;
        }
        .table { margin-bottom: 0; font-size: 0.9rem; color: var(--text-color); }
        .table th { background: #f8f9fa; border-bottom: 2px solid #dee2e6; color: var(--text-color); }
        [data-theme="dark"] .table th { background: #1a1a2e; border-color: #333; }
        .highlight-row { background-color: var(--highlight-bg) !important; font-weight: 700; }
        .modal-body { max-height: 70vh; overflow-y: auto; }
        .clickable-img { cursor: pointer; }
        .clickable-img:hover { opacity: 0.8; }
        .no-underline { text-decoration: none !important; }
        .pagination { justify-content: center; margin-top: 20px; }
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.8);
            z-index: 9999;
            pointer-events: none;
        }
        .loader.hidden { display: none; }
        .loader .spinner-border { pointer-events: auto; }
        .scroll-sentinel { height: 1px; }
        .match-timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: #2c3e50;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
        }
        .countdown { background: #e74c3c; }
        .match-modal-tabs {
            border-bottom: 2px solid #e9ecef;
            gap: 5px;
            margin-top: 15px;
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .match-modal-tabs .nav-link {
            border: none;
            color: #555;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 6px 6px 0 0;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 13px;
        }
        .match-modal-tabs .nav-link.active {
            background-color: #f8f9fa;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }
        .match-modal-tab-content { padding: 15px 0; }
        .match-info-block {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .match-info-block .row > div { padding: 5px 0; }
        .channel-badge {
            display: inline-block;
            background: #e9ecef;
            border-radius: 4px;
            padding: 2px 8px;
            margin: 2px;
            font-size: 0.8rem;
        }
        .live-score { color: #dc3545; font-weight: bold; }
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #dc3545;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: blink 1.2s infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        .goal-alert {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #dc3545;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: goalFade 8s forwards;
            pointer-events: none;
            white-space: nowrap;
        }
        .penalty-alert { background-color: #fd7e14; }
        @keyframes goalFade {
            0% { opacity: 0; transform: translateX(-50%) scale(0.8); }
            10% { opacity: 1; transform: translateX(-50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
        .play-stream-btn {
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-stream-btn:hover { background-color: #146c43; }
        .video-player-modal .modal-content { background-color: #000; }
        .video-player-modal .modal-body { padding: 0; height: 80vh; }
        .video-player-modal video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .extra-time { color: #ffc107; }
        .timeline-container {
            width: 100%;
            height: 6px;
            background: #eaeaea;
            border-radius: 3px;
            position: relative;
            margin: 10px 0 5px;
        }
        .timeline-fill {
            height: 100%;
            background: #27ae60;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .ht-marker {
            position: absolute;
            top: -2px;
            width: 3px;
            height: 10px;
            background: red;
            left: 50%;
            border-radius: 2px;
            z-index: 2;
        }
        .goal-marker {
            position: absolute;
            top: -4px;
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
            transform: translateX(-50%);
            border: 2px solid #fff;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
            z-index: 3;
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            gap: 10px;
            width: 100%;
        }
        .team-col {
            flex: 1;
            text-align: center;
            min-width: 0;
        }
        .team-col img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            cursor: pointer;
        }
        .team-col .team-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 5px;
            color: var(--text-color);
            cursor: pointer;
        }
        .team-col .team-title:hover { color: var(--primary); }
        .center-col {
            width: 120px;
            flex-shrink: 0;
            text-align: center;
        }
        .score-big {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-color);
        }
        .live-badge {
            background: #dc3545;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            border-radius: 12px;
            padding: 2px 10px;
            margin-bottom: 5px;
            display: inline-block;
        }
        .time-text {
            font-size: 13px;
            color: var(--text-color);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .upcoming-center {
            text-align: center;
            width: 110px;
            flex-shrink: 0;
        }
        .upcoming-time {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 8px;
            font-weight: bold;
            font-size: 14px;
            color: var(--text-color);
        }
        .upcoming-vs {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }
        .search-trigger {
            display: none !important;
        }
        .player-hero {
            position: relative;
            height: 280px;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #eaeaea;
        }
        .player-hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center bottom;
            background-repeat: no-repeat;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            opacity: 0.9;
        }
        .player-hero-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.6) 40%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }
        .player-top-info {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
        }
        .player-thumb {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            position: relative;
            cursor: pointer;
        }
        .player-team-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: red;
            cursor: pointer;
        }
        .player-basic-info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 2;
        }
        .player-basic-info h4 { font-weight: 800; margin-bottom: 2px; color: #000; }
        .player-basic-info p {
            margin: 0;
            color: #666;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat-cards-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .stat-card strong { display: block; font-size: 16px; margin-bottom: 4px; color: #111; }
        .stat-card span { display: block; font-size: 13px; color: #777; }
        .player-stats-section {
            background: #fff;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #eaeaea;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            text-align: center;
            border-bottom: 1px dashed #eaeaea;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .stat-item .stat-val { font-size: 18px; font-weight: 700; }
        .stat-item .stat-label { font-size: 11px; color: #888; }
        .penalty-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #555;
        }
        .penalty-bar {
            height: 4px;
            background: #eaeaea;
            border-radius: 2px;
            margin-top: 5px;
            position: relative;
        }
        .penalty-fill {
            height: 100%;
            background: #67c23a;
            border-radius: 2px;
            width: 50%;
        }
        .match-header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 15px 10px 15px;
            margin-bottom: 5px;
            border: 1px solid #eaeaea;
            position: relative;
        }
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .match-team-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .match-team-side img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            cursor: pointer;
        }
        .match-team-side span {
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-color);
        }
        .match-team-side span:hover { color: var(--primary); }
        .match-center-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .match-center-side .match-score {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-color);
        }
        .match-header .champ-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #666;
            flex-wrap: wrap;
            text-align: center;
        }
        .match-header .champ-badge img { width: 20px; height: 20px; cursor: pointer; }
        .match-header .champ-badge .champ-title { font-weight: 600; color: #333; cursor: pointer; }
        .match-header .champ-badge .champ-title:hover { color: var(--primary); }
        .match-header .champ-badge .match-meta { color: #888; font-size: 11px; }
        .match-header .champ-badge .match-meta span { margin: 0 4px; }
        .match-time-display {
            font-size: 16px;
            font-weight: 700;
            color: #2c3e50;
            background: #e9ecef;
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
            position: relative;
            font-variant-numeric: tabular-nums;
        }
        .match-time-display .stoppage-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc3545;
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            border: 1px solid #fff;
        }
        .match-period {
            font-size: 14px;
            font-weight: 600;
            color: #6c757d;
        }
        .penalty-score {
            font-size: 18px;
            font-weight: 700;
            color: #ffc107;
            background: #2c3e50;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 5px;
        }
        .extra-time-label { color: #ffc107; font-weight: 700; }
        .countdown-timer {
            font-size: 14px;
            font-weight: 600;
            color: #e74c3c;
            font-variant-numeric: tabular-nums;
        }
        .events-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin: 10px 0 10px;
        }
        .event-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 5px 0;
            display: flex;
            flex-direction: column;
        }
        .event-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .event-row:last-child { border-bottom: none; }
        .event-time-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            flex-shrink: 0;
        }
        .event-time-circle {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 700;
            position: relative;
            font-size: 13px;
            flex-direction: column;
            line-height: 1.2;
        }
        .event-time-circle .time-main { font-size: 13px; font-weight: 700; }
        .event-time-circle .time-extra {
            font-size: 8px;
            font-weight: 600;
            color: #dc3545;
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
        }
        .event-time-circle .time-period {
            font-size: 7px;
            font-weight: 700;
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            color: inherit;
        }
        .event-side {
            display: flex;
            align-items: center;
            width: 40px;
        }
        .event-side-right { justify-content: flex-end; }
        .event-side-left { justify-content: flex-start; }
        .event-side img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            cursor: pointer;
        }
        .event-side img:hover { transform: scale(1.1); }
        .event-info-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            padding: 0 8px;
        }
        .event-player {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .event-player .player-name-click {
            cursor: pointer;
        }
        .event-player .player-name-click:hover { color: var(--primary); }
        .event-sub {
            font-size: 11px;
            color: #777;
            margin-top: 1px;
        }
        .event-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
        .in-arrow { color: #28a745; font-weight: bold; }
        .out-arrow { color: #dc3545; font-weight: bold; }
        .extra-time-blue { color: #007bff; font-weight: bold; }
        .halftime-divider {
            background: #f5f5f5;
            margin: 5px 0;
            padding: 10px;
            text-align: center;
            font-weight: 700;
            color: #333;
            font-size: 15px;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }
        .halftime-divider .ht-score { font-size: 18px; color: #2c3e50; }
        .kickoff-divider, .fulltime-divider {
            text-align: center;
            padding: 10px;
            color: #666;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .fulltime-divider.penalty {
            background: #fff3e0;
            border-color: #ffc107;
            border: 1px solid #ffc107;
            border-radius: 8px;
        }
        .lineup-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .lineup-tab {
            border: none;
            background: #f1f3f5;
            color: #666;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        .lineup-tab.active {
            background: #27ae60;
            color: white;
        }
        .lineup-tab img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            cursor: pointer;
        }

        // ============================================================
        //  SCROLL PROGRESS INDICATOR
        // ============================================================
        function initScrollProgress() {
            const el = document.getElementById('scrollProgress');
            const circle = document.getElementById('progressCircle');
            const arrow = document.getElementById('scrollArrow');
            const circumference = 2 * Math.PI * 20;

            function updateScroll() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const progress = docHeight > 0 ? Math.min(1, scrollTop / docHeight) : 0;
                const offset = circumference * (1 - progress);
                circle.style.strokeDashoffset = offset;

                const isAtTop = scrollTop < 50;
                const isAtBottom = scrollTop > docHeight - 50;
                if (isAtTop) {
                    arrow.textContent = '↓';
                    arrow.className = 'arrow-icon down';
                } else if (isAtBottom) {
                    arrow.textContent = '↑';
                    arrow.className = 'arrow-icon up';
                } else {
                    arrow.textContent = '↓';
                    arrow.className = 'arrow-icon';
                }
            }

            el.addEventListener('click', function() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const isAtTop = scrollTop < 50;
                if (isAtTop) {
                    window.scrollTo({ top: docHeight, behavior: 'smooth' });
                } else {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            let ticking = false;
            window.addEventListener('scroll', function() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        updateScroll();
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            updateScroll();
        }

        async function fetchFromProxy(url) {
            try {
                const proxied = `${SUPABASE_PROXY_URL}?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxied);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (err) {
                const fallbackUrl = url.replace(/\/api-(ar|fr|es|it|pt|br)\//, '/api-en/');
                if (fallbackUrl !== url) {
                    const proxied = `${SUPABASE_PROXY_URL}?url=${encodeURIComponent(fallbackUrl)}`;
                    const response = await fetch(proxied);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.json();
                }
                throw err;
            }
        }

                'CDM': 'Defensive Midfielder', 'CM': 'Central Midfielder', 'CAM': 'Attacking Midfielder',
                'LM': 'Left Midfielder', 'RM': 'Right Midfielder', 'LW': 'Left Winger', 'RW': 'Right Winger',
                'CF': 'Centre Forward', 'SS': 'Second Striker', 'AM': 'Attacking Midfielder', 'DM': 'Defensive Midfielder'
            };
            return mapping[pos] || pos || 'Unknown';
        }

        // ============================================================
        //  TIME FUNCTIONS - REAL TIME
        // ============================================================

        function formatMatchLocalDateTime(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp * 1000);
            const dateStr = date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
            return `${dateStr} ${timeStr}`;
        }

        function formatMatchLocalTime(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function formatMatchLocalDate(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function getLiveSeconds(match) {
            if (match.minutes !== undefined && match.minutes !== null && match.minutes > 0 && match.minutes < 14400) {
                return match.minutes;
            }
            if (match.match_timestamp && match.match_timestamp > 1000000000) {
                const elapsed = Math.floor(Date.now() / 1000 - match.match_timestamp);
                if (elapsed >= 0 && elapsed < 14400) {
                    return elapsed;
                }
            }
            return 0;
        }

        function getMatchPeriod(status) {
            if (status === 0) return 'Upcoming';
            if (status === 4) return 'FT';
            if (status === 2) return 'HT';
            if (status === 5) return 'ET HT';
            if (status === 7) return 'ET FT';
            if (status === 8) return '1st ET';
            if (status === 9) return '2nd ET';
            if (status === 10) return 'PEN';
            if (status === 1) return '1st Half';
            if (status === 3) return '2nd Half';
            return 'Live';
        }

        function formatLiveTimeRealtime(seconds, status, exTime) {
            const totalSeconds = Math.max(0, seconds);
            const minutes = Math.floor(totalSeconds / 60);
            const secs = Math.floor(totalSeconds % 60);
            const paddedSecs = String(secs).padStart(2, '0');

            if (status === 0) return { display: 'VS', stoppage: null };
            if (status === 4) return { display: 'FT', stoppage: null };
            if (status === 2) return { display: 'HT', stoppage: null };

            let timeStr = `${minutes}:${paddedSecs}`;
            let stoppage = null;
            if (exTime && exTime > 0) {
                stoppage = `+${exTime}'`;
            }
            return { display: timeStr, stoppage: stoppage };
        }

        function getMatchProgress(seconds, status) {
            if (status === 0) return 0;
            if (status === 4) return 100;
            if (status === 2) return 50;
            if (status === 10) return 100;
            if (status === 8 || status === 9) {
                const etMins = seconds / 60;
                return Math.min(100, Math.max(0, ((etMins - 90) / 30) * 100));
            }
            const mins = seconds / 60;
            return Math.min(100, Math.max(0, (mins / 90) * 100));
        }

        function getGoalMarkers(match) {
            let markers = '';
            if (match.score_time) {
                try {
                    const scoreTimes = JSON.parse(match.score_time);
                    scoreTimes.forEach(score => {
                        for (const key in score) {
                            if (key === '1' || key === '5') {
                                const goalMinute = parseInt(score[key]);
                                let percent = Math.min(100, (goalMinute / 90) * 100);
                                if (goalMinute > 90) {
                                    percent = 50 + ((goalMinute - 90) / 30) * 50;
                                }
                                markers += `<div class="goal-marker" style="left: ${percent}%"></div>`;
                            }
                        }
                    });
                } catch (e) {}
            }
            return markers;
        }

        // ============================================================
        //  REAL-TIME COUNTDOWN
        // ============================================================
        function startCountdown(element, timestamp) {
            if (!element) return;
            function updateCountdown() {
                const now = Date.now();
                const diff = Math.max(0, Math.floor((timestamp - now) / 1000));
                if (diff <= 0) {
                    element.textContent = '0s';
                    return;
                }
                const hours = Math.floor(diff / 3600);
                const minutes = Math.floor((diff % 3600) / 60);
                const secs = diff % 60;
                if (hours > 0) {
                    element.textContent = `${hours}h ${minutes}m ${secs}s`;
                } else if (minutes > 0) {
                    element.textContent = `${minutes}m ${secs}s`;
                } else {
                    element.textContent = `${secs}s`;
                }
            }
            updateCountdown();
            const interval = setInterval(updateCountdown, 1000);
            return interval;
        }

        function renderLiveMatchCard(match) {
            const home = match.home_team;
            const away = match.away_team;
            const comp = match.championship ? match.championship.title : '';
            const compImg = match.championship?.image ? `<img src="${IMG_BASE_CHAMP + match.championship.image}" style="width:16px;height:16px;vertical-align:middle;margin-right:5px;">` : '';

            const seconds = getLiveSeconds(match);
            const status = match.status || 1;
            const timerData = formatLiveTimeRealtime(seconds, status, match.ex_time);
            const timeDisplay = timerData.display;
            const stoppageBadge = timerData.stoppage;
            const period = getMatchPeriod(status);
            const progress = getMatchProgress(seconds, status);
            const goalMarkers = getGoalMarkers(match);

            const streamEvent = findStreamEvent(match);

            let penaltyHtml = '';
            if (match.match_penalties) {
                const homePens = match.match_penalties[home.row_id] ? match.match_penalties[home.row_id].filter(p => p.score === 1).length : 0;
                const awayPens = match.match_penalties[away.row_id] ? match.match_penalties[away.row_id].filter(p => p.score === 1).length : 0;
                penaltyHtml = `<div class="penalty-score">PK: ${homePens} - ${awayPens}</div>`;
            }

            let timerHtml = `<div class="time-text">${timeDisplay}</div>`;
            if (stoppageBadge) {
                timerHtml = `<div class="time-text" style="display:flex;align-items:center;justify-content:center;gap:4px;">

                </div>`;
            }

            const matchTime = match.match_timestamp ? formatMatchLocalTime(match.match_timestamp) : match.match_time;

            const card = document.createElement('div');
            card.className = 'col-12 mb-3';
            card.innerHTML = `
                <div class="card match-card" data-match-id="${match.match_id}">
                    <div class="match-row">
                        <div class="team-col">
                            <img src="${homeLogoUrl}" onclick="openTeamModal(${home.row_id})" style="cursor:pointer;">
                            <div class="team-title" onclick="openTeamModal(${home.row_id})">${home.title}</div>

                            <div class="score-big">${match.home_scores} - ${match.away_scores}</div>

                            <div class="live-badge">${period}</div>
                            ${timerHtml}
                            <div class="timeline-container">
                                <div class="timeline-fill" style="width: ${progress}%"></div>
                                ${status === 2 ? '<div class="ht-marker"></div>' : ''}
                                ${goalMarkers}
                            </div>
                            ${playBtn}
                        </div>
                        <div class="team-col">
                            <img src="${awayLogoUrl}" onclick="openTeamModal(${away.row_id})" style="cursor:pointer;">
                            <div class="team-title" onclick="openTeamModal(${away.row_id})">${away.title}</div>
                        </div>
                    </div>
                    <div class="text-center text-muted small pb-2">${compImg} ${comp} | ${match.match_date} ${matchTime}</div>
                </div>
            `;
            return card;
        }

        function renderUpcomingFinishedCard(match, isUpcoming) {
            const home = match.home_team;
            const away = match.away_team;
            const comp = match.championship ? match.championship.title : '';
            const compImg = match.championship?.image ? `<img src="${IMG_BASE_CHAMP + match.championship.image}" style="width:16px;height:16px;vertical-align:middle;margin-right:5px;">` : '';

            const matchTime = match.match_timestamp ? formatMatchLocalTime(match.match_timestamp) : match.match_time;
            const matchDate = match.match_timestamp ? formatMatchLocalDate(match.match_timestamp) : match.match_date;

            let middleContent = '';
            if (isUpcoming) {
                const timestamp = match.match_timestamp * 1000;
                const now = Date.now();
                const diff = Math.max(0, Math.floor((timestamp - now) / 1000));
                const hours = Math.floor(diff / 3600);
                const minutes = Math.floor((diff % 3600) / 60);
                const secs = diff % 60;

                middleContent = `

                        <div class="countdown-timer" data-timestamp="${timestamp}">${countdown}</div>

        function renderLiveAndToday() {
            const liveContainer = document.getElementById('liveMatchesContainer');
            const todayContainer = document.getElementById('todayMatchesContainer');
            liveContainer.innerHTML = '';
            todayContainer.innerHTML = '';

            if (liveMatches.length === 0) liveContainer.innerHTML = '<div class="col-12"><p>No live matches currently.</p></div>';
            else liveMatches.forEach(match => liveContainer.appendChild(renderLiveMatchCard(match)));

            if (todayMatches.length === 0) todayContainer.innerHTML = '<div class="col-12"><p>No matches for this date.</p></div>';
            else todayMatches.forEach(match => todayContainer.appendChild(renderUpcomingFinishedCard(match, match.status === 0)));

            document.querySelectorAll('.match-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.play-stream-btn')) return;
                    if (e.target.closest('.team-title')) return;
                    if (e.target.closest('.team-col img')) return;
                    openMatchDetails(this.dataset.matchId);
                });
            });
        }

        function handleScoreChanges(oldMatches, newMatches) {
            newMatches.forEach(newMatch => {
                const oldMatch = oldMatches.find(m => m.match_id == newMatch.match_id);
                if (!oldMatch) return;
                const oldHome = oldMatch.home_scores || 0;
                const oldAway = oldMatch.away_scores || 0;
                const newHome = newMatch.home_scores || 0;
                const newAway = newMatch.away_scores || 0;
                if (newHome > oldHome) showGoalAlert(newMatch.match_id, 'home', 'GOAL');
                else if (newAway > oldAway) showGoalAlert(newMatch.match_id, 'away', 'GOAL');
            });
        }

        function showGoalAlert(matchId, side, type) {
            const card = document.querySelector(`.match-card[data-match-id="${matchId}"]`);
            if (!card) return;
            const oldAlert = card.querySelector('.goal-alert');
            if (oldAlert) oldAlert.remove();
            const alert = document.createElement('div');
            alert.className = type === 'GOAL' ? 'goal-alert' : 'goal-alert penalty-alert';
            alert.innerHTML = `<img src="${ICONS.goal}" style="width:16px;height:16px;vertical-align:middle;"> ${type}`;
            card.appendChild(alert);
            setTimeout(() => { if (alert.parentNode) alert.remove(); }, 8000);
        }

        // ============================================================

        async function loadLiveAndTodayMatches() {
            try {
                const liveUrl = `${API_BASE}/matches/matches_in_proccess/L/60`;
                const liveData = await fetchFromProxy(liveUrl);
                liveMatches = liveData.data || [];

                const dateStr = getLocalDateStr(selectedDate);
                const todayUrl = `${API_BASE}/matches/matches_date_get/${dateStr}/%5B%5D/%5B%5D/%5B%5D/L/60`;
                const todayData = await fetchFromProxy(todayUrl).catch(() => ({ data: [] }));
                const liveIds = new Set(liveMatches.map(m => m.match_id));
                todayMatches = (todayData.data || []).filter(m => !liveIds.has(m.match_id));

                await loadStreamEvents();
                renderLiveAndToday();

                if (liveUpdateInterval) clearInterval(liveUpdateInterval);
                liveUpdateInterval = setInterval(() => {
                    document.querySelectorAll('.match-card').forEach(el => {
                        const match = liveMatches.find(m => m.match_id == el.dataset.matchId);
                        if (match) {
                            const seconds = getLiveSeconds(match);
                            const status = match.status || 1;
                            const timerData = formatLiveTimeRealtime(seconds, status, match.ex_time);
                            const timeEl = el.querySelector('.time-text');
                            const fillEl = el.querySelector('.timeline-fill');
                            if (timeEl) {
                                const stoppage = timerData.stoppage;
                                if (stoppage) {
                                    timeEl.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;gap:4px;">
                                        <span>${timerData.display}</span>
                                        <span style="background:#dc3545;color:white;font-size:10px;font-weight:700;padding:0px 6px;border-radius:10px;border:1px solid white;">${stoppage}</span>
                                    </div>`;
                                } else {
                                    timeEl.innerHTML = timerData.display;
                                }
                            }
                            if (fillEl) fillEl.style.width = `${getMatchProgress(seconds, status)}%`;
                        }
                    });
                }, 1000);

                if (liveFetchInterval) clearInterval(liveFetchInterval);
                liveFetchInterval = setInterval(async () => {
                    const newLiveData = await fetchFromProxy(liveUrl).catch(() => ({ data: [] }));
                    const newLiveMatches = newLiveData.data || [];
                    handleScoreChanges(liveMatches, newLiveMatches);
                    liveMatches = newLiveMatches;
                    await loadStreamEvents();
                    renderLiveAndToday();
                }, 25000);
            } catch (err) {
                console.error('Failed to load live/today matches:', err);
            }
        }

                item.dataset.cups = champ.cups ? '1' : '0';

        function switchTab(tabName) {

            teams.forEach((team, idx) => {

        function setupInfiniteScroll(sentinelId, loadMoreFunction) {
            const sentinel = document.getElementById(sentinelId);
            if (!sentinel) return;
            if (window.IntersectionObserver) {
                const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) loadMoreFunction(); }); }, { rootMargin: '200px' });
                observer.observe(sentinel);
                return observer;
            } else {
                window.addEventListener('scroll', () => { const rect = sentinel.getBoundingClientRect(); if (rect.top < window.innerHeight) loadMoreFunction(); });
                return null;
            }
        }

        async function loadScorers(page = 1) {
            if (!currentChampionship || scorersLoading) return;
            scorersLoading = true;
            if (page === 1) showLoading();

                const url = `${API_BASE}/matches/league_scorers_map/${currentChampionship.url_id}?page=${page}`;
                const data = await fetchFromProxy(url);
                const scorersContent = document.getElementById('scorersContent');
                const scorersData = data.data.data || [];
                if (page === 1) scorersContent.innerHTML = renderPlayersList(scorersData, 'goals');
                else {
                    const existing = scorersContent.querySelector('ul');
                    if (existing) existing.insertAdjacentHTML('beforeend', renderPlayersList(scorersData, 'goals').replace('<ul class="list-group">', '').replace('</ul>', ''));
                    else scorersContent.innerHTML = renderPlayersList(scorersData, 'goals');
                }
                scorersNextUrl = data.data.next_page_url || null;
                if (!scorersObserver) {
                    scorersObserver = setupInfiniteScroll('scorersSentinel', () => {
                        if (scorersNextUrl && !scorersLoading) { const nextPage = new URL(scorersNextUrl).searchParams.get('page'); loadScorers(parseInt(nextPage)); }
                    });
                }
            } catch (err) {
                console.error(err);
                if (page === 1) document.getElementById('scorersContent').innerHTML = '<div class="alert alert-danger">Failed to load top scorers</div>';

            showLoading();

                const url = `${API_BASE}/matches/cups_teams_standings/${currentChampionship.url_id}/L/60`;
                const data = await fetchFromProxy(url);
                const bracketContent = document.getElementById('bracketContent');
                if (data.data && (data.data.map || data.data.lot)) bracketContent.innerHTML = renderBracket(data.data.map, data.data.lot);
                else bracketContent.innerHTML = '<p>No bracket data</p>';
            } catch (err) {
                console.error(err);
                document.getElementById('bracketContent').innerHTML = '<div class="alert alert-danger">Failed to load bracket</div>';
            } finally { hideLoading(); }
        }

        function renderBracket(map, lot) {
            let html = '';
            if (lot && lot.length > 0) {
                html += '<h5 class="mt-3">Playoffs</h5>';
                lot.forEach(match => {
                    const winner = match.winTeam ? (match.teamA.row_id == match.winTeam ? match.teamA.title : match.teamB.title) : 'Unknown';
                    html += `<div class="bracket-match"><span class="no-underline-link" onclick="openTeamModal(${match.teamA.row_id})">${match.teamA.title}</span> vs <span class="no-underline-link" onclick="openTeamModal(${match.teamB.row_id})">${match.teamB.title}</span> (Winner: ${winner})</div>`;
                });
            }
            if (map && map.length > 0) {
                html += '<h5 class="mt-4">Knockout Bracket</h5>';
                map.forEach(match => {
                    const winnerClass = match.winTeam ? 'winner' : '';
                    html += `<div class="bracket-match ${winnerClass}"><span class="no-underline-link" onclick="openTeamModal(${match.teamA.row_id})">${match.teamA.title}</span> (${match.teamA_score}) - (${match.teamB_score}) <span class="no-underline-link" onclick="openTeamModal(${match.teamB.row_id})">${match.teamB.title}</span><br><small>${match.round_name}</small></div>`;
                });
            }
            return html;
        }

        function renderTeamPlayers(playersData) {
            let html = '<div class="row">';

        async function loadTeamStandings(teamId) {
            const container = document.getElementById('teamStandingsContent');
            if (!container || container.dataset.loaded) return;
            container.dataset.loaded = 'true';
            container.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Loading standings...';
            try {
                const teamInfoUrl = `${API_BASE}/info/team_info/${teamId}/L/60`;
                const teamInfoData = await fetchFromProxy(teamInfoUrl);
                const championships = teamInfoData.data.championships || [];
                let standingsHtml = '';
                for (const champ of championships) {
                    standingsHtml += `<h6 class="mt-3">${champ.title}</h6>`;
                    try {
                        let url;
                        if (champ.type === 1) url = `${API_BASE}/matches/league_standing_stage/${champ.url_id}`;
                        else url = `${API_BASE}/matches/cups_teams_standings/${champ.url_id}/L/60`;
                        const data = await fetchFromProxy(url);
                        let teams = null;
                        if (data.data && data.data.league && data.data.league.stage0) teams = data.data.league.stage0;
                        else if (data.data && data.data.standings && data.data.standings.groups) { teams = []; for (const group in data.data.standings.groups) teams = teams.concat(data.data.standings.groups[group]); }
                        if (teams && teams.length) {
                            const colors = data.data.color ? data.data.color.stage0 : [];
                            const rules = data.data.rules_list ? data.data.rules_list.stage0 : [];
                            standingsHtml += renderStandingsTable(teams, teamId, colors, rules);
                        } else standingsHtml += '<p>No standings data</p>';
                    } catch (err) { standingsHtml += '<p>Failed to load standings</p>'; }
                }
                container.innerHTML = standingsHtml || '<p>No championships</p>';
            } catch (err) { container.innerHTML = '<p>Failed to load standings</p>'; }
        }

        function quickSelectChampionship(url_id, title, type) {
            currentChampionship = { url_id: url_id, type: type, title: title, standings: 1, cups: (type === 4 ? 1 : null) };
            document.getElementById('selectedChampId').value = url_id;

        function normalizeTeamName(name) {
            if (!name) return '';
            let n = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
            n = n.replace(/\b(fc|cf|afc|sk|jk|ss|ac|as|sl|vfl|vs|1\.)\b/g, '').replace(/\s+/g, ' ').trim();
            for (const key in teamAliases) {
                const aliases = teamAliases[key];
                if (n === key || aliases.includes(n)) {
                    return key;
                }
            }
            return n;
        }

        function findStreamEvent(match) {
            if (!streamEvents.length || !match.home_team || !match.away_team) return null;
            const home = normalizeTeamName(match.home_team.title || match.home_team.full_title);
            const away = normalizeTeamName(match.away_team.title || match.away_team.full_title);
            const event = streamEvents.find(event => {
                const eventHome = normalizeTeamName(event.homeName);
                const eventAway = normalizeTeamName(event.awayName);
                return eventHome === home && eventAway === away;
            });
            if (event && event.sources && event.sources.length > 0 && event.sources[0].streamUrl) {
                return event;
            }
            return null;
        }

        function openStreamPlayer(streamUrl, matchData) {
            const modalElement = document.getElementById('streamPlayerModal');
            const videoElement = document.getElementById('streamVideo');
            const streamCompLogo = document.getElementById('streamCompLogo');
            const streamCompName = document.getElementById('streamCompName');
            const streamMatchInfo = document.getElementById('streamMatchInfo');
            const streamHomeLogo = document.getElementById('streamHomeLogo');
            const streamAwayLogo = document.getElementById('streamAwayLogo');

            if (matchData && matchData.compLogoUrl) {
                streamCompLogo.src = matchData.compLogoUrl;
                streamCompLogo.style.display = 'inline-block';
            } else {
                streamCompLogo.style.display = 'none';
            }

            if (streamCompName) streamCompName.textContent = matchData ? (matchData.compName || '') : '';
            if (streamMatchInfo) streamMatchInfo.textContent = matchData ? `${matchData.homeName} ${matchData.homeScore} - ${matchData.awayScore} ${matchData.awayName}` : '';

            if (matchData && matchData.homeLogoUrl) {
                streamHomeLogo.src = matchData.homeLogoUrl;
                streamHomeLogo.style.display = 'inline-block';
            } else {
                streamHomeLogo.style.display = 'none';
            }

            if (matchData && matchData.awayLogoUrl) {
                streamAwayLogo.src = matchData.awayLogoUrl;
                streamAwayLogo.style.display = 'inline-block';
            } else {
                streamAwayLogo.style.display = 'none';
            }

            let finalStreamUrl = streamUrl;
            if (finalStreamUrl.startsWith('http://')) {
                finalStreamUrl = finalStreamUrl.replace('http://', 'https://');
            }

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(finalStreamUrl);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error('HLS fatal error:', data);
                        alert('Unable to play stream. Please try again later.');
                        videoElement.pause();
                    }
                });
                videoElement.addEventListener('ended', () => hls.destroy());
                window.currentHls = hls;
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = finalStreamUrl;
            } else {
                alert('Your browser does not support HLS');
                return;
            }

            const modal = new bootstrap.Modal(modalElement);
            modal.show();
            modalElement.addEventListener('hidden.bs.modal', () => {
                videoElement.pause();
                videoElement.removeAttribute('src');
                videoElement.load();
                if (window.currentHls) { window.currentHls.destroy(); window.currentHls = null; }
            }, { once: true });
        }

        async function openMatchDetails(matchId) {
            showLoading();
            const results = await Promise.allSettled([
                fetchFromProxy(`${API_BASE}/matches/match_info/${matchId}/L/60`),
                fetchFromProxy(`${API_BASE}/matches/matches_event/${matchId}`),
                fetchFromProxy(`${API_BASE}/matches/matches_lineup/${matchId}`),
                fetchFromProxy(`${API_BASE}/matches/statics_match/${matchId}`),
                fetchFromProxy(`${API_BASE}/matches/h2h/${matchId}/L/60`),
                fetchFromProxy(`${API_BASE}/matches/team_matches/${matchId}/L/60`).catch(() => ({ data: { end: { data: [] } } })),
                fetchFromProxy(`${API_BASE}/matches/team_matches/${matchId}/L/60`).catch(() => ({ data: { end: { data: [] } } }))
            ]);

            const info = results[0].status === 'fulfilled' ? results[0].value.data : null;
            if (!info) {
                showError('Match info not available');
                hideLoading();
                return;
            }

            const events = results[1].status === 'fulfilled' ? results[1].value.data.events || [] : [];
            const lineups = results[2].status === 'fulfilled' ? results[2].value.data || {} : {};
            const stats = results[3].status === 'fulfilled' ? results[3].value.data.statics || {} : {};
            const h2h = results[4].status === 'fulfilled' ? results[4].value.data || {} : {};
            const homeLast5 = (results[5].status === 'fulfilled' && results[5].value.data.end) ? results[5].value.data.end.data.slice(0, 5) : [];
            const awayLast5 = (results[6].status === 'fulfilled' && results[6].value.data.end) ? results[6].value.data.end.data.slice(0, 5) : [];

            document.getElementById('errorIndicator').classList.add('hidden');

            let standingsData = null;
            if (info.championship && info.championship.url_id) {
                try {
                    const sUrl = `${API_BASE}/matches/league_standing_stage/${info.championship.url_id}`;
                    const sData = await fetchFromProxy(sUrl);
                    if (sData.data && sData.data.league && sData.data.league.stage0) {
                        standingsData = sData.data;
                    }
                } catch (e) {}
            }

            renderMatchDetails(info, events, lineups, stats, h2h, homeLast5, awayLast5, standingsData);
            document.getElementById('matchModalTitle').textContent = `${info.home_team.title} vs ${info.away_team.title}`;

            const modal = new bootstrap.Modal(document.getElementById('matchModal'));
            modal.show();
            startLiveMatchUpdates(info.match_id);
            hideLoading();
        }

        function startLiveMatchUpdates(matchId) {
            if (window.matchLiveInterval) clearInterval(window.matchLiveInterval);
            window.matchLiveInterval = setInterval(async () => {
                try {
                    const infoUrl = `${API_BASE}/matches/match_info/${matchId}/L/60`;
                    const infoData = await fetchFromProxy(infoUrl);
                    const info = infoData.data;
                    const liveScoreEl = document.querySelector('#matchModalBody .match-score');
                    const liveTimerDisplay = document.querySelector('#matchModalBody .timer-main');
                    const liveTimerStoppage = document.querySelector('#matchModalBody .timer-stoppage');
                    const livePeriodEl = document.querySelector('#matchModalBody .match-period');
                    const liveTimelineFillEl = document.querySelector('#matchModalBody .timeline-fill-modal');
                    if (liveScoreEl) liveScoreEl.textContent = `${info.home_scores} - ${info.away_scores}`;
                    if (liveTimerDisplay) {
                        const seconds = getLiveSeconds(info);
                        const status = info.status || 1;
                        const timerData = formatLiveTimeRealtime(seconds, status, info.ex_time);
                        liveTimerDisplay.textContent = timerData.display;
                        if (liveTimerStoppage) {
                            if (timerData.stoppage) {
                                liveTimerStoppage.textContent = timerData.stoppage;
                                liveTimerStoppage.style.display = 'inline-block';
                            } else {
                                liveTimerStoppage.style.display = 'none';

                    }

                    if (liveTimelineFillEl) liveTimelineFillEl.style.width = `${getMatchProgress(getLiveSeconds(info), info.status)}%`;
                } catch (e) {}
            }, 1000);
            document.getElementById('matchModal').addEventListener('hidden.bs.modal', () => {
                if (window.matchLiveInterval) clearInterval(window.matchLiveInterval);
            }, { once: true });
        }

                        <div class="team-name-cell">
