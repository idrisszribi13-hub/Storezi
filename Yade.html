<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yacine TV - البث المباشر</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e14;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 820px;
            width: 100%;
        }

        /* ---------- HEADER ---------- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px 20px;
            border-bottom: 2px solid #1e2a3a;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ff3b30;
            letter-spacing: 0.5px;
        }

        .header h1 i {
            margin-left: 10px;
            font-size: 20px;
        }

        .header .badge {
            background: #1e2a3a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #8e9aaf;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header .badge i {
            color: #4caf50;
            font-size: 11px;
        }

        /* ---------- EVENT CARD ---------- */
        .event-card {
            background: #141a24;
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
            border: 1px solid #1e2a3a;
            position: relative;
            overflow: hidden;
        }

        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: #ff3b30;
            border-radius: 0 4px 4px 0;
        }

        .event-card:hover {
            background: #1a2230;
            border-color: #2a3a50;
        }

        /* ---- left side (time + teams) ---- */
        .event-main {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            flex-wrap: wrap;
        }

        .event-time {
            font-size: 16px;
            font-weight: 600;
            color: #8e9aaf;
            min-width: 80px;
            letter-spacing: 0.3px;
            background: #0b0e14;
            padding: 4px 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #1e2a3a;
        }

        .event-teams {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .event-teams .team {
            font-size: 17px;
            font-weight: 600;
            color: #f0f4fa;
        }

        .event-teams .team.away {
            color: #b0c4de;
            font-weight: 500;
        }

        .event-teams .vs {
            font-size: 13px;
            color: #5a6a7e;
            font-weight: 700;
            margin: 0 2px;
        }

        /* ---- right side (league + commentator + channel) ---- */
        .event-meta {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .event-meta .league {
            font-size: 13px;
            color: #8e9aaf;
            background: #0b0e14;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #1e2a3a;
            white-space: nowrap;
        }

        .event-meta .commentator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #b0c4de;
        }

        .event-meta .commentator i {
            color: #f5c842;
            font-size: 13px;
        }

        .event-meta .channel {
            font-size: 13px;
            font-weight: 600;
            color: #4fc3f7;
            background: #0b1a2a;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #1a3a5a;
            white-space: nowrap;
        }

        /* ---------- LIVE BADGE (optional) ---------- */
        .live-badge {
            background: #ff3b30;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-right: 8px;
        }

        /* ---------- LOADING / ERROR ---------- */
        .status-msg {
            text-align: center;
            padding: 50px 20px;
            color: #8e9aaf;
            font-size: 15px;
        }

        .status-msg i {
            font-size: 30px;
            display: block;
            margin-bottom: 14px;
            color: #4fc3f7;
        }

        .status-msg.error i {
            color: #ff3b30;
        }

        .status-msg .sub {
            font-size: 13px;
            color: #5a6a7e;
            margin-top: 6px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 700px) {
            .event-card {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 16px;
            }

            .event-card::before {
                width: 3px;
            }

            .event-main {
                gap: 12px;
            }

            .event-time {
                min-width: 60px;
                font-size: 14px;
                padding: 3px 10px;
            }

            .event-teams .team {
                font-size: 15px;
            }

            .event-meta {
                gap: 10px;
                flex-wrap: wrap;
                padding-top: 8px;
                border-top: 1px solid #1e2a3a;
            }

            .event-meta .league,
            .event-meta .channel {
                font-size: 12px;
                padding: 3px 10px;
            }

            .event-meta .commentator {
                font-size: 12px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header .badge {
                font-size: 11px;
                padding: 4px 10px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .event-card {
                padding: 12px 14px;
            }

            .event-teams .team {
                font-size: 13px;
            }

            .event-time {
                font-size: 12px;
                min-width: 50px;
                padding: 2px 8px;
            }

            .event-meta .league,
            .event-meta .channel {
                font-size: 11px;
                padding: 2px 8px;
            }
        }

        /* ---------- SCROLLBAR ---------- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a50;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a4a60;
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <!-- HEADER -->
        <div class="header">
            <h1><i class="fas fa-broadcast-tower"></i> LIVE EVENT</h1>
            <div class="badge">
                <i class="fas fa-circle"></i>
                <span id="liveCount">0</span> مباراة
            </div>
        </div>

        <!-- EVENTS LIST -->
        <div id="eventsList">
            <!-- يتم إدراج البطاقات ديناميكياً عبر JavaScript -->
        </div>

        <!-- STATUS MESSAGE (loading / error / empty) -->
        <div id="statusMessage" class="status-msg" style="display: none;">
            <i class="fas fa-info-circle"></i>
            <div id="statusText">جاري التحميل...</div>
            <div class="sub" id="statusSub"></div>
        </div>

    </div>

    <script>
        /**
         * ============================================================
         *  Yacine TV API – Live Events Fetcher & Renderer
         *  API Endpoint: https://def.yacinelive.com/api/events
         *
         *  ملاحظة: البيانات التي يعيدها السيرفر مشفّرة (base64 + تشفير).
         *  هذا الكود يحاول فك التشفير باستخدام خوارزمية بسيطة (XOR)
         *  مستخدماً مفتاح افتراضي. إذا لم تنجح، يتم عرض بيانات وهمية
         *  لتوضيح شكل البطاقات.
         * ============================================================
         */

        // ---------- CONFIG ----------
        const API_URL = 'https://def.yacinelive.com/api/events';

        // ---------- DOM REFS ----------
        const eventsListEl = document.getElementById('eventsList');
        const statusMsgEl = document.getElementById('statusMessage');
        const statusTextEl = document.getElementById('statusText');
        const statusSubEl = document.getElementById('statusSub');
        const liveCountEl = document.getElementById('liveCount');

        // ---------- UTILITY: show status ----------
        function showStatus(icon, text, sub = '', isError = false) {
            statusMsgEl.style.display = 'block';
            eventsListEl.innerHTML = '';
            const iconEl = statusMsgEl.querySelector('i');
            iconEl.className = `fas ${icon}`;
            if (isError) {
                statusMsgEl.classList.add('error');
            } else {
                statusMsgEl.classList.remove('error');
            }
            statusTextEl.textContent = text;
            statusSubEl.textContent = sub;
        }

        function hideStatus() {
            statusMsgEl.style.display = 'none';
            statusMsgEl.classList.remove('error');
        }

        // ---------- DECRYPTION (placeholder – you need the real key) ----------
        // The API returns base64-encoded encrypted data.
        // This is a simple XOR demo; replace with actual AES / RC4 if known.
        function decryptData(encodedBase64, key = 'YacineTV2026') {
            try {
                // 1) Base64 decode
                const binary = atob(encodedBase64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }

                // 2) XOR with key (simple demo)
                const keyBytes = new TextEncoder().encode(key);
                const decrypted = new Uint8Array(bytes.length);
                for (let i = 0; i < bytes.length; i++) {
                    decrypted[i] = bytes[i] ^ keyBytes[i % keyBytes.length];
                }

                // 3) Try to parse as JSON
                const text = new TextDecoder('utf-8').decode(decrypted);
                return JSON.parse(text);
            } catch (e) {
                console.warn('[decrypt] فشل فك التشفير:', e.message);
                return null;
            }
        }

        // ---------- MOCK DATA (for demo when decryption fails) ----------
        function getMockEvents() {
            return {
                events: [{
                    time: '08:00 PM',
                    homeTeam: 'Arsenal',
                    awayTeam: 'كوفنتري سيتي',
                    league: 'الدوري الإنجليزي الممتاز',
                    commentator: 'حفيظ دراجي',
                    channel: 'beIN SPORTS 1'
                }, {
                    time: '08:00 PM',
                    homeTeam: 'Real Betis',
                    awayTeam: 'ريال سويسداد',
                    league: 'الدوري الإسباني',
                    commentator: 'محمد بركات',
                    channel: 'beIN SPORTS 2'
                }, {
                    time: '08:00 PM',
                    homeTeam: 'الدوري القطري',
                    awayTeam: 'جيرونا',
                    league: 'الدوري الإسباني الدرجة الثانية',
                    commentator: 'أحمد عبده',
                    channel: 'beIN SPORTS 5'
                }, {
                    time: '07:30 PM',
                    homeTeam: 'أرضوم سبور',
                    awayTeam: 'غلطة سراي',
                    league: 'الدوري التركي',
                    commentator: 'عبدالله الغامدي',
                    channel: 'beIN SPORTS 3'
                }]
            };
        }

        // ---------- RENDER EVENTS ----------
        function renderEvents(events) {
            if (!events || events.length === 0) {
                showStatus('fa-frown', 'لا توجد مباريات حالياً', 'ترقّب المزيد قريباً');
                liveCountEl.textContent = '0';
                return;
            }

            hideStatus();
            liveCountEl.textContent = events.length;

            let html = '';
            events.forEach((ev, index) => {
                const isLive = index === 0; // first one gets "LIVE" badge for demo
                html += `
                    <div class="event-card">
                        <div class="event-main">
                            <div class="event-time">${ev.time || '--:--'}</div>
                            <div class="event-teams">
                                <span class="team">${ev.homeTeam || '??'}</span>
                                <span class="vs">vs</span>
                                <span class="team away">${ev.awayTeam || '??'}</span>
                                ${isLive ? '<span class="live-badge">LIVE</span>' : ''}
                            </div>
                        </div>
                        <div class="event-meta">
                            <span class="league">${ev.league || ''}</span>
                            <span class="commentator">
                                <i class="fas fa-microphone"></i>
                                ${ev.commentator || ''}
                            </span>
                            <span class="channel">${ev.channel || ''}</span>
                        </div>
                    </div>
                `;
            });

            eventsListEl.innerHTML = html;
        }

        // ---------- FETCH & PROCESS ----------
        async function fetchEvents() {
            // Show loading
            showStatus('fa-spinner fa-pulse', 'جاري تحميل المباريات...', 'يرجى الانتظار');

            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'Accept': 'text/plain, application/json',
                    },
                    // Some APIs need a referer or user-agent – adjust if needed
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} - ${response.statusText}`);
                }

                const rawText = await response.text();
                console.log('[API] Raw response length:', rawText.length);

                // Try to parse as JSON first (in case the API returns JSON)
                let data = null;
                try {
                    data = JSON.parse(rawText);
                    // If it's already an object with events, use it
                    if (data && typeof data === 'object') {
                        if (data.events && Array.isArray(data.events)) {
                            renderEvents(data.events);
                            return;
                        }
                        // Maybe the data is directly an array
                        if (Array.isArray(data)) {
                            renderEvents(data);
                            return;
                        }
                    }
                } catch (_) { /* not JSON */ }

                // If not JSON, try to decrypt (assume base64 + XOR)
                const decrypted = decryptData(rawText);
                if (decrypted) {
                    if (decrypted.events && Array.isArray(decrypted.events)) {
                        renderEvents(decrypted.events);
                        return;
                    }
                    if (Array.isArray(decrypted)) {
                        renderEvents(decrypted);
                        return;
                    }
                    // If decrypted is an object with other structure, try to find array
                    for (const key of Object.keys(decrypted)) {
                        if (Array.isArray(decrypted[key]) && decrypted[key].length > 0) {
                            renderEvents(decrypted[key]);
                            return;
                        }
                    }
                }

                // --- If all fails, use mock data for demonstration ---
                console.warn('[API] لم نتمكن من فك التشفير، نعرض بيانات وهمية للتوضيح');
                const mock = getMockEvents();
                renderEvents(mock.events);
                showStatus('fa-info-circle', 'عرض بيانات تجريبية', 'تعذر فك تشفير البيانات من السيرفر', false);
                // but we already rendered, so we override the status to be a note
                // Instead, show a small note below the header
                const note = document.createElement('div');
                note.style.cssText =
                    'background:#1e2a3a;padding:10px 18px;border-radius:10px;margin-bottom:16px;font-size:13px;color:#b0c4de;text-align:center;border-right:4px solid #f5c842;';
                note.innerHTML =
                    '<i class="fas fa-lock" style="margin-left:8px;"></i> البيانات مشفّرة — تم عرض نموذج توضيحي. يُرجى توفير مفتاح فك التشفير الصحيح.';
                const container = document.querySelector('.container');
                const header = container.querySelector('.header');
                if (header.nextSibling) {
                    container.insertBefore(note, header.nextSibling);
                } else {
                    container.appendChild(note);
                }

            } catch (err) {
                console.error('[API] خطأ:', err);
                // Show error but still render mock so user sees the UI
                const mock = getMockEvents();
                renderEvents(mock.events);
                showStatus('fa-exclamation-triangle', 'حدث خطأ أثناء جلب البيانات', err.message, true);
                // Add note about encryption
                const note = document.createElement('div');
                note.style.cssText =
                    'background:#2a1a1a;padding:10px 18px;border-radius:10px;margin-bottom:16px;font-size:13px;color:#ff8a80;text-align:center;border-right:4px solid #ff3b30;';
                note.innerHTML =
                    '<i class="fas fa-shield-alt" style="margin-left:8px;"></i> فشل الاتصال بالسيرفر أو فك التشفير — عرض بيانات وهمية.';
                const container = document.querySelector('.container');
                const header = container.querySelector('.header');
                if (header.nextSibling) {
                    container.insertBefore(note, header.nextSibling);
                } else {
                    container.appendChild(note);
                }
            }
        }

        // ---------- START ----------
        fetchEvents();

        // Optional: refresh every 60 seconds
        // setInterval(fetchEvents, 60000);

        console.log('✅ Yacine TV Live Events Loaded');
        console.log('ℹ️  إذا كانت البيانات مشفّرة، عدّل دالة decryptData() باستخدام المفتاح الصحيح.');
    </script>

</body>
  </html>
