                            <img src="${IMG_BASE_TEAM + teamInfo.image}" onclick="openTeamModal(${teamInfo.row_id})" style="cursor:pointer;">
                            <span class="team-name-no-underline" onclick="openTeamModal(${teamInfo.row_id})">${teamInfo.title}</span>
                        </div>
                    </td>
                    <td>${team.play}</td><td>${team.wins}</td><td>${team.draw}</td><td>${team.lose}</td>
                    <td>${team.for}</td><td>${team.against}</td><td>${team.diff}</td><td>${team.points}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';

            if (colors && colors.length > 0) {
                html += '<div class="standings-key">';
                colors.forEach(c => {
                    if (c.color) {
                        const label = c.league_to || c.group_name || 'Qualification';
                        html += `<div class="key-item"><span class="color-box" style="background:${c.color};"></span> ${label}</div>`;
                    }
                });
                html += '</div>';
            }

            if (rules && rules.length > 0) {
                html += '<div class="standings-rules"><strong>Championship Rules</strong><ol>';
                rules.forEach(rule => {
                    html += `<li>${rule}</li>`;
                });
                html += '</ol></div>';
            }

            html += '</div>';
            return html;
        }

        // ============================================================
        //  EVENTS
        // ============================================================

        function renderEventsFixed(events, info) {
            if (!events || events.length === 0) return '<p class="text-center text-muted">No events recorded</p>';

            const homeId = info.home_team.row_id;
            const awayId = info.away_team.row_id;

            const specialEvents = events.filter(ev => ev.type === 100);
            const normalEvents = events.filter(ev => ev.type !== 100);

            normalEvents.sort((a, b) => {
                const aTime = a.time_minute || 0;
                const bTime = b.time_minute || 0;
                if (aTime !== bTime) return aTime - bTime;
                return (a.time_plus || 0) - (b.time_plus || 0);
            });

            const firstHalf = normalEvents.filter(e => (e.time_minute || 0) <= 45);
            const secondHalf = normalEvents.filter(e => (e.time_minute || 0) > 45 && (e.time_minute || 0) <= 90);
            const extraTime1 = normalEvents.filter(e => (e.time_minute || 0) > 90 && (e.time_minute || 0) <= 105);
            const extraTime2 = normalEvents.filter(e => (e.time_minute || 0) > 105 && (e.time_minute || 0) <= 120);
            const penaltyEvents = normalEvents.filter(e => (e.time_minute || 0) > 120);

            const kickOff = specialEvents.find(ev => ev.status === 1);
            const halfTime = specialEvents.find(ev => ev.status === 2);
            const fullTime = specialEvents.find(ev => ev.status === 3);
            const etHalfTime = specialEvents.find(ev => ev.status === 5);
            const etFullTime = specialEvents.find(ev => ev.status === 7);
            const etStart1 = specialEvents.find(ev => ev.status === 8);
            const etStart2 = specialEvents.find(ev => ev.status === 9);
            const penStart = specialEvents.find(ev => ev.status === 10);

            let html = '<div class="event-box" style="display:flex;flex-direction:column-reverse;">';

            function renderEventGroup(eventsList, dividerHtml) {
                let groupHtml = '';
                eventsList.forEach(ev => {
                    groupHtml += renderSingleEventFixed(ev, info, homeId, awayId);
                });
                if (groupHtml) {
                    return groupHtml + dividerHtml;
                }
                return '';
            }

            let allHtml = '';

            if (penStart) {
                let homePens = 0, awayPens = 0;
                if (info.match_penalties) {
                    homePens = info.match_penalties[homeId] ? info.match_penalties[homeId].filter(p => p.score === 1).length : 0;
                    awayPens = info.match_penalties[awayId] ? info.match_penalties[awayId].filter(p => p.score === 1).length : 0;
                }
                allHtml += `<div class="fulltime-divider penalty"><img src="${ICONS.penaltyKick}" class="icon-16"> Penalty Shootout (${homePens} - ${awayPens})</div>`;
                allHtml += renderEventGroup(penaltyEvents, '');
            }

            if (etStart2 || etFullTime) {
                let homeET = 0, awayET = 0;
                if (info.se_scores && info.se_scores.length > 0 && info.se_scores[0]) {
                    homeET = parseInt(info.se_scores[0].home_scores) || 0;
                    awayET = parseInt(info.se_scores[0].away_scores) || 0;
                }
                allHtml += `<div class="halftime-divider" style="background:#fff8e1;border-color:#ffc107;"><img src="${ICONS.clock}" class="icon-16"> <span class="ht-score">${homeET} - ${awayET}</span><br>Second Half of Extra Time</div>`;
                allHtml += renderEventGroup(extraTime2, '');
            }

            if (etStart1 || etHalfTime) {
                let homeET = 0, awayET = 0;
                if (info.fe_scores && info.fe_scores.length > 0 && info.fe_scores[0]) {
                    homeET = parseInt(info.fe_scores[0].home_scores) || 0;
                    awayET = parseInt(info.fe_scores[0].away_scores) || 0;
                }
                allHtml += `<div class="halftime-divider" style="background:#fff8e1;border-color:#ffc107;"><img src="${ICONS.clock}" class="icon-16"> <span class="ht-score">${homeET} - ${awayET}</span><br>First Half of Extra Time</div>`;
                allHtml += renderEventGroup(extraTime1, '');
            }

            if (fullTime) {
                allHtml += `<div class="fulltime-divider"><img src="${ICONS.whistle}" class="icon-16"> Full-Time</div>`;
            }

            allHtml += renderEventGroup(secondHalf, '');

            if (halfTime) {
                let homeHT = 0, awayHT = 0;
                if (info.fh_scores && info.fh_scores.length > 0 && info.fh_scores[0]) {
                    homeHT = parseInt(info.fh_scores[0].home_scores) || 0;
                    awayHT = parseInt(info.fh_scores[0].away_scores) || 0;
                }
                allHtml += `<div class="halftime-divider"><img src="${ICONS.clock}" class="icon-16"> <span class="ht-score">${homeHT} - ${awayHT}</span><br>Half Time</div>`;
            }

            allHtml += renderEventGroup(firstHalf, '');

            if (kickOff) {
                allHtml += `<div class="kickoff-divider"><img src="${ICONS.whistle}" class="icon-16"> Kick-Off</div>`;
            }

            html += allHtml;
            html += '</div>';

            return html;
        }

        function renderSingleEventFixed(ev, info, homeId, awayId) {
            let isHome = ev.team_id == homeId;
            let isAway = ev.team_id == awayId;

            let teamLeftHtml = '';
            let teamRightHtml = '';
            if (isHome) {
                teamLeftHtml = `<div class="event-side event-side-left"><img src="${IMG_BASE_TEAM + info.home_team.image}" onclick="openTeamModal(${info.home_team.row_id})"></div>`;
            } else if (isAway) {
                teamRightHtml = `<div class="event-side event-side-right"><img src="${IMG_BASE_TEAM + info.away_team.image}" onclick="openTeamModal(${info.away_team.row_id})"></div>`;
            }

            let icon = ICONS.flag;
            let typeText = '';
            let videoBtn = '';

            if (ev.event_video) {
                videoBtn = `<a href="${ev.event_video}" target="_blank" class="ms-1"><img src="${ICONS.video}" class="event-icon" style="cursor:pointer;"></a>`;
            }

            if (ev.type === 1 || ev.type === 13) {
                icon = ICONS.goal;
                typeText = ev.status_name || 'Goal';
            } else if (ev.type === 2 || ev.type === 3) {
                icon = ICONS.yellowCard;
                typeText = 'Yellow Card';
            } else if (ev.type === 6 || ev.type === 4) {
                icon = ICONS.redCard;
                typeText = 'Red Card';
            } else if (ev.type === 5) {
                icon = ICONS.penaltyKick;
                typeText = 'Penalty Scored';
            } else if (ev.type === 8) {
                icon = ICONS.substitutePlayer;
                typeText = 'Substitution';
            } else if (ev.type === 21) {
                icon = ICONS.flag;
                typeText = 'Missed Chance';
            } else if (ev.type === 22) {
                icon = ICONS.flag;
                typeText = 'Crossbar';
            } else if (ev.type === 7) {
                icon = ICONS.flag;
                typeText = 'Offside';
            } else if (ev.type === 9) {
                icon = ICONS.flag;
                typeText = 'Foul';
            } else if (ev.type === 10) {
                icon = ICONS.goal;
                typeText = 'Own Goal';
            } else if (ev.type === 11) {
                icon = ICONS.penaltyKick;
                typeText = 'Penalty Missed';
            } else if (ev.type === 12) {
                icon = ICONS.penaltyKick;
                typeText = 'Penalty Saved';
            } else if (ev.type === 14) {
                icon = ICONS.flag;
                typeText = 'Shot Off Target';
            } else if (ev.type === 15) {
                icon = ICONS.flag;
                typeText = 'Shot On Target';
            } else {
                icon = ICONS.flag;
                typeText = ev.status_name || 'Event';
            }

            let playerName = ev.player_name ? ev.player_name.title : '';
            let subName = ev.assist_player_name ? ev.assist_player_name.title : '';

            let finalPlayerHtml = '';
            let finalSubHtml = '';

            if (ev.type === 8) {
                const outPlayer = ev.assist_player_name ? ev.assist_player_name.title : '';
                const inPlayer = ev.player_name ? ev.player_name.title : '';
                finalPlayerHtml = `<span class="in-arrow">&#8594;</span> <span class="player-name-click" onclick="openPlayerModal(${ev.player.row_id})">${inPlayer}</span>`;
                finalSubHtml = `<span class="out-arrow">&#8592;</span> <span class="player-name-click" onclick="openPlayerModal(${ev.assist_player.row_id})">${outPlayer}</span>`;
            } else {
                finalPlayerHtml = `<span class="player-name-click" onclick="openPlayerModal(${ev.player?.row_id})">${playerName || typeText}</span>`;
                finalSubHtml = `<span>${subName ? 'Assist: ' + subName : ''}</span>`;
            }

            let periodLabel = '';
            const minute = ev.time_minute || 0;
            if (minute > 90 && minute <= 105) periodLabel = 'ET1';
            else if (minute > 105 && minute <= 120) periodLabel = 'ET2';
            else if (minute > 120) periodLabel = 'PEN';

            const minuteDisplay = `${minute}'`;
            const plusDisplay = ev.time_plus && ev.time_plus > 0 ? `+${ev.time_plus}` : '';

            let circleBg = '#e8f5e9';
            let circleColor = '#2e7d32';
            if (ev.type === 2 || ev.type === 3) { circleBg = '#fff3e0'; circleColor = '#e65100'; }
            if (ev.type === 6 || ev.type === 4) { circleBg = '#fce4ec'; circleColor = '#c62828'; }
            if (ev.type === 1 || ev.type === 5 || ev.type === 13) { circleBg = '#e3f2fd'; circleColor = '#0d47a1'; }
            if (ev.type === 8) { circleBg = '#f3e5f5'; circleColor = '#4a148c'; }
            if (ev.type === 7) { circleBg = '#e8f5e9'; circleColor = '#2e7d32'; }
            if (periodLabel === 'ET1' || periodLabel === 'ET2') { circleBg = '#fff8e1'; circleColor = '#f57f17'; }
            if (periodLabel === 'PEN') { circleBg = '#fce4ec'; circleColor = '#c62828'; }

            return `
            <div class="event-row">
                ${teamLeftHtml}
                <div class="event-time-cell">
                    <div class="event-time-circle" style="background:${circleBg};color:${circleColor};">
                        ${plusDisplay ? `<span class="time-extra">${plusDisplay}</span>` : ''}
                        <span class="time-main">${minuteDisplay}</span>
                        ${periodLabel ? `<span class="time-period">${periodLabel}</span>` : ''}
                    </div>
                </div>
                <div class="event-info-center">
                    <div class="event-player">
                        <img src="${icon}" class="event-icon">
                        ${finalPlayerHtml}
                        ${videoBtn}
                    </div>
                    ${finalSubHtml ? `<div class="event-sub">${finalSubHtml}</div>` : ''}
                </div>
                ${teamRightHtml}
            </div>`;
        }

        // ============================================================
        //  DETAILS TAB
        // ============================================================

        function renderDetailsTab(info, standingsData) {
            let html = '<div class="mt-2">';

            html += `<div class="detail-card"><div class="detail-row"><strong><img src="${ICONS.cup}" class="icon-16"> Competition</strong><span class="clickable-text" onclick="quickSelectChampionship('${info.championship?.url_id}', '${info.championship?.title.replace(/'/g, "\\'")}', ${info.championship?.type || 1})">${info.championship ? info.championship.title : 'N/A'}</span></div></div>`;
            html += `<div class="detail-card"><div class="detail-row"><strong><img src="${ICONS.schedule}" class="icon-16"> Round</strong><span>${info.round || 'N/A'}</span></div></div>`;
            html += `<div class="detail-card"><div class="detail-row"><strong><img src="${ICONS.arena}" class="icon-16"> Stadium</strong><span>${info.Stadium || 'N/A'}</span></div></div>`;

            if (info.channel_commm && info.channel_commm.length > 0) {
                info.channel_commm.forEach(c => {
                    html += `<div class="detail-card"><div class="detail-row"><strong><img src="${ICONS.video}" class="icon-16"> Channel</strong><span>${c.channel_name}</span></div></div>`;
                    if (c.commentator_name) html += `<div class="detail-card"><div class="detail-row"><strong><img src="${ICONS.whistle}" class="icon-16"> Commentator</strong><span>${c.commentator_name}</span></div></div>`;
                });
            }

            if (info.referees) {
                const ref = info.referees;
                html += `<div class="detail-card"><div class="detail-row"><strong><img src="${ICONS.whistle}" class="icon-16"> Referee</strong><span class="clickable-text" onclick="openRefereeModal(${ref.id})">${ref.title}</span></div></div>`;
            }

            const matchDateTime = info.match_timestamp ? formatMatchLocalDateTime(info.match_timestamp) : (info.match_date + ' ' + info.match_time);
            html += `<div class="detail-card"><div class="detail-row"><strong><img src="${ICONS.clock}" class="icon-16"> Date & Time</strong><span>${matchDateTime}</span></div></div>`;

            if (info.return) {
                html += `<div class="detail-card"><div class="detail-row"><strong>Aggregate</strong><span>${info.return}</span></div></div>`;
            }

            if (standingsData && standingsData.league && standingsData.league.stage0) {
                const teams = standingsData.league.stage0;
                const homeTeam = teams.find(t => t.team_id == info.home_team.row_id);
                const awayTeam = teams.find(t => t.team_id == info.away_team.row_id);
                if (homeTeam || awayTeam) {
                    html += '<div class="detail-card"><div class="detail-row"><strong>League Position</strong></div>';
                    if (homeTeam) {
                        const rank = teams.indexOf(homeTeam) + 1;
                        html += `<div class="detail-row"><span>${info.home_team.title}</span><span>#${rank} | ${homeTeam.points} pts | ${homeTeam.play} matches</span></div>`;
                    }
                    if (awayTeam) {
                        const rank = teams.indexOf(awayTeam) + 1;
                        html += `<div class="detail-row"><span>${info.away_team.title}</span><span>#${rank} | ${awayTeam.points} pts | ${awayTeam.play} matches</span></div>`;
                    }
                    html += '</div>';
                }
            }

            html += '</div>';
            return html;
        }

        // ============================================================
        //  LINEUPS
        // ============================================================

        function renderLineups(info, lineups) {
            const homeLineup = lineups.lineup ? lineups.lineup[info.home_team.row_id] : null;
            const awayLineup = lineups.lineup ? lineups.lineup[info.away_team.row_id] : null;
            const homeCoach = lineups['0']?.home_coach;
            const awayCoach = lineups['0']?.away_coach;
            const injureds = lineups.lineup_injureds || {};
            const homeInjured = injureds[info.home_team.row_id] || [];
            const awayInjured = injureds[info.away_team.row_id] || [];

            const homeFormation = lineups['0']?.home_formation || '4-3-3';
            const awayFormation = lineups['0']?.away_formation || '4-3-3';

            if (!homeLineup || !awayLineup) return '<p class="text-center text-muted">Lineups not available</p>';

            const homeHtml = renderPitchNew(info.home_team, homeLineup, homeFormation, homeCoach, homeInjured);
            const awayHtml = renderPitchNew(info.away_team, awayLineup, awayFormation, awayCoach, awayInjured);

            window.currentHomeLineupHtml = homeHtml;
            window.currentAwayLineupHtml = awayHtml;
            window.currentTeamInfo = info;

            let html = `
            <div class="lineup-tabs">
                <button class="lineup-tab active" data-target="home">
                    <img src="${IMG_BASE_TEAM + info.home_team.image}"> ${info.home_team.title}
                </button>
                <button class="lineup-tab" data-target="away">
                    ${info.away_team.title} <img src="${IMG_BASE_TEAM + info.away_team.image}">
                </button>
            </div>
            <div id="lineup-content">
                ${homeHtml}
            </div>`;

            return html;
        }

        function renderPitchNew(team, lineupData, formation, coach, injured) {
            const players = lineupData.lineup || [];
            const subs = lineupData.substitutions || [];
            const formationText = formation || '4-3-3';

            const groups = { 'G': [], 'D': [], 'M': [], 'F': [], 'S': [] };
            players.forEach(p => {
                const pos = p.position || 'M';
                if (groups[pos]) groups[pos].push(p);
                else groups['M'].push(p);
            });

            let html = `<div class="lineup-pitch">
                <div class="team-name">
                    <img src="${IMG_BASE_TEAM + team.image}" class="team-img" style="width:25px;height:25px;vertical-align:middle;cursor:pointer;" onclick="openTeamModal(${team.row_id})">
                    ${team.title}
                    <span class="formation-label">(${formationText})</span>
                </div>
                <div class="lineup-row">${renderLineupPlayersRow(groups['G'])}</div>
                <div class="lineup-row">${renderLineupPlayersRow(groups['D'])}</div>
                <div class="lineup-row">${renderLineupPlayersRow(groups['M'])}</div>
                <div class="lineup-row">${renderLineupPlayersRow(groups['F'])}</div>
            </div>`;

            if (coach) {
                html += `<div class="coach-section">
                    <strong><img src="${ICONS.whistle}" class="icon-16"> Coach</strong>
                    <div class="coach-info">
                        <img src="${IMG_BASE_COACH + coach.image}" class="player-img" style="width:35px;height:35px;cursor:pointer;" onclick="openCoachModal(${coach.id})">
                        <span class="no-underline-link" onclick="openCoachModal(${coach.id})">${coach.title}</span>
                    </div>
                </div>`;
            }

            if (injured && injured.length > 0) {
                html += `<div class="absences-section">
                    <strong class="text-danger"><img src="${ICONS.firstAid}" class="icon-16"> Absences</strong>
                    <ul class="list-unstyled">
                        ${injured.map(inj => `
                        <li class="d-flex align-items-center mb-1">
                            <img src="${IMG_BASE_PLAYER + inj.player.image}" class="player-img me-2" style="width:25px;height:25px;cursor:pointer;" onclick="openPlayerModal(${inj.player.row_id})">
                            <span class="no-underline-link" onclick="openPlayerModal(${inj.player.row_id})">${inj.player.title}</span>
                            <span class="text-muted ms-2">- ${inj.type_name || 'Unknown'}</span>
                        </li>`).join('')}
                    </ul>
                </div>`;
            }

            if (subs.length > 0) {
                html += `<div class="lineup-subs">
                    <h6><img src="${ICONS.substitutePlayer}" class="icon-16"> Substitutions</h6>
                    ${subs.map(sub => {
                        const inOut = sub.substitute_time ? `In ${sub.substitute_time}'` : 'On Bench';
                        const replaced = sub.player_lineup ? `<span class="sub-arrow">&#8592; ${sub.player_lineup.title || ''}</span>` : '';
                        return `
                        <div class="sub-item">
                            <img src="${IMG_BASE_PLAYER + sub.player.image}" class="player-img" onclick="openPlayerModal(${sub.player.row_id})">
                            <span>${sub.player.title}</span>
                            ${replaced ? `<span class="sub-arrow">${replaced}</span>` : ''}
                            <span class="sub-in-out">${inOut}</span>
                        </div>`;
                    }).join('')}
                </div>`;
            }

            return html;
        }

        function renderLineupPlayersRow(players) {
            return players.map(p => {
                let iconsHtml = '';
                if (p.yellow) {
                    iconsHtml += `<img src="${ICONS.yellowCard}" class="icon-card icon-yellow" style="width:16px;height:16px;">`;
                }
                if (p.red) {
                    iconsHtml += `<img src="${ICONS.redCard}" class="icon-card icon-red" style="width:16px;height:16px;">`;
                }
                if (p.goal) {
                    iconsHtml += `<img src="${ICONS.goal}" class="icon-card icon-goal" style="width:16px;height:16px;">`;
                }
                if (p.assist) {
                    iconsHtml += `<img src="${ICONS.flag}" class="icon-card icon-assist" style="width:14px;height:14px;background:#ffc107;border-radius:50%;padding:2px;">`;
                }
                if (p.captain) {
                    iconsHtml += `<div class="icon-card icon-captain">C</div>`;
                }

                let ratingDisplay = p.rating || '';

                return `<div class="lineup-player">
                    <div class="lineup-player-num">${p.player.player_number || ''}</div>
                    <img src="${IMG_BASE_PLAYER + p.player.image}" class="lineup-player-img" onclick="openPlayerModal(${p.player.row_id})">
                    <div class="lineup-player-name" onclick="openPlayerModal(${p.player.row_id})">${p.player.title}</div>
                    ${ratingDisplay ? `<div class="lineup-player-rate">${ratingDisplay}</div>` : ''}
                    ${iconsHtml ? `<div class="lineup-player-icons">${iconsHtml}</div>` : ''}
                </div>`;
            }).join('');
        }

        // ============================================================
        //  STATISTICS
        // ============================================================

        function renderStats(info, stats) {
            if (!stats || Object.keys(stats).length === 0) return '<p class="text-center text-muted">No statistics available</p>';

            const homeStats = stats[info.home_team.row_id] || {};
            const awayStats = stats[info.away_team.row_id] || {};

            let html = '<div class="stats-title">Statistics</div>';
            html += '<div class="stats-container">';

            const homePoss = parseInt(homeStats.ball_possession || 0);
            const awayPoss = parseInt(awayStats.ball_possession || 0);

            html += `<div class="possession-box">
                <div class="possession-circle">${homePoss}%</div>
                <div class="pos-split"><span>${info.home_team.title}</span><span>${info.away_team.title}</span></div>
            </div>`;

            const fields = [
                { key: 'total_shots', label: 'Total Shots' },
                { key: 'shots_on_goal', label: 'Shots On Target' },
                { key: 'shots_off_goal', label: 'Shots Off Target' },
                { key: 'shots_saved', label: 'Shots Saved' },
                { key: 'shots_insidebox', label: 'Shots Inside Box' },
                { key: 'shots_outsidebox', label: 'Shots Outside Box' },
                { key: 'goalkeeper_saves', label: 'Goalkeeper Saves' },
                { key: 'cross_ball', label: 'Cross Ball' },
                { key: 'total_passes', label: 'Total Passes' },
                { key: 'passes_percentage', label: 'Passes Accuracy' },
                { key: 'fouls', label: 'Fouls' },
                { key: 'corner_kicks', label: 'Corner Kicks' },
                { key: 'offsides', label: 'Offsides' },
                { key: 'yellow_cards', label: 'Yellow Cards' },
                { key: 'red_cards', label: 'Red Cards' },
                { key: 'throwin', label: 'Throw-ins' },
                { key: 'goalkick', label: 'Goal Kicks' },
                { key: 'freekick', label: 'Free Kicks' }
            ];

            fields.forEach(field => {
                let hVal = parseInt(homeStats[field.key] || 0);
                let aVal = parseInt(awayStats[field.key] || 0);
                let maxVal = Math.max(hVal, aVal);
                let hPct = maxVal > 0 ? Math.round((hVal / maxVal) * 100) : 50;
                let aPct = maxVal > 0 ? Math.round((aVal / maxVal) * 100) : 50;

                if (field.key === 'passes_percentage') {
                    hVal = hVal + '%';
                    aVal = aVal + '%';
                    hPct = parseInt(homeStats[field.key] || 50);
                    aPct = parseInt(awayStats[field.key] || 50);
                }

                html += `<div class="stat-row">
                    <div class="home-val">${hVal}</div>
                    <div class="stat-label">${field.label}</div>
                    <div class="away-val">${aVal}</div>
                </div>
                <div class="stat-line">
                    <div class="stat-line-home" style="width: ${hPct}%"></div>
                    <div class="stat-line-away" style="width: ${aPct}%"></div>
                </div>`;
            });

            html += '</div>';
            return html;
        }

        // ============================================================
        //  H2H
        // ============================================================

        function renderH2H(h2h, info) {
            if (!h2h || Object.keys(h2h).length === 0) return '<p class="text-center text-muted">No H2H data</p>';

            let homeWins = 0, draws = 0, awayWins = 0;
            for (const matchId in h2h) {
                const h = h2h[matchId];
                if (h && h.win === 'win1') homeWins++;
                else if (h && h.win === 'win2') awayWins++;
                else if (h) draws++;
            }

            let html = `<div class="h2h-flex">
                <div class="h2h-team">
                    <img src="${IMG_BASE_TEAM + info.home_team.image}" onclick="openTeamModal(${info.home_team.row_id})">
                    <span onclick="openTeamModal(${info.home_team.row_id})">${info.home_team.title}</span>
                </div>
                <div class="h2h-center">
                    <div class="h2h-stat"><span class="num">${homeWins}</span><span class="lbl">Win</span></div>
                    <div class="h2h-stat"><span class="num">${draws}</span><span class="lbl">Draw</span></div>
                    <div class="h2h-stat"><span class="num">${awayWins}</span><span class="lbl">Win</span></div>
                </div>
                <div class="h2h-team">
                    <img src="${IMG_BASE_TEAM + info.away_team.image}" onclick="openTeamModal(${info.away_team.row_id})">
                    <span onclick="openTeamModal(${info.away_team.row_id})">${info.away_team.title}</span>
                </div>
            </div>`;

            const recentMatches = Object.values(h2h).filter(m => m && m.home_team && m.away_team).slice(0, 5);
            if (recentMatches.length > 0) {
                html += '<div class="mt-3"><strong>Recent Meetings</strong><div class="small">';
                recentMatches.forEach(m => {
                    const homeTitle = m.home_team.title || 'Home';
                    const awayTitle = m.away_team.title || 'Away';
                    const homeScore = m.home_scores !== undefined ? m.home_scores : '?';
                    const awayScore = m.away_scores !== undefined ? m.away_scores : '?';
                    const date = m.match_date || '';
                    html += `<div class="d-flex justify-content-between border-bottom py-1"><span>${homeTitle} ${homeScore} - ${awayScore} ${awayTitle}</span><span class="text-muted">${date}</span></div>`;
                });
                html += '</div></div>';
            }

            return html;
        }

        // ============================================================
        //  HEADER ACTIONS
        // ============================================================

        document.getElementById('themeToggleHeader')?.addEventListener('click', toggleTheme);

        document.getElementById('favoriteToggle')?.addEventListener('click', function() {
            this.classList.toggle('inactive');
            this.textContent = this.classList.contains('inactive') ? '☆' : '★';
        });

        document.getElementById('headerLangSelector')?.addEventListener('click', function(e) {
            e.stopPropagation();
            const menu = document.getElementById('langMenu');
            if (menu) {
                menu.classList.toggle('open');
            }
        });

        // ============================================================
        //  LANGUAGE MENU (floating - only for language and theme, no duplicate language button)
        // ============================================================

        const langFloat = document.createElement('div');
        langFloat.className = 'lang-float';
        langFloat.innerHTML = `
            <div class="lang-menu" id="langMenu" style="display:none;position:fixed;bottom:80px;right:30px;background:var(--card-bg);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.2);overflow:hidden;min-width:200px;z-index:3000;">
                <div class="menu-title" style="padding:10px 15px;font-size:0.8rem;color:#999;font-weight:600;">Language</div>
                <button class="lang-option" data-lang="ar" style="display:flex;align-items:center;gap:10px;padding:8px 15px;border:none;background:transparent;cursor:pointer;width:100%;font-size:0.95rem;transition:background 0.2s;color:var(--text-color);"><img src="https://flagcdn.com/sa.svg" style="width:24px;height:16px;object-fit:cover;border-radius:2px;"> العربية</button>
                <button class="lang-option" data-lang="en" style="display:flex;align-items:center;gap:10px;padding:8px 15px;border:none;background:transparent;cursor:pointer;width:100%;font-size:0.95rem;transition:background 0.2s;color:var(--text-color);"><img src="https://flagcdn.com/gb.svg" style="width:24px;height:16px;object-fit:cover;border-radius:2px;"> English</button>
                <button class="lang-option" data-lang="fr" style="display:flex;align-items:center;gap:10px;padding:8px 15px;border:none;background:transparent;cursor:pointer;width:100%;font-size:0.95rem;transition:background 0.2s;color:var(--text-color);"><img src="https://flagcdn.com/fr.svg" style="width:24px;height:16px;object-fit:cover;border-radius:2px;"> Français</button>
                <button class="lang-option" data-lang="es" style="display:flex;align-items:center;gap:10px;padding:8px 15px;border:none;background:transparent;cursor:pointer;width:100%;font-size:0.95rem;transition:background 0.2s;color:var(--text-color);"><img src="https://flagcdn.com/es.svg" style="width:24px;height:16px;object-fit:cover;border-radius:2px;"> Español</button>
                <button class="lang-option" data-lang="it" style="display:flex;align-items:center;gap:10px;padding:8px 15px;border:none;background:transparent;cursor:pointer;width:100%;font-size:0.95rem;transition:background 0.2s;color:var(--text-color);"><img src="https://flagcdn.com/it.svg" style="width:24px;height:16px;object-fit:cover;border-radius:2px;"> Italiano</button>
                <button class="lang-option" data-lang="pt" style="display:flex;align-items:center;gap:10px;padding:8px 15px;border:none;background:transparent;cursor:pointer;width:100%;font-size:0.95rem;transition:background 0.2s;color:var(--text-color);"><img src="https://flagcdn.com/pt.svg" style="width:24px;height:16px;object-fit:cover;border-radius:2px;"> Português</button>
                <button class="lang-option" data-lang="br" style="display:flex;align-items:center;gap:10px;padding:8px 15px;border:none;background:transparent;cursor:pointer;width:100%;font-size:0.95rem;transition:background 0.2s;color:var(--text-color);"><img src="https://flagcdn.com/br.svg" style="width:24px;height:16px;object-fit:cover;border-radius:2px;"> Brasileiro</button>
                <div style="border-top:1px solid #eee;margin:5px 0;"></div>
                <div class="menu-title" style="padding:10px 15px 5px 15px;font-size:0.8rem;color:#999;font-weight:600;">Theme</div>
                <div class="theme-toggle" id="themeToggleItem" style="display:flex;align-items:center;justify-content:space-between;padding:8px 15px;cursor:pointer;">
                    <span style="font-size:0.95rem;color:var(--text-color);">🌓 Dark Mode</span>
                    <div class="toggle-switch" id="themeSwitch" style="width:40px;height:22px;background:#ccc;border-radius:11px;position:relative;transition:background 0.3s;cursor:pointer;">
                        <div class="toggle-dot" style="width:18px;height:18px;background:white;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform 0.3s;"></div>
                    </div>
                </div>
            </div>
        `;
        document.body.appendChild(langFloat);

        const langMenu = document.getElementById('langMenu');
        document.querySelectorAll('.lang-option').forEach(btn => {
            btn.addEventListener('click', () => {
                setLanguage(btn.dataset.lang);
                langMenu.style.display = 'none';
            });
        });

        // Theme toggle in menu
        const themeSwitch = document.getElementById('themeSwitch');
        const themeToggleItem = document.getElementById('themeToggleItem');
        themeToggleItem?.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleTheme();
        });
        themeSwitch?.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleTheme();
        });

        // Update theme switch state
        function updateThemeSwitch(theme) {
            const sw = document.getElementById('themeSwitch');
            if (sw) {
                sw.classList.toggle('active', theme === 'dark');
                const dot = sw.querySelector('.toggle-dot');
                if (dot) {
                    dot.style.transform = theme === 'dark' ? 'translateX(18px)' : 'translateX(0)';
                }
                sw.style.background = theme === 'dark' ? '#0d6efd' : '#ccc';
            }
        }

        // Override updateThemeUI to include the switch
        const origUpdateThemeUI = updateThemeUI;
        updateThemeUI = function(theme) {
            origUpdateThemeUI(theme);
            updateThemeSwitch(theme);
        };

        // Show/hide language menu on header click
        document.getElementById('headerLangSelector')?.addEventListener('click', function(e) {
            e.stopPropagation();
            if (langMenu.style.display === 'block') {
                langMenu.style.display = 'none';
            } else {
                langMenu.style.display = 'block';
            }
        });

        document.addEventListener('click', function() {
            langMenu.style.display = 'none';
        });

        // ============================================================
        //  INIT
        // ============================================================

        loadTheme();
        initLanguageSystem();
        updateDateUI();
        loadChampionships();
        loadStreamEvents();
        loadLiveAndTodayMatches();
        initScrollProgress();

        window.toggleTheme = toggleTheme;
        window.openTeamModal = openTeamModal;
        window.openPlayerModal = openPlayerModal;
        window.openCoachModal = openCoachModal;
        window.openRefereeModal = openRefereeModal;
        window.quickSelectChampionship = quickSelectChampionship;
    </script>
</body>
    </html>
