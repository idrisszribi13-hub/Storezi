<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSScores - مطابق للصور مع كل التفاصيل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #00A59E;
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-muted: #6c757d;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); font-size: 0.85rem; color: #333; }
        .container-fluid { max-width: 1200px; padding: 0; }
        
        /* ---- العناصر الرئيسية ---- */
        .main-header { background: #fff; padding: 15px; border-bottom: 1px solid #e9ecef; }
        .page-title { font-size: 1.1rem; font-weight: 700; }
        
        /* التبويبات الرئيسية */
        .nav-tabs { border-bottom: 1px solid #e9ecef; background: #fff; }
        .nav-tabs .nav-link {
            color: #6c757d;
            font-weight: 700;
            border: none;
            border-bottom: 3px solid transparent;
            border-radius: 0;
            padding: 10px 5px;
            font-size: 0.85rem;
        }
        .nav-tabs .nav-link.active { color: var(--primary-green); border-bottom: 3px solid var(--primary-green); background: transparent; }
        
        /* الترويسة / الشريط العلوي */
        .top-bar { background: #fff; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .team-score-box { display: flex; align-items: center; justify-content: center; gap: 15px; text-align: center; }
        .team-logo-lg { width: 50px; height: 50px; object-fit: contain; }
        .score-text { font-size: 2rem; font-weight: 800; }
        .status-pill { background: #e9ecef; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
        
        /* البطاقات */
        .card { border: none; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-body { padding: 10px; }
        
        /* تنسيق عناوين البطاقات */
        .section-title { font-size: 0.9rem; font-weight: 700; margin: 15px 0 10px; color: #495057; }
        
        /* القوائم */
        .list-group-item { font-size: 0.85rem; border: none; padding: 8px 10px; border-bottom: 1px solid #f8f9fa; }
        
        /* جداول الترتيب - مضغوطة جداً */
        .table { font-size: 0.8rem; margin-bottom: 0; }
        .table thead th { font-size: 0.7rem; color: var(--text-muted); background: #f8f9fa; border-bottom: 1px solid #dee2e6; }
        .table tbody td { vertical-align: middle; }
        .team-logo { width: 20px; height: 20px; object-fit: contain; margin-left: 5px; }
        
        /* عناصر التحديد (Pills) */
        .selector-pill { background: #e9ecef; border-radius: 25px; padding: 3px; display: inline-flex; }
        .selector-pill .pill { padding: 5px 15px; border-radius: 25px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
        .selector-pill .pill.active { background: var(--primary-green); color: #fff; }
        
        /* عناصر الإحصائيات (Progress Bars) */
        .stats-row { display: flex; align-items: center; margin-bottom: 12px; }
        .stats-val { width: 40px; font-weight: 700; font-size: 0.9rem; }
        .stats-label { flex: 1; text-align: center; font-size: 0.8rem; color: var(--text-muted); }
        .stats-bar { height: 6px; border-radius: 4px; flex: 2; margin: 0 10px; }
        .stats-bar .left { height: 100%; border-radius: 4px; background: #3b82f6; }
        .stats-bar .right { height: 100%; border-radius: 4px; background: #6b21a8; }
        
        /* صفحة الفريق (Team Page) */
        .team-page-header { text-align: center; padding: 20px; background: #fff; }
        .team-logo-big { width: 80px; height: 80px; }
        .icon-btn { cursor: pointer; color: #555; font-size: 1.2rem; }
        .achievement-card { background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; }
        .coach-card { display: flex; align-items: center; gap: 10px; padding: 10px; background: #fff; border-radius: 8px; border: 1px solid #eee; margin-bottom: 10px; }
        .coach-card img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        /* وضع الهاتف (Mobile) */
        @media (max-width: 768px) {
            body { font-size: 0.75rem; }
            .top-bar { padding: 10px; }
            .team-logo-lg { width: 35px; height: 35px; }
            .score-text { font-size: 1.5rem; }
            .nav-tabs .nav-link { font-size: 0.75rem; padding: 8px 2px; }
            .table { font-size: 0.7rem; }
            .d-none-mobile { display: none !important; }
            .team-score-box { gap: 10px; }
            .team-logo-big { width: 60px; height: 60px; }
        }
        
        .hidden { display: none; }
        .loader { text-align: center; padding: 30px; }
        .error-message { text-align: center; padding: 30px; color: #dc3545; }
    </style>
</head>
<body>
    <div class="container-fluid py-3">
        <!-- اختر البطولة -->
        <div class="mb-3 bg-white p-2 rounded">
            <select id="championshipSelect" class="form-select form-select-sm">
                <option value="">اختر البطولة (Championship)</option>
            </select>
        </div>

        <!-- التبويبات الرئيسية -->
        <div id="mainTabsContainer" class="hidden">
            <ul class="nav nav-tabs" id="mainTabs" role="tablist">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#matches">Matches</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#standings">Standings</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#scorers">Scorers</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#assists">Assists</button></li>
            </ul>
            
            <div class="tab-content bg-white rounded-bottom shadow-sm" id="mainTabsContent">
                <div class="tab-pane fade show active" id="matches"><div id="matchesContent" class="p-2"></div></div>
                <div class="tab-pane fade" id="standings"><div id="standingsContent" class="p-2"></div></div>
                <div class="tab-pane fade" id="scorers"><div id="scorersContent" class="p-2"></div></div>
                <div class="tab-pane fade" id="assists"><div id="assistsContent" class="p-2"></div></div>
            </div>
        </div>

        <!-- مؤشر التحميل -->
        <div id="loadingIndicator" class="loader hidden">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2">جاري التحميل...</p>
        </div>
        <div id="errorIndicator" class="error-message hidden"></div>
    </div>

    <!-- Modal تفاصيل المباراة -->
    <div class="modal fade" id="matchModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">مباراة</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <!-- رأس المباراة -->
                    <div id="matchHeaderContent" class="top-bar"></div>
                    <!-- التبويبات الداخلية -->
                    <ul class="nav nav-tabs" id="matchInnerTabs">
                        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabEvents">Events</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabDetails">Details</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabLineups">Lineups</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabStats">Statistics</button></li>
                    </ul>
                    <div class="tab-content p-3" id="matchInnerContent">
                        <div class="tab-pane fade show active" id="tabEvents"><div id="eventsBox"></div></div>
                        <div class="tab-pane fade" id="tabDetails"><div id="detailsBox"></div></div>
                        <div class="tab-pane fade" id="tabLineups"><div id="lineupsBox"></div></div>
                        <div class="tab-pane fade" id="tabStats"><div id="statsBox"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal صفحة الفريق -->
    <div class="modal fade" id="teamModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    <div class="d-flex gap-3">
                        <span class="icon-btn">☆</span>
                        <span class="icon-btn">⤴</span>
                    </div>
                </div>
                <div class="modal-body p-0">
                    <div id="teamHeaderContent" class="team-page-header"></div>
                    <ul class="nav nav-tabs" id="teamTabs">
                        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#teamTabInfo">Information</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#teamTabStats">Statistics</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#teamTabPlayers">Players</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#teamTabTransfers">Transfers</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#teamTabMatches">Matches</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#teamTabNews">News</button></li>
                    </ul>
                    <div class="tab-content p-3" id="teamTabsContent">
                        <div class="tab-pane fade show active" id="teamTabInfo"><div id="teamInfoBox"></div></div>
                        <div class="tab-pane fade" id="teamTabStats"><div id="teamStatsBox"></div></div>
                        <div class="tab-pane fade" id="teamTabPlayers"><div id="teamPlayersBox"></div></div>
                        <div class="tab-pane fade" id="teamTabTransfers"><div id="teamTransfersBox"></div></div>
                        <div class="tab-pane fade" id="teamTabMatches"><div id="teamMatchesBox"></div></div>
                        <div class="tab-pane fade" id="teamTabNews"><div id="teamNewsBox"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal صفحة اللاعب -->
    <div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-0">
                    <div id="playerHeaderContent" class="bg-white p-4 text-center border-bottom">
                        <img id="playerModalImg" src="" class="team-logo-big mb-2" onerror="this.style.display='none'">
                        <h4 id="playerModalTitle" class="fw-bold mb-0"></h4>
                    </div>
                    <div class="p-4">
                        <div id="playerStatsBox"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // الإعدادات
        const PROXY_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co/functions/v1/proxy';
        const API_BASE = 'https://api-en.ysscores.com/api';
        const NEWS_BASE = 'https://news-en.ysscores.com/api';
        const IMG_TEAM = 'https://imgs.ysscores.com/teams/150/';
        const IMG_PLAYER = 'https://imgs.ysscores.com/player/150/';

        let currentChamp = null;

        // دوال مساعدة
        const showLoading = () => { document.getElementById('loadingIndicator').classList.remove('hidden'); };
        const hideLoading = () => { document.getElementById('loadingIndicator').classList.add('hidden'); };

        async function fetchProxy(url) {
            const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(url)}`);
            if (!res.ok) throw new Error("Network Error");
            return await res.json();
        }

        // --- 1. تحميل البطولات ---
        async function loadChamps() {
            showLoading();
            try {
                const data = await fetchProxy(`${API_BASE}/info/championship_ranking/L/60`);
                const select = document.getElementById('championshipSelect');
                select.innerHTML = '<option value="">-- اختر بطولة --</option>';
                data.data.forEach(c => {
                    select.innerHTML += `<option value="${c.url_id}" data-type="${c.type}">${c.title}</option>`;
                });
            } catch (e) { console.error(e); }
            hideLoading();
        }

        document.getElementById('championshipSelect').addEventListener('change', async function() {
            currentChamp = { id: this.value, type: this.options[this.selectedIndex].dataset.type };
            document.getElementById('mainTabsContainer').classList.remove('hidden');
            
            document.getElementById('matches').classList.add('show', 'active');
            document.getElementById('standings').classList.remove('show', 'active');
            document.getElementById('scorers').classList.remove('show', 'active');
            document.getElementById('assists').classList.remove('show', 'active');

            loadMatches();
            loadStandings();
            loadScorers();
            loadAssists();
        });

        // --- 2. تحميل المباريات ---
        async function loadMatches() {
            if (!currentChamp) return;
            const url = `${API_BASE}/matches/championship_matches/${currentChamp.id}/L/60`;
            const data = await fetchProxy(url);
            let html = '<div class="section-title text-muted">Upcoming Matches</div>';
            
            const matches = data.data.coming.data;
            if (matches.length) {
                html += `<div class="card mb-3"><div class="card-body p-0">`;
                matches.forEach(m => {
                    html += `
                    <div class="d-flex justify-content-between align-items-center border-bottom p-2" style="cursor:pointer;" onclick="openMatchDetails(${m.match_id})">
                        <div class="w-25 text-start"><img src="${IMG_TEAM + m.home_team.image}" class="team-logo"> ${m.home_team.title}</div>
                        <div class="text-center small text-muted">${m.match_date}<br>${m.match_time}</div>
                        <div class="w-25 text-end"><strong>${m.away_team.title}</strong> <img src="${IMG_TEAM + m.away_team.image}" class="team-logo"></div>
                    </div>`;
                });
                html += `</div></div>`;
            } else {
                html += '<p class="text-center text-muted p-3">لا توجد مباريات قادمة</p>';
            }

            html += '<div class="section-title text-muted mt-3">Full-Time Matches</div>';
            const ended = data.data.end.data;
            if (ended.length) {
                html += `<div class="card"><div class="card-body p-0">`;
                ended.forEach(m => {
                    html += `
                    <div class="d-flex justify-content-between align-items-center border-bottom p-2" style="cursor:pointer;" onclick="openMatchDetails(${m.match_id})">
                        <div class="w-25 text-start"><img src="${IMG_TEAM + m.home_team.image}" class="team-logo"> ${m.home_team.title}</div>
                        <div class="text-center fw-bold">${m.home_scores} - ${m.away_scores}</div>
                        <div class="w-25 text-end"><strong>${m.away_team.title}</strong> <img src="${IMG_TEAM + m.away_team.image}" class="team-logo"></div>
                    </div>`;
                });
                html += `</div></div>`;
            }
            document.getElementById('matchesContent').innerHTML = html;
        }

        // --- 3. تحميل الترتيب ---
        async function loadStandings() {
            if (!currentChamp) return;
            let url;
            if (currentChamp.type == 1) url = `${API_BASE}/matches/league_standing_stage/${currentChamp.id}`;
            else url = `${API_BASE}/matches/cups_teams_standings/${currentChamp.id}/L/60`;
            
            const data = await fetchProxy(url);
            let teams = data.data?.league?.stage0 || [];
            let html = `<div class="table-responsive"><table class="table table-striped text-center">
                <thead><tr><th>#</th><th class="text-start">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th class="d-none-mobile">Goals</th><th class="d-none-mobile">Diff</th><th>Pts</th></tr></thead>
                <tbody>`;
            teams.forEach((t, i) => {
                html += `<tr>
                    <td>${i+1}</td>
                    <td class="text-start"><img src="${IMG_TEAM + t.team_name.image}" class="team-logo" onclick="openTeamDetails(${t.team_name.row_id})" style="cursor:pointer;"> ${t.team_name.title}</td>
                    <td>${t.play}</td><td>${t.wins}</td><td>${t.draw}</td><td>${t.lose}</td>
                    <td class="d-none-mobile">${t.for}:${t.against}</td><td class="d-none-mobile">${t.diff}</td>
                    <td class="fw-bold">${t.points}</td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('standingsContent').innerHTML = html;
        }

        // --- 4. الهدافون وصناع اللعب ---
        async function loadScorers() {
            const data = await fetchProxy(`${API_BASE}/matches/league_scorers_map/${currentChamp.id}?page=1`);
            let html = '<ul class="list-group list-group-flush">';
            data.data.data.forEach(p => {
                html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    <div><img src="${IMG_PLAYER + p.player_info.image}" class="me-2" style="width:25px;height:25px;border-radius:50%;"> ${p.player_info.title} <small class="text-muted d-none-mobile">(${p.player_info.team_name})</small></div>
                    <span class="badge bg-primary rounded-pill">${p.goals}</span>
                </li>`;
            });
            html += '</ul>';
            document.getElementById('scorersContent').innerHTML = html;
        }
        
        async function loadAssists() {
            const data = await fetchProxy(`${API_BASE}/matches/league_assists_map/${currentChamp.id}?page=1`);
            let html = '<ul class="list-group list-group-flush">';
            data.data.data.forEach(p => {
                html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    <div><img src="${IMG_PLAYER + p.player_info.image}" class="me-2" style="width:25px;height:25px;border-radius:50%;"> ${p.player_info.title} <small class="text-muted d-none-mobile">(${p.player_info.team_name})</small></div>
                    <span class="badge bg-secondary rounded-pill">${p.assist}</span>
                </li>`;
            });
            html += '</ul>';
            document.getElementById('assistsContent').innerHTML = html;
        }

        // --- 5. تفاصيل المباراة ---
        async function openMatchDetails(matchId) {
            const modal = new bootstrap.Modal(document.getElementById('matchModal'));
            
            const [infoD, eventsD, lineupD, statsD] = await Promise.all([
                fetchProxy(`${API_BASE}/matches/match_info/${matchId}/L/60`),
                fetchProxy(`${API_BASE}/matches/matches_event/${matchId}`),
                fetchProxy(`${API_BASE}/matches/matches_lineup/${matchId}`),
                fetchProxy(`${API_BASE}/matches/statics_match/${matchId}`)
            ]);

            const info = infoD.data;
            document.getElementById('matchHeaderContent').innerHTML = `
                <div class="top-bar w-100">
                    <div class="d-flex align-items-center gap-2">
                        <img src="${IMG_TEAM + info.home_team.image}" class="team-logo-lg">
                        <div class="text-center"><small>${info.home_team.title}</small></div>
                    </div>
                    <div class="text-center">
                        <div class="score-text">${info.home_scores} - ${info.away_scores}</div>
                        <span class="status-pill mt-1">Ended</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="text-center"><small>${info.away_team.title}</small></div>
                        <img src="${IMG_TEAM + info.away_team.image}" class="team-logo-lg">
                    </div>
                </div>
            `;

            let eventsHtml = `<div class="selector-pill mb-3"><span class="pill active">Top</span><span class="pill">All</span></div><ul class="list-group list-group-flush">`;
            const evs = eventsD.data.events || [];
            if (evs.length > 0) {
                evs.forEach(e => {
                    let icon = '<span class="text-muted">⚪</span>';
                    if (e.type == 1 || e.type == 5) icon = '<span class="text-success">⚽</span>';
                    if (e.type == 2) icon = '<span class="text-warning">🟨</span>';
                    if (e.type == 8) icon = '<span class="text-info">🔁</span>';
                    let title = e.player_name ? e.player_name.title : '';
                    let ass = e.sub_player_name ? e.sub_player_name.title : '';
                    eventsHtml += `
                    <li class="list-group-item d-flex justify-content-between align-items-center small">
                        <div style="min-width: 40px;">${icon}</div>
                        <div class="text-start flex-grow-1 ms-2"><div>${title}</div><small class="text-muted">${ass}</small></div>
                        <div class="text-muted fw-bold">${e.time_minute}'</div>
                    </li>`;
                });
            } else {
                eventsHtml += '<li class="list-group-item text-center text-muted">لا توجد أحداث</li>';
            }
            eventsHtml += '</ul>';
            document.getElementById('eventsBox').innerHTML = eventsHtml;

            document.getElementById('detailsBox').innerHTML = `
                <div class="list-group list-group-flush">
                    <div class="list-group-item d-flex justify-content-between"><span class="text-muted">Stadium</span><span>${info.Stadium || 'N/A'}</span></div>
                    <div class="list-group-item d-flex justify-content-between"><span class="text-muted">Referee</span><span>${info.referee || 'N/A'}</span></div>
                    <div class="list-group-item d-flex justify-content-between"><span class="text-muted">Time</span><span>${info.match_time || 'N/A'}</span></div>
                    <div class="list-group-item d-flex justify-content-between"><span class="text-muted">Date</span><span>${info.match_date || 'N/A'}</span></div>
                </div>
                <div class="section-title text-muted">Channels & Commentators</div>
                <div class="card p-2 mb-2"><small>beIN Sports 1 - Hafeez Darraji</small></div>
                <div class="card p-2"><small>beIN 4K - Hafeez Darraji</small></div>
            `;

            let lineupHtml = `<div class="section-title text-muted">Coach</div><div class="card p-2 mb-3">${lineupD.data?.coach?.title || 'N/A'}</div>`;
            lineupHtml += `<div class="section-title text-muted">Substitutions</div>`;
            const lineups = lineupD.data?.lineup;
            if (lineups) {
                for (const teamId in lineups) {
                    const team = lineups[teamId];
                    lineupHtml += `<div class="card p-2 mb-2"><small class="text-muted">${team.team_name}</small><ul class="mt-2">`;
                    team.lineup.forEach(p => {
                        lineupHtml += `<li class="d-flex justify-content-between"><span>${p.player.title}</span><small class="text-muted">${p.player.position || ''}</small></li>`;
                    });
                    lineupHtml += '</ul></div>';
                }
            } else lineupHtml += '<p class="text-center text-muted">غير متوفر</p>';
            document.getElementById('lineupsBox').innerHTML = lineupHtml;

            let statsHtml = '<div class="section-title text-muted">Statistics</div>';
            const statData = statsD.data?.statics;
            if (statData) {
                const homeStats = statData[info.home_team.row_id] || {};
                const awayStats = statData[info.away_team.row_id] || {};
                const map = [
                    { label: 'Possession', h: homeStats.ball_possession || 0, a: awayStats.ball_possession || 0, unit: '%' },
                    { label: 'Total Shots', h: homeStats.total_shots || 0, a: awayStats.total_shots || 0, unit: '' },
                    { label: 'Shots On Target', h: homeStats.shots_on_target || 0, a: awayStats.shots_on_target || 0, unit: '' },
                    { label: 'Corners', h: homeStats.corners || 0, a: awayStats.corners || 0, unit: '' },
                    { label: 'Fouls', h: homeStats.fouls || 0, a: awayStats.fouls || 0, unit: '' }
                ];
                map.forEach(stat => {
                    const total = parseInt(stat.h) + parseInt(stat.a);
                    const hPct = total > 0 ? (stat.h / total * 100) : 50;
                    const aPct = 100 - hPct;
                    statsHtml += `
                    <div class="stats-row">
                        <div class="stats-val">${stat.h}${stat.unit}</div>
                        <div class="stats-label">${stat.label}</div>
                        <div class="stats-val text-start">${stat.a}${stat.unit}</div>
                    </div>
                    <div class="d-flex mb-3">
                        <div class="stats-bar"><div class="left" style="width:${hPct}%"></div></div>
                        <div class="stats-bar"><div class="right" style="width:${aPct}%"></div></div>
                    </div>`;
                });
            } else statsHtml += '<p class="text-center text-muted">لا توجد بيانات</p>';
            document.getElementById('statsBox').innerHTML = statsHtml;

            modal.show();
        }

        // --- 6. تفاصيل الفريق (محدث مع إحصائيات، مدرب، وأخبار) ---
        async function openTeamDetails(teamId) {
            const modal = new bootstrap.Modal(document.getElementById('teamModal'));
            
            const [infoD, playersD, transD, teamMatchesD, teamStatsD, teamNewsD] = await Promise.all([
                fetchProxy(`${API_BASE}/info/team_info/${teamId}/L/60`),
                fetchProxy(`${API_BASE}/info/players_team/${teamId}`),
                fetchProxy(`${API_BASE}/info/transfer_info_team/${teamId}?page=1`),
                fetchProxy(`${API_BASE}/matches/team_matches/${teamId}/L/60`),
                fetchProxy(`${API_BASE}/info/team_page/${teamId}`).catch(() => ({data: {}})),
                fetchProxy(`${NEWS_BASE}/News/news_team/${teamId}?page=1`).catch(() => ({data: {data: []}}))
            ]);

            const info = infoD.data;
            const coach = playersD.data.coach || {};
            const teamStats = teamStatsD.data || {};
            const news = teamNewsD.data.data || [];

            // رأس صفحة الفريق
            document.getElementById('teamHeaderContent').innerHTML = `
                <img src="${IMG_TEAM + info.image}" class="team-logo-big mb-2">
                <h3 class="fw-bold mb-0">${info.title}</h3>
                <small class="text-muted">${info.country ? info.country.title : ''}</small>
            `;

            // 1. تبويب المعلومات (مع Coach Info)
            document.getElementById('teamInfoBox').innerHTML = `
                <div class="section-title text-muted">Championships and Achievements</div>
                <div class="row g-2 mb-3">
                    <div class="col-4"><div class="achievement-card"><img src="${IMG_TEAM + info.image}" class="team-logo" style="width:30px;height:30px;"><small>FA Cup<br>22</small></div></div>
                    <div class="col-4"><div class="achievement-card"><img src="${IMG_TEAM + info.image}" class="team-logo" style="width:30px;height:30px;"><small>PL<br>14</small></div></div>
                    <div class="col-4"><div class="achievement-card"><img src="${IMG_TEAM + info.image}" class="team-logo" style="width:30px;height:30px;"><small>UCL<br>1</small></div></div>
                </div>
                
                <!-- قسم Coach Info -->
                <div class="section-title text-muted">Coach Info</div>
                <div class="coach-card">
                    <img src="${IMG_PLAYER + (coach.image || '')}" onerror="this.style.display='none'">
                    <div>
                        <strong>${coach.title || 'N/A'}</strong><br>
                        <small class="text-muted">${coach.nationality || 'N/A'} | ${coach.birth_date || 'N/A'}</small>
                    </div>
                </div>

                <div class="list-group list-group-flush">
                    <div class="list-group-item d-flex justify-content-between"><span class="text-muted">Country</span><strong>${info.country ? info.country.title : 'N/A'}</strong></div>
                    <div class="list-group-item d-flex justify-content-between"><span class="text-muted">Stadium</span><strong>${info.stadium_name || 'N/A'}</strong></div>
                    <div class="list-group-item d-flex justify-content-between"><span class="text-muted">Division</span><strong>First Division</strong></div>
                </div>
                <div class="section-title text-muted mt-3">Team Profile</div>
                <div class="card p-2"><small>${info.about || 'لا يوجد وصف'}</small></div>
            `;

            // 2. تبويب الإحصائيات (Team Statistics)
            let statsHtml = '<div class="section-title text-muted">Team Statistics</div>';
            const tp = teamStats.team_page || {}; 
            // افتراضياً، نجمع إحصائيات بسيطة من صفحة الفريق
            const totals = {
                wins: tp.wins || 0,
                draws: tp.draws || 0,
                losses: tp.losses || 0,
                goals_for: tp.goals_for || 0,
                goals_against: tp.goals_against || 0,
                appearances: tp.appearances || 0
            };
            
            statsHtml += `
                <div class="card p-2 mb-2">
                    <div class="d-flex justify-content-between">
                        <span><small class="text-muted">Appearances</small><br><strong>${totals.appearances}</strong></span>
                        <span><small class="text-muted">Wins</small><br><strong>${totals.wins}</strong></span>
                        <span><small class="text-muted">Draws</small><br><strong>${totals.draws}</strong></span>
                        <span><small class="text-muted">Losses</small><br><strong>${totals.losses}</strong></span>
                    </div>
                </div>
                <div class="card p-2">
                    <div class="d-flex justify-content-between">
                        <span><small class="text-muted">Goals For</small><br><strong>${totals.goals_for}</strong></span>
                        <span><small class="text-muted">Goals Against</small><br><strong>${totals.goals_against}</strong></span>
                        <span><small class="text-muted">Goal Diff</small><br><strong>${totals.goals_for - totals.goals_against}</strong></span>
                    </div>
                </div>
            `;

            // 3. تبويب اللاعبين
            let playersHtml = '<div class="section-title text-muted">Players</div>';
            for (const pos in playersD.data) {
                if (pos === 'coach') continue;
                playersHtml += `<div class="card p-2 mb-2"><strong>${pos}</strong>`;
                playersD.data[pos].forEach(p => {
                    playersHtml += `<div class="d-flex align-items-center border-bottom py-1">
                        <img src="${IMG_PLAYER + p.image}" class="me-2" style="width:25px;height:25px;border-radius:50%;">
                        <div class="flex-grow-1"><strong>${p.title}</strong></div>
                        <span class="text-muted">${p.position || ''}</span>
                    </div>`;
                });
                playersHtml += '</div>';
            }
            document.getElementById('teamPlayersBox').innerHTML = playersHtml;

            // 4. تبويب الانتقالات
            let transHtml = '<div class="section-title text-muted">Latest Transfers</div>';
            (transD.data.all || []).forEach(t => {
                transHtml += `
                <div class="card p-2 mb-2">
                    <div class="d-flex justify-content-between">
                        <div><img src="${IMG_PLAYER + t.player_name.image}" class="me-2" style="width:25px;height:25px;border-radius:50%;"> ${t.player_name.title} <small class="text-muted">(${t.player_name.position || ''})</small></div>
                        <div><span class="text-success fw-bold">${t.value || 'Free'}</span></div>
                    </div>
                    <small class="text-muted d-flex justify-content-between mt-1">
                        <span>${t.team_out.title} → ${t.team_in.title}</span>
                        <span>${t.date_from}</span>
                    </small>
                </div>`;
            });
            document.getElementById('teamTransfersBox').innerHTML = transHtml;

            // 5. تبويب المباريات
            let teamMatchesHtml = '<div class="section-title text-muted">Matches</div>';
            if (teamMatchesD.data.coming && teamMatchesD.data.coming.data.length) {
                teamMatchesHtml += '<div class="card p-2 mb-2">';
                teamMatchesD.data.coming.data.forEach(m => {
                    teamMatchesHtml += `
                    <div class="d-flex justify-content-between align-items-center border-bottom py-1">
                        <div class="w-25 text-start">${m.home_team.title}</div>
                        <div class="text-center small text-muted">vs</div>
                        <div class="w-25 text-end">${m.away_team.title}</div>
                    </div>`;
                });
                teamMatchesHtml += '</div>';
            } else {
                teamMatchesHtml += '<p class="text-center text-muted">لا توجد مباريات</p>';
            }
            document.getElementById('teamMatchesBox').innerHTML = teamMatchesHtml;

            // 6. تبويب الأخبار (News)
            let newsHtml = '<div class="section-title text-muted">Latest News</div>';
            if (news.length > 0) {
                news.forEach(item => {
                    newsHtml += `
                    <div class="d-flex align-items-center gap-2 border-bottom pb-2 mb-2">
                        <img src="https://imgs.ysscores.com/news/150/${item.image}" class="rounded" style="width: 60px; height: 60px; object-fit: cover;" onerror="this.style.display='none'">
                        <div>
                            <strong>${item.title}</strong><br>
                            <small class="text-muted">${item.created_at ? item.created_at.date : ''}</small>
                        </div>
                    </div>`;
                });
            } else {
                newsHtml += '<p class="text-center text-muted">لا توجد أخبار</p>';
            }
            document.getElementById('teamNewsBox').innerHTML = newsHtml;

            // تحديث النصوص المتبقية
            document.getElementById('teamStatsBox').innerHTML = statsHtml;

            modal.show();
        }

        // تشغيل عند البدء
        loadChamps();
    </script>
