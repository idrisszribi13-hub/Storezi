    <h3>📄 النتيجة:</h3>
    <pre id="output">⏳ انتظر...</pre>

    <script>
        function xorDecrypt(encodedBase64, key) {
            try {
                const binary = atob(encodedBase64);
                const keyBytes = new TextEncoder().encode(key);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                return null;
            }
        }

        function decrypt() {
            const baseKey = document.getElementById('baseKey').value.trim();
            const timestamp = document.getElementById('timestamp').value.trim();
            const encrypted = document.getElementById('encryptedData').value.trim();
            const output = document.getElementById('output');

            if (!encrypted) { output.textContent = '⚠️ يرجى إدخال البيانات المشفّرة.'; return; }
            if (!timestamp) { output.textContent = '⚠️ يرجى إدخال الطابع الزمني (رأس t).'; return; }

            const fullKey = baseKey + timestamp;
            output.textContent = '⏳ جاري فك التشفير...';

            try {
                const result = xorDecrypt(encrypted, fullKey);
                if (result) {
                    try { output.textContent = JSON.stringify(JSON.parse(result), null, 2); }
                    catch (_) { output.textContent = result; }
                } else {
                    output.textContent = '❌ فشل فك التشفير. تأكد من المفتاح والطابع الزمني.';
                }
            } catch (e) {
                output.textContent = '❌ خطأ: ' + e.message;
            }
        }

        async function fetchAndDecrypt(endpoint) {
            const output = document.getElementById('output');
            output.textContent = `⏳ جلب ${endpoint}...`;

            try {
                const response = await fetch(`https://def.yacinelive.com${endpoint}?code=`);
                const timestamp = response.headers.get('t') || '';
                document.getElementById('timestamp').value = timestamp;

                const encrypted = await response.text();
                document.getElementById('encryptedData').value = encrypted;

                const baseKey = document.getElementById('baseKey').value.trim();
                const fullKey = baseKey + timestamp;
                const result = xorDecrypt(encrypted, fullKey);

                if (result) {
                    try { output.textContent = JSON.stringify(JSON.parse(result), null, 2); }
                    catch (_) { output.textContent = result; }
                } else {
                    output.textContent = '❌ فشل فك التشفير بالمفتاح الحالي.';
                }
            } catch (e) {
                output.textContent = '❌ خطأ في الجلب: ' + e.message;
            }
        }

        window.onload = () => {
            // محاولة جلب Config تلقائياً
            fetchAndDecrypt('/api/config');
        };
    </script>
