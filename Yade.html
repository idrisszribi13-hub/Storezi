<html lang="ar" dir="rtl">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0b0e14;
            color: #fff;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 800px; width: 100%; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 10px;
            border-bottom: 2px solid #1e2a3a;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #ff3b30;
        }
        .header h1 i { margin-left: 8px; }
        .badge {
            background: #1e2a3a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #8e9aaf;
        }
        .badge i { color: #4caf50; font-size: 10px; }
        .event-card {
            background: #141a24;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 12px;
            border: 1px solid #1e2a3a;
            position: relative;
            overflow: hidden;
        }
        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: #ff3b30;
        }
        .event-card:hover { background: #1a2230; }
        .event-main {

            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .event-time {
            font-size: 14px;
            font-weight: 600;
            color: #8e9aaf;
            background: #0b0e14;
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid #1e2a3a;
            min-width: 70px;
            text-align: center;
        }
        .event-teams {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .event-teams .team {
            font-size: 15px;
            font-weight: 600;
            color: #f0f4fa;
        }
        .event-teams .team.away { color: #b0c4de; font-weight: 500; }
        .event-teams .vs { color: #5a6a7e; font-weight: 700; font-size: 12px; }
        .live-badge {
            background: #ff3b30;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            margin-right: 4px;
        }
        .event-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #1e2a3a;
        }
        .event-meta .league {
            font-size: 12px;
            color: #8e9aaf;
            background: #0b0e14;
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid #1e2a3a;
        }
        .event-meta .commentator {
            font-size: 12px;
            color: #b0c4de;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .event-meta .commentator i { color: #f5c842; font-size: 11px; }
        .event-meta .channel {
            font-size: 12px;
            font-weight: 600;
            color: #4fc3f7;
            background: #0b1a2a;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid #1a3a5a;
        }
        .key-input {
            background: #141a24;
            border: 1px solid #1e2a3a;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .key-input input, .key-input textarea {
            width: 100%;
            background: #0b0e14;
            border: 1px solid #2a3a50;
            border-radius: 6px;
            padding: 6px 12px;
            color: #fff;
            font-size: 13px;
            font-family: monospace;
        }
        .key-input textarea { height: 80px; }
        .key-input input:focus, .key-input textarea:focus { outline: none; border-color: #4fc3f7; }
        button {
            background: #4fc3f7;
            border: none;
            border-radius: 6px;
            padding: 8px 20px;
            color: #0b0e14;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        button.danger { background: #ff3b30; color: #fff; }
        .note {
            background: #1e2a3a;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: #b0c4de;
            margin-bottom: 16px;
            border-right: 4px solid #f5c842;
        }
        .note.success { border-right-color: #4caf50; }
        .note.error { border-right-color: #ff3b30; }
        pre {
            background: #141a24;
            padding: 15px;
            border-radius: 8px;
            overflow: auto;
            font-size: 12px;
            max-height: 400px;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        @media (max-width: 600px) {
            .event-main { gap: 8px; }
            .event-time { font-size: 12px; min-width: 60px; }
            .event-teams .team { font-size: 13px; }
            .event-meta .league, .event-meta .channel { font-size: 11px; padding: 2px 8px; }
        }
    </style>
</head>

<script>
    function xorDecrypt(encodedBase64, key) {
        try {
            const binary = atob(encodedBase64);
            const keyBytes = new TextEncoder().encode(key);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
            }
            return new TextDecoder('utf-8').decode(bytes);
        } catch (e) {
            return null;
        }
    }

    function renderEvents(events) {
        const list = document.getElementById('eventsList');
        const count = document.getElementById('liveCount');
        const noteArea = document.getElementById('noteArea');

        if (!events || events.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:40px;color:#8e9aaf;">لا توجد مباريات</div>';
            count.textContent = '0';
            return;
        }

        count.textContent = events.length;
        let html = '';
        events.forEach((ev, idx) => {
            const isLive = idx === 0;
            html += `
                <div class="event-card">
                    <div class="event-main">
                        <div class="event-time">${ev.time || '--:--'}</div>
                        <div class="event-teams">
                            <span class="team">${ev.homeTeam || '??'}</span>
                            <span class="vs">vs</span>
                            <span class="team away">${ev.awayTeam || '??'}</span>
                            ${isLive ? '<span class="live-badge">LIVE</span>' : ''}
                        </div>
                    </div>
                    <div class="event-meta">
                        <span class="league">${ev.league || ''}</span>
                        <span class="commentator"><i class="fas fa-microphone"></i> ${ev.commentator || ''}</span>
                        <span class="channel">${ev.channel || ''}</span>
                    </div>
                </div>
            `;
        });
        list.innerHTML = html;
        noteArea.innerHTML = `<div class="note success"><i class="fas fa-check-circle" style="margin-left:8px;"></i> ✅ تم عرض ${events.length} مباراة من البيانات الحقيقية!</div>`;
    }

    function decryptAndDisplay() {
        const baseKey = document.getElementById('baseKey').value.trim();
        const timestamp = document.getElementById('timestamp').value.trim();
        const encrypted = document.getElementById('encryptedData').value.trim();
        const output = document.getElementById('output');
        const list = document.getElementById('eventsList');
        const note = document.getElementById('noteArea');

        if (!encrypted) { note.innerHTML = `<div class="note error">⚠️ يرجى إدخال البيانات المشفّرة.</div>`; return; }
        if (!timestamp) { note.innerHTML = `<div class="note error">⚠️ يرجى إدخال الطابع الزمني (رأس t).</div>`; return; }

        const fullKey = baseKey + timestamp;
        const result = xorDecrypt(encrypted, fullKey);

        if (!result) {
            note.innerHTML = `<div class="note error">❌ فشل فك التشفير. تأكد من المفتاح والطابع الزمني.</div>`;
            return;
        }

        try {
            const json = JSON.parse(result);
            output.textContent = JSON.stringify(json, null, 2);
            output.style.display = 'block';

            // استخراج المباريات
            let events = [];
            if (json.events) events = json.events;
            else if (Array.isArray(json)) events = json;
            else {
                for (const key of Object.keys(json)) {
                    if (Array.isArray(json[key]) && json[key].length > 0) {
                        events = json[key];
                        break;
                    }
                }
            }
            renderEvents(events);
        } catch (e) {
            note.innerHTML = `<div class="note error">⚠️ النص مفكوك لكن ليس بصيغة JSON صالحة. عرض النص الخام:</div>`;
            output.textContent = result;
            output.style.display = 'block';
            list.innerHTML = '';
        }
    }

    function clearAll() {
        document.getElementById('output').style.display = 'none';
        document.getElementById('eventsList').innerHTML = '';
        document.getElementById('noteArea').innerHTML = '';
        document.getElementById('liveCount').textContent = '0';
    }
</script>
