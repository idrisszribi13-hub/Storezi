<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز البطولات - YSScores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #ffffff; font-size: 0.85rem; }
        .container-fluid { max-width: 1400px; padding: 10px 15px; }
        .champ-select { margin: 20px 0 15px; }
        
        /* تنسيق التبويبات ليشبه الصور */
        .nav-tabs { border-bottom: 2px solid #e9ecef; }
        .nav-tabs .nav-link { 
            font-weight: 700; 
            color: #6c757d;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            font-size: 0.9rem;
            padding: 10px 15px;
        }
        .nav-tabs .nav-link.active { 
            color: #0d6efd; 
            border-bottom: 3px solid #0d6efd; 
            background: transparent;
        }
        
        .tab-content { background: #fff; padding: 15px 5px; }
        
        /* تصغير الأيقونات والصور */
        .team-img { width: 20px; height: 20px; object-fit: contain; margin-left: 5px; }
        .player-img { width: 30px; height: 30px; object-fit: cover; border-radius: 50%; margin-left: 10px; }
        
        /* تحسين مظهر الجداول ليكون مضغوطاً جداً */
        .table { 
            margin-bottom: 0; 
            font-size: 0.85rem; 
            vertical-align: middle;
        }
        .table thead th { 
            font-size: 0.75rem; 
            color: #6c757d; 
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            white-space: nowrap;
        }
        .table tbody tr { border-bottom: 1px solid #f1f1f1; }
        
        /* تقليل حجم البطاقات */
        .card { border: none; border-bottom: 1px solid #eee; border-radius: 0; background: transparent; padding: 5px 0; }
        .card-body { padding: 5px 10px; }
        
        /* تحسين خريطة المواجهات */
        .bracket-match { 
            border: 1px solid #dee2e6; 
            border-radius: 6px; 
            padding: 5px; 
            margin: 5px 0; 
            background: #fff;
            font-size: 0.8rem;
        }
        .winner { background-color: #d1e7dd; border-color: #badbcc; }
        
        /* تحسين العناصر للأجهزة المحمولة */
        @media (max-width: 768px) {
            body { font-size: 0.75rem; }
            .nav-tabs .nav-link { font-size: 0.8rem; padding: 8px 10px; }
            .table { font-size: 0.75rem; }
            .d-none-mobile { display: none !important; } /* إخفاء الأعمدة غير المهمة في الموبايل */
        }
        
        .loader { text-align: center; padding: 30px; }
        .error-message { text-align: center; padding: 30px; color: #dc3545; }
        .hidden { display: none; }
        
        /* تنسيق عناوين القوائم في التبويبات */
        .section-title { font-size: 0.9rem; font-weight: 700; margin: 15px 0 10px; color: #333; border-right: 4px solid #0d6efd; padding-right: 8px; }
    </style>
</head>
<body>
    <div class="container-fluid py-3">
        <h3 class="text-center mb-3 fw-bold" style="font-size: 1.2rem;">🏆 مركز البطولات</h3>

        <!-- اختيار البطولة -->
        <div class="champ-select">
            <select id="championshipSelect" class="form-select form-select-sm">
                <option value="">-- اختر بطولة --</option>
            </select>
        </div>

        <!-- التبويبات -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="matches-tab" data-bs-toggle="tab" data-bs-target="#matches" type="button" role="tab">المباريات</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="standings-tab" data-bs-toggle="tab" data-bs-target="#standings" type="button" role="tab">الترتيب</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="scorers-tab" data-bs-toggle="tab" data-bs-target="#scorers" type="button" role="tab">الهدافون</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="assists-tab" data-bs-toggle="tab" data-bs-target="#assists" type="button" role="tab">الصناع</button>
            </li>
            <li class="nav-item" id="bracketTabItem" style="display:none;">
                <button class="nav-link" id="bracket-tab" data-bs-toggle="tab" data-bs-target="#bracket" type="button" role="tab">خريطة المواجهات</button>
            </li>
        </ul>

        <!-- محتوى التبويبات -->
        <div class="tab-content" id="mainTabsContent">
            <div class="tab-pane fade show active" id="matches" role="tabpanel">
                <div id="matchesContent" class="mt-2"></div>
            </div>
            <div class="tab-pane fade" id="standings" role="tabpanel">
                <div id="standingsContent" class="mt-2"></div>
            </div>
            <div class="tab-pane fade" id="scorers" role="tabpanel">
                <div id="scorersContent" class="mt-2"></div>
                <nav id="scorersPagination" aria-label="Page navigation"></nav>
            </div>
            <div class="tab-pane fade" id="assists" role="tabpanel">
                <div id="assistsContent" class="mt-2"></div>
                <nav id="assistsPagination" aria-label="Page navigation"></nav>
            </div>
            <div class="tab-pane fade" id="bracket" role="tabpanel">
                <div id="bracketContent" class="mt-2"></div>
            </div>
        </div>

        <!-- مؤشر التحميل -->
        <div id="loadingIndicator" class="loader hidden">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">جاري التحميل...</p>
        </div>
        <!-- رسالة خطأ -->
        <div id="errorIndicator" class="error-message hidden"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========== الإعدادات ==========
        const SUPABASE_PROXY_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co/functions/v1/proxy';
        const API_BASE = 'https://api-en.ysscores.com/api';
        const IMG_BASE_TEAM = 'https://imgs.ysscores.com/teams/150/';
        const IMG_BASE_PLAYER = 'https://imgs.ysscores.com/player/150/';

        let championshipsList = [];
        let currentChampionship = null;
        let currentTab = 'matches';

        // دوال مساعدة
        function showLoading() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('errorIndicator').classList.add('hidden');
        }
        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
        }
        function showError(msg) {
            document.getElementById('errorIndicator').textContent = msg;
            document.getElementById('errorIndicator').classList.remove('hidden');
        }

        // جلب البيانات عبر الوسيط
        async function fetchFromProxy(url) {
            const proxied = `${SUPABASE_PROXY_URL}?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxied);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        }

        // جلب قائمة البطولات
        async function loadChampionships() {
            try {
                showLoading();
                const url = `${API_BASE}/info/championship_ranking/L/60`;
                const data = await fetchFromProxy(url);
                if (data.status && data.data) {
                    championshipsList = data.data;
                    populateSelect(championshipsList);
                } else {
                    showError('فشل تحميل قائمة البطولات');
                }
            } catch (err) {
                console.error(err);
                showError('تعذر الاتصال بالخادم');
            } finally {
                hideLoading();
            }
        }

        function populateSelect(list) {
            const select = document.getElementById('championshipSelect');
            list.forEach(champ => {
                const opt = document.createElement('option');
                opt.value = champ.url_id;
                opt.textContent = champ.title;
                opt.dataset.type = champ.type || 1;
                opt.dataset.title = champ.title;
                select.appendChild(opt);
            });
        }

        // عند تغيير البطولة
        document.getElementById('championshipSelect').addEventListener('change', async function() {
            const selectedUrlId = this.value;
            if (!selectedUrlId) {
                document.getElementById('mainTabs').style.display = 'none';
                document.getElementById('mainTabsContent').style.display = 'none';
                return;
            }
            document.getElementById('mainTabs').style.display = '';
            document.getElementById('mainTabsContent').style.display = '';

            const selectedOption = this.options[this.selectedIndex];
            const type = parseInt(selectedOption.dataset.type);
            currentChampionship = {
                url_id: selectedUrlId,
                type: type,
                title: selectedOption.dataset.title
            };

            resetTabs();
            if (type === 4) {
                document.getElementById('bracketTabItem').style.display = '';
            } else {
                document.getElementById('bracketTabItem').style.display = 'none';
            }

            switchTab('matches');
        });

        function resetTabs() {
            document.querySelectorAll('#mainTabs .nav-link').forEach(link => link.classList.remove('active'));
            document.querySelectorAll('#mainTabsContent .tab-pane').forEach(pane => pane.classList.remove('show', 'active'));
            document.getElementById('matches-tab').classList.add('active');
            document.getElementById('matches').classList.add('show', 'active');
            currentTab = 'matches';
            ['matchesContent', 'standingsContent', 'scorersContent', 'assistsContent', 'bracketContent'].forEach(id => {
                document.getElementById(id).innerHTML = '';
            });
            document.getElementById('scorersPagination').innerHTML = '';
            document.getElementById('assistsPagination').innerHTML = '';
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('#mainTabs .nav-link').forEach(link => {
                link.classList.remove('active');
                if (link.id === tabName + '-tab') link.classList.add('active');
            });
            document.querySelectorAll('#mainTabsContent .tab-pane').forEach(pane => {
                pane.classList.remove('show', 'active');
                if (pane.id === tabName) pane.classList.add('show', 'active');
            });

            if (tabName === 'matches') loadMatches();
            else if (tabName === 'standings') loadStandings();
            else if (tabName === 'scorers') loadScorers(1);
            else if (tabName === 'assists') loadAssists(1);
            else if (tabName === 'bracket') loadBracket();
        }

        document.querySelectorAll('#mainTabs button[data-bs-toggle="tab"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const target = this.getAttribute('data-bs-target').substring(1);
                switchTab(target);
            });
        });

        // ========== تحميل المباريات (مضغوطة كالجدول) ==========
        async function loadMatches() {
            if (!currentChampionship) return;
            showLoading();
            try {
                const url = `${API_BASE}/matches/championship_matches/${currentChampionship.url_id}/L/60`;
                const data = await fetchFromProxy(url);
                const matchesContent = document.getElementById('matchesContent');
                let html = '';
                if (data.data) {
                    const { online, coming, end } = data.data;
                    if (online.data.length > 0) {
                        html += '<div class="section-title">المباشر</div>';
                        html += renderMatchesList(online.data);
                    }
                    if (coming.data.length > 0) {
                        html += '<div class="section-title">القادمة</div>';
                        html += renderMatchesList(coming.data);
                    }
                    if (end.data.length > 0) {
                        html += '<div class="section-title">المنتهية</div>';
                        html += renderMatchesList(end.data);
                    }
                } else {
                    html = '<p class="text-muted text-center">لا توجد مباريات</p>';
                }
                matchesContent.innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('matchesContent').innerHTML = '<div class="alert alert-danger py-2">فشل تحميل المباريات</div>';
            } finally {
                hideLoading();
            }
        }

        function renderMatchesList(matches) {
            let html = '<div class="table-responsive"><table class="table table-sm table-hover align-middle">';
            matches.forEach(match => {
                const home = match.home_team;
                const away = match.away_team;
                const scoreHTML = match.home_scores !== null && match.away_scores !== null
                    ? `<span class="fw-bold">${match.home_scores} - ${match.away_scores}</span>`
                    : `<span class="text-muted small">${match.match_time || ''}</span>`;
                
                html += `
                    <tr>
                        <td class="text-start">
                            <img src="${IMG_BASE_TEAM + home.image}" class="team-img" alt=""> ${home.title}
                        </td>
                        <td class="text-center" style="width: 70px;">${scoreHTML}</td>
                        <td class="text-end">
                            ${away.title} <img src="${IMG_BASE_TEAM + away.image}" class="team-img" alt="">
                        </td>
                    </tr>
                `;
            });
            html += '</table></div>';
            return html;
        }

        // ========== تحميل الترتيب (مضغوط) ==========
        async function loadStandings() {
            if (!currentChampionship) return;
            showLoading();
            try {
                let url;
                if (currentChampionship.type === 1) {
                    url = `${API_BASE}/matches/league_standing_stage/${currentChampionship.url_id}`;
                } else {
                    url = `${API_BASE}/matches/cups_teams_standings/${currentChampionship.url_id}/L/60`;
                }
                const data = await fetchFromProxy(url);
                const standingsContent = document.getElementById('standingsContent');
                if (data.data && data.data.league && data.data.league.stage0) {
                    standingsContent.innerHTML = renderStandingsTable(data.data.league.stage0);
                } else if (data.data && data.data.standings && data.data.standings.groups) {
                    standingsContent.innerHTML = renderGroupStandings(data.data.standings.groups);
                } else {
                    standingsContent.innerHTML = '<p class="text-center text-muted">لا توجد بيانات ترتيب</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('standingsContent').innerHTML = '<div class="alert alert-danger py-2">فشل تحميل الترتيب</div>';
            } finally {
                hideLoading();
            }
        }

        function renderStandingsTable(teams) {
            let html = `
                <div class="table-responsive">
                <table class="table table-striped table-sm text-center">
                    <thead>
                        <tr>
                            <th>#</th><th class="text-start">الفريق</th><th>لعب</th><th>فاز</th><th>تعادل</th><th>خسر</th>
                            <th class="d-none-mobile">له</th><th class="d-none-mobile">عليه</th><th class="d-none-mobile">الفرق</th><th>نقاط</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            teams.forEach((team, idx) => {
                const info = team.team_name;
                html += `
                    <tr>
                        <td class="text-muted">${idx+1}</td>
                        <td class="text-start"><img src="${IMG_BASE_TEAM + info.image}" class="team-img" alt=""> ${info.title}</td>
                        <td>${team.play}</td><td>${team.wins}</td><td>${team.draw}</td><td>${team.lose}</td>
                        <td class="d-none-mobile">${team.for}</td><td class="d-none-mobile">${team.against}</td><td class="d-none-mobile">${team.diff}</td>
                        <td class="fw-bold">${team.points}</td>
                    </tr>
                `;
            });
            html += '</tbody></table></div>';
            return html;
        }

        function renderGroupStandings(groups) {
            let html = '';
            for (const groupName in groups) {
                html += `<div class="section-title">المجموعة ${groupName}</div>`;
                html += renderStandingsTable(groups[groupName]);
            }
            return html;
        }

        // ========== تحميل الهدافين والصناع (جداول مضغوطة) ==========
        async function loadScorers(page = 1) {
            if (!currentChampionship) return;
            showLoading();
            try {
                const url = `${API_BASE}/matches/league_scorers_map/${currentChampionship.url_id}?page=${page}`;
                const data = await fetchFromProxy(url);
                const scorersContent = document.getElementById('scorersContent');
                if (data.data && Array.isArray(data.data.data)) {
                    scorersContent.innerHTML = renderPlayersTable(data.data.data, 'goals');
                    renderPagination('scorersPagination', data.data, loadScorers);
                } else {
                    scorersContent.innerHTML = '<p class="text-center text-muted">لا توجد بيانات</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('scorersContent').innerHTML = '<div class="alert alert-danger py-2">فشل تحميل الهدافين</div>';
            } finally {
                hideLoading();
            }
        }

        async function loadAssists(page = 1) {
            if (!currentChampionship) return;
            showLoading();
            try {
                const url = `${API_BASE}/matches/league_assists_map/${currentChampionship.url_id}?page=${page}`;
                const data = await fetchFromProxy(url);
                const assistsContent = document.getElementById('assistsContent');
                if (data.data && Array.isArray(data.data.data)) {
                    assistsContent.innerHTML = renderPlayersTable(data.data.data, 'assist');
                    renderPagination('assistsPagination', data.data, loadAssists);
                } else {
                    assistsContent.innerHTML = '<p class="text-center text-muted">لا توجد بيانات</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('assistsContent').innerHTML = '<div class="alert alert-danger py-2">فشل تحميل الصناع</div>';
            } finally {
                hideLoading();
            }
        }

        function renderPlayersTable(players, type) {
            let html = '<div class="table-responsive"><table class="table table-sm table-hover align-middle"><tbody>';
            players.forEach(p => {
                const info = p.player_info;
                const value = type === 'goals' ? p.goals : p.assist;
                html += `
                    <tr>
                        <td class="text-start">
                            <img src="${IMG_BASE_PLAYER + info.image}" class="player-img" alt="">
                            <span class="fw-bold">${info.title}</span>
                            <span class="text-muted small d-none-mobile"> (${info.team_name})</span>
                        </td>
                        <td class="text-center" style="width: 50px;"><span class="badge bg-primary rounded-pill">${value}</span></td>
                    </tr>
                `;
            });
            html += '</tbody></table></div>';
            return html;
        }

        function renderPagination(elementId, pagination, loadFunction) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            if (!pagination || !pagination.links) return;
            const ul = document.createElement('ul');
            ul.className = 'pagination pagination-sm';
            pagination.links.forEach(link => {
                const li = document.createElement('li');
                li.className = 'page-item' + (link.active ? ' active' : '') + (link.url ? '' : ' disabled');
                const a = document.createElement('a');
                a.className = 'page-link';
                a.href = '#';
                a.textContent = link.label;
                if (link.url) {
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        const page = new URL(link.url).searchParams.get('page');
                        loadFunction(parseInt(page));
                    });
                }
                li.appendChild(a);
                ul.appendChild(li);
            });
            container.appendChild(ul);
        }

        // ========== تحميل خريطة المواجهات (شجرة مضغوطة) ==========
        async function loadBracket() {
            if (!currentChampionship) return;
            showLoading();
            try {
                const url = `${API_BASE}/matches/cups_teams_standings/${currentChampionship.url_id}/L/60`;
                const data = await fetchFromProxy(url);
                const bracketContent = document.getElementById('bracketContent');
                if (data.data && (data.data.map || data.data.lot)) {
                    bracketContent.innerHTML = renderBracket(data.data.map, data.data.lot);
                } else {
                    bracketContent.innerHTML = '<p class="text-center text-muted">لا توجد بيانات للمواجهات</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('bracketContent').innerHTML = '<div class="alert alert-danger py-2">فشل تحميل المواجهات</div>';
            } finally {
                hideLoading();
            }
        }

        function renderBracket(map, lot) {
            let html = '';
            if (lot && lot.length > 0) {
                html += '<div class="section-title">الملحق</div>';
                lot.forEach(match => {
                    html += `<div class="bracket-match"><strong>${match.teamA.title}</strong> vs <strong>${match.teamB.title}</strong></div>`;
                });
            }
            if (map && map.length > 0) {
                html += '<div class="section-title">الأدوار الإقصائية</div>';
                map.forEach(match => {
                    const isWinner = match.winTeam ? 'winner' : '';
                    html += `<div class="bracket-match ${isWinner}">
                        ${match.teamA.title} (${match.teamA_score}) - (${match.teamB_score}) ${match.teamB.title}
                        <br><small class="text-muted">${match.round_name}</small>
                    </div>`;
                });
            }
            return html;
        }

        // بدء التحميل
        loadChampionships();
    </script>
</body>
    </html>
