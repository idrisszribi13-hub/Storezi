<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Center - YSScores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --secondary: #6c757d;
            --success: #198754;
            --info: #0dcaf0;
            --warning: #ffc107;
            --danger: #dc3545;
            --light-bg: #f4f6f9;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 0;
        }
        .container { max-width: 1200px; padding: 20px 15px; }
        .champ-select { margin-bottom: 20px; }
        .dropdown-toggle {
            background: var(--card-bg);
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            padding: 10px 20px;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .dropdown-menu {
            max-height: 400px;
            overflow-y: auto;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: none;
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            padding: 8px 15px;
            font-size: 0.95rem;
        }
        .dropdown-item img { margin-right: 10px; }
        .search-box { padding: 10px; border-bottom: 1px solid #eee; }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .nav-tabs {
            border-bottom: 2px solid #e9ecef;
            gap: 5px;
        }
        .nav-tabs .nav-link {
            border: none;
            color: #555;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
        }
        .nav-tabs .nav-link.active {
            background-color: var(--card-bg);
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }
        .tab-content {
            background: var(--card-bg);
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-3px); }
        .match-card, .news-card { cursor: pointer; }

        .team-img { width: 30px; height: 30px; object-fit: contain; }
        .player-img { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; }
        .champ-img { width: 24px; height: 24px; object-fit: contain; }

        .table { margin-bottom: 0; font-size: 0.9rem; }
        .table th { background: #f8f9fa; border-bottom: 2px solid #dee2e6; }
        .highlight-row { background-color: #cfe2ff !important; font-weight: bold; }

        .pitch {
            background: linear-gradient(180deg, #2e7d32 0%, #388e3c 50%, #2e7d32 100%);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            min-height: 420px;
            color: white;
            margin: 10px 0;
        }
        .pitch .team-name {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .pitch-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
        }
        .player-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
        }
        .player-slot img {
            width: 35px;
            height: 35px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid white;
        }
        .player-slot .player-name {
            font-size: 0.7rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60px;
        }

        .modal-body { max-height: 70vh; overflow-y: auto; }
        .link-item { cursor: pointer; color: var(--primary); text-decoration: underline; }
        .link-item:hover { color: #0a58ca; }

        .pagination { justify-content: center; margin-top: 20px; }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            .nav-tabs .nav-link { font-size: 0.85rem; padding: 8px 10px; }
            .tab-content { padding: 10px; }
            .pitch { min-height: 320px; }
            .player-slot { width: 45px; }
            .player-slot img { width: 28px; height: 28px; }
            .player-slot .player-name { font-size: 0.6rem; max-width: 45px; }
            .col-md-4 { margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4 fw-bold">🏆 Football Center</h1>

        <!-- Championship Selection -->
        <div class="champ-select">
            <label class="fw-bold">Select Championship:</label>
            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle w-100 d-flex justify-content-between align-items-center" type="button" id="championshipDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <span id="selectedChampText">Select Championship</span>
                </button>
                <div class="dropdown-menu w-100" aria-labelledby="championshipDropdown">
                    <div class="search-box">
                        <input type="text" id="champSearch" placeholder="Search championship..." class="form-control">
                    </div>
                    <div id="champList"></div>
                </div>
            </div>
            <input type="hidden" id="selectedChampId" value="">
        </div>

        <!-- Main Tabs -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist" style="display:none;">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="matches-tab" data-bs-toggle="tab" data-bs-target="#matches" type="button" role="tab">Matches</button>
            </li>
            <li class="nav-item" role="presentation" id="standingsTabItem">
                <button class="nav-link" id="standings-tab" data-bs-toggle="tab" data-bs-target="#standings" type="button" role="tab">Standings</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="scorers-tab" data-bs-toggle="tab" data-bs-target="#scorers" type="button" role="tab">Top Scorers</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="assists-tab" data-bs-toggle="tab" data-bs-target="#assists" type="button" role="tab">Assists</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="news-tab" data-bs-toggle="tab" data-bs-target="#news" type="button" role="tab">News</button>
            </li>
            <li class="nav-item" role="presentation" id="bracketTabItem" style="display:none;">
                <button class="nav-link" id="bracket-tab" data-bs-toggle="tab" data-bs-target="#bracket" type="button" role="tab">Bracket</button>
            </li>
        </ul>

        <!-- Main Tab Content -->
        <div class="tab-content" id="mainTabsContent" style="display:none;">
            <div class="tab-pane fade show active" id="matches" role="tabpanel">
                <div id="matchesContent" class="mt-3"></div>
            </div>
            <div class="tab-pane fade" id="standings" role="tabpanel">
                <div id="standingsContent" class="mt-3"></div>
            </div>
            <div class="tab-pane fade" id="scorers" role="tabpanel">
                <div id="scorersContent" class="mt-3"></div>
                <nav id="scorersPagination" aria-label="Page navigation"></nav>
            </div>
            <div class="tab-pane fade" id="assists" role="tabpanel">
                <div id="assistsContent" class="mt-3"></div>
                <nav id="assistsPagination" aria-label="Page navigation"></nav>
            </div>
            <div class="tab-pane fade" id="news" role="tabpanel">
                <div id="newsContent" class="mt-3"></div>
                <nav id="newsPagination" aria-label="Page navigation"></nav>
            </div>
            <div class="tab-pane fade" id="bracket" role="tabpanel">
                <div id="bracketContent" class="mt-3"></div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loader hidden text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Loading...</p>
        </div>
        <!-- Error Message -->
        <div id="errorIndicator" class="error-message hidden text-center text-danger py-3"></div>
    </div>

    <!-- Match Details Modal -->
    <div class="modal fade" id="matchModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="matchModalTitle">Match Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="matchModalBody"></div>
            </div>
        </div>
    </div>

    <!-- Team Info Modal -->
    <div class="modal fade" id="teamModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="teamModalTitle">Team Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="teamModalBody"></div>
            </div>
        </div>
    </div>

    <!-- Player Info Modal -->
    <div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="playerModalTitle">Player Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="playerModalBody"></div>
            </div>
        </div>
    </div>

    <!-- Coach Info Modal -->
    <div class="modal fade" id="coachModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="coachModalTitle">Coach Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="coachModalBody"></div>
            </div>
        </div>
    </div>

    <!-- News Detail Modal -->
    <div class="modal fade" id="newsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newsModalTitle">News Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="newsModalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========== Settings ==========
        const SUPABASE_PROXY_URL = 'https://kvsyzgavfxnwqmtsginv.supabase.co/functions/v1/proxy';
        const API_BASE = 'https://api-en.ysscores.com/api';
        const NEWS_BASE = 'https://news-en.ysscores.com/api';
        const IMG_BASE_TEAM = 'https://imgs.ysscores.com/teams/150/';
        const IMG_BASE_PLAYER = 'https://imgs.ysscores.com/player/150/';
        const IMG_BASE_CHAMP = 'https://imgs.ysscores.com/championship/150/';
        const IMG_BASE_COACH = 'https://imgs.ysscores.com/coach/150/';
        const IMG_BASE_PLAYER_COVER = 'https://imgs.ysscores.com/player/cover/';
        const IMG_BASE_COACH_COVER = 'https://imgs.ysscores.com/coach/cover/';

        let championshipsList = [];
        let currentChampionship = null;
        let currentTab = 'matches';

        function showLoading() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('errorIndicator').classList.add('hidden');
        }
        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
        }
        function showError(msg) {
            document.getElementById('errorIndicator').textContent = msg;
            document.getElementById('errorIndicator').classList.remove('hidden');
        }
        async function fetchFromProxy(url) {
            const proxied = `${SUPABASE_PROXY_URL}?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxied);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        }

        // ========== Load Championships ==========
        async function loadChampionships() {
            try {
                showLoading();
                const url = `${API_BASE}/info/championship_ranking/L/60`;
                const data = await fetchFromProxy(url);
                if (data.status && data.data) {
                    championshipsList = data.data;
                    populateChampDropdown(championshipsList);
                } else {
                    showError('Failed to load championships');
                }
            } catch (err) {
                console.error(err);
                showError('Failed to connect to server');
            } finally {
                hideLoading();
            }
        }

        function populateChampDropdown(list) {
            const container = document.getElementById('champList');
            container.innerHTML = '';
            list.forEach(champ => {
                const item = document.createElement('a');
                item.href = '#';
                item.className = 'dropdown-item';
                item.dataset.champId = champ.url_id;
                item.dataset.champTitle = champ.title;
                item.dataset.champType = champ.type || 1;
                item.dataset.standings = champ.standings ? '1' : '0';
                item.dataset.cups = champ.cups ? '1' : '0';
                const imgSrc = champ.image ? `${IMG_BASE_CHAMP}${champ.image}` : 'https://via.placeholder.com/24';
                item.innerHTML = `
                    <img src="${imgSrc}" class="champ-img" alt="${champ.title}">
                    <span>${champ.title}</span>
                `;
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    selectChampionship(this);
                });
                container.appendChild(item);
            });

            document.getElementById('champSearch').addEventListener('input', function() {
                const query = this.value.toLowerCase();
                const items = container.querySelectorAll('.dropdown-item');
                items.forEach(item => {
                    const title = item.dataset.champTitle.toLowerCase();
                    item.style.display = title.includes(query) ? '' : 'none';
                });
            });
        }

        function selectChampionship(element) {
            const id = element.dataset.champId;
            const title = element.dataset.champTitle;
            const type = parseInt(element.dataset.champType);
            const standings = element.dataset.standings === '1';
            const cups = element.dataset.cups === '1';
            const image = element.querySelector('img')?.src || '';

            document.getElementById('selectedChampId').value = id;
            document.getElementById('selectedChampText').innerHTML = `
                <span class="d-flex align-items-center">
                    ${image ? `<img src="${image}" class="champ-img" style="width:20px;height:20px;margin-right:8px;">` : ''}
                    ${title}
                </span>
            `;

            bootstrap.Dropdown.getInstance(document.getElementById('championshipDropdown'))?.hide();

            currentChampionship = { url_id: id, type: type, title: title, standings: standings, cups: cups };

            document.getElementById('mainTabs').style.display = '';
            document.getElementById('mainTabsContent').style.display = '';

            resetTabs();
            document.getElementById('standingsTabItem').style.display = standings ? '' : 'none';
            const showBracket = type === 4 || (type === 2 && cups);
            document.getElementById('bracketTabItem').style.display = showBracket ? '' : 'none';
            switchTab('matches');
        }

        function resetTabs() {
            document.querySelectorAll('#mainTabs .nav-link').forEach(link => link.classList.remove('active'));
            document.querySelectorAll('#mainTabsContent .tab-pane').forEach(pane => pane.classList.remove('show', 'active'));
            document.getElementById('matches-tab').classList.add('active');
            document.getElementById('matches').classList.add('show', 'active');
            currentTab = 'matches';
            ['matchesContent', 'standingsContent', 'scorersContent', 'assistsContent', 'newsContent', 'bracketContent'].forEach(id => {
                document.getElementById(id).innerHTML = '';
            });
            document.getElementById('scorersPagination').innerHTML = '';
            document.getElementById('assistsPagination').innerHTML = '';
            document.getElementById('newsPagination').innerHTML = '';
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('#mainTabs .nav-link').forEach(link => {
                link.classList.remove('active');
                if (link.id === tabName + '-tab') link.classList.add('active');
            });
            document.querySelectorAll('#mainTabsContent .tab-pane').forEach(pane => {
                pane.classList.remove('show', 'active');
                if (pane.id === tabName) pane.classList.add('show', 'active');
            });

            if (tabName === 'matches') loadMatches();
            else if (tabName === 'standings') loadStandings();
            else if (tabName === 'scorers') loadScorers(1);
            else if (tabName === 'assists') loadAssists(1);
            else if (tabName === 'news') loadNews(1);
            else if (tabName === 'bracket') loadBracket();
        }

        document.querySelectorAll('#mainTabs button[data-bs-toggle="tab"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const target = this.getAttribute('data-bs-target').substring(1);
                switchTab(target);
            });
        });

        // ========== Load Matches ==========
        async function loadMatches() {
            if (!currentChampionship) return;
            showLoading();
            try {
                const url = `${API_BASE}/matches/championship_matches/${currentChampionship.url_id}/L/60`;
                const data = await fetchFromProxy(url);
                const matchesContent = document.getElementById('matchesContent');
                let html = '';
                if (data.data) {
                    const { online, coming, end } = data.data;
                    html += '<h5 class="mt-3">Live Matches</h5>';
                    html += online.data.length ? renderMatchesList(online.data) : '<p>No live matches</p>';
                    html += '<h5 class="mt-4">Upcoming Matches</h5>';
                    html += coming.data.length ? renderMatchesList(coming.data) : '<p>No upcoming matches</p>';
                    html += '<h5 class="mt-4">Finished Matches</h5>';
                    html += end.data.length ? renderMatchesList(end.data) : '<p>No finished matches</p>';
                } else {
                    html = '<p>No data available</p>';
                }
                matchesContent.innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('matchesContent').innerHTML = '<div class="alert alert-danger">Failed to load matches</div>';
            } finally {
                hideLoading();
            }
        }

        function renderMatchesList(matches) {
            let html = '<div class="row">';
            matches.forEach(match => {
                const home = match.home_team;
                const away = match.away_team;
                const date = match.match_date + ' ' + match.match_time;
                html += `
                    <div class="col-12 col-md-6 col-lg-4 mb-3">
                        <div class="card p-3 match-card" data-match-id="${match.match_id}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="text-center">
                                    <img src="${IMG_BASE_TEAM + home.image}" class="team-img" alt="${home.title}" onclick="openTeamModal(${home.row_id})" style="cursor:pointer;">
                                    <div class="small" data-team-id="${home.row_id}" onclick="openTeamModal(${home.row_id})">${home.title}</div>
                                </div>
                                <div class="fs-5 fw-bold">${match.home_scores} - ${match.away_scores}</div>
                                <div class="text-center">
                                    <img src="${IMG_BASE_TEAM + away.image}" class="team-img" alt="${away.title}" onclick="openTeamModal(${away.row_id})" style="cursor:pointer;">
                                    <div class="small" data-team-id="${away.row_id}" onclick="openTeamModal(${away.row_id})">${away.title}</div>
                                </div>
                            </div>
                            <div class="text-center text-muted small mt-2">${date} | ${match.round || ''}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            setTimeout(() => {
                document.querySelectorAll('.match-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.classList.contains('team-img') || e.target.classList.contains('small')) return;
                        const matchId = this.dataset.matchId;
                        openMatchDetails(matchId);
                    });
                });
            }, 0);
            return html;
        }

        // ========== Match Details Modal ==========
        async function openMatchDetails(matchId) {
            showLoading();
            try {
                const infoUrl = `${API_BASE}/matches/match_info/${matchId}/L/60`;
                const eventUrl = `${API_BASE}/matches/matches_event/${matchId}`;
                const lineupUrl = `${API_BASE}/matches/matches_lineup/${matchId}`;
                const statsUrl = `${API_BASE}/matches/statics_match/${matchId}`;
                const h2hUrl = `${API_BASE}/matches/h2h/${matchId}/L/60`;

                const [infoData, eventData, lineupData, statsData, h2hData] = await Promise.all([
                    fetchFromProxy(infoUrl),
                    fetchFromProxy(eventUrl),
                    fetchFromProxy(lineupUrl),
                    fetchFromProxy(statsUrl),
                    fetchFromProxy(h2hUrl).catch(() => ({ data: {} }))
                ]);

                const info = infoData.data;
                const events = eventData.data.events || [];
                const lineups = lineupData.data || {};
                const stats = statsData.data.statics || {};
                const h2h = h2hData.data || {};

                renderMatchDetails(info, events, lineups, stats, h2h);
                document.getElementById('matchModalTitle').textContent = `${info.home_team.title} vs ${info.away_team.title}`;
                const modal = new bootstrap.Modal(document.getElementById('matchModal'));
                modal.show();
            } catch (err) {
                console.error(err);
                showError('Failed to load match details');
            } finally {
                hideLoading();
            }
        }

        function renderMatchDetails(info, events, lineups, stats, h2h) {
            const body = document.getElementById('matchModalBody');
            const teamMap = {
                [info.home_team.row_id]: info.home_team.title,
                [info.away_team.row_id]: info.away_team.title
            };
            let html = `
                <div class="text-center mb-4">
                    <img src="${IMG_BASE_TEAM + info.home_team.image}" class="team-img" alt="${info.home_team.title}" style="width:50px;height:50px;" onclick="openTeamModal(${info.home_team.row_id})">
                    <span class="mx-3 fs-3 fw-bold">${info.home_scores} - ${info.away_scores}</span>
                    <img src="${IMG_BASE_TEAM + info.away_team.image}" class="team-img" alt="${info.away_team.title}" style="width:50px;height:50px;" onclick="openTeamModal(${info.away_team.row_id})">
                    <div class="text-muted mt-2">${info.match_date} ${info.match_time} | ${info.Stadium || ''}</div>
                    <div class="mt-2">
                        <button class="btn btn-sm btn-outline-primary" onclick="openTeamModal(${info.home_team.row_id})">${info.home_team.title}</button>
                        <button class="btn btn-sm btn-outline-primary mx-2" onclick="openTeamModal(${info.away_team.row_id})">${info.away_team.title}</button>
                    </div>
                </div>
            `;

            // Events
            html += '<h6 class="border-bottom pb-1">Match Events</h6>';
            if (events.length) {
                html += '<ul class="list-group mb-4">';
                events.forEach(ev => {
                    const player = ev.player_name ? ev.player_name.title : 'Unknown';
                    const playerImg = ev.player_name && ev.player_name.image ? `<img src="${IMG_BASE_PLAYER + ev.player_name.image}" class="player-img me-2" style="width:25px;height:25px;" onclick="openPlayerModal(${ev.player_name.id})">` : '';
                    const type = ev.type === 1 ? 'Goal' : ev.type === 2 ? 'Yellow Card' : ev.type === 5 ? 'Goal' : ev.type === 8 ? 'Substitution' : ev.type === 21 ? 'Chance' : ev.type === 22 ? 'Missed Chance' : 'Other';
                    html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>${playerImg}${player}</span>
                        <span class="badge bg-secondary">${type}</span>
                        <span class="text-muted">${ev.time_minute}'</span>
                    </li>`;
                });
                html += '</ul>';
            } else {
                html += '<p>No events</p>';
            }

            // Stats
            html += '<h6 class="border-bottom pb-1">Statistics</h6>';
            if (Object.keys(stats).length) {
                const homeStats = stats[info.home_team.row_id] || {};
                const awayStats = stats[info.away_team.row_id] || {};
                html += '<div class="row mb-4">';
                html += `<div class="col-6"><strong>${info.home_team.title}</strong><br>Possession: ${homeStats.ball_possession || 0}%<br>Shots: ${homeStats.total_shots || 0}<br>Fouls: ${homeStats.fouls || 0}</div>`;
                html += `<div class="col-6 text-end"><strong>${info.away_team.title}</strong><br>Possession: ${awayStats.ball_possession || 0}%<br>Shots: ${awayStats.total_shots || 0}<br>Fouls: ${awayStats.fouls || 0}</div>`;
                html += '</div>';
            } else {
                html += '<p>No stats</p>';
            }

            // Lineups
            html += '<h6 class="border-bottom pb-1">Lineups</h6>';
            const homeLineup = lineups.lineup ? lineups.lineup[info.home_team.row_id] : null;
            const awayLineup = lineups.lineup ? lineups.lineup[info.away_team.row_id] : null;
            const homeCoach = lineups['0']?.home_coach;
            const awayCoach = lineups['0']?.away_coach;
            const injureds = lineups.lineup_injureds || {};
            const homeInjured = injureds[info.home_team.row_id] || [];
            const awayInjured = injureds[info.away_team.row_id] || [];

            if (homeLineup && awayLineup) {
                html += '<div class="row">';
                html += `<div class="col-12 col-md-6">${renderPitch(info.home_team, homeLineup, info.home_formation, homeCoach, homeInjured)}</div>`;
                html += `<div class="col-12 col-md-6">${renderPitch(info.away_team, awayLineup, info.away_formation, awayCoach, awayInjured)}</div>`;
                html += '</div>';
            } else {
                html += '<p>Lineups not available</p>';
            }

            // H2H
            html += '<h6 class="border-bottom pb-1 mt-4">Head-to-Head (H2H)</h6>';
            if (Object.keys(h2h).length) {
                html += '<ul class="list-group">';
                for (const matchId in h2h) {
                    const h = h2h[matchId];
                    const homeTitle = teamMap[h.home] || 'Unknown';
                    const awayTitle = teamMap[h.away] || 'Unknown';
                    const result = h.win === 'win1' ? 'Home Win' : h.win === 'win2' ? 'Away Win' : 'Draw';
                    html += `<li class="list-group-item d-flex justify-content-between">
                        <span>${homeTitle} ${h.home_score} - ${h.away_score} ${awayTitle}</span>
                        <small class="text-muted">${h.match_date} | ${result}</small>
                    </li>`;
                }
                html += '</ul>';
            } else {
                html += '<p>No H2H data</p>';
            }

            body.innerHTML = html;
        }

        function getPositionFullName(pos) {
            const mapping = {
                'G': 'Goalkeeper',
                'D': 'Defender',
                'M': 'Midfielder',
                'F': 'Forward',
                'GK': 'Goalkeeper',
                'CB': 'Centre Back',
                'LB': 'Left Back',
                'RB': 'Right Back',
                'CDM': 'Defensive Midfielder',
                'CM': 'Central Midfielder',
                'CAM': 'Attacking Midfielder',
                'LM': 'Left Midfielder',
                'RM': 'Right Midfielder',
                'LW': 'Left Winger',
                'RW': 'Right Winger',
                'CF': 'Centre Forward',
                'SS': 'Second Striker',
                'AM': 'Attacking Midfielder',
                'DM': 'Defensive Midfielder'
            };
            return mapping[pos] || pos || 'Unknown';
        }

        function renderPitch(team, lineupData, formation, coach, injuredPlayers) {
            const players = lineupData.lineup || [];
            const formationText = formation || '4-3-3';
            const groups = { 'G': [], 'D': [], 'M': [], 'F': [] };
            players.forEach(p => {
                const pos = p.position || 'M';
                if (groups[pos]) groups[pos].push(p);
                else groups['M'].push(p);
            });

            let html = `
                <div class="pitch">
                    <div class="team-name">
                        <img src="${IMG_BASE_TEAM + team.image}" class="team-img" style="width:25px;height:25px;vertical-align:middle;cursor:pointer;" onclick="openTeamModal(${team.row_id})">
                        ${team.title} (${formationText})
                    </div>
            `;
            if (coach) {
                html += `
                    <div class="d-flex align-items-center justify-content-center mb-3">
                        <img src="${IMG_BASE_COACH + coach.image}" class="player-img me-2" style="width:35px;height:35px;cursor:pointer;" onclick="openCoachModal(${coach.id})" title="${coach.title}">
                        <span class="small" style="color:white; cursor:pointer;" onclick="openCoachModal(${coach.id})">${coach.title}</span>
                    </div>
                `;
            }
            html += `<div class="pitch-row">${renderPlayersRow(groups['G'])}</div>`;
            html += `<div class="pitch-row">${renderPlayersRow(groups['D'])}</div>`;
            html += `<div class="pitch-row">${renderPlayersRow(groups['M'])}</div>`;
            html += `<div class="pitch-row">${renderPlayersRow(groups['F'])}</div>`;

            if (injuredPlayers && injuredPlayers.length > 0) {
                html += `<div class="mt-3" style="background:rgba(0,0,0,0.4); padding:10px; border-radius:8px;">`;
                html += `<strong style="color:#fff;">Absences:</strong>`;
                html += `<div class="d-flex flex-wrap">`;
                injuredPlayers.forEach(inj => {
                    html += `
                        <div class="player-slot" style="margin:5px;">
                            <img src="${IMG_BASE_PLAYER + inj.player.image}" alt="${inj.player.title}" onclick="openPlayerModal(${inj.player.row_id})" style="cursor:pointer; border-color:#ffc107;">
                            <span class="player-name" style="color:#ffc107;">${inj.player.title}</span>
                            <small style="color:#fff; font-size:0.6rem;">${inj.type_name || 'Unknown'}</small>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }

            html += '</div>';
            return html;
        }

        function renderPlayersRow(players) {
            return players.map(p => `
                <div class="player-slot">
                    <img src="${IMG_BASE_PLAYER + p.player.image}" alt="${p.player.title}" onclick="openPlayerModal(${p.player.row_id})" style="cursor:pointer;" onerror="this.style.display='none'">
                    <span class="player-name">${p.player.title}</span>
                    <small style="color:#fff; font-size:0.6rem;">${getPositionFullName(p.position)}</small>
                </div>
            `).join('');
        }

        // ========== Load Standings ==========
        async function loadStandings() {
            if (!currentChampionship) return;
            showLoading();
            try {
                let url;
                if (currentChampionship.type === 1) {
                    url = `${API_BASE}/matches/league_standing_stage/${currentChampionship.url_id}`;
                } else {
                    url = `${API_BASE}/matches/cups_teams_standings/${currentChampionship.url_id}/L/60`;
                }
                const data = await fetchFromProxy(url);
                const standingsContent = document.getElementById('standingsContent');
                if (data.data && data.data.league && data.data.league.stage0) {
                    standingsContent.innerHTML = renderStandingsTable(data.data.league.stage0);
                } else if (data.data && data.data.standings && data.data.standings.groups) {
                    standingsContent.innerHTML = renderGroupStandings(data.data.standings.groups);
                } else {
                    standingsContent.innerHTML = '<p>No standings data</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('standingsContent').innerHTML = '<div class="alert alert-danger">Failed to load standings</div>';
            } finally {
                hideLoading();
            }
        }

        function renderStandingsTable(teams, highlightTeamId = null) {
            let html = `
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            teams.forEach((team, idx) => {
                const info = team.team_name;
                const isHighlighted = highlightTeamId && info && info.row_id == highlightTeamId;
                const rowClass = isHighlighted ? 'highlight-row' : '';
                html += `
                    <tr class="${rowClass}">
                        <td>${idx+1}</td>
                        <td><img src="${IMG_BASE_TEAM + info.image}" class="team-img" alt="${info.title}" onclick="openTeamModal(${info.row_id})" style="cursor:pointer;"> <span class="link-item" onclick="openTeamModal(${info.row_id})">${info.title}</span></td>
                        <td>${team.play}</td><td>${team.wins}</td><td>${team.draw}</td><td>${team.lose}</td>
                        <td>${team.for}</td><td>${team.against}</td><td>${team.diff}</td><td>${team.points}</td>
                    </tr>
                `;
            });
            html += '</tbody></table></div>';
            return html;
        }

        function renderGroupStandings(groups) {
            let html = '';
            for (const groupName in groups) {
                html += `<h5 class="mt-3">Group ${groupName}</h5>`;
                html += renderStandingsTable(groups[groupName]);
            }
            return html;
        }

        // ========== Load Scorers ==========
        async function loadScorers(page = 1) {
            if (!currentChampionship) return;
            showLoading();
            try {
                const url = `${API_BASE}/matches/league_scorers_map/${currentChampionship.url_id}?page=${page}`;
                const data = await fetchFromProxy(url);
                const scorersContent = document.getElementById('scorersContent');
                if (data.data && Array.isArray(data.data.data)) {
                    scorersContent.innerHTML = renderPlayersList(data.data.data, 'goals');

                console.error(err);
                document.getElementById('scorersContent').innerHTML = '<div class="alert alert-danger">Failed to load top scorers</div>';
            } finally {
                hideLoading();

        }

        async function loadAssists(page = 1) {
            if (!currentChampionship) return;
            showLoading();
            try {
                const url = `${API_BASE}/matches/league_assists_map/${currentChampionship.url_id}?page=${page}`;

        function renderPlayersList(players, type) {
            let html = '<ul class="list-group">';
            players.forEach(p => {
                const info = p.player_info;
                const value = type === 'goals' ? p.goals : p.assist;
                html += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <img src="${IMG_BASE_PLAYER + info.image}" class="player-img me-2" alt="${info.title}" onclick="openPlayerModal(${info.id})" style="cursor:pointer;" onerror="this.style.display='none'">
                            <span class="link-item" onclick="openPlayerModal(${info.id})">${info.title}</span>
                            <small class="text-muted ms-2">(${info.team_name})</small>
                        </div>
                        <span class="badge bg-primary rounded-pill">${value}</span>
                    </li>
                `;
            });
            html += '</ul>';
            return html;
        }

        function renderPagination(elementId, pagination, loadFunction) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            if (!pagination || !pagination.links) return;
            const ul = document.createElement('ul');
            ul.className = 'pagination';
            pagination.links.forEach(link => {
                const li = document.createElement('li');
                li.className = 'page-item' + (link.active ? ' active' : '') + (link.url ? '' : ' disabled');
                const a = document.createElement('a');
                a.className = 'page-link';
                a.href = '#';
                a.textContent = link.label;
                if (link.url) {
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        const page = new URL(link.url).searchParams.get('page');
                        loadFunction(parseInt(page));
                    });
                }
                li.appendChild(a);
                ul.appendChild(li);
            });
            container.appendChild(ul);
        }

        // ========== Load News ==========
        async function loadNews(page = 1) {
            if (!currentChampionship) return;
            showLoading();
            try {
                const url = `${NEWS_BASE}/News/news_league/${currentChampionship.url_id}?page=${page}`;
                const data = await fetchFromProxy(url);
                const newsContent = document.getElementById('newsContent');
                if (data.data && Array.isArray(data.data.data)) {
                    newsContent.innerHTML = renderNewsList(data.data.data);
                    renderPagination('newsPagination', data.data, loadNews);
                } else {
                    newsContent.innerHTML = '<p>No news</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('newsContent').innerHTML = '<div class="alert alert-danger">Failed to load news</div>';
            } finally {
                hideLoading();
            }
        }

        function renderNewsList(newsArray) {
            let html = '<div class="row">';
            newsArray.forEach(item => {
                html += `
                    <div class="col-12 col-md-6 col-lg-4 mb-3">
                        <div class="card news-card h-100" data-news-id="${item.id}" onclick="openNewsModal(${item.id})">
                            <img src="https://imgs.ysscores.com/news/350/${item.image}" class="card-img-top" alt="${item.title}" onerror="this.style.display='none'">
                            <div class="card-body">
                                <h6 class="card-title">${item.title}</h6>
                                <p class="card-text small text-muted">${item.news_desc || ''}</p>
                                <span class="text-muted small">${item.created_at.date}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        // ========== Load Bracket ==========
        async function loadBracket() {
            if (!currentChampionship) return;
            showLoading();
            try {
                const url = `${API_BASE}/matches/cups_teams_standings/${currentChampionship.url_id}/L/60`;
                const data = await fetchFromProxy(url);
                const bracketContent = document.getElementById('bracketContent');
                if (data.data && (data.data.map || data.data.lot)) {
                    bracketContent.innerHTML = renderBracket(data.data.map, data.data.lot);
                } else {
                    bracketContent.innerHTML = '<p>No bracket data</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('bracketContent').innerHTML = '<div class="alert alert-danger">Failed to load bracket</div>';
            } finally {
                hideLoading();
            }
        }

        function renderBracket(map, lot) {
            let html = '';
            if (lot && lot.length > 0) {
                html += '<h5 class="mt-3">Playoffs</h5>';
                lot.forEach(match => {
                    const winner = match.winTeam ? (match.teamA.row_id == match.winTeam ? match.teamA.title : match.teamB.title) : 'Unknown';
                    html += `<div class="bracket-match">
                        <span class="link-item" onclick="openTeamModal(${match.teamA.row_id})">${match.teamA.title}</span> vs 
                        <span class="link-item" onclick="openTeamModal(${match.teamB.row_id})">${match.teamB.title}</span>
                        (Winner: ${winner})
                    </div>`;
                });
            }
            if (map && map.length > 0) {
                html += '<h5 class="mt-4">Knockout Bracket</h5>';
                map.forEach(match => {
                    const winnerClass = match.winTeam ? 'winner' : '';
                    html += `<div class="bracket-match ${winnerClass}">
                        <span class="link-item" onclick="openTeamModal(${match.teamA.row_id})">${match.teamA.title}</span>
                        (${match.teamA_score}) - (${match.teamB_score})
                        <span class="link-item" onclick="openTeamModal(${match.teamB.row_id})">${match.teamB.title}</span>
                        <br><small>${match.round_name}</small>
                    </div>`;
                });
            }
            return html;
        }

        // ========== Team Modal ==========
        async function openTeamModal(teamId) {
            showLoading();
            try {
                const teamInfoUrl = `${API_BASE}/info/team_info/${teamId}/L/60`;
                const playersUrl = `${API_BASE}/info/players_team/${teamId}`;
                const transfersUrl = `${API_BASE}/info/transfer_info_team/${teamId}?page=1`;
                const teamPageUrl = `${API_BASE}/info/team_page/${teamId}`;
                const teamMatchesUrl = `${API_BASE}/matches/team_matches/${teamId}/L/60`;
                const teamNewsUrl = `${NEWS_BASE}/News/news_team/${teamId}?page=1`;

                const [teamInfo, players, transfers, teamPage, teamMatches, teamNews] = await Promise.all([
                    fetchFromProxy(teamInfoUrl),
                    fetchFromProxy(playersUrl),
                    fetchFromProxy(transfersUrl),
                    fetchFromProxy(teamPageUrl),
                    fetchFromProxy(teamMatchesUrl),
                    fetchFromProxy(teamNewsUrl).catch(() => ({ data: { data: [] } }))
                ]);

                const modalData = {
                    teamInfo: teamInfo.data,
                    players: players.data,
                    transfers: transfers.data,
                    teamPage: teamPage.data,
                    teamMatches: teamMatches.data,
                    teamNews: teamNews.data
                };

                renderTeamModalTabs(modalData);
                document.getElementById('teamModalTitle').textContent = teamInfo.data.title;
                const modal = new bootstrap.Modal(document.getElementById('teamModal'));
                modal.show();
            } catch (err) {
                console.error(err);
                showError('Failed to load team info');
            } finally {
                hideLoading();
            }
        }

            const body = document.getElementById('teamModalBody');
            let html = `
                <ul class="nav nav-tabs" id="teamModalTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="overview-tab" data-bs-toggle="tab" data-bs-target="#overview" type="button" role="tab">Overview</button>

                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="matches-tab-team" data-bs-toggle="tab" data-bs-target="#matches-team" type="button" role="tab">Matches</button>

                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="standings-tab-team" data-bs-toggle="tab" data-bs-target="#standings-team" type="button" role="tab">Standings</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="players-tab-team" data-bs-toggle="tab" data-bs-target="#players-team" type="button" role="tab">Players</button>
                    </li>
                    <li class="nav-item" role="presentation">

                    </li>
                </ul>
                <div class="tab-content mt-3" id="teamModalTabsContent">
                    <div class="tab-pane fade show active" id="overview" role="tabpanel">
                        ${renderTeamOverview(data.teamInfo, data.teamPage, data.players)}
                    </div>
                    <div class="tab-pane fade" id="matches-team" role="tabpanel">
                        ${renderTeamMatches(data.teamMatches)}
                    </div>
                    <div class="tab-pane fade" id="news-team" role="tabpanel">

        function renderTeamOverview(teamInfo, teamPage, players) {
            let html = `
                <div class="d-flex align-items-center mb-3">
                    <img src="${IMG_BASE_TEAM + teamInfo.image}" class="team-img me-2" style="width:50px;height:50px;">
                    <h4>${teamInfo.title}</h4>
                </div>
                <p>${teamInfo.about || ''}</p>
                <p><strong>Country:</strong> ${teamInfo.country ? teamInfo.country.title : ''}</p>
                <p><strong>Stadium:</strong> ${teamInfo.stadium_name || ''}</p>
                <hr>
                <h6>Coach</h6>
                ${players.coach ? `
                    <div class="d-flex align-items-center">
                        <img src="${IMG_BASE_COACH + players.coach.image}" class="player-img me-2" style="width:40px;height:40px;" onclick="openCoachModal(${players.coach.id})" style="cursor:pointer;">
                        <span class="link-item" onclick="openCoachModal(${players.coach.id})">${players.coach.title}</span>
                    </div>
                ` : '<p>Not available</p>'}
                <hr>
                <h6>Honours</h6>
                ${teamPage.cups ? renderTeamCups(teamPage.cups) : '<p>No honours</p>'}
            `;
            return html;
        }

        function renderTeamMatches(matchesData) {
            if (!matchesData) return '<p>No matches data</p>';
            let html = '<h6>Upcoming Matches</h6>';
            html += matchesData.coming && matchesData.coming.data.length ? renderMatchesList(matchesData.coming.data) : '<p>No upcoming matches</p>';
            html += '<h6 class="mt-3">Finished Matches</h6>';
            html += matchesData.end && matchesData.end.data.length ? renderMatchesList(matchesData.end.data) : '<p>No finished matches</p>';
            return html;
        }

        function renderTeamNews(newsData) {
            if (!newsData || !newsData.data || !newsData.data.length) return '<p>No news</p>';
            return renderNewsList(newsData.data);
        }

        function renderTeamPlayers(playersData) {
            let html = '<div class="row">';
            for (const pos in playersData) {
                if (pos === 'coach') continue;
                const playersList = playersData[pos];
                if (Array.isArray(playersList)) {
                    const groupName = getPositionFullName(pos);
                    html += `<div class="col-6 col-md-4"><strong>${groupName}</strong><ul>`;
                    playersList.forEach(p => {
                        const playerPos = getPositionFullName(p.position);
                        html += `<li class="d-flex align-items-center mb-1">
                            <img src="${IMG_BASE_PLAYER + p.image}" class="player-img me-2" style="width:25px;height:25px;cursor:pointer;" onclick="openPlayerModal(${p.row_id})" onerror="this.style.display='none'">
                            <span class="link-item" onclick="openPlayerModal(${p.row_id})">${p.title}</span>
                            <span class="text-muted ms-2">(${playerPos})</span>
                        </li>`;
                    });
                    html += '</ul></div>';
                }
            }
            html += '</div>';
            return html;
        }

        function renderTeamTransfers(transfersData) {
            if (!transfersData) return '<p>No transfers</p>';
            const important = transfersData.important || [];
            const all = transfersData.all || [];
            const allTransfers = [...important, ...all.filter(t => !important.some(i => i.player_name?.row_id === t.player_name?.row_id))];

            if (!allTransfers.length) return '<p>No transfers</p>';

            let html = '<div class="row">';
            allTransfers.forEach(t => {
                const playerImg = t.player_name?.image ? `<img src="${IMG_BASE_PLAYER + t.player_name.image}" class="player-img me-2" style="width:35px;height:35px;" onclick="openPlayerModal(${t.player_name.row_id})" style="cursor:pointer;" onerror="this.style.display='none'">` : '';
                const typeLabel = t.type === 0 ? 'Permanent' : t.type === 1 ? 'Loan' : t.type === 4 ? 'Free' : 'Other';
                html += `
                    <div class="col-12 col-md-6 col-lg-4 mb-3">
                        <div class="card h-100 p-3">
                            <div class="d-flex align-items-center mb-2">
                                ${playerImg}
                                <span class="fw-bold link-item" onclick="openPlayerModal(${t.player_name.row_id})">${t.player_name?.title || 'Unknown'}</span>
                            </div>
                            <div class="small">
                                <div><strong>From:</strong> <span class="link-item" onclick="openTeamModal(${t.team_out.row_id})">${t.team_out?.title}</span></div>
                                <div><strong>To:</strong> <span class="link-item" onclick="openTeamModal(${t.team_in.row_id})">${t.team_in?.title}</span></div>
                                <div><strong>Value:</strong> ${t.value || 'Undisclosed'}</div>
                                <div><strong>Type:</strong> ${typeLabel}</div>
                                <div><strong>Date:</strong> ${t.date_from} to ${t.date_to || 'Now'}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        async function loadTeamStandings(teamId) {
            const container = document.getElementById('teamStandingsContent');
            if (!container || container.dataset.loaded) return;
            container.dataset.loaded = 'true';
            container.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Loading standings...';

            try {
                const teamInfoUrl = `${API_BASE}/info/team_info/${teamId}/L/60`;
                const teamInfoData = await fetchFromProxy(teamInfoUrl);
                const championships = teamInfoData.data.championships || [];

                let standingsHtml = '';
                for (const champ of championships) {
                    standingsHtml += `<h6 class="mt-3">${champ.title}</h6>`;
                    try {
                        let url;
                        if (champ.type === 1) {
                            url = `${API_BASE}/matches/league_standing_stage/${champ.url_id}`;
                        } else {
                            url = `${API_BASE}/matches/cups_teams_standings/${champ.url_id}/L/60`;
                        }
                        const data = await fetchFromProxy(url);
                        let teams = null;
                        if (data.data && data.data.league && data.data.league.stage0) {
                            teams = data.data.league.stage0;
                        } else if (data.data && data.data.standings && data.data.standings.groups) {
                            teams = [];
                            for (const group in data.data.standings.groups) {
                                teams = teams.concat(data.data.standings.groups[group]);
                            }
                        }
                        if (teams && teams.length) {
                            standingsHtml += renderStandingsTable(teams, teamId);
                        } else {
                            standingsHtml += '<p>No standings data</p>';
                        }
                    } catch (err) {
                        standingsHtml += '<p>Failed to load standings</p>';
                    }
                }
                container.innerHTML = standingsHtml || '<p>No championships</p>';
            } catch (err) {
                container.innerHTML = '<p>Failed to load standings</p>';
            }
        }

        function renderTeamCups(cups) {
            let html = '<ul>';
            cups.forEach(cup => {
                html += `<li><img src="${IMG_BASE_CHAMP + cup.champ.image}" class="champ-img" style="width:20px;height:20px;"> ${cup.champ.title} (${cup.numbers})</li>`;
            });
            html += '</ul>';
            return html;
        }

        // ========== Player Modal ==========
        async function openPlayerModal(playerId) {
            showLoading();
            try {
                const url = `${API_BASE}/info/player_info/${playerId}/L/60`;
                const data = await fetchFromProxy(url);
                renderPlayerModal(data.data);
                document.getElementById('playerModalTitle').textContent = data.data.title;
                const modal = new bootstrap.Modal(document.getElementById('playerModal'));
                modal.show();
            } catch (err) {
                console.error(err);
                showError('Failed to load player info');
            } finally {
                hideLoading();
            }
        }

        function renderPlayerModal(playerInfo) {
            const body = document.getElementById('playerModalBody');
            const coverUrl = playerInfo.image_cover ? IMG_BASE_PLAYER_COVER + playerInfo.image_cover : null;
            let html = '';

            if (coverUrl) {
                html += `
                    <div style="background: url('${coverUrl}') center/cover; height: 180px; border-radius: 12px; margin-bottom: 15px;"></div>
                `;
            }

            html += `
                <div class="d-flex align-items-center mb-3">
                    <img src="${IMG_BASE_PLAYER + playerInfo.image}" class="player-img me-2" style="width:60px;height:60px;">
                    <h4>${playerInfo.title}</h4>
                </div>
                <p><strong>Club:</strong> <span class="link-item" onclick="openTeamModal(${playerInfo.team_name.row_id})">${playerInfo.team_name.title}</span></p>
                <p><strong>Position:</strong> ${playerInfo.position ? getPositionFullName(playerInfo.position) : 'Unknown'}</p>
                <p><strong>Height:</strong> ${playerInfo.height ? playerInfo.height + ' cm' : 'Unknown'}</p>
                <p><strong>Weight:</strong> ${playerInfo.weight ? playerInfo.weight + ' kg' : 'Unknown'}</p>
                <p><strong>Birth Date:</strong> ${playerInfo.birth_day || 'Unknown'}</p>
                <p><strong>Country:</strong> ${playerInfo.country ? playerInfo.country.title : ''}</p>
                <hr>
                <h6>Statistics</h6>
                ${playerInfo.player_statistics ? renderPlayerStats(playerInfo.player_statistics) : '<p>No stats</p>'}
                <hr>
                <h6>Transfers</h6>
                ${playerInfo.transfers ? renderPlayerTransfers(playerInfo.transfers) : '<p>No transfers</p>'}
            `;
            body.innerHTML = html;
        }

        function renderPlayerStats(stats) {
            let html = '<ul>';
            stats.forEach(stat => {
                html += `<li>${stat.league.title}: ${stat.appearances} apps, ${stat.goals} goals, ${stat.assist} assists</li>`;
            });
            html += '</ul>';
            return html;
        }

        function renderPlayerTransfers(transfers) {
            let html = '<ul>';
            transfers.forEach(t => {
                html += `<li>${t.team_in.title} (${t.value}) - ${t.trans}</li>`;
            });
            html += '</ul>';
            return html;
        }

        // ========== Coach Modal ==========
        async function openCoachModal(coachId) {
            showLoading();
            try {
                const url = `${API_BASE}/info/coach_info/${coachId}`;
                const data = await fetchFromProxy(url);
                renderCoachModal(data.data);
                document.getElementById('coachModalTitle').textContent = data.data.title;
                const modal = new bootstrap.Modal(document.getElementById('coachModal'));
                modal.show();
            } catch (err) {
                console.error(err);
                showError('Failed to load coach info');
            } finally {
                hideLoading();
            }
        }

        function renderCoachModal(coachInfo) {
            const body = document.getElementById('coachModalBody');
            const coverUrl = coachInfo.image_cover ? IMG_BASE_COACH_COVER + coachInfo.image_cover : null;
            let html = '';

            if (coverUrl) {
                html += `
                    <div style="background: url('${coverUrl}') center/cover; height: 180px; border-radius: 12px; margin-bottom: 15px;"></div>
                `;
            }

            html += `
                <div class="d-flex align-items-center mb-3">
                    <img src="${IMG_BASE_COACH + coachInfo.image}" class="player-img me-2" style="width:60px;height:60px;">
                    <h4>${coachInfo.title}</h4>
                </div>
                <p><strong>Birth Date:</strong> ${coachInfo.birth_date || 'Unknown'}</p>
                <p><strong>Country:</strong> ${coachInfo.country ? coachInfo.country.title : ''}</p>
                <hr>
                <h6>Coaching Career</h6>
                ${coachInfo.teams_c ? renderCoachTeams(coachInfo.teams_c) : '<p>No data</p>'}
            `;
            body.innerHTML = html;
        }

        function renderCoachTeams(teams) {
            let html = '<ul>';
            teams.forEach(t => {
                html += `<li><span class="link-item" onclick="openTeamModal(${t.team.row_id})">${t.team.title}</span> (${t.from} - ${t.to}) ${t.type}</li>`;
            });
            html += '</ul>';
            return html;
        }

        // ========== News Modal ==========
        async function openNewsModal(newsId) {
            showLoading();
            try {
                const newsDetailUrl = `${NEWS_BASE}/News/news_detail/${newsId}`;
                const commentsUrl = `${NEWS_BASE}/comments/get_comment_news/${newsId}/0/1?page=1`;

                const [newsDetail, comments] = await Promise.all([
                    fetchFromProxy(newsDetailUrl),
                    fetchFromProxy(commentsUrl)
                ]);

                renderNewsModal(newsDetail.data, comments.data);
                document.getElementById('newsModalTitle').textContent = newsDetail.data.title;
                const modal = new bootstrap.Modal(document.getElementById('newsModal'));
                modal.show();
            } catch (err) {
                console.error(err);
                showError('Failed to load news detail');
            } finally {
                hideLoading();
            }
        }

        function renderNewsModal(newsData, commentsData) {
            const body = document.getElementById('newsModalBody');
            let html = `
                <img src="https://imgs.ysscores.com/news/820/${newsData.image}" class="img-fluid mb-3" alt="${newsData.title}" onerror="this.style.display='none'">
                <h4>${newsData.title}</h4>
                <p class="text-muted">${newsData.created_at.date} | ❤️ ${newsData.likes_count} | 👎 ${newsData.dislikes_count}</p>
                <div class="news-full-content">${newsData.full_news}</div>
                <hr>
                <h6>Comments (${commentsData.total_all || 0})</h6>
            `;

            if (commentsData.data && commentsData.data.length > 0) {
                html += '<ul class="list-group">';
                commentsData.data.forEach(comment => {
                    html += `<li class="list-group-item">${comment.content || ''}</li>`;
                });
                html += '</ul>';
            } else {
                html += '<p>No comments</p>';
            }

            body.innerHTML = html;
        }

        // Initialize
        loadChampionships();
    </script>
</body>
    </html>
