<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zi Store - Live Sports & Matches</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        /* ===================== CSS Variables & Themes ===================== */
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-glass: rgba(18, 18, 26, 0.8);
            --surface-hover: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.08);
            --text: #f0f0f0;
            --text-secondary: #b0b0b8;
            --accent: #e4a83d;
            --accent2: #d4942b;
            --accent-glow: rgba(228,168,61,0.5);
            --live: #e53935;
            --live-glow: rgba(229,57,53,0.7);
            --shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px var(--border);
            --radius: 16px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --header-bg: rgba(10,10,18,0.85);
        }

        [data-theme="light"] {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface-glass: rgba(255,255,255,0.85);
            --surface-hover: rgba(0,0,0,0.05);
            --border: rgba(0,0,0,0.08);
            --text: #1a1a2e;
            --text-secondary: #555;
            --accent: #0284c7;
            --accent2: #0369a1;
            --accent-glow: rgba(2,132,199,0.4);
            --live: #dc2626;
            --live-glow: rgba(220,38,38,0.6);
            --shadow: 0 10px 30px rgba(0,0,0,0.1), 0 0 0 1px var(--border);
            --header-bg: rgba(255,255,255,0.9);
        }

        [data-theme="legendary"] {
            --bg: #1a0f0a;
            --surface: #2d1f14;
            --surface-glass: rgba(45,31,20,0.85);
            --surface-hover: rgba(255,255,255,0.08);
            --border: rgba(255,215,0,0.3);
            --text: #ffd700;
            --text-secondary: #d4a574;
            --accent: #ff6b00;
            --accent2: #e05a00;
            --accent-glow: rgba(255,107,0,0.6);
            --live: #ff0000;
            --live-glow: rgba(255,0,0,0.8);
            --shadow: 0 25px 60px rgba(255,215,0,0.2), 0 0 0 1px var(--border);
            --header-bg: rgba(26,15,10,0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: var(--font);
            min-height: 100vh;
            direction: ltr;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            color: var(--text);
            transition: background 0.4s, color 0.4s;
            overflow-x: hidden;
        }

        /* ============ Animated Background ============ */
        .zs-bg-effects { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .zs-bg-effects span { position: absolute; border-radius: 50%; background: var(--accent); opacity: 0.05; animation: float 15s infinite ease-in-out; }
        .zs-bg-effects span:nth-child(1) { width: 300px; height: 300px; top: -100px; left: -100px; }
        .zs-bg-effects span:nth-child(2) { width: 200px; height: 200px; bottom: -50px; right: -50px; animation-delay: 3s; }
        .zs-bg-effects span:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 50%; animation-delay: 6s; }
        @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-30px) scale(1.1); } 66% { transform: translate(-20px,20px) scale(0.9); } }

        /* ============ App Layout ============ */
        .zs-app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

        /* ============ Header ============ */
        .zs-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; flex-wrap: wrap; gap: 12px; }
        .zs-header-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; letter-spacing: 0.5px; cursor: pointer; }
        .zs-brand-icon { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #0a0a0f; box-shadow: 0 0 20px var(--accent-glow); animation: logo-pulse 3s infinite ease-in-out, logo-rotate 8s linear infinite; position: relative; }
        .zs-brand-icon::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0.5; animation: logo-ring 2s infinite; }
        @keyframes logo-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes logo-rotate { 0% { background: linear-gradient(135deg, var(--accent), var(--accent2)); } 50% { background: linear-gradient(135deg, var(--accent2), var(--accent)); } 100% { background: linear-gradient(135deg, var(--accent), var(--accent2)); } }
        @keyframes logo-ring { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 0; } }
        .zs-header-tagline { font-size: 14px; color: var(--text-secondary); background: var(--surface-glass); padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }

        /* Theme Switch */
        .zs-theme-switch { display: flex; gap: 6px; background: var(--surface-glass); border-radius: 30px; padding: 4px; border: 1px solid var(--border); }
        .zs-theme-btn { padding: 8px 14px; border-radius: 25px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--font); transition: all var(--transition); display: flex; align-items: center; gap: 5px; }
        .zs-theme-btn:hover { color: var(--text); background: var(--surface-hover); }
        .zs-theme-btn.zs-active { background: var(--accent); color: #0a0a0f; box-shadow: 0 0 15px var(--accent-glow); }

        /* ============ Main Layout ============ */
        .zs-main { flex: 1; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; align-items: flex-start; }
        .zs-player-section { flex: 1 1 100%; max-width: 100%; min-width: 0; }
        @media (min-width: 1000px) { .zs-player-section { flex: 1 1 calc(100% - 380px); max-width: calc(100% - 380px); } }
        .zs-channels-section { flex: 1 1 100%; background: var(--surface-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; min-height: 400px; max-height: 70vh; box-shadow: var(--shadow); }
        @media (min-width: 1000px) { .zs-channels-section { flex: 0 0 360px; min-height: auto; max-height: calc(100vh - 140px); position: sticky; top: 90px; } }
        .zs-channels-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; background: var(--surface-glass); }
        .zs-channels-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; color: var(--accent); }
        .zs-search-box { position: relative; }
        .zs-search-box input { width: 100%; padding: 10px 36px 10px 14px; border-radius: 25px; border: 1px solid var(--border); background: var(--surface-hover); color: var(--text); font-size: 14px; outline: none; transition: all var(--transition); font-family: var(--font); }
        .zs-search-box input::placeholder { color: var(--text-secondary); }
        .zs-search-box input:focus { border-color: var(--accent); background: var(--surface-glass); box-shadow: 0 0 0 3px rgba(228,168,61,0.15); }
        .zs-search-icon { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); color: var(--text-secondary); font-size: 14px; pointer-events: none; }

        .zs-category-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .zs-category-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 13px; font-family: var(--font); transition: all var(--transition); white-space: nowrap; }
        .zs-category-tab:hover { background: var(--surface-hover); color: var(--text); }
        .zs-category-tab.zs-active { background: var(--accent); color: #0a0a0f; border-color: var(--accent); font-weight: 700; box-shadow: 0 0 12px var(--accent-glow); }

        .zs-channels-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
        .zs-channels-list::-webkit-scrollbar { width: 6px; }
        .zs-channels-list::-webkit-scrollbar-track { background: transparent; }
        .zs-channels-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

        /* ============ Channel / Match Card ============ */
        .zs-channel-card { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: var(--radius-sm); background: var(--surface-hover); border: 1px solid var(--border); cursor: pointer; transition: all var(--transition); position: relative; overflow: hidden; }
        .zs-channel-card:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
        .zs-channel-card.zs-active { background: linear-gradient(135deg, rgba(228,168,61,0.2), rgba(228,168,61,0.05)); border-color: var(--accent); box-shadow: 0 4px 20px rgba(228,168,61,0.3); }
        .zs-channel-card.zs-active::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .zs-channel-logo { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: #fff; flex-shrink: 0; border: 2px solid var(--border); overflow: hidden; }
        .zs-channel-logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; }
        .zs-channel-card.zs-active .zs-channel-logo { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0a0a0f; border-color: var(--accent); }

        .zs-channel-info { flex: 1; min-width: 0; }
        .zs-channel-name { font-weight: 700; font-size: 16px; line-height: 1.3; margin-bottom: 4px; }
        .zs-channel-cat { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .zs-channel-time { font-size: 11px; color: var(--accent); background: rgba(228,168,61,0.1); padding: 2px 8px; border-radius: 12px; white-space: nowrap; }

        .zs-channel-status { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; }
        .zs-channel-card.zs-active .zs-channel-status { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .zs-channel-live { font-size: 11px; color: var(--live); font-weight: 700; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .zs-channel-live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: live-pulse 1.4s infinite; }
        @keyframes live-pulse { 0%,100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 var(--live-glow); } 50% { transform: scale(1.5); opacity: 0.7; box-shadow: 0 0 12px var(--live-glow); } }

        /* ============ Player ============ */
        .zs-player-wrapper { position: relative; width: 100%; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); aspect-ratio: 16 / 9; cursor: pointer; direction: ltr; transition: all var(--transition); border: 1px solid var(--border); }
        .zs-player-wrapper.zs-theater { border-radius: 0; }
        .zs-player-wrapper.zs-fullscreen { border-radius: 0; aspect-ratio: unset; }
        .zs-video-container { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .zs-video-container video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }

        /* Overlays & Controls (omitted for brevity but included in full code) */
        /* ... (same as previous full code) ... */

        /* Responsive */
        @media (max-width: 600px) {
            .zs-header { padding: 10px 12px; }
            .zs-brand-icon { width: 36px; height: 36px; font-size: 18px; }
            .zs-header-brand span { font-size: 18px; }
            .zs-main { padding: 10px; gap: 10px; }
            .zs-player-wrapper { border-radius: 0; }
            .zs-controls { padding: 6px 8px 8px; gap: 3px; }
            .zs-btn { width: 32px; height: 32px; }
            .zs-btn svg { width: 18px; height: 18px; }
            .zs-volume-slider { width: 40px; }
            .zs-time-display { font-size: 10px; min-width: 55px; }
            .zs-watermark { top: 10px; left: 10px; }
            .zs-watermark-icon { width: 24px; height: 24px; font-size: 12px; }
            .zs-watermark-text { font-size: 11px; padding: 3px 8px; }
            .zs-live-badge { top: 10px; right: 10px; }
            .zs-start-play-btn { width: 70px; height: 70px; font-size: 30px; }
            .zs-channels-section { max-height: 50vh; }
            .zs-channel-card { padding: 12px; }
            .zs-channel-logo { width: 50px; height: 50px; }
            .zs-channel-name { font-size: 14px; }
        }
    </style>
</head>

            // ==================== Load Matches from API via Worker ====================
            async function loadMatchesFromAPI() {
                try {
                    const response = await fetch(MATCHES_API_URL);
                    if (!response.ok) throw new Error('Worker failed to fetch matches');
                    const data = await response.json();
                    if (!Array.isArray(data)) throw new Error('Invalid data format');

                    const matchChannels = data
                        .filter(m => m.sources && m.sources.length > 0 && m.sources[0].streamUrl)
                        .map((m, index) => ({
                            id: 3000 + index,
                            name: `${m.homeName || 'Unknown'} vs ${m.awayName || 'Unknown'}`,
                            category: m.leagueName || 'Match',
                            logo: m.homeLogoUrl || '🏟️',
                            url: m.sources[0].streamUrl,
                            live: true,
                            startTime: m.startTime || null,
                            isMatch: true
                        }));

                    // Remove old match entries then add new ones
                    channels = channels.filter(ch => !ch.isMatch);
                    channels = channels.concat(matchChannels);
                    renderChannels();

                    // Auto-play first match if no channel is active
                    if (matchChannels.length > 0 && !currentChannelId) {
                        changeChannel(matchChannels[0]);
                    }
                } catch (error) {
                    console.warn('Could not load matches via API, keeping stable channels only.', error);
                }
            }

            // ==================== Initialization ====================
            function init() {

                try {

                buildQualityMenu();
                showControls();
                startOverlay.classList.remove('zs-hidden');

                loadMatchesFromAPI();

                setInterval(loadMatchesFromAPI, 300000);
