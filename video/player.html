<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zi Store - مشغل القنوات الرياضية مع دعم الروابط الخارجية</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        :root {
            --zs-bg: #0a0a0f;
            --zs-surface: #12121a;
            --zs-controls-bg: rgba(10, 10, 18, 0.92);
            --zs-accent: #e4a83d;
            --zs-accent2: #d4942b;
            --zs-text: #f0f0f0;
            --zs-text-secondary: #b0b0b8;
            --zs-live: #e53935;
            --zs-live-glow: rgba(229, 57, 53, 0.6);
            --zs-border: rgba(255, 255, 255, 0.08);
            --zs-radius: 14px;
            --zs-radius-sm: 8px;
            --zs-transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            --zs-font: 'Segoe UI', 'Tahoma', 'Geneva', 'Verdana', sans-serif;
            --zs-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--zs-border), 0 0 80px rgba(228, 168, 61, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #05050a;
            font-family: var(--zs-font);
            min-height: 100vh;
            direction: rtl;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            color: var(--zs-text);
        }

        /* ============ APP LAYOUT ============ */
        .zs-app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .zs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--zs-border);
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap;
            gap: 8px;
        }
        .zs-header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.5px;
        }
        .zs-brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--zs-accent), #c77d1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 22px;
            color: #0a0a0f;
            box-shadow: 0 4px 14px rgba(228,168,61,0.3);
        }
        .zs-header-tagline {
            font-size: 14px;
            color: var(--zs-text-secondary);
            background: rgba(255,255,255,0.07);
            padding: 4px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .zs-main {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            align-items: flex-start;
        }

        /* Player Section - larger */
        .zs-player-section {
            flex: 1 1 100%;
            max-width: 100%;
            min-width: 0;
        }
        @media (min-width: 900px) {
            .zs-player-section {
                flex: 1 1 calc(100% - 320px); /* increased player width */
                max-width: calc(100% - 320px);
            }
        }

        .zs-channels-section {
            flex: 1 1 100%;
            background: var(--zs-surface);
            border-radius: var(--zs-radius);
            border: 1px solid var(--zs-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 400px;
            max-height: 70vh;
        }
        @media (min-width: 900px) {
            .zs-channels-section {
                flex: 0 0 300px; /* slightly narrower */
                min-height: auto;
                max-height: calc(100vh - 140px);
                position: sticky;
                top: 80px;
            }
        }

        .zs-channels-header {
            padding: 16px 18px;
            border-bottom: 1px solid var(--zs-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255,255,255,0.02);
        }
        .zs-channels-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .zs-channels-title .zs-title-icon {
            font-size: 20px;
        }
        .zs-search-box { position: relative; }
        .zs-search-box input {
            width: 100%;
            padding: 10px 36px 10px 14px;
            border-radius: 22px;
            border: 1px solid var(--zs-border);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all var(--zs-transition);
            font-family: var(--zs-font);
        }
        .zs-search-box input::placeholder { color: #888; }
        .zs-search-box input:focus {
            border-color: var(--zs-accent);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px rgba(228,168,61,0.15);
        }
        .zs-search-icon {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            color: #888;
            font-size: 14px;
            pointer-events: none;
        }

        .zs-category-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .zs-category-tab {
            padding: 6px 14px;
            border-radius: 18px;
            border: 1px solid var(--zs-border);
            background: transparent;
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--zs-font);
            transition: all var(--zs-transition);
            white-space: nowrap;
        }
        .zs-category-tab:hover { background: rgba(255,255,255,0.08); }
        .zs-category-tab.zs-active {
            background: var(--zs-accent);
            color: #0a0a0f;
            border-color: var(--zs-accent);
            font-weight: 700;
        }

        .zs-channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .zs-channels-list::-webkit-scrollbar { width: 6px; }
        .zs-channels-list::-webkit-scrollbar-track { background: transparent; }
        .zs-channels-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .zs-channel-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--zs-radius-sm);
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--zs-transition);
            position: relative;
        }
        .zs-channel-card:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }
        .zs-channel-card.zs-active {
            background: rgba(228,168,61,0.12);
            border-color: var(--zs-accent);
            box-shadow: 0 4px 16px rgba(228,168,61,0.15);
        }
        .zs-channel-card.zs-active::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 70%;
            background: var(--zs-accent);
            border-radius: 0 4px 4px 0;
        }
        .zs-channel-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .zs-channel-card.zs-active .zs-channel-logo {
            background: linear-gradient(135deg, var(--zs-accent), #c77d1a);
            color: #0a0a0f;
            border-color: var(--zs-accent);
        }
        .zs-channel-info { flex: 1; min-width: 0; }
        .zs-channel-name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .zs-channel-cat {
            font-size: 11px;
            color: var(--zs-text-secondary);
            margin-top: 2px;
        }
        .zs-channel-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
        }
        .zs-channel-card.zs-active .zs-channel-status {
            background: var(--zs-accent);
            box-shadow: 0 0 8px var(--zs-accent);
        }
        .zs-channel-live {
            font-size: 10px;
            color: var(--zs-live);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .zs-channel-live::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--zs-live);
            animation: zs-live-pulse 1.4s infinite;
        }

        @keyframes zs-live-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.4; }
        }

        .zs-no-results {
            text-align: center;
            padding: 30px 10px;
            color: #888;
            font-size: 13px;
        }

        /* ============ External Link Buttons ============ */
        .zs-external-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .zs-external-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px dashed rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.04);
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--zs-font);
            transition: all var(--zs-transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .zs-external-btn:hover {
            background: rgba(228,168,61,0.1);
            border-color: var(--zs-accent);
            color: #fff;
        }

        /* ============ MODAL ============ */
        .zs-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .zs-modal-overlay.zs-open { display: flex; }
        .zs-modal {
            background: var(--zs-surface);
            border-radius: var(--zs-radius);
            border: 1px solid var(--zs-border);
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: zs-modal-in 0.3s ease;
        }
        @keyframes zs-modal-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .zs-modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .zs-modal-field { margin-bottom: 14px; }
        .zs-modal-field label {
            display: block;
            font-size: 13px;
            color: var(--zs-text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .zs-modal-field input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--zs-border);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: var(--zs-font);
            transition: all var(--zs-transition);
        }
        .zs-modal-field input:focus {
            border-color: var(--zs-accent);
            box-shadow: 0 0 0 3px rgba(228,168,61,0.15);
        }
        .zs-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .zs-modal-btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--zs-font);
            transition: all var(--zs-transition);
        }
        .zs-modal-btn.zs-cancel {
            background: rgba(255,255,255,0.1);
            color: #ccc;
        }
        .zs-modal-btn.zs-cancel:hover { background: rgba(255,255,255,0.15); }
        .zs-modal-btn.zs-submit {
            background: var(--zs-accent);
            color: #0a0a0f;
        }
        .zs-modal-btn.zs-submit:hover { background: var(--zs-accent2); }

        /* ============ PLAYER (Enhanced) ============ */
        .zs-player-wrapper {
            position: relative;
            width: 100%;
            background: var(--zs-bg);
            border-radius: var(--zs-radius);
            overflow: hidden;
            box-shadow: var(--zs-shadow);
            aspect-ratio: 16 / 9;
            cursor: pointer;
            direction: rtl;
            transition: all var(--zs-transition);
        }
        .zs-player-wrapper.zs-theater {
            max-width: 100%;
            border-radius: 0;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 0 1px var(--zs-border);
        }
        .zs-player-wrapper.zs-fullscreen {
            max-width: 100%;
            width: 100%;
            height: 100%;
            border-radius: 0;
            aspect-ratio: unset;
        }

        .zs-video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        .zs-video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* Start overlay */
        .zs-start-overlay {
            position: absolute;
            inset: 0;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: opacity 0.4s, visibility 0.4s;
        }
        .zs-start-overlay.zs-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .zs-start-play-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--zs-accent);
            color: #0a0a0f;
            font-size: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(228,168,61,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            outline: none;
            font-family: var(--zs-font);
            line-height: 1;
            margin-bottom: 18px;
            position: relative;
        }
        .zs-start-play-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 12px 36px rgba(228,168,61,0.7);
        }
        .zs-start-play-btn:active { transform: scale(0.95); }
        .zs-start-play-btn::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid var(--zs-accent);
            opacity: 0;
            animation: zs-ring 1.5s infinite;
        }
        @keyframes zs-ring {
            0% { transform: scale(0.8); opacity: 0.7; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .zs-start-brand {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .zs-start-brand span {
            background: rgba(255,255,255,0.12);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            color: #ddd;
        }

        .zs-watermark {
            position: absolute;
            top: 22px;
            left: 22px;
            right: auto;
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 9px;
            opacity: 0.78;
            transition: opacity 0.5s;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
        }
        .zs-watermark-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--zs-accent), #c77d1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            color: #0a0a0f;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .zs-watermark-text {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.6px;
            white-space: nowrap;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .zs-live-badge {
            position: absolute;
            top: 22px;
            right: 22px;
            left: auto;
            z-index: 10;
            pointer-events: none;
            display: none;
            align-items: center;
            gap: 7px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .zs-live-badge.zs-visible { display: flex; }
        .zs-live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--zs-live);
            animation: zs-live-pulse 1.4s infinite ease-in-out;
            box-shadow: 0 0 10px var(--zs-live-glow), 0 0 24px var(--zs-live-glow);
        }
        .zs-live-text {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .zs-loading {
            position: absolute;
            inset: 0;
            z-index: 8;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.45);
            pointer-events: none;
        }
        .zs-loading.zs-visible { display: flex; }
        .zs-spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--zs-accent);
            border-radius: 50%;
            animation: zs-spin 0.8s linear infinite;
        }
        @keyframes zs-spin { to { transform: rotate(360deg); } }

        .zs-error-overlay {
            position: absolute;
            inset: 0;
            z-index: 12;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            gap: 16px;
            text-align: center;
            padding: 20px;
        }
        .zs-error-overlay.zs-visible { display: flex; }
        .zs-error-icon { font-size: 48px; margin-bottom: 4px; }
        .zs-error-title { font-size: 18px; font-weight: 700; color: #fff; }
        .zs-error-msg { font-size: 13px; color: #b0b0b8; max-width: 340px; }
        .zs-error-retry {
            padding: 10px 28px;
            background: var(--zs-accent);
            color: #0a0a0f;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            font-family: var(--zs-font);
            transition: all var(--zs-transition);
            letter-spacing: 0.4px;
        }
        .zs-error-retry:hover {
            background: var(--zs-accent2);
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(228,168,61,0.35);
        }

        /* Controls */
        .zs-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 11;
            background: var(--zs-controls-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 14px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity var(--zs-transition), transform var(--zs-transition);
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
        }
        .zs-controls.zs-hidden {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }

        .zs-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all var(--zs-transition);
            flex-shrink: 0;
            position: relative;
            font-family: var(--zs-font);
            padding: 0;
        }
        .zs-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .zs-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .zs-btn:active { transform: scale(0.9); }
        .zs-btn.zs-active { color: var(--zs-accent); background: rgba(228,168,61,0.12); }
        .zs-btn-play { font-size: 22px; }
        .zs-btn-play svg { width: 24px; height: 24px; }

        .zs-volume-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .zs-volume-slider {
            width: 70px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            transition: width var(--zs-transition);
        }
        .zs-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;

            let currentQuality = -1;
            let qualityLevels = [];
            let lastVolume = 100;
            let screenshotCanvas = null;
            let activeCategory = 'all';
            let searchQuery = '';

            // ==================== HELPERS ====================
            function formatTime(seconds) {
                if (!isFinite(seconds) || seconds < 0) return '--:--';
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }

            function showLoading() { loadingEl.classList.add('zs-visible'); }
            function hideLoading() { loadingEl.classList.remove('zs-visible'); }

            function showError(msg) {
                errorMsg.textContent = msg || 'تعذر تشغيل البث. تحقق من الرابط أو جودة الاتصال.';
                errorOverlay.classList.add('zs-visible');
                hideLoading();
            }

            function hideError() { errorOverlay.classList.remove('zs-visible'); }

            function setLiveMode(live) {
                isLive = live;
                if (live) {
                    liveBadge.classList.add('zs-visible');
                    progressLive.style.display = 'flex';
                    progressFilled.style.display = 'none';
                    progressThumb.style.display = 'none';
                    progressBuffered.style.display = 'none';
                    timeDisplay.textContent = '🔴 مباشر';
                    progressWrap.style.pointerEvents = 'none';
                } else {
                    liveBadge.classList.remove('zs-visible');
                    progressLive.style.display = 'none';
                    progressFilled.style.display = 'block';
                    progressThumb.style.display = 'block';
                    progressBuffered.style.display = 'block';
                    progressWrap.style.pointerEvents = 'auto';
                    updateTimeDisplay();
                }
            }

            function updateTimeDisplay() {
                if (isLive) {
                    timeDisplay.textContent = '🔴 مباشر';
                    return;
                }
                const cur = formatTime(video.currentTime);
                const dur = formatTime(video.duration);
                timeDisplay.textContent = `${cur} / ${dur}`;
            }

            function updateProgress() {
                if (isLive || !video.duration || !isFinite(video.duration)) {
                    progressFilled.style.width = '0%';
                    progressBuffered.style.width = '0%';
                    progressThumb.style.left = '0%';
                    return;
                }
                const pct = (video.currentTime / video.duration) * 100;
                progressFilled.style.width = pct + '%';
                progressThumb.style.left = pct + '%';
                if (video.buffered.length > 0) {
                    const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                    const buffPct = (bufferedEnd / video.duration) * 100;
                    progressBuffered.style.width = buffPct + '%';
                }
            }

            function updatePlayButton() {
                if (video.paused || video.ended) {
                    btnPlay.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                    btnPlay.title = 'تشغيل';
                } else {
                    btnPlay.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                    btnPlay.title = 'إيقاف';
                }
            }

            function updateMuteButton() {
                if (video.muted || video.volume === 0) {
                    btnMute.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
                    volumeSlider.value = 0;
                } else {
                    btnMute.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
                    volumeSlider.value = Math.round(video.volume * 100);
                }
            }

            function buildQualityMenu() {
                qualityMenu.innerHTML = '';
                const autoLi = document.createElement('li');
                autoLi.dataset.quality = '-1';
                autoLi.textContent = 'تلقائي';
                if (currentQuality === -1) autoLi.classList.add('zs-selected');
                autoLi.addEventListener('click', () => setQuality(-1));
                qualityMenu.appendChild(autoLi);

                qualityLevels.forEach((level, index) => {
                    const li = document.createElement('li');
                    li.dataset.quality = index;
                    const height = level.height || (level.bitrate ? Math.round(level.bitrate / 1000) + 'k' : 'جودة ' + (index + 1));
                    let label = '';
                    if (level.height) {
                        if (level.height >= 2160) label = '4K (2160p)';
                        else if (level.height >= 1440) label = '2K (1440p)';
                        else if (level.height >= 1080) label = 'Full HD (1080p)';
                        else if (level.height >= 720) label = 'HD (720p)';
                        else if (level.height >= 480) label = 'SD (480p)';
                        else label = level.height + 'p';
                    } else {
                        label = height;
                    }
                    if (level.bitrate) label += ' • ' + Math.round(level.bitrate / 1000) + 'kbps';
                    li.textContent = label;
                    if (currentQuality === index) li.classList.add('zs-selected');
                    li.addEventListener('click', () => setQuality(index));
                    qualityMenu.appendChild(li);
                });

                document.getElementById('zsQualityDropdown').style.display = qualityLevels.length > 0 ? 'block' : 'none';
            }

            function setQuality(index) {
                currentQuality = index;
                if (hls && isHLS) {
                    if (index === -1) hls.currentLevel = -1;
                    else if (index >= 0 && index < hls.levels.length) hls.currentLevel = index;
                }
                buildQualityMenu();
                try { localStorage.setItem('zs-quality', index); } catch (e) {}
            }

            function setSpeed(speed) {
                currentSpeed = speed;
                video.playbackRate = speed;
                speedMenu.querySelectorAll('li').forEach(li => {
                    li.classList.toggle('zs-selected', parseFloat(li.dataset.speed) === speed);
                });
                try { localStorage.setItem('zs-speed', speed); } catch (e) {}
            }

            function triggerScreenshot() {
                if (!video.videoWidth || !video.videoHeight) return;
                if (!screenshotCanvas) screenshotCanvas = document.createElement('canvas');
                screenshotCanvas.width = video.videoWidth;
                screenshotCanvas.height = video.videoHeight;
                const ctx = screenshotCanvas.getContext('2d');
                ctx.drawImage(video, 0, 0, screenshotCanvas.width, screenshotCanvas.height);
                ctx.fillStyle = 'rgba(255,255,255,0.75)';
                ctx.font = 'bold ' + Math.max(18, screenshotCanvas.width * 0.025) + 'px "Segoe UI", Tahoma, sans-serif';
                ctx.textAlign = 'right';
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 6;
                ctx.fillText('Zi Store', screenshotCanvas.width - 25, screenshotCanvas.height - 20);
                ctx.shadowBlur = 0;
                screenshotCanvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'ZiStore_Screenshot_' + new Date().toISOString().replace(/[:.]/g, '-') + '.png';
                    a.click();
                    URL.revokeObjectURL(url);
                }, 'image/png');
                flashEl.classList.add('zs-active');
                setTimeout(() => flashEl.classList.remove('zs-active'), 100);
            }

            function toggleFullscreen() {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } else {
                    const el = wrapper;
                    if (el.requestFullscreen) el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                }
            }

            function toggleTheater() {
                wrapper.classList.toggle('zs-theater');
                const isTheater = wrapper.classList.contains('zs-theater');
                btnTheater.classList.toggle('zs-active', isTheater);
                try { localStorage.setItem('zs-theater', isTheater ? '1' : '0'); } catch (e) {}
            }

            async function togglePiP() {
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                    } else if (document.pictureInPictureEnabled && video.readyState >= 1) {
                        await video.requestPictureInPicture();
                    }
                } catch (e) {}
            }

            function togglePlay() {
                if (video.paused || video.ended) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                }
                updatePlayButton();
                resetControlsTimer();
            }

            function setVolume(val) {
                video.volume = val / 100;
                video.muted = (val === 0);
                updateMuteButton();
                try { localStorage.setItem('zs-volume', val); } catch (e) {}
            }

            function toggleMute() {
                if (video.muted || video.volume === 0) {
                    video.muted = false;
                    video.volume = lastVolume / 100 || 1;
                    volumeSlider.value = lastVolume || 100;
                } else {
                    lastVolume = Math.round(video.volume * 100);
                    video.muted = true;
                    volumeSlider.value = 0;
                }
                updateMuteButton();
            }

            function showControls() {
                controls.classList.remove('zs-hidden');
                resetControlsTimer();
            }

            function hideControls() {
                if (!video.paused && !document.querySelector('.zs-dropdown-menu.zs-open')) {
                    controls.classList.add('zs-hidden');
                }
            }

            function resetControlsTimer() {
                if (controlsHideTimeout) clearTimeout(controlsHideTimeout);
                if (!video.paused) {
                    controlsHideTimeout = setTimeout(hideControls, 3500);
                }
            }

            function closeAllDropdowns() {
                document.querySelectorAll('.zs-dropdown-menu.zs-open').forEach(m => m.classList.remove('zs-open'));
            }

            function toggleDropdown(menu) {
                const isOpen = menu.classList.contains('zs-open');
                closeAllDropdowns();
                if (!isOpen) menu.classList.add('zs-open');
            }

            // ==================== STREAM INIT ====================
            function destroyExistingPlayer() {
                if (hls) { hls.destroy(); hls = null; }
                if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
                isHLS = false;
                isDASH = false;
                qualityLevels = [];
                currentQuality = -1;
                reconnectAttempts = 0;
                if (reconnectTimeout) clearTimeout(reconnectTimeout);
                video.pause();
                video.removeAttribute('src');
                video.load();
                hideError();
                hideLoading();
                setLiveMode(false);
                buildQualityMenu();
            }

            function loadStream(url) {
                destroyExistingPlayer();
                hideError();
                showLoading();
                startOverlay.classList.add('zs-hidden');

                const lowerUrl = url.toLowerCase().trim();
                if (lowerUrl.endsWith('.m3u8') || lowerUrl.includes('.m3u8')) {
                    loadHLS(url);
                } else if (lowerUrl.endsWith('.mpd') || lowerUrl.includes('.mpd')) {
                    loadDASH(url);
                } else if (lowerUrl.endsWith('.mp4') || lowerUrl.endsWith('.webm') || lowerUrl.endsWith('.ogg') || lowerUrl.endsWith('.mov')) {
                    loadDirect(url);
                } else {
                    loadHLS(url);
                }
            }

            function loadHLS(url) {
                if (Hls.isSupported()) {
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 90,
                        maxBufferLength: 30,
                        maxMaxBufferLength: 60,
                        liveDurationInfinity: true,
                        liveBackBufferLength: 60,
                        manifestLoadingTimeOut: 20000,
                        manifestLoadingMaxRetry: 4,
                        levelLoadingTimeOut: 15000,
                        levelLoadingMaxRetry: 4,
                        fragLoadingTimeOut: 20000,
                        fragLoadingMaxRetry: 6,
                        startFragPrefetch: true,
                        testBandwidth: true,
                    });
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                        hideLoading();
                        hideError();
                        qualityLevels = data.levels.map(l => ({ height: l.height, bitrate: l.bitrate, width: l.width }));
                        buildQualityMenu();
                        const liveDetected = data.levels.some(l => l.details && l.details.live === true) ||
                            (hls.levels && hls.levels.length > 0 && hls.levels[0].details && hls.levels[0].details.live);
                        setLiveMode(liveDetected || (data.levels.length > 0 && !isFinite(data.levels[0].details?.totalduration)));
                        try {
                            const saved = localStorage.getItem('zs-quality');
                            if (saved !== null) setQuality(parseInt(saved));
                        } catch (e) {}
                        video.play().catch(() => {});
                        updatePlayButton();
                        resetControlsTimer();
                    });
                    hls.on(Hls.Events.LEVEL_SWITCHED, function(event, data) {
                        currentQuality = data.level;
                        buildQualityMenu();
                    });
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    handleReconnect(url, 'hls');
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    showError('خطأ في البث: ' + (data.details || 'غير معروف'));
                                    break;
                            }
                        }
                    });
                    isHLS = true;
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    loadDirect(url);
                    isHLS = true;
                } else {
                    showError('المتصفح لا يدعم تشغيل HLS. يرجى استخدام متصفح حديث.');
                }
            }

            function loadDASH(url) {
                try {
                    dashPlayer = dashjs.MediaPlayer().create();
                    dashPlayer.initialize(video, url, true);
                    dashPlayer.setAutoPlay(true);
                    dashPlayer.on(dashjs.MediaPlayer.events.MANIFEST_LOADED, function() {
                        hideLoading();
                        hideError();
                        const isDynamic = dashPlayer.isDynamic();
                        setLiveMode(isDynamic);
                        const bitrateInfo = dashPlayer.getBitrateInfoListFor('video');
                        if (bitrateInfo && bitrateInfo.length > 0) {
                            qualityLevels = bitrateInfo.map(b => ({ height: b.height, bitrate: b.bitrate, width: b.width }));
                            buildQualityMenu();
                        }
                        updatePlayButton();
                        resetControlsTimer();
                    });
                    dashPlayer.on(dashjs.MediaPlayer.events.ERROR, function(e) {
                        handleReconnect(url, 'dash');
                    });
                    isDASH = true;
                } catch (e) {
                    showError('تعذر تحميل مشغل DASH: ' + e.message);
                }
            }

            function loadDirect(url) {
                video.src = url;
                video.load();
                video.play().then(() => {
                    hideLoading();
                    hideError();
                    if (!isFinite(video.duration) || video.duration > 86400) {
                        setLiveMode(true);
                    } else {
                        setLiveMode(false);
                    }
                    updatePlayButton();
                    resetControlsTimer();
                }).catch(err => {
                    hideLoading();
                    showError('تعذر تشغيل الفيديو: ' + err.message);
                });
                document.getElementById('zsQualityDropdown').style.display = 'none';
            }

            function handleReconnect(url, type) {
                if (reconnectAttempts >= maxReconnectAttempts) {
                    showError('انقطع البث بعد عدة محاولات. يرجى التحقق من الاتصال والمحاولة لاحقاً.');
                    return;
                }
                reconnectAttempts++;
                const delay = Math.min(2000 * Math.pow(1.5, reconnectAttempts - 1), 30000);
                showLoading();
                if (reconnectTimeout) clearTimeout(reconnectTimeout);
                reconnectTimeout = setTimeout(() => {
                    if (type === 'hls') loadHLS(url);
                    else if (type === 'dash') loadDASH(url);
                    else loadStream(url);
                }, delay);
            }

            // ==================== CHANNELS UI ====================
            function renderChannels() {
                const filtered = channels.filter(ch => {
                    const matchCategory = activeCategory === 'all' || ch.category === activeCategory;
                    const matchSearch = ch.name.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchCategory && matchSearch;
                });

                if (filtered.length === 0) {
                    channelsList.innerHTML = '<div class="zs-no-results">لا توجد قنوات مطابقة</div>';
                    return;
                }

                channelsList.innerHTML = filtered.map(ch => `
                    <div class="zs-channel-card ${ch.id === currentChannelId ? 'zs-active' : ''}" data-id="${ch.id}">
                        <div class="zs-channel-logo">${ch.logo}</div>
                        <div class="zs-channel-info">
                            <div class="zs-channel-name">${ch.name}</div>
                            <div class="zs-channel-cat">${ch.category}</div>
                        </div>
                        ${ch.live ? '<div class="zs-channel-live">مباشر</div>' : '<div class="zs-channel-status"></div>'}
                    </div>
                `).join('');

                channelsList.querySelectorAll('.zs-channel-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = parseInt(card.dataset.id);
                        const channel = channels.find(c => c.id === id);
                        if (channel) changeChannel(channel);
                    });
                });
            }

            function changeChannel(channel) {
                if (!channel || !channel.url) return;
                currentChannelId = channel.id;
                currentStreamUrl = channel.url;
                renderChannels();
                loadStream(channel.url);
            }

            // ==================== EXTERNAL LINK & M3U ====================
            function openModal() {
                modalOverlay.classList.add('zs-open');
                externalUrlInput.value = '';
                externalNameInput.value = '';
                externalUrlInput.focus();
            }

            function closeModal() {
                modalOverlay.classList.remove('zs-open');
            }

            function addExternalChannel(name, url) {
                const id = externalIdCounter++;
                const channel = {
                    id: id,
                    name: name || 'رابط خارجي ' + id,
                    category: 'خارجية',
                    logo: '🔗',
                    url: url,
                    live: true
                };
                channels.push(channel);
                renderChannels();
                changeChannel(channel);
            }

            async function loadM3U(url) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('فشل تحميل الملف');
                    const text = await response.text();
                    const lines = text.split('\n');
                    const parsedChannels = [];
                    let currentName = '';
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('#EXTINF')) {
                            const nameMatch = trimmed.match(/,(.*)$/);
                            if (nameMatch) currentName = nameMatch[1].trim();
                        } else if (trimmed && !trimmed.startsWith('#')) {
                            parsedChannels.push({
                                id: externalIdCounter++,
                                name: currentName || 'قناة M3U',
                                category: 'خارجية',
                                logo: '📄',
                                url: trimmed,
                                live: true
                            });
                            currentName = '';
                        }
                    }
                    if (parsedChannels.length === 0) {
                        alert('لم يتم العثور على قنوات في الملف.');
                        return;
                    }
                    channels = channels.concat(parsedChannels);
                    renderChannels();
                    if (parsedChannels[0]) changeChannel(parsedChannels[0]);
                } catch (e) {
                    alert('تعذر تحميل ملف M3U: ' + e.message);
                }
            }

            // ==================== EVENT LISTENERS ====================
            startPlayBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentStreamUrl && currentStreamUrl.trim() !== '') {
                    loadStream(currentStreamUrl);
                } else {
                    alert('الرجاء اختيار قناة أو إضافة رابط خارجي.');
                }
            });

            btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
            btnMute.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });
            volumeSlider.addEventListener('input', () => { setVolume(parseInt(volumeSlider.value)); });
            volumeSlider.addEventListener('click', (e) => e.stopPropagation());
            btnScreenshot.addEventListener('click', (e) => { e.stopPropagation(); triggerScreenshot(); });
            btnPiP.addEventListener('click', (e) => { e.stopPropagation(); togglePiP(); });
            btnTheater.addEventListener('click', (e) => { e.stopPropagation(); toggleTheater(); });
            btnFullscreen.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
            btnSettings.addEventListener('click', (e) => {
                e.stopPropagation();
                alert('يمكنك تعديل قائمة القنوات داخل مصفوفة channels في الكود.');
                closeAllDropdowns();
            });

            btnSpeed.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(speedMenu); });
            btnQuality.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(qualityMenu); });

            speedMenu.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setSpeed(parseFloat(li.dataset.speed));
                    speedMenu.classList.remove('zs-open');
                });
            });

            errorRetry.addEventListener('click', () => {
                hideError();
                reconnectAttempts = 0;
                if (currentStreamUrl) loadStream(currentStreamUrl);
                else alert('لا توجد قناة محددة.');
            });

            progressWrap.addEventListener('click', (e) => {
                if (isLive || !video.duration || !isFinite(video.duration)) return;
                const rect = progressTrack.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                video.currentTime = pct * video.duration;
                updateProgress();
                updateTimeDisplay();
                resetControlsTimer();
            });

            let isDragging = false;
            progressWrap.addEventListener('mousedown', (e) => {
                if (isLive || !video.duration || !isFinite(video.duration)) return;
                isDragging = true;
                const rect = progressTrack.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                video.currentTime = pct * video.duration;
                updateProgress();
                updateTimeDisplay();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const rect = progressTrack.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                video.currentTime = pct * video.duration;
                updateProgress();
                updateTimeDisplay();
            });
            document.addEventListener('mouseup', () => { isDragging = false; resetControlsTimer(); });

            video.addEventListener('timeupdate', () => { updateProgress(); updateTimeDisplay(); });
            video.addEventListener('progress', updateProgress);
            video.addEventListener('play', () => { updatePlayButton(); resetControlsTimer(); });
            video.addEventListener('pause', () => { updatePlayButton(); showControls(); if (controlsHideTimeout) clearTimeout(controlsHideTimeout); });
            video.addEventListener('ended', () => { updatePlayButton(); showControls(); });
            video.addEventListener('waiting', showLoading);
            video.addEventListener('canplay', hideLoading);
            video.addEventListener('playing', hideLoading);
            video.addEventListener('loadedmetadata', () => { hideLoading(); updateTimeDisplay(); updateProgress(); });
            video.addEventListener('error', () => {
                hideLoading();
                if (isHLS || isDASH) return;
                const err = video.error;
                let msg = 'خطأ في تشغيل الفيديو';
                if (err) {
                    switch (err.code) {
                        case 1: msg = 'تم إيقاف التشغيل. تحقق من الرابط.'; break;
                        case 2: msg = 'خطأ في الشبكة. تحقق من اتصالك.'; break;
                        case 3: msg = 'تعذر فك تشفير الفيديو.'; break;
                        case 4: msg = 'الفيديو غير مدعوم أو غير موجود.'; break;
                    }
                }
                showError(msg);
            });

            wrapper.addEventListener('click', (e) => {
                if (e.target === wrapper || e.target === videoContainer || e.target === video) {
                    togglePlay();
                }
            });
            video.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
            wrapper.addEventListener('dblclick', (e) => {
                if (e.target === video || e.target === videoContainer || e.target === wrapper) {
                    toggleFullscreen();
                }
            });

            wrapper.addEventListener('mousemove', showControls);
            wrapper.addEventListener('mouseenter', showControls);
            wrapper.addEventListener('mouseleave', () => { if (!video.paused) hideControls(); closeAllDropdowns(); });
            wrapper.addEventListener('touchstart', (e) => { if (e.target === video || e.target === videoContainer || e.target === wrapper) showControls(); }, { passive: true });

            document.addEventListener('keydown', (e) => {
                const activeEl = document.activeElement;
                if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) return;
                switch (e.key.toLowerCase()) {
                    case ' ':
                    case 'k': e.preventDefault(); togglePlay(); break;
                    case 'f': e.preventDefault(); toggleFullscreen(); break;
                    case 't': e.preventDefault(); toggleTheater(); break;
                    case 'm': e.preventDefault(); toggleMute(); break;
                    case 'i': e.preventDefault(); togglePiP(); break;
                    case 's': if (!e.ctrlKey && !e.metaKey) { e.preventDefault(); triggerScreenshot(); } break;
                    case 'r': if (!e.ctrlKey && !e.metaKey) { e.preventDefault(); reconnectAttempts = 0; if (currentStreamUrl) loadStream(currentStreamUrl); } break;
                    case 'arrowup': e.preventDefault(); setVolume(Math.min(100, (video.volume * 100) + 5)); break;
                    case 'arrowdown': e.preventDefault(); setVolume(Math.max(0, (video.volume * 100) - 5)); break;
                    case 'arrowleft': if (!isLive && video.duration && isFinite(video.duration)) { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10); updateProgress(); updateTimeDisplay(); showControls(); } break;
                    case 'arrowright': if (!isLive && video.duration && isFinite(video.duration)) { e.preventDefault(); video.currentTime = Math.min(video.duration, video.currentTime + 10); updateProgress(); updateTimeDisplay(); showControls(); } break;
                    case 'escape': closeAllDropdowns(); if (document.fullscreenElement) toggleFullscreen(); if (modalOverlay.classList.contains('zs-open')) closeModal(); break;
                }
            });

            document.addEventListener('fullscreenchange', () => {
                wrapper.classList.toggle('zs-fullscreen', !!document.fullscreenElement);
                btnFullscreen.classList.toggle('zs-active', !!document.fullscreenElement);
                resetControlsTimer();
            });
            document.addEventListener('webkitfullscreenchange', () => {
                wrapper.classList.toggle('zs-fullscreen', !!document.webkitFullscreenElement);
                btnFullscreen.classList.toggle('zs-active', !!document.webkitFullscreenElement);
                resetControlsTimer();
            });

            video.addEventListener('enterpictureinpicture', () => { btnPiP.classList.add('zs-active'); });
            video.addEventListener('leavepictureinpicture', () => { btnPiP.classList.remove('zs-active'); });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.zs-dropdown')) closeAllDropdowns();
            });

            video.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const action = confirm('🎬 Zi Store Player\n\nاختر إجراء:\n• موافق = التقاط صورة (Screenshot)\n• إلغاء = إظهار/إخفاء شريط التحكم');
                if (action) triggerScreenshot();
                else {
                    controls.classList.toggle('zs-hidden');
                    if (!controls.classList.contains('zs-hidden')) resetControlsTimer();
                }
            });

            // Channel search & category
            searchInput.addEventListener('input', () => {
                searchQuery = searchInput.value;
                renderChannels();
            });

            categoryTabs.addEventListener('click', (e) => {
                const tab = e.target.closest('.zs-category-tab');
                if (!tab) return;
                activeCategory = tab.dataset.category;
                categoryTabs.querySelectorAll('.zs-category-tab').forEach(t => t.classList.remove('zs-active'));
                tab.classList.add('zs-active');
                renderChannels();
            });

            // External link buttons
            btnAddLink.addEventListener('click', openModal);
            btnCancelModal.addEventListener('click', closeModal);
            btnSubmitModal.addEventListener('click', () => {
                const url = externalUrlInput.value.trim();
                if (!url) {
                    alert('يرجى إدخال رابط البث.');
                    return;
                }
                const name = externalNameInput.value.trim();
                addExternalChannel(name, url);
                closeModal();
            });

            btnLoadM3U.addEventListener('click', () => {
                const url = prompt('أدخل رابط ملف M3U:');
                if (url && url.trim()) {
                    loadM3U(url.trim());
                }
            });

            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // ==================== INITIALIZATION ====================
            function init() {
                try {
                    const savedVol = localStorage.getItem('zs-volume');
                    if (savedVol !== null) {
                        const v = parseInt(savedVol);
                        video.volume = v / 100;
                        video.muted = (v === 0);
                        volumeSlider.value = v;
                    }
                    const savedSpeed = localStorage.getItem('zs-speed');
                    if (savedSpeed !== null) setSpeed(parseFloat(savedSpeed));
                    const savedTheater = localStorage.getItem('zs-theater');
                    if (savedTheater === '1') {
                        wrapper.classList.add('zs-theater');
                        btnTheater.classList.add('zs-active');
                    }
                } catch (e) {}

                updateMuteButton();
                updatePlayButton();
                buildQualityMenu();
                showControls();
                startOverlay.classList.remove('zs-hidden');
                renderChannels();
            }

            window.ZiStorePlayer = {
                channels: channels,
                addExternalChannel: addExternalChannel,
                loadM3U: loadM3U,
                changeChannel: changeChannel,
                load: loadStream,
                play: () => { video.play().catch(() => {}); updatePlayButton(); },
                pause: () => { video.pause(); updatePlayButton(); },
                togglePlay: togglePlay,
                setVolume: setVolume,
                toggleMute: toggleMute,
                toggleFullscreen: toggleFullscreen,
                toggleTheater: toggleTheater,
                togglePiP: togglePiP,
                screenshot: triggerScreenshot,
                setQuality: setQuality,
                setSpeed: setSpeed,
                getVideo: () => video,
                isLive: () => isLive,
                reload: () => { reconnectAttempts = 0; if (currentStreamUrl) loadStream(currentStreamUrl); },
                destroy: destroyExistingPlayer,
            };

            init();
            console.log('🏆 Zi Store Player ✓ جاهز مع دعم الروابط الخارجية');
        })();
    </script>
</body>
</html>
