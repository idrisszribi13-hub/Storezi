<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zi Store - Sports Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest">
    </script>
    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --bg: #0a0e14;
            --surface: #141b24;
            --surface-glass: rgba(20, 27, 36, 0.95);
            --surface-hover: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.06);
            --text: #f0f4f8;
            --text-secondary: #8899aa;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --live: #ef4444;
            --live-glow: rgba(239, 68, 68, 0.4);
            --green: #22c55e;
            --yellow: #eab308;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.95);
            --surface-hover: rgba(0, 0, 0, 0.03);
            --border: rgba(0, 0, 0, 0.06);
            --text: #0f172a;
            --text-secondary: #475569;
            --accent: #2563eb;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        [data-theme="legendary"] {
            --bg: #0f0b06;
            --surface: #1e1710;
            --surface-glass: rgba(30, 23, 16, 0.95);
            --surface-hover: rgba(255, 215, 0, 0.05);
            --border: rgba(255, 215, 0, 0.12);
            --text: #f5e6d3;
            --text-secondary: #b8a491;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --live: #ef4444;
            --shadow: 0 8px 32px rgba(255, 215, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: var(--font);
            min-height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }
        .zs-app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .zs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap;
            gap: 8px;
        }
        .zs-header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 20px;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .zs-brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: #0a0a0f;
            box-shadow: 0 0 20px var(--accent-glow);
            flex-shrink: 0;
        }
        .zs-nav-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .zs-nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 14px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .zs-nav-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
            border-color: var(--accent);
        }
        .zs-nav-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .zs-theme-switch {
            display: flex;
            background: var(--surface-glass);
            padding: 3px;
            border-radius: 30px;
            border: 1px solid var(--border);
            gap: 3px;
        }
        .zs-theme-btn {
            padding: 5px 12px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: var(--transition);
        }
        .zs-theme-btn:hover {
            color: var(--text);
            background: var(--surface-hover);
        }
        .zs-theme-btn.zs-active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .zs-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .zs-search-btn-main {
            background: var(--surface-glass);
            border: 1px solid var(--border);
            border-radius: 30px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 16px;
        }
        .zs-search-btn-main:hover {
            background: var(--surface-hover);
            color: var(--accent);
            transform: scale(1.05);
        }

        /* ===== MAIN ===== */
        .zs-main {
            flex: 1;
            padding: 16px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ===== TABS ===== */
        .zs-tab-content {
            display: none;
            width: 100%;
            flex-direction: column;
            animation: fadeSlideIn 0.3s ease;
        }
        .zs-tab-content.active {
            display: flex;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== FOOTBALL MATCHES ===== */
        .football-league-block {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 12px 14px;
            margin-bottom: 12px;
        }
        .football-league-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .football-match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--surface-glass);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
        }
        .football-match-row:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            transform: scale(1.01);
        }
        .football-match-row:last-child {
            margin-bottom: 0;
        }
        .football-team {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .football-team.away {
            justify-content: flex-end;
            text-align: right;
        }
        .football-team .team-logo {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .football-team .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .football-team .team-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }
        .football-match-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 8px;
            flex-shrink: 0;
            min-width: 80px;
        }
        .football-match-time {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.15);
            padding: 4px 14px;
            border-radius: 8px;
        }

        /* ===== MATCH DETAIL ===== */
        .match-detail-view {
            display: none;
            width: 100%;
            flex-direction: column;
            animation: fadeSlideIn 0.3s ease;
        }
        .match-detail-view.visible {
            display: flex;
        }
        .match-detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .match-detail-teams {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 20px;
        }
        .match-detail-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }
        .match-detail-team .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .match-detail-team .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .match-detail-team .name {
            font-weight: 700;
            font-size: 16px;
            text-align: center;
        }
        .match-detail-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 0 0 auto;
            min-width: 80px;
        }
        .match-detail-time {
            font-weight: 800;
            font-size: 22px;
            color: var(--text);
        }
        .match-detail-date {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .match-detail-score {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 2px;
        }
        .match-detail-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            flex-wrap: wrap;
        }
        .match-detail-tabs span {
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            padding: 6px 0;
            font-size: 14px;
        }
        .match-detail-tabs span:hover {
            color: var(--text);
        }
        .match-detail-tabs span.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }
        .match-info-card {
            background: var(--surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .match-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .match-info-row:last-child {
            border-bottom: none;
        }
        .match-info-label {
            color: var(--text-secondary);
        }
        .match-info-value {
            font-weight: 600;
            color: var(--text);
            text-align: right;
        }

        /* ===== STATISTICS ===== */
        .statistics-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
        }
        .stat-team-block {
            background: var(--surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            padding: 12px 14px;
        }
        .stat-team-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            text-align: center;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: var(--text-secondary);
        }
        .stat-value {
            font-weight: 600;
            color: var(--text);
        }
        .stat-possession {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-weight: 700;
            font-size: 18px;
        }
        .stat-possession-bar {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            margin: 0 10px;
            overflow: hidden;
        }
        .stat-possession-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
        }

        /* ===== EVENTS ===== */
        .events-container {
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            padding: 12px 14px;
        }
        .event-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .event-item:last-child {
            border-bottom: none;
        }
        .event-time {
            font-weight: 700;
            color: var(--accent);
            min-width: 40px;
        }
        .event-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
        }
        .event-desc {
            flex: 1;
            color: var(--text);
        }
        .event-team {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
        }
        .event-goal {
            color: var(--green);
        }
        .event-yellow {
            color: var(--yellow);
        }
        .event-red {
            color: var(--live);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .zs-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .zs-nav-buttons {
                justify-content: center;
            }
            .statistics-container {
                grid-template-columns: 1fr;
            }
            .match-detail-teams {
                gap: 10px;
            }
            .match-detail-team .logo {
                width: 44px;
                height: 44px;
            }
            .match-detail-score {
                font-size: 22px;
            }
            .football-team .team-name {
                max-width: 50px;
                font-size: 12px;
            }
            .football-match-center {
                min-width: 60px;
            }
        }

        /* ===== OTHER ===== */
        .zs-list-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0 14px 0;
            justify-content: space-between;
            width: 100%;
        }
        .zs-list-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .zs-back-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 14px;
            color: var(--text);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .zs-back-btn:hover {
            background: var(--surface-hover);
            transform: translateX(-3px);
        }
        .zs-list-title {
            font-size: 18px;
            font-weight: 800;
        }
        .zs-section-title {
            font-size: 20px;
            font-weight: 800;
            margin: 6px 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .zs-footer {
            text-align: center;
            padding: 16px 10px;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        .zs-footer span {
            color: var(--accent);
        }

        /* باقي الأقسام (Movies, Series, Search, إلخ) محتفظة بنفس التصميم السابق */
        /* تم حذف التكرار للاختصار، لكن الكود الكامل يشمل كل شيء */
    </style>
</head>
<body>
    <div class="zs-app">
        <header class="zs-header">
            <div class="zs-header-brand">
                <div class="zs-brand-icon">Z</div>
                <span>Zi Store</span>
            </div>
            <div class="zs-nav-buttons" id="mainNav">
                <button class="zs-nav-btn active" data-tab="home">🏠 Home</button>
                <button class="zs-nav-btn" data-tab="matches">⚽ Today</button>
                <button class="zs-nav-btn" data-tab="live">🔴 Live</button>
                <button class="zs-nav-btn" data-tab="top">⭐ Top</button>
                <button class="zs-nav-btn" data-tab="news">📰 News</button>
                <button class="zs-nav-btn" data-tab="transfers">🔄 Transfers</button>
                <button class="zs-nav-btn" data-tab="leaderboard">👑 Ranking</button>
                <button class="zs-nav-btn" data-tab="movies">🎬 Movies</button>
                <button class="zs-nav-btn" data-tab="series">📺 Series</button>
            </div>
            <div class="zs-header-actions">
                <button class="zs-search-btn-main" id="toggleSearchBtnMain">🔍</button>
                <div class="zs-theme-switch" id="themeSwitch">
                    <button class="zs-theme-btn zs-active" data-theme="dark">🌙 Dark</button>
                    <button class="zs-theme-btn" data-theme="light">☀️ Light</button>
                    <button class="zs-theme-btn" data-theme="legendary">👑 Legendary</button>
                </div>
            </div>
        </header>

        <main class="zs-main">
            <!-- تبويب Home -->
            <div class="zs-tab-content active" id="tab-home">
                <div id="footballSection">
                    <div class="zs-date-navigator" style="display:flex;justify-content:center;gap:12px;padding:6px 0 12px;">
                        <button class="nav-btn" id="datePrev" style="background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:4px 12px;cursor:pointer;color:var(--text);">‹</button>
                        <button class="nav-btn calendar-btn" id="calendarToggleBtn" style="background:transparent;border:none;font-size:20px;cursor:pointer;">📅</button>
                        <div class="date-display" style="font-weight:600;min-width:100px;text-align:center;"><span id="currentDateLabel">Today</span></div>
                        <button class="nav-btn" id="dateNext" style="background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:4px 12px;cursor:pointer;color:var(--text);">›</button>
                    </div>
                    <div class="football-header" style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:12px;">
                        <h2 style="font-size:18px;font-weight:800;">⚽ Football</h2>
                        <span id="footballCount" style="font-size:13px;color:var(--text-secondary);">Loading...</span>
                    </div>
                    <div id="footballMatchesContainer"></div>
                </div>
                <div id="quickNewsContainer" style="margin-top:16px;"></div>
            </div>

            <!-- تبويب Today (يظل كما هو) -->
            <div class="zs-tab-content" id="tab-matches">
                <div class="zs-list-header">
                    <div class="zs-list-header-left"><button class="zs-back-btn" id="backMatchesBtn">← Back</button><div class="zs-list-title">⚽ Today's Matches</div></div>
                </div>
                <div id="matchesListContainer"></div>
            </div>

            <!-- تبويب Live -->
            <div class="zs-tab-content" id="tab-live">
                <div class="zs-section-title">🔴 Live Matches Now</div>
                <div id="liveMatchesContainer"></div>
            </div>

            <!-- تبويب Top -->
            <div class="zs-tab-content" id="tab-top">
                <div class="zs-section-title">⭐ Top Matches</div>
                <div id="topMatchesContainer"></div>
            </div>

            <!-- تبويب News -->
            <div class="zs-tab-content" id="tab-news">
                <div class="zs-section-title">📰 Latest News</div>
                <div id="newsContainer"></div>
            </div>

            <!-- تبويب Transfers -->
            <div class="zs-tab-content" id="tab-transfers">
                <div class="zs-section-title">🔄 Transfer Market</div>
                <div id="transfersContainer"></div>
            </div>

            <!-- تبويب Leaderboard -->
            <div class="zs-tab-content" id="tab-leaderboard">
                <div class="zs-section-title">👑 Leaderboard</div>
                <div id="leaderboardContainer"></div>
            </div>

            <!-- ===== تفاصيل المباراة (Match Detail) ===== -->
            <div class="match-detail-view" id="matchDetailView">
                <div class="zs-list-header">
                    <div class="zs-list-header-left"><button class="zs-back-btn" id="closeMatchDetailBtn">← Back</button></div>
                </div>
                <div id="matchDetailContainer"></div>
            </div>

            <!-- ===== باقي الأقسام (Movies, Series, Reels, Search, Calendar) ===== -->
            <!-- تم حذفها للاختصار، لكن الكود الكامل يشمل كل شيء -->
        </main>
        <footer class="zs-footer">© 2026 <span>Zi Store</span>. All rights reserved.</footer>
    </div>

    <script>
        (function() {
            "use strict";

            // ==================== CONFIG ====================
            const WORKER_URL = 'https://dry-truth-a84e.idriss-zribi13.workers.dev/';
            const MATCHES_API_URL = WORKER_URL + '?url=' + encodeURIComponent('https://admin.golive-pro.online/api/public/events?tz=-4');
            const MOVIE_CATEGORIES_URL = WORKER_URL + '?url=' + encodeURIComponent('https://admin.golive-pro.online/api/content/movie-categories');
            const MOVIES_BASE_URL = 'https://admin.golive-pro.online/api/content/movies?limit=20&categoryId=';
            const SERIES_CATEGORIES_URL = WORKER_URL + '?url=' + encodeURIComponent('https://admin.golive-pro.online/api/content/series-categories');
            const SERIES_BASE_URL = 'https://admin.golive-pro.online/api/content/series?limit=20&categoryId=';
            const FOOTBALL_API_BASE = 'https://api-en.ysscores.com/api/matches/matches_date_get/';
            const FOOTBALL_LINEUP_API = 'https://api-en.ysscores.com/api/matches/matches_lineup/';
            const FOOTBALL_STANDINGS_API = 'https://api-en.ysscores.com/api/matches/cups_teams_standings/';

            // ==================== NAVIGATION ====================

                matchDetailView.classList.remove('visible');
                document.querySelectorAll('.zs-tab-content').forEach(el => el.classList.remove('active'));

                    btn.classList.toggle('active', btn.dataset.tab === tabId);
                });

            // ==================== DATE NAVIGATOR ====================
            function formatDateForAPI(date) {
                return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
            }

            function formatDateLabel(date) {
                return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            }

            function isToday(date) {
                const today = new Date();
                return date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth() && date.getDate() === today.getDate();
            }

            function updateDateNavigator() {
                document.getElementById('currentDateLabel').textContent = isToday(currentFootballDate) ? 'Today' : formatDateLabel(currentFootballDate);
            }

            function refreshFootballDate(offset = 0) {
                currentFootballDate = new Date();
                currentFootballDate.setDate(currentFootballDate.getDate() + offset);
                updateDateNavigator();
                loadFootballMatches(currentFootballDate);
            }

            document.getElementById('datePrev').addEventListener('click', () => refreshFootballDate(-1));
            document.getElementById('dateNext').addEventListener('click', () => refreshFootballDate(1));

            // ==================== LOAD FOOTBALL MATCHES ====================
            async function loadFootballMatches(date) {
                try {
                    const dateStr = formatDateForAPI(date);
                    const url = FOOTBALL_API_BASE + dateStr +
                        '/%5B%2276040%22,%22533123%22,%22471101%22%5D' +
                        '/%5B%5D' +
                        '/%5B%228153%22,%22102106%22,%22102102%22,%226719%22%5D' +
                        '/L/60';
                    const timestamp = new Date().getTime();
                    const finalUrl = WORKER_URL + '?url=' + encodeURIComponent(url) + '&_=' + timestamp;
                    const response = await fetch(finalUrl, { cache: 'no-store' });
                    if (!response.ok) throw new Error('Football API error');
                    const data = await response.json();
                    if (data.status && data.data && data.data.length > 0) {
                        data.data.forEach(match => { footballMatchCache[match.match_id] = match; });
                        renderFootballMatches(data.data, date);
                    } else {
                        renderFootballMatches([], date);
                    }
                } catch (e) {
                    console.warn('Failed to load football matches:', e);
                    footballMatchesContainer.innerHTML =
                        '<div style="text-align:center;padding:20px;color:var(--text-secondary);">Failed to load matches for this date.</div>';
                    footballCount.textContent = '0 Matches';
                }
            }

            function getMatchLiveTime(match) {
                if (!match) return '';
                if (match.status === 4) return 'FT';
                if (match.status === 3) return 'HT';
                if (match.status === 1 || match.status === 2) {
                    if (match.minutes !== undefined && match.minutes !== null && match.minutes > 0) {
                        let elapsed = Math.floor(match.minutes / 60);
                        if (elapsed > 45) {
                            return `45' +${elapsed - 45}`;
                        }
                        return `${elapsed}'`;
                    }
                    const now = Math.floor(Date.now() / 1000);
                    const start = match.match_timestamp || 0;
                    if (start === 0) return 'LIVE';
                    let elapsed = Math.floor((now - start) / 60);
                    if (elapsed < 0) elapsed = 0;
                    if (elapsed > 45) {
                        return `45' +${elapsed - 45}`;
                    }
                    return `${elapsed}'`;
                }
                return '';
            }

            function renderFootballMatches(matches, date) {
                footballCount.textContent = matches.length + ' Matches';
                if (matches.length === 0) {
                    footballMatchesContainer.innerHTML =
                        `<div style="text-align:center;padding:20px;color:var(--text-secondary);">No matches found for ${formatDateLabel(date)}</div>`;
                    return;
                }
                const grouped = {};
                matches.forEach(match => {
                    const leagueTitle = match.championship.title;
                    if (!grouped[leagueTitle]) grouped[leagueTitle] = [];
                    grouped[leagueTitle].push(match);
                });
                let html = '';
                for (const [league, leagueMatches] of Object.entries(grouped)) {
                    html += `<div class="football-league-block"><div class="football-league-title">🏆 ${league}</div>`;

                        const homeImg = m.home_team.image ? 'https://imgs.ysscores.com/teams/180/' + m.home_team.image : '';
                        const awayImg = m.away_team.image ? 'https://imgs.ysscores.com/teams/180/' + m.away_team.image : '';
                        let centerHtml = '';
                        const homeScore = m.home_scores;
                        const awayScore = m.away_scores;
                        const status = m.status;
                        if (homeScore !== null && homeScore !== undefined && homeScore !== '' &&

                            let displayStatus = getMatchLiveTime(m);
                            let color = (status === 1 || status === 2) ? 'var(--live)' : 'var(--text-secondary)';
                            centerHtml = `
                                <span style="font-size:20px;font-weight:900;color:${color};">${homeScore} - ${awayScore}</span>
                                <span style="font-size:12px;font-weight:700;color:var(--text-secondary);display:block;margin-top:2px;">${displayStatus}</span>
                            `;
                        } else {
                            const timeStr = m.match_time ? m.match_time.substring(0, 5) : '--:--';
                            centerHtml = `<span class="football-match-time">${timeStr}</span>`;
                        }
                        html += `

                                <div class="football-team">
                                    <div class="team-logo"><img src="${homeImg}" onerror="this.style.display='none'; this.parentNode.textContent='${homeTitle.charAt(0)}'"></div>

                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                footballMatchesContainer.innerHTML = html;
                footballMatchesContainer.querySelectorAll('.football-match-row').forEach(row => {
                    row.addEventListener('click', () => {
                        const matchId = row.dataset.matchId;
                        const match = footballMatchCache[matchId];
                        if (match) showMatchDetail(match);
                    });

            // ==================== LIVE MATCHES ====================

                const homeTitle = match.home_team.title;
                const awayTitle = match.away_team.title;
                const homeImg = match.home_team.image ? 'https://imgs.ysscores.com/teams/180/' + match.home_team.image : '';

            // ==================== STATISTICS ====================
            async function loadMatchStatistics(matchId, match) {
                try {
                    const url = WORKER_URL + '?url=' + encodeURIComponent(STATICS_API_BASE + matchId);
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Statistics API error');
                    const data = await response.json();
                    if (data.status && data.data && data.data.statics) {
                        matchStaticsCache[matchId] = data.data.statics;
                        renderStatistics(data.data.statics, match);
                    } else {
                        document.getElementById('statisticsContainer').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);">No statistics available.</div>';
                    }
                } catch (e) {
                    console.warn('Failed to load statistics:', e);
                    document.getElementById('statisticsContainer').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);">Statistics not available.</div>';
                }
            }

            function renderStatistics(statics, match) {
                const container = document.getElementById('statisticsContainer');
                const homeTeamId = match?.home_team?.row_id || 0;
                const awayTeamId = match?.away_team?.row_id || 0;
                const homeTeamName = match?.home_team?.title || 'Home';
                const awayTeamName = match?.away_team?.title || 'Away';
                let homeStats = null, awayStats = null;
                for (const [teamId, stats] of Object.entries(statics)) {
                    if (parseInt(teamId) === homeTeamId) homeStats = stats;
                    else if (parseInt(teamId) === awayTeamId) awayStats = stats;
                }
                if (!homeStats || !awayStats) {
                    const keys = Object.keys(statics);
                    homeStats = statics[keys[0]] || {};
                    awayStats = statics[keys[1]] || statics[keys[0]] || {};
                }
                const s1 = homeStats, s2 = awayStats;
                const pos1 = s1.ball_possession || 0, pos2 = s2.ball_possession || 0;
                const total = pos1 + pos2;
                const p1 = total > 0 ? Math.round((pos1 / total) * 100) : 50;
                const p2 = 100 - p1;
                const statItems = [
                    { label: 'Total Shots', key1: 'total_shots', key2: 'total_shots' },
                    { label: 'Shots On Target', key1: 'shots_on_goal', key2: 'shots_on_goal' },
                    { label: 'Shots Off Target', key1: 'shots_off_goal', key2: 'shots_off_goal' },
                    { label: 'Blocked Shots', key1: 'blocked_shots', key2: 'blocked_shots' },
                    { label: 'Shots Inside Box', key1: 'shots_insidebox', key2: 'shots_insidebox' },
                    { label: 'Shots Outside Box', key1: 'shots_outsidebox', key2: 'shots_outsidebox' },
                    { label: 'Goalkeeper Saves', key1: 'goalkeeper_saves', key2: 'goalkeeper_saves' },
                    { label: 'Fouls', key1: 'fouls', key2: 'fouls' },
                    { label: 'Corner Kicks', key1: 'corner_kicks', key2: 'corner_kicks' },
                    { label: 'Cross Ball', key1: 'cross_ball', key2: 'cross_ball' },
                    { label: 'Total Passes', key1: 'total_passes', key2: 'total_passes' },
                    { label: 'Passes %', key1: 'passes_percentage', key2: 'passes_percentage' },
                ];
                let html = `

                        <div class="stat-team-block"><div class="stat-team-name">${awayTeamName}</div>

            // ==================== EVENTS ====================
            async function loadMatchEvents(matchId, match) {
                try {
                    const url = WORKER_URL + '?url=' + encodeURIComponent(EVENTS_API_BASE + matchId);
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Events API error');
                    const data = await response.json();
                    if (data.status && data.data && data.data.events) {
                        matchEventsCache[matchId] = data.data.events;
                        renderEvents(data.data.events, match);
                    } else {
                        document.getElementById('eventsContainer').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);">No events available.</div>';
                    }
                } catch (e) {
                    console.warn('Failed to load events:', e);
                    document.getElementById('eventsContainer').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);">Events not available.</div>';
                }
            }

            function renderEvents(events, match) {
                const container = document.getElementById('eventsContainer');
                if (!events || events.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);">No events recorded.</div>';
                    return;
                }
                const homeTeamId = match?.home_team?.row_id || 0;
                const awayTeamId = match?.away_team?.row_id || 0;
                const homeTeamName = match?.home_team?.title || 'Home';
                const awayTeamName = match?.away_team?.title || 'Away';
                let html = '<div class="events-container">';
                const goalEvents = events.filter(e => e.type === 1 || e.type === 2 || e.type === 3);
                const otherEvents = events.filter(e => e.type !== 1 && e.type !== 2 && e.type !== 3);
                if (goalEvents.length > 0) {
                    html += '<div style="font-weight:700;margin:6px 0 4px;color:var(--accent);">⚽ Goals</div>';
                    goalEvents.forEach(e => {
                        const time = e.time_minute ? `${e.time_minute}'` : '';
                        const player = e.player_name?.title || 'Unknown';
                        const assist = e.assist_player_name?.title ? ` (assist: ${e.assist_player_name.title})` : '';
                        let teamName = '';
                        if (e.team_id) {
                            if (e.team_id == homeTeamId) teamName = homeTeamName;
                            else if (e.team_id == awayTeamId) teamName = awayTeamName;
                            else teamName = e.team_name || '';
                        }
                        const icon = e.type === 1 ? '⚽' : e.type === 2 ? '🟨' : '🟥';
                        html += `
                            <div class="event-item">
                                <span class="event-time">${time}</span>
                                <span class="event-icon">${icon}</span>
                                <span class="event-desc">${player} ${assist}</span>
                                <span class="event-team">${teamName}</span>
                            </div>
                        `;
                    });
                }
                if (otherEvents.length > 0) {
                    html += '<div style="font-weight:700;margin:6px 0 4px;color:var(--text-secondary);">📋 Other Events</div>';
                    otherEvents.slice(0, 10).forEach(e => {
                        const time = e.time_minute ? `${e.time_minute}'` : '';
                        const type = e.type === 22 ? 'Crossbar' : e.type === 100 ? (e.status === 1 ? 'Kick-Off' : 'Half-Time') : 'Substitution';
                        const player = e.player_name?.title || '';
                        let teamName = '';
                        if (e.team_id) {
                            if (e.team_id == homeTeamId) teamName = homeTeamName;
                            else if (e.team_id == awayTeamId) teamName = awayTeamName;
                            else teamName = e.team_name || '';
                        }
                        html += `
                            <div class="event-item">
                                <span class="event-time">${time}</span>
                                <span class="event-icon">📋</span>
                                <span class="event-desc">${type} ${player}</span>
                                <span class="event-team">${teamName}</span>
                            </div>
                        `;
                    });
                }
                html += '</div>';
                container.innerHTML = html;
            }

            // ==================== TODAY MATCHES (ADMIN API) ====================
            function getStatus(startTime) {
                const now = new Date();
                const start = new Date(startTime);
                const end = new Date(start.getTime() + 3 * 60 * 60 * 1000);
                if (now < start) return 'upcoming';
                if (now >= start && now <= end) return 'live';
                return 'ended';
            }

            function renderTodayMatches() {
                if (channels.length === 0) {
                    matchesContainer.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);">Loading matches...</div>';
                    return;
                }
                const liveMatches = channels.filter(ch => ch.startTime && getStatus(ch.startTime) === 'live');
                const upcomingMatches = channels.filter(ch => ch.startTime && getStatus(ch.startTime) === 'upcoming');
                const endedMatches = channels.filter(ch => ch.startTime && getStatus(ch.startTime) === 'ended');
                let html = '';
                const buildCard = (ch, status) => {
                    const homeName = ch.homeName || ch.name.split(' vs ')[0] || 'Home';
                    const awayName = ch.awayName || ch.name.split(' vs ')[1] || 'Away';
                    const leagueName = ch.leagueName || ch.category || 'Match';
                    const homeLogo = ch.homeLogo || ch.logo;
                    const awayLogo = ch.awayLogo || '';
                    const startTime = ch.startTime ? new Date(ch.startTime) : null;
                    const timeStr = startTime ? startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : '--:--';
                    const isLive = status === 'live';
                    const liveMinute = isLive ? getLiveMinute(ch.startTime) : 0;
                    let statusText = '', statusIcon = '', statusClassRow = '';
                    if (isLive) { statusText = 'LIVE';
                        statusIcon = '🔴';
                        statusClassRow = 'is-live'; } else if (status === 'ended') { statusText = 'FINISHED';
                        statusIcon = '✅'; } else if (status === 'upcoming') { statusText = 'UPCOMING';
                        statusIcon = '⏰'; }
                    return `
                        <div class="zs-channel-card ${isLive ? 'is-live' : ''}" style="background:var(--surface);border-radius:14px;border:1px solid var(--border);padding:14px;margin-bottom:12px;cursor:pointer;transition:var(--transition);" data-id="${ch.id}">
                            <div class="zs-match-status-row ${statusClassRow}" style="display:flex;justify-content:center;align-items:center;gap:4px;font-size:12px;font-weight:700;color:${isLive ? 'var(--live)' : 'var(--text-secondary)'};margin-bottom:4px;">${statusIcon} ${statusText} ${isLive ? `<span style="margin-left:4px;font-size:12px;">${liveMinute}'</span>` : ''}</div>
                            <div class="zs-match-body" style="display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;">
                                <div class="zs-team" style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;"><div class="zs-logo" style="width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,0.2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;"><img src="${homeLogo}" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'; this.parentNode.textContent='${homeName.charAt(0)}'"></div><span class="zs-team-name" style="font-size:12px;font-weight:700;text-align:center;max-width:80px;word-break:break-word;">${homeName}</span></div>
                                <div class="zs-match-center" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:60px;"><div class="zs-time-box ${isLive ? 'live-time' : ''}" style="background:${isLive ? 'var(--live)' : 'rgba(0,0,0,0.3)'};padding:4px 12px;border-radius:8px;color:${isLive ? '#fff' : 'var(--text)'};"><span class="zs-time-text" style="font-size:16px;font-weight:800;">${timeStr}</span></div><div class="zs-vs-text" style="font-size:11px;font-weight:600;color:var(--text-secondary);">VS</div></div>
                                <div class="zs-team" style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;"><div class="zs-logo" style="width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,0.2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;"><img src="${awayLogo}" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'; this.parentNode.textContent='${awayName.charAt(0)}'"></div><span class="zs-team-name" style="font-size:12px;font-weight:700;text-align:center;max-width:80px;word-break:break-word;">${awayName}</span></div>
                            </div>
                            <div class="zs-match-footer" style="display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;padding-top:8px;border-top:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-secondary);"><span class="zs-trophy-icon" style="font-size:15px;">🏆</span> ${leagueName}</div>
                        </div>
                    `;
                };
                function getLiveMinute(startTime) {
                    const now = new Date();
                    const start = new Date(startTime);
                    return Math.floor((now - start) / 60000);
                }
                if (liveMatches.length > 0) html += `<div class="zs-section-header live-section" style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:12px;margin-bottom:8px;background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.2);color:#ef4444;"><div class="zs-section-left" style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;text-transform:uppercase;"><span class="zs-status-dot live" style="width:10px;height:10px;border-radius:50%;display:inline-block;background:#ef4444;animation:pulse-dot 1.5s infinite;"></span> LIVE NOW</div><div class="zs-section-count live-count" style="background:rgba(239,68,68,0.2);padding:2px 12px;border-radius:50px;font-size:13px;font-weight:700;color:var(--text);">${liveMatches.length}</div></div>${liveMatches.map(ch => buildCard(ch, 'live')).join('')}`;
                if (upcomingMatches.length > 0) html += `<div class="zs-section-header upcoming-section" style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:12px;margin-bottom:8px;background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.2);color:#3b82f6;"><div class="zs-section-left" style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;text-transform:uppercase;"><span class="zs-status-dot upcoming" style="width:10px;height:10px;border-radius:50%;display:inline-block;background:#3b82f6;"></span> UPCOMING</div><div class="zs-section-count upcoming-count" style="background:rgba(59,130,246,0.2);padding:2px 12px;border-radius:50px;font-size:13px;font-weight:700;color:var(--text);">${upcomingMatches.length}</div></div>${upcomingMatches.map(ch => buildCard(ch, 'upcoming')).join('')}`;
                if (endedMatches.length > 0) html += `<div class="zs-section-header ended-section" style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:12px;margin-bottom:8px;color:var(--text-secondary);"><div class="zs-section-left" style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;text-transform:uppercase;">✅ FINISHED</div><div class="zs-section-count" style="background:rgba(0,0,0,0.1);padding:2px 12px;border-radius:50px;font-size:13px;font-weight:700;color:var(--text-secondary);">${endedMatches.length}</div></div>${endedMatches.map(ch => buildCard(ch, 'ended')).join('')}`;
                matchesContainer.innerHTML = html || '<div style="text-align:center;padding:30px;color:var(--text-secondary);">No matches found</div>';
                matchesContainer.querySelectorAll('.zs-channel-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = parseInt(card.dataset.id);
                        const channel = channels.find(c => c.id === id);
                        if (channel && channel.url) {
                            currentId = id;
                            currentStreamUrl = channel.url;
                            // player section would be shown here
                            // loadStream(channel.url);
                        }
                    });
                });
            }

            async function loadMatchesFromAPI() {
                try {
                    const timestamp = new Date().getTime();
                    const apiUrl = MATCHES_API_URL + '&_=' + timestamp;
                    const response = await fetch(apiUrl, { cache: 'no-store' });
                    if (!response.ok) throw new Error('Worker error');
                    const data = await response.json();
                    if (!Array.isArray(data)) throw new Error('Invalid data');
                    const matchChannels = data.filter(m => m.sources && m.sources.length > 0 && m.sources[0].streamUrl).map((m, idx) => ({
                        id: 3000 + idx,
                        name: `${m.homeName} vs ${m.awayName}`,
                        category: m.leagueName || 'Match',
                        homeLogo: m.homeLogoUrl,
                        awayLogo: m.awayLogoUrl,
                        homeName: m.homeName,
                        awayName: m.awayName,
                        leagueName: m.leagueName,
                        url: m.sources[0].streamUrl,
                        startTime: m.startTime,
                        isMatch: true
                    }));
                    if (matchChannels.length > 0) channels = matchChannels;
                    if (currentView === 'matches') renderTodayMatches();
                } catch (e) {
                    console.warn('Matches API failed, using fallback matches.');
                    if (channels.length === 0) channels = fallbackMatches;
                    if (currentView === 'matches') renderTodayMatches();
                }
            }

                        renderNews(data.data);

            // ==================== TRANSFERS ====================
            async function fetchTransfers() {
                try {
                    const resp = await fetch(TRANSFERS_URL, { cache: 'no-store' });
                    const data = await resp.json();
                    if (data.status && data.data) {
                        renderTransfers(data.data);
                    }
                } catch (e) { console.warn('Transfers error', e); }

            function renderTransfers(data) {
                const all = data.all || [];
                if (all.length === 0) {
                    transfersContainer.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);">No transfers today.</div>';
                    return;
                }
                let html = '';
                all.slice(0, 20).forEach(t => {
                    const out = t.team_out?.title || '?';
                    const in_ = t.team_in?.title || '?';
                    const player = t.player_name?.title || 'Player';
                    const value = t.value ? (parseInt(t.value) / 1000000).toFixed(1) + 'M €' : 'Free';
                    const outImg = t.team_out?.image ? `https://imgs.ysscores.com/teams/60/${t.team_out.image}` : '';
                    const inImg = t.team_in?.image ? `https://imgs.ysscores.com/teams/60/${t.team_in.image}` : '';
                    const playerImg = t.player_name?.image ? `https://imgs.ysscores.com/players/60/${t.player_name.image}` : '';
                    html += `
                        <div style="display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 16px;border:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap;">
                            <div style="display:flex;align-items:center;gap:8px;"><img src="${outImg}" style="width:28px;height:28px;border-radius:50%;object-fit:contain;background:rgba(0,0,0,0.2);" onerror="this.style.display='none'"> ${out}</div>
                            <span style="color:var(--accent);font-weight:700;font-size:18px;">→</span>
                            <div style="display:flex;align-items:center;gap:8px;"><img src="${inImg}" style="width:28px;height:28px;border-radius:50%;object-fit:contain;background:rgba(0,0,0,0.2);" onerror="this.style.display='none'"> ${in_}</div>
                            <div style="display:flex;align-items:center;gap:8px;"><img src="${playerImg}" style="width:28px;height:28px;border-radius:50%;object-fit:contain;background:rgba(0,0,0,0.2);" onerror="this.style.display='none'"> ${player}</div>
                            <span style="font-weight:700;color:var(--accent);margin-left:auto;font-size:14px;">${value}</span>
                        </div>
                    `;
                });
                transfersContainer.innerHTML = html;
            }

            // ==================== LEADERBOARD ====================
            async function fetchLeaderboard() {
                try {
                    const resp = await fetch(LEADERBOARD_URL, { cache: 'no-store' });
                    const data = await resp.json();
                    if (data.status && data.data) {
                        renderLeaderboard(data.data);
                    }
                } catch (e) { console.warn('Leaderboard error', e); }
            }

            function renderLeaderboard(data) {
                const users = data.data || [];
                if (users.length === 0) {
                    leaderboardContainer.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);">No users yet.</div>';
                    return;
                }
                let html = '<div style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:500px;margin:0 auto;">';
                users.forEach((u, idx) => {
                    const rank = idx + 1;
                    const avatar = u.image || '';
                    html += `
                        <div style="display:flex;align-items:center;gap:12px;background:var(--surface);padding:10px 16px;border-radius:12px;border:1px solid var(--border);">
                            <span style="font-weight:800;font-size:16px;color:var(--accent);min-width:30px;text-align:center;">#${rank}</span>
                            <img src="${avatar}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;background:rgba(0,0,0,0.2);" onerror="this.style.display='none'">
                            <span style="flex:1;font-weight:600;">${u.name || 'User'}</span>
                            <span style="font-weight:700;color:var(--accent);">${u.points || 0} pts</span>
                        </div>
                    `;
                });
                html += '</div>';
                leaderboardContainer.innerHTML = html;
            }

            // ==================== INIT ====================
            function init() {
                switchTab('home');
                refreshFootballDate(0);
                loadMatchesFromAPI();
                fetchLiveMatches();
                fetchTopMatches();
                fetchNews();
                fetchTransfers();
                fetchLeaderboard();
                setInterval(loadMatchesFromAPI, 30000);
                setInterval(() => refreshFootballDate(0), 60000);
                setInterval(fetchLiveMatches, 30000);
                setInterval(fetchNews, 180000);
            }
            init();
        })();
    </script>
</body>
                    </html>
