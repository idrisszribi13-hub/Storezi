<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zi Store - Live Sports & Movies</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-glass: rgba(18, 18, 26, 0.95);
            --surface-hover: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.12);
            --text: #f5f5f5;
            --text-secondary: #b0b0b8;
            --accent: #e4a83d;
            --accent2: #c8842c;
            --accent-glow: rgba(228,168,61,0.5);
            --live: #e53935;
            --live-glow: rgba(229,57,53,0.8);
            --shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px var(--border);
            --radius: 16px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --header-bg: rgba(10,10,18,0.85);
        }

        [data-theme="legendary"] {
            --bg: #1a0f0a;
            --surface: #2d1f14;
            --surface-glass: rgba(45,31,20,0.9);
            --surface-hover: rgba(255,255,255,0.08);
            --border: rgba(255,215,0,0.35);
            --text: #ffd700;
            --text-secondary: #d4a574;
            --accent: #ff6b00;
            --accent2: #e05a00;
            --accent-glow: rgba(255,107,0,0.6);
            --live: #ff0000;
            --live-glow: rgba(255,0,0,0.8);
            --shadow: 0 25px 60px rgba(255,215,0,0.2), 0 0 0 1px var(--border);
            --header-bg: rgba(26,15,10,0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); font-family: var(--font); min-height: 100vh; color: var(--text); transition: background 0.4s, color 0.4s; overflow-x: hidden; }

        .zs-bg-effects { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .zs-app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

        .zs-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; background: var(--header-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; flex-wrap: wrap; }
        .zs-header-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; }
        .zs-brand-icon { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #0a0a0f; box-shadow: 0 0 20px var(--accent-glow); animation: logo-pulse 3s infinite ease-in-out; }
        
        .zs-main { flex: 1; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; align-items: flex-start; }
        .zs-player-section { flex: 1 1 100%; max-width: 100%; min-width: 0; }
        @media (min-width: 1000px) { .zs-player-section { flex: 1 1 calc(100% - 480px); max-width: calc(100% - 480px); } }

        .zs-channels-section { flex: 1 1 100%; background: var(--surface-glass); backdrop-filter: blur(20px); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; min-height: 400px; max-height: 70vh; box-shadow: var(--shadow); }
        @media (min-width: 1000px) { .zs-channels-section { flex: 0 0 460px; min-height: auto; max-height: calc(100vh - 140px); position: sticky; top: 90px; } }

        .zs-channels-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; background: var(--surface-glass); }
        .zs-channels-title { font-size: 24px; font-weight: 800; color: var(--accent); text-align: center; }
        .zs-search-box input { width: 100%; padding: 10px 36px 10px 14px; border-radius: 25px; border: 1px solid var(--border); background: var(--surface-hover); color: var(--text); font-size: 14px; outline: none; }

        .zs-category-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .zs-category-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 13px; font-family: var(--font); transition: all var(--transition); white-space: nowrap; }
        .zs-category-tab.zs-active { background: var(--accent); color: #0a0a0f; border-color: var(--accent); font-weight: 700; }

        .zs-channels-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

        /* بطاقة المباراة */
        .zs-channel-card { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; transition: all var(--transition); }
        .zs-channel-card:hover { background: var(--surface-hover); border-color: var(--accent); transform: translateY(-3px); }
        .zs-channel-card.zs-active { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        .zs-match-league { display: flex; justify-content: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
        .zs-match-body { display: flex; justify-content: space-around; gap: 10px; }
        .zs-team { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
        .zs-logo { width: 58px; height: 58px; border-radius: 50%; background: rgba(0,0,0,0.2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; }
        .zs-logo img { width: 100%; height: 100%; object-fit: contain; }
        .zs-team-name { font-size: 13px; font-weight: 700; color: var(--text); text-align: center; }
        .zs-center-info { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 80px; }
        .zs-status-center { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 20px; background: rgba(0,0,0,0.2); }
        .zs-status-center.live { color: var(--live); text-shadow: 0 0 10px var(--live-glow); }
        .zs-status-center.ended { color: #9e9e9e; }
        .zs-time-block { background: rgba(0,0,0,0.3); padding: 6px 14px; border-radius: 12px; }
        .zs-time { font-size: 16px; font-weight: 800; color: var(--text); }
        .zs-vs { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

        /* شبكة الأفلام */
        .zs-movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 5px 0; width: 100%; }
        .zs-movie-card { background: var(--surface); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: all var(--transition); }
        .zs-movie-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .zs-movie-card.zs-active { border: 2px solid var(--accent); }
        .zs-movie-poster-wrap { position: relative; width: 100%; aspect-ratio: 2/3; background: rgba(0,0,0,0.5); overflow: hidden; }
        .zs-movie-poster { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .zs-movie-card:hover .zs-movie-poster { transform: scale(1.08); }
        .zs-movie-genre-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; }
        .zs-movie-rating { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; color: var(--accent); }
        .zs-movie-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
        .zs-movie-title { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* مشغل الفيديو */
        .zs-player-wrapper { position: relative; width: 100%; background: #000; border-radius: var(--radius); box-shadow: var(--shadow); aspect-ratio: 16/9; }
        .zs-video-container { width: 100%; height: 100%; background: #000; position: relative; transition: transform 0.3s; }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        .zs-video-container.rotated { transform: rotate(90deg); aspect-ratio: 9/16; }
        .zs-video-watermark { position: absolute; top: 15px; left: 15px; opacity: 0.4; color: #fff; font-weight: 700; font-size: 14px; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 12px; }
        .zs-live-badge { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 18px; border-radius: 24px; display: none; }
        .zs-live-badge.zs-visible { display: flex; }
        .zs-start-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); z-index: 10; }
        .zs-start-overlay.zs-hidden { display: none; }
        .zs-start-play-btn { width: 90px; height: 90px; border-radius: 50%; background: var(--accent); color: #0a0a0f; font-size: 36px; border: none; cursor: pointer; transition: 0.3s; }
        .zs-start-play-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--accent-glow); }
        .zs-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
        .zs-controls-row { display: flex; align-items: center; gap: 12px; width: 100%; }
        .zs-btn { background: none; border: none; color: #fff; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: all var(--transition); border-radius: 50%; }
        .zs-btn:hover { background: rgba(255,255,255,0.15); }
        .zs-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .zs-volume-wrapper { display: flex; align-items: center; gap: 6px; }
        .zs-volume-slider { width: 60px; height: 4px; appearance: none; background: rgba(255,255,255,0.3); border-radius: 4px; }
        .zs-volume-slider::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; }
        .zs-time-display { font-size: 13px; color: #ddd; min-width: 45px; }
        .zs-progress-wrap { flex: 1; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; transition: height 0.2s; }
        .zs-progress-wrap:hover { height: 8px; }
        .zs-progress-filled { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; transition: width 0.1s linear; }
        
        .zs-loading, .zs-error-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); z-index: 11; }
        .zs-loading.zs-visible, .zs-error-overlay.zs-visible { display: flex; }
        .zs-spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

    <script>
        (function() {
            // ------------------ الإعدادات ------------------
            const WORKER_URL = 'https://dry-truth-a84e.idriss-zribi13.workers.dev/';
            const MATCHES_API_URL = WORKER_URL + '?url=' + encodeURIComponent('https://admin.golive-pro.online/api/public/events?tz=-4');
            const MOVIES_API_URL = WORKER_URL + '?url=' + encodeURIComponent('https://admin.golive-pro.online/api/content/movies?categoryId=9ec354e5-4707-4161-9dab-b51f899b29d8&limit=20&page=');

            // ⚠️  ضع رابط الـ Worker الجديد الخاص بالأفلام هنا
            const MOVIE_PROXY_URL = 'https://movie-proxy.idriss-zribi13.workers.dev/';

            // ------------------ المباريات والأفلام الافتراضية (لضمان عدم اختفاء المحتوى أبداً) ------------------
            // تم وضع بيانات مباريات افتراضية كاملة لتتجنب الأخطاء البرمجية
            const fallbackMatches = [
                { id: 1, homeName: "Real Madrid", awayName: "Barcelona", leagueName: "La Liga", homeLogo: "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg", awayLogo: "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg", url: "https://app.site2026.top/mobile/5hTmkT0CgATBbEXUMUPuZA/1786918039/1786917778/1/bein101.m3u8", live: true, startTime: new Date() },
                { id: 2, homeName: "Manchester Utd", awayName: "Liverpool", leagueName: "Premier League", homeLogo: "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg", awayLogo: "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC_crest.svg", url: "https://app.site2026.top/mobile/5hTmkT0CgATBbEXUMUPuZA/1786918039/1786917778/1/bein202.m3u8", live: true, startTime: new Date() },
            ];

            const fallbackMovies = [
                { id: "fb1", title: "Zombies of the Third Reich", posterUrl: "https://image.tmdb.org/t/p/w600_and_h900_bestv2/hjrgOWoruk9ea0tXaN8l2gtmkeH.jpg", year: 2025, rating: 3.75, genre: "رعب", url: "http://new.dramalaly.com:8080/movie/hikayetv_vod_app/Bxddo93COihsCKzmDz7oqC5y/361152.mkv" },
                { id: "fb2", title: "Vade Retro", posterUrl: "https://image.tmdb.org/t/p/w600_and_h900_bestv2/1D2Hn8HD9tpU9j901vNRmn4Oz3J.jpg", year: 2025, rating: 5.5, genre: "كوميديا", url: "http://new.dramalaly.com:8080/movie/hikayetv_vod_app/Bxddo93COihsCKzmDz7oqC5y/361151.mkv" }
            ];

            let channels = [...fallbackMatches]; // نبدأ بها ليعمل الموقع فوراً
            let movies = [...fallbackMovies];    // نبدأ بها ليعمل الموقع فوراً
            let currentChannelId = null;
            let currentStreamUrl = '';
            let hls = null;
            let activeCategory = 'all';
            let searchQuery = '';
            let isMuted = false;

            const video = document.getElementById('zsVideo');
            const channelsList = document.getElementById('zsChannelsList');
            const searchInput = document.getElementById('zsSearchInput');
            const categoryTabs = document.getElementById('zsCategoryTabs');
            const loadingEl = document.getElementById('zsLoading');
            const errorOverlay = document.getElementById('zsErrorOverlay');
            const startOverlay = document.getElementById('zsStartOverlay');
            const liveBadge = document.getElementById('zsLiveBadge');
            const btnPlay = document.getElementById('zsBtnPlay');
            const btnMute = document.getElementById('zsBtnMute');
            const volumeSlider = document.getElementById('zsVolumeSlider');
            const timeDisplay = document.getElementById('zsTimeDisplay');
            const progressWrap = document.getElementById('zsProgressWrap');
            const progressFilled = document.getElementById('zsProgressFilled');
            const btnFullscreen = document.getElementById('zsBtnFullscreen');
            const btnRotate = document.getElementById('zsBtnRotate');
            const videoContainer = document.getElementById('zsVideoContainer');
            const wrapper = document.querySelector('.zs-player-wrapper');

            function showLoading() { loadingEl.classList.add('zs-visible'); }
            function hideLoading() { loadingEl.classList.remove('zs-visible'); }
            function showError() { errorOverlay.classList.add('zs-visible'); }
            function hideError() { errorOverlay.classList.remove('zs-visible'); }
            function setLiveMode(live) { liveBadge.classList.toggle('zs-visible', live); }

            function destroyPlayer() {
                if (hls) { hls.destroy(); hls = null; }
                video.pause(); video.removeAttribute('src'); video.load();
                hideError(); hideLoading();
            }

            function loadStream(url) {
                destroyPlayer();
                showLoading();
                startOverlay.classList.add('zs-hidden');

                // 1. معالجة المباريات (m3u8)
                if (url.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                            hideLoading(); hideError(); setLiveMode(true); 
                            video.play().catch(()=>{}); 
                        });
                        hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) { showError(); hideLoading(); } });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url; video.play();
                    }
                    return;
                }

                // 2. معالجة الأفلام (عبر Proxy لتفادي Mixed Content)
                if (url.includes('.mkv') || url.includes('.mp4')) {
                    video.src = MOVIE_PROXY_URL + '?url=' + encodeURIComponent(url);
                    video.play().then(() => {
                        hideLoading(); hideError();
                    }).catch(() => {
                        hideLoading(); showError();
                    });
                }
            }

            // ------------------ دوال المباريات ------------------
            function getStatus(startTime) {
                const now = new Date();
                const start = new Date(startTime);
                const end = new Date(start.getTime() + 3 * 60 * 60 * 1000);
                if (now < start) return 'upcoming';
                if (now >= start && now <= end) return 'live';
                return 'ended';
            }

            function renderMatches() {
                // تصفية المحتوى بناءً على البحث والفئة
                const filtered = channels.filter(ch => {
                    const matchCategory = activeCategory === 'all' || (activeCategory === 'Live' && ch.live) || (activeCategory === 'Sports');
                    return matchCategory && ch.name.toLowerCase().includes(searchQuery.toLowerCase());
                });

                if (filtered.length === 0) {
                    channelsList.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary)">لا توجد مباريات</div>';
                    return;
                }

                // تركيب البطاقات (تم إصلاح الأسماء لكي تعمل مع البيانات الافتراضية)
                channelsList.innerHTML = filtered.map(ch => {
                    const homeName = ch.homeName || ch.name.split(' vs ')[0] || 'فريق';
                    const awayName = ch.awayName || ch.name.split(' vs ')[1] || 'فريق';
                    const leagueName = ch.leagueName || ch.category || 'بطولة';
                    
                    const homeLogo = ch.homeLogo || '';
                    const awayLogo = ch.awayLogo || '';
                    
                    const startTime = ch.startTime ? new Date(ch.startTime) : null;
                    const timeStr = startTime ? startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : '--:--';

                    let statusHTML = '', statusClass = '';
                    if (ch.startTime) {
                        const status = getStatus(ch.startTime);
                        if (status === 'live') { statusHTML = '🔴 مباشر'; statusClass = 'live'; }
                        else if (status === 'ended') { statusHTML = '✅ انتهت'; statusClass = 'ended'; }
                        else { statusHTML = '⏰ قادمة'; statusClass = ''; }
                    } else if (ch.live) { statusHTML = '🔴 مباشر'; statusClass = 'live'; }
                    else { statusHTML = '● متوقف'; statusClass = ''; }

                    return `
                        <div class="zs-channel-card ${ch.id === currentChannelId ? 'zs-active' : ''}" data-id="${ch.id}">
                            <div class="zs-match-league"><span>${leagueName}</span><span class="zs-trophy-icon">🏆</span></div>
                            <div class="zs-match-body">
                                <div class="zs-team">
                                    <div class="zs-logo"><img src="${homeLogo}" onerror="this.style.display='none'; this.parentNode.textContent='${homeName.charAt(0)}'"></div>
                                    <span class="zs-team-name">${homeName}</span>
                                </div>
                                <div class="zs-center-info">
                                    <div class="zs-status-center ${statusClass}">${statusHTML}</div>
                                    <div class="zs-time-block"><span class="zs-time">${timeStr}</span><span class="zs-vs">VS</span></div>
                                </div>
                                <div class="zs-team">
                                    <div class="zs-logo"><img src="${awayLogo}" onerror="this.style.display='none'; this.parentNode.textContent='${awayName.charAt(0)}'"></div>
                                    <span class="zs-team-name">${awayName}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                channelsList.querySelectorAll('.zs-channel-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = parseInt(card.dataset.id);
                        const channel = channels.find(c => c.id === id);
                        if (channel) {
                            currentChannelId = id; currentStreamUrl = channel.url;
                            renderContent(); loadStream(channel.url);
                        }
                    });
                });
            }

            async function loadMatchesFromAPI() {
                try {
                    const res = await fetch(MATCHES_API_URL);
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        // تحويل البيانات القادمة من الـ API
                        const matchChannels = data.filter(m => m.sources && m.sources[0].streamUrl).map((m, idx) => ({
                            id: 3000 + idx, 
                            name: `${m.homeName} vs ${m.awayName}`,
                            homeName: m.homeName, 
                            awayName: m.awayName,
                            leagueName: m.leagueName || m.category,
                            homeLogo: m.homeLogoUrl, 
                            awayLogo: m.awayLogoUrl,
                            url: m.sources[0].streamUrl, 
                            startTime: m.startTime, 
                            isMatch: true,
                            live: true,
                            category: m.leagueName
                        }));
                        // استبدال القائمة بالبيانات الحقيقية
                        channels = matchChannels;
                        if(activeCategory !== 'Movies') renderContent();
                    }
                } catch (e) { 
                    // في حالة الفشل، تبقى fallbackMatches المعرفة في الأعلى
                    console.warn('فشل تحميل المباريات، تم استخدام المباريات الافتراضية.');
                }
            }

            // ------------------ دوال الأفلام ------------------
            async function loadMoviesFromAPI() {
                try {
                    const resp = await fetch(WORKER_URL + '?url=' + encodeURIComponent(MOVIES_API_URL + '1'));
                    const data = await resp.json();
                    
                    if (data.data && data.data.length > 0) {
                        movies = data.data.map(m => ({
                            id: m.id, title: m.title, posterUrl: m.posterUrl, year: m.year, rating: m.rating,
                            genre: m.genre, genreAr: m.genreAr || m.genre,
                            url: m.sources && m.sources.length > 0 ? m.sources[0].streamUrl : null
                        }));
                        if(activeCategory === 'Movies') renderContent();
                    }
                } catch (e) { 
                    console.warn('فشل تحميل الأفلام، تم استخدام الأفلام الافتراضية.');
                }
            }

            function renderMovies() {
                const filtered = movies.filter(m => m.title.toLowerCase().includes(searchQuery.toLowerCase()));

                if (filtered.length === 0) {
                    channelsList.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary)">لا توجد أفلام</div>';
                    return;
                }

                channelsList.style.display = 'block';
                channelsList.innerHTML = `
                    <div class="zs-movies-grid">
                        ${filtered.map(m => `
                            <div class="zs-movie-card ${m.id === currentChannelId ? 'zs-active' : ''}" data-id="${m.id}">
                                <div class="zs-movie-poster-wrap">
                                    <img class="zs-movie-poster" src="${m.posterUrl}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
                                    <div class="zs-movie-genre-badge">${m.genreAr || m.genre || 'Movie'}</div>
                                    <div class="zs-movie-rating">★ ${m.rating || 'N/A'}</div>
                                </div>
                                <div class="zs-movie-info">
                                    <div class="zs-movie-title">${m.title}</div>
                                    <div class="zs-movie-meta"><span>${m.year || ''}</span></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                channelsList.querySelectorAll('.zs-movie-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = card.dataset.id;
                        const movie = movies.find(m => m.id === id);
                        if (movie && movie.url) {
                            currentChannelId = id; currentStreamUrl = movie.url;
                            renderContent(); loadStream(movie.url);
                        }
                    });
                });
            }

            // ------------------ التحكم العام ------------------
            function renderContent() {
                if (activeCategory === 'Movies') {
                    channelsList.style.display = 'block'; 
                    renderMovies();
                } else {
                    channelsList.style.display = 'flex'; 
                    renderMatches();
                }
            }

            categoryTabs.addEventListener('click', (e) => {
                const tab = e.target.closest('.zs-category-tab');
                if (!tab) return;
                activeCategory = tab.dataset.category;
                categoryTabs.querySelectorAll('.zs-category-tab').forEach(t => t.classList.remove('zs-active'));
                tab.classList.add('zs-active');
                searchQuery = ''; searchInput.value = '';
                renderContent();
            });

            searchInput.addEventListener('input', () => {
                searchQuery = searchInput.value;
                renderContent();
            });

            // ------------------ أدوات التحكم في المشغل ------------------
            btnPlay.addEventListener('click', () => { if (video.paused) video.play(); else video.pause(); });
            video.addEventListener('play', () => { btnPlay.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`; });
            video.addEventListener('pause', () => { btnPlay.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; });
            
            volumeSlider.addEventListener('input', () => { video.volume = volumeSlider.value / 100; });
            btnMute.addEventListener('click', () => { isMuted = !isMuted; video.volume = isMuted ? 0 : 1; volumeSlider.value = isMuted ? 0 : 100; });
            
            video.addEventListener('timeupdate', () => {
                if (video.duration) {
                    const m = Math.floor(video.currentTime/60); const s = Math.floor(video.currentTime%60);
                    const dm = Math.floor(video.duration/60); const ds = Math.floor(video.duration%60);
                    timeDisplay.textContent = `${m}:${s.toString().padStart(2,'0')} / ${dm}:${ds.toString().padStart(2,'0')}`;
                    progressFilled.style.width = (video.currentTime / video.duration * 100) + '%';
                }
            });
            progressWrap.addEventListener('click', (e) => {
                if (!video.duration) return;
                const rect = progressWrap.getBoundingClientRect();
                video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
            });

            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) { wrapper.requestFullscreen(); } else { document.exitFullscreen(); }
            });
            btnRotate.addEventListener('click', () => { videoContainer.classList.toggle('rotated'); });

            document.getElementById('zsErrorRetry').addEventListener('click', () => { if (currentStreamUrl) loadStream(currentStreamUrl); });

            // ------------------ التشغيل الأساسي ------------------
            function init() {
                renderContent(); // ستعرض فوراً المباريات والأفلام الافتراضية
                loadMatchesFromAPI(); // تحاول تحميل المباريات الحقيقية من الخلف
                loadMoviesFromAPI();  // تحاول تحميل الأفلام الحقيقية من الخلف
                setInterval(loadMatchesFromAPI, 300000);
            }
            init();
        })();
    </script>
</body>
    </html>
