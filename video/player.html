<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zi Store - مشغل البث المباشر</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest">
    </script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js">
    </script>
    <style>
        :root {
            --zs-bg: #0a0a0f;
            --zs-surface: #12121a;
            --zs-controls-bg: rgba(10, 10, 18, 0.92);
            --zs-accent: #e4a83d;
            --zs-accent2: #d4942b;
            --zs-text: #f0f0f0;
            --zs-text-secondary: #b0b0b8;
            --zs-live: #e53935;
            --zs-live-glow: rgba(229, 57, 53, 0.6);
            --zs-border: rgba(255, 255, 255, 0.08);
            --zs-radius: 14px;
            --zs-radius-sm: 8px;
            --zs-transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            --zs-font: 'Segoe UI', 'Tahoma', 'Geneva', 'Verdana', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05050a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: var(--zs-font);
            padding: 20px;
            direction: rtl;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .zs-player-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            background: var(--zs-bg);
            border-radius: var(--zs-radius);
            overflow: hidden;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 0 1px var(--zs-border),
                0 0 80px rgba(228, 168, 61, 0.06);
            aspect-ratio: 16 / 9;
            cursor: pointer;
            direction: rtl;
            transition: all var(--zs-transition);
        }
        .zs-player-wrapper.zs-theater {
            max-width: 100%;
            border-radius: 0;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 0 1px var(--zs-border);
        }
        .zs-player-wrapper.zs-fullscreen {
            max-width: 100%;
            width: 100%;
            height: 100%;
            border-radius: 0;
            aspect-ratio: unset;
        }

        .zs-video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        .zs-video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* ============ START OVERLAY (big play button) ============ */
        .zs-start-overlay {
            position: absolute;
            inset: 0;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: opacity 0.4s, visibility 0.4s;
        }
        .zs-start-overlay.zs-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .zs-start-play-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--zs-accent);
            color: #0a0a0f;
            font-size: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(228, 168, 61, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            outline: none;
            font-family: var(--zs-font);
            line-height: 1;
            margin-bottom: 18px;
        }
        .zs-start-play-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 12px 36px rgba(228, 168, 61, 0.7);
        }
        .zs-start-play-btn:active {
            transform: scale(0.95);
        }
        .zs-start-brand {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .zs-start-brand span {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            color: #ddd;
        }

        /* ============ WATERMARK ============ */
        .zs-watermark {
            position: absolute;
            top: 22px;
            left: 22px;
            right: auto;
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 9px;
            opacity: 0.78;
            transition: opacity 0.5s;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .zs-watermark-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--zs-accent), #c77d1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            color: #0a0a0f;
            letter-spacing: 0;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }
        .zs-watermark-text {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.6px;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* ============ LIVE BADGE ============ */
        .zs-live-badge {
            position: absolute;
            top: 22px;
            right: 22px;
            left: auto;
            z-index: 10;
            pointer-events: none;
            display: none;
            align-items: center;
            gap: 7px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .zs-live-badge.zs-visible {
            display: flex;
        }
        .zs-live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--zs-live);
            animation: zs-live-pulse 1.4s infinite ease-in-out;
            box-shadow: 0 0 10px var(--zs-live-glow), 0 0 24px var(--zs-live-glow);
        }
        @keyframes zs-live-pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.8);
                opacity: 0.4;
            }
        }
        .zs-live-text {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        /* ============ LOADING SPINNER ============ */
        .zs-loading {
            position: absolute;
            inset: 0;
            z-index: 8;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            pointer-events: none;
        }
        .zs-loading.zs-visible {
            display: flex;
        }
        .zs-spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--zs-accent);
            border-radius: 50%;
            animation: zs-spin 0.8s linear infinite;
        }
        @keyframes zs-spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============ ERROR OVERLAY ============ */
        .zs-error-overlay {
            position: absolute;
            inset: 0;
            z-index: 12;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            gap: 16px;
            text-align: center;
            padding: 20px;
        }
        .zs-error-overlay.zs-visible {
            display: flex;
        }
        .zs-error-icon {
            font-size: 48px;
            margin-bottom: 4px;
        }
        .zs-error-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .zs-error-msg {
            font-size: 13px;
            color: #b0b0b8;
            max-width: 340px;
        }
        .zs-error-retry {
            padding: 10px 28px;
            background: var(--zs-accent);
            color: #0a0a0f;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            font-family: var(--zs-font);
            transition: all var(--zs-transition);
            letter-spacing: 0.4px;
        }
        .zs-error-retry:hover {
            background: var(--zs-accent2);
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(228, 168, 61, 0.35);
        }

        /* ============ CONTROL BAR ============ */
        .zs-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 11;
            background: var(--zs-controls-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 14px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity var(--zs-transition), transform var(--zs-transition);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
        }
        .zs-controls.zs-hidden {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }

        .zs-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all var(--zs-transition);
            flex-shrink: 0;
            position: relative;
            font-family: var(--zs-font);
        }
        .zs-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .zs-btn:active {
            transform: scale(0.9);
        }
        .zs-btn.zs-active {
            color: var(--zs-accent);
            background: rgba(228, 168, 61, 0.12);
        }

        .zs-btn-play {
            font-size: 22px;
        }

        .zs-volume-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .zs-volume-slider {
            width: 70px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            transition: width var(--zs-transition);
        }
        .zs-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .zs-volume-slider::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }

        .zs-time-display {
            font-size: 12px;
            color: var(--zs-text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 80px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            letter-spacing: 0.5px;
        }

        .zs-progress-wrap {
            flex: 1;
            min-width: 60px;
            height: 18px;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        .zs-progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            transition: height var(--zs-transition);
        }
        .zs-progress-wrap:hover .zs-progress-track {
            height: 7px;
        }
        .zs-progress-buffered {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            transition: width 0.3s;
        }
        .zs-progress-filled {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--zs-accent);
            border-radius: 4px;
            transition: width 0.15s linear;
        }
        .zs-progress-thumb {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity var(--zs-transition);
            pointer-events: none;
            z-index: 2;
        }
        .zs-progress-wrap:hover .zs-progress-thumb {
            opacity: 1;
        }
        .zs-progress-live {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #aaa;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .zs-spacer {
            flex: 0 0 0;
        }
        @media (min-width: 700px) {
            .zs-spacer {
                flex: 1;
                min-width: 10px;
            }
        }

        .zs-dropdown {
            position: relative;
            flex-shrink: 0;
        }
        .zs-dropdown-menu {
            position: absolute;
            bottom: 44px;
            right: 0;
            left: auto;
            background: rgba(18, 18, 28, 0.96);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: var(--zs-radius-sm);
            border: 1px solid var(--zs-border);
            padding: 6px 0;
            min-width: 130px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: all var(--zs-transition);
            z-index: 20;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            list-style: none;
        }
        .zs-dropdown-menu.zs-open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .zs-dropdown-menu li {
            padding: 9px 18px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
            font-family: var(--zs-font);
            letter-spacing: 0.3px;
        }
        .zs-dropdown-menu li:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }
        .zs-dropdown-menu li.zs-selected {
            color: var(--zs-accent);
            font-weight: 700;
        }
        .zs-dropdown-menu li.zs-selected::before {
            content: '✓ ';
            font-weight: 700;
        }

        .zs-flash {
            position: absolute;
            inset: 0;
            z-index: 9;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s;
        }
        .zs-flash.zs-active {
            opacity: 0.7;
            transition: opacity 0s;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 600px) {
            .zs-player-wrapper {
                border-radius: 0;
                aspect-ratio: 16/9;
                max-width: 100%;
            }
            .zs-controls {
                padding: 6px 8px 8px;
                gap: 3px;
            }
            .zs-btn {
                width: 30px;
                height: 30px;
                font-size: 15px;
            }
            .zs-btn-play {
                font-size: 18px;
            }
            .zs-volume-slider {
                width: 40px;
            }
            .zs-time-display {
                font-size: 10px;
                min-width: 55px;
            }
            .zs-watermark {
                top: 10px;
                left: 10px;
                right: auto;
                gap: 5px;
            }
            .zs-watermark-icon {
                width: 24px;
                height: 24px;
                font-size: 11px;
            }
            .zs-watermark-text {
                font-size: 11px;
                padding: 3px 8px;
            }
            .zs-live-badge {
                top: 10px;
                right: 10px;
                left: auto;
                padding: 4px 10px;
                gap: 5px;
            }
            .zs-live-text {
                font-size: 10px;
            }
            .zs-live-dot {
                width: 7px;
                height: 7px;
            }
            .zs-dropdown-menu {
                bottom: 38px;
                min-width: 100px;
            }
            .zs-dropdown-menu li {
                padding: 7px 12px;
                font-size: 11px;
            }
            .zs-start-play-btn {
                width: 70px;
                height: 70px;
                font-size: 32px;
            }
            .zs-start-brand {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="zs-player-wrapper" id="zsPlayerWrapper">
        <div class="zs-video-container" id="zsVideoContainer">
            <video id="zsVideo" playsinline webkit-playsinline x-webkit-airplay="allow"
        disableRemotePlayback crossorigin="anonymous"></video>

        <!-- Watermark (always visible) -->
        <div class="zs-watermark" id="zsWatermark">
            <div class="zs-watermark-icon">Z</div>
            <span class="zs-watermark-text">Zi Store</span>
        </div>

        <!-- Live Badge -->
        <div class="zs-live-badge" id="zsLiveBadge">
            <span class="zs-live-dot"></span>
            <span class="zs-live-text">مباشر</span>
        </div>

        <!-- Loading -->
        <div class="zs-loading" id="zsLoading">
            <div class="zs-spinner"></div>
        </div>

        <!-- Screenshot Flash -->
        <div class="zs-flash" id="zsFlash"></div>

        <!-- Error Overlay -->
        <div class="zs-error-overlay" id="zsErrorOverlay">
            <div class="zs-error-icon">⚠️</div>
            <div class="zs-error-title">تعذر تشغيل البث</div>
            <div class="zs-error-msg" id="zsErrorMsg">تحقق من الرابط أو جودة الاتصال</div>
            <button class="zs-error-retry" id="zsErrorRetry">🔄 إعادة المحاولة</button>
        </div>

        <!-- BIG START OVERLAY (Play button) -->
        <div class="zs-start-overlay" id="zsStartOverlay">
            <button class="zs-start-play-btn" id="zsStartPlayBtn">▶</button>
            <div class="zs-start-brand">
                Zi Store <span>بث مباشر</span>
            </div>
        </div>
    </div>

    <!-- Control Bar -->
    <div class="zs-controls" id="zsControls">
        <button class="zs-btn zs-btn-play" id="zsBtnPlay" title="تشغيل / إيقاف">▶</button>
        <div class="zs-volume-wrap">
            <button class="zs-btn" id="zsBtnMute" title="كتم الصوت">🔊</button>
            <input type="range" class="zs-volume-slider" id="zsVolumeSlider" min="0" max="100" value="100" title="مستوى الصوت">
        </div>
        <span class="zs-time-display" id="zsTimeDisplay">--:-- / --:--</span>
        <div class="zs-progress-wrap" id="zsProgressWrap">
            <div class="zs-progress-track" id="zsProgressTrack">
                <div class="zs-progress-buffered" id="zsProgressBuffered"></div>
                <div class="zs-progress-filled" id="zsProgressFilled"></div>
                <div class="zs-progress-thumb" id="zsProgressThumb"></div>
                <div class="zs-progress-live" id="zsProgressLive">🔴 بث مباشر</div>
            </div>
        </div>
        <div class="zs-spacer"></div>
        <div class="zs-dropdown" id="zsSpeedDropdown">
            <button class="zs-btn" id="zsBtnSpeed" title="سرعة التشغيل">⏱</button>
            <ul class="zs-dropdown-menu" id="zsSpeedMenu">
                <li data-speed="0.25">0.25x</li><li data-speed="0.5">0.5x</li><li data-speed="0.75">0.75x</li>
                <li data-speed="1" class="zs-selected">1x - عادي</li><li data-speed="1.25">1.25x</li>
                <li data-speed="1.5">1.5x</li><li data-speed="2">2x</li>
            </ul>
        </div>
        <div class="zs-dropdown" id="zsQualityDropdown">
            <button class="zs-btn" id="zsBtnQuality" title="الجودة">🎛</button>
            <ul class="zs-dropdown-menu" id="zsQualityMenu">
                <li data-quality="-1" class="zs-selected">تلقائي</li>
            </ul>
        </div>
        <button class="zs-btn" id="zsBtnScreenshot" title="التقاط صورة">📸</button>
        <button class="zs-btn" id="zsBtnPiP" title="صورة داخل صورة">🖼</button>
        <button class="zs-btn" id="zsBtnTheater" title="وضع المسرح">📐</button>
        <button class="zs-btn" id="zsBtnFullscreen" title="ملء الشاشة">⛶</button>
        <button class="zs-btn" id="zsBtnSettings" title="الإعدادات">⚙</button>
    </div>
</div>

<script>
    (function() {
        // ⚠️ ضع رابط البث الذي تريده هنا (m3u8, mpd, mp4...)
        const STREAM_URL = "https://example.com/stream.m3u8"; // <-- غيّر هذا الرابط إلى رابط البث الخاص بك

        const wrapper = document.getElementById('zsPlayerWrapper');
        const videoContainer = document.getElementById('zsVideoContainer');
        const video = document.getElementById('zsVideo');
        const liveBadge = document.getElementById('zsLiveBadge');
        const loadingEl = document.getElementById('zsLoading');
        const flashEl = document.getElementById('zsFlash');
        const errorOverlay = document.getElementById('zsErrorOverlay');
        const errorMsg = document.getElementById('zsErrorMsg');
        const errorRetry = document.getElementById('zsErrorRetry');
        const startOverlay = document.getElementById('zsStartOverlay');
        const startPlayBtn = document.getElementById('zsStartPlayBtn');
        const controls = document.getElementById('zsControls');
        const btnPlay = document.getElementById('zsBtnPlay');
        const btnMute = document.getElementById('zsBtnMute');
        const volumeSlider = document.getElementById('zsVolumeSlider');
        const timeDisplay = document.getElementById('zsTimeDisplay');
        const progressWrap = document.getElementById('zsProgressWrap');
        const progressTrack = document.getElementById('zsProgressTrack');
        const progressBuffered = document.getElementById('zsProgressBuffered');
        const progressFilled = document.getElementById('zsProgressFilled');
        const progressThumb = document.getElementById('zsProgressThumb');
        const progressLive = document.getElementById('zsProgressLive');
        const speedMenu = document.getElementById('zsSpeedMenu');
        const qualityMenu = document.getElementById('zsQualityMenu');
        const btnSpeed = document.getElementById('zsBtnSpeed');
        const btnQuality = document.getElementById('zsBtnQuality');
        const btnScreenshot = document.getElementById('zsBtnScreenshot');
        const btnPiP = document.getElementById('zsBtnPiP');
        const btnTheater = document.getElementById('zsBtnTheater');
        const btnFullscreen = document.getElementById('zsBtnFullscreen');
        const btnSettings = document.getElementById('zsBtnSettings');

        let hls = null;
        let dashPlayer = null;
        let isLive = false;
        let isHLS = false;
        let isDASH = false;
        let reconnectAttempts = 0;
        let maxReconnectAttempts = 10;
        let reconnectTimeout = null;
        let controlsHideTimeout = null;
        let currentSpeed = 1;
        let currentQuality = -1;
        let qualityLevels = [];
        let lastVolume = 100;
        let screenshotCanvas = null;

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '--:--';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function showLoading() { loadingEl.classList.add('zs-visible'); }
        function hideLoading() { loadingEl.classList.remove('zs-visible'); }

        function showError(msg) {
            errorMsg.textContent = msg || 'تعذر تشغيل البث. تحقق من الرابط أو جودة الاتصال.';
            errorOverlay.classList.add('zs-visible');
            hideLoading();
        }

        function hideError() { errorOverlay.classList.remove('zs-visible'); }

        function setLiveMode(live) {
            isLive = live;
            if (live) {
                liveBadge.classList.add('zs-visible');
                progressLive.style.display = 'flex';
                progressFilled.style.display = 'none';
                progressThumb.style.display = 'none';
                progressBuffered.style.display = 'none';
                timeDisplay.textContent = '🔴 مباشر';
                progressWrap.style.pointerEvents = 'none';
            } else {
                liveBadge.classList.remove('zs-visible');
                progressLive.style.display = 'none';
                progressFilled.style.display = 'block';
                progressThumb.style.display = 'block';
                progressBuffered.style.display = 'block';
                progressWrap.style.pointerEvents = 'auto';
                updateTimeDisplay();
            }
        }

        function updateTimeDisplay() {
            if (isLive) {
                timeDisplay.textContent = '🔴 مباشر';
                return;
            }
            const cur = formatTime(video.currentTime);
            const dur = formatTime(video.duration);
            timeDisplay.textContent = `${cur} / ${dur}`;
        }

        function updateProgress() {
            if (isLive || !video.duration || !isFinite(video.duration)) {
                progressFilled.style.width = '0%';
                progressBuffered.style.width = '0%';
                progressThumb.style.left = '0%';
                return;
            }
            const pct = (video.currentTime / video.duration) * 100;
            progressFilled.style.width = pct + '%';
            progressThumb.style.left = pct + '%';
            if (video.buffered.length > 0) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const buffPct = (bufferedEnd / video.duration) * 100;
                progressBuffered.style.width = buffPct + '%';
            }
        }

        function updatePlayButton() {
            if (video.paused || video.ended) {
                btnPlay.textContent = '▶';
                btnPlay.title = 'تشغيل';
            } else {
                btnPlay.textContent = '⏸';
                btnPlay.title = 'إيقاف';
            }
        }

        function updateMuteButton() {
            if (video.muted || video.volume === 0) {
                btnMute.textContent = '🔇';
                volumeSlider.value = 0;
            } else {
                btnMute.textContent = '🔊';
                volumeSlider.value = Math.round(video.volume * 100);
            }
        }

        function buildQualityMenu() {
            qualityMenu.innerHTML = '';
            const autoLi = document.createElement('li');
            autoLi.dataset.quality = '-1';
            autoLi.textContent = 'تلقائي';
            if (currentQuality === -1) autoLi.classList.add('zs-selected');
            autoLi.addEventListener('click', () => setQuality(-1));
            qualityMenu.appendChild(autoLi);

            qualityLevels.forEach((level, index) => {
                const li = document.createElement('li');
                li.dataset.quality = index;
                const height = level.height || (level.bitrate ? Math.round(level.bitrate / 1000) + 'k' : 'جودة ' + (index + 1));
                let label = '';
                if (level.height) {
                    if (level.height >= 2160) label = '4K (2160p)';
                    else if (level.height >= 1440) label = '2K (1440p)';
                    else if (level.height >= 1080) label = 'Full HD (1080p)';
                    else if (level.height >= 720) label = 'HD (720p)';
                    else if (level.height >= 480) label = 'SD (480p)';
                    else label = level.height + 'p';
                } else {
                    label = height;
                }
                if (level.bitrate) label += ' • ' + Math.round(level.bitrate / 1000) + 'kbps';
                li.textContent = label;
                if (currentQuality === index) li.classList.add('zs-selected');
                li.addEventListener('click', () => setQuality(index));
                qualityMenu.appendChild(li);
            });

            document.getElementById('zsQualityDropdown').style.display = qualityLevels.length > 0 ? 'block' : 'none';
        }

        function setQuality(index) {
            currentQuality = index;
            if (hls && isHLS) {
                if (index === -1) hls.currentLevel = -1;
                else if (index >= 0 && index < hls.levels.length) hls.currentLevel = index;
            }
            buildQualityMenu();
            try { localStorage.setItem('zs-quality', index); } catch (e) {}
        }

        function setSpeed(speed) {
            currentSpeed = speed;
            video.playbackRate = speed;
            speedMenu.querySelectorAll('li').forEach(li => {
                li.classList.toggle('zs-selected', parseFloat(li.dataset.speed) === speed);
            });
            try { localStorage.setItem('zs-speed', speed); } catch (e) {}
        }

        function triggerScreenshot() {
            if (!video.videoWidth || !video.videoHeight) return;
            if (!screenshotCanvas) screenshotCanvas = document.createElement('canvas');
            screenshotCanvas.width = video.videoWidth;
            screenshotCanvas.height = video.videoHeight;
            const ctx = screenshotCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, screenshotCanvas.width, screenshotCanvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.font = 'bold ' + Math.max(18, screenshotCanvas.width * 0.025) + 'px "Segoe UI", Tahoma, sans-serif';
            ctx.textAlign = 'right';
            ctx.shadowColor = 'rgba(0,0,0,0.7)';
            ctx.shadowBlur = 6;
            ctx.fillText('Zi Store', screenshotCanvas.width - 25, screenshotCanvas.height - 20);
            ctx.shadowBlur = 0;
            screenshotCanvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ZiStore_Screenshot_' + new Date().toISOString().replace(/[:.]/g, '-') + '.png';
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
            flashEl.classList.add('zs-active');
            setTimeout(() => flashEl.classList.remove('zs-active'), 100);
        }

        function toggleFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            } else {
                const el = wrapper;
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            }
        }

        function toggleTheater() {
            wrapper.classList.toggle('zs-theater');
            const isTheater = wrapper.classList.contains('zs-theater');
            btnTheater.classList.toggle('zs-active', isTheater);
            try { localStorage.setItem('zs-theater', isTheater ? '1' : '0'); } catch (e) {}
        }

        async function togglePiP() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (document.pictureInPictureEnabled && video.readyState >= 1) {
                    await video.requestPictureInPicture();
                }
            } catch (e) {}
        }

        function togglePlay() {
            if (video.paused || video.ended) {
                video.play().catch(() => {});
            } else {
                video.pause();
            }
            updatePlayButton();
            resetControlsTimer();
        }

        function setVolume(val) {
            video.volume = val / 100;
            video.muted = (val === 0);
            updateMuteButton();
            try { localStorage.setItem('zs-volume', val); } catch (e) {}
        }

        function toggleMute() {
            if (video.muted || video.volume === 0) {
                video.muted = false;
                video.volume = lastVolume / 100 || 1;
                volumeSlider.value = lastVolume || 100;
            } else {
                lastVolume = Math.round(video.volume * 100);
                video.muted = true;
                volumeSlider.value = 0;
            }
            updateMuteButton();
        }

        function showControls() {
            controls.classList.remove('zs-hidden');
            resetControlsTimer();
        }

        function hideControls() {
            if (!video.paused && !document.querySelector('.zs-dropdown-menu.zs-open')) {
                controls.classList.add('zs-hidden');
            }
        }

        function resetControlsTimer() {
            if (controlsHideTimeout) clearTimeout(controlsHideTimeout);
            if (!video.paused) {
                controlsHideTimeout = setTimeout(hideControls, 3500);
            }
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.zs-dropdown-menu.zs-open').forEach(m => m.classList.remove('zs-open'));
        }

        function toggleDropdown(menu) {
            const isOpen = menu.classList.contains('zs-open');
            closeAllDropdowns();
            if (!isOpen) menu.classList.add('zs-open');
        }

        // ==================== STREAM INIT ====================
        function destroyExistingPlayer() {
            if (hls) { hls.destroy();
                hls = null; }
            if (dashPlayer) { dashPlayer.reset();
                dashPlayer = null; }
            isHLS = false;
            isDASH = false;
            qualityLevels = [];
            currentQuality = -1;
            reconnectAttempts = 0;
            if (reconnectTimeout) clearTimeout(reconnectTimeout);
            video.pause();
            video.removeAttribute('src');
            video.load();
            hideError();
            hideLoading();
            setLiveMode(false);
            buildQualityMenu();
        }

        function loadStream(url) {
            destroyExistingPlayer();
            hideError();
            showLoading();
            startOverlay.classList.add('zs-hidden'); // hide big play button once stream starts loading

            const lowerUrl = url.toLowerCase().trim();
            if (lowerUrl.endsWith('.m3u8') || lowerUrl.includes('.m3u8')) {
                loadHLS(url);
            } else if (lowerUrl.endsWith('.mpd') || lowerUrl.includes('.mpd')) {
                loadDASH(url);
            } else if (lowerUrl.endsWith('.mp4') || lowerUrl.endsWith('.webm') || lowerUrl.endsWith('.ogg') || lowerUrl
                .endsWith('.mov')) {
                loadDirect(url);
            } else {
                loadHLS(url);
            }
        }

        function loadHLS(url) {
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    liveDurationInfinity: true,
                    liveBackBufferLength: 60,
                    manifestLoadingTimeOut: 20000,
                    manifestLoadingMaxRetry: 4,
                    levelLoadingTimeOut: 15000,
                    levelLoadingMaxRetry: 4,
                    fragLoadingTimeOut: 20000,
                    fragLoadingMaxRetry: 6,
                    startFragPrefetch: true,
                    testBandwidth: true,
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                    hideLoading();
                    hideError();
                    qualityLevels = data.levels.map(l => ({ height: l.height, bitrate: l.bitrate,
                        width: l.width }));
                    buildQualityMenu();
                    const liveDetected = data.levels.some(l => l.details && l.details.live === true) ||
                        (hls.levels && hls.levels.length > 0 && hls.levels[0].details && hls.levels[0]
                            .details.live);
                    setLiveMode(liveDetected || (data.levels.length > 0 && !isFinite(data.levels[0].details
                        ?.totalduration)));
                    try {
                        const saved = localStorage.getItem('zs-quality');
                        if (saved !== null) setQuality(parseInt(saved));
                    } catch (e) {}
                    video.play().catch(() => {});
                    updatePlayButton();
                    resetControlsTimer();
                });
                hls.on(Hls.Events.LEVEL_SWITCHED, function(event, data) {
                    currentQuality = data.level;
                    buildQualityMenu();
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                handleReconnect(url, 'hls');
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                showError('خطأ في البث: ' + (data.details || 'غير معروف'));
                                break;
                        }
                    }
                });
                isHLS = true;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                loadDirect(url);
                isHLS = true;
            } else {
                showError('المتصفح لا يدعم تشغيل HLS. يرجى استخدام متصفح حديث.');
            }
        }

        function loadDASH(url) {
            try {
                dashPlayer = dashjs.MediaPlayer().create();
                dashPlayer.initialize(video, url, true);
                dashPlayer.setAutoPlay(true);
                dashPlayer.on(dashjs.MediaPlayer.events.MANIFEST_LOADED, function() {
                    hideLoading();
                    hideError();
                    const isDynamic = dashPlayer.isDynamic();
                    setLiveMode(isDynamic);
                    const bitrateInfo = dashPlayer.getBitrateInfoListFor('video');
                    if (bitrateInfo && bitrateInfo.length > 0) {
                        qualityLevels = bitrateInfo.map(b => ({ height: b.height, bitrate: b.bitrate,
                            width: b.width }));
                        buildQualityMenu();
                    }
                    updatePlayButton();
                    resetControlsTimer();
                });
                dashPlayer.on(dashjs.MediaPlayer.events.ERROR, function(e) {
                    handleReconnect(url, 'dash');
                });
                isDASH = true;
            } catch (e) {
                showError('تعذر تحميل مشغل DASH: ' + e.message);
            }
        }

        function loadDirect(url) {
            video.src = url;
            video.load();
            video.play().then(() => {
                hideLoading();
                hideError();
                if (!isFinite(video.duration) || video.duration > 86400) {
                    setLiveMode(true);
                } else {
                    setLiveMode(false);
                }
                updatePlayButton();
                resetControlsTimer();
            }).catch(err => {
                hideLoading();
                showError('تعذر تشغيل الفيديو: ' + err.message);
            });
            document.getElementById('zsQualityDropdown').style.display = 'none';
        }

        function handleReconnect(url, type) {
            if (reconnectAttempts >= maxReconnectAttempts) {
                showError('انقطع البث بعد عدة محاولات. يرجى التحقق من الاتصال والمحاولة لاحقاً.');
                return;
            }
            reconnectAttempts++;
            const delay = Math.min(2000 * Math.pow(1.5, reconnectAttempts - 1), 30000);
            showLoading();
            if (reconnectTimeout) clearTimeout(reconnectTimeout);
            reconnectTimeout = setTimeout(() => {
                if (type === 'hls') loadHLS(url);
                else if (type === 'dash') loadDASH(url);
                else loadStream(url);
            }, delay);
        }

        // ==================== EVENT LISTENERS ====================
        startPlayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (STREAM_URL && STREAM_URL.trim() !== '') {
                loadStream(STREAM_URL);
            } else {
                alert('الرجاء تعديل رابط البث داخل الكود (STREAM_URL)');
            }
        });

        btnPlay.addEventListener('click', (e) => { e.stopPropagation();
            togglePlay(); });
        btnMute.addEventListener('click', (e) => { e.stopPropagation();
            toggleMute(); });
        volumeSlider.addEventListener('input', () => { setVolume(parseInt(volumeSlider.value)); });
        volumeSlider.addEventListener('click', (e) => e.stopPropagation());
        btnScreenshot.addEventListener('click', (e) => { e.stopPropagation();
            triggerScreenshot(); });
        btnPiP.addEventListener('click', (e) => { e.stopPropagation();
            togglePiP(); });
        btnTheater.addEventListener('click', (e) => { e.stopPropagation();
            toggleTheater(); });
        btnFullscreen.addEventListener('click', (e) => { e.stopPropagation();
            toggleFullscreen(); });
        btnSettings.addEventListener('click', (e) => {
            e.stopPropagation();
            // يمكنك تخصيصه لفتح نافذة تغيير الرابط مثلاً، لكن بما أنك تفضل إدخاله داخل الكود فقط، سنبقيه بدون وظيفة حالياً.
            alert('تم تعيين الرابط داخل الكود. قم بتعديل المتغير STREAM_URL.');
            closeAllDropdowns();
        });

        btnSpeed.addEventListener('click', (e) => { e.stopPropagation();
            toggleDropdown(speedMenu); });
        btnQuality.addEventListener('click', (e) => { e.stopPropagation();
            toggleDropdown(qualityMenu); });

        speedMenu.querySelectorAll('li').forEach(li => {
            li.addEventListener('click', (e) => {
                e.stopPropagation();
                setSpeed(parseFloat(li.dataset.speed));
                speedMenu.classList.remove('zs-open');
            });
        });

        errorRetry.addEventListener('click', () => {
            hideError();
            reconnectAttempts = 0;
            loadStream(STREAM_URL);
        });

        progressWrap.addEventListener('click', (e) => {
            if (isLive || !video.duration || !isFinite(video.duration)) return;
            const rect = progressTrack.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            video.currentTime = pct * video.duration;
            updateProgress();
            updateTimeDisplay();
            resetControlsTimer();
        });

        let isDragging = false;
        progressWrap.addEventListener('mousedown', (e) => {
            if (isLive || !video.duration || !isFinite(video.duration)) return;
            isDragging = true;
            const rect = progressTrack.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            video.currentTime = pct * video.duration;
            updateProgress();
            updateTimeDisplay();
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = progressTrack.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            video.currentTime = pct * video.duration;
            updateProgress();
            updateTimeDisplay();
        });
        document.addEventListener('mouseup', () => { isDragging = false;
            resetControlsTimer(); });

        video.addEventListener('timeupdate', () => { updateProgress();
            updateTimeDisplay(); });
        video.addEventListener('progress', updateProgress);
        video.addEventListener('play', () => { updatePlayButton();
            resetControlsTimer(); });
        video.addEventListener('pause', () => { updatePlayButton();
            showControls();
            if (controlsHideTimeout) clearTimeout(controlsHideTimeout); });
        video.addEventListener('ended', () => { updatePlayButton();
            showControls(); });
        video.addEventListener('waiting', showLoading);
        video.addEventListener('canplay', hideLoading);
        video.addEventListener('playing', hideLoading);
        video.addEventListener('loadedmetadata', () => { hideLoading();
            updateTimeDisplay();
            updateProgress(); });
        video.addEventListener('error', () => {
            hideLoading();
            if (isHLS || isDASH) return;
            const err = video.error;
            let msg = 'خطأ في تشغيل الفيديو';
            if (err) {
                switch (err.code) {
                    case 1:
                        msg = 'تم إيقاف التشغيل. تحقق من الرابط.';
                        break;
                    case 2:
                        msg = 'خطأ في الشبكة. تحقق من اتصالك.';
                        break;
                    case 3:
                        msg = 'تعذر فك تشفير الفيديو.';
                        break;
                    case 4:
                        msg = 'الفيديو غير مدعوم أو غير موجود.';
                        break;
                }
            }
            showError(msg);
        });

        wrapper.addEventListener('click', (e) => {
            if (e.target === wrapper || e.target === videoContainer || e.target === video) {
                togglePlay();
            }
        });
        video.addEventListener('click', (e) => { e.stopPropagation();
            togglePlay(); });
        wrapper.addEventListener('dblclick', (e) => {
            if (e.target === video || e.target === videoContainer || e.target === wrapper) {
                toggleFullscreen();
            }
        });

        wrapper.addEventListener('mousemove', showControls);
        wrapper.addEventListener('mouseenter', showControls);
        wrapper.addEventListener('mouseleave', () => { if (!video.paused) hideControls();
            closeAllDropdowns(); });
        wrapper.addEventListener('touchstart', (e) => { if (e.target === video || e.target === videoContainer || e
                .target === wrapper) showControls(); }, { passive: true });

        document.addEventListener('keydown', (e) => {
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) return;
            switch (e.key.toLowerCase()) {
                case ' ':
                case 'k':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'f':
                    e.preventDefault();
                    toggleFullscreen();
                    break;
                case 't':
                    e.preventDefault();
                    toggleTheater();
                    break;
                case 'm':
                    e.preventDefault();
                    toggleMute();
                    break;
                case 'i':
                    e.preventDefault();
                    togglePiP();
                    break;
                case 's':
                    if (!e.ctrlKey && !e.metaKey) { e.preventDefault();
                        triggerScreenshot(); }
                    break;
                case 'r':
                    if (!e.ctrlKey && !e.metaKey) { e.preventDefault();
                        reconnectAttempts = 0;
                        loadStream(STREAM_URL); }
                    break;
                case 'arrowup':
                    e.preventDefault();
                    setVolume(Math.min(100, (video.volume * 100) + 5));
                    break;
                case 'arrowdown':
                    e.preventDefault();
                    setVolume(Math.max(0, (video.volume * 100) - 5));
                    break;
                case 'arrowleft':
                    if (!isLive && video.duration && isFinite(video.duration)) {
                        e.preventDefault();
                        video.currentTime = Math.max(0, video.currentTime - 10);
                        updateProgress();
                        updateTimeDisplay();
                        showControls();
                    }
                    break;
                case 'arrowright':
                    if (!isLive && video.duration && isFinite(video.duration)) {
                        e.preventDefault();
                        video.currentTime = Math.min(video.duration, video.currentTime + 10);
                        updateProgress();
                        updateTimeDisplay();
                        showControls();
                    }
                    break;
                case 'escape':
                    closeAllDropdowns();
                    if (document.fullscreenElement) toggleFullscreen();
                    break;
            }
        });

        document.addEventListener('fullscreenchange', () => {
            wrapper.classList.toggle('zs-fullscreen', !!document.fullscreenElement);
            btnFullscreen.classList.toggle('zs-active', !!document.fullscreenElement);
            resetControlsTimer();
        });
        document.addEventListener('webkitfullscreenchange', () => {
            wrapper.classList.toggle('zs-fullscreen', !!document.webkitFullscreenElement);
            btnFullscreen.classList.toggle('zs-active', !!document.webkitFullscreenElement);
            resetControlsTimer();
        });

        video.addEventListener('enterpictureinpicture', () => { btnPiP.classList.add('zs-active'); });
        video.addEventListener('leavepictureinpicture', () => { btnPiP.classList.remove('zs-active'); });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.zs-dropdown')) closeAllDropdowns();
        });

        video.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const action = confirm(
                '🎬 Zi Store Player\n\nاختر إجراء:\n• موافق = التقاط صورة (Screenshot)\n• إلغاء = إظهار/إخفاء شريط التحكم');
            if (action) triggerScreenshot();
            else {
                controls.classList.toggle('zs-hidden');
                if (!controls.classList.contains('zs-hidden')) resetControlsTimer();
            }
        });

        // ==================== INITIALIZATION ====================
        function init() {
            try {
                const savedVol = localStorage.getItem('zs-volume');
                if (savedVol !== null) {
                    const v = parseInt(savedVol);
                    video.volume = v / 100;
                    video.muted = (v === 0);
                    volumeSlider.value = v;
                }
                const savedSpeed = localStorage.getItem('zs-speed');
                if (savedSpeed !== null) setSpeed(parseFloat(savedSpeed));
                const savedTheater = localStorage.getItem('zs-theater');
                if (savedTheater === '1') {
                    wrapper.classList.add('zs-theater');
                    btnTheater.classList.add('zs-active');
                }
            } catch (e) {}

            updateMuteButton();
            updatePlayButton();
            buildQualityMenu();
            showControls();
            // لا نقوم بتحميل البث تلقائياً، ننتظر النقر على زر Play الكبير
            startOverlay.classList.remove('zs-hidden');
        }

        window.ZiStorePlayer = {
            load: loadStream,
            play: () => { video.play().catch(() => {});
                updatePlayButton(); },
            pause: () => { video.pause();
                updatePlayButton(); },
            togglePlay: togglePlay,
            setVolume: setVolume,
            toggleMute: toggleMute,
            toggleFullscreen: toggleFullscreen,
            toggleTheater: toggleTheater,
            togglePiP: togglePiP,
            screenshot: triggerScreenshot,
            setQuality: setQuality,
            setSpeed: setSpeed,
            getVideo: () => video,
            isLive: () => isLive,
            reload: () => { reconnectAttempts = 0;
                loadStream(STREAM_URL); },
            destroy: destroyExistingPlayer,
        };

        init();
        console.log('🏆 Zi Store Player ✓ جاهز (اضغط على زر Play للبدء)');
    })();
</script>
</body>
    </html>
