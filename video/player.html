<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zi Store - Live Sports & Matches</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-glass: rgba(18, 18, 26, 0.85);
            --surface-hover: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.1);
            --text: #f5f5f5;
            --text-secondary: #b0b0b8;
            --accent: #e4a83d;
            --accent2: #c8842c;
            --accent-glow: rgba(228,168,61,0.5);
            --live: #e53935;
            --live-glow: rgba(229,57,53,0.8);
            --shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px var(--border);
            --radius: 16px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --header-bg: rgba(10,10,18,0.85);
        }

        [data-theme="light"] {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface-glass: rgba(255,255,255,0.9);
            --surface-hover: rgba(0,0,0,0.04);
            --border: rgba(0,0,0,0.08);
            --text: #1a1a2e;
            --text-secondary: #555;
            --accent: #0284c7;
            --accent2: #0369a1;
            --accent-glow: rgba(2,132,199,0.4);
            --live: #dc2626;
            --live-glow: rgba(220,38,38,0.6);
            --shadow: 0 10px 30px rgba(0,0,0,0.08), 0 0 0 1px var(--border);
            --header-bg: rgba(255,255,255,0.9);
        }

        [data-theme="legendary"] {
            --bg: #1a0f0a;
            --surface: #2d1f14;
            --surface-glass: rgba(45,31,20,0.9);
            --surface-hover: rgba(255,255,255,0.08);
            --border: rgba(255,215,0,0.3);
            --text: #ffd700;
            --text-secondary: #d4a574;
            --accent: #ff6b00;
            --accent2: #e05a00;
            --accent-glow: rgba(255,107,0,0.6);
            --live: #ff0000;
            --live-glow: rgba(255,0,0,0.8);
            --shadow: 0 25px 60px rgba(255,215,0,0.2), 0 0 0 1px var(--border);
            --header-bg: rgba(26,15,10,0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: var(--font);
            min-height: 100vh;
            color: var(--text);
            transition: background 0.4s, color 0.4s;
            overflow-x: hidden;
        }

        /* خلفية متحركة */
        .zs-bg-effects { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .zs-bg-effects span { position: absolute; border-radius: 50%; background: var(--accent); opacity: 0.05; animation: float 15s infinite ease-in-out; }
        .zs-bg-effects span:nth-child(1) { width: 300px; height: 300px; top: -100px; left: -100px; }
        .zs-bg-effects span:nth-child(2) { width: 200px; height: 200px; bottom: -50px; right: -50px; animation-delay: 3s; }
        .zs-bg-effects span:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 50%; animation-delay: 6s; }
        @keyframes float { 0%,100% { transform: translate(0,0); } 33% { transform: translate(30px,-30px); } 66% { transform: translate(-20px,20px); } }

        .zs-app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

        /* الهيدر */
        .zs-header {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 24px; background: var(--header-bg); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; flex-wrap: wrap;
        }
        .zs-header-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; }
        .zs-brand-icon {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 22px; color: #0a0a0f;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: logo-pulse 3s infinite ease-in-out, logo-rotate 8s linear infinite;
        }
        @keyframes logo-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes logo-rotate { 0% { background: linear-gradient(135deg, var(--accent), var(--accent2)); } 50% { background: linear-gradient(135deg, var(--accent2), var(--accent)); } 100% { background: linear-gradient(135deg, var(--accent), var(--accent2)); } }
        .zs-header-tagline { font-size: 14px; color: var(--text-secondary); background: var(--surface-glass); padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); }

        /* أزرار الثيم */
        .zs-theme-switch { display: flex; gap: 6px; background: var(--surface-glass); border-radius: 30px; padding: 4px; border: 1px solid var(--border); }
        .zs-theme-btn {
            padding: 8px 14px; border-radius: 25px; border: none; background: transparent; color: var(--text-secondary);
            cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--font);
            transition: all var(--transition); display: flex; align-items: center; gap: 5px;
        }
        .zs-theme-btn:hover { color: var(--text); background: var(--surface-hover); }
        .zs-theme-btn.zs-active { background: var(--accent); color: #0a0a0f; box-shadow: 0 0 15px var(--accent-glow); }

        /* التخطيط الرئيسي */
        .zs-main { flex: 1; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; align-items: flex-start; }
        .zs-player-section { flex: 1 1 100%; max-width: 100%; min-width: 0; }
        @media (min-width: 1000px) { .zs-player-section { flex: 1 1 calc(100% - 380px); max-width: calc(100% - 380px); } }
        .zs-channels-section {
            flex: 1 1 100%; background: var(--surface-glass); backdrop-filter: blur(20px);
            border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden;
            display: flex; flex-direction: column; min-height: 400px; max-height: 70vh; box-shadow: var(--shadow);
        }
        @media (min-width: 1000px) { .zs-channels-section { flex: 0 0 360px; min-height: auto; max-height: calc(100vh - 140px); position: sticky; top: 90px; } }
        .zs-channels-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; background: var(--surface-glass); }
        .zs-channels-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: var(--accent); }
        .zs-search-box { position: relative; }
        .zs-search-box input {
            width: 100%; padding: 10px 36px 10px 14px; border-radius: 25px; border: 1px solid var(--border);
            background: var(--surface-hover); color: var(--text); font-size: 14px; outline: none;
            transition: all var(--transition); font-family: var(--font);
        }
        .zs-search-box input:focus { border-color: var(--accent); background: var(--surface-glass); box-shadow: 0 0 0 3px rgba(228,168,61,0.15); }
        .zs-search-icon { position: absolute; top: 50%; left: 14px; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }

        .zs-category-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .zs-category-tab {
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent;
            color: var(--text-secondary); cursor: pointer; font-size: 13px; font-family: var(--font);
            transition: all var(--transition); white-space: nowrap;
        }
        .zs-category-tab.zs-active { background: var(--accent); color: #0a0a0f; border-color: var(--accent); font-weight: 700; }

        .zs-channels-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

        /* بطاقة القناة/المباراة */
        .zs-channel-card {
            display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--radius-sm);
            background: var(--surface-hover); border: 1px solid var(--border); cursor: pointer;
            transition: all var(--transition); position: relative; overflow: hidden;
        }
        .zs-channel-card:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); transform: translateY(-2px); }
        .zs-channel-card.zs-active { background: linear-gradient(135deg, rgba(228,168,61,0.2), rgba(228,168,61,0.05)); border-color: var(--accent); }
        .zs-channel-logos { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .zs-team-logo {
            width: 56px; height: 56px; border-radius: 50%; background: #1a1a2e; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: #fff; overflow: hidden; border: 2px solid var(--border);
        }
        .zs-team-logo img { width: 100%; height: 100%; object-fit: contain; }
        .zs-channel-info { flex: 1; min-width: 0; }
        .zs-channel-match { font-weight: 700; font-size: 16px; line-height: 1.4; }
        .zs-channel-meta { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .zs-status-badge {
            padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap;
        }
        .zs-status-live { background: var(--live); color: #fff; animation: pulse 1.5s infinite; }
        .zs-status-upcoming { background: var(--accent); color: #0a0a0f; }
        .zs-status-ended { background: #555; color: #ddd; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 var(--live-glow); } 50% { box-shadow: 0 0 12px var(--live-glow); } }

        /* مشغل الفيديو */
        .zs-player-wrapper { position: relative; width: 100%; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); aspect-ratio: 16/9; }
        .zs-video-container { width: 100%; height: 100%; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        /* عناصر التحكم والمؤثرات */
        .zs-controls { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface-glass); backdrop-filter: blur(20px); padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .zs-btn { background: none; border: none; color: var(--text); cursor: pointer; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
        .zs-btn:hover { background: var(--surface-hover); }
        .zs-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .zs-volume-slider { width: 70px; height: 4px; accent-color: var(--accent); }
        .zs-time-display { font-size: 12px; color: var(--text-secondary); }
        .zs-progress-wrap { flex: 1; min-width: 60px; height: 4px; background: var(--border); border-radius: 2px; cursor: pointer; }
        .zs-progress-filled { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }
        .zs-live-badge { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #fff; padding: 6px 14px; border-radius: 20px; display: none; align-items: center; gap: 6px; }
        .zs-live-badge.zs-visible { display: flex; }
        .zs-start-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); z-index: 10; }
        .zs-start-overlay.zs-hidden { display: none; }
        .zs-start-play-btn { width: 80px; height: 80px; border-radius: 50%; background: var(--accent); color: #0a0a0f; font-size: 32px; border: none; cursor: pointer; }
        .zs-loading, .zs-error-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); z-index: 11; }
        .zs-loading.zs-visible, .zs-error-overlay.zs-visible { display: flex; }
        .zs-spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* استجابة */
        @media (max-width: 600px) {
            .zs-header { padding: 10px; }
            .zs-main { padding: 10px; gap: 10px; }
            .zs-channel-card { padding: 12px; }
            .zs-team-logo { width: 44px; height: 44px; font-size: 14px; }
            .zs-channel-match { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="zs-bg-effects"><span></span><span></span><span></span></div>

    <div class="zs-app">
        <header class="zs-header">
            <div class="zs-header-brand">
                <div class="zs-brand-icon">Z</div>
                <span>Zi Store</span>
            </div>
            <div class="zs-header-tagline">📺 Live Sports & Matches</div>
            <div class="zs-theme-switch" id="themeSwitch">
                <button class="zs-theme-btn zs-active" data-theme="dark">🌙 Dark</button>
                <button class="zs-theme-btn" data-theme="light">☀️ Light</button>
                <button class="zs-theme-btn" data-theme="legendary">👑 Legendary</button>
            </div>
        </header>

        <main class="zs-main">
            <section class="zs-player-section">
                <div class="zs-player-wrapper" id="zsPlayerWrapper">
                    <div class="zs-video-container">
                        <video id="zsVideo" playsinline></video>
                        <div class="zs-live-badge" id="zsLiveBadge"><span>🔴</span> LIVE</div>
                        <div class="zs-loading" id="zsLoading"><div class="zs-spinner"></div></div>
                        <div class="zs-error-overlay" id="zsErrorOverlay">
                            <div>⚠️ Unable to play stream</div>
                            <button id="zsErrorRetry" class="zs-btn">Retry</button>
                        </div>
                        <div class="zs-start-overlay" id="zsStartOverlay">
                            <button class="zs-start-play-btn" id="zsStartPlayBtn">▶</button>
                            <div>Choose a channel to start</div>
                        </div>
                    </div>
                    <div class="zs-controls">
                        <button class="zs-btn" id="zsBtnPlay">▶</button>
                        <input type="range" class="zs-volume-slider" id="zsVolumeSlider" min="0" max="100" value="100">
                        <span class="zs-time-display" id="zsTimeDisplay">--:--</span>
                        <div class="zs-progress-wrap" id="zsProgressWrap"><div class="zs-progress-filled" id="zsProgressFilled"></div></div>
                        <button class="zs-btn" id="zsBtnFullscreen">⛶</button>
                    </div>
                </div>
            </section>

            <aside class="zs-channels-section">
                <div class="zs-channels-header">
                    <div class="zs-channels-title">📡 Matches & Channels</div>
                    <div class="zs-search-box">
                        <input type="text" id="zsSearchInput" placeholder="Search...">
                        <span class="zs-search-icon">🔍</span>
                    </div>
                    <div class="zs-category-tabs" id="zsCategoryTabs">
                        <button class="zs-category-tab zs-active" data-category="all">All</button>
                        <button class="zs-category-tab" data-category="Live">🔴 Live</button>
                        <button class="zs-category-tab" data-category="Sports">Sports</button>
                    </div>
                </div>
                <div class="zs-channels-list" id="zsChannelsList"></div>
            </aside>
        </main>
    </div>

    <script>
        (function() {
            // Configuration
            const WORKER_URL = 'https://dry-truth-a84e.idriss-zribi13.workers.dev/';
            const MATCHES_API_URL = WORKER_URL + '?url=' + encodeURIComponent('https://admin.golive-pro.online/api/public/events?tz=-4');

            // Stable channels (fallback)
            const defaultChannels = [
                { id: 101, name: "beIN Sports 1 HD", category: "Sports", logo: "B1", url: "https://app.site2026.top/mobile/5hTmkT0CgATBbEXUMUPuZA/1786918039/1786917778/1/bein101.m3u8", live: true },
                { id: 102, name: "beIN Sports 2 HD", category: "Sports", logo: "B2", url: "https://app.site2026.top/mobile/5hTmkT0CgATBbEXUMUPuZA/1786918039/1786917778/1/bein202.m3u8", live: true },
                { id: 103, name: "beIN Sports 3 HD", category: "Sports", logo: "B3", url: "https://app.site2026.top/mobile/5hTmkT0CgATBbEXUMUPuZA/1786918039/1786917778/1/bein303.m3u8", live: true },
            ];

            let channels = [...defaultChannels];
            let currentChannelId = null;
            let currentStreamUrl = '';
            let hls = null;
            let activeCategory = 'all';
            let searchQuery = '';

            // DOM elements
            const video = document.getElementById('zsVideo');
            const wrapper = document.getElementById('zsPlayerWrapper');
            const liveBadge = document.getElementById('zsLiveBadge');
            const loadingEl = document.getElementById('zsLoading');
            const errorOverlay = document.getElementById('zsErrorOverlay');
            const startOverlay = document.getElementById('zsStartOverlay');
            const controls = document.querySelector('.zs-controls');
            const btnPlay = document.getElementById('zsBtnPlay');
            const btnFullscreen = document.getElementById('zsBtnFullscreen');
            const volumeSlider = document.getElementById('zsVolumeSlider');
            const timeDisplay = document.getElementById('zsTimeDisplay');
            const progressWrap = document.getElementById('zsProgressWrap');
            const progressFilled = document.getElementById('zsProgressFilled');
            const channelsList = document.getElementById('zsChannelsList');
            const searchInput = document.getElementById('zsSearchInput');
            const categoryTabs = document.getElementById('zsCategoryTabs');

            // Theme handling
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('zs-theme', theme);
                document.querySelectorAll('.zs-theme-btn').forEach(btn => {
                    btn.classList.toggle('zs-active', btn.dataset.theme === theme);
                });
            }
            const savedTheme = localStorage.getItem('zs-theme') || 'dark';
            setTheme(savedTheme);
            document.querySelectorAll('.zs-theme-btn').forEach(btn => {
                btn.addEventListener('click', () => setTheme(btn.dataset.theme));
            });

            // Helper functions
            function showLoading() { loadingEl.classList.add('zs-visible'); }
            function hideLoading() { loadingEl.classList.remove('zs-visible'); }
            function showError() { errorOverlay.classList.add('zs-visible'); }
            function hideError() { errorOverlay.classList.remove('zs-visible'); }
            function setLiveMode(live) { liveBadge.classList.toggle('zs-visible', live); }
            function formatTime(s) { if (!isFinite(s) || s < 0) return '--:--'; const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; }

            function updateTimeDisplay() {
                if (!video.duration) return;
                timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            }
            function updateProgress() {
                if (!video.duration) return;
                progressFilled.style.width = (video.currentTime / video.duration * 100) + '%';
            }

            // Stream loading
            function destroyPlayer() {
                if (hls) { hls.destroy(); hls = null; }
                video.pause();
                video.removeAttribute('src');
                video.load();
                hideError();
                hideLoading();
                setLiveMode(false);
            }
            function loadStream(url) {
                destroyPlayer();
                showLoading();
                startOverlay.classList.add('zs-hidden');
                if (url.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            hideLoading();
                            hideError();
                            setLiveMode(true);
                            video.play().catch(()=>{});
                            updateTimeDisplay();
                        });
                        hls.on(Hls.Events.ERROR, (e, data) => {
                            if (data.fatal) { showError(); hideLoading(); }
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                        video.play();
                    }
                } else {
                    video.src = url;
                    video.play().catch(()=>{ showError(); hideLoading(); });
                }
            }

            // Rendering
            function getLogoHTML(url, fallback) {
                if (url && url.startsWith('http')) {
                    return `<img src="${url}" alt="${fallback}" style="width:100%;height:100%;object-fit:contain;">`;
                }
                return fallback || '?';
            }
            function getStatusBadge(ch) {
                if (ch.live && ch.startTime) {
                    const now = new Date();
                    const start = new Date(ch.startTime);
                    if (now >= start && now <= new Date(start.getTime() + 3*60*60*1000)) return '<span class="zs-status-badge zs-status-live">LIVE</span>';
                    if (now < start) return '<span class="zs-status-badge zs-status-upcoming">UPCOMING</span>';
                    return '<span class="zs-status-badge zs-status-ended">ENDED</span>';
                }
                return ch.live ? '<span class="zs-status-badge zs-status-live">LIVE</span>' : '';
            }
            function renderChannels() {
                let filtered = channels.filter(ch => {
                    const matchCategory = activeCategory === 'all' || (activeCategory === 'Live' && ch.live) || (activeCategory === 'Sports' && ch.category === 'Sports');
                    const matchSearch = ch.name.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchCategory && matchSearch;
                });

                if (filtered.length === 0) {
                    channelsList.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary)">No channels found</div>';
                    return;
                }

                channelsList.innerHTML = filtered.map(ch => {
                    const homeLogo = ch.homeLogo || ch.logo;
                    const awayLogo = ch.awayLogo || '';
                    const matchName = ch.name.includes(' vs ') ? ch.name : ch.name;
                    const homeName = ch.homeName || (ch.name.split(' vs ')[0] || '');
                    const awayName = ch.awayName || (ch.name.split(' vs ')[1] || '');
                    return `
                        <div class="zs-channel-card ${ch.id === currentChannelId ? 'zs-active' : ''}" data-id="${ch.id}">
                            <div class="zs-channel-logos">
                                <div class="zs-team-logo">${getLogoHTML(homeLogo, homeName.charAt(0))}</div>
                                ${awayLogo ? `<div class="zs-team-logo">${getLogoHTML(awayLogo, awayName.charAt(0))}</div>` : ''}
                            </div>
                            <div class="zs-channel-info">
                                <div class="zs-channel-match">${homeName} vs ${awayName}</div>
                                <div class="zs-channel-meta">
                                    <span>${ch.category}</span>
                                    ${ch.startTime ? `<span>${new Date(ch.startTime).toLocaleString()}</span>` : ''}
                                    ${getStatusBadge(ch)}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                channelsList.querySelectorAll('.zs-channel-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = parseInt(card.dataset.id);
                        const channel = channels.find(c => c.id === id);
                        if (channel) {
                            currentChannelId = id;
                            currentStreamUrl = channel.url;
                            renderChannels();
                            loadStream(channel.url);
                        }
                    });
                });
            }

            // Load matches from API
            async function loadMatchesFromAPI() {
                try {
                    const response = await fetch(MATCHES_API_URL);
                    if (!response.ok) throw new Error('Worker error');
                    const data = await response.json();
                    if (!Array.isArray(data)) throw new Error('Invalid data');
                    const matchChannels = data
                        .filter(m => m.sources && m.sources.length > 0 && m.sources[0].streamUrl)
                        .map((m, idx) => ({
                            id: 3000 + idx,
                            name: `${m.homeName} vs ${m.awayName}`,
                            category: m.leagueName || 'Match',
                            logo: m.homeLogoUrl,
                            homeLogo: m.homeLogoUrl,
                            awayLogo: m.awayLogoUrl,
                            homeName: m.homeName,
                            awayName: m.awayName,
                            url: m.sources[0].streamUrl,
                            live: true,
                            startTime: m.startTime,
                            isMatch: true
                        }));
                    channels = channels.filter(ch => !ch.isMatch).concat(matchChannels);
                    renderChannels();
                } catch (e) {
                    console.warn('Using stable channels only', e);
                }
            }

            // Event listeners
            btnPlay.addEventListener('click', () => { if (video.paused) video.play(); else video.pause(); });
            btnFullscreen.addEventListener('click', () => { wrapper.requestFullscreen?.(); });
            volumeSlider.addEventListener('input', () => { video.volume = volumeSlider.value / 100; });
            video.addEventListener('timeupdate', () => { updateTimeDisplay(); updateProgress(); });
            video.addEventListener('play', () => { btnPlay.textContent = '⏸'; });
            video.addEventListener('pause', () => { btnPlay.textContent = '▶'; });
            progressWrap.addEventListener('click', (e) => {
                if (!video.duration) return;
                const rect = progressWrap.getBoundingClientRect();
                const pct = (e.clientX - rect.left) / rect.width;
                video.currentTime = pct * video.duration;
            });

            searchInput.addEventListener('input', () => { searchQuery = searchInput.value; renderChannels(); });
            categoryTabs.addEventListener('click', (e) => {
                const tab = e.target.closest('.zs-category-tab');
                if (!tab) return;
                activeCategory = tab.dataset.category;
                categoryTabs.querySelectorAll('.zs-category-tab').forEach(t => t.classList.remove('zs-active'));
                tab.classList.add('zs-active');
                renderChannels();
            });

            // Init
            function init() {
                renderChannels();
                loadMatchesFromAPI();
                setInterval(loadMatchesFromAPI, 300000);
            }
            init();
        })();
    </script>
</body>
</html>
