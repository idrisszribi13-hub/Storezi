<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZI Store - Ban Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-indigo-400 mb-2 text-center">إدارة الحظر (Ban Manager)</h1>
        <p class="text-slate-400 text-sm mb-6 text-center">أدخل بريد المستخدم لتغيير حالته (حظر أو فك الحظر)</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">البريد الإلكتروني للمستخدم</label>
                <input type="email" id="userEmail" placeholder="user@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="flex gap-4 pt-2">
                <button onclick="updateBanStatus(true)" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-red-600/20">حظر (Ban)</button>
                <button onclick="updateBanStatus(false)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">فك حظر (Unban)</button>
            </div>
        </div>

        <div id="resultMessage" class="mt-6 text-center text-sm font-medium"></div>
    </div>

    <script>
        const supabaseUrl = "https://kvsyzgavfxnwqmtsginv.supabase.co";
        const supabaseAnonKey = "sb_publishable_1uSIqgNONAV53GjOoBoZUw_niAGJXO6";

        async function updateBanStatus(shouldBan) {
            const email = document.getElementById("userEmail").value.trim();
            const msgDiv = document.getElementById("resultMessage");

            if (!email) {
                msgDiv.className = "mt-6 text-center text-sm font-medium text-amber-400";
                msgDiv.innerText = "الرجاء إدخال البريد الإلكتروني أولاً!";
                return;
            }

            msgDiv.className = "mt-6 text-center text-sm font-medium text-indigo-400";
            msgDiv.innerText = "جاري تنفيذ العملية...";

            try {
                // تحديث حقل banned في جدول licenses بناءً على البريد الإلكتروني
                const response = await fetch(`${supabaseUrl}/rest/v1/licenses?email=eq.${encodeURIComponent(email)}`, {
                    method: "PATCH",
                    headers: {
                        "apikey": supabaseAnonKey,
                        "Authorization": `Bearer ${supabaseAnonKey}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({ banned: shouldBan })
                });

                if (!response.ok) throw new Error("فشل الاتصال بقاعدة البيانات");

                msgDiv.className = "mt-6 text-center text-sm font-medium text-emerald-400";
                msgDiv.innerText = shouldBan ? "تم حظر المستخدم بنجاح!" : "تم فك الحظر عن المستخدم بنجاح!";
            } catch (error) {
                msgDiv.className = "mt-6 text-center text-sm font-medium text-red-400";
                msgDiv.innerText = "حدث خطأ: " + error.message;
            }
        }
    </script>
</body>
</html>
