<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Football Center – YSScores</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- ملف التنسيقات الخاص بنا -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ===== CONNECTION STATUS ===== -->
    <div class="connection-status" id="connectionStatus">
        <span class="status-icon" id="statusIcon">📡</span>
        <span class="status-text" id="statusText">Connecting...</span>
        <button class="retry-btn" id="retryBtn">Retry</button>
    </div>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span>⚽</span>
                    <span>Football Center</span>
                    <span class="premium-badge">Premium</span>
                </div>
                <div class="header-search">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="headerSearchInput" placeholder="Search..." autocomplete="off" />
                    <div class="search-results-dropdown" id="searchResultsDropdown"></div>
                </div>
                <div class="header-actions">
                    <div class="font-controls">
                        <button id="fontDecrease" title="Decrease font size">A-</button>
                        <span class="font-label" id="fontSizeLabel">100%</span>
                        <button id="fontIncrease" title="Increase font size">A+</button>
                    </div>
                    <button class="header-btn theme-toggle-header" id="themeToggleHeader" title="Toggle theme">🌙</button>
                    <button class="header-btn favorite-btn-header" id="favoriteToggleHeader" title="Favorites">⭐</button>
                    <div class="lang-selector" id="headerLangSelector">
                        <img src="https://flagcdn.com/gb.svg" alt="EN" /> EN
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container" id="mainContent">

        <!-- ===== DATE NAV ===== -->
        <div class="date-nav">
            <button class="date-btn" id="prevDateBtn">‹</button>
            <div class="date-label" id="dateLabel">Today</div>
            <button class="calendar-btn" id="openCalendarBtn">
                <img src="https://zi-store.online/icon/calendar.png" alt="calendar" />
            </button>
            <button class="date-btn" id="nextDateBtn">›</button>
        </div>

        <!-- ===== CHAMPIONSHIP SELECTOR ===== -->
        <div class="champ-select mb-2">
            <label class="fw-bold mb-1" style="font-size:calc(13px*var(--font-scale));">Select Championship:</label>
            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle w-100 d-flex justify-content-between align-items-center" type="button" id="championshipDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="font-size:calc(14px*var(--font-scale));">
                    <span id="selectedChampText">Select Championship</span>
                </button>
                <div class="dropdown-menu w-100" aria-labelledby="championshipDropdown">
                    <div class="search-box px-3 pt-2 pb-2">
                        <input type="text" id="champSearch" placeholder="Search..." class="form-control form-control-sm" style="font-size:calc(14px*var(--font-scale));" />
                    </div>
                    <div id="champList"></div>
                </div>
            </div>
            <input type="hidden" id="selectedChampId" value="" />
        </div>

        <!-- ===== FILTER BAR ===== -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="favorites">⭐ Favorites</button>
        </div>

        <!-- ===== PAGES ===== -->
        <div id="pageLive" class="page-content">
            <div class="section-header">
                <div class="live-badge-header">
                    <span class="live-dot"></span> LIVE
                </div>
                <h3>Live Matches</h3>
            </div>
            <div id="liveMatchesContainer" class="row g-2"></div>
        </div>

        <div id="pageMatches" class="page-content" style="display:none;">
            <h3 style="font-size:calc(1.2rem*var(--font-scale));margin-bottom:12px;">📋 All Matches</h3>
            <div id="allMatchesContainer" class="row g-2"></div>
        </div>

        <div id="pageVideos" class="page-content" style="display:none;">
            <h3 style="font-size:calc(1.2rem*var(--font-scale));margin-bottom:12px;">🎥 Video Highlights</h3>
            <div id="highlightsContainer" class="highlights-grid"></div>
        </div>

        <div id="pageTransfers" class="page-content" style="display:none;">
            <h3 style="font-size:calc(1.2rem*var(--font-scale));margin-bottom:12px;">🔄 Transfers</h3>
            <div id="transfersContainer">Loading transfers...</div>
        </div>

        <div id="pageMore" class="page-content" style="display:none;">
            <h3 style="font-size:calc(1.2rem*var(--font-scale));margin-bottom:12px;">📊 More</h3>
            <ul class="nav nav-tabs" id="moreTabs" role="tablist" style="margin-bottom:12px;border-bottom:2px solid var(--border-color);gap:4px;flex-wrap:nowrap;overflow-x:auto;">
                <li class="nav-item"><button class="nav-link active" id="more-standings-tab" data-bs-toggle="tab" data-bs-target="#more-standings" type="button" role="tab" style="font-size:calc(11px*var(--font-scale));padding:6px 14px;">Standings</button></li>
                <li class="nav-item"><button class="nav-link" id="more-scorers-tab" data-bs-toggle="tab" data-bs-target="#more-scorers" type="button" role="tab" style="font-size:calc(11px*var(--font-scale));padding:6px 14px;">Scorers</button></li>
                <li class="nav-item"><button class="nav-link" id="more-assists-tab" data-bs-toggle="tab" data-bs-target="#more-assists" type="button" role="tab" style="font-size:calc(11px*var(--font-scale));padding:6px 14px;">Assists</button></li>
                <li class="nav-item"><button class="nav-link" id="more-news-tab" data-bs-toggle="tab" data-bs-target="#more-news" type="button" role="tab" style="font-size:calc(11px*var(--font-scale));padding:6px 14px;">News</button></li>
                <li class="nav-item" id="more-bracket-item" style="display:none;"><button class="nav-link" id="more-bracket-tab" data-bs-toggle="tab" data-bs-target="#more-bracket" type="button" role="tab" style="font-size:calc(11px*var(--font-scale));padding:6px 14px;">Bracket</button></li>
            </ul>
            <div class="tab-content" style="padding:8px 0;background:transparent;border:none;box-shadow:none;">
                <div class="tab-pane fade show active" id="more-standings" role="tabpanel"><div id="moreStandingsContent"></div></div>
                <div class="tab-pane fade" id="more-scorers" role="tabpanel"><div id="moreScorersContent"></div><div id="moreScorersSentinel" class="scroll-sentinel"></div></div>
                <div class="tab-pane fade" id="more-assists" role="tabpanel"><div id="moreAssistsContent"></div><div id="moreAssistsSentinel" class="scroll-sentinel"></div></div>
                <div class="tab-pane fade" id="more-news" role="tabpanel"><div id="moreNewsContent"></div><div id="moreNewsSentinel" class="scroll-sentinel"></div></div>
                <div class="tab-pane fade" id="more-bracket" role="tabpanel"><div id="moreBracketContent"></div></div>
            </div>
        </div>

        <!-- ===== LOADING ===== -->
        <div id="loadingIndicator" class="loader hidden"><div class="spinner-border text-primary" role="status"></div></div>
        <div id="errorIndicator" class="text-center text-danger py-2 hidden" style="font-size:calc(14px*var(--font-scale));"></div>
    </div>

    <!-- ===== SCROLL PROGRESS ===== -->
    <div class="scroll-progress" id="scrollProgress" title="Scroll progress">
        <svg viewBox="0 0 50 50">
            <circle class="bg-circle" cx="25" cy="25" r="20"/>
            <circle class="progress-circle" id="progressCircle" cx="25" cy="25" r="20"
            stroke-dasharray="125.6" stroke-dashoffset="125.6"/>
        </svg>
        <span class="arrow-icon" id="scrollArrow">↓</span>
    </div>

    <!-- ===== MODALS ===== -->
    <div class="modal fade" id="matchModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="matchModalTitle" style="font-size:calc(1.1rem*var(--font-scale));">Match Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body" id="matchModalBody"></div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="teamModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="teamModalTitle" style="font-size:calc(1.1rem*var(--font-scale));">Team Info</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body" id="teamModalBody"></div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="playerModalTitle" style="font-size:calc(1.1rem*var(--font-scale));">Player Info</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body" id="playerModalBody"></div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="coachModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="coachModalTitle" style="font-size:calc(1.1rem*var(--font-scale));">Coach Info</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body" id="coachModalBody"></div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="newsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="newsModalTitle" style="font-size:calc(1.1rem*var(--font-scale));">News Detail</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body" id="newsModalBody"></div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="refereeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="refereeModalTitle" style="font-size:calc(1.1rem*var(--font-scale));">Referee Info</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
                <div class="modal-body" id="refereeModalBody"></div>
            </div>
        </div>
    </div>

    <!-- ===== CALENDAR MODAL ===== -->
    <div class="modal fade" id="calendarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 style="font-size:calc(1.1rem*var(--font-scale));">Choose Date</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <button class="date-btn" onclick="changeCalMonth(-1)">‹</button>
                        <strong id="calMonthTitle" style="font-size:calc(16px*var(--font-scale));"></strong>
                        <button class="date-btn" onclick="changeCalMonth(1)">›</button>
                    </div>
                    <div class="cal-grid" id="calGrid"></div>
                    <button class="btn btn-success w-100 mt-3" onclick="applyCalendarFilter()" style="font-size:calc(14px*var(--font-scale));">Filter</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== VIDEO PLAYER MODAL ===== -->
    <div class="modal fade video-player-modal" id="streamPlayerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="d-flex align-items-center gap-3 flex-wrap">
                        <img id="streamCompLogo" src="" style="display:none;" class="stream-logo" />
                        <span id="streamCompName" class="text-white fw-bold" style="font-size:calc(14px*var(--font-scale));"></span>
                        <div class="stream-teams text-white-50" style="font-size:calc(12px*var(--font-scale));">
                            <img id="streamHomeLogo" src="" style="display:none;" />
                            <span id="streamMatchInfo" class="fs-6 fw-bold text-white"></span>
                            <img id="streamAwayLogo" src="" style="display:none;" />
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"><video id="streamVideo" controls autoplay playsinline></video></div>
            </div>
        </div>
    </div>

    <!-- ===== HIGHLIGHT PLAYER MODAL ===== -->
    <div class="modal fade" id="highlightPlayerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content" style="background:#0a0a10;">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white" id="highlightPlayerTitle" style="font-size:calc(1.1rem*var(--font-scale));">Highlights</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0" style="height:60vh;">
                    <iframe id="highlightIframe" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== LANG FLOAT ===== -->
    <div class="lang-float">
        <div class="lang-menu" id="langMenu">
            <div class="menu-title">Language</div>
            <button class="lang-option" data-lang="ar"><img src="https://flagcdn.com/sa.svg" /> العربية</button>
            <button class="lang-option" data-lang="en"><img src="https://flagcdn.com/gb.svg" /> English</button>
            <button class="lang-option" data-lang="fr"><img src="https://flagcdn.com/fr.svg" /> Français</button>
            <button class="lang-option" data-lang="es"><img src="https://flagcdn.com/es.svg" /> Español</button>
            <button class="lang-option" data-lang="it"><img src="https://flagcdn.com/it.svg" /> Italiano</button>
            <button class="lang-option" data-lang="pt"><img src="https://flagcdn.com/pt.svg" /> Português</button>
            <button class="lang-option" data-lang="br"><img src="https://flagcdn.com/br.svg" /> Brasileiro</button>
            <div class="theme-toggle-item" id="themeToggleItem">
                <span>🌓 Dark Mode</span>
                <div class="toggle-switch" id="themeSwitch">
                    <div class="toggle-dot"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-page="live">
            <img src="https://zi-store.online/icon/live.png" alt="Live" />
            <span>Live</span>
        </button>
        <button class="nav-item" data-page="matches">
            <img src="https://zi-store.online/icon/soccer-field.png" alt="Matches" />
            <span>Matches</span>
        </button>
        <button class="nav-item" data-page="videos">
            <img src="https://zi-store.online/icon/clapperboard.png" alt="Videos" />
            <span>Videos</span>
        </button>
        <button class="nav-item" data-page="transfers">
            <img src="https://zi-store.online/icon/transfer.png" alt="Transfers" />
            <span>Transfers</span>
        </button>
        <button class="nav-item" data-page="more">
            <img src="https://zi-store.online/icon/settings.png" alt="More" />
            <span>More</span>
        </button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <!-- ملف السكربت الخاص بنا -->
    <script src="js/script.js"></script>
</body>
                                         </html>
