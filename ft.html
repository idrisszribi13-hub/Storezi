<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yalla Shoot - Live Sports</title>
    <style>
        :root {
            --Main-Color: #39dbbf;
            --Secondary-Color: #06b1c3;
            --Body-BG: #e4eeff;
            --Secondary-BG: #ffffff;
            --Main-Font-Color: #444;
            --Border: 1px solid #d1e7ff;
            --Shadow: 0 2px 10px 0 rgba(0,0,0,0.15);
        }
        body.Night {
            --Body-BG: #07080e;
            --Secondary-BG: #171923;
            --Main-Font-Color: #BFC3D4;
            --Border: 1px solid #252c37;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--Body-BG); color: var(--Main-Font-Color); direction: rtl; overflow-x: hidden; transition: 0.3s; }
        
        .container { max-width: 1200px; margin: auto; padding: 12px; }
        
        /* الهيدر */
        .SiteHeader { background: var(--Secondary-BG); box-shadow: var(--Shadow); padding: 15px; position: sticky; top: 0; z-index: 50; }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; }
        #logo { font-size: 24px; font-weight: bold; color: var(--Main-Color); }
        .menu-ul { display: flex; list-style: none; gap: 20px; }
        .header-items-wrap { display: flex; align-items: center; gap: 10px; }
        .search-form input { padding: 8px; border-radius: 20px; border: var(--Border); background: var(--Body-BG); color: var(--Main-Font-Color); }
        .dark-mode, .settings-toggle { cursor: pointer; font-size: 20px; padding: 5px 10px; background: var(--Body-BG); border-radius: 8px; }
        .dark-mode:hover, .settings-toggle:hover { background: var(--Main-Color); color: #000; }

        /* نافذة الإعدادات */
        .drop-item-wrap { display: none; position: absolute; top: 60px; left: 20px; background: var(--Secondary-BG); padding: 20px; border-radius: 12px; box-shadow: var(--Shadow); z-index: 100; width: 280px; }
        .drop-item-wrap.active { display: block; }
        .dd-header { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: var(--Border); padding-bottom: 10px; }
        select, .st-opt label { display: block; width: 100%; padding: 10px; margin-bottom: 10px; background: var(--Body-BG); border: var(--Border); border-radius: 8px; cursor: pointer; }

        /* شريط الفلترة والتاريخ */
        .filter-toolbar { display: flex; justify-content: space-between; align-items: center; background: var(--Secondary-BG); padding: 12px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--Shadow); flex-wrap: wrap; gap: 10px; }
        .filter-tabs button { background: var(--Body-BG); border: var(--Border); padding: 8px 15px; border-radius: 20px; cursor: pointer; color: var(--Main-Font-Color); }
        .tab-btn.active { background: var(--Main-Color); color: #000; font-weight: bold; border: none; }
        .date-picker { cursor: pointer; position: relative; background: var(--Body-BG); padding: 8px 15px; border-radius: 8px; border: var(--Border); }
        .calendar { display: none; position: absolute; background: var(--Secondary-BG); padding: 10px; border-radius: 8px; box-shadow: var(--Shadow); top: 35px; left: 0; width: 280px; border: var(--Border); z-index: 10; }
        .calendar.active { display: block; }
        .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; padding-top: 10px; }
        .cal-day { padding: 8px; cursor: pointer; border-radius: 5px; }
        .cal-day:hover { background: var(--Main-Color); color: #000; }
        .cal-day.selected { background: var(--Main-Color); color: #000; font-weight: bold; }

        /* بطاقات المباريات */
        .TitleBox { background: var(--Secondary-BG); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-bottom: var(--Border); font-size: 20px; font-weight: bold; color: var(--Main-Color); }
        .match-card { background: var(--Secondary-BG); border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: var(--Shadow); display: flex; justify-content: space-between; align-items: center; }
        .team-info { display: flex; flex-direction: column; align-items: center; width: 30%; }
        .team-logo { width: 50px; height: 50px; border-radius: 50%; background: #eee; margin-bottom: 5px; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; }
        .match-score { text-align: center; width: 30%; font-size: 24px; font-weight: bold; }
        .live-status { color: red; font-size: 12px; animation: blink 1s infinite; margin-bottom: 5px; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* قسم الأحداث والبطاقات */
        .events-box { background: var(--Secondary-BG); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
        .event-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
        .event-item:last-child { border-bottom: none; }
        .card-icon { display: inline-block; width: 12px; height: 16px; background: yellow; margin-left: 5px; }
        
        @media (max-width: 768px) { 
            .action-bar { display: flex; } 
            .menu-ul { display: none; } 
            .filter-toolbar { flex-direction: column; align-items: stretch; }
            .filter-tabs { display: flex; overflow-x: auto; white-space: nowrap; }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header class="SiteHeader">
        <div class="container header-wrapper">
            <div id="logo">Yalla Shoot</div>
            <ul class="menu-ul">
                <li><a href="#" style="color:var(--Main-Font-Color); text-decoration:none;">الرئيسية</a></li>
                <li><a href="#" style="color:var(--Main-Font-Color); text-decoration:none;">المباريات</a></li>
                <li><a href="#" style="color:var(--Main-Font-Color); text-decoration:none;">الأخبار</a></li>
            </ul>
            <div class="header-items-wrap">
                <div class="search-form">
                    <input type="text" placeholder="بحث...">
                </div>
                <div class="settings-toggle" onclick="toggleSettings()">⚙️</div>
                <div class="dark-mode" onclick="toggleDarkMode()" id="dark-btn">🌙</div>
            </div>
        </div>
    </header>

    <!-- نافذة الإعدادات (Timezone) -->
    <div id="settings-panel" class="drop-item-wrap">
        <div class="dd-header">
            <h6>الإعدادات</h6>
            <span style="cursor:pointer" onclick="toggleSettings()">✖</span>
        </div>
        <label style="font-weight:bold">منطقتك الزمنية</label>
        <select id="timezone-select" onchange="changeTimezone()">
            <option value="Asia/Riyadh">السعودية (GMT+3)</option>
            <option value="Africa/Cairo">مصر (GMT+2)</option>
            <option value="UTC">التوقيت العالمي (UTC)</option>
        </select>
    </div>

    <!-- شريط الفلترة والتاريخ -->
    <div class="container">
        <div class="filter-toolbar">
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterByLeague(649)">الدوري السعودي</button>
                <button class="tab-btn" onclick="filterByLeague(7)">الدوري الإنجليزي</button>
                <button class="tab-btn" onclick="filterByLeague(11)">الدوري الإسباني</button>
            </div>
            <div class="date-picker" onclick="toggleCalendar()">
                📅 <span id="selected-date">2026-08-28</span> ▾
                <div id="calendar-dropdown" class="calendar">
                    <div class="cal-header">أغسطس 2026</div>
                    <div class="cal-days" id="cal-days"></div>
                </div>
            </div>
        </div>

        <!-- حاوية المباريات (سيتم تعبئتها بالـ API) -->
        <section class="MW-Box">
            <header class="TitleBox">
                مباريات اليوم
            </header>
            <div id="matches-container">
                <p style="text-align:center">جاري تحميل البيانات...</p>
            </div>
        </section>
    </div>

    <!-- الشريط السفلي -->
    <div class="action-bar">
        <ul>
            <li class="active"><span style="font-size:20px;">📺</span><br>المباريات</li>
            <li><span style="font-size:20px;">🔥</span><br>الأخبار</li>
            <li><span style="font-size:20px;">🏆</span><br>البطولات</li>
            <li onclick="toggleSettings()"><span style="font-size:20px;">⚙️</span><br>الإعدادات</li>
        </ul>
    </div>

    <script>
        // ==== 1. تحديد رابط الـ API الخاص بك ====
        // ضع هنا الرابط الذي سيعطيك بيانات المباريات
        const API_URL = "https://phantom-pro-theme.malik-web.net/wp-json/wp/v2/your-api-endpoint"; 
        // ملاحظة: البيانات التي أرسلتها تمثل مباراة واحدة حية، لذلك سأعرضها كنموذج للتوضيح.
        
        let currentLeague = 649; // الدوري السعودي
        let currentDate = new Date('2026-08-28');
        let matchesData = []; // سيتم تخزين البيانات هنا

        // ==== 2. دالة جلب البيانات من الـ API ====
        // هنا سنقوم بمحاكاة استخراج البيانات من الـ JSON الذي أرسلته
        async function fetchMatches() {
            document.getElementById('matches-container').innerHTML = '<p style="text-align:center">جاري التحميل...</p>';
            
            try {
                // في الواقع ستقوم بـ fetch(API_URL)
                // لكن للتوضيح، سأستخدم JSON الذي أرسلته مباشرة
                // (في الكود الحقيقي استبدل هذا بـ fetch(API_URL))
                const mockResponse = {
                    "game": {
                        "competitionId": 649,
                        "competitionDisplayName": "السعودية, الدوري السعودي",
                        "statusText": "شوط",
                        "gameTimeDisplay": "45'",
                        "homeCompetitor": { "name": "الرياض", "score": 0 },
                        "awayCompetitor": { "name": "نيوم", "score": 0 },
                        "events": [
                            { "playerId": 367810, "eventType": { "name": "بطاقة صفراء" }, "gameTimeDisplay": "37'" },
                            { "playerId": 6761501, "eventType": { "name": "بطاقة صفراء" }, "gameTimeDisplay": "45'" }
                        ]
                    }
                };

                // استخراج المباراة من الـ API
                const game = mockResponse.game;
                
                // فلترة حسب البطولة (حسب القيمة المختارة)
                if (game.competitionId === currentLeague) {
                    matchesData = [game];
                } else {
                    matchesData = [];
                }

                renderMatches();
            } catch (error) {
                console.error("خطأ في الاتصال بالـ API:", error);
                document.getElementById('matches-container').innerHTML = '<p style="color:red; text-align:center">تعذر الاتصال بالخادم</p>';
            }
        }

        // ==== 3. دالة عرض المباريات ====
        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            if (matchesData.length === 0) {
                container.innerHTML = '<p class="no-matches">لا توجد مباريات حالياً في هذه البطولة</p>';
                return;
            }

            matchesData.forEach(match => {
                const liveStatus = match.statusText === "شوط" ? '<div class="live-status">● مباشر</div>' : '';
                const homeScore = match.homeCompetitor.score;
                const awayScore = match.awayCompetitor.score;

                // إنشاء كود HTML لبطاقة المباراة
                let matchHTML = `
                    <div class="match-card">
                        <div class="team-info">
                            <div class="team-logo">${match.homeCompetitor.name[0]}</div>
                            <span>${match.homeCompetitor.name}</span>
                        </div>
                        <div class="match-score">
                            ${liveStatus}
                            <div>${homeScore} - ${awayScore}</div>
                            <div style="font-size: 14px; color: grey;">${match.gameTimeDisplay}</div>
                        </div>
                        <div class="team-info">
                            <div class="team-logo">${match.awayCompetitor.name[0]}</div>
                            <span>${match.awayCompetitor.name}</span>
                        </div>
                    </div>
                `;

                // إضافة قسم الأحداث (البطاقات الصفراء) إذا كانت موجودة
                if (match.events && match.events.length > 0) {
                    matchHTML += `<div class="events-box"><strong>أهم الأحداث:</strong>`;
                    match.events.forEach(event => {
                        // استخراج اسم اللاعب (في الواقع يجب البحث عنه في قائمة اللاعبين)
                        const playerName = event.playerId === 367810 ? "فيكتور لكحل" : "هارون كامارا";
                        matchHTML += `
                            <div class="event-item">
                                <span>${playerName}</span>
                                <span><span class="card-icon"></span> ${event.gameTimeDisplay}</span>
                            </div>
                        `;
                    });
                    matchHTML += `</div>`;
                }

                container.innerHTML += matchHTML;
            });
        }

        // ==== وظائف الفلترة والتاريخ والوقت ====
        function filterByLeague(id) {
            currentLeague = id;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            fetchMatches(); // إعادة جلب البيانات
        }

        function toggleCalendar() {
            document.getElementById('calendar-dropdown').classList.toggle('active');
            renderCalendar();
        }

        function renderCalendar() {
            const cal = document.getElementById('cal-days');
            cal.innerHTML = '';
            for(let i=1; i<=31; i++) {
                const selectedClass = i === currentDate.getDate() ? 'selected' : '';
                cal.innerHTML += `<div class="cal-day ${selectedClass}" onclick="selectDate(${i})">${i}</div>`;
            }
        }

        function selectDate(day) {
            currentDate = new Date(`2026-08-${day}`);
            document.getElementById('selected-date').textContent = `2026-08-${day}`;
            document.getElementById('calendar-dropdown').classList.remove('active');
            fetchMatches(); // جلب مباريات اليوم الجديد
        }

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('active');
        }

        function changeTimezone() {
            const tz = document.getElementById('timezone-select').value;
            localStorage.setItem('user-tz', tz);
            alert(`تم تغيير المنطقة الزمنية إلى ${tz}. سيتم تحويل أوقات المباريات عند عرضها.`);
            // هنا يمكنك إضافة كود لتحويل وقت البداية من UTC إلى التوقيت المحدد
            // باستخدام: new Intl.DateTimeFormat('en-GB', { timeZone: tz })
        }

        function toggleDarkMode() {
            document.body.classList.toggle('Night');
            localStorage.setItem('night-mode', document.body.classList.contains('Night'));
            document.getElementById('dark-btn').innerText = document.body.classList.contains('Night') ? '☀️' : '🌙';
        }

        // تهيئة عند التحميل
        window.onload = function() {
            if(localStorage.getItem('night-mode') === 'true') {
                document.body.classList.add('Night');
                document.getElementById('dark-btn').innerText = '☀️';
            }
            const tz = localStorage.getItem('user-tz');
            if(tz) document.getElementById('timezone-select').value = tz;
            
            fetchMatches(); // جلب البيانات
        }
    </script>
</body>
</html>
