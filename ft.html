<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cesar365 - Paris sportifs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0b0e14;
            color: #e8edf5;
            padding-bottom: 80px;
        }
        /* Header */
        .header {
            background: #141a24;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3340;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-weight: 700;
            font-size: 20px;
            color: #f0b90b;
        }
        .logo span {
            color: #fff;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .balance {
            background: #1f2937;
            padding: 4px 12px;
            border-radius: 20px;
            color: #4ade80;
        }
        /* Navigation */
        .nav {
            background: #141a24;
            padding: 8px 12px;
            display: flex;
            overflow-x: auto;
            gap: 16px;
            border-bottom: 1px solid #2a3340;
        }
        .nav-item {
            white-space: nowrap;
            padding: 6px 0;
            font-size: 14px;
            color: #9aa4b3;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }
        .nav-item.active {
            color: #f0b90b;
            border-bottom-color: #f0b90b;
        }
        .nav-item:hover {
            color: #fff;
        }
        /* Main */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 16px 0 10px;
            color: #9aa4b3;
            letter-spacing: 0.5px;
        }
        /* Match card */
        .match-card {
            background: #1a212c;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid #2a3340;
            transition: 0.2s;
            cursor: pointer;
        }
        .match-card:active {
            transform: scale(0.98);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #9aa4b3;
        }
        .match-league {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .match-league .flag {
            width: 20px;
            height: 14px;
            background: #2a3340;
            border-radius: 2px;
        }
        .match-live {
            background: #dc2626;
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .team {
            font-size: 16px;
            font-weight: 500;
        }
        .team-away {
            text-align: right;
        }
        .match-score {
            font-size: 22px;
            font-weight: 700;
            color: #f0b90b;
            background: #0f172a;
            padding: 0 12px;
            border-radius: 6px;
        }
        .match-time {
            font-size: 13px;
            color: #9aa4b3;
            margin-top: 4px;
            text-align: center;
        }
        /* Odds row */
        .odds-row {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
            gap: 6px;
        }
        .odd-btn {
            flex: 1;
            background: #1f2937;
            border: 1px solid #2a3340;
            border-radius: 8px;
            padding: 8px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #e8edf5;
            cursor: pointer;
            transition: 0.2s;
        }
        .odd-btn:active {
            background: #374151;
        }
        .odd-btn .label {
            font-size: 10px;
            color: #9aa4b3;
            font-weight: 400;
        }
        .odd-btn .price {
            display: block;
            font-size: 16px;
            margin-top: 2px;
        }
        .odd-btn.selected {
            background: #f0b90b;
            color: #0b0e14;
            border-color: #f0b90b;
        }
        .odd-btn.selected .label {
            color: #0b0e14;
        }

        /* Expandable detail */
        .match-detail {
            margin-top: 12px;
            border-top: 1px solid #2a3340;
            padding-top: 12px;
            display: none;
        }
        .match-detail.open {
            display: block;
        }
        .market-group {
            margin-bottom: 12px;
        }
        .market-title {
            font-size: 14px;
            font-weight: 500;
            color: #9aa4b3;
            margin-bottom: 6px;
        }
        .market-odds {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .market-odd {
            flex: 1;
            min-width: 60px;
            background: #1f2937;
            border-radius: 6px;
            padding: 6px 0;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #2a3340;
            transition: 0.2s;
        }
        .market-odd:active {
            background: #374151;
        }
        .market-odd .m-label {
            display: block;
            font-size: 10px;
            color: #9aa4b3;
        }
        .market-odd .m-price {
            font-weight: 600;
        }
        .market-odd.selected {
            background: #f0b90b;
            color: #0b0e14;
            border-color: #f0b90b;
        }
        .market-odd.selected .m-label {
            color: #0b0e14;
        }

        /* Bet slip */
        .bet-slip {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #141a24;
            border-top: 2px solid #f0b90b;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
            overflow-y: auto;
            z-index: 200;
            transition: 0.3s;
        }
        .bet-slip.hidden {
            transform: translateY(100%);
        }
        .bet-slip-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
        }
        .bet-slip-item {
            background: #1f2937;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .bet-slip-item .remove {
            color: #ef4444;
            cursor: pointer;
            font-weight: 700;
            margin-left: 8px;
        }
        .bet-slip-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2a3340;
            padding-top: 8px;
        }
        .bet-slip-total input {
            background: #0b0e14;
            border: 1px solid #2a3340;
            border-radius: 6px;
            padding: 6px 10px;
            color: #fff;
            width: 100px;
        }
        .bet-slip-total .potential {
            color: #4ade80;
            font-weight: 600;
        }
        .place-bet-btn {
            background: #f0b90b;
            color: #0b0e14;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .place-bet-btn:active {
            transform: scale(0.97);
        }
        .place-bet-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* empty state */
        .empty {
            color: #6b7280;
            text-align: center;
            padding: 40px 0;
        }
        .flex {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .text-green {
            color: #4ade80;
        }
        .text-red {
            color: #ef4444;
        }
        .text-muted {
            color: #9aa4b3;
        }
        /* Responsive */
        @media (min-width: 768px) {
            .container {
                max-width: 800px;
            }
            .bet-slip {
                max-width: 400px;
                right: 20px;
                left: auto;
                bottom: 20px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="logo">Cesar<span>365</span></div>
    <div class="user-info">
        <span class="balance">💰 1 234.50</span>
        <span>👤 93802</span>
    </div>
</header>

<!-- Navigation -->
<nav class="nav">
    <span class="nav-item active">⚽ Football</span>
    <span class="nav-item">🏀 Basketball</span>
    <span class="nav-item">🎾 Tennis</span>
    <span class="nav-item">🏐 Volleyball</span>
    <span class="nav-item">🏓 Ping-Pong</span>
    <span class="nav-item">🎮 E-sports</span>
</nav>

<!-- Main -->
<div class="container" id="app">
    <div class="section-title">⚡ EN DIRECT</div>
    <div id="matches-list"></div>
</div>

<!-- Bet Slip -->
<div class="bet-slip hidden" id="betSlip">
    <div class="bet-slip-header">
        <span>📋 Mon pari</span>
        <span id="slipCount">0 sélection</span>
    </div>
    <div id="slipItems"></div>
    <div class="bet-slip-total">
        <span>Mise</span>
        <input type="number" id="stakeInput" placeholder="0.00" min="0" step="0.01" value="10">
        <span>Gain potentiel</span>
        <span class="potential" id="potentialWin">0.00</span>
    </div>
    <button class="place-bet-btn" id="placeBetBtn">Placer le pari</button>
</div>

<script>
    // ===================================================================
    // DONNÉES EMBARQUÉES (extraites des réponses API)
    // ===================================================================

    // Compétiteurs
    const competitors = {
        43611: { name: 'Real Betis', abbr: 'BET' },
        43610: { name: 'Real Madrid', abbr: 'RMA' },
        43975: { name: 'Ipswich', abbr: 'IPS' },
        43703: { name: 'Liverpool', abbr: 'LIV' },
        43671: { name: 'PSG', abbr: 'PSG' },
        43674: { name: 'Monaco', abbr: 'ASM' },
        47905: { name: 'Lommel SK', abbr: 'LOM' },
        43747: { name: 'Club Brugge', abbr: 'BRU' },
        43772: { name: 'FC Porto', abbr: 'POR' },
        47107: { name: 'Moreirense', abbr: 'MOR' },
    };

    // Matchs avec leurs marchés principaux (1x2)
    const matches = [{
        id: 17466892,
        name: 'Real Betis vs. Real Madrid',
        homeId: 43611,
        awayId: 43610,
        score: [0, 0],
        liveTime: "68'",
        league: 'LaLiga • Espagne',
        status: 1,
        markets: {
            '1x2': {
                label: '1x2',
                odds: [
                    { label: '1', price: 9.0, competitorId: 43611 },
                    { label: 'X', price: 2.4 },
                    { label: '2', price: 1.875, competitorId: 43610 }
                ]
            },
            'Total': {
                label: 'Total (0.5)',
                odds: [
                    { label: 'Plus de 0.5', price: 1.425 },
                    { label: 'Moins de 0.5', price: 2.9 }
                ]
            },
            'Double chance': {
                label: 'Double chance',
                odds: [
                    { label: '1X', price: 1.9 },
                    { label: '12', price: 1.5556 },
                    { label: 'X2', price: 1.0556 }
                ]
            },
            'Les deux équipes qui marquent': {
                label: 'BTTS',
                odds: [
                    { label: 'Oui', price: 6.0 },
                    { label: 'Non', price: 1.1053 }
                ]
            }
        }
    }, {
        id: 17162722,
        name: 'Ipswich vs. Liverpool',
        homeId: 43975,
        awayId: 43703,
        score: [0, 2],
        liveTime: "72'",
        league: 'Premier League • Angleterre',
        status: 1,
        markets: {
            '1x2': {
                label: '1x2',
                odds: [
                    { label: '1', price: 101, competitorId: 43975 },
                    { label: 'X', price: 16 },
                    { label: '2', price: 1.0134, competitorId: 43703 }
                ]
            }
        }
    }, {
        id: 17455117,
        name: 'PSG vs. Monaco',
        homeId: 43671,
        awayId: 43674,
        score: [1, 1],
        liveTime: "66'",
        league: 'Ligue 1 • France',
        status: 1,
        markets: {
            '1x2': {
                label: '1x2',
                odds: [
                    { label: '1', price: 1.8462, competitorId: 43671 },
                    { label: 'X', price: 2.4 },
                    { label: '2', price: 9.5, competitorId: 43674 }
                ]
            }
        }
    }, {
        id: 17300833,
        name: 'Lommel SK vs. Club Brugge',
        homeId: 47905,
        awayId: 43747,
        score: [0, 1],
        liveTime: "87'",
        league: 'Pro League • Belgique',
        status: 1,
        markets: {
            '1x2': {
                label: '1x2',
                odds: [
                    { label: '1', price: 101, competitorId: 47905 },
                    { label: 'X', price: 8.5 },
                    { label: '2', price: 1.0667, competitorId: 43747 }
                ]
            }
        }
    }, {
        id: 17467156,
        name: 'FC Porto vs. Moreirense',
        homeId: 43772,
        awayId: 47107,
        score: [1, 1],
        liveTime: "52'",
        league: 'Primeira Liga • Portugal',
        status: 1,
        markets: {
            '1x2': {
                label: '1x2',
                odds: [
                    { label: '1', price: 1.3847, competitorId: 43772 },
                    { label: 'X', price: 3.45 },
                    { label: '2', price: 18, competitorId: 47107 }
                ]
            }
        }
    }];

    // ===================================================================
    // RENDU
    // ===================================================================

    const app = document.getElementById('matches-list');
    const betSlip = document.getElementById('betSlip');
    const slipItems = document.getElementById('slipItems');
    const slipCount = document.getElementById('slipCount');
    const stakeInput = document.getElementById('stakeInput');
    const potentialWin = document.getElementById('potentialWin');
    const placeBtn = document.getElementById('placeBetBtn');

    let selectedBets = []; // { matchId, marketKey, oddIndex, label, price }

    function renderMatches() {
        let html = '';
        matches.forEach(match => {
            const home = competitors[match.homeId]?.name || 'Home';
            const away = competitors[match.awayId]?.name || 'Away';
            const homeAbbr = competitors[match.homeId]?.abbr || '';
            const awayAbbr = competitors[match.awayId]?.abbr || '';
            const scoreStr = match.score.join(' : ');
            const market = match.markets['1x2'];
            const odds = market.odds;

            html += `
                <div class="match-card" data-matchid="${match.id}">
                    <div class="match-header">
                        <div class="match-league">
                            <span class="flag"></span>
                            ${match.league}
                        </div>
                        <span class="match-live">EN DIRECT</span>
                    </div>
                    <div class="match-teams">
                        <div class="team">${home}</div>
                        <div class="match-score">${scoreStr}</div>
                        <div class="team team-away">${away}</div>
                    </div>
                    <div class="match-time">${match.liveTime}</div>
                    <div class="odds-row">
                        ${odds.map((odd, idx) => `
                            <div class="odd-btn" data-match="${match.id}" data-market="1x2" data-index="${idx}" data-price="${odd.price}" data-label="${odd.label}">
                                <span class="label">${odd.label}</span>
                                <span class="price">${odd.price}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="match-detail" id="detail-${match.id}">
                        ${Object.keys(match.markets).filter(k => k !== '1x2').map(key => {
                            const m = match.markets[key];
                            return `
                                <div class="market-group">
                                    <div class="market-title">${m.label}</div>
                                    <div class="market-odds">
                                        ${m.odds.map((odd, idx) => `
                                            <div class="market-odd" data-match="${match.id}" data-market="${key}" data-index="${idx}" data-price="${odd.price}" data-label="${odd.label}">
                                                <span class="m-label">${odd.label}</span>
                                                <span class="m-price">${odd.price}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        });
        app.innerHTML = html;

        // Événements pour ouvrir/fermer les détails
        document.querySelectorAll('.match-card').forEach(card => {
            card.addEventListener('click', function(e) {
                // Ignorer si on a cliqué sur un bouton de cote
                if (e.target.closest('.odd-btn') || e.target.closest('.market-odd')) return;
                const detail = this.querySelector('.match-detail');
                detail.classList.toggle('open');
            });
        });

        // Événements pour ajouter aux paris (odds principaux)
        document.querySelectorAll('.odd-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const matchId = parseInt(this.dataset.match);
                const marketKey = this.dataset.market;
                const idx = parseInt(this.dataset.index);
                const price = parseFloat(this.dataset.price);
                const label = this.dataset.label;
                toggleBet(matchId, marketKey, idx, label, price, this);
            });
        });

        // Événements pour marchés secondaires
        document.querySelectorAll('.market-odd').forEach(el => {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                const matchId = parseInt(this.dataset.match);
                const marketKey = this.dataset.market;
                const idx = parseInt(this.dataset.index);
                const price = parseFloat(this.dataset.price);
                const label = this.dataset.label;
                toggleBet(matchId, marketKey, idx, label, price, this);
            });
        });
    }

    function toggleBet(matchId, marketKey, idx, label, price, element) {
        const betKey = `${matchId}-${marketKey}-${idx}`;
        const existing = selectedBets.find(b => b.key === betKey);
        if (existing) {
            // Retirer
            selectedBets = selectedBets.filter(b => b.key !== betKey);
            element.classList.remove('selected');
        } else {
            // Ajouter
            selectedBets.push({
                key: betKey,
                matchId,
                marketKey,
                idx,
                label,
                price
            });
            element.classList.add('selected');
        }
        updateSlip();
    }

    function updateSlip() {
        if (selectedBets.length === 0) {
            betSlip.classList.add('hidden');
            return;
        }
        betSlip.classList.remove('hidden');
        slipCount.textContent = `${selectedBets.length} sélection`;

        let itemsHtml = '';
        selectedBets.forEach(b => {
            const match = matches.find(m => m.id === b.matchId);
            const home = competitors[match.homeId]?.abbr || '';
            const away = competitors[match.awayId]?.abbr || '';
            const matchName = `${home} vs ${away}`;
            itemsHtml += `
                <div class="bet-slip-item">
                    <span>${matchName} - ${b.label} @ ${b.price}</span>
                    <span class="remove" data-key="${b.key}">✕</span>
                </div>
            `;
        });
        slipItems.innerHTML = itemsHtml;

        // Supprimer un pari
        document.querySelectorAll('.bet-slip-item .remove').forEach(btn => {
            btn.addEventListener('click', function() {
                const key = this.dataset.key;
                const bet = selectedBets.find(b => b.key === key);
                if (bet) {
                    // Retirer la classe selected du bouton correspondant
                    const selector = `.odd-btn[data-match="${bet.matchId}"][data-market="${bet.marketKey}"][data-index="${bet.idx}"]`;
                    document.querySelector(selector)?.classList.remove('selected');
                    const selector2 = `.market-odd[data-match="${bet.matchId}"][data-market="${bet.marketKey}"][data-index="${bet.idx}"]`;
                    document.querySelector(selector2)?.classList.remove('selected');
                }
                selectedBets = selectedBets.filter(b => b.key !== key);
                updateSlip();
            });
        });

        // Calcul du gain potentiel
        calculatePotential();
    }

    function calculatePotential() {
        const stake = parseFloat(stakeInput.value) || 0;
        if (selectedBets.length === 0 || stake <= 0) {
            potentialWin.textContent = '0.00';
            return;
        }
        // Pour simplifier, on combine les cotes (multiplication)
        let totalOdds = 1;
        selectedBets.forEach(b => { totalOdds *= b.price; });
        const win = stake * totalOdds;
        potentialWin.textContent = win.toFixed(2);
    }

    stakeInput.addEventListener('input', calculatePotential);

    placeBtn.addEventListener('click', function() {
        if (selectedBets.length === 0) {
            alert('Ajoutez au moins un pari');
            return;
        }
        const stake = parseFloat(stakeInput.value) || 0;
        if (stake <= 0) {
            alert('Mise invalide');
            return;
        }
        const totalWin = parseFloat(potentialWin.textContent);
        alert(`Pari placé !\nMise: ${stake}\nGain potentiel: ${totalWin}\n\n(Simulation)`);
        // Réinitialiser
        selectedBets = [];
        document.querySelectorAll('.odd-btn.selected, .market-odd.selected').forEach(el => el.classList.remove('selected'));
        updateSlip();
    });

    // Lancer
    renderMatches();
</script>

</body>
    </html>
