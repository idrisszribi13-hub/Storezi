<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مباريات Camel Live - متكاملة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #f0f6fc;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 15px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 24px;
        }
        .header .update-info {
            color: #8b949e;
            font-size: 14px;
        }
        .header .update-info .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #f85149;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
        }
        .tabs button {
            background: transparent;
            border: none;
            color: #8b949e;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tabs button:hover {
            color: #f0f6fc;
            background: #1c2128;
        }
        .tabs button.active {
            color: #58a6ff;
            background: rgba(88, 166, 255, 0.1);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title .badge {
            font-size: 14px;
            background: #f85149;
            padding: 2px 12px;
            border-radius: 20px;
            color: #fff;
        }
        .section-title .badge.blue {
            background: #1f6feb;
        }
        .section-title .badge.gray {
            background: #30363d;
        }
        .competition-block {
            background: #161b22;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #30363d;
        }
        .competition-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .competition-name img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: contain;
        }
        .match-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d1117;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid transparent;
            flex-wrap: wrap;
            gap: 10px;
            transition: 0.2s;
        }
        .match-item:hover {
            background: #1c2128;
        }
        .match-item.live {
            border-left-color: #f85149;
        }
        .match-item.finished {
            border-left-color: #8b949e;
            opacity: 0.7;
        }
        .match-teams {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 150px;
        }
        .match-teams .team {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .match-teams .team img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: contain;
            background: rgba(255,255,255,0.05);
        }
        .match-teams .vs {
            color: #8b949e;
            font-size: 12px;
            margin: 0 4px;
        }
        .match-score {
            font-weight: 700;
            font-size: 18px;
            min-width: 60px;
            text-align: center;
            color: #f0f6fc;
        }
        .match-score .live-badge {
            font-size: 11px;
            background: #f85149;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 600;
        }
        .match-status {
            font-size: 12px;
            color: #8b949e;
            min-width: 60px;
            text-align: right;
        }
        .match-status .has-stream {
            color: #58a6ff;
            font-weight: 600;
        }
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #8b949e;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg {
            text-align: center;
            padding: 30px;
            color: #f85149;
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #f85149;
        }
        .league-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .league-selector button {
            background: #161b22;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }
        .league-selector button:hover {
            border-color: #58a6ff;
            color: #f0f6fc;
        }
        .league-selector button.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
        }
        .news-item {
            background: #161b22;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-left: 3px solid #1f6feb;
        }
        .news-item .title {
            font-weight: 600;
            font-size: 16px;
        }
        .news-item .desc {
            color: #8b949e;
            font-size: 14px;
            margin-top: 4px;
        }
        @media (max-width: 600px) {
            .match-item {
                flex-direction: column;
                align-items: stretch;
            }
            .match-teams {
                justify-content: space-between;
            }
            .match-score {
                text-align: center;
            }
            .match-status {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Camel Live - متكامل</h1>
            <div class="update-info">
                <span class="live-dot"></span>
                تحديث تلقائي كل <strong>30 ثانية</strong>
                <span id="lastUpdate" style="margin-left: 10px; color: #8b949e;"></span>
            </div>
        </div>

        <div class="tabs">
            <button class="active" data-tab="tab-home">🏠 الرئيسية</button>
            <button data-tab="tab-league">🏆 بطولات</button>
            <button data-tab="tab-news">📰 أخبار</button>
        </div>

        <!-- تبويب الرئيسية -->
        <div id="tab-home" class="tab-content active">
            <div id="home-content">
                <div class="loading"><div class="spinner"></div><div>جاري تحميل المباريات...</div></div>
            </div>
        </div>

        <!-- تبويب البطولات -->
        <div id="tab-league" class="tab-content">
            <div class="league-selector" id="leagueSelector">
                <button class="active" data-competition="vl7oqdehlyr510j">La Liga</button>
                <button data-competition="z8yomo4h7wq0j6l">UCL</button>
                <button data-competition="gpxwrxlhgpryk0j">Friendlies</button>
            </div>
            <div id="league-content">
                <div class="loading"><div class="spinner"></div><div>جاري تحميل المباريات...</div></div>
            </div>
        </div>

        <!-- تبويب الأخبار -->
        <div id="tab-news" class="tab-content">
            <div id="news-content">
                <div class="loading"><div class="spinner"></div><div>جاري تحميل الأخبار...</div></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const WORKER_URL = 'https://dry-truth-a84e.idriss-zribi13.workers.dev/';
            const API_BASE = 'https://api.cameltv.live/camel-service/ee/sports_live';

            // ========== دوال مساعدة ==========
            function getTodayStr() {
                const d = new Date();
                return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
            }

            async function fetchWithWorker(url) {
                const full = WORKER_URL + '?url=' + encodeURIComponent(url);
                const resp = await fetch(full);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return await resp.json();
            }

            function getScore(scores) {
                if (!scores || scores.length < 2) return '0 - 0';
                return `${scores[0] || 0} - ${scores[1] || 0}`;
            }

            function getStatus(statusId) {
                if (statusId === 2) return 'LIVE';
                if (statusId === 1) return 'Upcoming';
                return 'FT';
            }

            function getStatusClass(statusId) {
                if (statusId === 2) return 'live';
                if ([3,4,8].includes(statusId)) return 'finished';
                return '';
            }

            function renderMatches(matches, competition) {
                if (!matches || matches.length === 0) return '<p style="text-align:center;color:#8b949e;padding:20px;">لا توجد مباريات</p>';
                let html = `<div class="competition-block">
                            <div class="competition-name">
                                ${competition.logo ? `<img src="${competition.logo}" onerror="this.style.display='none'">` : ''}
                                ${competition.name || 'دوري'}
                            </div>`;
                matches.forEach(m => {
                    const home = m.home_team || {};
                    const away = m.away_team || {};
                    const score = getScore(m.home_scores);
                    const status = getStatus(m.status_id);
                    const statusClass = getStatusClass(m.status_id);
                    const hasStream = m.coverage?.has_stream === 1;
                    html += `<div class="match-item ${statusClass}">
                                <div class="match-teams">
                                    <div class="team">
                                        ${home.logo ? `<img src="${home.logo}" onerror="this.style.display='none'">` : ''}
                                        ${home.name || 'Home'}
                                    </div>
                                    <span class="vs">vs</span>
                                    <div class="team">
                                        ${away.logo ? `<img src="${away.logo}" onerror="this.style.display='none'">` : ''}
                                        ${away.name || 'Away'}
                                    </div>
                                </div>
                                <div class="match-score">
                                    ${score}
                                    ${status === 'LIVE' ? `<span class="live-badge">● LIVE</span>` : ''}
                                </div>
                                <div class="match-status">
                                    <div>${status}</div>
                                    ${hasStream ? `<span class="has-stream">🔴 بث مباشر</span>` : ''}
                                </div>
                            </div>`;
                });
                html += `</div>`;
                return html;
            }

            // ========== جلب المباريات اليومية (الصفحة الرئيسية) ==========
            async function fetchDailyMatches() {
                const container = document.getElementById('home-content');
                try {
                    const url = `${API_BASE}/home_match?day=${getTodayStr()}`;
                    const data = await fetchWithWorker(url);
                    if (data.status !== 200 || !data.data) throw new Error('استجابة غير صالحة');
                    const main = data.data;
                    let html = '';
                    // living_group
                    if (main.living_group && main.living_group.length) {
                        main.living_group.forEach(g => {
                            html += renderMatches(g.match, g.competition);
                        });
                    }
                    // hot_group
                    if (main.hot_group && main.hot_group.length) {
                        main.hot_group.forEach(g => {
                            html += renderMatches(g.match, g.competition);
                        });
                    }
                    // other_group
                    if (main.other_group && main.other_group.length) {
                        main.other_group.forEach(g => {
                            html += renderMatches(g.match, g.competition);
                        });
                    }
                    if (!html) html = '<p style="text-align:center;color:#8b949e;padding:30px;">لا توجد مباريات اليوم</p>';
                    container.innerHTML = html;
                } catch (e) {
                    container.innerHTML = `<div class="error-msg">⚠️ فشل تحميل المباريات: ${e.message}</div>`;
                }
            }

            // ========== جلب مباريات بطولة معينة ==========
            async function fetchLeagueMatches(competitionId) {
                const container = document.getElementById('league-content');
                try {
                    // أولاً نأخذ معلومات البطولة
                    const compUrl = `${API_BASE}/get_competition_by_name?name=${competitionId}`;
                    // لكن competitionId هنا هو id وليس اسم، لذا نستخدم طريقة مختلفة: نستخدم معرف البطولة مباشرة
                    // نحتاج إلى استدعاء API المباريات باستخدام competitionId
                    const now = Math.floor(Date.now() / 1000);
                    const start = now - 30*24*3600; // 30 يوم
                    const end = now + 30*24*3600;
                    const matchUrl = `${API_BASE}/football/season/match?autoload=false&competitionId=${competitionId}&keyWord=loadSeasonMatch&page=1&size=20&matchTimeStart=${start}&matchTimeEnd=${end}`;
                    const data = await fetchWithWorker(matchUrl);
                    if (data.status !== 200 || !data.data) throw new Error('لا توجد بيانات');
                    const results = data.data.results || [];
                    // جلب معلومات البطولة للعرض
                    const compInfoUrl = `${API_BASE}/get_competition_by_name?name=${competitionId}`;
                    let competition = { name: competitionId, logo: '' };
                    try {
                        const compData = await fetchWithWorker(compInfoUrl);
                        if (compData.status === 200 && compData.data) {
                            competition = compData.data;
                        }
                    } catch(e) {}

                    let html = '';
                    if (results.length === 0) {
                        html = '<p style="text-align:center;color:#8b949e;padding:20px;">لا توجد مباريات لهذه البطولة</p>';
                    } else {
                        html = renderMatches(results, competition);
                    }
                    container.innerHTML = html;
                } catch (e) {
                    container.innerHTML = `<div class="error-msg">⚠️ فشل تحميل مباريات البطولة: ${e.message}</div>`;
                }
            }

            // ========== جلب الأخبار ==========
            async function fetchNews() {
                const container = document.getElementById('news-content');
                try {
                    const url = `${API_BASE}/news_kind/list`;
                    const data = await fetchWithWorker(url);
                    if (data.status !== 200 || !data.data) throw new Error('لا توجد أخبار');
                    // نأخذ أول 5 أنواع أخبار
                    const kinds = data.data.slice(0,5);
                    let html = '';
                    kinds.forEach(k => {
                        html += `<div class="news-item">
                                    <div class="title">${k.arName || k.innerName}</div>
                                    <div class="desc">${k.enName || ''}</div>
                                </div>`;
                    });
                    if (!html) html = '<p style="text-align:center;color:#8b949e;padding:20px;">لا توجد أخبار</p>';
                    container.innerHTML = html;
                } catch (e) {
                    container.innerHTML = `<div class="error-msg">⚠️ فشل تحميل الأخبار: ${e.message}</div>`;
                }
            }

            // ========== التحديث التلقائي ==========
            let intervalId = null;

            function startAutoRefresh() {
                // تحميل كل شيء أول مرة
                fetchDailyMatches();
                fetchLeagueMatches('vl7oqdehlyr510j'); // الافتراضي
                fetchNews();

                if (intervalId) clearInterval(intervalId);
                intervalId = setInterval(() => {
                    const activeTab = document.querySelector('.tab-content.active');
                    if (activeTab.id === 'tab-home') {
                        fetchDailyMatches();
                    } else if (activeTab.id === 'tab-league') {
                        const activeBtn = document.querySelector('#leagueSelector .active');
                        if (activeBtn) fetchLeagueMatches(activeBtn.dataset.competition);
                    } else if (activeTab.id === 'tab-news') {
                        fetchNews();
                    }
                    document.getElementById('lastUpdate').textContent = `آخر تحديث: ${new Date().toLocaleTimeString('ar-EG')}`;
                }, 30000);
            }

            // ========== أحداث التبويبات ==========
            document.querySelectorAll('.tabs button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    document.getElementById(this.dataset.tab).classList.add('active');
                });
            });

            // ========== أحداث اختيار البطولة ==========
            document.querySelectorAll('#leagueSelector button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#leagueSelector button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    fetchLeagueMatches(this.dataset.competition);
                });
            });

            // ========== بدء التشغيل ==========
            document.addEventListener('DOMContentLoaded', startAutoRefresh);
        })();
    </script>
</body>
    </html>
