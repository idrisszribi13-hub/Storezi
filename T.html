<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مباريات Camel Live - تحديث تلقائي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #f0f6fc;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 15px;
        }
        .header h1 {
            color: #58a6ff;
            font-size: 24px;
        }
        .header .update-info {
            color: #8b949e;
            font-size: 14px;
        }
        .header .update-info .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #f85149;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title .badge {
            font-size: 14px;
            background: #f85149;
            padding: 2px 12px;
            border-radius: 20px;
            color: #fff;
        }
        .section-title .badge.blue {
            background: #1f6feb;
        }
        .section-title .badge.gray {
            background: #30363d;
        }
        .competition-block {
            background: #161b22;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #30363d;
        }
        .competition-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .competition-name img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: contain;
        }
        .match-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d1117;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid transparent;
            flex-wrap: wrap;
            gap: 10px;
            transition: 0.2s;
        }
        .match-item:hover {
            background: #1c2128;
        }
        .match-item.live {
            border-left-color: #f85149;
        }
        .match-item.finished {
            border-left-color: #8b949e;
            opacity: 0.7;
        }
        .match-teams {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 150px;
        }
        .match-teams .team {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .match-teams .team img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: contain;
            background: rgba(255,255,255,0.05);
        }
        .match-teams .vs {
            color: #8b949e;
            font-size: 12px;
            margin: 0 4px;
        }
        .match-score {
            font-weight: 700;
            font-size: 18px;
            min-width: 60px;
            text-align: center;
            color: #f0f6fc;
        }
        .match-score .live-badge {
            font-size: 11px;
            background: #f85149;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 600;
        }
        .match-status {
            font-size: 12px;
            color: #8b949e;
            min-width: 60px;
            text-align: right;
        }
        .match-status .has-stream {
            color: #58a6ff;
            font-weight: 600;
        }
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #8b949e;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg {
            text-align: center;
            padding: 30px;
            color: #f85149;
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #f85149;
        }
        @media (max-width: 600px) {
            .match-item {
                flex-direction: column;
                align-items: stretch;
            }
            .match-teams {
                justify-content: space-between;
            }
            .match-score {
                text-align: center;
            }
            .match-status {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 مباريات اليوم (Camel Live)</h1>
            <div class="update-info">
                <span class="live-dot"></span>
                يتم التحديث تلقائياً كل <strong>30 ثانية</strong>
                <span id="lastUpdate" style="margin-left: 10px; color: #8b949e;"></span>
            </div>
        </div>

        <div id="app">
            <div class="loading">
                <div class="spinner"></div>
                <div>جاري تحميل المباريات من Camel Live...</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ==================== الإعدادات ====================
            const WORKER_URL = 'https://dry-truth-a84e.idriss-zribi13.workers.dev/';
            // رابط Camel Live API مع تاريخ اليوم
            function getApiUrl() {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const dateStr = `${year}${month}${day}`;
                return `https://api.cameltv.live/camel-service/ee/sports_live/home_match?day=${dateStr}`;
            }

            // ==================== دوال العرض ====================
            function getScore(scores) {
                if (!scores || scores.length === 0) return '0 - 0';
                // نأخذ أول قيمتين (الشوط الأول / النتيجة الحالية)
                return `${scores[0] || 0} - ${scores[1] || 0}`;
            }

            function getStatus(statusId) {
                // حسب ملاحظتي من البيانات: 1 = لم تبدأ, 2 = حية, 3,4,8 = منتهية
                if (statusId === 2) return 'LIVE';
                if (statusId === 1) return 'Upcoming';
                return 'FT';
            }

            function getStatusClass(statusId) {
                if (statusId === 2) return 'live';
                if (statusId === 3 || statusId === 4 || statusId === 8) return 'finished';
                return '';
            }

            function renderGroup(group, title, badgeClass = '') {
                if (!group || group.length === 0) return '';
                let html = `<div class="section">
                            <div class="section-title">${title} <span class="badge ${badgeClass}">${group.length}</span></div>`;
                group.forEach(item => {
                    const comp = item.competition || {};
                    const matches = item.match || [];
                    html += `<div class="competition-block">
                                <div class="competition-name">
                                    ${comp.logo ? `<img src="${comp.logo}" onerror="this.style.display='none'">` : ''}
                                    ${comp.name || 'دوري غير معروف'}
                                </div>`;
                    matches.forEach(m => {
                        const home = m.home_team || {};
                        const away = m.away_team || {};
                        const score = getScore(m.home_scores);
                        const status = getStatus(m.status_id);
                        const statusClass = getStatusClass(m.status_id);
                        const hasStream = m.coverage?.has_stream === 1;
                        html += `<div class="match-item ${statusClass}">
                                    <div class="match-teams">
                                        <div class="team">
                                            ${home.logo ? `<img src="${home.logo}" onerror="this.style.display='none'">` : ''}
                                            ${home.name || 'Home'}
                                        </div>
                                        <span class="vs">vs</span>
                                        <div class="team">
                                            ${away.logo ? `<img src="${away.logo}" onerror="this.style.display='none'">` : ''}
                                            ${away.name || 'Away'}
                                        </div>
                                    </div>
                                    <div class="match-score">
                                        ${score}
                                        ${status === 'LIVE' ? `<span class="live-badge">● LIVE</span>` : ''}
                                    </div>
                                    <div class="match-status">
                                        <div>${status}</div>
                                        ${hasStream ? `<span class="has-stream">🔴 بث مباشر</span>` : ''}
                                    </div>
                                </div>`;
                    });
                    html += `</div>`;
                });
                html += `</div>`;
                return html;
            }

            function renderError(message) {
                document.getElementById('app').innerHTML = `
                    <div class="error-msg">
                        ⚠️ فشل تحميل المباريات: ${message}
                        <br><br>
                        <button onclick="fetchMatches()" style="background:#1f6feb;border:none;color:#fff;padding:8px 20px;border-radius:6px;cursor:pointer;font-weight:600;">إعادة المحاولة</button>
                    </div>
                `;
            }

            function renderLoading() {
                document.getElementById('app').innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <div>جاري تحميل المباريات...</div>
                    </div>
                `;
            }

            // ==================== دالة جلب البيانات ====================
            async function fetchMatches() {
                const app = document.getElementById('app');
                const lastUpdateSpan = document.getElementById('lastUpdate');

                // إظهار حالة التحميل إذا كانت المرة الأولى
                if (!app.querySelector('.match-item') && !app.querySelector('.error-msg')) {
                    renderLoading();
                }

                try {
                    const apiUrl = getApiUrl();
                    // استخدام الـ Worker لتجاوز CORS
                    const fullUrl = WORKER_URL + '?url=' + encodeURIComponent(apiUrl);

                    const response = await fetch(fullUrl);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    console.log('✅ تم جلب البيانات بنجاح:', data);

                    // التحقق من صحة البيانات
                    if (data.status !== 200 || !data.data) {
                        throw new Error('استجابة غير صالحة من الخادم');
                    }

                    const mainData = data.data;
                    const living = mainData.living_group || [];
                    const hot = mainData.hot_group || [];
                    const other = mainData.other_group || [];

                    // بناء HTML
                    let html = '';
                    html += renderGroup(living, '🔴 المباريات الحية (Living)', '');
                    html += renderGroup(hot, '⭐ المباريات الساخنة (Hot)', 'blue');
                    html += renderGroup(other, '📋 مباريات أخرى (Other)', 'gray');

                    if (!html) {
                        html = '<p style="text-align:center; color:#8b949e; padding:40px;">لا توجد مباريات اليوم</p>';
                    }

                    app.innerHTML = html;

                    // تحديث وقت آخر تحديث
                    const now = new Date();
                    lastUpdateSpan.textContent = `آخر تحديث: ${now.toLocaleTimeString('ar-EG')}`;

                } catch (error) {
                    console.error('❌ خطأ في الجلب:', error);
                    renderError(error.message);
                }
            }

            // ==================== التحديث التلقائي ====================
            let intervalId = null;

            function startAutoRefresh() {
                // جلب فوري عند التحميل
                fetchMatches();

                // ثم كل 30 ثانية
                if (intervalId) clearInterval(intervalId);
                intervalId = setInterval(fetchMatches, 30000);
            }

            // ==================== بدء التشغيل ====================
            document.addEventListener('DOMContentLoaded', startAutoRefresh);

            // إتاحة دالة fetchMatches عالمياً للزر
            window.fetchMatches = fetchMatches;

        })();
    </script>

</body>
</html>
