<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل القنوات الرياضية</title>
    <!-- استدعاء مكتبة hls.js لتشغيل روابط m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00d2ff;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .channels-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 800px;
        }
        button {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #00d2ff;
            color: #000;
            border-color: #00d2ff;
        }
        .active-channel {
            background-color: #00d2ff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📺 مشغل القنوات الرياضية</h1>

    <div class="player-container">
        <video id="video" controls autoplay></video>
    </div>

    <div class="channels-container" id="buttons">
        <button onclick="playStream('https://app.site2026.top/mobile/FMrKoVYmHLopjZI06fjsjA/1787174639/1787174378/1/thman1.m3u8', this)">Thamania 1</button>
        <button onclick="playStream('https://app.site2026.top/mobile/FMrKoVYmHLopjZI06fjsjA/1787174639/1787174378/1/on11.m3u8', this)">ON Time</button>
        <button onclick="playStream('https://app.site2026.top/mobile/FMrKoVYmHLopjZI06fjsjA/1787174639/1787174378/1/bein202.m3u8', this)">beIN Sports 2</button>
        <button onclick="playStream('https://app.site2026.top/mobile/FMrKoVYmHLopjZI06fjsjA/1787174639/1787174378/1/multi-03.m3u8', this)">Multi 3</button>
        <button onclick="playStream('https://app.site2026.top/mobile/FMrKoVYmHLopjZI06fjsjA/1787174639/1787174378/1/multi-04.m3u8', this)">Multi 4</button>
    </div>

    <script>
        var video = document.getElementById('video');
        var hls;

        function playStream(url, buttonElement) {
            // إزالة التنسيق من الزر السابق
            var buttons = document.querySelectorAll('button');
            buttons.forEach(btn => btn.classList.remove('active-channel'));
            
            // إضافة التنسيق للزر الحالي
            if (buttonElement) {
                buttonElement.classList.add('active-channel');
            }

            // تدمير المشغل القديم إن وجد لتجنب التداخل
            if (hls) {
                hls.destroy();
            }

            // التحقق من دعم المتصفح لمكتبة HLS.js
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            }
            // دعم متصفح سفاري (Safari) الذي يدعم HLS بشكل افتراضي
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>

</body>
</html>
