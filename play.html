        // ============================================================
        //  EVENTS
        // ============================================================
        function renderEventsFixed(events, info) {
            if (!events || !events.length) return '<p class="text-center text-muted">No events recorded</p>';
            const homeId = info.home_team.row_id,
                awayId = info.away_team.row_id;
            const special = events.filter(ev => ev.type === 100);
            const normal = events.filter(ev => ev.type !== 100);
            normal.sort((a, b) => (a.time_minute || 0) - (b.time_minute || 0) || ((a.time_plus || 0) - (b.time_plus || 0)));

            const first = normal.filter(e => (e.time_minute || 0) <= 45);
            const second = normal.filter(e => (e.time_minute || 0) > 45 && (e.time_minute || 0) <= 90);
            const et1 = normal.filter(e => (e.time_minute || 0) > 90 && (e.time_minute || 0) <= 105);
            const et2 = normal.filter(e => (e.time_minute || 0) > 105 && (e.time_minute || 0) <= 120);
            const pen = normal.filter(e => (e.time_minute || 0) > 120);

            const kickOff = special.find(ev => ev.status === 1);
            const halfTime = special.find(ev => ev.status === 2);
            const fullTime = special.find(ev => ev.status === 3);
            const etHalf = special.find(ev => ev.status === 5);
            const etFull = special.find(ev => ev.status === 7);
            const etStart1 = special.find(ev => ev.status === 8);
            const etStart2 = special.find(ev => ev.status === 9);
            const penStart = special.find(ev => ev.status === 10);

            let html = '<div class="event-box">';

            function renderGroup(list, divider) {
                let g = '';
                list.forEach(ev => { g += renderSingleEvent(ev, info, homeId, awayId); });
                return g ? g + divider : '';
            }

            let all = '';
            if (penStart) {
                let hP = 0,
                    aP = 0;
                if (info.match_penalties) {
                    hP = info.match_penalties[homeId] ? info.match_penalties[homeId].filter(p => p.score === 1).length : 0;
                    aP = info.match_penalties[awayId] ? info.match_penalties[awayId].filter(p => p.score === 1).length : 0;
                }
                all +=
                    `<div class="fulltime-divider penalty">⚽ Penalty Shootout (${hP} - ${aP})</div>`;
                all += renderGroup(pen, '');
            }
            if (etStart2 || etFull) {
                let hE = 0,
                    aE = 0;
                if (info.se_scores && info.se_scores.length && info.se_scores[0]) {
                    hE = parseInt(info.se_scores[0].home_scores) || 0;
                    aE = parseInt(info.se_scores[0].away_scores) || 0;
                }
                all +=
                    `<div class="halftime-divider" style="background:#fff8e1;border-color:#ffc107;">⏱️ <span class="ht-score">${hE} - ${aE}</span><br />Second Half ET</div>`;
                all += renderGroup(et2, '');
            }
            if (etStart1 || etHalf) {
                let hE = 0,
                    aE = 0;
                if (info.fe_scores && info.fe_scores.length && info.fe_scores[0]) {
                    hE = parseInt(info.fe_scores[0].home_scores) || 0;
                    aE = parseInt(info.fe_scores[0].away_scores) || 0;
                }
                all +=
                    `<div class="halftime-divider" style="background:#fff8e1;border-color:#ffc107;">⏱️ <span class="ht-score">${hE} - ${aE}</span><br />First Half ET</div>`;
                all += renderGroup(et1, '');
            }
            if (fullTime) all += `<div class="fulltime-divider">🔚 Full-Time</div>`;
            all += renderGroup(second, '');
            if (halfTime) {
                let hH = 0,
                    aH = 0;
                if (info.fh_scores && info.fh_scores.length && info.fh_scores[0]) {
                    hH = parseInt(info.fh_scores[0].home_scores) || 0;
                    aH = parseInt(info.fh_scores[0].away_scores) || 0;
                }
                all +=
                    `<div class="halftime-divider">⏱️ <span class="ht-score">${hH} - ${aH}</span><br />Half Time</div>`;
            }
            all += renderGroup(first, '');
            if (kickOff) all += `<div class="fulltime-divider">🔊 Kick-Off</div>`;

            html += all + '</div>';
            return html;
        }

        function renderSingleEvent(ev, info, homeId, awayId) {
            const isHome = ev.team_id == homeId,
                isAway = ev.team_id == awayId;
            let left = '',
                right = '';
            if (isHome) left =
                `<div class="event-side event-side-left"><img src="${IMG_BASE_TEAM + info.home_team.image}" onclick="openTeamModal(${info.home_team.row_id})" /></div>`;
            else if (isAway) right =
                `<div class="event-side event-side-right"><img src="${IMG_BASE_TEAM + info.away_team.image}" onclick="openTeamModal(${info.away_team.row_id})" /></div>`;

            let icon = '⚽',
                typeText = '';
            let videoBtn = '';
            if (ev.event_video) videoBtn =
                `<a href="${ev.event_video}" target="_blank" class="ms-1" style="cursor:pointer;">🎬</a>`;

            if (ev.type === 1 || ev.type === 13) { icon = '⚽';
                typeText = ev.status_name || 'Goal'; } else if (ev.type === 2 || ev.type === 3) { icon = '🟨';
                typeText = 'Yellow Card'; } else if (ev.type === 6 || ev.type === 4) { icon = '🟥';
                typeText = 'Red Card'; } else if (ev.type === 5) { icon = '⚽';
                typeText = 'Penalty Scored'; } else if (ev.type === 8) { icon = '🔄';
                typeText = 'Substitution'; } else if (ev.type === 21) { icon = '❌';
                typeText = 'Missed Chance'; } else if (ev.type === 22) { icon = '💥';
                typeText = 'Crossbar'; } else if (ev.type === 7) { icon = '🚩';
                typeText = 'Offside'; } else if (ev.type === 9) { icon = '⚠️';
                typeText = 'Foul'; } else if (ev.type === 10) { icon = '⚽';
                typeText = 'Own Goal'; } else if (ev.type === 11) { icon = '❌';
                typeText = 'Penalty Missed'; } else if (ev.type === 12) { icon = '🧤';
                typeText = 'Penalty Saved'; } else if (ev.type === 14) { icon = '🎯';
                typeText = 'Shot Off Target'; } else if (ev.type === 15) { icon = '🎯';
                typeText = 'Shot On Target'; } else { icon = '📌';
                typeText = ev.status_name || 'Event'; }

            let playerHtml = '',
                subHtml = '';
            if (ev.type === 8) {
                const out = ev.assist_player_name ? ev.assist_player_name.title : '';
                const inn = ev.player_name ? ev.player_name.title : '';
                playerHtml =
                    `<span class="in-arrow">▶</span> <span class="player-name-click" onclick="openPlayerModal(${ev.player.row_id})">${inn}</span>`;
                subHtml =
                    `<span class="out-arrow">◀</span> <span class="player-name-click" onclick="openPlayerModal(${ev.assist_player.row_id})">${out}</span>`;
            } else {
                const name = ev.player_name ? ev.player_name.title : '';
                playerHtml =
                    `<span class="player-name-click" onclick="openPlayerModal(${ev.player?.row_id})">${name || typeText}</span>`;
                subHtml = ev.assist_player_name ? `<span>Assist: ${ev.assist_player_name.title}</span>` : '';
            }

            const min = ev.time_minute || 0;
            let periodLabel = '';
            if (min > 90 && min <= 105) periodLabel = 'ET1';
            else if (min > 105 && min <= 120) periodLabel = 'ET2';
            else if (min > 120) periodLabel = 'PEN';
            const plus = ev.time_plus && ev.time_plus > 0 ? `+${ev.time_plus}` : '';

            let bg = '#e8f5e9',
                color = '#2e7d32';
            if (ev.type === 2 || ev.type === 3) { bg = '#fff3e0';
                color = '#e65100'; }
            if (ev.type === 6 || ev.type === 4) { bg = '#fce4ec';
                color = '#c62828'; }
            if (ev.type === 1 || ev.type === 5 || ev.type === 13) { bg = '#e3f2fd';
                color = '#0d47a1'; }
            if (ev.type === 8) { bg = '#f3e5f5';
                color = '#4a148c'; }
            if (periodLabel === 'ET1' || periodLabel === 'ET2') { bg = '#fff8e1';
                color = '#f57f17'; }
            if (periodLabel === 'PEN') { bg = '#fce4ec';
                color = '#c62828'; }

            return `
            <div class="event-row">
                ${left}
                <div class="event-time-cell">
                    <div class="event-time-circle" style="background:${bg};color:${color};">
                        ${plus ? `<span class="time-extra">${plus}</span>` : ''}
                        <span class="time-main">${min}'</span>
                        ${periodLabel ? `<span class="time-period">${periodLabel}</span>` : ''}
                    </div>
                </div>
                <div class="event-info-center">
                    <div class="event-player">
                        <span>${icon}</span>
                        ${playerHtml}
                        ${videoBtn}
                    </div>
                    ${subHtml ? `<div class="event-sub">${subHtml}</div>` : ''}
                </div>
                ${right}
            </div>`;
        }

        // ============================================================
        //  DETAILS TAB
        // ============================================================
        function renderDetailsTab(info, standingsData) {
            let html = '<div class="mt-2">';
            html +=
                `<div class="detail-card"><div class="detail-row"><strong>🏆 Competition</strong><span class="clickable-text" onclick="quickSelectChampionship('${info.championship?.url_id}','${(info.championship?.title||'').replace(/'/g,"\\'")}',${info.championship?.type||1})">${info.championship ? info.championship.title : 'N/A'}</span></div></div>`;
            html +=
                `<div class="detail-card"><div class="detail-row"><strong>📅 Round</strong><span>${info.round || 'N/A'}</span></div></div>`;
            html +=
                `<div class="detail-card"><div class="detail-row"><strong>🏟️ Stadium</strong><span>${info.Stadium || 'N/A'}</span></div></div>`;
            if (info.channel_commm && info.channel_commm.length) {
                info.channel_commm.forEach(c => {
                    html +=
                        `<div class="detail-card"><div class="detail-row"><strong>📺 Channel</strong><span>${c.channel_name}</span></div></div>`;
                    if (c.commentator_name) html +=
                        `<div class="detail-card"><div class="detail-row"><strong>🎙️ Commentator</strong><span>${c.commentator_name}</span></div></div>`;
                });
            }
            if (info.referees) {
                const ref = info.referees;
                html +=
                    `<div class="detail-card"><div class="detail-row"><strong>👨‍⚖️ Referee</strong><span class="clickable-text" onclick="openRefereeModal(${ref.id})">${ref.title}</span></div></div>`;
            }
            const dt = info.match_timestamp ? formatMatchLocalDateTime(info.match_timestamp) : (info.match_date + ' ' +
                info.match_time);
            html +=
                `<div class="detail-card"><div class="detail-row"><strong>⏰ Date & Time</strong><span>${dt}</span></div></div>`;
            if (info.return) html +=
                `<div class="detail-card"><div class="detail-row"><strong>Aggregate</strong><span>${info.return}</span></div></div>`;

            if (standingsData && standingsData.league && standingsData.league.stage0) {
                const teams = standingsData.league.stage0;
                const homeT = teams.find(t => t.team_id == info.home_team.row_id);
                const awayT = teams.find(t => t.team_id == info.away_team.row_id);
                if (homeT || awayT) {
                    html += '<div class="detail-card"><div class="detail-row"><strong>📊 League Position</strong></div>';
                    if (homeT) {
                        const rank = teams.indexOf(homeT) + 1;
                        html +=
                            `<div class="detail-row"><span>${info.home_team.title}</span><span>#${rank} | ${homeT.points} pts</span></div>`;
                    }
                    if (awayT) {
                        const rank = teams.indexOf(awayT) + 1;
                        html +=
                            `<div class="detail-row"><span>${info.away_team.title}</span><span>#${rank} | ${awayT.points} pts</span></div>`;
                    }
                    html += '</div>';
                }
            }
            html += '</div>';
            return html;
        }

        // ============================================================
        //  LINEUPS
        // ============================================================
        function renderLineups(info, lineups) {
            const homeLineup = lineups.lineup ? lineups.lineup[info.home_team.row_id] : null;
            const awayLineup = lineups.lineup ? lineups.lineup[info.away_team.row_id] : null;
            const homeCoach = lineups['0']?.home_coach;
            const awayCoach = lineups['0']?.away_coach;
            const injured = lineups.lineup_injureds || {};
            const homeInj = injured[info.home_team.row_id] || [];
            const awayInj = injured[info.away_team.row_id] || [];
            const homeForm = lineups['0']?.home_formation || '4-3-3';
            const awayForm = lineups['0']?.away_formation || '4-3-3';

            if (!homeLineup || !awayLineup) return '<p class="text-center text-muted">Lineups not available</p>';

            const homeHtml = renderPitch(info.home_team, homeLineup, homeForm, homeCoach, homeInj);
            const awayHtml = renderPitch(info.away_team, awayLineup, awayForm, awayCoach, awayInj);
            window.currentHomeLineupHtml = homeHtml;
            window.currentAwayLineupHtml = awayHtml;

            return `
            <div class="lineup-tabs">
                <button class="lineup-tab active" data-target="home">
                    <img src="${IMG_BASE_TEAM + info.home_team.image}" /> ${info.home_team.title}
                </button>
                <button class="lineup-tab" data-target="away">
                    ${info.away_team.title} <img src="${IMG_BASE_TEAM + info.away_team.image}" />
                </button>
            </div>
            <div id="lineup-content">${homeHtml}</div>`;
        }

        function renderPitch(team, lineupData, formation, coach, injured) {
            const players = lineupData.lineup || [];
            const subs = lineupData.substitutions || [];
            const groups = { 'G': [], 'D': [], 'M': [], 'F': [] };
            players.forEach(p => {
                const pos = p.position || 'M';
                if (groups[pos]) groups[pos].push(p);
                else groups['M'].push(p);
            });

            let html = `<div class="lineup-pitch">
                <div class="team-name">
                    <img src="${IMG_BASE_TEAM + team.image}" onclick="openTeamModal(${team.row_id})" />
                    ${team.title} <span class="formation-label">(${formation})</span>
                </div>
                <div class="lineup-row">${renderLineupPlayers(groups['G'])}</div>
                <div class="lineup-row">${renderLineupPlayers(groups['D'])}</div>
                <div class="lineup-row">${renderLineupPlayers(groups['M'])}</div>
                <div class="lineup-row">${renderLineupPlayers(groups['F'])}</div>
            </div>`;

            if (coach) {
                html += `<div class="coach-section">
                    <strong>👨‍🏫 Coach</strong>
                    <div class="coach-info">
                        <img src="${IMG_BASE_COACH + coach.image}" onclick="openCoachModal(${coach.id})" />
                        <span onclick="openCoachModal(${coach.id})">${coach.title}</span>
                    </div>
                </div>`;
            }

            if (injured && injured.length) {
                html += `<div class="absences-section">
                    <strong class="text-danger">🩹 Absences</strong>
                    <ul>${injured.map(inj => `
                        <li>
                            <img src="${IMG_BASE_PLAYER + inj.player.image}" onclick="openPlayerModal(${inj.player.row_id})" />
                            <span onclick="openPlayerModal(${inj.player.row_id})">${inj.player.title}</span>
                            <span class="text-muted ms-2">- ${inj.type_name || 'Unknown'}</span>
                        </li>`).join('')}</ul>
                </div>`;
            }

            if (subs.length) {
                html += `<div class="lineup-subs">
                    <h6>🔄 Substitutions</h6>
                    ${subs.map(sub => {
                        const inOut = sub.substitute_time ? `In ${sub.substitute_time}'` : 'On Bench';
                        const replaced = sub.player_lineup ? `<span class="sub-arrow">◀ ${sub.player_lineup.title || ''}</span>` : '';
                        return `<div class="sub-item">
                            <img src="${IMG_BASE_PLAYER + sub.player.image}" onclick="openPlayerModal(${sub.player.row_id})" />
                            <span>${sub.player.title}</span>
                            ${replaced ? `<span class="sub-arrow">${replaced}</span>` : ''}
                            <span class="sub-in-out">${inOut}</span>
                        </div>`;
                    }).join('')}
                </div>`;
            }

            return html;
        }

        function renderLineupPlayers(players) {
            return players.map(p => {
                let icons = '';
                if (p.yellow) icons += `<span class="icon-card icon-yellow">🟨</span>`;
                if (p.red) icons += `<span class="icon-card icon-red">🟥</span>`;
                if (p.goal) icons += `<span class="icon-card icon-goal">⚽</span>`;
                if (p.assist) icons += `<span class="icon-card icon-assist">🅰️</span>`;
                if (p.captain) icons += `<span class="icon-card icon-captain">C</span>`;

                return `<div class="lineup-player">
                    <div class="lineup-player-num">${p.player.player_number || ''}</div>
                    <img src="${IMG_BASE_PLAYER + p.player.image}" class="lineup-player-img" onclick="openPlayerModal(${p.player.row_id})" />
                    <div class="lineup-player-name" onclick="openPlayerModal(${p.player.row_id})">${p.player.title}</div>
                    ${p.rating ? `<div class="lineup-player-rate">${p.rating}</div>` : ''}
                    ${icons ? `<div class="lineup-player-icons">${icons}</div>` : ''}
                </div>`;
            }).join('');
        }

        // ============================================================
        //  STATISTICS
        // ============================================================
        function renderStats(info, stats) {
            if (!stats || !Object.keys(stats).length) return '<p class="text-center text-muted">No statistics available</p>';
            const home = stats[info.home_team.row_id] || {};
            const away = stats[info.away_team.row_id] || {};
            let html = '<div class="stats-title">📊 Statistics</div><div class="stats-container">';
            const hPos = parseInt(home.ball_possession || 0),
                aPos = parseInt(away.ball_possession || 0);
            html += `<div class="possession-box">
                <div class="possession-circle">${hPos}%</div>
                <div class="pos-split"><span>${info.home_team.title}</span><span>${info.away_team.title}</span></div>
            </div>`;

            const fields = [
                { key: 'total_shots', label: 'Total Shots' },
                { key: 'shots_on_goal', label: 'Shots On Target' },
                { key: 'shots_off_goal', label: 'Shots Off Target' },
                { key: 'shots_saved', label: 'Shots Saved' },
                { key: 'shots_insidebox', label: 'Shots Inside Box' },
                { key: 'shots_outsidebox', label: 'Shots Outside Box' },
                { key: 'goalkeeper_saves', label: 'Saves' },
                { key: 'cross_ball', label: 'Crosses' },
                { key: 'total_passes', label: 'Passes' },
                { key: 'passes_percentage', label: 'Pass Accuracy' },
                { key: 'fouls', label: 'Fouls' },
                { key: 'corner_kicks', label: 'Corners' },
                { key: 'offsides', label: 'Offsides' },
                { key: 'yellow_cards', label: 'Yellow Cards' },
                { key: 'red_cards', label: 'Red Cards' },
                { key: 'throwin', label: 'Throw-ins' },
                { key: 'goalkick', label: 'Goal Kicks' },
                { key: 'freekick', label: 'Free Kicks' }
            ];

            fields.forEach(f => {
                let hVal = parseInt(home[f.key] || 0),
                    aVal = parseInt(away[f.key] || 0);
                let max = Math.max(hVal, aVal);
                let hPct = max > 0 ? Math.round((hVal / max) * 100) : 50;
                let aPct = max > 0 ? Math.round((aVal / max) * 100) : 50;
                if (f.key === 'passes_percentage') {
                    hVal = hVal + '%';
                    aVal = aVal + '%';
                    hPct = parseInt(home[f.key] || 50);
                    aPct = parseInt(away[f.key] || 50);
                }
                html += `<div class="stat-row">
                    <div class="home-val">${hVal}</div>
                    <div class="stat-label">${f.label}</div>
                    <div class="away-val">${aVal}</div>
                </div>
                <div class="stat-line">
                    <div class="stat-line-home" style="width:${hPct}%"></div>
                    <div class="stat-line-away" style="width:${aPct}%"></div>
                </div>`;
            });

            html += '</div>';
            return html;
        }

        // ============================================================
        //  H2H
        // ============================================================
        function renderH2H(h2h, info) {
            if (!h2h || !Object.keys(h2h).length) return '<p class="text-center text-muted">No H2H data</p>';
            let hW = 0,
                d = 0,
                aW = 0;
            for (const id in h2h) {
                const m = h2h[id];
                if (m && m.win === 'win1') hW++;
                else if (m && m.win === 'win2') aW++;
                else if (m) d++;
            }
            let html = `<div class="h2h-flex">
                <div class="h2h-team">
                    <img src="${IMG_BASE_TEAM + info.home_team.image}" onclick="openTeamModal(${info.home_team.row_id})" />
                    <span onclick="openTeamModal(${info.home_team.row_id})">${info.home_team.title}</span>
                </div>
                <div class="h2h-center">
                    <div class="h2h-stat"><span class="num">${hW}</span><span class="lbl">Wins</span></div>
                    <div class="h2h-stat"><span class="num">${d}</span><span class="lbl">Draws</span></div>
                    <div class="h2h-stat"><span class="num">${aW}</span><span class="lbl">Wins</span></div>
                </div>
                <div class="h2h-team">
                    <img src="${IMG_BASE_TEAM + info.away_team.image}" onclick="openTeamModal(${info.away_team.row_id})" />
                    <span onclick="openTeamModal(${info.away_team.row_id})">${info.away_team.title}</span>
                </div>
            </div>`;

            const recent = Object.values(h2h).filter(m => m && m.home_team && m.away_team).slice(0, 5);
            if (recent.length) {
                html += '<div class="mt-3"><strong>Recent Meetings</strong><div class="small">';
                recent.forEach(m => {
                    const hT = m.home_team.title || 'Home',
                        aT = m.away_team.title || 'Away';
                    const hs = m.home_scores !== undefined ? m.home_scores : '?',
                        as = m.away_scores !== undefined ? m.away_scores : '?';
                    html +=
                        `<div class="d-flex justify-content-between border-bottom py-1"><span>${hT} ${hs} - ${as} ${aT}</span><span class="text-muted">${m.match_date || ''}</span></div>`;
                });
                html += '</div></div>';
            }
            return html;
        }

        // ============================================================
        //  MATCH STANDINGS (compact)
        // ============================================================
        function renderMatchStandings(standingsData, info) {
            if (!standingsData || !standingsData.league || !standingsData.league.stage0) {
                return '<p class="text-center text-muted">No standings data available.</p>';
            }
            const teams = standingsData.league.stage0;
            const colors = standingsData.color ? standingsData.color.stage0 : [];
            const rules = standingsData.rules_list ? standingsData.rules_list.stage0 : [];
            const homeId = info.home_team.row_id,
                awayId = info.away_team.row_id;

            let html =
                '<div class="standings-wrap"><h5 style="font-size:calc(13px*var(--font-scale));margin:6px 0;">📊 League Standings</h5>';
            html += '<table class="standings-table"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>';
            teams.forEach((team, idx) => {
                const ti = team.team_name;
                const isHome = ti.row_id == homeId,
                    isAway = ti.row_id == awayId;
                const cls = (isHome || isAway) ? 'highlight-row' : '';
                const color = team.color || '';
                const bar = color ? `<span class="color-bar" style="background:${color};"></span>` : '';
                html += `<tr class="${cls}">
                    <td class="pos">${idx+1}</td>
                    <td style="text-align:left;">
                        <div class="team-cell">
                            ${bar}
                            <img src="${IMG_BASE_TEAM + ti.image}" onclick="openTeamModal(${ti.row_id})" />
                            <span class="team-name" onclick="openTeamModal(${ti.row_id})">${ti.title}</span>
                        </div>
                    </td>
                    <td>${team.play}</td><td>${team.wins}</td><td>${team.draw}</td><td>${team.lose}</td>
                    <td>${team.for}</td><td>${team.against}</td><td>${team.diff}</td><td class="pts">${team.points}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';

            if (colors && colors.length) {
                html += '<div class="standings-key">';
                colors.forEach(c => {
                    if (c.color) {
                        const label = c.league_to || c.group_name || 'Qualification';
                        html +=
                            `<div class="key-item"><span class="color-box" style="background:${c.color};"></span> ${label}</div>`;
                    }
                });
                html += '</div>';
            }

            if (rules && rules.length) {
                html += '<div class="standings-rules"><strong>Rules</strong><ol>';
                rules.forEach(r => html += `<li>${r}</li>`);
                html += '</ol></div>';
            }
            return html;
        }

        // ============================================================
        //  MORE CONTENT (Standings, Scorers, Assists, News, Bracket)
        // ============================================================
        function loadMoreContent() {
            if (!currentChampionship) return;
            loadStandings();
            loadScorers(1);
            loadAssists(1);
            loadNews(1);
            loadBracket();
        }

        async function loadStandings() {
            const container = document.getElementById('moreStandingsContent');
            container.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Loading...';
            try {
                let url;
                if (currentChampionship.type === 1) url =
                    `${API_BASE}/matches/league_standing_stage/${currentChampionship.url_id}`;
                else url = `${API_BASE}/matches/cups_teams_standings/${currentChampionship.url_id}/L/60`;
                const data = await fetchFromProxy(url);
                if (data.data && data.data.league && data.data.league.stage0) {
                    const colors = data.data.color ? data.data.color.stage0 : [];
                    const rules = data.data.rules_list ? data.data.rules_list.stage0 : [];
                    container.innerHTML = renderStandingsTable(data.data.league.stage0, null, colors, rules);
                } else if (data.data && data.data.standings && data.data.standings.groups) {
                    container.innerHTML = renderGroupStandings(data.data.standings.groups);
                } else {
                    container.innerHTML = '<p>No standings data</p>';
                }
            } catch (err) { container.innerHTML = '<div class="alert alert-danger">Failed to load standings</div>'; }
        }

        function renderStandingsTable(teams, highlightId, colors, rules) {
            let html =
                '<div class="standings-wrap"><table class="standings-table"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>';
            teams.forEach((team, idx) => {
                const info = team.team_name;
                const isH = highlightId && info && info.row_id == highlightId;
                const cls = isH ? 'highlight-row' : '';
                const color = team.color || '';
                const bar = color ? `<span class="color-bar" style="background:${color};"></span>` : '';
                html += `<tr class="${cls}">
                    <td class="pos">${idx+1}</td>
                    <td style="text-align:left;">
                        <div class="team-cell">
                            ${bar}
                            <img src="${IMG_BASE_TEAM + info.image}" onclick="openTeamModal(${info.row_id})" />
                            <span class="team-name" onclick="openTeamModal(${info.row_id})">${info.title}</span>
                        </div>
                    </td>
                    <td>${team.play}</td><td>${team.wins}</td><td>${team.draw}</td><td>${team.lose}</td>
                    <td>${team.for}</td><td>${team.against}</td><td>${team.diff}</td><td class="pts">${team.points}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            if (colors && colors.length) {
                html += '<div class="standings-key">';
                colors.forEach(c => {
                    if (c.color) {
                        const label = c.league_to || c.group_name || 'Qualification';
                        html +=
                            `<div class="key-item"><span class="color-box" style="background:${c.color};"></span> ${label}</div>`;
                    }
                });
                html += '</div>';
            }
            if (rules && rules.length) {
                html += '<div class="standings-rules"><strong>Rules</strong><ol>';
                rules.forEach(r => html += `<li>${r}</li>`);
                html += '</ol></div>';
            }
            return html;
        }

        function renderGroupStandings(groups) {
            let html = '';
            for (const name in groups) {
                html += `<h5 class="mt-2" style="font-size:calc(13px*var(--font-scale));">Group ${name}</h5>`;
                html += renderStandingsTable(groups[name]);
            }
            return html;
        }

        function setupInfiniteScroll(sentinelId, loadMore) {
            const sentinel = document.getElementById(sentinelId);
            if (!sentinel) return null;
            if (window.IntersectionObserver) {
                const obs = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) loadMore();
                }, { rootMargin: '200px' });
                obs.observe(sentinel);
                return obs;
            } else {
                window.addEventListener('scroll', () => {
                    const rect = sentinel.getBoundingClientRect();
                    if (rect.top < window.innerHeight) loadMore();
                });
                return null;
            }
        }

        async function loadScorers(page) {
            if (!currentChampionship || scorersLoading) return;
            scorersLoading = true;
            const container = document.getElementById('moreScorersContent');
            try {
                const url = `${API_BASE}/matches/league_scorers_map/${currentChampionship.url_id}?page=${page}`;
                const data = await fetchFromProxy(url);
                const items = data.data.data || [];
                if (page === 1) container.innerHTML = renderPlayersList(items, 'goals');
                else {
                    const existing = container.querySelector('ul');
                    if (existing) existing.insertAdjacentHTML('beforeend', renderPlayersList(items, 'goals').replace(
                        '<ul class="list-group">', '').replace('</ul>', ''));
                    else container.innerHTML = renderPlayersList(items, 'goals');
                }
                scorersNextUrl = data.data.next_page_url || null;
                if (!scorersObserver) {
                    scorersObserver = setupInfiniteScroll('moreScorersSentinel', () => {
                        if (scorersNextUrl && !scorersLoading) {
                            const next = new URL(scorersNextUrl).searchParams.get('page');
                            loadScorers(parseInt(next));
                        }
                    });
                }
            } catch (err) { console.error(err); if (page === 1) container.innerHTML =
                    '<div class="alert alert-danger">Failed to load top scorers</div>'; } finally { scorersLoading =
                    false; }
        }

        function renderPlayersList(players, type) {

            players.forEach(p => {
                const info = p.player_info;

        async function loadNews(page) {
            if (!currentChampionship || newsLoading) return;
            newsLoading = true;
            const container = document.getElementById('moreNewsContent');
            try {
                const url = `${NEWS_BASE}/News/news_league/${currentChampionship.url_id}?page=${page}`;

                if (page === 1) container.innerHTML = renderNewsList(items);
                else container.insertAdjacentHTML('beforeend', renderNewsList(items));
                newsNextUrl = data.data.next_page_url || null;
                if (!newsObserver) {
                    newsObserver = setupInfiniteScroll('moreNewsSentinel', () => {
                        if (newsNextUrl && !newsLoading) {
                            const next = new URL(newsNextUrl).searchParams.get('page');

        async function loadBracket() {
            const container = document.getElementById('moreBracketContent');
            if (!currentChampionship) { container.innerHTML = '<p>No championship selected</p>'; return; }
            try {
                const url = `${API_BASE}/matches/cups_teams_standings/${currentChampionship.url_id}/L/60`;
                const data = await fetchFromProxy(url);
                if (data.data && (data.data.map || data.data.lot)) container.innerHTML = renderBracket(data.data.map,
                    data.data.lot);
                else container.innerHTML = '<p>No bracket data</p>';

        function renderBracket(map, lot) {
            let html = '';
            if (lot && lot.length) {
                html += '<h5 class="mt-2" style="font-size:calc(13px*var(--font-scale));">Playoffs</h5>';
                lot.forEach(m => {
                    const winner = m.winTeam ? (m.teamA.row_id == m.winTeam ? m.teamA.title : m.teamB.title) :
                        'Unknown';
                    html +=
                        `<div style="padding:4px 0;border-bottom:1px solid var(--border-color);font-size:calc(12px*var(--font-scale));"><span onclick="openTeamModal(${m.teamA.row_id})" style="cursor:pointer;">${m.teamA.title}</span> vs <span onclick="openTeamModal(${m.teamB.row_id})" style="cursor:pointer;">${m.teamB.title}</span> (Winner: ${winner})</div>`;
                });
            }
            if (map && map.length) {
                html += '<h5 class="mt-3" style="font-size:calc(13px*var(--font-scale));">Knockout Bracket</h5>';
                map.forEach(m => {
                    html +=
                        `<div style="padding:4px 0;border-bottom:1px solid var(--border-color);font-size:calc(12px*var(--font-scale));"><span onclick="openTeamModal(${m.teamA.row_id})" style="cursor:pointer;">${m.teamA.title}</span> (${m.teamA_score}) - (${m.teamB_score}) <span onclick="openTeamModal(${m.teamB.row_id})" style="cursor:pointer;">${m.teamB.title}</span><br /><small style="font-size:calc(10px*var(--font-scale));color:var(--secondary);">${m.round_name}</small></div>`;
                });
            }
            return html;
        }

        //  MODALS: TEAM, PLAYER, COACH, REFEREE, NEWS

        async function openTeamModal(teamId) {
            showLoading();
            try {
                const [info, players, transfers, page, matches, news] = await Promise.all([
                    fetchFromProxy(`${API_BASE}/info/team_info/${teamId}/L/60`),
                    fetchFromProxy(`${API_BASE}/info/players_team/${teamId}`),
                    fetchFromProxy(`${API_BASE}/info/transfer_info_team/${teamId}?page=1`),
                    fetchFromProxy(`${API_BASE}/info/team_page/${teamId}`),
                    fetchFromProxy(`${API_BASE}/matches/team_matches/${teamId}/L/60`),
                    fetchFromProxy(`${NEWS_BASE}/News/news_team/${teamId}?page=1`).catch(() => ({ data: { data: [] } }))
                ]);
                const data = { teamInfo: info.data, players: players.data, transfers: transfers.data, teamPage: page.data,
                    teamMatches: matches.data, teamNews: news.data };
                renderTeamModalTabs(data);
                document.getElementById('teamModalTitle').textContent = info.data.title;
                new bootstrap.Modal(document.getElementById('teamModal')).show();
            } catch (err) { console.error(err);
                showError('Failed to load team info'); } finally { hideLoading(); }
        }

            let html = `<ul class="nav nav-tabs" id="teamModalTabs" role="tablist" style="font-size:calc(11px*var(--font-scale));gap:3px;flex-wrap:nowrap;overflow-x:auto;border-bottom:2px solid var(--border-color);">

                <li class="nav-item"><button class="nav-link" id="news-tab-team" data-bs-toggle="tab" data-bs-target="#news-team" type="button" role="tab" style="padding:4px 12px;">News</button></li>
                <li class="nav-item"><button class="nav-link" id="standings-tab-team" data-bs-toggle="tab" data-bs-target="#standings-team" type="button" role="tab" style="padding:4px 12px;">Standings</button></li>
                <li class="nav-item"><button class="nav-link" id="players-tab-team" data-bs-toggle="tab" data-bs-target="#players-team" type="button" role="tab" style="padding:4px 12px;">Players</button></li>

            </ul><div class="tab-content mt-2" id="teamModalTabsContent">

                <div class="tab-pane fade" id="standings-team"><div id="teamStandingsContent">Loading standings...</div></div>

                });

        function renderTeamOverview(info, page, players) {
            let html =
                `<div class="d-flex align-items-center mb-2"><img src="${IMG_BASE_TEAM + info.image}" style="width:44px;height:44px;object-fit:contain;margin-right:10px;" /><h4 style="font-size:calc(1.1rem*var(--font-scale));margin:0;">${info.title}</h4></div><p style="font-size:calc(12px*var(--font-scale));">${info.about || ''}</p><p style="font-size:calc(12px*var(--font-scale));"><strong>Country:</strong> ${info.country ? info.country.title : ''}</p><p style="font-size:calc(12px*var(--font-scale));"><strong>Stadium:</strong> ${info.stadium_name || ''}</p><hr /><h6 style="font-size:calc(13px*var(--font-scale));">👨‍🏫 Coach</h6>`;
            if (players.coach) html +=
                `<div class="d-flex align-items-center"><img src="${IMG_BASE_COACH + players.coach.image}" style="width:34px;height:34px;border-radius:50%;cursor:pointer;margin-right:8px;" onclick="openCoachModal(${players.coach.id})" /><span onclick="openCoachModal(${players.coach.id})" style="cursor:pointer;font-size:calc(13px*var(--font-scale));">${players.coach.title}</span></div>`;
            else html += '<p style="font-size:calc(12px*var(--font-scale));">Not available</p>';
            html += `<hr /><h6 style="font-size:calc(13px*var(--font-scale));">🏆 Honours</h6>`;

            else html += '<p style="font-size:calc(12px*var(--font-scale));">No honours</p>';
            return html;
        }

        function renderTeamMatches(matches) {
            if (!matches) return '<p style="font-size:calc(12px*var(--font-scale));">No matches data</p>';
            let html = '<h6 style="font-size:calc(13px*var(--font-scale));">📋 Upcoming Matches</h6>';
            html += matches.coming && matches.coming.data.length ? renderMatchesList(matches.coming.data) :
                '<p style="font-size:calc(12px*var(--font-scale));">No upcoming matches</p>';
            html += '<h6 style="font-size:calc(13px*var(--font-scale));" class="mt-2">📋 Finished Matches</h6>';
            html += matches.end && matches.end.data.length ? renderMatchesList(matches.end.data) :
                '<p style="font-size:calc(12px*var(--font-scale));">No finished matches</p>';
            return html;
        }

                const home = m.home_team,

                const dt = m.match_timestamp ? formatMatchLocalDateTime(m.match_timestamp) : (m.match_date + ' ' + m
                    .match_time);

                const compImg = m.championship?.image ?
                    `<img src="${IMG_BASE_CHAMP + m.championship.image}" style="width:14px;height:14px;vertical-align:middle;" />` :
                    '';

                html += `<div class="col-12 col-md-6">

                        <div class="d-flex justify-content-between align-items-center">

                                <div class="small" onclick="event.stopPropagation();openTeamModal(${home.row_id})" style="cursor:pointer;font-size:calc(10px*var(--font-scale));">${home.title}</div>
                            </div>
                            <div class="text-center" style="padding:0 6px;">

                                <div class="small" onclick="event.stopPropagation();openTeamModal(${away.row_id})" style="cursor:pointer;font-size:calc(10px*var(--font-scale));">${away.title}</div>

        function renderTeamNews(news) {
            if (!news || !news.data || !news.data.length) return '<p style="font-size:calc(12px*var(--font-scale));">No news</p>';
            return renderNewsList(news.data);
        }

        function renderTeamPlayers(players) {
            let html = '<div class="row" style="font-size:calc(12px*var(--font-scale));">';
            for (const pos in players) {
                if (pos === 'coach') continue;
                const list = players[pos];
                if (Array.isArray(list) && list.length) {
                    const label = getPositionFullName(pos);
                    html += `<div class="col-6 col-md-4"><strong style="font-size:calc(12px*var(--font-scale));">${label}</strong><ul class="list-unstyled" style="font-size:calc(11px*var(--font-scale));">`;

                            `<li class="d-flex align-items-center mb-1"><img src="${IMG_BASE_PLAYER + p.image}" style="width:22px;height:22px;object-fit:cover;border-radius:50%;margin-right:6px;cursor:pointer;" onclick="openPlayerModal(${p.row_id})" /><span onclick="openPlayerModal(${p.row_id})" style="cursor:pointer;">${p.title}</span><span class="text-muted ms-1" style="font-size:calc(9px*var(--font-scale));">(${getPositionFullName(p.position)})</span></li>`;

                }

            return html;

        function renderTeamTransfers(transfers) {
            if (!transfers) return '<p style="font-size:calc(12px*var(--font-scale));">No transfers</p>';
            const important = transfers.important || [];
            const all = transfers.all || [];
            const merged = [...important, ...all.filter(t => !important.some(i => i.player_name?.row_id === t
                .player_name?.row_id))];
            if (!merged.length) return '<p style="font-size:calc(12px*var(--font-scale));">No transfers</p>';
            let html = '<div class="row g-2" style="font-size:calc(12px*var(--font-scale));">';

                    `<img src="${IMG_BASE_PLAYER + t.player_name.image}" style="width:24px;height:24px;object-fit:cover;border-radius:50%;cursor:pointer;margin-right:6px;" onclick="openPlayerModal(${t.player_name.row_id})" />` :
                    '';

                    'Other';
                html += `<div class="col-12 col-md-6">
                    <div class="card p-2" style="border-radius:var(--border-radius);border:1px solid var(--border-color);">

                            <div><strong>To:</strong> <span onclick="openTeamModal(${t.team_in.row_id})" style="cursor:pointer;">${t.team_in?.title}</span></div>
                            <div><strong>Value:</strong> ${t.value || 'Undisclosed'}</div>
                            <div><strong>Type:</strong> ${typeLabel}</div>
                            <div><strong>Date:</strong> ${t.date_from} to ${t.date_to || 'Now'}</div>
                        </div>
                    </div>
                </div>`;
            });
            html += '</div>';
            return html;
        }

        async function loadTeamStandings(teamId) {
            const container = document.getElementById('teamStandingsContent');
            if (!container || container.dataset.loaded) return;
            container.dataset.loaded = 'true';
            container.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Loading...';
            try {
                const info = await fetchFromProxy(`${API_BASE}/info/team_info/${teamId}/L/60`);
                const champs = info.data.championships || [];
                let html = '';
                for (const c of champs) {
                    html += `<h6 style="font-size:calc(13px*var(--font-scale));margin-top:10px;">${c.title}</h6>`;
                    try {
                        let url;
                        if (c.type === 1) url = `${API_BASE}/matches/league_standing_stage/${c.url_id}`;
                        else url = `${API_BASE}/matches/cups_teams_standings/${c.url_id}/L/60`;
                        const data = await fetchFromProxy(url);
                        let teams = null;
                        if (data.data && data.data.league && data.data.league.stage0) teams = data.data.league
                        .stage0;
                        else if (data.data && data.data.standings && data.data.standings.groups) {
                            teams = [];
                            for (const g in data.data.standings.groups) teams = teams.concat(data.data.standings
                                .groups[g]);
                        }
                        if (teams && teams.length) {
                            const colors = data.data.color ? data.data.color.stage0 : [];
                            const rules = data.data.rules_list ? data.data.rules_list.stage0 : [];
                            html += renderStandingsTable(teams, teamId, colors, rules);
                        } else html += '<p style="font-size:calc(12px*var(--font-scale));">No standings data</p>';
                    } catch (e) { html += '<p style="font-size:calc(12px*var(--font-scale));">Failed to load standings</p>'; }
                }
                container.innerHTML = html || '<p style="font-size:calc(12px*var(--font-scale));">No championships</p>';
            } catch (e) { container.innerHTML = '<p style="font-size:calc(12px*var(--font-scale));">Failed to load standings</p>'; }
        }

        function renderTeamCups(cups) {
            let html = '<ul style="font-size:calc(12px*var(--font-scale));">';
            cups.forEach(c => {
                html +=
                    `<li><img src="${IMG_BASE_CHAMP + c.champ.image}" style="width:18px;height:18px;vertical-align:middle;" /> ${c.champ.title} (${c.numbers})</li>`;

            return html;
        }

            statsHtml +=

        // ============================================================
        //  SCROLL PROGRESS
        // ============================================================
        function initScrollProgress() {
            const el = document.getElementById('scrollProgress');
            const circle = document.getElementById('progressCircle');
            const arrow = document.getElementById('scrollArrow');
            const circ = 2 * Math.PI * 20;

            function update() {
                const top = window.pageYOffset || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - window.innerHeight;
                const progress = height > 0 ? Math.min(1, top / height) : 0;
                circle.style.strokeDashoffset = circ * (1 - progress);
                const atTop = top < 50,
                    atBottom = top > height - 50;
                if (atTop) { arrow.textContent = '↓';
                    arrow.className = 'arrow-icon down'; } else if (atBottom) { arrow.textContent = '↑';
                    arrow.className = 'arrow-icon up'; } else { arrow.textContent = '↓';
                    arrow.className = 'arrow-icon'; }
            }

            el.addEventListener('click', () => {
                const top = window.pageYOffset || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - window.innerHeight;
                if (top < 50) window.scrollTo({ top: height, behavior: 'smooth' });
                else window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) { window.requestAnimationFrame(() => { update();
                        ticking = false; });
                    ticking = true; }
            });
            update();
        }

        // ============================================================
        //  FILTER BAR & FAVORITES
        // ============================================================
        document.querySelectorAll('.filter-bar .filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-bar .filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderLiveAndToday();
            });
        });

        document.getElementById('favoriteToggleHeader').addEventListener('click', function() {
            this.classList.toggle('active');
            const btns = document.querySelectorAll('.filter-bar .filter-btn');
            if (this.classList.contains('active')) {
                btns.forEach(b => b.classList.remove('active'));
                document.querySelector('.filter-bar .filter-btn[data-filter="favorites"]')?.classList.add('active');
                currentFilter = 'favorites';
            } else {
                btns.forEach(b => b.classList.remove('active'));
                document.querySelector('.filter-bar .filter-btn[data-filter="all"]')?.classList.add('active');
                currentFilter = 'all';
            }
            renderLiveAndToday();
        });

        // ============================================================
        //  BOTTOM NAVIGATION
        // ============================================================
        const pages = {
            live: document.getElementById('pageLive'),
            matches: document.getElementById('pageMatches'),
            videos: document.getElementById('pageVideos'),
            transfers: document.getElementById('pageTransfers'),
            more: document.getElementById('pageMore')
        };

        document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const page = this.dataset.page;
                document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                Object.values(pages).forEach(el => el.style.display = 'none');
                if (pages[page]) {
                    pages[page].style.display = 'block';
                    if (page === 'videos') loadHighlights();
                    else if (page === 'transfers') loadTransfersPage();
                    else if (page === 'more') { /* already loaded */ } else if (page === 'matches')
                        renderAllMatches();
                    else if (page === 'live') renderLiveAndToday();
                }
                currentPage = page;
            });
        });

        // ============================================================
        //  INIT
        // ============================================================
        (async function init() {
            loadTheme();
            initLanguage();
            updateDateUI();
            await loadChampionships();
            await loadStreamEvents();
            await loadLiveAndTodayMatches();
            await loadHighlights();
            await loadTransfersPage();

            liveUpdateInterval = setInterval(() => loadLiveMatches(), 1000);
            todayUpdateInterval = setInterval(() => {
                loadTodayMatches();
                loadHighlights();
            }, 60000);

            initScrollProgress();

            // Show live by default
            document.querySelector('.bottom-nav .nav-item[data-page="live"]')?.click();

            // Globals
            window.toggleFavorite = toggleFavorite;
            window.openTeamModal = openTeamModal;
            window.openPlayerModal = openPlayerModal;
            window.openCoachModal = openCoachModal;
            window.openRefereeModal = openRefereeModal;

            window.openMatchDetails = openMatchDetails;
            window.quickSelectChampionship = quickSelectChampionship;
            window.openStreamPlayer = openStreamPlayer;
            window.openHighlightPlayer = openHighlightPlayer;
            window.toggleTheme = toggleTheme;
            window.changeCalMonth = changeCalMonth;
            window.selectCalDate = selectCalDate;
            window.applyCalendarFilter = applyCalendarFilter;
            window.renderMatchesList = renderMatchesList;
        })();
    </script>
